<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3年算数 小数のせかい</title>
  <style>
    /* ==================== 基本リセット＆1画面固定 ==================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background-color: #FFFDF7;
      color: #1E293B;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    ruby {
      ruby-align: center;
    }
    rt {
      font-size: 0.52em;
      font-weight: 700;
      color: #475569;
      letter-spacing: 0.01em;
    }

    .hidden {
      display: none !important;
    }

    /* ==================== 立体ボタン共通スタイル ==================== */
    .btn {
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
    }
    .btn:hover:not(:disabled) {
      filter: brightness(1.04);
    }
    .btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25) !important;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-sky {
      background-color: #0EA5E9;
      color: #FFFFFF;
      box-shadow: 0 4px 0 #0369A1;
    }
    .btn-sky rt, .btn-emerald rt, .btn-amber rt, .btn-orange rt {
      color: #F8FAFC;
    }
    .btn-emerald {
      background-color: #10B981;
      color: #FFFFFF;
      box-shadow: 0 4px 0 #047857;
    }
    .btn-amber {
      background-color: #F59E0B;
      color: #FFFFFF;
      box-shadow: 0 4px 0 #B45309;
    }
    .btn-orange {
      background-color: #F97316;
      color: #FFFFFF;
      box-shadow: 0 4px 0 #C2410C;
    }
    .btn-slate {
      background-color: #E2E8F0;
      color: #1E293B;
      box-shadow: 0 3px 0 #94A3B8;
    }

    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }
    .animate-pulse-soft {
      animation: pulse-soft 1.7s infinite ease-in-out;
    }

    @keyframes pop-in {
      0% { transform: scale(0.94) translateY(5px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-pop {
      animation: pop-in 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* ==================== 上部ヘッダー（高さ 46px固定） ==================== */
    header {
      height: 46px;
      flex-shrink: 0;
      background-color: #FFFFFF;
      border-bottom: 2px solid #BAE6FD;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .header-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .grade-badge {
      background-color: #0EA5E9;
      color: #FFFFFF;
      font-weight: 900;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 8px;
    }
    .grade-badge rt {
      color: #E0F2FE;
    }

    .app-title {
      font-size: 16px;
      font-weight: 900;
      margin: 0;
      color: #0F172A;
    }

    .step-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
    }

    .nav-btn {
      padding: 4px 8px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 900;
      border: 2px solid #E2E8F0;
      background-color: #F8FAFC;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
    }
    .nav-btn:hover {
      background-color: #E0F2FE;
    }
    .nav-btn.active {
      border-color: #0284C7;
      background-color: #0EA5E9;
      color: #FFFFFF;
    }
    .nav-btn.active rt {
      color: #E0F2FE;
    }

    .sound-btn {
      flex-shrink: 0;
      padding: 4px 10px;
      border-radius: 8px;
      border: 2px solid #FCD34D;
      background-color: #FEF3C7;
      color: #78350F;
      font-family: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ==================== メイン領域（高さ calc(100vh - 46px)） ==================== */
    main {
      height: calc(100vh - 46px);
      width: 100%;
      padding: 10px 14px;
      display: flex;
      gap: 12px;
      overflow: hidden;
    }

    /* 左ペイン（幅 58%） */
    .pane-left {
      width: 58%;
      height: 100%;
      min-height: 0;
      background-color: #FFFFFF;
      border: 3px solid #BAE6FD;
      border-radius: 18px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 右ペイン（幅 42%） */
    .pane-right {
      width: 42%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      overflow: hidden;
    }

    /* 1. めあてボックス */
    .goal-box {
      flex-shrink: 0;
      background-color: #F0F9FF;
      border: 2px solid #7DD3FC;
      border-radius: 14px;
      padding: 7px 12px;
    }
    .goal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .step-pill {
      background-color: #0EA5E9;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 900;
      padding: 2px 9px;
      border-radius: 7px;
    }
    .step-pill rt {
      color: #E0F2FE;
    }
    .goal-tag {
      font-size: 11px;
      font-weight: 900;
      color: #0369A1;
    }
    .goal-text {
      margin: 0;
      font-size: clamp(13px, 1.3vw, 15px);
      font-weight: 900;
      color: #0F172A;
      line-height: 1.38;
    }

    /* 2. わかりやすい説明・まとめボックス */
    .explain-box {
      flex: 1;
      min-height: 0;
      background-color: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-radius: 14px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      overflow: hidden;
    }

    /* 3. ステップ専用操作ボタンエリア */
    .action-box {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 4. 下部ナビゲーション */
    .nav-box {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .nav-box .btn {
      padding: 8px 10px;
      font-size: 14px;
    }

    /* ==================== 共通UIパーツ ==================== */
    .action-btn-lg {
      width: 100%;
      padding: 9px 12px;
      font-size: clamp(13px, 1.35vw, 16px);
    }

    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .notice-box {
      border-radius: 10px;
      padding: 7px 10px;
      font-size: clamp(12px, 1.25vw, 14px);
      font-weight: 900;
      line-height: 1.42;
    }
    .notice-gray {
      background-color: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      color: #64748B;
      text-align: center;
    }
    .notice-amber {
      background-color: #FFFBEB;
      border: 2px solid #F59E0B;
      color: #78350F;
    }
    .notice-sky {
      background-color: #F0F9FF;
      border: 2px solid #0EA5E9;
      color: #0C4A6E;
    }

    /* ステップ① ストップウォッチ */
    .watch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      border-radius: 10px;
      border: 2px solid;
    }
    .watch-red { background-color: #FEF2F2; border-color: #FCA5A5; color: #7F1D1D; }
    .watch-green { background-color: #ECFDF5; border-color: #6EE7B7; color: #064E3B; }
    .watch-blue { background-color: #EFF6FF; border-color: #93C5FD; color: #1E3A8A; }

    .digital-box {
      background-color: #0F172A;
      color: #FDE047;
      font-weight: 900;
      font-size: clamp(17px, 1.85vw, 23px);
      padding: 2px 10px;
      border-radius: 8px;
      min-width: 112px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .digital-box small {
      font-size: 11px;
      color: #FFFFFF;
      margin-left: 2px;
    }

    /* 位取りバッジ＆大きな数字表示 */
    .exp-display-box {
      background-color: #FFFBEB;
      border: 2px solid #FCD34D;
      border-radius: 12px;
      padding: 6px 8px;
      text-align: center;
    }
    .place-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 3px;
      flex-wrap: wrap;
    }
    .place-badge-ones {
      background-color: #E0F2FE;
      color: #075985;
      border: 1.5px solid #7DD3FC;
      padding: 1px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
    }
    .place-badge-tenths {
      background-color: #FFEDD5;
      color: #9A3412;
      border: 1.5px solid #FDBA74;
      padding: 1px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
    }
    .big-num-pill {
      display: inline-block;
      background-color: #FFFFFF;
      border: 2px solid #FDE68A;
      border-radius: 12px;
      padding: 2px 16px;
      font-size: clamp(28px, 3.1vw, 40px);
      font-weight: 900;
      line-height: 1.1;
    }
    .comp-pill {
      border-radius: 10px;
      padding: 5px 8px;
      text-align: center;
      font-size: clamp(12px, 1.25vw, 14px);
      font-weight: 900;
    }
    .comp-sky {
      background-color: #F0F9FF;
      border: 1.5px solid #BAE6FD;
      color: #0F172A;
    }
    .comp-orange {
      background-color: #FFF7ED;
      border: 1.5px solid #FED7AA;
      color: #0F172A;
    }

    /* ステップ⑦ モード切替ボタン */
    .mode-select-btn {
      width: 100%;
      padding: 6px 10px;
      border-radius: 9px;
      border: 2px solid #CBD5E1;
      background-color: #F8FAFC;
      color: #1E293B;
      font-family: inherit;
      font-size: clamp(11px, 1.2vw, 13px);
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
    }
    .mode-select-btn:hover {
      background-color: #E0F2FE;
    }
    .mode-select-btn.active {
      border-color: #0284C7;
      background-color: #0EA5E9;
      color: #FFFFFF;
      box-shadow: 0 3px 0 #0369A1;
    }
    .mode-select-btn.active rt {
      color: #E0F2FE;
    }

    /* ステップ⑧ れんしゅう問題タブ・テンキー・スロット */
    .q-tabs-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .q-tab {
      padding: 3px 7px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      border: 1.5px solid #CBD5E1;
      background-color: #F8FAFC;
      color: #334155;
      cursor: pointer;
    }
    .q-tab.active {
      border-color: #D97706;
      background-color: #F59E0B;
      color: #FFFFFF;
    }
    .q-tab.active rt {
      color: #FEF3C7;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .key-btn {
      padding: 5px 4px;
      border-radius: 8px;
      border: 1.5px solid #CBD5E1;
      background-color: #F1F5F9;
      color: #0F172A;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 0 #CBD5E1;
    }
    .key-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .key-btn-del {
      background-color: #FFE4E6;
      border-color: #FDA4AF;
      color: #9F1239;
      font-size: 12px;
      box-shadow: 0 2px 0 #FDA4AF;
    }

    .input-slot {
      min-width: 68px;
      padding: 2px 8px;
      border-radius: 8px;
      border: 2.5px solid #38BDF8;
      background-color: #F8FAFC;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      color: #94A3B8;
      cursor: pointer;
      text-align: center;
    }
    .input-slot.filled {
      color: #0369A1;
    }
    .input-slot.focused {
      background-color: #FEF3C7;
      border-color: #F59E0B;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.35);
    }

    .num-card-btn {
      padding: 6px 8px;
      border-radius: 10px;
      border: 2.5px solid #CBD5E1;
      background-color: #FFFFFF;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      color: #0F172A;
      cursor: pointer;
      box-shadow: 0 3px 0 #CBD5E1;
    }
    .num-card-btn.selected {
      border-color: #F59E0B;
      background-color: #FEF3C7;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.4);
    }

    .feedback-bar {
      border-radius: 9px;
      padding: 5px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.35;
    }
    .fb-ok {
      background-color: #D1FAE5;
      border: 2px solid #10B981;
      color: #064E3B;
    }
    .fb-ng {
      background-color: #FFE4E6;
      border: 2px solid #FB7185;
      color: #881337;
    }

    /* 教科書後半（⑨〜⑯）共通。元の①〜⑧のデザインを継承。 */
    .step-nav { flex:1; min-width:0; scrollbar-width:thin; }
    .nav-btn { flex-shrink:0; }
    .ext-modes { display:flex;gap:5px;flex-wrap:wrap; }
    .ext-mode {flex:1;min-width:70px;border:2px solid #CBD5E1;border-radius:9px;background:#F8FAFC;
      padding:7px 4px;font-family:inherit;font-size:12px;font-weight:900;cursor:pointer;color:#334155;}
    .ext-mode.on {background:#0EA5E9;color:#fff;border-color:#0284C7;}
    .ext-panel {padding:9px 10px;border:1.5px solid #BAE6FD;border-radius:10px;
      background:#F0F9FF;font-size:clamp(13px,1.3vw,16px);font-weight:800;line-height:1.55;}
    .ext-big {background:#FFFBEB;border:2px solid #FCD34D;border-radius:12px;
      padding:9px 5px;text-align:center;font-size:clamp(20px,2.6vw,31px);font-weight:900;}
    .ext-big span {color:#EA580C;}
    .ext-meter {height:11px;border-radius:99px;background:#E2E8F0;overflow:hidden;flex-shrink:0;}
    .ext-meter>div {height:100%;background:#10B981;transition:width .2s;}
    .ext-choice {flex:1;border:2px solid #7DD3FC;color:#0369A1;background:#F0F9FF;font-size:27px;
      font-weight:900;border-radius:9px;min-height:53px;cursor:pointer;}
    .ext-choice.selected {border-color:#F59E0B;background:#FEF3C7;}
    .ext-question {padding:9px;border:2px solid #FDBA74;background:#FFFBEB;border-radius:10px;
      font-size:clamp(16px,1.55vw,20px);font-weight:900;text-align:center;}
    .ext-options {display:grid;grid-template-columns:1fr 1fr;gap:7px;}
    .ext-option {font-family:inherit;font-size:clamp(15px,1.45vw,19px);font-weight:900;min-height:55px;
      border:2px solid #CBD5E1;background:#fff;border-radius:10px;cursor:pointer;color:#0F172A;
      display:flex;gap:8px;align-items:center;justify-content:center;padding:7px;}
    .ext-option-symbol {font-size:12px;color:#64748B;}
    .ext-option.correct {background:#D1FAE5;border-color:#10B981;}
    .ext-option.wrong {background:#FFE4E6;border-color:#FB7185;}
    .ext-option:disabled {cursor:default;opacity:1;}
    @media (max-width:840px) and (orientation:portrait) {
      html,body {height:auto;min-height:100%;overflow:auto;}
      header {position:sticky;top:0;z-index:5;}
      .app-title {font-size:13px;}
      .sound-btn {padding:4px 6px;}
      main {height:auto;overflow:visible;flex-direction:column;gap:9px;padding:8px;}
      .pane-left,.pane-right {width:100%;}
      .pane-left {height:auto;min-height:240px;aspect-ratio:640/430;}
      .pane-right {min-height:350px;overflow:visible;gap:7px;}
      .explain-box {overflow:visible;}
    }
  </style>
</head>
<body>

  <!-- ==================== 上部ヘッダー（高さ 46px） ==================== -->
  <header>
    <div class="header-title-wrap">
      <span class="grade-badge">3<ruby>年算数<rt>ねんさんすう</rt></ruby></span>
      <h1 class="app-title"><ruby>小数<rt>しょうすう</rt></ruby>のせかい</h1>
    </div>

    <nav class="step-nav" aria-label="ステップ切り替え">
      <button type="button" class="nav-btn active" data-action="goto-step" data-val="1">① くるま</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="2">② <ruby>水筒<rt>すいとう</rt></ruby></button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="3">③ <ruby>等分<rt>とうぶん</rt></ruby></button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="4">④ 10<ruby>等分<rt>とうぶん</rt></ruby></button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="5">⑤ 0.3と1.3</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="6">⑥ △▽<ruby>水<rt>みず</rt></ruby></button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="7">⑦ ものさし</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="8">⑧ れんしゅう</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="9">⑨ 数直線</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="10">⑩ 位</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="11">⑪ 大きさ</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="12">⑫ たし算</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="13">⑬ ひき算</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="14">⑭ 筆算</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="15">⑮ 数の見方</button>
      <button type="button" class="nav-btn" data-action="goto-step" data-val="16">⑯ しあげ</button>
    </nav>

    <button type="button" class="sound-btn" data-action="toggle-sound">
      <span id="sound-icon">🔊</span>
      <span id="sound-text">おと ON</span>
    </button>
  </header>

  <!-- ==================== メイン領域（高さ calc(100vh - 46px)） ==================== -->
  <main>
    <!-- 左ペイン（幅 58%）：単一ステージSVG -->
    <div class="pane-left">
      <svg id="stage-svg" viewBox="0 0 640 430" style="width:100%; height:100%; max-height:100%; display:block;"></svg>
    </div>

    <!-- 右ペイン（幅 42%）：4段構成 -->
    <div class="pane-right">
      <!-- 1. めあてボックス -->
      <div class="goal-box" id="goal-box"></div>

      <!-- 2. わかりやすい説明・まとめボックス -->
      <div class="explain-box" id="explain-box"></div>

      <!-- 3. ステップ専用の操作ボタンエリア -->
      <div class="action-box" id="action-box"></div>

      <!-- 4. 下部ナビゲーション（もどる / つぎへ ボタン） -->
      <div class="nav-box">
        <button type="button" class="btn btn-slate" id="btn-prev" data-action="prev-step">◀ もどる</button>
        <button type="button" class="btn btn-sky" id="btn-next" data-action="next-step">つぎへ ▶</button>
      </div>
    </div>
  </main>

  <!-- ==================== バニラJavaScript（</body>直前配置） ==================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // =======================================================================
      // 1. アプリ状態管理 ＆ タイマー一括クリア
      // =======================================================================
      const state = {
        step: 1,
        sound: true,
        // ステップ1
        raceRunning: false,
        // ステップ2
        step2Pouring: false,
        step2Poured: false,
        step2Scaled: false,
        // ステップ3
        cakeMode: 'init',
        // ステップ4
        step4Divided: false,
        step4Filled: false,
        // ステップ5
        step5Mode: 'init',
        // ステップ6
        waterTenths: 1, // 1〜50 (0.1L〜5.0L)
        // ステップ7
        rulerMode: 1,
        rulerTenths: 15, // 1〜100 (0.1cm〜10.0cm)
        // ステップ8
        qTab: 1,
        activeSlot: null,
        q1: null,
        q2: null,
        q3: null,
        q4: null,
        q5: null,
        q6: null,
        q7: null
      };

      const activeIntervals = [];
      const activeTimeouts = [];
      const activeRafs = [];

      function registerInterval(fn, ms) {
        const id = setInterval(fn, ms);
        activeIntervals.push(id);
        return id;
      }

      function registerTimeout(fn, ms) {
        const id = setTimeout(fn, ms);
        activeTimeouts.push(id);
        return id;
      }

      function registerRaf(fn) {
        const id = requestAnimationFrame(fn);
        activeRafs.push(id);
        return id;
      }

      function clearAllTimers() {
        while (activeIntervals.length > 0) {
          clearInterval(activeIntervals.pop());
        }
        while (activeTimeouts.length > 0) {
          clearTimeout(activeTimeouts.pop());
        }
        while (activeRafs.length > 0) {
          cancelAnimationFrame(activeRafs.pop());
        }
        state.raceRunning = false;
        state.step2Pouring = false;
      }

      // =======================================================================
      // 2. Web Audio API 効果音エンジン（完全エラー保護）
      // =======================================================================
      let audioCtx = null;

      function getAudioCtx() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        } catch (e) {
          audioCtx = null;
        }
        return audioCtx;
      }

      function playTone(type, idx = 0) {
        if (!state.sound) return;
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'button') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.07);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'water') {
            const freqs = [261.6, 293.7, 329.6, 349.2, 392.0, 440.0, 493.9, 523.3, 587.3, 659.3];
            const f = freqs[Math.abs(idx) % freqs.length];
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now);
            osc.frequency.exponentialRampToValueAtTime(f * 1.12, now + 0.11);
            gain.gain.setValueAtTime(0.11, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
            osc.start(now);
            osc.stop(now + 0.14);
          } else if (type === 'sparkle') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(784, now);
            osc.frequency.setValueAtTime(1046.5, now + 0.07);
            osc.frequency.setValueAtTime(1318.5, now + 0.14);
            gain.gain.setValueAtTime(0.11, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.start(now);
            osc.stop(now + 0.3);
          } else if (type === 'goal') {
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
              const o = ctx.createOscillator();
              const g = ctx.createGain();
              o.connect(g);
              g.connect(ctx.destination);
              o.type = 'triangle';
              o.frequency.setValueAtTime(f, now + i * 0.08);
              g.gain.setValueAtTime(0.1, now + i * 0.08);
              g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.24);
              o.start(now + i * 0.08);
              o.stop(now + i * 0.08 + 0.25);
            });
          } else if (type === 'car') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(135, now);
            osc.frequency.linearRampToValueAtTime(220, now + 0.24);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
            osc.start(now);
            osc.stop(now + 0.28);
          } else if (type === 'wrong') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(240, now);
            osc.frequency.linearRampToValueAtTime(185, now + 0.18);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.22);
          }
        } catch (e) {
          // 音声が制限されていても操作を絶対に止めない
        }
      }

      // =======================================================================
      // 3. SVG描画ヘルパー（ふりがな付きテキスト対応）
      // =======================================================================
      const SVG_NS = 'http://www.w3.org/2000/svg';

      function svgEl(tag, attrs = {}, parent = null) {
        const el = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) {
          el.setAttribute(k, String(v));
        }
        if (parent) parent.appendChild(el);
        return el;
      }

      // SVG内に漢字のふりがなを上段テキストで重ならないように描画する
      function svgRubyText(parent, x, y, segments, opts = {}) {
        const fontSize = opts.fontSize || 18;
        const fill = opts.fill || '#0F172A';
        const rubyFill = opts.rubyFill || fill;
        const rubySize = Math.max(9, Math.round(fontSize * 0.52));

        let plain = '';
        segments.forEach(s => { plain += s.t; });

        const mainTxt = svgEl('text', {
          x,
          y,
          'font-size': fontSize,
          'font-weight': '900',
          fill,
          'text-anchor': 'middle'
        }, parent);
        mainTxt.textContent = plain;

        const charW = fontSize * 0.88;
        const startX = x - (plain.length * charW) / 2;
        let cursor = 0;

        segments.forEach(s => {
          if (s.r) {
            const cx = startX + (cursor + s.t.length / 2) * charW;
            const rTxt = svgEl('text', {
              x: cx,
              y: y - fontSize * 0.82,
              'font-size': rubySize,
              'font-weight': '900',
              fill: rubyFill,
              'text-anchor': 'middle'
            }, parent);
            rTxt.textContent = s.r;
          }
          cursor += s.t.length;
        });

        return mainTxt;
      }

      function clearStage() {
        const svg = document.getElementById('stage-svg');
        svg.innerHTML = '';
        return svg;
      }

      function numToKana(n) {
        return ['れい', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'][n] || '';
      }

      // =======================================================================
      // 4. ステップ切替制御
      // =======================================================================
      function goToStep(stepNum) {
        if (stepNum < 1 || stepNum > 16) return;
        clearAllTimers();
        playTone('button');
        state.step = stepNum;

        document.querySelectorAll('.nav-btn').forEach(btn => {
          const val = parseInt(btn.dataset.val, 10);
          if (val === stepNum) btn.classList.add('active');
          else btn.classList.remove('active');
        });
        const activeNav=document.querySelector('.nav-btn.active');
        if(activeNav && stepNum>8) activeNav.scrollIntoView({block:'nearest',inline:'nearest'});

        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        prevBtn.disabled = (stepNum === 1);

        if (stepNum === 16) {
          nextBtn.className = 'btn btn-emerald';
          nextBtn.dataset.action = 'celebrate';
          nextBtn.innerHTML = 'おしまい';
        } else {
          nextBtn.className = 'btn btn-sky';
          nextBtn.dataset.action = 'next-step';
          nextBtn.innerHTML = 'つぎへ ▶';
        }

        if (stepNum === 1) renderStep1();
        else if (stepNum === 2) renderStep2();
        else if (stepNum === 3) renderStep3();
        else if (stepNum === 4) renderStep4();
        else if (stepNum === 5) renderStep5();
        else if (stepNum === 6) renderStep6();
        else if (stepNum === 7) renderStep7();
        else if (stepNum === 8) renderStep8();
        else if (stepNum === 9) renderStep9();
        else if (stepNum === 10) renderStep10();
        else if (stepNum === 11) renderStep11();
        else if (stepNum === 12) renderUnitCalc('+');
        else if (stepNum === 13) renderUnitCalc('-');
        else if (stepNum === 14) renderStep14();
        else if (stepNum === 15) renderStep15();
        else if (stepNum === 16) renderStep16();
      }

      function startRace(mode) {
        if (state.raceRunning) return;
        clearAllTimers();
        state.raceRunning = true;
        playTone('car');

        const btnInt = document.getElementById('btn-race-int');
        const btnDec = document.getElementById('btn-race-dec');
        btnInt.disabled = true;
        btnDec.disabled = true;

        if (mode === 'integer') {
          btnInt.innerHTML = '<span>🏎️</span><span>はしっているよ…！</span>';
        } else {
          btnDec.innerHTML = '<span>⏱️</span><span>1/10の<ruby>位<rt>くらい</rt></ruby> あり で はしっているよ…！</span>';
        }

        document.getElementById('race-msg-init').classList.add('hidden');
        document.getElementById('race-msg-int').classList.add('hidden');
        document.getElementById('race-msg-dec').classList.add('hidden');
        document.getElementById('rank-red').classList.add('hidden');
        document.getElementById('rank-green').classList.add('hidden');
        document.getElementById('rank-blue').classList.add('hidden');

        const headerEl = document.getElementById('race-watch-header');
        headerEl.innerHTML = mode === 'integer'
          ? '⏱️ 1/10の<ruby>位<rt>くらい</rt></ruby>が ない ストップウォッチ（<ruby>整数<rt>せいすう</rt></ruby>だけ）'
          : '✨ <ruby>小数第<rt>しょうすうだい</rt></ruby>1<ruby>位<rt>い</rt></ruby>（1/10の<ruby>位<rt>くらい</rt></ruby>）あり！';

        const carRed = document.getElementById('car-red');
        const carGreen = document.getElementById('car-green');
        const carBlue = document.getElementById('car-blue');
        const timeRedEl = document.getElementById('time-red');
        const timeGreenEl = document.getElementById('time-green');
        const timeBlueEl = document.getElementById('time-blue');

        const startX = 36;
        const goalX = 468;
        const dist = goalX - startX;

        carRed.setAttribute('transform', `translate(${startX}, 66)`);
        carGreen.setAttribute('transform', `translate(${startX}, 188)`);
        carBlue.setAttribute('transform', `translate(${startX}, 310)`);

        const zeroHtml = mode === 'decimal' ? '0<span style="color:#FB923C;">.0</span>' : '0';
        timeRedEl.innerHTML = zeroHtml;
        timeGreenEl.innerHTML = zeroHtml;
        timeBlueEl.innerHTML = zeroHtml;

        const tRed = 3.1;
        const tGreen = 3.5;
        const tBlue = 3.9;
        let startTime = null;
        let redDone = false;
        let greenDone = false;
        let blueDone = false;
        let lastTick = -1;

        function fmt(sec) {
          if (mode === 'integer') return String(Math.floor(sec));
          const totalTenths = Math.floor(sec * 10 + 0.0001);
          return `${Math.floor(totalTenths / 10)}<span style="color:#FB923C;">.${totalTenths % 10}</span>`;
        }

        function tick(now) {
          if (!state.raceRunning) return;
          if (!startTime) startTime = now;
          const elapsed = (now - startTime) / 1000;

          if (mode === 'decimal') {
            const curTick = Math.floor(elapsed * 10);
            if (curTick > lastTick && curTick <= 39) {
              lastTick = curTick;
              if (curTick % 2 === 0) playTone('button');
            }
          }

          if (elapsed < tRed) {
            carRed.setAttribute('transform', `translate(${startX + dist * (elapsed / tRed)}, 66)`);
            timeRedEl.innerHTML = fmt(elapsed);
          } else if (!redDone) {
            redDone = true;
            carRed.setAttribute('transform', `translate(${goalX}, 66)`);
            timeRedEl.innerHTML = mode === 'decimal' ? '3<span style="color:#FB923C;">.1</span>' : '3';
            document.getElementById('rank-red').classList.remove('hidden');
            playTone('sparkle');
          }

          if (elapsed < tGreen) {
            carGreen.setAttribute('transform', `translate(${startX + dist * (elapsed / tGreen)}, 188)`);
            timeGreenEl.innerHTML = fmt(elapsed);
          } else if (!greenDone) {
            greenDone = true;
            carGreen.setAttribute('transform', `translate(${goalX}, 188)`);
            timeGreenEl.innerHTML = mode === 'decimal' ? '3<span style="color:#FB923C;">.5</span>' : '3';
            document.getElementById('rank-green').classList.remove('hidden');
            playTone('button');
          }

          if (elapsed < tBlue) {
            carBlue.setAttribute('transform', `translate(${startX + dist * (elapsed / tBlue)}, 310)`);
            timeBlueEl.innerHTML = fmt(elapsed);
          } else if (!blueDone) {
            blueDone = true;
            carBlue.setAttribute('transform', `translate(${goalX}, 310)`);
            timeBlueEl.innerHTML = mode === 'decimal' ? '3<span style="color:#FB923C;">.9</span>' : '3';
            document.getElementById('rank-blue').classList.remove('hidden');
          }

          if (redDone && greenDone && blueDone) {
            state.raceRunning = false;
            playTone('goal');
            btnInt.disabled = false;
            btnDec.disabled = false;
            btnDec.classList.remove('hidden');

            if (mode === 'integer') {
              btnInt.innerHTML = '<span>🔄</span><span>もういちど（1/10の<ruby>位<rt>くらい</rt></ruby> なし）</span>';
              btnDec.innerHTML = '<span>⏱️</span><span>1/10の<ruby>位<rt>くらい</rt></ruby> あり で スタート！</span>';
              document.getElementById('race-msg-int').classList.remove('hidden');
            } else {
              btnDec.classList.remove('animate-pulse-soft');
              btnDec.innerHTML = '<span>🔄</span><span>もういちど（1/10の<ruby>位<rt>くらい</rt></ruby> あり）</span>';
              btnInt.innerHTML = '<span>↩️</span><span>1/10の<ruby>位<rt>くらい</rt></ruby> なし に もどす</span>';
              document.getElementById('race-msg-dec').classList.remove('hidden');
            }
          } else {
            registerRaf(tick);
          }
        }

        registerRaf(tick);
      }

      // =======================================================================
      // 6. ステップ②：水筒の水
      // =======================================================================
      function renderStep2() {

        const svg = clearStage();

        if (state.step2Pouring || state.step2Poured) return;
        state.step2Pouring = true;
        playTone('water', 3);

        const btn = document.getElementById('btn-pour-bottles');
        btn.disabled = true;

        const bA = document.getElementById('bottle-a-water');
        const bB = document.getElementById('bottle-b-water');

        const tA2 = document.getElementById('tank-a2-water');
        const tB1 = document.getElementById('tank-b1-water');
        const tB2 = document.getElementById('tank-b2-water');

        let progress = 0;
        const iv = registerInterval(() => {
          progress += 0.05;
          if (progress > 1) progress = 1;

          const hA = 76 * (1 - progress);
          bA.setAttribute('y', 121 - hA);
          bA.setAttribute('height', hA);

          const hB = 109 * (1 - progress);
          bB.setAttribute('y', 133 - hB);
          bB.setAttribute('height', hB);

          const a1H = 120 * progress;
          tA1.setAttribute('y', 142 - a1H);
          tA1.setAttribute('height', a1H);

          const a2H = 12 * progress;
          tA2.setAttribute('y', 142 - a2H);
          tA2.setAttribute('height', a2H);

          const b1H = 120 * progress;
          tB1.setAttribute('y', 142 - b1H);
          tB1.setAttribute('height', b1H);

          const b2H = 108 * progress;
          tB2.setAttribute('y', 142 - b2H);
          tB2.setAttribute('height', b2H);

      function updateStep6View() {
        const svg = clearStage();
        svgEl('rect', { x: 10, y: 12, width: 620, height: 406, rx: 16, fill: '#F8FAFC' }, svg);

        const tankW = 98;
        const tankH = 260;
        const gap = 20;
        const startX = 35;
        const topY = 75;

        for (let t = 0; t < 5; t++) {
          const x = startX + t * (tankW + gap);
          const fillUnits = Math.max(0, Math.min(10, state.waterTenths - t * 10));
          const isFull = fillUnits === 10;

          if (fillUnits > 0) {
            const wh = (tankH / 10) * fillUnits;
            svgEl('rect', {
              x: x + 2,
              y: topY + tankH - wh,
              width: tankW - 4,
              height: wh,
              fill: isFull ? '#38BDF8' : '#7DD3FC'
            }, svg);
          }

          for (let m = 1; m < 10; m++) {
            const my = topY + tankH - (tankH / 10) * m;
            svgEl('line', {
              x1: x, y1: my, x2: x + tankW, y2: my,
              stroke: m === 5 ? '#0369A1' : '#475569',
              'stroke-opacity': m === 5 ? 0.8 : 0.45,
              'stroke-width': m === 5 ? 2 : 1.4,
              'stroke-dasharray': '4,3'
            }, svg);
          }

          svgEl('path', {
            d: `M${x + 30},${topY} L${x},${topY} L${x},${topY + tankHeightFix(tankH)} L${x + tankW},${topY + tankH} L${x + tankW},${topY} L${x + tankW - 30},${topY}`,
            fill: 'none',
            stroke: isFull ? '#0284C7' : '#1E293B',
            'stroke-width': 4,
            'stroke-linecap': 'round'
          }, svg);

          const topLbl = svgEl('text', { x: x + tankW / 2, y: topY + 7, 'font-size': 18, 'font-weight': '900', fill: isFull ? '#0284C7' : '#1E293B', 'text-anchor': 'middle' }, svg);
          topLbl.textContent = '1 L';

          svgEl('rect', {
            x: x + 8, y: topY + tankH + 12, width: tankW - 16, height: 32, rx: 8,
            fill: isFull ? '#0EA5E9' : (fillUnits > 0 ? '#FFF7ED' : '#F1F5F9'),
            stroke: isFull ? '#0369A1' : (fillUnits > 0 ? '#FB923C' : '#CBD5E1'),
            'stroke-width': 2
          }, svg);

          const subLbl = svgEl('text', {
            x: x + tankW / 2, y: topY + tankH + 33, 'font-size': 16, 'font-weight': '900',
            fill: isFull ? '#FFFFFF' : (fillUnits > 0 ? '#EA580C' : '#94A3B8'),
            'text-anchor': 'middle'
          }, svg);
          subLbl.textContent = isFull ? '1 L' : `0.${fillUnits} L`;

          // タップ用透明ヒットエリア（イベント委譲対応）
          for (let m = 1; m <= 10; m++) {
            const bandH = tankH / 10;
            svgEl('rect', {
              x, y: topY + tankH - bandH * m, width: tankW, height: bandH,
              fill: 'transparent',
              style: 'cursor:pointer;',
              'data-action': 'water-set',
              'data-val': String(t * 10 + m)
            }, svg);
          }
        }

        const ones = Math.floor(state.waterTenths / 10);
        const tenths = state.waterTenths % 10;

        document.getElementById('disp-ones').textContent = String(ones);
        document.getElementById('disp-tenths').textContent = '.' + tenths;
        document.getElementById('disp-reading').innerHTML = tenths === 0
          ? `${numToKana(ones)} リットル（${ones}.0 リットル）`
          : `${numToKana(ones)}<ruby>点<rt>てん</rt></ruby>${numToKana(tenths)} リットル`;

        document.getElementById('comp-ones').textContent = String(ones);
        document.getElementById('comp-tenths').textContent = String(tenths);
        document.getElementById('comp-total-tenths').textContent = String(state.waterTenths);

        document.getElementById('btn-dec-01').disabled = (state.waterTenths <= 1);
        document.getElementById('btn-inc-01').disabled = (state.waterTenths >= 50);
      }

      function setRulerMode(mode) {
        clearAllTimers();
        state.rulerMode = mode;

        [1, 2, 3].forEach(m => {
          const btn = document.getElementById(`rmode-${m}`);
          const pan = document.getElementById(`rpanel-${m}`);
          if (btn) {
            if (m === mode) btn.classList.add('active');
            else btn.classList.remove('active');
          }
          if (pan) {
            if (m === mode) pan.classList.remove('hidden');
            else pan.classList.add('hidden');
          }
        });

        const btnAnim1 = document.getElementById('btn-r-anim1');
        const mode3Ctrls = document.getElementById('r-mode3-ctrls');

        if (mode === 1) {
          btnAnim1.classList.remove('hidden');
          mode3Ctrls.classList.add('hidden');
          playRulerZoom10Anim();
        } else if (mode === 2) {
          btnAnim1.classList.add('hidden');
          mode3Ctrls.classList.add('hidden');
          playTone('sparkle');
          drawRulerMeasureSVG(87, true);
        } else {
          btnAnim1.classList.add('hidden');
          mode3Ctrls.classList.remove('hidden');
          updateRulerMode3Text();
          drawRulerMeasureSVG(state.rulerTenths, false);
        }

      function playRulerZoom10Anim() {

        svgEl('line', { x1: tX + cmW + 6, y1: tY + 74, x2: 570, y2: 185, stroke: '#FB923C', 'stroke-width': 2.5, 'stroke-dasharray': '5,4' }, svg);

        // 下部：超拡大物差し（0〜1cm = 500px）

      function drawRulerMeasureSVG(tenthsVal, isFixedDemo) {
        const svg = clearStage();
        svgEl('rect', { x: 10, y: 12, width: 620, height: 406, rx: 16, fill: '#F8FAFC' }, svg);

        const ones = Math.floor(tenthsVal / 10);
        const tenths = tenthsVal % 10;

        // 上部拡大ルーペ窓
        const focusStart = tenthsVal === 100 ? 9 : ones;
        const fillU = tenthsVal === 100 ? 10 : tenths;
        const lx = 165;
        const ly = 26;
        const lw = 310;
        const lh = 92;

        svgEl('rect', { x: lx - 20, y: ly, width: lw + 40, height: lh, rx: 14, fill: '#FFFBEB', stroke: '#F59E0B', 'stroke-width': 3 }, svg);
        svgRubyText(svg, 82, 76, [{ t: '🔍 ' }, { t: '拡大', r: 'かくだい' }], { fontSize: 16, fill: '#B45309' });

        if (fillU > 0) {
          svgEl('rect', { x: lx, y: ly + 12, width: (lw / 10) * fillU, height: 24, fill: '#EF4444' }, svg);
        }

        const lrY = ly + 36;
        svgEl('rect', { x: lx - 10, y: lrY, width: lw + 20, height: 48, rx: 6, fill: '#FEF3C7', stroke: '#D97706', 'stroke-width': 2 }, svg);

        for (let m = 0; m <= 10; m++) {
          const mx = lx + (lw / 10) * m;
          const isEnd = m === 0 || m === 10;
          const isHalf = m === 5;
          svgEl('line', {
            x1: mx, y1: lrY, x2: mx, y2: lrY + (isEnd ? 22 : (isHalf ? 16 : 10)),
            stroke: isHalf ? '#0284C7' : '#1E293B',
            'stroke-width': isEnd ? 3 : 1.8
          }, svg);
          if (isEnd) {
            const num = svgEl('text', { x: mx, y: lrY + 40, 'font-size': 17, 'font-weight': '900', fill: '#1E293B', 'text-anchor': 'middle' }, svg);
            num.textContent = String(focusStart + (m === 10 ? 1 : 0));
          }
        }

        for (let d = 1; d <= fillU; d++) {
          svgEl('circle', { cx: lx + (lw / 10) * (d - 0.5), cy: ly + 24, r: 4, fill: '#FEF08A' }, svg);
        }

        const tag = svgEl('text', { x: 555, y: 78, 'font-size': 22, 'font-weight': '900', fill: '#EA580C', 'text-anchor': 'middle' }, svg);
        tag.textContent = `${ones}.${tenths} cm`;

        // メイン物差し（0〜10cm）
        const rX = 45;
        const rW = 550;
        const tapeY = 165;
        const tapeH = 38;
        const rulerY = tapeY + tapeH;
        const rulerH = 82;
        const tapeW = (rW / 100) * tenthsVal;

        svgEl('rect', { x: rX, y: tapeY, width: tapeW, height: tapeH, fill: '#EF4444', stroke: '#991B1B', 'stroke-width': 2 }, svg);
        svgEl('line', { x1: rX + tapeW, y1: tapeY - 12, x2: rX + tapeW, y2: rulerY + rulerH + 8, stroke: '#E11D48', 'stroke-width': 3, 'stroke-dasharray': '5,4' }, svg);
        svgEl('rect', { x: rX - 18, y: rulerY, width: rW + 36, height: rulerH, rx: 10, fill: '#FEF3C7', stroke: '#D97706', 'stroke-width': 3.5 }, svg);

        for (let i = 0; i <= 100; i++) {
          const tx = rX + (rW / 100) * i;
          const isCm = i % 10 === 0;
          const isHalf = i % 5 === 0 && !isCm;
          svgEl('line', {
            x1: tx, y1: rulerY, x2: tx, y2: rulerY + (isCm ? 32 : (isHalf ? 22 : 14)),
            stroke: isHalf ? '#0284C7' : '#1E293B',
            'stroke-width': isCm ? 2.8 : (isHalf ? 1.8 : 1.1)
          }, svg);
          if (isCm) {
            const num = svgEl('text', { x: tx, y: rulerY + 62, 'font-size': 20, 'font-weight': '900', fill: '#1E293B', 'text-anchor': 'middle' }, svg);
            num.textContent = String(i / 10);
          }
        }

        const unitTxt = svgEl('text', { x: rX + rW + 4, y: rulerY + 75, 'font-size': 13, 'font-weight': '900', fill: '#78350F', 'text-anchor': 'end' }, svg);
        unitTxt.textContent = '(cm)';

        // 下部ブラケット
        const bY = rulerY + rulerH + 22;
        const onesW = (rW / 100) * (ones * 10);
        const tenthsW = (rW / 100) * tenths;

        if (ones > 0) {
          svgEl('path', { d: `M${rX + 2},${bY} L${rX + 2},${bY + 12} L${rX + onesW - 2},${bY + 12} L${rX + onesW - 2},${bY}`, fill: 'none', stroke: '#0284C7', 'stroke-width': 3.5 }, svg);
          const t1 = svgEl('text', { x: rX + onesW / 2, y: bY + 38, 'font-size': 22, 'font-weight': '900', fill: '#0284C7', 'text-anchor': 'middle' }, svg);
          t1.textContent = `${ones} cm`;
        }

        if (tenths > 0) {
          const sx = rX + onesW;
          svgEl('path', { d: `M${sx + 2},${bY} L${sx + 2},${bY + 12} L${sx + tenthsW - 2},${bY + 12} L${sx + tenthsW - 2},${bY}`, fill: 'none', stroke: '#EA580C', 'stroke-width': 3.5 }, svg);
          const lblX = Math.min(565, Math.max(85, sx + tenthsW / 2));
          const t2 = svgEl('text', { x: lblX, y: bY + 38, 'font-size': 20, 'font-weight': '900', fill: '#EA580C', 'text-anchor': 'middle' }, svg);
          t2.textContent = `0.${tenths} cm (${tenths}mm)`;
        }

        if (!isFixedDemo) {
          const segW = rW / 100;
          for (let i = 1; i <= 100; i++) {
            svgEl('rect', {
              x: rX + segW * (i - 1), y: tapeY - 10, width: segW, height: tapeH + rulerH + 15,
              fill: 'transparent', style: 'cursor:pointer;',
              'data-action': 'ruler-set', 'data-val': String(i)
            }, svg);
          }
        }
      }

      function selectQTab(tabNum, regenerate) {
        state.qTab = tabNum;
        document.querySelectorAll('.q-tab').forEach(btn => {
          if (parseInt(btn.dataset.val, 10) === tabNum) btn.classList.add('active');
          else btn.classList.remove('active');
        });

        if (tabNum === 1) { if (regenerate || !state.q1) genQ1(); renderQ1(); }
        else if (tabNum === 2) { if (regenerate || !state.q2) genQ2(); renderQ2(); }
        else if (tabNum === 3) { if (regenerate || !state.q3) genQ3(); renderQ3(); }
        else if (tabNum === 4) { if (regenerate || !state.q4) genQ4(); renderQ4(); }
        else if (tabNum === 5) { if (regenerate || !state.q5) genQ5(); renderQ5(); }
        else if (tabNum === 6) { if (regenerate || !state.q6) genQ6(); renderQ6(); }
        else if (tabNum === 7) { if (regenerate || !state.q7) genQ7(); renderQ7(); }
      }

      function buildKeypadHTML(allowDot) {
        const keys = ['7', '8', '9', '4', '5', '6', '1', '2', '3', '0', allowDot ? '.' : '', 'DEL'];
        let html = '<div class="keypad-grid">';
        keys.forEach(k => {
          if (k === '') {
            html += '<div></div>';
          } else if (k === 'DEL') {
            html += `<button type="button" class="key-btn key-btn-del" data-action="key" data-val="DEL">⌫ けす</button>`;
          } else {
            html += `<button type="button" class="key-btn" data-action="key" data-val="${k}">${k}</button>`;
          }
        });
        html += '</div>';
        return html;
      }

      function setFocusSlot(slotId) {
        state.activeSlot = slotId;
        document.querySelectorAll('.input-slot').forEach(el => {
          if (el.id === slotId) el.classList.add('focused');
          else el.classList.remove('focused');
        });
      }

      function handleKeyInput(key) {
        if (!state.activeSlot) return;
        const slot = document.getElementById(state.activeSlot);
        if (!slot) return;
        playTone('button');

        let val = slot.dataset.val || '';
        if (key === 'DEL') {
          val = val.slice(0, -1);
        } else {
          if (key === '.' && (val.includes('.') || val === '')) return;
          if (val.length >= 5) return;
          val += key;
        }
        slot.dataset.val = val;
        slot.textContent = val === '' ? '？' : val;
        if (val === '') slot.classList.remove('filled');
        else slot.classList.add('filled');
      }

      function drawTankSVG(svg, x, yTop, w, h, fillUnits, interactiveQ2TankIdx = -1) {

        svgEl('path', {

      // --- ① 水のかさ（p.17 練習1類問） ---
      function genQ1() {
        const list = [4, 7, 9, 12, 14, 16, 18, 23, 25];
        let next = list[Math.floor(Math.random() * list.length)];
        if (state.q1 && next === state.q1.target) {
          next = list[(list.indexOf(next) + 1) % list.length];
        }
        state.q1 = { target: next };
      }

      function renderQ1() {
        const svg = clearStage();
        svgEl('rect', { x: 15, y: 12, width: 610, height: 406, rx: 18, fill: '#F8FAFC' }, svg);

        const count = state.q1.target > 20 ? 3 : (state.q1.target > 10 ? 2 : 1);
        const w = count === 3 ? 140 : 165;
        const h = 260;
        const gap = count === 3 ? 35 : 55;
        const startX = (640 - (count * w + (count - 1) * gap)) / 2;

        for (let t = 0; t < count; t++) {
          const u = Math.max(0, Math.min(10, state.q1.target - t * 10));
          drawTankSVG(svg, startX + t * (w + gap), 80, w, h, u);

      function drawSimplePracticeRuler(svg, tenthsVal, showGuide, showAns) {
        const rX = 45;
        const rW = 550;
        const tapeY = showGuide ? 185 : 140;
        const tapeH = 38;
        const rulerY = tapeY + tapeH;
        const rulerH = 84;
        const ones = Math.floor(tenthsVal / 10);
        const tenths = tenthsVal % 10;

        if (showGuide) {
          const focusStart = tenthsVal === 100 ? 9 : ones;
          const fillU = tenthsVal === 100 ? 10 : tenths;
          const lx = 175;
          const ly = 24;
          const lw = 300;
          const lh = 96;

          svgEl('rect', { x: lx - 20, y: ly, width: lw + 40, height: lh, rx: 14, fill: '#FFFBEB', stroke: '#F59E0B', 'stroke-width': 3 }, svg);
          svgRubyText(svg, 85, 76, [{ t: '🔍 ' }, { t: '拡大', r: 'かくだい' }, { t: 'ガイド' }], { fontSize: 15, fill: '#B45309' });

          if (fillU > 0) {
            svgEl('rect', { x: lx, y: ly + 12, width: (lw / 10) * fillU, height: 24, fill: '#EF4444' }, svg);
          }
          const lrY = ly + 36;
          svgEl('rect', { x: lx - 10, y: lrY, width: lw + 20, height: 48, rx: 6, fill: '#FEF3C7', stroke: '#D97706', 'stroke-width': 2 }, svg);
          for (let m = 0; m <= 10; m++) {
            const mx = lx + (lw / 10) * m;
            const isEnd = m === 0 || m === 10;
            const isHalf = m === 5;
            svgEl('line', {
              x1: mx, y1: lrY, x2: mx, y2: lrY + (isEnd ? 22 : (isHalf ? 16 : 10)),
              stroke: isHalf ? '#0284C7' : '#1E293B', 'stroke-width': isEnd ? 3 : 1.8
            }, svg);
            if (isEnd) {
              const num = svgEl('text', { x: mx, y: lrY + 40, 'font-size': 17, 'font-weight': '900', fill: '#1E293B', 'text-anchor': 'middle' }, svg);
              num.textContent = `${focusStart + (m === 10 ? 1 : 0)}cm`;
            }
          }
          for (let d = 1; d <= fillU; d++) {
            svgEl('circle', { cx: lx + (lw / 10) * (d - 0.5), cy: ly + 24, r: 4, fill: '#FEF08A' }, svg);
          }

          const c1 = svgEl('text', { x: 562, y: 66, 'font-size': 16, 'font-weight': '900', fill: '#0369A1', 'text-anchor': 'middle' }, svg);
          c1.textContent = `${ones}cm と`;
          const c2 = svgEl('text', { x: 562, y: 92, 'font-size': 17, 'font-weight': '900', fill: '#EA580C', 'text-anchor': 'middle' }, svg);
          c2.textContent = `0.1cmが ${tenths}こ`;
        }

        const tapeW = (rW / 100) * tenthsVal;
        svgEl('rect', { x: rX, y: tapeY, width: tapeW, height: tapeH, fill: '#EF4444', stroke: '#991B1B', 'stroke-width': 2 }, svg);
        svgEl('line', { x1: rX + tapeW, y1: tapeY - 12, x2: rX + tapeW, y2: rulerY + rulerH + 8, stroke: '#E11D48', 'stroke-width': 2.8, 'stroke-dasharray': '5,4' }, svg);
        svgEl('rect', { x: rX - 18, y: rulerY, width: rW + 36, height: rulerH, rx: 10, fill: '#FEF3C7', stroke: '#D97706', 'stroke-width': 3.5 }, svg);

        for (let i = 0; i <= 100; i++) {
          const tx = rX + (rW / 100) * i;
          const isCm = i % 10 === 0;
          const isHalf = i % 5 === 0 && !isCm;
          svgEl('line', {
            x1: tx, y1: rulerY, x2: tx, y2: rulerY + (isCm ? 32 : (isHalf ? 22 : 14)),
            stroke: isHalf ? '#0284C7' : '#1E293B', 'stroke-width': isCm ? 2.8 : (isHalf ? 1.8 : 1.1)
          }, svg);
          if (isCm) {
            const num = svgEl('text', { x: tx, y: rulerY + 62, 'font-size': 20, 'font-weight': '900', fill: '#1E293B', 'text-anchor': 'middle' }, svg);
            num.textContent = String(i / 10);

      function renderStep15(){
        const views=[
          ['2と0.8をあわせる','2 ＋ 0.8 ＝ 2.8','一の位は2。残りの0.8を合わせた数。'],
          ['0.1を28こ集める','0.1 × 28 ＝ 2.8','0.1が10こで1。28こで2.8になる。'],
          ['3から0.2ひく','3 − 0.2 ＝ 2.8','2.8は、3より0.2小さい数。'],
          ['1が2こと0.1が8こ','1 × 2 ＋ 0.1 × 8 ＝ 2.8','整数と同じ位取りで説明できる。'],
          ['2.8mと280cm','2.8 m ＝ 280 cm','1mは100cm。2mと80cmを合わせて280cm。']
        ];
        const [head,expression,body]=views[ext.viewIndex];
        eHTML('⑮ 小数の見方（25〜27ページ）','同じ2.8でも、いくつもの表し方があることを考えよう。',
          eModes(views.map((x,i)=>[String(i),['2＋0.8','0.1が28こ','3−0.2','位ごと','cmとm'][i]]),'ext-view-mode',String(ext.viewIndex))+
          `<div class="ext-panel"><b>${head}</b><div style="margin-top:8px;">${body}</div></div>`+
          `<div class="ext-big" style="font-size:clamp(17px,2vw,26px);"><span>${expression}</span></div>`+
          `<div class="ext-panel">${ext.viewIndex===4?"単位がちがっても、同じ長さを表せるよ。":"どの考え方も、同じ数「2.8」を表しているよ。"}</div>`,
          eBtn('ext-view-next','べつの 見方を 見る','emerald'));
        const s=eBase('2.8 を いろいろな見方で表す','教科書の「280と2.8」の対応を考えよう');
        if(ext.viewIndex===4){
          drawNumberline(s,{min:0,max:3,axisY:171,arrows:[{v:2.8,y:98,label:'2.8m',color:'#EA580C'}]});
          eText(s,320,247,'上は m、下は cm。おなじ長さだよ。',17,'#334155');
          eLine(s,52,322,592,322,'#334155',4);
          for(let j=0;j<=30;j++){
            const x=52+j*18,major=j%10===0;
            eLine(s,x,322-(major?16:8),x,322+(major?16:8),major?'#334155':'#94A3B8',major?3:1.5);
            if(major)eText(s,x,362,String(j*10),17,'#334155');
          }
          eLine(s,556,272,556,307,'#0284C7',3);
          svgEl('polygon',{points:'545,305 567,305 556,322',fill:'#0284C7'},s);
          eRect(s,510,268,92,32,'#0284C7','#0284C7',7,0);
          eText(s,556,290,'280cm',17,'#FFFFFF');
          eText(s,320,402,'2.8 m ＝ 280 cm',26,'#0369A1');
          return;
        }
        drawNumberline(s,{min:0,max:3,axisY:198,arrows:[{v:2.8,y:125,label:'2.8',color:'#EA580C'}]});
        eText(s,320,290,expression,26,'#0369A1');
        if(ext.viewIndex===1){
          eText(s,320,344,'0.1 × 10 = 1',19,'#92400E');
          eText(s,320,383,'1 が 2こ と 0.1 が 8こ',18,'#334155');
        }else if(ext.viewIndex===2){
          eLine(s,568,240,532,240,'#E11D48',6);
          eText(s,320,365,'3.0 から左へ 0.2 もどる',18,'#9F1239');
        }else{
          eRect(s,77,316,206,48,'#DBEAFE','#60A5FA');
          eText(s,180,347,'1 が 2こ',20,'#1D4ED8');
          eRect(s,319,316,250,48,'#FFEDD5','#FB923C');
          eText(s,444,347,'0.1 が 8こ',20,'#C2410C');
        }
        eText(s,320,413,'280 は 200＋80、2.8 は 2＋0.8',15,'#475569');
      }
      // --- ⑯ 仕上げ: 教科書28〜29ページ ---
      function extShuffle(a){
        const v=a.slice();for(let i=v.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]];}return v;
      }
      function extStartQuiz(){
        ext.quiz=extShuffle(extQuizBank).slice(0,10).map(q=>({...q,o:extShuffle(q.o)}));
        ext.quizIndex=0;ext.quizCorrect=0;ext.quizSelection=null;ext.quizHint=false;
        try{const n=Number(localStorage.getItem('decimal-world-best-v2'));ext.quizBest=Number.isFinite(n)?Math.min(10,n):0;}catch(_){ext.quizBest=null;}
        renderStep16();
      }
      function extQuizAnswer(choice){
        const q=ext.quiz[ext.quizIndex];
        if(!q||ext.quizSelection!==null)return;
        ext.quizSelection=choice;
        if(choice===q.a)ext.quizCorrect++;
        playTone(choice===q.a?'sparkle':'wrong');
        renderStep16();
      }
      function extQuizAdvance(){
        if(ext.quizSelection===null)return;
        ext.quizIndex++;ext.quizSelection=null;ext.quizHint=false;
        if(ext.quizIndex===ext.quiz.length){
          try{let old=Number(localStorage.getItem('decimal-world-best-v2')||0);if(ext.quizCorrect>old)localStorage.setItem('decimal-world-best-v2',String(ext.quizCorrect));
            ext.quizBest=Math.max(old,ext.quizCorrect);}catch(_){}
          playTone('goal');
        }
        renderStep16();
      }
      function renderStep16(){
        if(!ext.quiz.length){extStartQuiz();return;}
        const done=ext.quizIndex>=ext.quiz.length;
        const i=ext.quizIndex,q=done?null:ext.quiz[i],score=ext.quizCorrect;
        if(done){
          eHTML('⑯ しあげ（28〜29ページ）','小数の学習をふり返り、分かったことを確かめよう。',
            `<div class="ext-big">${score} / 10 問 正解</div>`+eProgress(score,10)+
            `<div class="ext-panel">${score===10?'10問ぜんぶ正解！':score>=7?'よく身に付いています。間違えたところを復習しよう。':'できなかったところは、⑨〜⑮にもどって図で確認しよう。'}</div>`+
            `<div class="ext-panel">${ext.quizBest!==null?`これまでの最高：${ext.quizBest} / 10 問`:'結果はこの画面で確認できます。'}</div>`,
            eBtn('ext-quiz-reset','新しい10問に ちょうせん','emerald'));
          const s=eBase('小数の しあげ','結果を見て、苦手なところを復習しよう');
          eCircle(s,320,194,99,'#FEF3C7','#F59E0B',6);
          eText(s,320,187,String(score),91,'#B45309');
          eText(s,320,229,'/ 10',31,'#92400E');
          eText(s,320,343,score===10?'全問正解！':'もう一度 チャレンジできるよ',24,'#059669');
          return;
        }
        const selected=ext.quizSelection;
        eHTML('⑯ しあげ（28〜29ページ）',`${i+1}問目。考えてから答えを選ぼう。`,
          `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:13px;">問題 ${i+1} / 10 <span>正解 ${score}問</span></div>`+eProgress(i+ (selected!==null?1:0),10)+
          `<div class="ext-question">${q.q}</div>`+
          `<div class="ext-options">${q.o.map((o,j)=>`<button type="button" class="ext-option ${selected!==null?(o===q.a?'correct':o===selected?'wrong':''):''}" data-action="ext-quiz-answer" data-val="${o}" ${selected!==null?'disabled':''}><span class="ext-option-symbol">${'あいうえ'[j]}</span>${o}</button>`).join('')}</div>`+
          (selected!==null?`<div class="feedback-bar ${selected===q.a?'fb-ok':'fb-ng'}">${selected===q.a?'せいかい！':'正解は '+q.a+'。'} ${q.why}</div>`:
            ext.quizHint?`<div class="ext-panel">ヒント：${q.hint}</div>`:'<div class="ext-panel" style="text-align:center;">4つのうち1つをえらぼう。</div>'),
          selected!==null?eBtn('ext-quiz-next',i===9?'結果をみる ▶':'つぎの問題 ▶','emerald'):
            `<div class="two-col-grid">${eBtn('ext-quiz-hint','ヒントをみる','amber','',true)}${eBtn('ext-quiz-reset','最初から','slate','',true)}</div>`);
        const s=eBase('小数の まとめ問題',`第 ${i+1} 問 / 10`);
        if(q.kind==='line'||q.kind==='compare'){
          const values=q.kind==='compare'?[q.x,q.y]:[q.n];
          const mi=Math.max(0,Math.floor(Math.min(...values)/10)-1),ma=Math.max(mi+3,Math.ceil(Math.max(...values)/10)+1);
          drawNumberline(s,{min:mi,max:ma,axisY:254,
            arrows:values.map((v,j)=>({v:v/10,label:eTenths(v),color:j===0?'#0284C7':'#EA580C',y:j===0?151:191}))});
          eText(s,320,366,'数直線の 目もりと 位を たしかめよう',18,'#475569');
        }else if(q.kind==='column'){
          eRect(s,174,95,296,274,'#fff','#CBD5E1',14);
          eText(s,320,157,eTenths(q.x),43,'#0F172A');
          eText(s,215,235,q.op,44,'#EA580C');
          eText(s,320,234,eTenths(q.y),43,'#0F172A');
          eLine(s,205,263,439,263,'#334155',4);
          eText(s,320,321,selected===null?'？':eTenths(q.op==='+'?q.x+q.y:q.x-q.y),43,'#059669');
        }else if(q.kind==='place'){
          eText(s,320,157,'239.7',69,'#0F172A');
          eRect(s,172,205,296,83,'#FFF7ED','#FDBA74');
          eText(s,320,258,'小数点のすぐ右に 7',23,'#9A3412');
          eText(s,320,345,'7 は 0.1が7この意味',20,'#334155');
        }else if(q.kind==='calc'){
          eText(s,320,164,`${eTenths(q.x)} ${q.op==='+'?'＋':'−'} ${eTenths(q.y)}`,51,'#0F172A');
          eRect(s,96,205,448,103,'#E0F2FE','#7DD3FC');
          eText(s,320,250,`0.1が ${q.x}こ ${q.op==='+'?'＋':'−'} ${q.y}こ`,21,'#075985');
          eText(s,320,282,'＝ 0.1が 何こ分？',19,'#075985');
        }else{
          eRect(s,92,123,456,202,'#EFF6FF','#93C5FD');
          eText(s,320,194,'1 ＝ 0.1 が 10こ',26,'#075985');
          if(q.n&&q.n>1)eText(s,320,254,`0.1 が ${q.n}こ`,30,'#1D4ED8');
          else eText(s,320,254,'1を10等分して考えよう',21,'#1D4ED8');
        }
      }


      // =======================================================================
      // 13. 統一イベント委譲（インラインonclickゼロ・クォート衝突ゼロ）
      // =======================================================================
      document.body.addEventListener('click', (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.dataset.action;
        const val = target.dataset.val;

        if (action === 'toggle-sound') {
          state.sound = !state.sound;
          document.getElementById('sound-icon').textContent = state.sound ? '🔊' : '🔇';
          document.getElementById('sound-text').textContent = state.sound ? 'おと ON' : 'おと OFF';
          if (state.sound) playTone('button');
        } else if (action === 'goto-step') {
          goToStep(parseInt(val, 10));
        } else if (action === 'prev-step') {
          goToStep(state.step - 1);
        } else if (action === 'next-step') {
          goToStep(state.step + 1);
        } else if (action === 'celebrate') {
          playTone('goal');
          if (ext.quiz.length===0) extStartQuiz(); else renderStep16();
        } else if (action === 'ext-line-mode') {
          ext.lineMode=val;ext.lineChecked=false;renderStep9();
        } else if (action === 'ext-line-pick') {
          extLinePick(Number(val));
        } else if (action === 'ext-line-delta') {
          extLinePick(ext.line+Number(val));
        } else if (action === 'ext-line-new') {
          ext.lineTarget=Math.floor(Math.random()*39)+1;ext.lineChecked=false;
          ext.line=0;renderStep9();
        } else if (action === 'ext-line-reset') {
          ext.line=10;ext.lineChecked=false;renderStep9();
        } else if (action === 'ext-place-col') {
          ext.placeCol=Number(val);playTone('button');renderStep10();
        } else if (action === 'ext-place-next') {
          ext.placeIndex=(ext.placeIndex+1)%extPlaceExamples.length;renderStep10();
        } else if (action === 'ext-compare-choose') {
          ext.compareChoice=val;playTone('button');renderStep11();
        } else if (action === 'ext-compare-next') {
          ext.compareIndex=(ext.compareIndex+1)%extComparisons.length;
          ext.compareChoice=null;renderStep11();
        } else if (action === 'ext-calc-next') {
          if(val==='+')ext.addPhase=Math.min(3,ext.addPhase+1);
          else ext.subPhase=Math.min(3,ext.subPhase+1);
          renderUnitCalc(val);
        } else if (action === 'ext-calc-prev') {
          if(val==='+')ext.addPhase=Math.max(0,ext.addPhase-1);
          else ext.subPhase=Math.max(0,ext.subPhase-1);
          renderUnitCalc(val);
        } else if (action === 'ext-calc-example') {
          if(val==='+'){ext.addIndex=(ext.addIndex+1)%extAddExamples.length;ext.addPhase=0;}
          else {ext.subIndex=(ext.subIndex+1)%extSubExamples.length;ext.subPhase=0;}
          renderUnitCalc(val);
        } else if (action === 'ext-col-prev') {
          ext.columnPhase=Math.max(0,ext.columnPhase-1);renderStep14();
        } else if (action === 'ext-col-forward') {
          ext.columnPhase=Math.min(3,ext.columnPhase+1);renderStep14();
        } else if (action === 'ext-col-example') {
          ext.columnIndex=(ext.columnIndex+1)%extColumnExamples.length;ext.columnPhase=0;renderStep14();
        } else if (action === 'ext-view-mode') {
          ext.viewIndex=Number(val);renderStep15();
        } else if (action === 'ext-view-next') {
          ext.viewIndex=(ext.viewIndex+1)%4;renderStep15();
        } else if (action === 'ext-quiz-answer') {
          extQuizAnswer(val);
        } else if (action === 'ext-quiz-next') {
          extQuizAdvance();
        } else if (action === 'ext-quiz-hint') {
          ext.quizHint=true;renderStep16();
        } else if (action === 'ext-quiz-reset') {
          extStartQuiz();
        } else if (action === 'race') {
          startRace(val);
        } else if (action === 'step2-pour') {
          pourBottles();
        } else if (action === 'step2-scale') {
          revealStep2Scales();
        } else if (action === 'cake') {
          cutCake(val);
        } else if (action === 'step4-divide') {
          divide1LInto10();
        } else if (action === 'step4-fill') {
          fillOneTenth();
        } else if (action === 'step5-mode') {
          if (val === '1') playStep5Mode1();
          else playStep5Mode2();
        } else if (action === 'water-delta') {
          const next = Math.max(1, Math.min(50, state.waterTenths + parseInt(val, 10)));
          state.waterTenths = next;
          playTone('water', (next - 1) % 10);
          updateStep6View();
        } else if (action === 'water-set') {
          const next = Math.max(1, Math.min(50, parseInt(val, 10)));
          state.waterTenths = next;
          playTone('water', (next - 1) % 10);
          updateStep6View();
        } else if (action === 'ruler-mode') {
          playTone('button');
          setRulerMode(parseInt(val, 10));
        } else if (action === 'ruler-anim1') {
          playRulerZoom10Anim();
        } else if (action === 'ruler-delta') {
          const next = Math.max(1, Math.min(100, state.rulerTenths + parseInt(val, 10)));
          state.rulerTenths = next;
          playTone('water', (next - 1) % 10);
          updateRulerMode3Text();
          drawRulerMeasureSVG(state.rulerTenths, false);
        } else if (action === 'ruler-set') {
          const next = Math.max(1, Math.min(100, parseInt(val, 10)));
          state.rulerTenths = next;
          playTone('water', (next - 1) % 10);
          updateRulerMode3Text();
          drawRulerMeasureSVG(state.rulerTenths, false);
        } else if (action === 'q-tab') {
          playTone('button');
          selectQTab(parseInt(val, 10), false);
        } else if (action === 'q-next') {
          playTone('button');
          selectQTab(state.qTab, true);
        } else if (action === 'q-check') {
          checkPractice();
        } else if (action === 'focus-slot') {
          playTone('button');
          setFocusSlot(target.dataset.slot);
        } else if (action === 'key') {
          handleKeyInput(val);
        } else if (action === 'q2-delta') {
          const next = Math.max(0, Math.min(20, state.q2.user + parseInt(val, 10)));
          state.q2.user = next;
          playTone('water', next % 10);
          renderQ2SVG();
        } else if (action === 'q2-set') {
          const next = Math.max(0, Math.min(20, parseInt(val, 10)));
          state.q2.user = next;
          playTone('water', next % 10);
          renderQ2SVG();
        } else if (action === 'q5-select') {
          playTone('button');
          state.q5.selected = parseInt(val, 10);
          renderQ5();
        } else if (action === 'q5-box') {
          if (state.q5.selected === null) {
            const first = state.q5.placed.findIndex(p => p === null);
            if (first === -1) return;
            state.q5.selected = first;
          }
          playTone('button');
          state.q5.placed[state.q5.selected] = val;
          state.q5.checked = false;
          const nextUnplaced = state.q5.placed.findIndex(p => p === null);
          state.q5.selected = nextUnplaced !== -1 ? nextUnplaced : null;
          renderQ5();
        } else if (action === 'q5-return') {
          playTone('button');
          const idx = parseInt(val, 10);
          state.q5.placed[idx] = null;
          state.q5.selected = idx;
          state.q5.checked = false;
          renderQ5();
        } else if (action === 'q6-guide') {
          playTone('button');
          state.q6.guide = !state.q6.guide;
          renderQ6SVG();
        }
      });

      // キーボード入力にも対応（ステップ8）
      window.addEventListener('keydown', (e) => {
        if (state.step === 16 && ext.quiz.length && ext.quizIndex < ext.quiz.length) {
          if (e.key >= '1' && e.key <= '4' && ext.quizSelection === null) {
            extQuizAnswer(ext.quiz[ext.quizIndex].o[Number(e.key)-1]);
          } else if (e.key === 'Enter' && ext.quizSelection !== null) extQuizAdvance();
          return;
        }
        if (state.step !== 8 || state.qTab === 2 || state.qTab === 5) return;
        if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
          handleKeyInput(e.key);
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
          handleKeyInput('DEL');
        } else if (e.key === 'Enter') {
          checkPractice();
        }
      });

      // 初期起動
      goToStep(1);
    });
  </script>
</body>
</html>
