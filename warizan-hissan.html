  // まず等倍(scale=1)で必要な横幅を計算する。
  function computeTotalW(scale) {
    var w = 0;
    for (var k = 0; k < L; k++) {
      var exponent = startExponent - k;
      var unit = getPlaceValueUnit(exponent);
      var count = fullDigits[k];
      var step = unit.step * scale, width = unit.width * scale;
      var colW = (count > 0) ? (count * step - (step - width)) : 0;
      w += colW;
      if (k < L - 1 && count > 0) w += groupGap;
    }
    return w;
  }
  var scale = 1;
  var rawTotalW = computeTotalW(1);
  if (rawTotalW > maxAvailW) {
    scale = Math.max(minScale, maxAvailW / rawTotalW);
  }

  var columns = [];
  var totalW = 0;
  for (var k = 0; k < L; k++) {
    var exponent = startExponent - k;
    var unit = getPlaceValueUnit(exponent);
    var count = fullDigits[k];
    var step = unit.step * scale, width = unit.width * scale, height = unit.height * scale;
    var colW = (count > 0) ? (count * step - (step - width)) : 0;
    columns.push({ exponent: exponent, count: count, unit: unit, scale: scale, step: step, width: width, height: height, colW: colW });
    totalW += colW;
    if (k < L - 1 && count > 0) totalW += groupGap;
  }
  var startX = Math.round((460 - totalW) / 2);
  var cursorX = startX;
  var centerY = 128;
  columns.forEach(function(col) {
    col.coords = [];
    for (var i = 0; i < col.count; i++) {
      var topX = cursorX + i * col.step;
      if (col.unit.anchor === "center") {
        col.coords.push({ x: topX + col.width / 2, y: centerY, scale: col.scale });
      } else {
        col.coords.push({ x: topX, y: centerY - col.height / 2, scale: col.scale });
      }
    }
    col.left = cursorX;
    col.right = cursorX + col.colW;
    if (col.count > 0) cursorX += col.colW + groupGap;
  });
  return columns;
}

// ==================================================================
// 「1桁ずつ」の図解エンジン（筆算レベル5・6専用）
// ------------------------------------------------------------------
// レベル4本体（renderLevel4 / initLevel4Scene / level4Ctx）には
// 一切依存しない、単一ラウンドのロジック：
//   ラウンドステージ0「見せる」 … このラウンドの value 個ぶんの
//     ブロック（round.exponent の単位）をまとめて見せるだけ。
//   ラウンドステージ1「配る／かける／ひく」 … divisor 人に配り、
//     view.phase（"build"|"multiply"|"subtract"）に応じてバッジの
//     文言だけ切り替える（配る動き自体は1回だけ）。
//   ラウンドステージ2「バラす」 … あまりのブロックを10こずつ
//     バラして、次の位の単位＋次の桁と合体させる。
// HissanSim.initSimulation で作られる hissanIllusState.rounds と、
// buildHissanIllustration から呼び出される（下記）。
// ==================================================================
var hissanRoundTimers = [];
function clearHissanRoundTimers(){
  hissanRoundTimers.forEach(function(t){ clearTimeout(t); });
  hissanRoundTimers = [];
}
function scheduleHissanRound(fn, delay){
  hissanRoundTimers.push(setTimeout(fn, delay));
}

// ブロック1個を(x,y)へ配置する。scale!==1のときはあまりトレイ用に
// 少し縮小して表示する（あまりトレイ幅が狭いため）。
function placeHissanBlock(g, x, y, scale, animate, delay){
  if(animate){
    g.style.transition = "transform .45s cubic-bezier(0.25,0.46,0.45,0.94) " + (delay||0) + "ms, opacity .35s ease";
  } else {
    g.style.transition = "none";
  }
  var s = (scale && scale !== 1) ? (" scale(" + scale + ")") : "";
  g.style.transform = "translate(" + x + "px," + y + "px)" + s;
}

// ==================================================================
// トレイ累積（左詰め）の確定処理
// ------------------------------------------------------------------
// 「1つ前のラウンドまでに配り終えた分」を、各人のトレイの中に小さく
// 常時表示するための処理。1ラウンド＝1桁なので、あるラウンドで
// 配られる個数（quotient）は全員が同じ数だけ受け取る（あまりは
// あまりトレイへ）。そのため累積も「全員共通の個数」を人数ぶん
// コピーするだけでよいが、将来の拡張（不均等配布）に備えて
// 人ごとの配列構造はそのまま維持する。
//
// 確定タイミングは「次のラウンドが始まる直前」の1箇所だけに統一する：
// rounds配列がそろった時点（再生を始める前）で、ラウンドiのtrayAccumを
// 「ラウンド0〜i-1の配布結果の合計」として一括計算し、round.trayAccumに
// 焼き込んでしまう。これにより、そのラウンドの①〜③のどのステージを
// 表示していても累積表示は変化せず（＝確定していない今回ぶんが
// 先回りして表示されることはない）、ラウンドが切り替わった瞬間だけ
// 次の値にジャンプする。
// ==================================================================
function cloneHissanTrayAccum(trayAccum){
  return trayAccum.map(function(personMap){
    var copy = {};
    Object.keys(personMap).forEach(function(k){ copy[k] = personMap[k]; });
    return copy;
  });
}

// rounds: [{ round: hissanRoundData, ... }, ...]（出現順）。
// 各 rounds[i].round.trayAccum に「ラウンド0〜i-1ぶんの累積」を書き込む。
// 呼び出しは再生を始める前に一度だけ行う想定（＝確定タイミングの一本化）。
function computeHissanRoundsTrayAccum(rounds){
  if (!rounds || !rounds.length || rounds[0].round.kind === "quotitive") return;
  var divisor = rounds[0].round.divisor;
  var trayAccum = [];
  for (var pj = 0; pj < divisor; pj++) trayAccum.push({});
  rounds[0].round.trayAccum = cloneHissanTrayAccum(trayAccum);
  for (var i = 1; i < rounds.length; i++) {
    var prevRound = rounds[i - 1].round;
    if (prevRound.quotient > 0) {
      trayAccum.forEach(function(personMap){
        personMap[prevRound.exponent] = (personMap[prevRound.exponent] || 0) + prevRound.quotient;
      });
    }
    rounds[i].round.trayAccum = cloneHissanTrayAccum(trayAccum);
  }
}

// ==================================================================
// 人トレイの中身（配り終えたブロック）の共通スロットレイアウト
// ------------------------------------------------------------------
// 以前は「今のラウンドで配った分」は等倍サイズでトレイの通常領域に、
// 「前のラウンドまでに配り終えた分」はそれより小さい縮尺（0.5倍）で
// トレイの下側に詰め直す、という2段構えの表示をしていた。そのため
// 桁が進むたびに、すでにトレイに入っていたブロックが急に縮んで
// 下へ移動し直すように見えてしまっていた（＝追加の位置移動）。
//
// これをやめ、そのわり算全体で最終的に1つのトレイに入る個数
// （＝全ラウンドのquotientの合計）をあらかじめ計算し、それが収まる
// 縮尺・列数を再生前に一度だけ決めてしまう（＝全ブロックの位置を
// 逆算してから位置を決める）。以後はラウンドが変わっても同じ縮尺・
// 同じスロット位置を使い続けるので、途中でブロックが縮んだり
// 位置がずれたりすることがない。
function computeHissanTrayCapacityLayout(rounds){
  if (!rounds || !rounds.length || rounds[0].round.kind === "quotitive") return null;
  var divisor = rounds[0].round.divisor;
  var totalPerPerson = 0;
  var maxUnitStep = 0, maxUnitH = 0;
  rounds.forEach(function(rd){
    var u = getPlaceValueUnit(rd.round.exponent);
    maxUnitStep = Math.max(maxUnitStep, u.step);
    maxUnitH = Math.max(maxUnitH, u.height);
    totalPerPerson += (rd.round.quotient || 0);
  });
  var trayGap = 10, availTotalW = 460;
  var trayW = Math.min(125, Math.floor((availTotalW - (divisor - 1) * trayGap) / divisor));
  var trayContentW = trayW - 16;
  if (totalPerPerson <= 0 || maxUnitStep <= 0) {
    return { trayW: trayW, scale: 1, cols: 1, stepX: maxUnitStep || 20, stepY: (maxUnitH || 20) * 1.3, rows: 0, contentH: 0 };
  }
  // 横は1トレイぶんの幅、縦はある程度まで（大きくなりすぎない範囲で）
  // 自動で縮小・複数行に折り返す（autoFitGridを流用）。
  var fit = autoFitGrid(totalPerPerson, maxUnitStep, maxUnitH, trayContentW, 210, 0.32);
  return { trayW: trayW, scale: fit.scale, cols: fit.cols, stepX: fit.stepX, stepY: fit.stepY, rows: fit.rows, contentH: fit.rows * fit.stepY };
}

// personMap（{exponent: 個数}）の合計個数（＝このラウンドより前に、
// このトレイスロット方式ですでに埋まっているスロット数）を返す。
function hissanTrayAccumCount(personMap){
  if (!personMap) return 0;
  var c = 0;
  Object.keys(personMap).forEach(function(k){ c += personMap[k]; });
  return c;
}

// 前のラウンドまでに配り終えた分を、このラウンドの新規配布ぶんと
// 完全に同じスロット関数・同じ縮尺で、続きのスロット番号（0番から
// 詰めて）に描画する。個数・種類は確定済みなので、位置が後から
// ずれることはない。
function renderHissanTrayCommitted(gLayer, trayAccum, traySlot, scale){
  if (!trayAccum || !trayAccum.length) return;
  for (var pj = 0; pj < trayAccum.length; pj++) {
    var personMap = trayAccum[pj];
    var items = [];
    Object.keys(personMap).sort(function(a, b){ return b - a; }).forEach(function(expKey){
      var cnt = personMap[expKey];
      for (var ci = 0; ci < cnt; ci++) items.push(parseInt(expKey, 10));
    });
    for (var ii = 0; ii < items.length; ii++) {
      var itemUnit = getPlaceValueUnit(items[ii]);
      var itemObj = itemUnit.create(formatPlaceValueLabel(items[ii]));
      var slot = traySlot(pj, ii);
      placeHissanBlock(itemObj.g, slot.x, slot.y, scale, false, 0);
      gLayer.appendChild(itemObj.g);
    }
  }
}

// round: AdvancedDivisionEngine.generateSteps が各ステップに付けた
//   hissanRound データ（round.trayAccum があれば、
//   computeHissanRoundsTrayAccum が事前に確定させた「このラウンドの
//   直前までの累積」を左詰めで表示する）
// view: { roundStage: 0|1|2, phase: 'hide'|'skip'|'build-zero'|'build'|'multiply'|'subtract'|'drop',
//         forward: bool, nextDigit: number|null }
// ==================================================================
// わる数が2けた以上のラウンド専用の図解（包含除）
// ------------------------------------------------------------------
// renderHissanRound（1桁のわる数・人トレイに配る等分除）とは別に、
// 「同じ数(わる数)ずつの まとまりが いくつ できるか」という
// 包含除の考え方で見せる。
// ブロックはPLACE_VALUE_UNITS（renderHissanRoundと共通の部品）で
// 作るので、他のレベルと同じ見た目（1の位は丸、10の位以上は角丸の
// いた・元の桁の数字入り）になる。まとまりは升目の塗りつぶしではなく
// 各ブロックの色（枠・数字の色）で示すので、わる数が10より大きく
// 1行に収まらず折り返しても、まとまりの境界が崩れて見えることがない。
// レイアウトはrenderHissanRoundと完全共通のcomputeHissanTopLayout/
// hissanTopSlotPosを使い、ラウンドの境目（おろす→次のたてる）で
// ブロックの位置がズレたりガクッと瞬間移動したりしないようにしている。
// あまりの「バラす→次の桁とスライドイン→カバーが外れる」演出も、
// renderHissanRoundと同じロジックをそのまま流用する。
// ==================================================================
function renderHissanRoundQuotitive(svg, round, view){
  clearHissanRoundTimers();
  svg.setAttribute("viewBox", "0 0 460 275");
  svg.innerHTML = "";
  if(!round) return;

  var divisor = round.divisor;
  var unit = getPlaceValueUnit(round.exponent);
  var unitLabel = formatPlaceValueLabel(round.exponent);
  var hasRem = round.remainder > 0;
  var roundStage = view.roundStage;
  var phase = view.phase;
  var forward = (view.forward !== false);

  // ---- 1. 上部：このラウンドだけの式 ----
  var gEq = el("g", {});
  gEq.appendChild(bigText(85, 26, round.value, null, {size: 26}));
  gEq.appendChild(bigText(122, 26, "÷", null, {size: 24}));
  gEq.appendChild(bigText(150, 26, divisor, null, {size: 26}));
  gEq.appendChild(bigText(178, 26, "＝", null, {size: 24}));
  var qCls = (roundStage >= 1) ? "slot-orange" : "slot-wait";
  gEq.appendChild(bigText(213, 26, (roundStage >= 1) ? round.quotient : "？", qCls, {size: 28}));
  if(hasRem){
    gEq.appendChild(middleText(258, 26, "あまり", null, {size: 12.5}));
    var rCls = (roundStage >= 1) ? "slot-orange" : "slot-wait";
    gEq.appendChild(bigText(292, 26, (roundStage >= 1) ? round.remainder : "？", rCls, {size: 22}));
  }
  gEq.appendChild(middleText(400, 26, "（" + unitLabel + "の位）", null, {size: 11, fill: "#94a3b8"}));
  svg.appendChild(gEq);

  // ---- 2. ガイドバッジ ----
  var badgeText = "";
  if(roundStage === 0){
    badgeText = unitLabel + "が " + round.value + "こ あるね。" + divisor + "こずつの まとまりに 分けてみよう！";
  } else if(roundStage === 1){
    if(phase === "multiply"){
      badgeText = "②かける： " + divisor + "×" + round.quotient + "＝" + (divisor * round.quotient) + "こ";
    } else if(phase === "subtract"){
      badgeText = hasRem
        ? "③ひく： " + round.value + "－" + (divisor * round.quotient) + "＝" + round.remainder + "こ のこった（あまり）"
        : "③ひく： " + round.value + "－" + (divisor * round.quotient) + "＝0（ぴったり！）";
    } else if(round.quotient === 0){
      badgeText = "①たてる： " + round.value + "こでは " + divisor + "こずつの まとまりが 1つも できないよ（商は0）";
    } else {
      badgeText = "①たてる： " + divisor + "こずつの まとまりが " + round.quotient + "こ できる！";
    }
  } else if(roundStage === 2){
    badgeText = hasRem
      ? "④おろす： のこった " + round.remainder + "こぶんを、10こずつバラして次の位と合体！"
      : "④おろす： あまりは無いので、そのまま次の位の " + (view.nextDigit || 0) + " をおろします！";
  }
  var gBadge = el("g", {});
  var badgeW = 420, badgeH = 24, badgeX = 230 - badgeW / 2, badgeY = 40;
  gBadge.appendChild(el("rect", { x: badgeX, y: badgeY, width: badgeW, height: badgeH, rx: 12, fill: "#f1f5f9", stroke: "#cbd5e1", "stroke-width": 1.5 }));
  var badgeSz = calcSvgFontSize(badgeText, badgeW - 16, 11.5, 8.5);
  gBadge.appendChild(middleText(230, badgeY + 16, badgeText, null, { size: badgeSz, weight: 800 }));
  svg.appendChild(gBadge);

  // ---- 3. レイヤー ----
  var gGhosts = el("g", {});
  var gBlocks = el("g", {});
  svg.appendChild(gGhosts);
  svg.appendChild(gBlocks);

  // ---- 4. このラウンドの value 個ぶんのブロックを並べる ----
  var initLayout = computeHissanTopLayout(round.value, unit);
  var initScale = initLayout.scale;
  var blockObjs = [];
  var thisRoundIdx = findHissanRoundIndex(round);
  var prevRoundForArrival = (thisRoundIdx > 0) ? hissanIllusState.rounds[thisRoundIdx - 1] : null;
  var arrivalLayout = (prevRoundForArrival && (prevRoundForArrival.remainder > 0 || (prevRoundForArrival.nextRoundDigit || 0) > 0))
    ? computeHissanTopLayout(round.value, unit)
    : null;
  for(var b = 0; b < round.value; b++){
    var slotPos = hissanTopSlotPos(initLayout, unit, round.value, b);
    var obj = unit.create(unitLabel);
    if (arrivalLayout) {
      var arrivalPos = hissanTopSlotPos(arrivalLayout, unit, round.value, b);
      if (Math.abs(arrivalPos.x - slotPos.x) > 0.5 || Math.abs(arrivalPos.y - slotPos.y) > 0.5) {
        placeHissanBlock(obj.g, arrivalPos.x, arrivalPos.y, initScale, false);
        placeHissanBlock(obj.g, slotPos.x, slotPos.y, initScale, true, 0);
      } else {
        placeHissanBlock(obj.g, slotPos.x, slotPos.y, initScale, false);
      }
    } else {
      placeHissanBlock(obj.g, slotPos.x, slotPos.y, initScale, false);
    }
    gBlocks.appendChild(obj.g);
    obj.origIx = slotPos.x;
    obj.origIy = slotPos.y;
    blockObjs.push(obj);
  }

  function hissanBlockBox(ix, iy){
    var w = unit.width * initScale, h = unit.height * initScale;
    if(unit.anchor === "center"){
      return { x: ix - w / 2, y: iy - h / 2, w: w, h: h };
    }
    return { x: ix, y: iy, w: w, h: h };
  }
  function hissanObjsBoundingBox(objs){
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    objs.forEach(function(o){
      var bx = hissanBlockBox(o.origIx, o.origIy);
      minX = Math.min(minX, bx.x); minY = Math.min(minY, bx.y);
      maxX = Math.max(maxX, bx.x + bx.w); maxY = Math.max(maxY, bx.y + bx.h);
    });
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  // ---- 5. まとまりごとに色分け（roundStage>=1のときだけ）----
  //          升目の塗りつぶしではなく、ブロック自身の枠・数字の色を
  //          まとまりごとに変える方式なので、divisorが大きくて行が
  //          折り返しても、まとまりの区切りが視覚的に崩れない。
  var groupColors = ["#e11d48", "#0ea5e9", "#16a34a", "#f59e0b", "#8b5cf6", "#db2777", "#0891b2", "#65a30d", "#c026d3"];
  var usedCount = round.quotient * divisor;
  if(roundStage >= 1){
    blockObjs.forEach(function(obj, idx){
      var shape = obj.r || obj.c;
      var isRemBlock = (idx >= usedCount);
      if(isRemBlock){
        shape.setAttribute("stroke", "#94a3b8");
        shape.setAttribute("fill", "#f1f5f9");
        obj.t.setAttribute("fill", "#64748b");
      } else {
        var color = groupColors[Math.floor(idx / divisor) % groupColors.length];
        shape.setAttribute("stroke", color);
        shape.setAttribute("fill", color);
        shape.setAttribute("fill-opacity", "0.16");
        obj.t.setAttribute("fill", color);
      }
    });
  }

  var gridBox = hissanObjsBoundingBox(blockObjs);
  var baseNeededH = Math.max(275, gridBox.y + gridBox.h + 60);
  if(baseNeededH > 275) svg.setAttribute("viewBox", "0 0 460 " + baseNeededH);

  if(roundStage === 0){
    return;
  }

  // ---- 6. まとまりの数（＝商）の確認キャプション ----
  var capY = gridBox.y + gridBox.h + 22;
  if(roundStage === 1){
    var capTxt = divisor + "こずつの まとまりが " + round.quotient + "こ" + (hasRem ? "（のこり " + round.remainder + "）" : "（ぴったり！）");
    var gCap1 = el("g", { class: (forward && phase === "build") ? "fade-in" : "" });
    gCap1.appendChild(middleText(230, capY, capTxt, "slot-orange", { size: 13, weight: 800 }));
    svg.appendChild(gCap1);
    return;
  }

  // ---- 7. バラす：あまりの束を「ポン！」と弾けさせて、次の位の単位で
  //          10倍の個数のブロックへ変身させる（renderHissanRoundと同じ演出）----
  var remBlockObjs = blockObjs.slice(usedCount);
  var nextUnit = getPlaceValueUnit(round.exponent - 1);
  var nextUnitLabel = formatPlaceValueLabel(round.exponent - 1);
  var nextDigit = view.nextDigit || 0;
  var totalNext = round.remainder * 10 + nextDigit;
  var fadeDelayBase = 300;

  var nextLayout = computeHissanTopLayout(totalNext, nextUnit);
  var nextGridH = nextLayout.rows * nextLayout.stepY;
  var nextGridTopY = nextLayout.topY;
  function nextSlotPos(n){
    return hissanTopSlotPos(nextLayout, nextUnit, totalNext, n);
  }
  var captionY = Math.max(capY, nextGridTopY + nextGridH + 14);

  if(hasRem){
    remBlockObjs.forEach(function(o){
      scheduleHissanRound(function(){
        o.inner.classList.add("ten-rem-pulse");
      }, fadeDelayBase);
    });

    var burstStepDelay = 150;
    var burstStart = fadeDelayBase + 500;
    var nextSlotCounter = 0;
    remBlockObjs.forEach(function(o, rIdx){
      var burstAt = burstStart + rIdx * burstStepDelay;
      var slotsForThisBundle = [];
      for(var s = 0; s < 10; s++){ slotsForThisBundle.push(nextSlotCounter++); }
      var rt = { x: o.origIx, y: o.origIy, scale: initScale };
      scheduleHissanRound((function(obj, slots, origin){
        return function(){
          obj.inner.classList.remove("ten-rem-pulse");
          obj.inner.classList.add("bundle-burst");
          playSound('chariin');
          var rw = unit.width * origin.scale, rh = unit.height * origin.scale;
          var cx = (unit.anchor === "center") ? origin.x : origin.x + rw / 2;
          var cy = (unit.anchor === "center") ? origin.y : origin.y + rh / 2;
          slots.forEach(function(slotN, k){
            scheduleHissanRound(function(){
              var oneObj = nextUnit.create(nextUnitLabel);
              var sx = (nextUnit.anchor === "center") ? cx : cx - (nextUnit.width * nextLayout.scale) / 2;
              var sy = (nextUnit.anchor === "center") ? cy : cy - (nextUnit.height * nextLayout.scale) / 2;
              placeHissanBlock(oneObj.g, sx, sy, nextLayout.scale * 0.5, false, 0);
              oneObj.g.style.opacity = "0";
              gBlocks.appendChild(oneObj.g);
              scheduleHissanRound(function(){
                var slot = nextSlotPos(slotN);
                oneObj.g.style.opacity = "1";
                placeHissanBlock(oneObj.g, slot.x, slot.y, nextLayout.scale, true, 0);
              }, 40);
            }, 60 + k * 20);
          });
        };
      })(o, slotsForThisBundle, rt), burstAt);
    });

    scheduleHissanRound(function(){
      remBlockObjs.forEach(function(o){ o.g.style.display = "none"; });
    }, burstStart + remBlockObjs.length * burstStepDelay + 600);
  }

  // ---- 8. 次の桁ぶん：カバーをかぶせたままスライドインさせ、
  //          そのあとカバーを外して中身を見せる（renderHissanRoundと同じ演出）----
  var digitStart = fadeDelayBase;
  var digitSlotStart = round.remainder * 10;
  var slideDuration = hasRem ? (remBlockObjs.length * 150 + 600) : 500;
  var uncoverStart = digitStart, uncoverDuration = 500;
  if (nextDigit > 0) {
    var gNextDigitCovered = el("g", { class: "hissan-next-digit-covered" });
    var ndMinX = Infinity, ndMinY = Infinity, ndMaxX = -Infinity, ndMaxY = -Infinity;
    for (var nd = 0; nd < nextDigit; nd++) {
      var slot = nextSlotPos(digitSlotStart + nd);
      var oneObj = nextUnit.create(nextUnitLabel);
      placeHissanBlock(oneObj.g, slot.x, slot.y, nextLayout.scale, false, 0);
      gNextDigitCovered.appendChild(oneObj.g);
      var nw = nextUnit.width * nextLayout.scale, nh = nextUnit.height * nextLayout.scale;
      var nbx = (nextUnit.anchor === "center") ? (slot.x - nw / 2) : slot.x;
      var nby = (nextUnit.anchor === "center") ? (slot.y - nh / 2) : slot.y;
      ndMinX = Math.min(ndMinX, nbx); ndMinY = Math.min(ndMinY, nby);
      ndMaxX = Math.max(ndMaxX, nbx + nw); ndMaxY = Math.max(ndMaxY, nby + nh);
    }
    var padX = 5, padY = 5;
    var gCoverOverlay = el("g", { class: "hissan-next-digit-cover-overlay" });
    gCoverOverlay.appendChild(el("rect", {
      x: ndMinX - padX, y: ndMinY - padY,
      width: (ndMaxX - ndMinX) + padX * 2, height: (ndMaxY - ndMinY) + padY * 2,
      rx: 8, fill: "#fde047", stroke: "#eab308", "stroke-width": 1.5, opacity: 0.5
    }));
    gCoverOverlay.appendChild(middleText((ndMinX + ndMaxX) / 2, (ndMinY + ndMaxY) / 2 + 5,
      "？", null, { size: 16, weight: 800, fill: "#a16207", opacity: 0.85 }));
    gNextDigitCovered.appendChild(gCoverOverlay);
    gBlocks.appendChild(gNextDigitCovered);

    var slideStart = Math.max(70, 460 - ndMinX + 20);
    gNextDigitCovered.style.transform = "translateX(" + slideStart + "px)";
    gNextDigitCovered.style.transition = "none";
    scheduleHissanRound(function(){
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          gNextDigitCovered.style.transition = "transform " + (slideDuration / 1000) + "s linear";
          gNextDigitCovered.style.transform = "translateX(0px)";
        });
      });
    }, digitStart);

    uncoverStart = digitStart + slideDuration + 200;
    var uncoverShift = Math.max(70, (ndMaxX - ndMinX) + 50);
    scheduleHissanRound(function(){
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          gCoverOverlay.style.transition = "transform " + (uncoverDuration / 1000) + "s cubic-bezier(0.55,0.06,0.68,0.19), opacity " + (uncoverDuration / 1000) + "s ease .1s";
          gCoverOverlay.style.transform = "translateX(" + uncoverShift + "px)";
          gCoverOverlay.style.opacity = "0";
        });
      });
    }, uncoverStart);
    scheduleHissanRound(function(){
      if (gCoverOverlay.parentNode) gCoverOverlay.parentNode.removeChild(gCoverOverlay);
    }, uncoverStart + uncoverDuration + 50);
  }

  // ---- 9. キャプション（式） ----
  var capText2 = hasRem
    ? (nextUnitLabel + "が" + (round.remainder * 10) + "こ分（＝" + unitLabel + "が" + round.remainder + "こ分）＋ つぎの位の " + nextDigit + " ＝ " + nextUnitLabel + "が" + totalNext + "こ分")
    : ("つぎの位の " + nextDigit + " を、そのままおろします");
  var capDelay2 = hasRem
    ? ((fadeDelayBase + 500) + remBlockObjs.length * 150 + 650)
    : (digitStart + (nextDigit > 0 ? slideDuration : 0) + 250);
  if (nextDigit > 0) {
    capDelay2 = Math.max(capDelay2, uncoverStart + uncoverDuration + 150);
  }
  scheduleHissanRound(function(){
    var gCap = el("g", { class: "fade-in" });
    gCap.appendChild(middleText(230, captionY, capText2, null, { size: 10.5, weight: 800, fill: "#64748b" }));
    svg.appendChild(gCap);
  }, capDelay2);

  // ---- 10. viewBoxの高さを、次の桁のグリッド分もふくめて再チェック
  //          （枠を縮めるのではなく広げて、ぜんぶ見切れずに表示する）----
  var neededH2 = Math.max(baseNeededH, captionY + 24);
  if(neededH2 > baseNeededH) svg.setAttribute("viewBox", "0 0 460 " + neededH2);
}

function renderHissanRound(svg, round, view){
  clearHissanRoundTimers();
  svg.setAttribute("viewBox", "0 0 460 275");
  svg.innerHTML = "";
  if(!round) return;

  var divisor = round.divisor;
  var unit = getPlaceValueUnit(round.exponent);
  var unitLabel = formatPlaceValueLabel(round.exponent);
  var hasRem = round.remainder > 0;
  var roundStage = view.roundStage;
  var phase = view.phase;
  var forward = (view.forward !== false);
  // 配布アニメ（青枠→一拍→1個ずつゴーストを残して移動）を流すのは
  // 「①たてる」で初めてこのラウンドに入ってくる瞬間だけ。②かける／
  // ③ひくで同じラウンドを見せ直すとき（forward:false）や、④おろす
  // （既に配り終わった状態のはずなのにforward:trueで呼ばれる）では、
  // 配布アニメを再生せず、最終位置へ即座に並べるだけにする。
  var animateBuild = (phase === "build") && forward;

  // ---- 1. 上部：このラウンドだけの式 ----
  var gEq = el("g", {});
  gEq.appendChild(bigText(85, 26, round.value, null, {size: 26}));
  gEq.appendChild(bigText(122, 26, "÷", null, {size: 24}));
  gEq.appendChild(bigText(150, 26, divisor, null, {size: 26}));
  gEq.appendChild(bigText(178, 26, "＝", null, {size: 24}));
  var qCls = (roundStage >= 1) ? "slot-orange" : "slot-wait";
  gEq.appendChild(bigText(213, 26, (roundStage >= 1) ? round.quotient : "？", qCls, {size: 28}));
  if(hasRem){
    gEq.appendChild(middleText(258, 26, "あまり", null, {size: 12.5}));
    var rCls = (roundStage >= 1) ? "slot-orange" : "slot-wait";
    gEq.appendChild(bigText(292, 26, (roundStage >= 1) ? round.remainder : "？", rCls, {size: 22}));
  }
  gEq.appendChild(middleText(400, 26, "（" + unitLabel + "の位）", null, {size: 11, fill: "#94a3b8"}));
  svg.appendChild(gEq);

  // ---- 2. ガイドバッジ（説明文。既存の言い回しを踏襲） ----
  var badgeText = "";
  if(roundStage === 0){
    badgeText = unitLabel + "が " + round.value + "こ あるね。" + divisor + "人に くばろう！";
  } else if(roundStage === 1){
    if(phase === "multiply"){
      badgeText = "②かける： " + divisor + "×" + round.quotient + "＝" + (divisor * round.quotient) + "こ くばった！";
    } else if(phase === "subtract"){
      badgeText = hasRem
        ? "③ひく： " + round.value + "－" + (divisor * round.quotient) + "＝" + round.remainder + "こ のこった（あまり）"
        : "③ひく： " + round.value + "－" + (divisor * round.quotient) + "＝0（ぴったり！）";
    } else if(round.quotient === 0){
      badgeText = "①たてる： " + round.value + "こでは " + divisor + "人に くばれないよ（商は0）";
    } else {
      badgeText = "①たてる： " + divisor + "人に くばると、1人 " + round.quotient + "こずつ！";
    }
  } else if(roundStage === 2){
    badgeText = hasRem
      ? "④おろす： のこった " + round.remainder + "こぶんを、10こずつバラして次の位と合体！"
      : "④おろす： あまりは無いので、そのまま次の位の " + (view.nextDigit || 0) + " をおろします！";
  }
  var gBadge = el("g", {});
  var badgeW = 420, badgeH = 24, badgeX = 230 - badgeW / 2, badgeY = 40;
  gBadge.appendChild(el("rect", { x: badgeX, y: badgeY, width: badgeW, height: badgeH, rx: 12, fill: "#f1f5f9", stroke: "#cbd5e1", "stroke-width": 1.5 }));
  gBadge.appendChild(middleText(230, badgeY + 16, badgeText, null, { size: 11.5, weight: 800 }));
  svg.appendChild(gBadge);

  // ---- 3. レイヤー ----
  var gTrays = el("g", {});
  var gGhosts = el("g", {});   // ③ひく専用：もとの場所に残すゴースト点線枠
  var gBlocks = el("g", {});
  svg.appendChild(gTrays);
  svg.appendChild(gGhosts);
  svg.appendChild(gBlocks);

  // ---- 4. トレイ（人型の受け皿）の配置 ----
  // あまりはもう専用トレイへ動かさず、上部の元の位置にそのまま
  // 残す方式にしたため、あまりトレイぶんの幅を予約する必要が
  // なくなり、人のトレイは横幅いっぱいを使える。
  var trayGap = 10;
  var availTotalW = 460;
  var trayW = Math.min(125, Math.floor((availTotalW - (divisor - 1) * trayGap) / divisor));
  var totalTraysW = divisor * trayW + (divisor - 1) * trayGap;
  var traysStartX = Math.round((availTotalW - totalTraysW) / 2);
  var trayY = 175;

  // トレイ1つぶんの中に、このラウンドで配るこの人の個数(round.quotient)が
  // 何列で入りきるかを求める（横に入らない時だけ縮小し、縦は行を
  // 増やして自動的に伸ばす＝ブロックが見切れないようにする）。
  // トレイ内のスロット（列数・縮尺・1マスぶんの幅高さ）は、この
  // わり算全体で最終的に入る個数から再生前に一度だけ決めてある
  // （hissanIllusState.trayCapacityLayout、buildHissanRoundsList参照）。
  // ラウンドが変わってもここは一切変わらないので、トレイの大きさや
  // 中のブロックの縮尺が桁の途中で変化することはない。
  var trayCapacity = hissanIllusState.trayCapacityLayout;
  var trayContentW = trayW - 16;
  var traySlotScale = trayCapacity ? trayCapacity.scale : 1;
  var trayCols = trayCapacity ? trayCapacity.cols : 1;
  var trayCellStepX = trayCapacity ? trayCapacity.stepX : (unit.width + 3);
  var trayCellStepY = trayCapacity ? trayCapacity.stepY : (unit.height + 4);
  var trayContentH = trayCapacity ? trayCapacity.contentH : 0;

  var trayH = Math.max(78, 18 + trayContentH + 12);
  var neededH = trayY + trayH + 14;
  if (neededH > 275) svg.setAttribute("viewBox", "0 0 460 " + neededH);
  for(var j = 0; j < divisor; j++){
    var tx = traysStartX + j * (trayW + trayGap);
    var cx = tx + Math.round(trayW / 2);
    gTrays.appendChild(el("circle", { cx: cx, cy: trayY - 19, r: 5.5, fill: "#2563eb" }));
    gTrays.appendChild(el("polygon", { points: (cx - 2) + "," + (trayY - 14) + " " + (cx + 2) + "," + (trayY - 14) + " " + (cx + 6.5) + "," + (trayY - 2) + " " + (cx - 6.5) + "," + (trayY - 2), fill: "#2563eb" }));
    gTrays.appendChild(el("rect", { x: tx, y: trayY, width: trayW, height: trayH, rx: 8, fill: "#f8fafc", stroke: "#cbd5e1", "stroke-width": 1.5 }));
    gTrays.appendChild(el("text", { x: tx + 8, y: trayY + 12, fill: "#64748b", "font-size": 9.5, "font-weight": 800, "font-family": "'M PLUS Rounded 1c', sans-serif" }, (j + 1) + "人目"));
  }

  // トレイ内の共通スロット関数（このラウンドの新規配布ぶんも、
  // 前のラウンドまでに配り終えた分も、必ずこの1つの関数を通す）。
  function traySlot(personIdx, slotIdx){
    var tx = traysStartX + personIdx * (trayW + trayGap) + 8;
    var col = slotIdx % trayCols, row = Math.floor(slotIdx / trayCols);
    return { x: tx + col * trayCellStepX, y: trayY + 18 + row * trayCellStepY };
  }

  // 前のラウンドまでに確定した累積ぶんを、今回の新規配布ぶんと
  // 完全に同じスロット・同じ縮尺で描画する（＝縮んで見え直すことがない）。
  renderHissanTrayCommitted(gTrays, round.trayAccum, traySlot, traySlotScale);

  // ---- 5. このラウンドの value 個ぶんのブロックを、初期位置(上段)に並べて作る ----
  //          ブロック数が多くて1行に収まらない場合は、autoFitGridで
  //          自動的に縮小・複数行に折り返して、見切れないようにする。
  // ④おろす（drop）側のnextLayout/nextSlotPosとビットまで同一の計算式
  // （computeHissanTopLayout/hissanTopSlotPos）を通すことで、前のラウンドの
  // 「おろす」の最終フレームと、このラウンドの最初のフレームが完全に
  // 同じ座標になる＝ラウンドの境目で瞬間移動して見えることがなくなる。
  var initLayout = computeHissanTopLayout(round.value, unit);
  var initScale = initLayout.scale;
  var blockObjs = [];
  // このラウンドが2つ目以降（roundIdx>0）で、直前のラウンドの「おろす」が
  // 実際にブロックを動かした（あまり合体 or 次の桁のスライドインが
  // あった）場合、直前ラウンドと同じ計算式・同じ個数・同じ単位から
  // 導かれる「到着済みのはずの位置」を先に求めておく。理論上は
  // initLayoutと完全一致するはずだが、万一わずかでもズレるケースが
  // あった場合に備え、その時だけ瞬間移動ではなく移動アニメーションで
  // 補正できるようにする（一致していれば見た目は何も変わらない）。
  var thisRoundIdx = findHissanRoundIndex(round);
  var prevRoundForArrival = (thisRoundIdx > 0) ? hissanIllusState.rounds[thisRoundIdx - 1] : null;
  var arrivalLayout = (prevRoundForArrival && (prevRoundForArrival.remainder > 0 || (prevRoundForArrival.nextRoundDigit || 0) > 0))
    ? computeHissanTopLayout(round.value, unit)
    : null;
  for(var b = 0; b < round.value; b++){
    var slotPos = hissanTopSlotPos(initLayout, unit, round.value, b);
    var obj = unit.create(unitLabel);
    if (arrivalLayout) {
      var arrivalPos = hissanTopSlotPos(arrivalLayout, unit, round.value, b);
      if (Math.abs(arrivalPos.x - slotPos.x) > 0.5 || Math.abs(arrivalPos.y - slotPos.y) > 0.5) {
        placeHissanBlock(obj.g, arrivalPos.x, arrivalPos.y, initScale, false);
        placeHissanBlock(obj.g, slotPos.x, slotPos.y, initScale, true, 0);
      } else {
        placeHissanBlock(obj.g, slotPos.x, slotPos.y, initScale, false);
      }
    } else {
      placeHissanBlock(obj.g, slotPos.x, slotPos.y, initScale, false);
    }
    gBlocks.appendChild(obj.g);
    obj.origIx = slotPos.x;
    obj.origIy = slotPos.y;
    blockObjs.push(obj);
  }
  // 位置(ix,iy)からブロック1個ぶんの見た目上のバウンディングボックスを求める
  // （anchor==="center"の丸ブロックも、anchor==="topleft"の束・板も共通に扱う。
  //  常に「初期位置(上段)での縮小率 initScale」を掛けたサイズで返す）
  function hissanBlockBox(ix, iy){
    var w = unit.width * initScale, h = unit.height * initScale;
    if(unit.anchor === "center"){
      return { x: ix - w / 2, y: iy - h / 2, w: w, h: h };
    }
    return { x: ix, y: iy, w: w, h: h };
  }
  // objs（blockObjsの一部/全部）の origIx/origIy から、全部を囲む
  // バウンディングボックスを求める（青枠・赤枠どちらの共通処理でも使う）
  function hissanObjsBoundingBox(objs){
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    objs.forEach(function(o){
      var bx = hissanBlockBox(o.origIx, o.origIy);
      minX = Math.min(minX, bx.x); minY = Math.min(minY, bx.y);
      maxX = Math.max(maxX, bx.x + bx.w); maxY = Math.max(maxY, bx.y + bx.h);
    });
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  if(roundStage === 0){
    // まだ配らない：上にまとめて見せたままで終わり。
    return;
  }

  // ---- 6. 配る（round-robinでdivisor人に配り、あまりはあまりトレイへ） ----
  var trayFillCount = new Array(divisor).fill(0);
  var moves = [];
  for(var m = 0; m < round.value; m++){
    var personIdx = m % divisor;
    if(trayFillCount[personIdx] < round.quotient){
      moves.push({ idx: m, person: personIdx });
      trayFillCount[personIdx]++;
    } else {
      moves.push({ idx: m, person: -1 });
    }
  }
  // このラウンドの新規配布は、前のラウンドまでに確定した累積ぶんの
  // 続きのスロット番号から始める（＝先にrenderHissanTrayCommittedで
  // 描画済みのスロットの次から詰めていく。traySlotは section 4で
  // すでに定義済みのものをそのまま使う）。
  var personSlotCounters = new Array(divisor).fill(0).map(function(_, pj){
    return round.trayAccum ? hissanTrayAccumCount(round.trayAccum[pj]) : 0;
  });
  var remBlockObjs = [];
  // 各itemの目的地(target/scale)とdivisor振り分け結果を先に全部決めてしまう
  // （animateBuildの有無に関わらず配布結果そのものは同じ計算式で決まる）。
  // あまりに回った分(person < 0)は、もうあまり専用トレイへは動かさず、
  // 生成時の初期位置(origIx/origIy・上部)にそのまま留める＝target を
  // 自分の元の位置にすることで「動かさない」を表現する。
  var moveTargets = moves.map(function(mv){
    var target, scale;
    if(mv.person >= 0){
      target = traySlot(mv.person, personSlotCounters[mv.person]++);
      scale = traySlotScale;
    } else {
      var srcObj = blockObjs[mv.idx];
      target = { x: srcObj.origIx, y: srcObj.origIy };
      scale = initScale;
      remBlockObjs.push(srcObj);
    }
    return { target: target, scale: scale };
  });

  // ①たてるの配布アニメの基本タイミング（グループ演出の有無に関わらず、
  // moves.length や divisor から一貫した総所要時間を算出できるよう、
  // ここで一度だけ確定させる）
  var moveWait = 320;
  var stepDelay = 45;
  var groupPause = 260; // 1グループの枠予告→移動完了のあと、次グループへ移るまでの間
  // moves配列はm(=0,1,2,...)の順に並んでおり、m%divisorが配布先の人番号
  // なので、divisor個おきに区切ればちょうど「1回に全員へ1個ずつ配る」
  // ぶんのグループになる。最後、割り切れず余った端数ぶんはグループ
  // サイズがdivisorより小さくなり、まとめてあまりトレイへ向かう。
  var hissanBuildGroups = [];
  var hissanBuildTotalDelay = 0;
  for(var gStart = 0; gStart < moves.length; gStart += divisor){
    var groupMoves = moves.slice(gStart, Math.min(gStart + divisor, moves.length));
    hissanBuildGroups.push({ moves: groupMoves, delay: hissanBuildTotalDelay });
    hissanBuildTotalDelay += moveWait + groupMoves.length * stepDelay + groupPause;
  }

  if(animateBuild){
    // ---- 6a. ①たてる：divisor個ずつ（＝1人分ずつ配られるひとかたまり）を
    //          青い点線枠で「これから配るよ」を予告 → 一拍 →
    //          1個ずつ、もといた場所にゴーストを残しながら移動、を
    //          グループ単位で順番に繰り返す（v12のLevel4配布演出を踏襲）。
    //          あまりに回る最後のグループ（person<0）はもう動かさない
    //          （＝上部の元の位置にそのまま残す）ので、枠予告・移動・
    //          ゴーストの演出はスキップし、代わりに下でまとめて
    //          「あまり」の見せ方（remainder-stay-box）を出す。
    var groupPad = 6;
    hissanBuildGroups.forEach(function(group){
      var groupMoves = group.moves;
      if(groupMoves.length && groupMoves[0].person < 0){
        return; // あまりグループ：動かさないので配布アニメ自体を行わない
      }
      var groupObjs = groupMoves.map(function(mv){ return blockObjs[mv.idx]; });
      var gBox = hissanObjsBoundingBox(groupObjs);

      scheduleHissanRound(function(){
        var gFrame = el("g", { class: "hissan-build-frame" });
        var gFrameRect = el("rect", {
          x: gBox.x - groupPad, y: gBox.y - groupPad,
          width: gBox.w + groupPad * 2, height: gBox.h + groupPad * 2,
          rx: 8, class: "group-box-blue"
        });
        gFrame.appendChild(gFrameRect);
        gGhosts.appendChild(gFrame);

        groupMoves.forEach(function(mv, idxInGroup){
          var obj = blockObjs[mv.idx];
          var mt = moveTargets[mv.idx];
          var delay = moveWait + idxInGroup * stepDelay;
          scheduleHissanRound((function(o, t, s){
            return function(){
              var bx = hissanBlockBox(o.origIx, o.origIy);
              gGhosts.appendChild(el("rect", {
                x: bx.x - 2, y: bx.y - 2, width: bx.w + 4, height: bx.h + 4, rx: 5, class: "ghost-box"
              }));
              placeHissanBlock(o.g, t.x, t.y, s, true, 0);
            };
          })(obj, mt.target, mt.scale), delay);
        });

        // 個別ブロックのゴーストだけでなく、配る前に囲んでいた青い
        // 点線の枠自体も、消してしまわずに薄い「枠のゴースト」として
        // その場に残す（＝どこからどれだけ配ったかが後からも分かる）。
        scheduleHissanRound(function(){
          gFrame.style.transition = "opacity .3s ease";
          gFrameRect.setAttribute("class", "group-ghost-box");
          gFrame.style.opacity = "1";
        }, moveWait);
      }, group.delay);
    });
  } else {
    // ---- 6b. ②かける／③ひく（同じラウンドの見せ直し）や④おろす
    //          （既に配り終わっているはず）：配布アニメは流さず、
    //          最終位置へ同期的に（setTimeoutを挟まず）即座に並べる。
    //          setTimeoutを挟むと「一瞬もとの位置が見える」ちらつきが
    //          出るため、ここだけは意図的にscheduleHissanRoundを使わない。
    moves.forEach(function(mv, idx){
      var obj = blockObjs[mv.idx];
      var mt = moveTargets[idx];
      placeHissanBlock(obj.g, mt.target.x, mt.target.y, mt.scale, false, 0);
    });
  }

  // ---- 6.3 あまり：専用トレイへは動かさず、上部の元の位置にそのまま
  //            残っていることが一目でわかるよう、まとめて薄いピンクの
  //            点線枠と「あまり」ラベルを添える ----
  if(remBlockObjs.length){
    var remStayBox = hissanObjsBoundingBox(remBlockObjs);
    var remPad = 6;
    var gRemStay = el("g", { class: "hissan-remainder-stay" });
    gRemStay.appendChild(el("rect", {
      x: remStayBox.x - remPad, y: remStayBox.y - remPad,
      width: remStayBox.w + remPad * 2, height: remStayBox.h + remPad * 2,
      rx: 8, class: "remainder-stay-box"
    }));
    gRemStay.appendChild(el("text", {
      x: remStayBox.x - remPad, y: Math.max(12, remStayBox.y - remPad - 4),
      fill: "#e11d48", "font-size": 9.5, "font-weight": 800, "font-family": "'M PLUS Rounded 1c', sans-serif"
    }, "あまり（ここに残る）"));
    gGhosts.insertBefore(gRemStay, gGhosts.firstChild);
  }

  // ---- 6.4 ②かける：配ったぶん（divisor×quotient個）のもといた場所を
  //            緑の点線枠＋緑のゴーストでまとめて示し、「かける」の
  //            式と答え（divisor×quotient＝product）が図のどの部分に
  //            あたるかが一目でわかるようにする。①たてるのビルド
  //            アニメでは移動元に残るゴーストが、②かけるへ進むと
  //            svg.innerHTML="" で毎回作り直されて消えてしまっていた
  //            ため、ここで同じ内容をあらためて描き直し、消さずに
  //            残す（かつ色を緑にして「かけるの答え」であることを示す）----
  if(phase === "multiply"){
    var multiplyProduct = divisor * round.quotient;
    var multipliedObjs = moves
      .filter(function(mv){ return mv.person >= 0; })
      .map(function(mv){ return blockObjs[mv.idx]; });
    if(multipliedObjs.length){
      var multiplyBox = hissanObjsBoundingBox(multipliedObjs);
      var mPad = 6;
      var gMultiplyFrame = el("g", { class: "hissan-multiply-frame" });
      gMultiplyFrame.appendChild(el("rect", {
        x: multiplyBox.x - mPad, y: multiplyBox.y - mPad,
        width: multiplyBox.w + mPad * 2, height: multiplyBox.h + mPad * 2,
        rx: 8, class: "multiply-source-box"
      }));
      var multiplyTag = el("text", {
        x: multiplyBox.x - mPad, y: Math.max(12, multiplyBox.y - mPad - 4), fill: "#16a34a",
        "font-size": 9.5, "font-weight": 800, "font-family": "'M PLUS Rounded 1c', sans-serif"
      });
      multiplyTag.textContent = divisor + "×" + round.quotient + "＝" + multiplyProduct + "こ";
      gMultiplyFrame.appendChild(multiplyTag);
      gGhosts.appendChild(gMultiplyFrame);

      multipliedObjs.forEach(function(o){
        var bx = hissanBlockBox(o.origIx, o.origIy);
        gGhosts.appendChild(el("rect", {
          x: bx.x - 2, y: bx.y - 2, width: bx.w + 4, height: bx.h + 4, rx: 5, class: "ghost-box-green"
        }));
      });
    }
  }

  // ---- 6.5 ③ひく：もとあった場所（value個ぶん）を赤い点線枠＋ゴーストで
  //            まとめて示し、「ここから引いたんだ」を一拍おいて見せる ----
  if(phase === "subtract"){
    var product = divisor * round.quotient;
    var subtractBox = hissanObjsBoundingBox(blockObjs);
    var framePad = 6;
    var gSubtractFrame = el("g", { class: "hissan-subtract-frame" });
    var subtractRect = el("rect", {
      x: subtractBox.x - framePad, y: subtractBox.y - framePad,
      width: subtractBox.w + framePad * 2, height: subtractBox.h + framePad * 2,
      rx: 8, class: "subtract-source-box"
    });
    var subtractTag = el("text", {
      x: subtractBox.x - framePad, y: Math.max(12, subtractBox.y - framePad - 4), fill: "#dc2626",
      "font-size": 9.5, "font-weight": 800, "font-family": "'M PLUS Rounded 1c', sans-serif"
    });
    subtractTag.textContent = "ここから " + product + "こ ひくよ";
    gSubtractFrame.appendChild(subtractRect);
    gSubtractFrame.appendChild(subtractTag);
    gGhosts.appendChild(gSubtractFrame);

    blockObjs.forEach(function(o){
      var bx = hissanBlockBox(o.origIx, o.origIy);
      gGhosts.appendChild(el("rect", {
        x: bx.x - 2, y: bx.y - 2, width: bx.w + 4, height: bx.h + 4, rx: 5, class: "ghost-box"
      }));
    });

    // 一拍おいてから、枠とゴーストをふわっと落ち着かせる
    // （＝「引き終わった」ことを示しつつ、跡はうっすら残す）
    scheduleHissanRound(function(){
      gGhosts.style.transition = "opacity .5s ease";
      gGhosts.style.opacity = "0.45";
    }, 600);
  }

  if(roundStage === 1) return;

  // ---- 7. バラす：あまりの束を「ポン！」と弾けさせて、次の位の単位で
  //          10倍の個数のブロックへ変身させる。＋次の桁ぶんもいっしょに
  //          並べる（多い時は自動で縮小・複数行に折り返して見切れを防ぐ）----
  var nextUnit = getPlaceValueUnit(round.exponent - 1);
  var nextUnitLabel = formatPlaceValueLabel(round.exponent - 1);
  var nextDigit = view.nextDigit || 0;
  var totalNext = round.remainder * 10 + nextDigit;

  // ④おろす（roundStage 2）はもう配布アニメを流していない（animateBuildは
  // phase==="build"のときだけ）ので、長い待ちは不要。一拍だけ置いてから
  // バラす演出に入る。animateBuild時は、グループごとの枠演出がすべて
  // 終わるまでの総所要時間（hissanBuildTotalDelay）を待ってから進める。
  var fadeDelayBase = animateBuild ? (hissanBuildTotalDelay + 200) : 300;

  // 最終的に並ぶ行（totalNext個）のレイアウトを先に決めておく
  // （多い時は自動で縮小・複数行に折り返し、見切れを防ぐ）
  // 次のラウンドの①たてる／隠す（initLayout）とビットまで同一の計算式
  // （computeHissanTopLayout/hissanTopSlotPos）を使う。totalNextは
  // 次のラウンドのround.valueと必ず一致するので、これで「おろす」の
  // 最終位置と次のラウンドの初期位置が完全に一致し、ラウンドの境目でも
  // 同一画面のままシームレスに繋がる。
  var nextLayout = computeHissanTopLayout(totalNext, nextUnit);
  var nextGridH = nextLayout.rows * nextLayout.stepY;
  var nextGridTopY = nextLayout.topY;
  function nextSlotPos(n){
    return hissanTopSlotPos(nextLayout, nextUnit, totalNext, n);
  }
  // 画面には常に「1人目・2人目…」のトレイ（trayY 〜 trayY+trayH）が
  // 表示され続けているため、次の桁ブロックの並びだけを基準にすると
  // トレイの文字とキャプションが重なってしまう。トレイの下端も
  // 考慮して、必ずそれより下に出す。
  var captionY = Math.max(172, nextGridTopY + nextGridH + 14, trayY + trayH + 14);

  if(hasRem){
    // ---- 7a. あまりの束を、今いる場所（あまりトレイの中）でパルスさせて
    //          注目させてから、1個ずつ「ポン！」と弾けさせ、その場所から
    //          次の位のブロックが10個生まれて最終位置へ飛んでいく ----
    remBlockObjs.forEach(function(o){
      scheduleHissanRound(function(){
        o.inner.classList.add("ten-rem-pulse");
      }, fadeDelayBase);
    });

    var burstStepDelay = 150;
    var burstStart = fadeDelayBase + 500;
    var nextSlotCounter = 0;
    remBlockObjs.forEach(function(o, rIdx){
      var burstAt = burstStart + rIdx * burstStepDelay;
      var slotsForThisBundle = [];
      for(var s = 0; s < 10; s++){ slotsForThisBundle.push(nextSlotCounter++); }
      // あまりはもうトレイへ動かしていない（元の上部の位置に残ったまま）
      // ので、弾ける起点はブロック自身の元の位置(origIx/origIy)と
      // 初期スケール(initScale)を使う。
      var rt = { x: o.origIx, y: o.origIy, scale: initScale };
      scheduleHissanRound((function(obj, slots, origin){
        return function(){
          obj.inner.classList.remove("ten-rem-pulse");
          obj.inner.classList.add("bundle-burst");
          playSound('chariin');
          var rw = unit.width * origin.scale, rh = unit.height * origin.scale;
          var cx = (unit.anchor === "center") ? origin.x : origin.x + rw / 2;
          var cy = (unit.anchor === "center") ? origin.y : origin.y + rh / 2;
          slots.forEach(function(slotN, k){
            scheduleHissanRound(function(){
              var oneObj = nextUnit.create(nextUnitLabel);
              var sx = (nextUnit.anchor === "center") ? cx : cx - (nextUnit.width * nextLayout.scale) / 2;
              var sy = (nextUnit.anchor === "center") ? cy : cy - (nextUnit.height * nextLayout.scale) / 2;
              placeHissanBlock(oneObj.g, sx, sy, nextLayout.scale * 0.5, false, 0);
              oneObj.g.style.opacity = "0";
              gBlocks.appendChild(oneObj.g);
              scheduleHissanRound(function(){
                var slot = nextSlotPos(slotN);
                oneObj.g.style.opacity = "1";
                placeHissanBlock(oneObj.g, slot.x, slot.y, nextLayout.scale, true, 0);
              }, 40);
            }, 60 + k * 20);
          });
        };
      })(o, slotsForThisBundle, rt), burstAt);
    });

    // 束じたいはポンと弾けたあと、お片付け（非表示）
    scheduleHissanRound(function(){
      remBlockObjs.forEach(function(o){ o.g.style.display = "none"; });
    }, burstStart + remBlockObjs.length * burstStepDelay + 600);
  }

  // 次の桁ぶん（すでに書かれていた数字だが、まだ中身は見せない分）は、
  // 1個ずつフェードインさせるのではなく、最初から最終位置（nextSlotPos）に
  // 並べたうえで、その上に半透明カバーをかぶせて「隠したまま運ばれてくる
  // ブロックのかたまり」として1つの<g>にまとめる。この<g>ごと画面右外に
  // 一旦ずらしておき、あまりバーストと同時に、本来の位置まで等速
  // （linear）でスライドインさせる（＝カバーの下にはもう実物のブロックが
  // 正しい位置に並んでいて、カバーごと運ばれてくるだけ、という状態）。
  // カバーを実際にめくって中身を見せるところ（右へスライドさせて
  // 外す）までも、俯瞰ビューへ切り替えず、このステップ内で同じ画面の
  // まま続けて再生する（下のgCoverOverlayスライドアウト参照）。
  var digitStart = fadeDelayBase;
  var digitSlotStart = round.remainder * 10;
  var slideDuration = hasRem ? (remBlockObjs.length * burstStepDelay + 600) : 500;
  if (nextDigit > 0) {
    var gNextDigitCovered = el("g", { class: "hissan-next-digit-covered" });
    var ndMinX = Infinity, ndMinY = Infinity, ndMaxX = -Infinity, ndMaxY = -Infinity;
    for (var nd = 0; nd < nextDigit; nd++) {
      var slot = nextSlotPos(digitSlotStart + nd);
      var oneObj = nextUnit.create(nextUnitLabel);
      placeHissanBlock(oneObj.g, slot.x, slot.y, nextLayout.scale, false, 0);
      gNextDigitCovered.appendChild(oneObj.g);
      var nw = nextUnit.width * nextLayout.scale, nh = nextUnit.height * nextLayout.scale;
      var nbx = (nextUnit.anchor === "center") ? (slot.x - nw / 2) : slot.x;
      var nby = (nextUnit.anchor === "center") ? (slot.y - nh / 2) : slot.y;
      ndMinX = Math.min(ndMinX, nbx); ndMinY = Math.min(ndMinY, nby);
      ndMaxX = Math.max(ndMaxX, nbx + nw); ndMaxY = Math.max(ndMaxY, nby + nh);
    }
    var padX = 5, padY = 5;
    var gCoverOverlay = el("g", { class: "hissan-next-digit-cover-overlay" });
    gCoverOverlay.appendChild(el("rect", {
      x: ndMinX - padX, y: ndMinY - padY,
      width: (ndMaxX - ndMinX) + padX * 2, height: (ndMaxY - ndMinY) + padY * 2,
      rx: 8, fill: "#fde047", stroke: "#eab308", "stroke-width": 1.5, opacity: 0.5
    }));
    gCoverOverlay.appendChild(middleText((ndMinX + ndMaxX) / 2, (ndMinY + ndMaxY) / 2 + 5,
      "？", null, { size: 16, weight: 800, fill: "#a16207", opacity: 0.85 }));
    gNextDigitCovered.appendChild(gCoverOverlay);
    gBlocks.appendChild(gNextDigitCovered);

    var slideStart = Math.max(70, 460 - ndMinX + 20);
    gNextDigitCovered.style.transform = "translateX(" + slideStart + "px)";
    gNextDigitCovered.style.transition = "none";
    scheduleHissanRound(function(){
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          gNextDigitCovered.style.transition = "transform " + (slideDuration / 1000) + "s linear";
          gNextDigitCovered.style.transform = "translateX(0px)";
        });
      });
    }, digitStart);

    // スライドインが終わったら、同じ画面のまま続けて、カバー
    // （半透明長方形＋「？」）だけを右へスライドアウトさせて
    // 中身（実物のブロック）を見せる。以前はここで止まり、次の
    // ラウンドの「hide」ステップ側でめくる演出だったが、俯瞰
    // ビューへの切り替えを挟まず1画面で完結させるため、ここで
    // 続けて再生する。
    var uncoverStart = digitStart + slideDuration + 200;
    var uncoverShift = Math.max(70, (ndMaxX - ndMinX) + 50);
    var uncoverDuration = 500;
    scheduleHissanRound(function(){
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          gCoverOverlay.style.transition = "transform " + (uncoverDuration / 1000) + "s cubic-bezier(0.55,0.06,0.68,0.19), opacity " + (uncoverDuration / 1000) + "s ease .1s";
          gCoverOverlay.style.transform = "translateX(" + uncoverShift + "px)";
          gCoverOverlay.style.opacity = "0";
        });
      });
    }, uncoverStart);
    scheduleHissanRound(function(){
      if (gCoverOverlay.parentNode) gCoverOverlay.parentNode.removeChild(gCoverOverlay);
    }, uncoverStart + uncoverDuration + 50);
  }

  // キャプション（式）は、全ブロックが出そろったころに表示
  var capText = hasRem
    ? (nextUnitLabel + "が" + (round.remainder * 10) + "こ分（＝" + unitLabel + "が" + round.remainder + "こ分）＋ つぎの位の " + nextDigit + " ＝ " + nextUnitLabel + "が" + totalNext + "こ分")
    : ("つぎの位の " + nextDigit + " を、そのままおろします");
  var capDelay = hasRem
    ? (burstStart + remBlockObjs.length * burstStepDelay + 650)
    : (digitStart + (nextDigit > 0 ? slideDuration : 0) + 250);
  if (nextDigit > 0) {
    // カバーのスライドアウトが終わってから見せる（演出とキャプション
    // が同時に重ならないようにする）。
    capDelay = Math.max(capDelay, uncoverStart + uncoverDuration + 150);
  }
  scheduleHissanRound(function(){
    var gCap = el("g", { class: "fade-in" });
    gCap.appendChild(middleText(230, captionY, capText, null, { size: 10.5, weight: 800, fill: "#64748b" }));
    svg.appendChild(gCap);
  }, capDelay);
}

// ==================================================================
// 「かくす」半透明黄色カバー（フルリビール導入演出）
// ------------------------------------------------------------------
// renderHissanRound は「今のラウンドで扱う1桁」だけを抽象化された
// ブロック（100/10/1のかたまり）として見せる。ここではそれとは別に、
// 問題全体でいちばん最初のラウンドが始まる瞬間だけ「わられる数
// ぜんぶ」を実物の桁ブロックで一度きちんと見せたうえで（＝全部
// 見せる）、まだ手をつけない桁の上に半透明の黄色いカバーをかぶせて
// 隠す（＝100の位以外を隠す、など）演出を行う。ラウンドが1つ進む
// （＝次のラウンドの「①たてる」に入る）たびに、次に使う桁の
// カバーだけを1枚めくって外す（buildHissanIllustration 参照）。
//
// renderHissanRound の内部（ラウンドの値をどう配るか）には一切
// 立ち入らない。時間軸のうえでは「①このリビール演出（全部見せる→
// カバーをかける）→②1ラウンド目のrenderHissanRound演出→
// ③次の桁のカバーを1枚外す→④2ラウンド目のrenderHissanRound演出→
// …」という形で交互に呼び出される。
// ==================================================================
var hissanRevealTimers = [];
function clearHissanRevealTimers(){
  hissanRevealTimers.forEach(function(t){ clearTimeout(t); });
  hissanRevealTimers = [];
}
function scheduleHissanReveal(fn, delay){
  hissanRevealTimers.push(setTimeout(fn, delay));
}

// 半透明の黄色いカバー（かくす）を1枚作る。col は layoutFullRevealBlocks()
// が返す column オブジェクト（left/right/exponentなどを持つ）。
function createHissanCoverEl(col){
  // ブロックは layoutFullRevealBlocks() の centerY(=128) を中心に
  // 上下対称に配置される（一番大きい100のいたで高さ32＝半分16、
  // 1000のいたは高さ40＝半分20）。カバーもこのcenterYを中心に、
  // 一番背の高いブロックより余裕を持って覆う必要がある。以前は
  // ここが100固定になっており、実際のブロック中心(128)とズレて
  // いたため、100のいたなど背の高いブロックがカバーの下からはみ
  // 出して隠しきれていなかった。
  // 不透明度はあえて低め(0.5)にしてあり、カバーの下の桁ブロックが
  // うっすら透けて見えるようにしている（＝「なにが隠れているか」を
  // 児童が薄く推測できるようにするための意図的な調整）。
  var padX = 5, centerY = 128, halfH = 28, top = centerY - halfH, bottom = centerY + halfH;
  var g = el("g", { class: "hissan-digit-cover" });
  g.appendChild(el("rect", {
    x: col.left - padX, y: top, width: (col.right - col.left) + padX * 2, height: bottom - top,
    rx: 8, fill: "#fde047", stroke: "#eab308", "stroke-width": 1.5, opacity: 0.5
  }));
  g.appendChild(middleText(Math.round((col.left + col.right) / 2), (top + bottom) / 2 + 5,
    "？", null, { size: 20, weight: 800, fill: "#a16207", opacity: 0.85 }));
  return g;
}

// fullDigits（例：[7,5,6,4]）を layoutFullRevealBlocks で並べ、左から
// revealedCount 桁ぶんはカバー無し、残りはカバーありの状態を「状態
// として一発で」描画する（アニメ無し）。戻り値のstateはこの後
// uncoverHissanNextColumn() に渡して使う。
//
// カバーが右からスライドインしてくる演出自体は、直前の「④おろす」
// ステップ（renderHissanRoundのdropフェーズ）側であまりバーストと
// 同時に再生済みなので、ここでは常に静止状態でカバーを置くだけでよい。
function renderHissanRevealCovers(svg, fullDigits, revealedCount, startExponent, displayValue){
  svg.setAttribute("viewBox", "0 0 460 275");
  svg.innerHTML = "";
  var columns = layoutFullRevealBlocks(fullDigits, startExponent);
  var gAll = el("g", { class: "fade-in" });
  var dividendStr = (displayValue !== undefined && displayValue !== null) ? String(displayValue) : fullDigits.join("");
  var visibleUnitColumns = columns.filter(function(col){ return col.count > 0; });
  var unitLabelWords = (visibleUnitColumns.length ? visibleUnitColumns : columns)
    .map(function(col){ return formatPlaceValueLabel(col.exponent); }).join("・");
  var titleText = dividendStr + " を " + unitLabelWords + " で みてみよう！";
  var titleSize = calcSvgFontSize(titleText, 410, 14, 9.5);
  gAll.appendChild(middleText(230, 30, titleText, null, { size: titleSize, weight: 800 }));
  columns.forEach(function(col) {
    col.coords.forEach(function(pt) {
      var obj = col.unit.create(formatPlaceValueLabel(col.exponent));
      moveEl(obj.g, pt.x, pt.y, false);
      // 4けた（千の位）などで自動縮小されている場合、translateのあとに
      // scale()を続けて付与する。SVGのtransformは右側の変換から先に
      // ローカル座標へ適用されるため、scaleの原点はtranslate後の
      // (pt.x, pt.y)＝レイアウト計算で使ったのと同じ基準点になり、
      // 位置がずれない。
      if (pt.scale && pt.scale !== 1) {
        obj.g.style.transform += " scale(" + pt.scale + ")";
      }
      gAll.appendChild(obj.g);
    });
  });
  svg.appendChild(gAll);

  var gCovers = el("g", { class: "hissan-covers-layer" });
  svg.appendChild(gCovers);
  var covers = [];
  columns.forEach(function(col, idx) {
    if (idx < revealedCount || col.count === 0) return;
    var cov = createHissanCoverEl(col);
    gCovers.appendChild(cov);
    covers.push({ col: col, g: cov });
  });

  return { svg: svg, fullDigits: fullDigits, columns: columns, revealedCount: revealedCount, gAll: gAll, gCovers: gCovers, covers: covers };
}

// 導入演出：まず全部の桁ブロックをフェードインで見せて、少し間を
// 置いてから、先頭の1桁（revealedCount=1）以外の桁へ黄色いカバーを
// 左から順にフェードインでかぶせる。すべて置き終わったら
// onDone(state) を呼ぶ。stateはこのあとuncoverHissanNextColumn()へ
// 渡して使い続ける。
function playHissanRevealIntro(svg, fullDigits, onDone){
  clearHissanRevealTimers();
  var state = renderHissanRevealCovers(
    svg,
    fullDigits,
    fullDigits.length,
    hissanIllusState.fullStartExponent,
    hissanIllusState.fullDisplayValue
  ); // まずはカバー無しで全部見せる
  state.revealedCount = 1; // 実際に最初のラウンドで使うのは先頭の1桁だけ

  scheduleHissanReveal(function(){
    var covers = [];
    state.columns.forEach(function(col, idx){
      if (idx < state.revealedCount || col.count === 0) return;
      var cov = createHissanCoverEl(col);
      cov.style.opacity = "0";
      cov.style.transition = "opacity .4s ease";
      state.gCovers.appendChild(cov);
      covers.push({ col: col, g: cov });
    });
    state.covers = covers;
    requestAnimationFrame(function(){
      covers.forEach(function(c, i){
        scheduleHissanReveal(function(){ c.g.style.opacity = "1"; }, i * 120);
      });
    });
    scheduleHissanReveal(function(){ if (onDone) onDone(state); }, covers.length * 120 + 500);
  }, 900);

  return state;
}

// 次に使う桁（columns[state.revealedCount]）のカバーを1枚だけ、
// その場でフェードアウトさせるのではなく、半透明カバーを右方向へ
// ずらしてめくって外す（＝カバーの下のブロックが右からだんだん
// 見えてくる演出）。stateを直接書き換え、完了したらonDone(state)を
// 呼ぶ。外すべきカバーがもう無ければ何もせず即onDone(state)を呼ぶ。
function uncoverHissanNextColumn(state, onDone){
  clearHissanRevealTimers();
  var nextIdx = state.revealedCount;
  var target = null;
  for (var i = 0; i < state.covers.length; i++) {
    if (state.columns.indexOf(state.covers[i].col) === nextIdx) { target = state.covers[i]; break; }
  }
  if (!target) {
    state.revealedCount++;
    if (onDone) scheduleHissanReveal(function(){ onDone(state); }, 0);
    return;
  }
  var shiftDist = Math.max(70, (target.col.right - target.col.left) + 50);
  target.g.style.transition = "transform .5s cubic-bezier(0.55,0.06,0.68,0.19), opacity .5s ease .1s";
  scheduleHissanReveal(function(){
    target.g.style.transform = "translateX(" + shiftDist + "px)";
    target.g.style.opacity = "0";
  }, 0);
  scheduleHissanReveal(function(){
    if (target.g.parentNode) target.g.parentNode.removeChild(target.g);
    state.covers = state.covers.filter(function(c){ return c !== target; });
    state.revealedCount++;
    if (onDone) onDone(state);
  }, 550);
}

// 現在の hissanIllusState.rounds の中で、渡されたラウンド（参照）が
// 何番目（0始まり）かを調べる。各ラウンドオブジェクトは問題ごとに
// 一度しか作られない（buildHissanRoundsList参照）ので、参照比較でよい。
function findHissanRoundIndex(round) {
  var rounds = hissanIllusState.rounds;
  for (var i = 0; i < rounds.length; i++) {
    if (rounds[i] === round) return i;
  }
  return -1;
}

function buildHissanIllustration(step) {
  if (!step || !step.hissanRound) return;
  clearHissanIllusTimers();
  clearHissanRoundTimers();
  clearHissanRevealTimers();

  var round = step.hissanRound;
  var phase = step.phase; // "cover" | "hide" | "skip" | "build-zero" | "build" | "multiply" | "subtract" | "drop"
  var roundIdx = findHissanRoundIndex(round);
  var isFirstRoundOfProblem = (roundIdx === 0);
  var nextDigit = (round.nextRoundDigit !== undefined) ? round.nextRoundDigit : 0;
  var renderRound = (round.kind === "quotitive") ? renderHissanRoundQuotitive : renderHissanRound;

  // ==================================================================
  // 「かくす」＝隠れた状態そのものを見せる、独立したステップ。
  // ------------------------------------------------------------------
  // 以前はこの演出（全部見せる→カバーをかける／カバーを1枚めくる）が
  // 「①ひらめき九九チェック（hide）」ステップに入る直前に自動で
  // 一瞬だけ再生され、ユーザーが「隠れている状態」で止まって見ることが
  // できなかった。今は専用の"cover"フェーズとして独立したステップに
  // なっており、ここで再生が止まる（＝隠れた状態のまま「つぎへ」を
  // 待つ）。実際にめくる（uncover）のは次の"hide"ステップ側で行う。
  // ==================================================================
  if (phase === "cover") {
    if (isFirstRoundOfProblem && !hissanIllusState.hasPlayedFullReveal
        && hissanIllusState.fullDigits && hissanIllusState.fullDigits.length > 1) {
      // 問題全体で最初の1回だけ：実物の桁ブロックを全部見せてから、
      // まだ使わない桁に半透明カバーをかぶせるところまでをこの
      // ステップ内で完結させる（以前のようにraundStage0のビューへ
      // 自動で進まない＝ここで止まる）。
      hissanIllusState.hasPlayedFullReveal = true;
      playHissanRevealIntro(hissanSvg, hissanIllusState.fullDigits, null);
      return;
    }
    // 2桁目以降の"cover"ステップは今は生成されない（途中の俯瞰
    // ビューは廃止）。念のためのフォールバックとして通常表示へ。
    renderRound(hissanSvg, round, { roundStage: 0, phase: "hide" });
    return;
  }

  if (phase === "hide" || phase === "hide-check") {
    // 2桁目以降の「隠れていたブロックを見せる」演出は、直前の
    // 「④おろす」ステップ（renderHissanRoundのdropフェーズ）側で、
    // 俯瞰ビューへ切り替えずに同じ画面のまま完結させるようになった
    // （カバー付きブロックがスライドイン→カバーだけが右へスライド
    // アウトして中身が見える）。そのため、ここでは俯瞰レイアウトへの
    // 切り替え・めくり演出はもう行わず、そのままこのラウンド専用の
    // ビューへ切り替えるだけでよい。
    renderRound(hissanSvg, round, { roundStage: 0, phase: "hide" });
    return;
  }

  if (phase === "skip" || phase === "build-zero" || phase === "build") {
    // ①たてる：まだ配っていない状態から、divisor人に配る（or 商0で
    // 全部あまりトレイへ）様子をアニメーションで見せる。
    renderRound(hissanSvg, round, { roundStage: 1, phase: "build", forward: true });
    return;
  }

  if (phase === "trial-build" || phase === "trial-multiply" || phase === "trial-fix") {
    // かりの商を試している最中（まだ正しい商が確定していない）。
    // 実際の試行錯誤は筆算マス目とかりの商パネル側で見えるので、
    // 図解はまだ「たしかめ中」のニュートラルな状態のままにしておく。
    renderRound(hissanSvg, round, { roundStage: 0, phase: "hide" });
    return;
  }

  if (phase === "multiply") {
    // ②かける：配り終えたスナップショットのまま、式バッジだけ切り替える。
    renderRound(hissanSvg, round, { roundStage: 1, phase: "multiply", forward: false });
    return;
  }

  if (phase === "subtract") {
    // ③ひく：同じスナップショットのまま、あまりを強調して式バッジを切り替える。
    renderRound(hissanSvg, round, { roundStage: 1, phase: "subtract", forward: false });
    return;
  }

  if (phase === "drop") {
    // ④おろす：あまりの束を10こずつバラして、次の桁と合体させる。
    // 「次に使う桁のカバーを外す」演出は、次のラウンドの「hide」に
    // 入る直前（このラウンド自身がなく次ラウンドへ直接進む場合も
    // 含めて一本化）でまとめて行う。
    renderRound(hissanSvg, round, { roundStage: 2, phase: "drop", forward: true, nextDigit: nextDigit });
    return;
  }
}


// appState.steps から、重複のない「1ラウンド＝1桁」のリストを出現順に
// 作る（各ラウンドの hissanRound オブジェクトは、そのラウンドに属する
// 全ステップ（hide/build/multiply/subtract/drop）で同一の参照を共有して
// いるので、参照の変わり目で区切ればよい）。
// 合わせて、各ラウンドの trayAccum（このラウンドより前に確定した
// 配布累積）と nextRoundDigit（次のラウンドの digit。無ければ0）を、
// 再生を始める前に一括で確定させる（＝ナビゲーション方向に依存しない）。
function buildHissanRoundsList(appState) {
  var rounds = [];
  var lastRound = null;
  appState.steps.forEach(function(step){
    if (!step.hissanRound) return;
    if (step.hissanRound !== lastRound) {
      rounds.push({ round: step.hissanRound });
      lastRound = step.hissanRound;
    }
  });
  computeHissanRoundsTrayAccum(rounds);
  hissanIllusState.trayCapacityLayout = computeHissanTrayCapacityLayout(rounds);
  for (var i = 0; i < rounds.length; i++) {
    rounds[i].round.nextRoundDigit = (i + 1 < rounds.length) ? rounds[i + 1].round.digit : 0;
  }
  return rounds.map(function(rd){ return rd.round; });
}

// 説明アプリ側の「図解を表示するステップ判定」と読み上げキャプション。
function computeHissanViewForStep(step) {
    if (!step || !step.hissanRound || step.phase === "cover") return null;
    const round = step.hissanRound;
    const nextDigit = (round.nextRoundDigit !== undefined) ? round.nextRoundDigit : 0;
    if (step.phase === "hide" || step.phase === "hide-check" || step.phase === "trial-build" || step.phase === "trial-multiply" || step.phase === "trial-fix") {
        return { round, roundStage: 0, phase: "hide" };
    }
    if (step.phase === "skip" || step.phase === "build-zero" || step.phase === "build") return { round, roundStage: 1, phase: "build" };
    if (step.phase === "multiply") return { round, roundStage: 1, phase: "multiply" };
    if (step.phase === "subtract") return { round, roundStage: 1, phase: "subtract" };
    if (step.phase === "drop") return { round, roundStage: 2, phase: "drop", nextDigit };
    return null;
}
function computeHissanBadgeText(round, view) {
    if (!round || !view) return "";
    const hasRem = round.remainder > 0;
    const unitLabel = formatPlaceValueLabel(round.exponent);
    const quotitive = round.kind === "quotitive";
    if (view.roundStage === 0) {
        return quotitive
            ? `${unitLabel}が ${round.value}こ。${round.divisor}こずつの まとまりが いくつできるかな？`
            : `${unitLabel}が ${round.value}こ。${round.divisor}人に くばるとどうなるかな？`;
    }
    if (view.roundStage === 1) {
        if (view.phase === "multiply") return `②かける：${round.divisor}×${round.quotient}＝${round.divisor * round.quotient}`;
        if (view.phase === "subtract") return hasRem
            ? `③ひく：${round.value}－${round.divisor * round.quotient}＝${round.remainder}（あまり）`
            : `③ひく：${round.value}－${round.divisor * round.quotient}＝0（ぴったり）`;
        if (round.quotient === 0) return quotitive
            ? `①たてる：${round.divisor}こずつの まとまりは まだ1つもできない（商は0）`
            : `①たてる：${round.divisor}人には まだくばれない（商は0）`;
        return quotitive
            ? `①たてる：${round.divisor}こずつの まとまりが ${round.quotient}こできる`
            : `①たてる：${round.divisor}人に 1人${round.quotient}こずつ`;
    }
    if (view.roundStage === 2) {
        return hasRem
            ? `④おろす：のこった ${round.remainder}こぶんを10こずつバラして、次の位と合体`
            : `④おろす：次の位の ${view.nextDigit || 0} をおろす`;
    }
    return "";
}
function getIllustrationCaptionText(step) {
    const view = computeHissanViewForStep(step);
    return view ? computeHissanBadgeText(view.round, view) : "";
}

// フル図解エンジン移植ここまで

function applyStepUI() {
    clearAllHighlightClasses();
    cancelQuotientDotAnimation();
    clearSvg(); 
    document.getElementById('fusen').style.display = "none";
    if (!appState || appState.steps.length === 0) return;

    for (let r = 0; r < appState.totalRows; r++) {
        for (let c = 0; c < appState.totalCols; c++) {
            if (gridData[r] && gridData[r][c]) {
                gridData[r][c].isDropping = false;
            }
        }
    }
    for (let c = 0; c < appState.totalCols; c++) {
        if (gridData[0] && gridData[0][c]) {
            gridData[0][c].hasSlash = false;
            gridData[0][c].topChar = "";
            gridData[0][c].isRedBorder = false;
            // ★バグ修正: 「もどる」ボタン時にも isGuide をリセット対象に含める
            // （row=0のisGuideは毎ステップ再適用されるため、ここで一旦クリアしても問題ない）
            gridData[0][c].isGuide = false;
        }
    }

    drawDivisionCurve();

    const step = appState.steps[currentStepIdx];
    const narrationEl = document.getElementById('narration');
    const escapedDesc = String(step.description)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    narrationEl.innerHTML = escapedDesc + (step.formulaHtml || "");
    // ★読み上げは図解の表示タイミング設定に応じてこの関数の最後でまとめて行う（下部参照）。
    updateStepFlow(step);

    const brainCard = document.getElementById('brain-work');
    if (step.brainHtml) {
        brainCard.innerHTML = step.brainHtml;
        brainCard.style.display = "block";
    } else {
        brainCard.style.display = "none";
    }

    if (step.writeCells) {
        step.writeCells.forEach(wc => {
            if (gridData[wc.r] && gridData[wc.r][wc.c]) {
                gridData[wc.r][wc.c].char = wc.char;

                // ★バグ修正: isGuideフラグを正しく上書きする。
                // "✕"以外の文字（"0"など実際の商）が書き込まれるときは必ずisGuideをfalseにリセットする。
                // これにより、先にskipで✕が書かれたマスに後からbuild-zeroで"0"が書かれても
                // ✕として描画されてしまうバグが解消される。
                if (wc.isGuide) {
                    gridData[wc.r][wc.c].isGuide = true;
                } else {
                    // isGuideが明示されていない＝普通の数字なので、必ずfalseにリセット
                    gridData[wc.r][wc.c].isGuide = false;
                }

                if (Object.prototype.hasOwnProperty.call(wc, 'borderBottom')) {
                    gridData[wc.r][wc.c].borderBottom = !!wc.borderBottom;
                }
                if (Object.prototype.hasOwnProperty.call(wc, 'isNewZero')) {
                    gridData[wc.r][wc.c].isNewZero = !!wc.isNewZero;
                }

                if (wc.hasSlash) gridData[wc.r][wc.c].hasSlash = true;
                if (wc.topChar) gridData[wc.r][wc.c].topChar = wc.topChar;
                if (wc.isRedBorder) gridData[wc.r][wc.c].isRedBorder = true;

                if ((step.phase === "drop" || step.phase === "remainder-drop") && wc.r > 1) {
                    gridData[wc.r][wc.c].isDropping = true;
                    gridData[wc.r][wc.c].dropDistance = (wc.r - 1) * 46; 
                }
            }
        });
        renderGridStructure();
    }

    if ((step.phase === "drop" || step.phase === "remainder-drop") && step.writeCells) {
        step.writeCells.forEach(wc => {
            if (wc.r > 1) {
                drawDropArrow(1, wc.c, wc.r, wc.c); 
            }
        });
    }

    drawDecimalDots(step);

    // ★工程別の数字強調（たてる＝青／かける＝緑／ひく＝赤／おろす＝橙）を適用。
    // highlightCellsが定義されているステップではこちらを優先し、
    // 従来のオレンジ単色パルス（pulseBoxes / active-target）は使わない。
    // highlightCellsが無いステップ（init, move-dots, quotient-dot, round-off, complete など
    // 4工程の外側にある特殊な手順）でのみ、従来通りpulseBoxesでオレンジ表示する。
    if (step.highlightCells && step.highlightCells.length > 0) {
        step.highlightCells.forEach(hc => {
            const target = document.getElementById(`cell-${hc.r}-${hc.c}`);
            if (!target) return;
            const cls = hc.isNew ? `hl-new-${hc.color}` : `hl-ref-${hc.color}`;
            target.classList.add(cls);
        });
    } else if (step.pulseBoxes && step.pulseBoxes.length > 0) {
        step.pulseBoxes.forEach(box => {
            const target = document.getElementById(`cell-${box.r}-${box.c}`);
            if (target) target.classList.add('active-target');
        });
    }

    if (step.maskFromCol !== null && step.maskFromCol < appState.totalCols) {
        const fusen = document.getElementById('fusen');
        const containerRect = document.getElementById('notebook-container').getBoundingClientRect();
        const startCellRect = document.getElementById(`cell-0-${step.maskFromCol}`).getBoundingClientRect();
        const endCellRect = document.getElementById(`cell-${appState.totalRows-1}-${appState.totalCols-1}`).getBoundingClientRect();

        if (startCellRect && endCellRect) {
            const sc = stageScale();
            fusen.style.left = ((startCellRect.left - containerRect.left) / sc) + "px";
            fusen.style.top = ((startCellRect.top - containerRect.top) / sc) + "px";
            fusen.style.width = ((endCellRect.right - startCellRect.left) / sc) + "px";
            fusen.style.height = ((endCellRect.bottom - startCellRect.top) / sc) + "px";
            fusen.style.display = "block";
        }
    }

    // ===== 図解パネルの表示・タイミング・読み上げ順の制御 =====
    clearIllusTimingTimers();
    const illusPanelEl = document.getElementById('hissanIllustrationPanel');
    const isCoverPhase = (step.phase === "cover");
    const illusView = isCoverPhase ? true : computeHissanViewForStep(step);
    const illusAvailable = illusEnabled && !!illusView;

    const narrationRaw = convertTextForSpeech(step.description || "") +
        (step.formulaHtml ? "。" + convertTextForSpeech(step.formulaHtml) : "");

    if (!illusAvailable) {
        if (illusPanelEl) illusPanelEl.style.display = "none";
        clearHissanIllusTimers(); clearHissanRoundTimers(); clearHissanRevealTimers();
        setHissanSideOpacity(true);
        speakText(narrationRaw, { raw: true });
    } else if (isCoverPhase) {
        // 導入演出は常に「図解を見せながら」＝同時扱い（筆算側の書き込みが無いステップのため）
        if (illusPanelEl) illusPanelEl.style.display = "flex";
        setHissanSideOpacity(true);
        buildHissanIllustration(step);
        speakText(narrationRaw, { raw: true });
    } else {
        const captionRaw = convertTextForSpeech(getIllustrationCaptionText(step));
        if (illusOrderMode === "hissan-first") {
            // 筆算 → 図解：まず筆算の説明だけを見せて読み上げ、その後で図解を出す
            if (illusPanelEl) illusPanelEl.style.display = "none";
            setHissanSideOpacity(true);
            speakThenRun(narrationRaw, () => {
                if (illusPanelEl) illusPanelEl.style.display = "flex";
                buildHissanIllustration(step);
                if (captionRaw) speakText(captionRaw, { raw: true });
            });
        } else if (illusOrderMode === "illus-first") {
            // 図解 → 筆算：先に図解を見せて読み上げ、その後で筆算側をあらわす
            if (illusPanelEl) illusPanelEl.style.display = "flex";
            setHissanSideOpacity(false);
            buildHissanIllustration(step);
            speakThenRun(captionRaw || narrationRaw, () => {
                setHissanSideOpacity(true);
                speakText(narrationRaw, { raw: true });
            });
        } else {
            // 同時に表示：筆算の説明を読み上げた後に続けて図解の説明を読む
            if (illusPanelEl) illusPanelEl.style.display = "flex";
            setHissanSideOpacity(true);
            buildHissanIllustration(step);
            speakText(narrationRaw, { raw: true });
            if (captionRaw) speakText(captionRaw, { raw: true, noCancel: true });
        }
    }
}

function setHissanSideOpacity(visible) {
    ['step-panel', 'notebook-container', 'control-panel'].forEach(id => {
        const elx = document.getElementById(id);
        if (elx) elx.style.opacity = visible ? '1' : '0';
    });
}

function drawDivisionCurve() {
    const svg = document.getElementById('hint-svg');
    const divisorLen = appState.M;
    const targetCell = document.getElementById(`cell-1-${divisorLen}`);
    if (!targetCell) return;
    const containerRect = document.getElementById('notebook-container').getBoundingClientRect();
    const cellRect = targetCell.getBoundingClientRect();
    const sc = stageScale();
    const x = (cellRect.left - containerRect.left) / sc;
    const yTop = (cellRect.top - containerRect.top) / sc;
    const yBottom = (cellRect.bottom - containerRect.top) / sc;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M ${x} ${yTop} Q ${x + 12} ${(yTop + yBottom)/2} ${x} ${yBottom}`);
    path.setAttribute("stroke", "#1e293b"); path.setAttribute("stroke-width", "3"); path.setAttribute("fill", "none"); svg.appendChild(path);
}

function drawDecimalDots(step) {
    const svg = document.getElementById('hint-svg');
    const containerRect = document.getElementById('notebook-container').getBoundingClientRect();
    const sc = stageScale();

    function getBoundary(r, c) {
        let cell = c > 0 ? document.getElementById(`cell-${r}-${c-1}`) : document.getElementById(`cell-${r}-${c}`);
        if (!cell) return null; 
        const rect = cell.getBoundingClientRect();
        return { 
            x: c > 0 ? ((rect.right - containerRect.left) / sc) : ((rect.left - containerRect.left) / sc), 
            y: (rect.bottom - containerRect.top) / sc - 7 
        };
    }

    function drawDot(pt, fill, opacity = 1) {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y); c.setAttribute("r", "4.5");
        c.setAttribute("fill", fill); c.setAttribute("opacity", opacity);
        svg.appendChild(c);
    }

    function drawMovedDot(ptFrom, ptTo, color) {
        // 元の位置: 薄く打ち消し線
        const cross = document.createElementNS("http://www.w3.org/2000/svg", "line");
        cross.setAttribute("x1", ptFrom.x - 6); cross.setAttribute("y1", ptFrom.y - 6);
        cross.setAttribute("x2", ptFrom.x + 6); cross.setAttribute("y2", ptFrom.y + 6);
        cross.setAttribute("stroke", "#94a3b8"); cross.setAttribute("stroke-width", "2"); svg.appendChild(cross);
        const cross2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
        cross2.setAttribute("x1", ptFrom.x + 6); cross2.setAttribute("y1", ptFrom.y - 6);
        cross2.setAttribute("x2", ptFrom.x - 6); cross2.setAttribute("y2", ptFrom.y + 6);
        cross2.setAttribute("stroke", "#94a3b8"); cross2.setAttribute("stroke-width", "2"); svg.appendChild(cross2);

        // 移動先 → 現在の点
        drawDot(ptTo, color);

        // 矢印（元→先）
        if (Math.abs(ptTo.x - ptFrom.x) > 4) {
            const mx = (ptFrom.x + ptTo.x) / 2;
            const my = ptFrom.y - 18;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${ptFrom.x} ${ptFrom.y} Q ${mx} ${my} ${ptTo.x} ${ptTo.y}`);
            path.setAttribute("stroke", color); path.setAttribute("stroke-width", "2");
            path.setAttribute("fill", "none"); path.setAttribute("marker-end", "url(#dot-arrow)"); svg.appendChild(path);
        }
    }

    function drawVerticalArrow(ptFrom, ptTo, color = "#0284c7") {
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "line");
        arrow.setAttribute("x1", ptFrom.x);
        arrow.setAttribute("y1", ptFrom.y);
        arrow.setAttribute("x2", ptTo.x);
        arrow.setAttribute("y2", ptTo.y);
        arrow.setAttribute("stroke", color);
        arrow.setAttribute("stroke-width", "2.5");
        arrow.setAttribute("stroke-dasharray", "5,4");
        arrow.setAttribute("marker-end", "url(#arrow)");
        svg.appendChild(arrow);
    }

    function animateDotMovement(ptFrom, ptTo, arrowColor, dotColor, directionLabel) {
        drawVerticalArrow(ptFrom, ptTo, arrowColor);

        const finalDot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        finalDot.setAttribute("cx", ptTo.x);
        finalDot.setAttribute("cy", ptTo.y);
        finalDot.setAttribute("r", "4.5");
        finalDot.setAttribute("fill", dotColor);
        finalDot.setAttribute("opacity", "0");
        svg.appendChild(finalDot);

        const motionDot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        motionDot.setAttribute("cx", ptFrom.x);
        motionDot.setAttribute("cy", ptFrom.y);
        motionDot.setAttribute("r", "5");
        motionDot.setAttribute("fill", arrowColor);
        motionDot.setAttribute("opacity", "0.95");
        svg.appendChild(motionDot);

        const duration = 850;
        const startTime = performance.now();

        function step(now) {
            const t = Math.min(1, (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            const x = ptFrom.x + (ptTo.x - ptFrom.x) * eased;
            const y = ptFrom.y + (ptTo.y - ptFrom.y) * eased;
            motionDot.setAttribute("cx", x);
            motionDot.setAttribute("cy", y);

            if (t < 1) {
                quotientDotAnimFrame = requestAnimationFrame(step);
            } else {
                finalDot.setAttribute("opacity", "1");
                if (motionDot.parentNode) motionDot.parentNode.removeChild(motionDot);
                quotientDotAnimFrame = null;
            }
        }

        cancelQuotientDotAnimation();
        quotientDotAnimFrame = requestAnimationFrame(step);
    }

    const dots = step.dots;
    const isMoved = dots.isMoved;
    const quotientDotAnim = (step.phase === "quotient-dot");
    const remainderDotAnim = (step.phase === "remainder-dot");

    // 商は「移動した後の小数点」から、あまりは「動かす前の小数点」から動かす
    const quotientSourceCol = dots.dvdCurrent;
    const remainderSourceCol = dots.dvdOriginal;

    // わる数の小数点
    if (dots.divOriginal !== null) {
        if (isMoved && dots.divCurrent !== null && dots.divCurrent !== dots.divOriginal) {
            const ptFrom = getBoundary(1, dots.divOriginal);
            const ptTo   = getBoundary(1, dots.divCurrent);
            if (ptFrom && ptTo) drawMovedDot(ptFrom, ptTo, "#f97316");
        } else {
            const pt = getBoundary(1, dots.divOriginal);
            if (pt) drawDot(pt, "#334155");
        }
    }

    // わられる数の小数点
    if (dots.dvdOriginal !== null) {
        const ptOrig = getBoundary(1, dots.dvdOriginal);
        if (isMoved && dots.dvdCurrent !== null && dots.dvdCurrent !== dots.dvdOriginal) {
            const ptTo = getBoundary(1, dots.dvdCurrent);
            if (ptOrig && ptTo) {
                drawMovedDot(ptOrig, ptTo, "#f97316");
            }
        } else {
            if (ptOrig) drawDot(ptOrig, "#334155");
        }
    }

    // 商の小数点
    if (dots.quotient !== null) {
        const ptQuot = getBoundary(0, dots.quotient);
        if (ptQuot) {
            const ptSource = quotientSourceCol !== null ? getBoundary(1, quotientSourceCol) : null;
            if (quotientDotAnim && ptSource) {
                animateDotMovement(ptSource, ptQuot, "#0284c7", "#ef4444", "up");
            } else {
                drawDot(ptQuot, "#ef4444");
            }
        }
    }

    // あまりの小数点
    if (dots.remainder !== null && dots.remainderRow !== undefined) {
        const ptRem = getBoundary(dots.remainderRow, dots.remainder);
        if (ptRem) {
            const ptSource = remainderSourceCol !== null ? getBoundary(1, remainderSourceCol) : null;
            if (remainderDotAnim && ptSource) {
                animateDotMovement(ptSource, ptRem, "#0284c7", "#ef4444", "down");
            } else {
                drawDot(ptRem, "#ef4444");
            }
        }
    }
}

function updateStepFlow(step) {
    const panel = document.getElementById('step-panel');
    const badge = document.getElementById('step-status-badge');
    if (!panel || !badge) return;

    const phase = step && step.phase ? step.phase : "init";
    let activeKey = "tateru";
    let bg = "#f7f9fa";
    let accent = "#3b82f6";
    let soft = "rgba(255,255,255,0.96)";
    let label = "たてる";

    if (phase === "move-dots") {
        activeKey = "none";
        bg = "#ffffff";
        accent = "#64748b";
        soft = "#ffffff";
        label = "小数点のいどう";
    } else if (["multiply", "trial-multiply"].includes(phase)) {
        activeKey = "kakeru";
        bg = "#dcfce7";
        accent = "#16a34a";
        soft = "#f0fdf4";
        label = "かける";
    } else if (["subtract", "trial-fix"].includes(phase)) {
        activeKey = "hiku";
        bg = "#fee2e2";
        accent = "#dc2626";
        soft = "#fff1f2";
        label = "ひく";
    } else if (["drop", "remainder-drop", "decimal-zero", "remainder-dot", "zero-fill"].includes(phase)) {
        activeKey = "orosu";
        bg = "#ffedd5";
        accent = "#ea580c";
        soft = "#fff7ed";
        label = "おろす";
    } else if (phase === "complete") {
        activeKey = "tateru";
        bg = "#f7f9fa";
        accent = "#64748b";
        soft = "#ffffff";
        label = "完成";
    } else {
        activeKey = "tateru";
        bg = "#dbeafe";
        accent = "#2563eb";
        soft = "#eff6ff";
        label = "たてる";
    }

    if (!uiHintsEnabled) {
        document.getElementById('app').style.backgroundColor = "#f7f9fa";
        panel.classList.remove("phase-tateru", "phase-kakeru", "phase-hiku", "phase-orosu", "phase-neutral");
        panel.classList.add("phase-neutral");
        panel.style.setProperty("--phase-accent", "#64748b");
        panel.style.setProperty("--phase-soft", "rgba(255,255,255,0.96)");
        badge.textContent = "いまの工程：表示OFF";
        panel.querySelectorAll(".step-node").forEach(node => {
            node.classList.remove("active");
        });
        return;
    }

    document.getElementById('app').style.backgroundColor = bg;
    panel.classList.remove("phase-tateru", "phase-kakeru", "phase-hiku", "phase-orosu", "phase-neutral");
    panel.classList.add(activeKey === "none" ? "phase-neutral" : (phase === "complete" ? "phase-neutral" : `phase-${activeKey}`));
    panel.style.setProperty("--phase-accent", accent);
    panel.style.setProperty("--phase-soft", soft);
    badge.textContent = `いまの工程：${label}`;

    panel.querySelectorAll(".step-node").forEach(node => {
        node.classList.toggle("active", activeKey !== "none" && node.dataset.step === activeKey);
    });
}

function showGradeModal() {
    document.getElementById('grade-modal').style.display = 'flex';
}
function hideGradeModal() {
    document.getElementById('grade-modal').style.display = 'none';
}
function setGrade(grade) {
    currentGrade = grade;
    try { localStorage.setItem('warizan-grade', grade); } catch (e) { /* localStorage不可の環境では次回また選んでもらう */ }
    document.getElementById('grade-label').textContent = (grade === 'grade4') ? '4年生' : '5年生以上';
    hideGradeModal();
    if (currentProblem) updateQuestionZoneForGrade();
}
document.querySelectorAll('.grade-modal-btn').forEach(btn => {
    btn.addEventListener('click', () => setGrade(btn.dataset.grade));
});
document.getElementById('btn-grade-change').addEventListener('click', showGradeModal);

(function initGradeOnLoad() {
    let savedGrade = null;
    try { savedGrade = localStorage.getItem('warizan-grade'); } catch (e) { /* 何もしない */ }
    if (savedGrade === 'grade4' || savedGrade === 'grade5') {
        currentGrade = savedGrade;
        document.getElementById('grade-label').textContent = (savedGrade === 'grade4') ? '4年生' : '5年生以上';
    } else {
        currentGrade = 'grade4';
        showGradeModal();
    }
})();

function handleEnterKeyForApp(e) {
    if (e.isComposing || e.key !== 'Enter') return;

    const target = e.target;
    const isProblemInput = target && (
        target.id === 'num-dividend' ||
        target.id === 'num-divisor'
    );

    if (isProblemInput) {
        e.preventDefault();
        e.stopPropagation();
        initSimulation();
        return;
    }

    const tagName = target && target.tagName ? target.tagName.toLowerCase() : '';
    const isEditable = target && (
        target.isContentEditable ||
        tagName === 'textarea' ||
        tagName === 'select'
    );

    if (!isEditable) {
        e.preventDefault();
        const btnNext = document.getElementById('btn-next');
        if (btnNext && !btnNext.disabled) btnNext.click();
    }
}

// ★左右矢印キーでも「すすむ／もどる」ボタンと同じ操作ができるようにする。
// 入力欄（数字入力やプルダウン）にフォーカスがある時は、矢印キー本来の
// カーソル移動・選択肢変更の動作を優先し、ナビゲーションには使わない。
function handleArrowKeyForApp(e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;

    const target = e.target;
    const tagName = target && target.tagName ? target.tagName.toLowerCase() : '';
    const isEditable = target && (
        target.isContentEditable ||
        tagName === 'input' ||
        tagName === 'textarea' ||
        tagName === 'select'
    );

    if (isEditable) return;

    e.preventDefault();
    if (e.key === 'ArrowRight') {
        const btnNext = document.getElementById('btn-next');
        if (btnNext && !btnNext.disabled) btnNext.click();
    } else {
        const btnPrev = document.getElementById('btn-prev');
        if (btnPrev && !btnPrev.disabled) btnPrev.click();
    }
}

document.addEventListener('keydown', handleEnterKeyForApp);
document.addEventListener('keydown', handleArrowKeyForApp);
document.getElementById('btn-next').addEventListener('click', () => {
    if (currentStepIdx < appState.steps.length - 1) { currentStepIdx++; applyStepUI(); updateButtons(); }
});
document.getElementById('btn-prev').addEventListener('click', () => {
    if (currentStepIdx > 0) {
        currentStepIdx--; const targetIdx = currentStepIdx; applyUiHintsState();
applyZeroModeState();
initSimulation();
        while(currentStepIdx < targetIdx) { currentStepIdx++; applyStepUI(); }
        updateButtons();
    }
});
applyZeroModeState();
initSimulation();
