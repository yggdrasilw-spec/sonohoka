function buildTrialHistoryHtml(trialHistory) {
    if (!Array.isArray(trialHistory) || trialHistory.length === 0) return "";
    let html = `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;">`;
    for (const attempt of trialHistory) {
        html += buildVerticalMultiplicationHtml(
            attempt.divisorInt,
            attempt.multiplierInt,
            attempt.productInt,
            attempt.titleText || "仮商の筆算",
            { wrong: !!attempt.wrong }
        );
    }
    html += `</div>`;
    return html;
}

function generateBrainWorkHtml(currentTargetValue, divisorInt, trialQuotient, trialHistory = null) {
    if (currentTargetValue === 0 || currentTargetValue < divisorInt) return "";

    const trueQuotient = Math.floor(currentTargetValue / divisorInt);

    // ── 1桁のわる数: 九九リスト ──────────────────────────────
    if (divisorInt < 10) {
        let html = `<div style="font-size:14px; color:#334155;">
            <b>🧠 あたまの中の九九 (${divisorInt}のだん)</b>
            <div style="margin-top:6px; padding-left:10px; border-left:3px solid #0284c7; line-height:1.8;">`;
        for (let k = 1; k <= 9; k++) {
            let p = divisorInt * k;
            let isAnswer = (k === trueQuotient);
            let isTrial  = (trialQuotient !== undefined && k === trialQuotient && trialQuotient !== trueQuotient);
            if (isTrial) {
                html += `<div style="background:#fee2e2;border:2px solid #ef4444;display:inline-block;padding:2px 8px;margin:2px 0;border-radius:4px;font-weight:bold;color:#b91c1c;">
                            ✕ ${divisorInt} × ${k} = ${p}（大きすぎ）</div><br>`;
            } else if (isAnswer) {
                html += `<div style="background:#fef08a;border:2px solid #eab308;display:inline-block;padding:2px 8px;margin:2px 0;border-radius:4px;font-weight:bold;color:#854d0e;">
                            ★ ${divisorInt} × ${k} = ${p} ✓</div><br>`;
            } else if (p > currentTargetValue) {
                html += `<div style="color:#cbd5e1;margin:2px 0;">${divisorInt} × ${k} = ${p}</div>`;
            } else {
                html += `<div style="color:#64748b;margin:2px 0;">${divisorInt} × ${k} = ${p}</div>`;
            }
        }
        html += `</div></div>`;
        return html;
    }

    // ── 2桁以上のわる数: 仮商計算パネル ────────────────────────
    const divisorStr = divisorInt.toString();
    const d1 = parseInt(divisorStr[0], 10);
    const topLen = divisorStr.length;
    const topVal = Math.floor(currentTargetValue / Math.pow(10, topLen - 1));

    const displayTrial = (trialQuotient !== undefined) ? trialQuotient : trueQuotient;
    const trialProduct = divisorInt * displayTrial;
    const trialStart   = Math.max(displayTrial, trueQuotient);
    const trialEnd     = trueQuotient;

    let html = `<div style="font-size:14px;color:#334155;">
        <b>🔍 仮商を見つけよう！</b>
        <div style="margin-top:8px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:8px 12px;line-height:1.9;">
            <div style="color:#0369a1;">
                わる数 <b>${divisorInt}</b> の上1けた ➜ <b>${d1}</b>
            </div>
            <div style="color:#0369a1;">
                わられる数 <b>${currentTargetValue}</b> の上${topLen}けた ➜ <b>${topVal}</b>
            </div>
            <div style="margin-top:4px;color:#334155;">
                <b>${topVal} ÷ ${d1}</b> で見当をつける ➜ 仮の商 <b style="color:#f97316;">${displayTrial}</b>
            </div>
        </div>`;

    if (Array.isArray(trialHistory) && trialHistory.length > 0) {
        html += buildTrialHistoryHtml(trialHistory);
    } else {
        html += buildVerticalMultiplicationHtml(
            divisorInt,
            displayTrial,
            trialProduct,
            trialQuotient !== undefined && trialQuotient !== trueQuotient
                ? "仮の商の筆算"
                : "商の筆算"
        );
    }

    html += `<div style="margin-top:8px;padding-left:10px;border-left:3px solid #f97316;line-height:1.8;">`;

    for (let k = trialStart; k >= Math.max(1, trialEnd - 1); k--) {
        let p = divisorInt * k;
        let isTrial  = (k === trialStart && k !== trueQuotient);
        let isAnswer = (k === trueQuotient);
        if (isTrial) {
            html += `<div style="background:#fee2e2;border:2px solid #ef4444;display:inline-block;padding:2px 10px;margin:2px 0;border-radius:4px;font-weight:bold;color:#b91c1c;">
                        ✕ ${divisorInt} × ${k} = ${p}（${currentTargetValue}より大きい）</div><br>`;
        } else if (isAnswer) {
            html += `<div style="background:#fef08a;border:2px solid #eab308;display:inline-block;padding:2px 10px;margin:2px 0;border-radius:4px;font-weight:bold;color:#854d0e;">
                        ★ ${divisorInt} × ${k} = ${p} ✓（ちょうどよい）</div><br>`;
        } else {
            html += `<div style="color:#cbd5e1;margin:2px 0;">${divisorInt} × ${k} = ${p}</div>`;
        }
    }

    html += `</div></div>`;
    return html;
}

class AdvancedDivisionEngine {
    static checkWillDivideOut(dividendStr, divisorStr) {
        const divParse = parseNumberMeta(divisorStr);
        const dvdParse = parseNumberMeta(dividendStr);
        let baseDvdDigits = dvdParse.digits;
        const finalDvdDotAfter = dvdParse.dotAfter + divParse.decimalPlaces;
        if (finalDvdDotAfter > baseDvdDigits.length) {
            baseDvdDigits += "0".repeat(finalDvdDotAfter - baseDvdDigits.length);
        }
        const divisorInt = parseInt(divParse.digits, 10);
        let currentRem = 0;
        for(let i=0; i<baseDvdDigits.length; i++) {
            let currentDivStr = (i === 0 && currentRem === 0) ? baseDvdDigits[i] : (currentRem.toString() + baseDvdDigits[i]);
            currentRem = parseInt(currentDivStr, 10) % divisorInt;
        }
        let extra = 0;
        while (currentRem > 0 && extra < 6) {
            currentRem = (currentRem * 10) % divisorInt;
            extra++;
        }
        return (currentRem === 0);
    }

    static generateSteps(dividendStr, divisorStr, route, gaisuConfig) {
        const divParse = parseNumberMeta(divisorStr);
        const dvdParse = parseNumberMeta(dividendStr);
        const D = divParse.decimalPlaces; 

        let baseDvdDigits = dvdParse.digits;
        const finalDvdDotAfter = dvdParse.dotAfter + D;
        if (finalDvdDotAfter > baseDvdDigits.length) {
            baseDvdDigits += "0".repeat(finalDvdDotAfter - baseDvdDigits.length);
        }

        const divisorInt = parseInt(divParse.digits, 10);
        let extraZeros = 0;

        const isRemainderRoute = (route === "remainder");
        const isUntilCycleMode = (route === "advance" && gaisuConfig !== null && gaisuConfig.mode === "until-cycle");
        // 「割りきれるまで計算！」の結果メモ（わり切れた／循環小数で打ち切った、を完成メッセージで使う）
        let untilCycleInfo = null;

        if (isRemainderRoute) {
            extraZeros = 0;
        } else if (isUntilCycleMode) {
            // 通常の四捨五入モードよりずっと多い桁数まで計算を続け、
            // 同じあまりが出てきたら「循環している」と判断してもう1周期分だけ表示してから止める。
            const MAX_UNTIL_CYCLE_DIGITS = 40;
            let currentRem = 0;
            for (let i = 0; i < baseDvdDigits.length; i++) {
                let currentDivStr = (i === 0 && currentRem === 0) ? baseDvdDigits[i] : (currentRem.toString() + baseDvdDigits[i]);
                currentRem = parseInt(currentDivStr, 10) % divisorInt;
            }
            const seenRemainders = new Map();
            let cycleDetectedAt = null;
            let cycleStartAt = null;
            extraZeros = 0;
            while (currentRem !== 0 && extraZeros < MAX_UNTIL_CYCLE_DIGITS) {
                if (seenRemainders.has(currentRem) && cycleDetectedAt === null) {
                    cycleDetectedAt = extraZeros;
                    cycleStartAt = seenRemainders.get(currentRem);
                }
                if (cycleDetectedAt !== null) {
                    const period = cycleDetectedAt - cycleStartAt;
                    if (extraZeros >= cycleDetectedAt + period) break;
                }
                seenRemainders.set(currentRem, extraZeros);
                currentRem = (currentRem * 10) % divisorInt;
                extraZeros++;
            }
            untilCycleInfo = {
                terminated: (currentRem === 0),
                hasCycle: (cycleDetectedAt !== null),
                cycleLength: (cycleDetectedAt !== null) ? (cycleDetectedAt - cycleStartAt) : null,
                cycleStartAt: cycleStartAt,
                hitMaxDigits: (currentRem !== 0 && cycleDetectedAt === null && extraZeros >= MAX_UNTIL_CYCLE_DIGITS)
            };
        } else if (route === "advance" && gaisuConfig !== null) {
            let requiredDigitsLength = finalDvdDotAfter + (gaisuConfig.mode === "significant" ? gaisuConfig.digits + 3 : gaisuConfig.digits + 1);
            if (baseDvdDigits.length < requiredDigitsLength) {
                extraZeros = requiredDigitsLength - baseDvdDigits.length;
            }
        } else {
            let currentRem = 0;
            for(let i=0; i<baseDvdDigits.length; i++) {
                let currentDivStr = (i === 0 && currentRem === 0) ? baseDvdDigits[i] : (currentRem.toString() + baseDvdDigits[i]);
                currentRem = parseInt(currentDivStr, 10) % divisorInt;
            }
            while (currentRem > 0 && extraZeros < 6) {
                currentRem = (currentRem * 10) % divisorInt;
                extraZeros++;
            }
        }

        let dvdDigits = baseDvdDigits + "0".repeat(extraZeros);
        const M = divParse.digits.length;
        const N = dvdDigits.length;

        // ★強調表示用: わる数（row1, col 0..M-1）のマス一覧。常に固定。
        const divisorCells = [];
        for (let j = 0; j < M; j++) divisorCells.push({ r: 1, c: j });

        const steps = [];
        const initialCells = [];

        for(let j=0; j<M; j++) initialCells.push({ r: 1, c: j, char: divParse.digits[j] });
        for(let j=0; j<dvdParse.digits.length; j++) initialCells.push({ r: 1, c: M + j, char: dvdParse.digits[j] });

        const showDotsInThisProblem = dvdParse.hasDot || divParse.hasDot || (route === "advance");

        const baseDots = {
            divOriginal: (divParse.hasDot && showDotsInThisProblem) ? divParse.dotAfter : null,
            divCurrent: (divParse.hasDot && showDotsInThisProblem) ? divParse.dotAfter : null,
            dvdOriginal: (showDotsInThisProblem) ? dvdParse.dotAfter + M : null,
            dvdCurrent: (showDotsInThisProblem) ? dvdParse.dotAfter + M + D : null,
            quotient: null, remainder: null, remainderRow: null, isMoved: false,
            showDvdOrigInit: dvdParse.hasDot && showDotsInThisProblem
        };

        let currentMaskFromCol = null;

        steps.push({
            phase: "init",
            description: `まずは筆算の形に数字を書きましょう。`,
            dots: { ...baseDots }, writeCells: [], maskFromCol: currentMaskFromCol, pulseBoxes: []
        });

        let currentDots = { ...baseDots };
        const zerosFromMove = finalDvdDotAfter > dvdParse.digits.length ? finalDvdDotAfter - dvdParse.digits.length : 0;

        if (D > 0 && showDotsInThisProblem) {
            currentDots.divCurrent = M;
            currentDots.dvdCurrent = dvdParse.dotAfter + M + D;
            currentDots.isMoved = true;
            const writeCells = [];
            if (zerosFromMove > 0) {
                for (let j = 0; j < zerosFromMove; j++) {
                    writeCells.push({ r: 1, c: M + dvdParse.digits.length + j, char: "0", isNewZero: true });
                }
            }
            steps.push({
                phase: "move-dots",
                description: `【小数点のいどう】わる数を整数にするために小数点を右に移します。`,
                dots: { ...currentDots }, writeCells: writeCells, maskFromCol: currentMaskFromCol, pulseBoxes: []
            });
        }

        let currentRemainder = 0;
        let currentDividendStr = "";
        let currentRow = 2;
        let hasFirstQuotientStarted = false;
        let quotientPositions = Array(N).fill("");
        // hasFirstQuotientStarted が false のうちに ✕ を書いた列番号を記録する
        // 小数点を確定するタイミングで、必要な列だけ 0 に直すために保持する
        let skippedCols = [];
        let firstQuotientCol = null;
        let lastDropRow = null;

        // あまりを出す4年生ルートなら、一の位（finalDvdDotAfter）に達した時点で商をたてるループを抜ける
        let stopI = isRemainderRoute ? finalDvdDotAfter : N;

        // ★強調表示用: 「今見ている、わられる数の当該部分」がどのマスに表示されているかを
        // ループの一周ごとに追跡する。前の段の差が新しく書かれていれば、そのマス（複数桁）。
        // 何も新しく書かれていなければ（0が立って差の表示を省略した場合など）空配列＝row1のその桁を直接使う。
        let prevRemainderCells = [];

        // ★強調表示用: 「今回新たに見る1桁」が実際にどのマスに表示されているかを追跡する。
        // i===0のときは必ず row1（まだ何もおろされていない最初の桁）。
        // i>0のときは、前回のdropで実際に下段へ書かれた位置（おろした後の数）を指す。
        // 前回のdropが省略された（おろす数が0でひき算結果も0だった）場合のみ、
        // 下段に何も書かれていないので例外的に row1 を参照する。
        let nextDigitCellOverride = null;

        for (let i = 0; i < stopI; i++) {
            const currentDigit = dvdDigits[i];
            currentDividendStr = (i === 0 && currentRemainder === 0) ? currentDigit : (currentRemainder.toString() + currentDigit);
            const currentTargetValue = parseInt(currentDividendStr, 10);
            const targetCol = M + i;

            // ★今回の「わられる数の当該部分」を構成するマス一覧（強調表示用）。
            // 前の段から下りてきた数字（prevRemainderCells）＋ 今回新たに見る1桁。
            // 今回新たに見る1桁は、i===0なら row1、i>0なら「おろした後の数」（下段）を指す。
            const currentNewDigitCell = (i === 0) ? { r: 1, c: targetCol } : (nextDigitCellOverride || { r: 1, c: targetCol });
            // 商がまだ一度も立っていない段階（先頭の位で「商は立たない」を繰り返している間）は、
            // ひき算やおろす処理が一度も行われていないため、対象の桁は全てrow1にそのまま残っている。
            // このときprevRemainderCellsは更新されないので、代わりにM列目〜現在の桁までを
            // まとめてハイライト対象にする（例：681÷202で68や681の全桁を対象にする）。
            const currentDvdPartCells = hasFirstQuotientStarted
                ? [...prevRemainderCells, currentNewDigitCell]
                : Array.from({ length: targetCol - M + 1 }, (_, j) => ({ r: 1, c: M + j }));

            // ==================================================================
            // 図解（ブロック配布アニメ）用データ「1ラウンド分の情報」を作る。
            // 1桁の除数は等分除、2桁以上は包含除として同じ図解データを持たせる。
            // ==================================================================
            // 図解で使う位は、筆算用に小数点を動かして整数化した後の位ではなく、
            // 元の「わられる数」における実際の位を使う。
            // 例：85 ÷ 0.07 は内部では 8500 ÷ 7 として処理するが、先頭の8は
            // 1000の位ではなく10の位なので、図解では exponent=1 とする。
            const roundExponent = dvdParse.dotAfter - 1 - i;
            const roundQuotient = (divisorInt > 0) ? Math.floor(currentTargetValue / divisorInt) : 0;
            const roundRemainder = (divisorInt > 0) ? (currentTargetValue % divisorInt) : 0;
            const roundPreviewDigits = (i === 0 && N > 1) ? dvdDigits.slice(1).split("") : null;
            const hissanRoundData = {
                kind: (divisorInt < 10) ? "partitive" : "quotitive",
                exponent: roundExponent,
                digit: parseInt(currentDigit, 10),
                carriedRemainder: currentRemainder,
                value: currentTargetValue,
                divisor: divisorInt,
                quotient: roundQuotient,
                remainder: roundRemainder,
                isFirstRound: (i === 0),
                isLastRound: (i === stopI - 1),
                previewDigits: roundPreviewDigits
            };

            // 問題全体でいちばん最初のラウンドだけ、わられる数ぜんぶを実物の
            // ブロックで見せてからカバーで隠す導入演出を独立ステップとして挟む。
            if (hissanRoundData && N > 1 && i === 0) {
                steps.push({
                    phase: "cover",
                    description: `わられる数ぜんぶを、実際の位のブロックで見てみよう。小数の位も、0.1・0.01・0.001…のブロックで表すよ。まだ使わない位は、うすく透けたカバーでかくれているよ。`,
                    dots: { ...currentDots }, maskFromCol: currentMaskFromCol, pulseBoxes: [],
                    highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], []),
                    formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ ？`),
                    hissanRound: hissanRoundData
                });
            }
            // 仮商を先に計算してbrainHtmlに渡す
            let preTrialQ = undefined;
            if (divisorInt >= 10) {
                const _d1 = parseInt(divParse.digits[0], 10);
                const _topVal = Math.floor(currentTargetValue / Math.pow(10, divParse.digits.length - 1));
                const _trial = Math.min(9, Math.floor(_topVal / _d1));
                const _true  = Math.floor(currentTargetValue / divisorInt);
                preTrialQ = (_trial > _true) ? _trial : _true;
            }
            const brainHtml = generateBrainWorkHtml(currentTargetValue, divisorInt, preTrialQ);

            currentMaskFromCol = targetCol + 1;

            if (i === dvdParse.digits.length && currentDigit === "0") {
                const lastStep = steps[steps.length - 1];
                const alreadyWroteZero = !!(lastStep && Array.isArray(lastStep.writeCells) && lastStep.writeCells.some(cell => cell && cell.r === 1 && cell.c === targetCol && cell.char === "0" && cell.isNewZero));
                if (!alreadyWroteZero) {
                    steps.push({
                        phase: "zero-fill",
                        description: `【0を補う】空いているマスに0を書いて、${currentTargetValue}と見ます。`,
                        dots: { ...currentDots },
                        writeCells: [{ r: 1, c: targetCol, char: "0", isNewZero: true }],
                        pulseBoxes: [{ r: 1, c: targetCol }],
                        maskFromCol: currentMaskFromCol,
                        highlightCells: makeHighlight("orange", [], [{ r: 1, c: targetCol }])
                    });
                }
            }

            const isMaskVisible = (currentMaskFromCol < M + N);
            const canStand = (currentTargetValue >= divisorInt);

            if (divisorInt < 10) {
                // 1桁のわる数：従来どおり hide 1ステップ
                const hideText = `【ひらめき九九チェック】 ${divisorInt} のだんの九九で、 ${currentTargetValue} をこえない一番近い数を頭の中で見つけよう！`;
                steps.push({
                    phase: "hide",
                    description: hideText,
                    dots: { ...currentDots }, maskFromCol: currentMaskFromCol, brainHtml: brainHtml, pulseBoxes: [],
                    highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], []),
                    formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ ？`),
                    hissanRound: hissanRoundData
                });
            } else {
                // 2桁以上のわる数：①かくして考えよう → ②商の見当をつける（商が立つ場合のみ）

                // ① 商が立つかどうかの確認ステップ
                const checkTitle = isMaskVisible ? `【かくして考えよう。どの位に商が立つかな？】` : `【商が立つかな？】`;
                const checkResult = canStand
                    ? `${currentTargetValue} の中に ${divisorInt} はあるかな？ → あるね！ 商には何が立つかな？`
                    : `${currentTargetValue} の中に ${divisorInt} はあるかな？ → ないね！ 商は立ちません。次の桁をいっしょに見ます。`;
                steps.push({
                    phase: "hide-check",
                    description: `${checkTitle} ${checkResult}`,
                    dots: { ...currentDots }, maskFromCol: currentMaskFromCol, brainHtml: null, pulseBoxes: [],
                    highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], []),
                    formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ ？`),
                    hissanRound: hissanRoundData
                });

                // ② 見当をつけるステップ（商が立つ場合のみ）
                if (canStand) {
                    const _d1 = parseInt(divParse.digits[0], 10);
                    const _topLen = divParse.digits.length;
                    const _topValDvd = Math.floor(currentTargetValue / Math.pow(10, _topLen - 1));
                    // 切り捨て概数の例：300÷30→30÷3=10 のような文字列を生成
                    const _dvdRounded = _topValDvd * Math.pow(10, _topLen - 1);
                    const _divRounded = _d1 * Math.pow(10, _topLen - 1);
                    const _simpleResult = Math.floor(_dvdRounded / _divRounded);
                    const estimateText = isMaskVisible
                        ? `【かくして商の見当をつける】 わられる数もわる数も「簡単な数」と見て、見当をつけよう。切り捨てで上から１けたの概数にしよう。${currentTargetValue}÷${divisorInt}＝？ → ${_dvdRounded}÷${_divRounded} → ${_topValDvd}÷${_d1}＝${_simpleResult}　※四捨五入するという手もあるよ`
                        : `【商の見当をつける】 わられる数もわる数も「簡単な数」と見て、見当をつけよう。切り捨てで上から１けたの概数にしよう。${currentTargetValue}÷${divisorInt}＝？ → ${_dvdRounded}÷${_divRounded} → ${_topValDvd}÷${_d1}＝${_simpleResult}　※四捨五入するという手もあるよ`;
                    steps.push({
                        phase: "hide",
                        description: estimateText,
                        dots: { ...currentDots }, maskFromCol: currentMaskFromCol, brainHtml: brainHtml, pulseBoxes: [],
                        highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], []),
                        formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ ？`),
                        hissanRound: hissanRoundData
                    });
                }
            }

            if (currentTargetValue < divisorInt) {
                if (!hasFirstQuotientStarted) {
                    // まだ商が立っていない段階での ✕ → 列番号を記録するだけで描画はここでは行う
                    skippedCols.push(targetCol);
                    steps.push({
                        phase: "skip",
                        description: `商は立ちません。次の桁をいっしょに見ます。`,
                        dots: { ...currentDots }, writeCells: [{ r: 0, c: targetCol, char: "✕", isGuide: true }],
                        maskFromCol: currentMaskFromCol, pulseBoxes: [],
                        highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], [{ r: 0, c: targetCol }]),
                        formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ 0（商は立たない）`),
                        hissanRound: hissanRoundData
                    });
                    currentRemainder = currentTargetValue;
                } else {
                    quotientPositions[i] = "0";
                    steps.push({
                        phase: "build-zero",
                        description: `【たてる】商に「0」を書きます。`,
                        dots: { ...currentDots }, writeCells: [{ r: 0, c: targetCol, char: "0", isGuide: false }], 
                        pulseBoxes: [{ r: 0, c: targetCol }], maskFromCol: currentMaskFromCol,
                        highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], [{ r: 0, c: targetCol }]),
                        formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ 0`),
                        hissanRound: hissanRoundData
                    });

                    if (zeroStepExpanded) {
                        const zeroProduct = 0;
                        const zeroProductStr = "0";
                        const zeroProductCoreCells = [{ r: currentRow, c: targetCol, char: zeroProductStr, borderBottom: true }];
                        const zeroMultiplyCells = extendHorizontalLine(
                            zeroProductCoreCells,
                            currentRow,
                            targetCol,
                            i < stopI - 1
                        );
                        steps.push({
                            phase: "multiply",
                            description: `【かける】 ${divisorInt} × 0 ＝ 0 を書きます。`,
                            dots: { ...currentDots }, writeCells: zeroMultiplyCells,
                            pulseBoxes: getHighlightPulseBoxes(zeroMultiplyCells), maskFromCol: currentMaskFromCol,
                            highlightCells: makeHighlight("green", [{ r: 0, c: targetCol }, ...divisorCells], zeroProductCoreCells.map(c => ({ r: c.r, c: c.c }))),
                            formulaHtml: formulaHtml("green", `${divisorInt} × 0 ＝ 0`),
                            hissanRound: hissanRoundData
                        });
                        currentRow++;

                        currentRemainder = currentTargetValue - zeroProduct;
                        const zeroSubtractCells = [];
                        const zeroRemStr = currentRemainder.toString();
                        const shouldWriteIntermediateZero = !(currentRemainder === 0 && i < stopI - 1);
                        if (shouldWriteIntermediateZero) {
                            for (let j = 0; j < zeroRemStr.length; j++) {
                                zeroSubtractCells.push({ r: currentRow, c: targetCol - (zeroRemStr.length - 1) + j, char: zeroRemStr[j] });
                            }
                        }
                        steps.push({
                            phase: "subtract",
                            description: `【ひく】 ${currentTargetValue}-0＝${currentRemainder}です。`,
                            dots: { ...currentDots }, writeCells: zeroSubtractCells,
                            pulseBoxes: zeroSubtractCells.map(sc => ({ r: sc.r, c: sc.c })), maskFromCol: currentMaskFromCol,
                            highlightCells: makeHighlight("red", [...currentDvdPartCells, ...zeroProductCoreCells.map(c => ({ r: c.r, c: c.c }))], zeroSubtractCells.map(sc => ({ r: sc.r, c: sc.c }))),
                            formulaHtml: formulaHtml("red", `${currentTargetValue} − 0 ＝ ${currentRemainder}`),
                            hissanRound: hissanRoundData
                        });
                        if (shouldWriteIntermediateZero) {
                            prevRemainderCells = zeroSubtractCells.map(sc => ({ r: sc.r, c: sc.c }));
                        } else {
                            prevRemainderCells = [];
                        }
                    } else {
                        currentRemainder = currentTargetValue;
                        prevRemainderCells = [];
                    }

                    if (i < stopI - 1) {
                        const nextDigit = dvdDigits[i + 1];
                        const isExtraZero = (i + 1 >= baseDvdDigits.length);
                        const dropRow = zeroStepExpanded ? currentRow : (lastDropRow !== null ? lastDropRow : currentRow);
                        const suppressDroppedZero = shouldSuppressDroppedZero(currentRemainder, nextDigit, i < stopI - 1);
                        const dropCells = suppressDroppedZero ? [] : [{ r: dropRow, c: targetCol + 1, char: nextDigit }];
                        if (!suppressDroppedZero && isExtraZero) dropCells.push({ r: 1, c: targetCol + 1, char: "0", isNewZero: true });
                        const dropBeforeCells = suppressDroppedZero ? [] : [{ r: 1, c: targetCol + 1 }];
                        steps.push({
                            phase: "drop",
                            description: suppressDroppedZero
                                ? `【おろす】次におろすのは0ですが、ひき算で0になっているので省略します。`
                                : `【おろす】次の位をおろします。`,
                            dots: { ...currentDots }, writeCells: dropCells, 
                            pulseBoxes: dropCells.map(dc => ({ r: dc.r, c: dc.c })), maskFromCol: currentMaskFromCol,
                            highlightCells: makeHighlight("orange", dropBeforeCells, dropCells.map(dc => ({ r: dc.r, c: dc.c }))),
                            formulaHtml: suppressDroppedZero ? "" : formulaHtml("orange", `${nextDigit} を下ろす`),
                            hissanRound: hissanRoundData
                        });
                        lastDropRow = dropRow;
                        // ★次のループで「今回新たに見る1桁」として参照すべき位置を更新。
                        // 0を補っておろす場合（isExtraZero）も含め、常に「実際に下段へおろされた
                        // 後の数」を指す。dropが省略された場合のみ下段に何も書かれていないので
                        // 例外的にrow1を参照する。
                        if (suppressDroppedZero) {
                            nextDigitCellOverride = null;
                        } else {
                            nextDigitCellOverride = { r: dropRow, c: targetCol + 1 };
                        }
                        if (zeroStepExpanded && !suppressDroppedZero) {
                            currentRow++; 
                        }
                    }
                }
                continue; 
            }

            hasFirstQuotientStarted = true;

            let trueQuotient = Math.floor(currentTargetValue / divisorInt);
            let trialQuotient = trueQuotient;

            const divDigitsStr = divParse.digits;
            if (divisorInt >= 10) {
                let d1 = parseInt(divDigitsStr[0], 10);
                let topVal = Math.floor(currentTargetValue / Math.pow(10, divDigitsStr.length - 1));
                trialQuotient = Math.floor(topVal / d1);
                trialQuotient = Math.min(9, trialQuotient);
            }

            let trialHistory = [];

            if (trialQuotient > trueQuotient) {
                let trialProduct = trialQuotient * divisorInt;
                trialHistory.push({
                    divisorInt,
                    multiplierInt: trialQuotient,
                    productInt: trialProduct,
                    titleText: "仮の商の筆算",
                    wrong: true
                });

                let tpStr = trialProduct.toString();
                let trialMultiplyCells = [];
                for (let j = 0; j < tpStr.length; j++) {
                    trialMultiplyCells.push({ r: currentRow, c: targetCol - (tpStr.length - 1) + j, char: tpStr[j], borderBottom: true });
                }
                trialMultiplyCells = extendHorizontalLine(trialMultiplyCells, currentRow, targetCol, i < stopI - 1);

                steps.push({
                    phase: "trial-build",
                    description: `【仮の商をたてる】わる数の上1けたを見て、まずは仮の商「${trialQuotient}」をたててみます。`,
                    dots: { ...currentDots },
                    writeCells: [{ r: 0, c: targetCol, char: trialQuotient.toString() }],
                    pulseBoxes: [{ r: 0, c: targetCol }],
                    brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, trialQuotient, trialHistory),
                    maskFromCol: currentMaskFromCol,
                    highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], [{ r: 0, c: targetCol }]),
                    formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ ${trialQuotient}（仮）`),
                    hissanRound: hissanRoundData
                });

                steps.push({
                    phase: "trial-multiply",
                    description: `【かけて確認】 ${divisorInt} × ${trialQuotient} の筆算で ${trialProduct} になります。あ！わられる数の ${currentTargetValue} より大きくてひき算ができません！`,
                    dots: { ...currentDots },
                    writeCells: trialMultiplyCells,
                    pulseBoxes: getHighlightPulseBoxes(trialMultiplyCells),
                    brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, trialQuotient, trialHistory),
                    maskFromCol: currentMaskFromCol,
                    highlightCells: makeHighlight("green", [{ r: 0, c: targetCol }, ...divisorCells], getHighlightPulseBoxes(trialMultiplyCells)),
                    formulaHtml: formulaHtml("green", `${divisorInt} × ${trialQuotient} ＝ ${trialProduct}`),
                    hissanRound: hissanRoundData
                });

                while (trialQuotient > trueQuotient) {
                    let oldQuotient = trialQuotient;
                    trialQuotient--;

                    steps.push({
                        phase: "trial-fix",
                        description: `【商の修正】 「${oldQuotient}」では大きすぎたので、商を1小さくして「${trialQuotient}」に直します。`,
                        dots: { ...currentDots },
                        writeCells: [
                            { r: 0, c: targetCol, char: "" },
                            ...trialMultiplyCells.map(mc => ({ r: mc.r, c: mc.c, char: "", borderBottom: false }))
                        ],
                        maskFromCol: currentMaskFromCol,
                        brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, oldQuotient, trialHistory),
                        highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], []),
                        formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ ${trialQuotient}（直す）`),
                        hissanRound: hissanRoundData
                    });

                    if (trialQuotient > trueQuotient) {
                        trialProduct = trialQuotient * divisorInt;
                        trialHistory.push({
                            divisorInt,
                            multiplierInt: trialQuotient,
                            productInt: trialProduct,
                            titleText: "修正版の仮の商の筆算",
                            wrong: true
                        });

                        let tpStr = trialProduct.toString();
                        trialMultiplyCells = [];
                        for (let j = 0; j < tpStr.length; j++) {
                            trialMultiplyCells.push({ r: currentRow, c: targetCol - (tpStr.length - 1) + j, char: tpStr[j], borderBottom: true });
                        }
                        trialMultiplyCells = extendHorizontalLine(trialMultiplyCells, currentRow, targetCol, i < stopI - 1);
                        steps.push({
                            phase: "trial-build",
                            description: `【もう一度仮の商】 新しい仮の商「${trialQuotient}」をたててみます。`,
                            dots: { ...currentDots },
                            writeCells: [{ r: 0, c: targetCol, char: trialQuotient.toString() }],
                            pulseBoxes: [{ r: 0, c: targetCol }],
                            brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, trialQuotient, trialHistory),
                            maskFromCol: currentMaskFromCol,
                            highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], [{ r: 0, c: targetCol }]),
                            formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ ${trialQuotient}（仮）`),
                            hissanRound: hissanRoundData
                        });
                        steps.push({
                            phase: "trial-multiply",
                            description: `【かけて確認】 ${divisorInt} × ${trialQuotient} ＝ ${trialProduct} 。まだ大きくてひけません！`,
                            dots: { ...currentDots },
                            writeCells: trialMultiplyCells,
                            pulseBoxes: getHighlightPulseBoxes(trialMultiplyCells),
                            brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, trialQuotient, trialHistory),
                            maskFromCol: currentMaskFromCol,
                            highlightCells: makeHighlight("green", [{ r: 0, c: targetCol }, ...divisorCells], getHighlightPulseBoxes(trialMultiplyCells)),
                            formulaHtml: formulaHtml("green", `${divisorInt} × ${trialQuotient} ＝ ${trialProduct}`),
                            hissanRound: hissanRoundData
                        });
                    }
                }
            }

            const quotientDigit = trueQuotient;
            quotientPositions[i] = quotientDigit.toString();
            if (firstQuotientCol === null) {
                firstQuotientCol = targetCol;
            }

            const correctAttempt = trialHistory.length > 0
                ? {
                    divisorInt,
                    multiplierInt: quotientDigit,
                    productInt: quotientDigit * divisorInt,
                    titleText: "正しい筆算",
                    wrong: false
                }
                : null;
            const buildBrainHtml = trialHistory.length > 0
                ? generateBrainWorkHtml(currentTargetValue, divisorInt, quotientDigit, [...trialHistory, correctAttempt])
                : generateBrainWorkHtml(currentTargetValue, divisorInt, quotientDigit);
            steps.push({
                phase: "build",
                description: divisorInt >= 10 
                    ? `【たてる】これでバッチリ！正しい商 「${quotientDigit}」 が立ちます。`
                    : `【たてる】商に 「${quotientDigit}」 が立ちます。`,
                dots: { ...currentDots }, writeCells: [{ r: 0, c: targetCol, char: quotientDigit.toString() }], 
                pulseBoxes: [{ r: 0, c: targetCol }], brainHtml: buildBrainHtml, maskFromCol: currentMaskFromCol,
                highlightCells: makeHighlight("blue", [...currentDvdPartCells, ...divisorCells], [{ r: 0, c: targetCol }]),
                formulaHtml: formulaHtml("blue", `${currentTargetValue} ÷ ${divisorInt} ＝ ${quotientDigit}`),
                hissanRound: hissanRoundData
            });

            const product = quotientDigit * divisorInt;
            const productStr = product.toString();
            let multiplyCells = [];
            for (let j = 0; j < productStr.length; j++) {
                multiplyCells.push({ r: currentRow, c: targetCol - (productStr.length - 1) + j, char: productStr[j], borderBottom: true });
            }
            const multiplyCoreCells = multiplyCells.map(c => ({ r: c.r, c: c.c }));
            let nextDropCol = targetCol;
            if (i < stopI - 1) {
                let lookRem = currentTargetValue - product;
                let lookIdx = i + 1;
                while (lookIdx < stopI - 1) {
                    let lookVal = lookRem * 10 + parseInt(dvdDigits[lookIdx], 10);
                    if (lookVal < divisorInt) {
                        lookRem = lookVal;
                        lookIdx++;
                    } else {
                        break;
                    }
                }
                nextDropCol = M + lookIdx;
            }
            multiplyCells = extendHorizontalLine(multiplyCells, currentRow, targetCol, i < stopI - 1, nextDropCol);
            steps.push({
                phase: "multiply",
                description: `【かける】 ${divisorInt} × ${quotientDigit} ＝ ${product} を書きます。`,
                dots: { ...currentDots }, writeCells: multiplyCells, 
                pulseBoxes: getHighlightPulseBoxes(multiplyCells), maskFromCol: currentMaskFromCol,
                brainHtml: buildBrainHtml,
                highlightCells: makeHighlight("green", [{ r: 0, c: targetCol }, ...divisorCells], multiplyCoreCells),
                formulaHtml: formulaHtml("green", `${divisorInt} × ${quotientDigit} ＝ ${product}`),
                hissanRound: hissanRoundData
            });
            currentRow++;

            currentRemainder = currentTargetValue - product;
            const isLastDigit = (i === stopI - 1);
            const subtractCells = [];
            const remStr = currentRemainder.toString();
            const shouldWriteIntermediateZero = !(currentRemainder === 0 && !isLastDigit);
            if (shouldWriteIntermediateZero) {
                for (let j = 0; j < remStr.length; j++) {
                    subtractCells.push({ r: currentRow, c: targetCol - (remStr.length - 1) + j, char: remStr[j] });
                }
            }
            steps.push({
                phase: "subtract",
                description: `【ひく】 ${currentTargetValue}-${product}＝${currentRemainder}です。`,
                dots: { ...currentDots }, writeCells: subtractCells, 
                pulseBoxes: subtractCells.map(sc => ({ r: sc.r, c: sc.c })), maskFromCol: currentMaskFromCol,
                brainHtml: buildBrainHtml,
                highlightCells: makeHighlight("red", [...currentDvdPartCells, ...multiplyCoreCells], subtractCells.map(sc => ({ r: sc.r, c: sc.c }))),
                formulaHtml: formulaHtml("red", `${currentTargetValue} − ${product} ＝ ${currentRemainder}`),
                hissanRound: hissanRoundData
            });
            if (shouldWriteIntermediateZero) {
                prevRemainderCells = subtractCells.map(sc => ({ r: sc.r, c: sc.c }));
            } else {
                prevRemainderCells = [];
            }

            if (route === "advance" && gaisuConfig !== null && gaisuConfig.mode === "significant") {
                const earlyRoundMeta = buildEarlySignificantRoundMeta(quotientPositions, gaisuConfig.digits, i);
                if (earlyRoundMeta) {
                    break;
                }
            }

            if (!isLastDigit) {
                const nextDigit = dvdDigits[i + 1];
                const isExtraZero = (i + 1 >= baseDvdDigits.length);
                const suppressDroppedZero = shouldSuppressDroppedZero(currentRemainder, nextDigit, true);
                const dropCells = suppressDroppedZero ? [] : [{ r: currentRow, c: targetCol + 1, char: nextDigit }];
                if (!suppressDroppedZero && isExtraZero) dropCells.push({ r: 1, c: targetCol + 1, char: "0", isNewZero: true });
                const dropBeforeCells = suppressDroppedZero ? [] : [{ r: 1, c: targetCol + 1 }];
                steps.push({
                    phase: "drop",
                    description: suppressDroppedZero
                        ? `【おろす】次におろすのは0ですが、ひき算で0になっているので省略します。`
                        : `【おろす】 下の位をおろして計算を続けます。`,
                    dots: { ...currentDots }, writeCells: dropCells, 
                    pulseBoxes: dropCells.map(dc => ({ r: dc.r, c: dc.c })), maskFromCol: currentMaskFromCol,
                    highlightCells: makeHighlight("orange", dropBeforeCells, dropCells.map(dc => ({ r: dc.r, c: dc.c }))),
                    formulaHtml: suppressDroppedZero ? "" : formulaHtml("orange", `${nextDigit} を下ろす`),
                    hissanRound: hissanRoundData
                });
                // ★次のループで「今回新たに見る1桁」として参照すべき位置を更新。
                // 0を補っておろす場合（isExtraZero）も含め、常に「実際に下段へおろされた
                // 後の数」を指す。dropが省略された場合のみ下段に何も書かれていないので
                // 例外的にrow1を参照する。
                if (suppressDroppedZero) {
                    nextDigitCellOverride = null;
                } else {
                    nextDigitCellOverride = { r: currentRow, c: targetCol + 1 };
                }
                lastDropRow = currentRow;
                currentRow++;
            }
        }

        // 4年生あまりルートの時、残った小数位の数字をノートの下へ一気にまとめて下ろし、元の位置に点を入れる処理
        let finalRemainderStr = currentRemainder.toString();
        let remainderNeedsLeadingZero = false;
        if (isRemainderRoute) {
            let dvdNum = parseFloat(dividendStr);
            let divNum = parseFloat(divisorStr);
            let movedDvdInt = Math.floor(dvdNum * Math.pow(10, D));
            let movedDivInt = Math.round(divNum * Math.pow(10, D));
            let qInt = Math.floor(movedDvdInt / movedDivInt);
            let remNum = dvdNum - divNum * qInt;
            finalRemainderStr = remNum.toFixed(Math.max(dvdParse.decimalPlaces, divParse.decimalPlaces));
            if (finalRemainderStr.indexOf('.') !== -1) {
                finalRemainderStr = finalRemainderStr.replace(/0+$/, '').replace(/\.$/, '');
            }

            remainderNeedsLeadingZero = /^0\./.test(finalRemainderStr);

            if (finalDvdDotAfter < N) {
                const dropCells = [];
                for (let k = finalDvdDotAfter; k < N; k++) {
                    dropCells.push({ r: currentRow, c: M + k, char: dvdDigits[k] });
                }
                const remDropBeforeCells = dropCells.map(dc => ({ r: 1, c: dc.c }));
                steps.push({
                    phase: "remainder-drop",
                    description: `【おろす】あまりを出すために、残りの小数位の数字をそのまま下におろします。`,
                    dots: { ...currentDots }, writeCells: dropCells,
                    pulseBoxes: dropCells.map(dc => ({ r: dc.r, c: dc.c })), maskFromCol: currentMaskFromCol,
                    highlightCells: makeHighlight("orange", remDropBeforeCells, dropCells.map(dc => ({ r: dc.r, c: dc.c }))),
                    formulaHtml: formulaHtml("orange", `${dvdDigits.slice(finalDvdDotAfter)} を下ろす`)
                });
            }

            const showRemainderDot = (dvdParse.hasDot || divParse.hasDot || finalRemainderStr.indexOf('.') !== -1);
            if (showRemainderDot) {
                currentDots.remainder = dvdParse.dotAfter + M;
                currentDots.remainderRow = currentRow;

                const remainderWriteCells = [];
                if (finalRemainderStr.indexOf('.') !== -1) {
                    const [intPart, decPart] = finalRemainderStr.split('.');
                    if (intPart === "0") {
                        remainderWriteCells.push({ r: currentRow, c: currentDots.remainder - 1, char: "0" });
                    }
                    for (let dIdx = 0; dIdx < decPart.length; dIdx++) {
                        const targetRemCol = currentDots.remainder + dIdx;
                        const alreadyDropped = (finalDvdDotAfter < N) && (dIdx < N - finalDvdDotAfter);
                        if (!alreadyDropped && decPart[dIdx] === "0") {
                            remainderWriteCells.push({ r: currentRow, c: targetRemCol, char: "0", isNewZero: true });
                        }
                    }
                }

                steps.push({
                    phase: "remainder-dot",
                    description: remainderNeedsLeadingZero
                        ? `【あまりの小数点】あまりが 0.4 の形になるときは、0 を書いたあと、もとの小数点からまっすぐ下におろして打ちます。`
                        : `【あまりの小数点】わられる数の「もとの小数点」からまっすぐ下におろして打ちます。`,
                    dots: { ...currentDots }, maskFromCol: currentMaskFromCol,
                    writeCells: remainderWriteCells,
                    pulseBoxes: remainderWriteCells.map(cell => ({ r: cell.r, c: cell.c }))
                });
            }
        }

        if (route === "advance" && showDotsInThisProblem) {
            currentDots.showDvdOrigInit = true;
            currentDots.quotient = finalDvdDotAfter + M;

            let quotientDotWriteCells = [];
            const onesPlaceCol = currentDots.quotient - 1;
            const onesPlaceIdx = onesPlaceCol - M;
            const shouldRestoreOnesZero = (
                firstQuotientCol !== null &&
                firstQuotientCol >= currentDots.quotient &&
                onesPlaceIdx >= 0 && onesPlaceIdx < quotientPositions.length &&
                quotientPositions[onesPlaceIdx] === "" &&
                skippedCols.includes(onesPlaceCol)
            );

            if (shouldRestoreOnesZero) {
                quotientDotWriteCells = [{ r: 0, c: onesPlaceCol, char: "0", isGuide: false }];
                quotientPositions[onesPlaceIdx] = "0";
            }

            const divisorDotWasMoved = (
                currentDots.divOriginal !== null &&
                currentDots.divCurrent !== null &&
                currentDots.divCurrent !== currentDots.divOriginal
            );

            let quotientDotDescription = divisorDotWasMoved
                ? `【小数点】移動したあとの小数点から、商の小数点へまっすぐ上にのぼります。`
                : `【小数点】商の小数点を、わられる数の小数点の真上に打ちます。`;

            if (shouldRestoreOnesZero) {
                quotientDotDescription += ` 必要な位の✕を0に直します。`;
            }

            steps.push({
                phase: "quotient-dot",
                description: quotientDotDescription,
                dots: { ...currentDots },
                writeCells: quotientDotWriteCells,
                maskFromCol: currentMaskFromCol,
                pulseBoxes: quotientDotWriteCells.map(cell => ({ r: cell.r, c: cell.c }))
            });
        }

        let finalGaisuCells = [];
        if (route === "advance" && gaisuConfig !== null && !isUntilCycleMode) {
            let roundMeta = buildRoundOffMeta(quotientPositions, finalDvdDotAfter, gaisuConfig);
            let roundedDigits = normalizeDigitArray(quotientPositions);
            let checkIdx = roundMeta ? roundMeta.checkIdx : (finalDvdDotAfter + 1);
            while (roundedDigits.length <= checkIdx) roundedDigits.push(0);

            let checkDigit = roundedDigits[checkIdx] || 0;
            let targetName = (gaisuConfig.mode === "significant")
                ? `上から${gaisuConfig.digits}けた`
                : (gaisuConfig.digits === 0 ? "一の位" : gaisuConfig.digits === 1 ? "小数第一位" : "小数第二位");

            let isRoundUp = (checkDigit >= 5);
            let description = `【概数にする】${targetName}までの概数にするために、一つ下のマスの「${checkDigit}」を四捨五入します。`;
            description += isRoundUp ? ` 「5以上」なので【切り上げ】です！` : ` 「4以下」なので【切り捨て】です！`;

            finalGaisuCells.push({
                r: 0, c: M + checkIdx, char: checkDigit.toString(),
                hasSlash: true, topChar: "0", isRedBorder: true
            });

            if (isRoundUp) {
                let idx = checkIdx - 1;
                let carry = 1;
                while (idx >= 0 && carry > 0) {
                    let d = parseInt(roundedDigits[idx], 10);
                    if (isNaN(d)) d = 0;
                    let newD = d + carry;
                    if (newD >= 10) {
                        finalGaisuCells.push({
                            r: 0, c: M + idx, char: d.toString(),
                            hasSlash: true, topChar: "0"
                        });
                        roundedDigits[idx] = 0;
                        carry = 1;
                    } else {
                        finalGaisuCells.push({
                            r: 0, c: M + idx, char: d.toString(),
                            hasSlash: true, topChar: newD.toString()
                        });
                        roundedDigits[idx] = newD;
                        carry = 0;
                    }
                    idx--;
                }
            }

            steps.push({
                phase: "round-off",
                description: description,
                dots: { ...currentDots },
                writeCells: [...finalGaisuCells],
                maskFromCol: currentMaskFromCol,
                pulseBoxes: finalGaisuCells.map(fc => ({ r: fc.r, c: fc.c }))
            });
        }

        const completeWriteCells = [];
        if (finalGaisuCells.length > 0) {
            finalGaisuCells.forEach(cell => completeWriteCells.push({ ...cell }));
        }

        // 4年生の「あまりを出す」ルートで、最後が「商に0が立つ」で終わると、
        // 省略設定によっては かける・ひく のステップが作られず、最後のあまり0が
        // ノート上に残らないことがある。完成ステップでは必ず最終的なあまりを
        // 見える形にしておく。
        if (route === "remainder" && finalRemainderStr.indexOf('.') === -1) {
            const finalTargetCol = currentMaskFromCol !== null ? currentMaskFromCol - 1 : (M + finalDvdDotAfter - 1);
            const remDigits = finalRemainderStr.split('');
            const finalRemainderRow = (prevRemainderCells && prevRemainderCells.length > 0)
                ? prevRemainderCells[0].r
                : (lastDropRow !== null ? lastDropRow : Math.max(2, currentRow - 1));
            remDigits.forEach((ch, idx) => {
                completeWriteCells.push({
                    r: finalRemainderRow,
                    c: finalTargetCol - (remDigits.length - 1) + idx,
                    char: ch
                });
            });
        }

        // finalQuotientStr: quotientPositions（dvdDigits の各桁に対応）から
        // 人間が読める商の文字列を組み立てる。
        // 4年生ルートはそのままの商、概数ルートは四捨五入した表示にする。
        let finalQuotientStr = (() => {
            if (route === "advance" && gaisuConfig !== null && !isUntilCycleMode) {
                return formatRoundedQuotient(quotientPositions, finalDvdDotAfter, gaisuConfig);
            }

            const rawDigits = quotientPositions.map(q => (q === "" || q === "✕") ? "0" : q);
            let intPart = rawDigits.slice(0, finalDvdDotAfter).join("") || "0";
            let decPart = rawDigits.slice(finalDvdDotAfter).join("");
            intPart = intPart.replace(/^0+/, "") || "0";
            if (!isUntilCycleMode) decPart = decPart.replace(/0+$/, "");
            return decPart.length > 0 ? `${intPart}.${decPart}` : intPart;
        })();

        steps.push({
            phase: "complete",
            description: route === "remainder"
                ? `【完成！】これ以上おろす数がないので、ここで終わりです！ 商は ${finalQuotientStr}、あまりは ${finalRemainderStr} になります。`
                : (isUntilCycleMode
                    ? (untilCycleInfo && untilCycleInfo.terminated
                        ? `【完成！】わり切れました！商は ${finalQuotientStr} です。`
                        : (untilCycleInfo && untilCycleInfo.hasCycle
                            ? `【完成！】商は ${finalQuotientStr} …のように、同じ数字のならびがくり返される「循環小数」になっています。ここまでで1周期分をたしかめました。`
                            : `【完成！】商は ${finalQuotientStr} …と続きます（けた数の上限まで計算しました）。`))
                    : (gaisuConfig !== null
                        ? `【完成！】指定した方法で四捨五入した商が求められました！商は約${finalQuotientStr}です。`
                        : `【完成！】わり進めた商が求められました！商は ${finalQuotientStr} です。`)),
            dots: { ...currentDots },
            writeCells: completeWriteCells,
            maskFromCol: currentMaskFromCol, pulseBoxes: []
        });

        return { initialCells, steps, totalRows: currentRow + 2, totalCols: M + N, M, N };
    }
}

let appState = null;
let currentStepIdx = 0;
let gridData = [];
let quotientDotAnimFrame = null;
let uiHintsEnabled = true;
let zeroStepExpanded = false;

function applyUiHintsState() {
    const panel = document.getElementById('step-panel');
    const button = document.getElementById('btn-toggle-hints');
    document.body.classList.toggle('ui-hints-off', !uiHintsEnabled);

    if (panel) {
        panel.style.display = uiHintsEnabled ? 'block' : 'none';
    }
    if (button) {
        button.textContent = uiHintsEnabled ? '循環カード・背景ヒント：ON' : '循環カード・背景ヒント：OFF';
        button.classList.toggle('is-off', !uiHintsEnabled);
    }
    if (!uiHintsEnabled) {
        document.getElementById('app').style.backgroundColor = '#f7f9fa';
    }
}

function toggleUiHints() {
    uiHintsEnabled = !uiHintsEnabled;
    applyUiHintsState();
    applyZeroModeState();
    if (appState && appState.steps && appState.steps[currentStepIdx]) {
        updateStepFlow(appState.steps[currentStepIdx]);
    }
}

function applyZeroModeState() {
    const button = document.getElementById('btn-toggle-zero-mode');
    if (!button) return;
    button.textContent = zeroStepExpanded ? '0が立つとき：かける・ひくを省略しない' : '0が立つとき：かける・ひくを省略する';
    button.classList.toggle('is-off', !zeroStepExpanded);
}

function toggleZeroMode() {
    zeroStepExpanded = !zeroStepExpanded;
    applyZeroModeState();
    if (appState && appState.steps && appState.steps[currentStepIdx]) {
        applyStepUI();
    }
}

function cancelQuotientDotAnimation() {
    if (quotientDotAnimFrame !== null) {
        cancelAnimationFrame(quotientDotAnimFrame);
        quotientDotAnimFrame = null;
    }
}

// 学年・出し方の状態（グローバル）
let currentGrade = null; // 'grade4' | 'grade5'
let currentRoute = 'remainder'; // 'remainder' | 'advance'
let currentGaisuMode = 'decimal-1';
let currentProblem = null; // { dividendStr, divisorStr, hasRemainder, dividesOut }

function setActiveChoiceButton(container, matchFn) {
    if (!container) return;
    container.querySelectorAll('.choice-btn').forEach(btn => {
        btn.classList.toggle('active', matchFn(btn));
    });
}

// 学年に応じて質問ゾーンの見た目（ボタンの表示・非表示）を切り替え、筆算を再生成する
function updateQuestionZoneForGrade() {
    if (!currentProblem) return;
    const { hasRemainder, dividesOut } = currentProblem;
    const questionZone = document.getElementById('question-zone');
    const routeRow = document.getElementById('route-choice-row');
    const gaisuRow = document.getElementById('gaisu-sub-row');

    if (!hasRemainder && dividesOut) {
        // わりきれる問題なので選択UIは不要
        questionZone.style.display = 'none';
        routeRow.style.display = 'none';
        gaisuRow.style.display = 'none';
        currentRoute = 'remainder';
        regenerateSteps();
        return;
    }

    questionZone.style.display = 'flex';

    if (hasRemainder) {
        if (currentGrade === 'grade4') {
            // 4年生：あまりを出す一択なので、選択肢ボタンは出さない
            routeRow.style.display = 'none';
            gaisuRow.style.display = 'none';
            currentRoute = 'remainder';
        } else {
            // 5年生以上：わり進める／あまりを出す を選ばせる
            routeRow.style.display = 'flex';
            setActiveChoiceButton(routeRow, btn => btn.dataset.route === currentRoute);
            if (currentRoute === 'advance') {
                gaisuRow.style.display = 'flex';
                setActiveChoiceButton(gaisuRow, btn => btn.dataset.gaisu === currentGaisuMode);
            } else {
                gaisuRow.style.display = 'none';
            }
        }
    } else {
        // hasRemainder が無いのにわりきれない特殊ケース：わり進めるしかない
        routeRow.style.display = 'none';
        currentRoute = 'advance';
        gaisuRow.style.display = 'flex';
        setActiveChoiceButton(gaisuRow, btn => btn.dataset.gaisu === currentGaisuMode);
    }

    regenerateSteps();
}

// すでに問題文の分析が終わっている前提で、選ばれたルート・概数モードを使って筆算を作り直す
function regenerateSteps() {
    if (!currentProblem) return;
    const { dividendStr, divisorStr, dividesOut } = currentProblem;
    const route = currentRoute;
    const gaisuConfig = (route === 'advance' && !dividesOut) ? parseGaisuConfig(currentGaisuMode) : null;
    appState = AdvancedDivisionEngine.generateSteps(dividendStr, divisorStr, route, gaisuConfig);
    currentStepIdx = 0;

    // ===== 図解（ブロック配布アニメ）用のラウンド一覧を作り直す =====
    clearHissanIllusTimers(); clearHissanRoundTimers(); clearHissanRevealTimers(); clearIllusTimingTimers();
    hissanIllusState.hasPlayedFullReveal = false;
    hissanIllusState.rounds = buildHissanRoundsList(appState);
    (function () {
        const firstRound = hissanIllusState.rounds[0];
        hissanIllusState.fullDigits = (firstRound && firstRound.previewDigits && firstRound.previewDigits.length)
            ? buildFullDividendDigits(firstRound.digit, firstRound.previewDigits)
            : null;
        hissanIllusState.fullStartExponent = firstRound ? firstRound.exponent : 0;
        hissanIllusState.fullDisplayValue = dividendStr;
    })();

    gridData = Array(appState.totalRows).fill(null).map(() =>
        Array(appState.totalCols).fill(null).map(() => ({
            char: "", isGuide: false, borderTop: false, borderBottom: false, isNewZero: false,
            hasSlash: false, topChar: "", isRedBorder: false, isDropping: false, dropDistance: 0
        }))
    );

    appState.initialCells.forEach(cell => { gridData[cell.r][cell.c].char = cell.char; });
    for (let c = appState.M; c < appState.totalCols; c++) { gridData[1][c].borderTop = true; }

    renderGridStructure();
    applyZeroModeState();
    applyStepUI();
    updateButtons();
}

function initSimulation() {
    const dividendInput = document.getElementById('num-dividend');
    const divisorInput = document.getElementById('num-divisor');

    dividendInput.value = sanitizeInput(dividendInput.value.trim());
    divisorInput.value = sanitizeInput(divisorInput.value.trim());

    const dividendStr = dividendInput.value;
    const divisorStr = divisorInput.value;
    if (!dividendStr || !divisorStr) return;

    // 内部で先に整数商を最後まで計算し、余りの有無→割り切れるか、の順で分岐
    const divParse = parseNumberMeta(divisorStr);
    const dvdParse = parseNumberMeta(dividendStr);
    const D = divParse.decimalPlaces;
    const dvdNum = parseFloat(dividendStr);
    const divNum = parseFloat(divisorStr);
    const movedDvdInt = Math.floor(dvdNum * Math.pow(10, D));
    const movedDivInt = Math.round(divNum * Math.pow(10, D));
    const qInt = Math.floor(movedDvdInt / movedDivInt);
    const remNum = Math.round((dvdNum - divNum * qInt) * 1e10) / 1e10;
    const hasRemainder = Math.abs(remNum) > 1e-9;
    const dividesOut = AdvancedDivisionEngine.checkWillDivideOut(dividendStr, divisorStr);

    currentProblem = { dividendStr, divisorStr, hasRemainder, dividesOut };

    // 問題が変わったら、選択の初期値を分かりやすいデフォルトに戻す
    currentRoute = (currentGrade === 'grade4') ? 'remainder' : 'advance';
    currentGaisuMode = 'decimal-1';

    updateQuestionZoneForGrade();
}

// 桁数が多い筆算（割りきれるまで計算！など）でもノートに収まるよう、
// 列数がしきい値を超えたぶんだけマスのサイズを自動で縮小する。
function applyAutoShrink(totalCols) {
    // 図解OFFのときは筆算の枠をめいっぱい大きく使えるので、マスの基準サイズも大きくする
    const BASE_SIZE = illusEnabled ? 46 : 62;
    const SHRINK_START_COLS = illusEnabled ? 18 : 14; // このマス数までは通常サイズ
    const MIN_SIZE = 16; // これ以上は縮めない（読めなくなるため）
    let cellSize = BASE_SIZE;
    if (totalCols > SHRINK_START_COLS) {
        cellSize = Math.max(MIN_SIZE, Math.floor(BASE_SIZE * SHRINK_START_COLS / totalCols));
    }
    const wrapper = document.getElementById('notebook-container');
    if (wrapper) wrapper.style.setProperty('--cell-size', `${cellSize}px`);
    return cellSize;
}

function renderGridStructure() {
    const gridEl = document.getElementById('division-grid');
    gridEl.innerHTML = "";
    const cellSize = applyAutoShrink(appState.totalCols);
    gridEl.style.gridTemplateColumns = `repeat(${appState.totalCols}, ${cellSize}px)`;
    for (let r = 0; r < appState.totalRows; r++) {
        for (let c = 0; c < appState.totalCols; c++) {
            const cellMeta = gridData[r][c];
            if (!cellMeta) continue;
            const cellDiv = document.createElement('div');
            cellDiv.classList.add('grid-cell'); cellDiv.id = `cell-${r}-${c}`;
            if (cellMeta.borderTop) cellDiv.classList.add('border-top-solid');
            if (cellMeta.borderBottom) cellDiv.classList.add('border-bottom-solid');
            if (cellMeta.isNewZero) cellDiv.classList.add('added-zero');
            if (cellMeta.isRedBorder) cellDiv.classList.add('red-border');

            const container = document.createElement('div');
            container.classList.add('cell-container');

            const topNum = document.createElement('div');
            topNum.classList.add('top-num');
            topNum.innerText = cellMeta.topChar || "";
            if (cellMeta.topChar === "0") {
                topNum.style.color = "#ef4444"; 
            } else if (cellMeta.topChar) {
                topNum.style.color = "#22c55e"; 
            }

            const mainNum = document.createElement('div');
            mainNum.classList.add('main-num');

            if (cellMeta.isDropping) {
                mainNum.classList.add('digit-dropping');
                mainNum.style.setProperty('--drop-start-y', `-${cellMeta.dropDistance}px`);
            }

            if (cellMeta.isGuide) {
                mainNum.innerHTML = `<span class="gray-guide">✕</span>`;
            } else {
                mainNum.innerText = cellMeta.char;
            }

            const slash = document.createElement('div');
            slash.classList.add('slash-line');
            if (cellMeta.hasSlash) {
                slash.style.display = "block";
            }

            container.appendChild(topNum);
            container.appendChild(mainNum);
            container.appendChild(slash);
            cellDiv.appendChild(container);

            gridEl.appendChild(cellDiv);
        }
    }
}

function drawDropArrow(fromR, fromC, toR, toC) {
    const svg = document.getElementById('hint-svg');
    const containerRect = document.getElementById('notebook-container').getBoundingClientRect();

    const fromCell = document.getElementById(`cell-${fromR}-${fromC}`);
    const toCell = document.getElementById(`cell-${toR}-${toC}`);
    if (!fromCell || !toCell) return;

    const fromRect = fromCell.getBoundingClientRect();
    const toRect = toCell.getBoundingClientRect();
    const sc = stageScale();

    // ★ getBoundingClientRect は「#app に掛かっている transform:scale() 適用後」の
    // 画面上の座標を返す。#hint-svg 自体もその同じ縮尺で表示されるので、SVGの
    // ローカル座標系（＝拡大縮小前の1280x720基準）に戻すため sc で割る。
    const x = ((fromRect.left + fromRect.right) / 2 - containerRect.left) / sc;
    const yStart = (fromRect.bottom - containerRect.top) / sc - 5;
    const yEnd = (toRect.top - containerRect.top) / sc + 2;

    line.setAttribute("x1", x);

function formatPlaceValueLabel(exponent){
  if (exponent >= 0) return String(Math.pow(10, exponent));
  return "0." + "0".repeat(Math.max(0, -exponent - 1)) + "1";

function getPlaceValueUnit(exponent){

// --------------------------------------------------
// ブロックが多すぎて枠から見切れてしまうのを防ぐための、汎用の
// 「自動フィットグリッド」計算。指定した個数(count)のブロックを、
// 指定の横幅(availW)・縦幅(availH)の中にできるだけ大きいまま収めるため、
// まず等倍(scale=1)で1行あたりの列数を決め、必要な行数が縦に収まらない
// 場合だけ少しずつ縮小しながら再計算する（縮小の下限は minScale）。
// 戻り値の scale をブロックの表示倍率に、cols/stepX/stepY をグリッド
// 配置の計算にそのまま使う。
function autoFitGrid(count, itemStepX, itemH, availW, availH, minScale, maxCols){
  minScale = (minScale === undefined) ? 0.45 : minScale;
  if(count <= 0){
    return { scale: 1, cols: 0, rows: 0, stepX: itemStepX, stepY: itemH * 1.3 };
  }
  var rowGapRatio = 0.3;
  var scale = 1;
  var cols, rows, stepX, stepY;
  for(var i = 0; i < 16; i++){
    stepX = itemStepX * scale;
    cols = Math.max(1, Math.min(count, Math.floor(availW / stepX)));
    if(maxCols) cols = Math.min(cols, maxCols);
    rows = Math.ceil(count / cols);
    stepY = itemH * scale * (1 + rowGapRatio);
    var neededH = rows * stepY;
    if(neededH <= availH || scale <= minScale + 1e-6){
      break;
    }
    scale = Math.max(minScale, scale - 0.05);
  }
  return { scale: scale, cols: cols, rows: rows, stepX: stepX, stepY: stepY };
}

// ==================================================================
// ラウンド上部の「このラウンドで扱う個数ぶんのブロック」の共通レイアウト
// ------------------------------------------------------------------
// ①たてる／隠す（roundStage0-1、initLayout）で並べる「このラウンドの
// value個」も、④おろす（drop、nextLayout）で並べる「あまり×10＋次の
// 桁＝次のラウンドのvalue個」も、次に画面上で見える個数・単位は
// 実質おなじグループ（＝次のラウンドの①たてるで表示される内容）。
// 別々の関数呼び出し・別々のパラメータ（中心Y・使える高さ）で計算して
// いると、桁の境目でブロックの縮尺や行数・中心位置がわずかにズレて、
// ラウンドが切り替わった瞬間に「ガクッ」と瞬間移動して見えてしまう。
// 必ずこの共通関数を通すことで、同じ個数・同じ単位を渡した場合は
// 常にビットまで同一の座標が返る＝ラウンドの境目でも見た目がそのまま
// 連続する（同一画面でシームレスに繋がる）ことを保証する。
var HISSAN_TOP_GRID_AVAIL_W = 440;
var HISSAN_TOP_GRID_AVAIL_H = 88;
var HISSAN_TOP_GRID_CENTER_Y = 113;
var HISSAN_TOP_GRID_MIN_SCALE = 0.4;
function computeHissanTopLayout(count, unit){
  // 1行あたり最大10こまでに制限し、10こに達したら必ず段を変える。
  // こうすることで「バラして生まれたブロック＋次の桁」がずらっと
  // 並んでも、10こずつのまとまり（＝行）としてひと目で数えやすくなる。
  var layout = autoFitGrid(count, unit.step, unit.height, HISSAN_TOP_GRID_AVAIL_W, HISSAN_TOP_GRID_AVAIL_H, HISSAN_TOP_GRID_MIN_SCALE, 10);
  var gridH = layout.rows * layout.stepY;
  layout.topY = HISSAN_TOP_GRID_CENTER_Y - gridH / 2;
  return layout;
}
// layout（computeHissanTopLayoutの戻り値）・unit・count（並べる総数）・
// n（0始まりのインデックス）から、n番目のブロックの中心/左上座標を返す。
function hissanTopSlotPos(layout, unit, count, n){
  var row = Math.floor(n / layout.cols);
  var col = n % layout.cols;
  var itemsInRow = Math.min(layout.cols, count - row * layout.cols);
  var rowW = itemsInRow * layout.stepX - (layout.stepX - unit.width * layout.scale);
  var rowStartX = 230 - Math.round(rowW / 2);
  var topX = rowStartX + col * layout.stepX;
  var rowCenterY = layout.topY + row * layout.stepY + layout.stepY / 2;
  if(unit.anchor === "center"){
    return { x: topX + (unit.width * layout.scale) / 2, y: rowCenterY };
  }
  return { x: topX, y: rowCenterY - (unit.height * layout.scale) / 2 };
}

// fullDigits（例：[7,5,6]）から、各桁を1列（column）として、横一列に
// 並べたときの座標を計算する。桁位置ごとに実際の見た目（1000/100/10/1）と
// 個数ぶんの座標を持たせ、あとから「先頭2桁（使う分）」と
// 「残りの桁（まだ使わない分）」をまとめて扱えるようにしている。
// 4けた（千の位まで）など、等倍だと横幅460の枠に収まらない場合は、
// 収まる幅まで自動的に縮小する（columns[].scale / 戻り値.scale に
// 縮小率を持たせ、実際のブロック描画側で transform の scale() として
// 使う）。
function layoutFullRevealBlocks(fullDigits, startExponent) {
