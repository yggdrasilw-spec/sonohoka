  }
}

// --- CANVAS CLICK INTERACTION & LOGIC ---
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  if (appMode === 'MODE2') {
    handleMode2Click(clickX, clickY);
    return;
  }

  if (cameraView !== 'SIDE' || isCompleted) return;

  // ビーバーが材料を持って到着していない間は設置できない（泳いでいる最中 or 何も選んでいない）
  if (beaverCarryState !== 'arrived' || carryTool !== currentTool) {
    if (beaverCarryState === 'swimming') {
      speak('ビーバーが泳いでくるのを待ってね！');
    }
    return;
  }

  // Check if click is inside Dam Building Zone (x: 380 ~ 540, y: 220 ~ 430)
  if (clickX < 370 || clickX > 550 || clickY < 210 || clickY > 440) {
    sfxFail();
    speak('ダムを造る場所は、川の中央（枠の中）だよ！');
    return;
  }

  // TOOL 1: THICK BRANCH
  if (currentTool === 'branch') {
    if (!isPointyDown) {
      // FAIL: Branch orientation is wrong (Pointy Up/Horizontal) -> Floats downstream!
      spawnMaterialAnim('branch', false, clickX, clickY);
      sfxFloatAway();
      speak('うわわっ！平らな面が下だと川底に刺さらず、水に押されて流されちゃった！');
      retireCarrier();
      calculateSealAndWater();
      return;
    }

    // Check depth anchor: must be anchored near riverbed or existing logs
    const isNearBottom = (clickY >= 350);
    const isNearOtherLog = placedLogs.some(l => Math.hypot(l.x - clickX, l.y - clickY) < 45);

    if (!isNearBottom && !isNearOtherLog) {
      spawnMaterialAnim('branch', false, clickX, clickY);
      sfxFail();
      speak('宙に浮いた場所には設置できないよ！まずは川底に深々と刺そう！');
      retireCarrier();
      calculateSealAndWater();
      return;
    }

    // SUCCESS: Anchor log
    spawnMaterialAnim('branch', true, clickX, clickY);
    placedLogs.push({ x: clickX, y: clickY, scale: 0.85 });
    markGrid(clickX, clickY, 'log');
    sfxPlaceLog();
    speak('ザクッ！いいぞ、太い枝が川底にしっかり刺さって「支え」ができた！');
  }

  // TOOL 2: TWIGS
  else if (currentTool === 'twig') {
    // Requires nearby thick log to anchor twigs
    const hasLogSupport = placedLogs.some(l => Math.hypot(l.x - clickX, l.y - clickY) < 65);

    if (!hasLogSupport) {
      // FAIL: Twigs wash away without thick logs
      spawnMaterialAnim('twig', false, clickX, clickY);
      sfxFloatAway();
      speak('ああっ！太い枝の『柱』がない場所だと、小枝はあっという間に流されちゃう！');
      retireCarrier();
      calculateSealAndWater();
      return;
    }

    // SUCCESS
    spawnMaterialAnim('twig', true, clickX, clickY);
    placedTwigs.push({ x: clickX, y: clickY, scale: 0.9 });
    markGrid(clickX, clickY, 'twig');
    sfxPlaceTwig();
    speak('よし！太い枝に小枝が引っかかって、流れが少し弱まったぞ！');
  }

  // TOOL 3: STONES
  else if (currentTool === 'stone') {
    // Requires nearby twigs underneath to act as weight
    const hasTwigSupport = placedTwigs.some(t => Math.hypot(t.x - clickX, t.y - clickY) < 45);

    if (!hasTwigSupport) {
      // FAIL: Stone sinks directly to riverbed without securing twigs
      spawnMaterialAnim('stone', false, clickX, clickY);
      sfxSink();
      speak('ゴトン…石が底に沈んじゃった！石はただ置く（沈める）んじゃなくて、小枝を押さえる『重し』にするんだ！');
      retireCarrier();
      calculateSealAndWater();
      return;
    }

    // SUCCESS
    spawnMaterialAnim('stone', true, clickX, clickY);
    placedStones.push({ x: clickX, y: clickY, scale: 0.85 });
    markGrid(clickX, clickY, 'stone');
    sfxPlaceStone();
    speak('ズッシリ！石の重しで小枝がしっかり固定されたね！');
  }

  // TOOL 4: MUD
  else if (currentTool === 'mud') {
    // Requires twigs AND stones structure to hold mud from dissolving
    const hasStructure = placedTwigs.some(t => Math.hypot(t.x - clickX, t.y - clickY) < 50) &&
                         placedStones.some(s => Math.hypot(s.x - clickX, s.y - clickY) < 55);

    if (!hasStructure) {
      // FAIL: Mud dissolves into cloudy water
      spawnMaterialAnim('mud', false, clickX, clickY);
      sfxDissolve();
      speak('ジュワ〜…泥が溶けて流れて消えちゃった！枝と石で壁の骨組みを作ってから泥を塗ろう！');
      retireCarrier();
      calculateSealAndWater();
      return;
    }

    // SUCCESS
    spawnMaterialAnim('mud', true, clickX, clickY);
    placedMud.push({ x: clickX, y: clickY, scale: 0.9, seed: Math.random() * 1000 });
    markGrid(clickX, clickY, 'mud');
    sfxPlaceMud();
    speak('すばらしい！泥が隙間を埋めて、水漏れがピタッと止まり始めたぞ！');
  }

  retireCarrier();
  calculateSealAndWater();
});

// Update Dam Grid Sealing status
function markGrid(x, y, materialType) {
  // Convert world x, y to grid coordinates
  const c = Math.floor((x - 370) / (180 / GRID_COLS));
  const r = Math.floor((y - 230) / (180 / GRID_ROWS));

  if (r >= 0 && r < GRID_ROWS && c >= 0 && c < GRID_COLS) {
    // Fill local 3x3 region for smooth gap coverage
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        let nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS) {
          damGrid[nr][nc][materialType] = true;
          // Sealed if has branch/twig + stone + mud
          if (damGrid[nr][nc].mud && (damGrid[nr][nc].stone || damGrid[nr][nc].twig)) {
            damGrid[nr][nc].sealed = true;
          }
        }
      }
    }
  }
}

// Calculate Gap Coverage & Dynamic Upstream Water Height
function calculateSealAndWater() {
  let totalCells = GRID_ROWS * GRID_COLS;
  let sealedCells = 0;

  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      if (damGrid[r][c].sealed) sealedCells++;
    }
  }

  currentSealedRatio = Math.min(1.0, sealedCells / (totalCells * 0.65)); // 65% coverage = full seal

  // すき間が塞がるほど（特に後半）、急激に水がせき止められていく非線形カーブ
  const accumulationFactor = Math.pow(currentSealedRatio, 2.2);

  // 上流（左）: 水深がどんどん深くなっていく
  const targetDepthLeft = BASE_WATER_DEPTH + (MAX_UPSTREAM_DEPTH - BASE_WATER_DEPTH) * accumulationFactor;
  targetWaterSurfaceY = GROUND_LEFT_BASE_Y - targetDepthLeft;

  // 下流（右）: せき止められた分だけ流れ込む水が減り、水深が浅くなっていく
  const targetDepthRight = BASE_WATER_DEPTH - (BASE_WATER_DEPTH - MIN_DOWNSTREAM_DEPTH) * accumulationFactor;
  targetWaterSurfaceYRight = GROUND_RIGHT_BASE_Y - targetDepthRight;

  updateMetrics();

  // CHECK COMPLETION
  if (currentSealedRatio >= 0.95 && !isCompleted) {
    isCompleted = true;
    sfxDamComplete();
    speak('🎉 おめでとう！手前から向こうの岸まで隙間なく壁がつながったぞ！カメラが上空へ引き「大きな池」へと地形が変わるよ！');
    document.getElementById('completion-banner').classList.add('show');

    // Trigger Perspective Switch after 1.5s
    setTimeout(() => {
      cameraView = 'TRANSITION';
      document.getElementById('camera-mode-text').innerText = 'パノラマ俯瞰（上空）';
    }, 1800);
  }
}

function updateMetrics() {
  const sealPercent = Math.floor(currentSealedRatio * 100);
  document.getElementById('seal-progress').style.width = sealPercent + '%';
  document.getElementById('seal-text').innerText = sealPercent + '%';

  const depthMeters = (0.4 + (currentSealedRatio * 2.2)).toFixed(1);
  document.getElementById('water-depth-text').innerText = `${depthMeters}m (${currentSealedRatio > 0.8 ? '満水/池' : currentSealedRatio > 0.4 ? '深くなってきた' : '浅い'})`;

  const depthRightMeters = Math.max(0.05, (0.4 - (currentSealedRatio * 0.35))).toFixed(2);
  document.getElementById('water-depth-right-text').innerText = `${depthRightMeters}m (${currentSealedRatio > 0.8 ? '干上がり気味' : currentSealedRatio > 0.4 ? '少し減ってきた' : '浅い'})`;
}

// --- RENDER & ANIMATION LOOP ---
let animFrameTime = 0;

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  animFrameTime += 0.04;

  if (appMode === 'MODE2') {
    renderTopView();
    requestAnimationFrame(render);
    return;
  }

  // Smooth Water surface interpolation (左右それぞれ滑らかに追従させる)
  waterSurfaceY += (targetWaterSurfaceY - waterSurfaceY) * 0.05;
  waterSurfaceYRight += (targetWaterSurfaceYRight - waterSurfaceYRight) * 0.05;

  // Handle Camera Transition Progress (0.0 Side View -> 1.0 Overhead Isometric View)
  if (cameraView === 'TRANSITION') {
    transitionProgress += 0.012;
    if (transitionProgress >= 1.0) {
      transitionProgress = 1.0;
      cameraView = 'OVERVIEW';
    }
  }

  if (transitionProgress < 0.99) {
    renderSideView(1.0 - transitionProgress);
  }

  if (transitionProgress > 0.01) {
    renderIsometricOverview(transitionProgress);
  }

  // Render floating/sinking particles
  updateAndDrawParticles();

  requestAnimationFrame(render);
}

// -------------------------------------------------------------
// 1. SIDE CROSS-SECTION VIEW (HORIZONTAL VIEW)
// -------------------------------------------------------------
function renderSideView(alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;

  // Sky / Background
  let skyGrad = ctx.createLinearGradient(0, 0, 0, 300);
  skyGrad.addColorStop(0, '#1c313a');
  skyGrad.addColorStop(1, '#263238');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Distant Trees
  ctx.fillStyle = '#1b2a2f';
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 260); ctx.lineTo(x + 20, 190); ctx.lineTo(x + 40, 260);
    ctx.fill();
  }

  // Riverbed Ground Cross-Section (Bottom)
  ctx.fillStyle = '#3e2723';
  ctx.beginPath();
  ctx.moveTo(0, 410);
  ctx.quadraticCurveTo(300, 415, 370, 420); // Shallow bed left
  ctx.lineTo(550, 420); // Dam base area
  ctx.quadraticCurveTo(700, 425, 920, 430); // Downstream bed right
  ctx.lineTo(920, 500);
  ctx.lineTo(0, 500);
  ctx.closePath();
  ctx.fill();

  // Riverbed Pebbles & Mud Texture
  ctx.fillStyle = '#271c19';
  for (let px = 20; px < 900; px += 35) {
    ctx.beginPath();
    ctx.ellipse(px, 425 + Math.sin(px)*5, 12, 6, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // --- RIVER WATER (ONE CONTINUOUS BODY: UPSTREAM -> DAM ZONE -> DOWNSTREAM) ---
  // ダム設置エリアにも川がつながっているので、最初から水を描画する。
  // せき止めが進むにつれて、左(上流)は深く・右(下流)は浅くなるよう、
  // getSurfaceYAtX() が滑らかに左右の水面を補間する。
  let waterGrad = ctx.createLinearGradient(0, 0, 920, 0);
  waterGrad.addColorStop(0, 'rgba(2, 119, 189, 0.95)');
  waterGrad.addColorStop(0.38, 'rgba(2, 119, 189, 0.95)');
  waterGrad.addColorStop(0.62, 'rgba(79, 195, 247, 0.5)');
  waterGrad.addColorStop(1, 'rgba(79, 195, 247, 0.45)');

  ctx.fillStyle = waterGrad;
  ctx.beginPath();
  ctx.moveTo(0, getBedYAtX(0));
  ctx.lineTo(0, getSurfaceYAtX(0));

  for (let wx = 0; wx <= 920; wx += 15) {
    let baseY = getSurfaceYAtX(wx);
    // 上流ほど波が大きく、下流ほど波が小さい（水位差が視覚的にもわかる）
    let waveAmp = wx < DAM_ZONE_LEFT ? 3 : (wx > DAM_ZONE_RIGHT ? 1.5 : 2.2);
    let waveSpeed = wx > DAM_ZONE_RIGHT ? 3 : 2;
    let wy = baseY + Math.sin(wx * 0.03 + animFrameTime * waveSpeed) * waveAmp;
    ctx.lineTo(wx, wy);
  }

  ctx.lineTo(920, getSurfaceYAtX(920));
  ctx.lineTo(920, getBedYAtX(920));
  ctx.lineTo(0, getBedYAtX(0));
  ctx.closePath();
  ctx.fill();

  // 水面の光沢ライン（左右の水位差が見えるように、面に沿って一本引く）
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let wx = 0; wx <= 920; wx += 15) {
    let wy = getSurfaceYAtX(wx) + Math.sin(wx * 0.03 + animFrameTime * 2) * (wx < DAM_ZONE_LEFT ? 3 : 1.5);
    if (wx === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
  }
  ctx.stroke();

  // Water Flow Arrows / Ripples Upstream（上流は常に水が流れ込んでいるので、いつでも表示する）
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) {
    let rx = 10 + ((animFrameTime * 60 + i * 90) % (DAM_ZONE_LEFT - 40));
    let ry = waterSurfaceY + 7;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + 25, ry);
    ctx.stroke();
  }

  // Water Flow Arrows / Ripples Downstream（下流に水がまだ残っている間だけ表示）
  const downstreamDepth = getBedYAtX(700) - waterSurfaceYRight;
  if (downstreamDepth > 4) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      let rx = 560 + ((animFrameTime * 60 + i * 80) % 320);
      let ry = waterSurfaceYRight + 7;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx + 25, ry);
      ctx.stroke();
    }
  }

  // --- DAM BUILDING ZONE HIGHLIGHT (GUIDE BOX) ---
  if (!isCompleted) {
    ctx.strokeStyle = 'rgba(255, 224, 130, 0.4)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.strokeRect(370, 220, 170, 200);
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(255, 224, 130, 0.8)';
    ctx.font = '12px bold sans-serif';
    ctx.fillText('【ダム設置エリア】', 405, 212);
  }

  // --- DRAW PLACED MATERIALS IN DAM CROSS-SECTION ---
  // Layer 1: Thick Logs
  placedLogs.forEach(l => drawLogSVG(l.x, l.y, l.scale, true));
  // Layer 2: Twigs
  placedTwigs.forEach(t => drawTwigSVG(t.x, t.y, t.scale));
  // Layer 3: Stones
  placedStones.forEach(s => drawStoneSVG(s.x, s.y, s.scale));
  // Layer 4: Mud Fill
  placedMud.forEach(m => drawMudSVG(m.x, m.y, m.scale, m.seed));

  // --- HOVER / CURSOR PREVIEW ---
  if (!isCompleted) {
    // We could draw cursor ghost if needed
  }

  ctx.restore();
}

// -------------------------------------------------------------
// 2. ISOMETRIC PANORAMIC OVERVIEW (COMPLETION / POND CREATION)
// -------------------------------------------------------------
function renderIsometricOverview(alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;

  // Sky
  let sky = ctx.createLinearGradient(0, 0, 0, 180);
  sky.addColorStop(0, '#81d4fa');
  sky.addColorStop(1, '#e0f7fa');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, 180);

  // Sun
  ctx.fillStyle = '#fff9c4';
  ctx.beginPath(); ctx.arc(750, 70, 35, 0, Math.PI*2); ctx.fill();

  // Lush Green Valley Landscape
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(0, 180, canvas.width, 320);

  // Hills in background
  ctx.fillStyle = '#388e3c';
  ctx.beginPath();
  ctx.arc(200, 220, 180, Math.PI, 0); ctx.fill();
  ctx.beginPath();
  ctx.arc(500, 230, 220, Math.PI, 0); ctx.fill();

  // --- 上流から池へ注ぎ込む川（画面奥から流れ込む水）---
  // ダムが完成しても上流からの水の供給自体は止まらない。池は上流の川によって
  // 満たされ続けている、という自然な水循環を見せるために描く。
  // 起点は「緑の陸地（画面外）」に置き、何もない空中から出てこないようにする。
  ctx.fillStyle = '#29b6f6';
  ctx.beginPath();
  ctx.moveTo(-50, 230);
  ctx.quadraticCurveTo(20, 250, 80, 275);
  ctx.quadraticCurveTo(140, 290, 195, 300);
  ctx.lineTo(255, 290);
  ctx.quadraticCurveTo(190, 265, 130, 245);
  ctx.quadraticCurveTo(60, 220, -50, 200);
  ctx.closePath();
  ctx.fill();

  // 川岸（縁）
  ctx.strokeStyle = '#8d6e63';
  ctx.lineWidth = 4;
  ctx.stroke();

  // 流れているとわかるように、光の筋が上流から池へ動いていく
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const t = ((animFrameTime * 0.35) + i * 0.25) % 1;
    const sx = -30, sy = 215, ex = 220, ey = 295;
    const x = sx + (ex - sx) * t;
    const y = sy + (ey - sy) * t;
    ctx.beginPath();
    ctx.moveTo(x - 10, y - 6);
    ctx.lineTo(x + 10, y + 6);
    ctx.stroke();
  }
  ctx.restore();

  // --- THE CREATED POND (EXPANDED UPSTREAM WATER) ---
  // Pond expands sideways into a large wide lake behind the dam!
  let pondGrad = ctx.createRadialGradient(320, 340, 20, 320, 340, 240);
  pondGrad.addColorStop(0, '#0288d1');
  pondGrad.addColorStop(0.7, '#29b6f6');
  pondGrad.addColorStop(1, '#80deea');

  ctx.fillStyle = pondGrad;
  ctx.beginPath();
  ctx.ellipse(320, 340, 260, 120, -0.1, 0, Math.PI*2);
  ctx.fill();

  // Pond Edge / Bank
  ctx.strokeStyle = '#8d6e63';
  ctx.lineWidth = 6;
  ctx.stroke();

  // --- DOWNSTREAM NARROW RIVER (RIGHT SIDE) ---
  ctx.fillStyle = '#29b6f6';
  ctx.beginPath();
  ctx.moveTo(560, 340);
  ctx.quadraticCurveTo(680, 340, 750, 380);
  ctx.lineTo(820, 380);
  ctx.quadraticCurveTo(700, 370, 560, 370);
  ctx.closePath();
  ctx.fill();

  // --- THE COMPLETED DAM WALL IN ISOMETRIC VIEW ---
  ctx.fillStyle = '#4e342e';
  ctx.beginPath();
  ctx.moveTo(540, 240);
  ctx.lineTo(570, 250);
  ctx.lineTo(570, 430);
  ctx.lineTo(540, 420);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#271c19';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Dam Top Texture (Logs/Mud cap)
  ctx.fillStyle = '#6d4c41';
  for (let dy = 250; dy < 420; dy += 16) {
    ctx.beginPath(); ctx.arc(555, dy, 7, 0, Math.PI*2); ctx.fill();
  }

  // --- BEAVER LODGE (NEST IN THE POND) ---
  ctx.fillStyle = '#5d4037';
  ctx.beginPath();
  ctx.ellipse(220, 320, 35, 20, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#3e2723';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Lodge Stick details
  ctx.strokeStyle = '#8d6e63';
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(200 + i*6, 310);
    ctx.lineTo(210 + i*6, 325);
    ctx.stroke();
  }

  // --- HAPPY BEAVER SWIMMING IN THE POND ---
  let beaverX = 330 + Math.sin(animFrameTime * 1.5) * 40;
  let beaverY = 330 + Math.cos(animFrameTime * 1.5) * 15;

  // Water ripples around beaver
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(beaverX, beaverY + 5, 22, 8, 0, 0, Math.PI*2);
  ctx.stroke();

  // Beaver Body swimming
  ctx.fillStyle = '#6d4c41';
  ctx.beginPath();
  ctx.ellipse(beaverX, beaverY, 14, 9, 0.2, 0, Math.PI*2);
  ctx.fill();

  // Beaver Head
  ctx.beginPath();
  ctx.arc(beaverX + 12, beaverY - 4, 7, 0, Math.PI*2);
  ctx.fill();

  // Beaver Tail
  ctx.fillStyle = '#3e2723';
  ctx.beginPath();
  ctx.ellipse(beaverX - 16, beaverY + 2, 10, 4, -0.2, 0, Math.PI*2);
  ctx.fill();

  // Pine Trees around the pond
  const trees = [
    {x: 80, y: 260}, {x: 120, y: 230}, {x: 160, y: 420}, {x: 280, y: 460},
    {x: 440, y: 470}, {x: 620, y: 260}, {x: 700, y: 290}, {x: 800, y: 440}
  ];
  trees.forEach(t => {
    // Trunk
    ctx.fillStyle = '#3e2723';
    ctx.fillRect(t.x - 3, t.y, 6, 14);
    // Leaves
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath();
    ctx.moveTo(t.x, t.y - 30);
    ctx.lineTo(t.x - 16, t.y);
    ctx.lineTo(t.x + 16, t.y);
    ctx.closePath();
    ctx.fill();
  });

  ctx.restore();
}

// -------------------------------------------------------------
// MODE 2: TOP-DOWN OVERVIEW (岸から岸へ壁をつなげて池を作る)
// -------------------------------------------------------------
function renderTopView() {
  ctx.save();

  // --- 背景の陸地（奥/手前で少し色を変えて奥行き感を出す） ---
  // 水面は波打って揺れるので、川の境界ぴったりで陸地を止めると、揺れの谷の部分で
  // 背景の黒が見えてしまう。陸地を少し川側にかぶせておき、水は陸地の上から重ねて描く。
  const M2_LAND_OVERLAP = 8;
  ctx.fillStyle = '#3f7d34';
  ctx.fillRect(0, 0, 920, M2_RIVER_TOP + M2_LAND_OVERLAP);
  ctx.fillStyle = '#4d9440';
  ctx.fillRect(0, M2_RIVER_BOTTOM - M2_LAND_OVERLAP, 920, 500 - (M2_RIVER_BOTTOM - M2_LAND_OVERLAP));

  // 岸のラベル
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('奥の岸', 20, M2_RIVER_TOP - 12);
  ctx.fillText('手前の岸', 20, M2_RIVER_BOTTOM + 24);

  // --- 川の"素の"流れ。ダムの有無に関わらず、レーンの手前までは常にこれが見えている。
  //     (この上に、開いている区間の川・淀み・完成後の池・下流の扇などが重ねて描かれる) ---
  drawM2BaseRiver();

  // --- セグメントを「連続した塊(ラン)」にまとめる。壁と川、両方の描画をこれで統一する ---
  const m2Runs = computeM2Runs();
  const m2OpenCount = M2_SEGMENTS - m2FilledCount;

  // --- 池の完成後アニメーション：ダムのすぐそばに水がたまり始め、そこからどんどん上流側に伸びていく ---
  //     （中心はダム側に固定ではなく、伸びるほど上流側にずれていく。形は楕円ではなく、ダム側が広く上流に向かって
  //      すぼまっていく「三角(くさび形)」にする）
  if (m2Completed) {
    // 池の長さ(上流方向)の伸び方：くさび形の池は「底辺の高さ×長さ÷2」で面積が決まるので、
    // 川からの流入量(≒面積の増加速度)が一定なら、長さは一定の速さで伸びていくのが物理的に自然。
    // なので序盤〜中盤は一定速度でぐんぐん伸ばし、目標に近づいたら(=流入と横漏れが釣り合ってくる
    // イメージで)伸びをゆるめて滑らかに収束させる。
    const m2PondRatio = m2PondLength / M2_POND_TARGET_LENGTH;
    if (m2PondRatio < 0.8) {
      m2PondLength += 1.15;
    } else {
      m2PondLength += (M2_POND_TARGET_LENGTH - m2PondLength) * 0.035;
    }

    // 池の「横のはみ出し幅」は、実際にその側へ延長された壁の分だけしか広がれない。
    // （＝壁が無い場所までは水は広がれず、そこから横に漏れて回り込む）
    const topCapPx = m2ExtBuiltTop * M2_SEG_HEIGHT;
    const bottomCapPx = m2ExtBuiltBottom * M2_SEG_HEIGHT;
    m2TopExtraPx += (topCapPx - m2TopExtraPx) * 0.04;
    m2BottomExtraPx += (bottomCapPx - m2BottomExtraPx) * 0.04;

    // 池がある程度育って(=横幅が今の壁の端まで届いて)、まだ延長できる余地があるなら、
    // その側の壁の横から下流に水が回り込んで漏れ始める。
    if (m2LeakSide === null && m2PondLength > 24 && m2LeakStage < M2_LEAK_SIDE_SEQUENCE.length) {
      const side = M2_LEAK_SIDE_SEQUENCE[m2LeakStage];
      const builtCount = side === 'top' ? m2ExtBuiltTop : m2ExtBuiltBottom;
      const extraPx = side === 'top' ? m2TopExtraPx : m2BottomExtraPx;
      const capPx = builtCount * M2_SEG_HEIGHT;
      if (builtCount < M2_EXT && extraPx >= capPx - 1) {
        m2LeakSide = side;
        sfxWarningLeak();
        const sideLabel = side === 'top' ? '奥' : '手前';
        speak(`あれ？池が育ってきたら、${sideLabel}側の壁の「横」から水が回り込んで漏れ始めたよ！壁を延長してつなげよう。`);
        updateM2Metrics();
      }
    }

    // 主流をふさぐ本体の壁は完成しているので、横漏れの有無にかかわらず下流の本流は乾いていく
    // （ただし完全にはゼロにならない。下流にも常に少量の水は流れ続ける＝M2_DOWNSTREAM_DRY_CAPで頭打ち）
    m2DownstreamDry += (M2_DOWNSTREAM_DRY_CAP - m2DownstreamDry) * 0.01;

    // --- ゴール条件：川を「完全に」堰き止めることではなく、池が巣を作れるくらいの
    //     大きさ・深さまで育つこと。下流には水が流れ続けたままゴールになる。 ---
    if (!m2NestBuilt && m2LeakStage >= M2_LEAK_SIDE_SEQUENCE.length && m2PondLength >= M2_NEST_POND_LENGTH) {
      m2NestBuilt = true;
      sfxNestComplete();
      speak('🎉 池がしっかり育って、巣を作れるくらいの大きさと深さになったよ！下流にもちゃんと水は流れ続けているんだ。');
      updateM2Metrics();
    }

    const baseX = M2_LANE_X_START - 2; // ダムのすぐ手前が池の「底辺」＝一番広い場所
    // 池は、実際に延長した壁の高さぴったりではなく、そこから少しだけ上下にふくらんで
    // 見える方が自然（本物の池も、堤防より少し外側まで水がにじむように広がる）。
    // ふくらみは池が育つほど大きくなり、上限を設けて岸を大きくはみ出さないようにする。
    const extraBulge = 18 * Math.min(1, m2PondLength / M2_POND_TARGET_LENGTH);
    const topY = M2_RIVER_TOP - m2TopExtraPx - extraBulge;
    const bottomY = M2_RIVER_BOTTOM + m2BottomExtraPx + extraBulge;
    const apexX = baseX - Math.max(m2PondLength, 1); // 伸びた分だけ、とがった先端が上流(左)に進む
    const apexY = (M2_RIVER_TOP + M2_RIVER_BOTTOM) / 2;
    // 底辺から先端に向かって少し外側にふくらんでからすぼまる、自然な池の輪郭にする制御点
    const ctrlX = baseX - m2PondLength * 0.32;
    // 上下に延長した壁は、まっすぐ岸に対して直角にはつながらず、少し上流側へ湾曲して
    // つながるので、池の上下の角も鋭角ではなく大きく丸くなるはず。ふくらみが大きいほど
    // 丸みも大きくする。
    const cornerR = Math.min(42, 14 + extraBulge * 1.4);

    ctx.save();
    // 池の色は川と全く同じグラデーションにして、境目が自然につながって見えるようにする
    ctx.fillStyle = getM2WaterGradient(topY, bottomY);
    ctx.beginPath();
    ctx.moveTo(baseX - cornerR, topY);
    ctx.quadraticCurveTo(baseX, topY, baseX, topY + cornerR);
    ctx.lineTo(baseX, bottomY - cornerR);
    ctx.quadraticCurveTo(baseX, bottomY, baseX - cornerR, bottomY);
    ctx.quadraticCurveTo(ctrlX, bottomY, apexX, apexY);
    ctx.quadraticCurveTo(ctrlX, topY, baseX - cornerR, topY);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 池に沈んでいく木々（くさび形の内側に入ったら沈める、簡易版として3頂点の三角形で判定）
    m2Trees.forEach(t => {
      if (isPointInM2PondWedge(t.x, t.y, baseX, topY, bottomY, apexX, apexY)) {
        t.submerged = true;
      }
    });

    // 池が巣を作れるくらい育ったら、池の中(上流寄り)に巣を描く
    if (m2NestBuilt) {
      drawM2Nest(baseX, apexY);
    }

    // --- 延長済みの壁（岸の外側に積み増した区画）を描く。既存の8区画と継ぎ目なくつながる ---
    drawM2WallExtensions();

    // --- ダムが完成した後も、壁の下やすき間から下流へごくわずかに水が流れ続ける様子を
    //     常に(横漏れの有無に関係なく)描く。これが「完全に堰き止めることはできない」を表現する。 ---
    updateAndDrawM2Seepage();

    // --- 横漏れの演出：壁の端の外側を回り込んで下流に水がちょろちょろ流れる／次に作るべき場所を光らせる ---
    if (m2LeakSide !== null) {
      drawM2SideLeak();
    }
  }

  // --- 川本体：塞がっていない区間だけ「奥の岸〜手前の岸」いっぱいに水を流す。
  //     塞がった区間は、ダムより下流はすぐに干上がり、ダム手前だけ少し幅が増して淀み(小さな池)ができる。
  drawM2River(m2Runs, m2OpenCount);

  // --- 壁レーンのガイド枠 ---
  if (!m2Completed) {
    ctx.strokeStyle = 'rgba(255, 224, 130, 0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.strokeRect(M2_LANE_X_START, M2_RIVER_TOP, M2_LANE_X_END - M2_LANE_X_START, M2_RIVER_BOTTOM - M2_RIVER_TOP);
    ctx.setLineDash([]);
  }

  // --- 川の流れの粒子（すき間から水が漏れる/迂回する様子、しぶきを表現） ---
  updateAndDrawM2FlowParticles(m2OpenCount);

  // --- 壁セグメントの描画：隣り合う区画はすき間なくつなげて1枚の壁として見せる ---
  //     (大枝・小枝・石・泥が組み合わさった、ゴツゴツ・デコボコした質感で描く)
  m2Runs.filter(r => r.filled).forEach(run => {
    const segYStart = M2_RIVER_TOP + run.start * M2_SEG_HEIGHT;
    const segYEnd = M2_RIVER_TOP + (run.end + 1) * M2_SEG_HEIGHT;
    const padOuter = 3; // 岸との継ぎ目のみ少し隙間を見せ、区画同士の間は完全に密着させる
    drawM2WallChunk(M2_LANE_X_START, M2_LANE_X_END, segYStart + padOuter, segYEnd - padOuter, run.start * 97 + 11);
  });

  // まだつながっていない区画は、点線で「ここが隙間だよ」と示す
  for (let i = 0; i < M2_SEGMENTS; i++) {
    if (m2Wall[i]) continue;
    const segY = M2_RIVER_TOP + i * M2_SEG_HEIGHT;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.strokeRect(M2_LANE_X_START, segY + 2, M2_LANE_X_END - M2_LANE_X_START, M2_SEG_HEIGHT - 4);
    ctx.setLineDash([]);
  }

  // --- 木々（陸地の装飾。池に沈むと消えていく） ---
  m2Trees.forEach(t => {
    if (t.submerged) return;
    ctx.save();
    ctx.fillStyle = '#3e2723';
    ctx.fillRect(t.x - 3, t.y, 6, 12);
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath();
    ctx.moveTo(t.x, t.y - 26);
    ctx.lineTo(t.x - 14, t.y);
    ctx.lineTo(t.x + 14, t.y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // 完成メッセージバナー的な演出（進行度テキスト）
  if (m2Completed) {
    ctx.fillStyle = m2LeakSide !== null ? 'rgba(255, 241, 118, 0.95)' : 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    const bannerText = m2LeakSide !== null
      ? (m2LeakSide === 'top' ? '⚠️ 奥側の壁の横から水が漏れてる！' : '⚠️ 手前側の壁の横から水が漏れてる！')
      : (m2NestBuilt ? '🏠 巣ができた！下流にも水は流れ続けているよ' : '🌊 池が広がっているよ！');
    ctx.fillText(bannerText, 460, 40);
    ctx.textAlign = 'left';
  }

  updateM2Metrics();

  ctx.restore();
}

// 点(px,py)が「ダム側の底辺(topY〜bottomY)から上流の先端(apexX,apexY)」へすぼまるくさび形の中にあるか判定する。
// 曲線のふくらみは無視し、底辺の2点と先端の3点でできる三角形で簡易判定する（十分な精度）。
function isPointInM2PondWedge(px, py, baseX, topY, bottomY, apexX, apexY) {
  const v1 = { x: baseX, y: topY };
  const v2 = { x: baseX, y: bottomY };
  const v3 = { x: apexX, y: apexY };
  const sign = (ax, ay, bx, by, cx, cy) => (ax - cx) * (by - cy) - (bx - cx) * (ay - cy);
  const d1 = sign(px, py, v1.x, v1.y, v2.x, v2.y);
  const d2 = sign(px, py, v2.x, v2.y, v3.x, v3.y);
  const d3 = sign(px, py, v3.x, v3.y, v1.x, v1.y);
  const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
  const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
  return !(hasNeg && hasPos);
}

// m2Wall[] を「連続した同じ状態(塞がっている/開いている)の塊」のリストに変換する。
// これにより、隣り合うセグメントをすき間なく1枚として描画できる。
function computeM2Runs() {
  let runs = [];
  let i = 0;
  while (i < M2_SEGMENTS) {
    const filled = m2Wall[i];
    let j = i;
    while (j + 1 < M2_SEGMENTS && m2Wall[j + 1] === filled) j++;
    runs.push({ start: i, end: j, filled });
    i = j + 1;
  }
  return runs;
}

// 川本体の描画。開いている区間はダムの奥から手前までフルの川幅で水を流す。
// 塞がった区間は、レーンより下流はすぐ乾き、レーン手前だけ少し幅が張り出して「淀み」ができる。
const M2_EDDY_ZONE = 55;   // ダムの手前、淀みが盛り上がる範囲(px)
const M2_EDDY_BULGE = 12;  // 淀みが川岸方向にはみ出す最大量(px)

// 色を線形補間するための小さなヘルパー
function m2LerpRgb(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function m2RgbCss(rgb, alpha) {
  return `rgba(${Math.round(rgb[0])},${Math.round(rgb[1])},${Math.round(rgb[2])},${alpha})`;
}

const M2_COLOR_SHALLOW = [110, 200, 232];  // まだ何もしていない浅い川全体の、淡い水色
const M2_COLOR_DEEP = [3, 60, 110];        // ダムのすぐ近く・中央がもっとも深くなった時の水色
const M2_COLOR_RIVERBED = [150, 128, 100]; // 下流の浅瀬で少し透けて見える、川底(泥・石)の色

// 「ダムによってどれくらい水がせき止められ、深さが発達しているか」(0=まだ浅い川のまま, 1=池が十分育った状態)
function getM2DepthProgress() {
  if (m2Completed) {
    return 0.4 + 0.6 * Math.min(1, m2PondLength / M2_POND_TARGET_LENGTH);
  }
  return 0.35 * (m2FilledCount / M2_SEGMENTS);
}

// 川・池で共通して使う水の色。最初は川全体がまだ浅いことを示す淡い色で統一されているが、
// 壁がつながって水がせき止められていくにつれ、ダムのすぐ手前・中央がもっとも深い青に、
// そこから上流に向かってなめらかに淡く、下流に向かってはより浅瀬らしく川底が少し
// 透けて見える色へと変化していく。
function getM2WaterGradient() {
  const depth = getM2DepthProgress();
  const damCenterX = (M2_LANE_X_START + M2_LANE_X_END) / 2;
  const g = ctx.createLinearGradient(0, 0, 920, 0);

  const shallowColor = m2RgbCss(M2_COLOR_SHALLOW, 1);
  const deepColor = m2RgbCss(m2LerpRgb(M2_COLOR_SHALLOW, M2_COLOR_DEEP, depth), 1);
  const riverbedMix = m2LerpRgb(M2_COLOR_SHALLOW, M2_COLOR_RIVERBED, depth * 0.6);
  const downstreamColor = m2RgbCss(riverbedMix, 1);

  const upstreamFadeFrac = Math.max(0.02, (damCenterX - 170) / 920);
  const damFrac = Math.min(0.98, damCenterX / 920);
  const downstreamFadeFrac = Math.min(0.99, (damCenterX + 220) / 920);

  g.addColorStop(0, shallowColor);
  g.addColorStop(upstreamFadeFrac, shallowColor);
  g.addColorStop(damFrac, deepColor);
  g.addColorStop(downstreamFadeFrac, downstreamColor);
  g.addColorStop(1, downstreamColor);
  return g;
}

// 位置(seed)から常に同じ値を返す簡易な擬似乱数。毎フレーム形が揺れて見えないよう、
// 壁のデコボコ・素材配置はすべてこの関数で決めた「固定された」ランダム値を使う。
function m2Seeded(n) {
  const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// 川岸(奥側/手前側)の水面の揺らぎ。上流・下流どこでも同じ関数を使うことで、
// 壁を置いた場所だけ揺れが止まったり、上流と下流で見た目が変わったりしないようにする。
function m2WaveTop(x) { return Math.sin(x * 0.02 + animFrameTime) * 3; }
function m2WaveBottom(x) { return Math.sin(x * 0.025 + animFrameTime * 1.3) * 3; }

// すき間(または漏れ)が細いほど、下流でもとの川幅まで戻りきる距離を長く＝角度をゆるやかにする。
// fraction: 1に近いほど広く開いている(流れが緩やか)、0に近いほど狭い(流れが速く鋭い)
const M2_FAN_DISTANCE_BASE = 90;
function m2FanDistanceFor(fraction) {
  const f = Math.max(0.05, Math.min(1, fraction));
  return M2_FAN_DISTANCE_BASE * (1 + (1 - f) * 2.2);
}

// 大枝・小枝・石・泥が組み合わさった、壁の1区画分を描く。
// 輪郭線もあえて角丸四角形にせず、デコボコ・ギザギザにして質感を出す。
function drawM2WallChunk(xStart, xEnd, yTop, yBottom, seedBase) {
  const w = xEnd - xStart, h = Math.max(4, yBottom - yTop);
  if (h <= 0) return;
  ctx.save();

  // --- ジャギーな輪郭 ---
  ctx.beginPath();
  for (let i = 0; i <= 3; i++) {
    const t = i / 3;
    const jag = (m2Seeded(seedBase + i * 2.1) - 0.5) * 6;
    const x = xStart + t * w, y = yTop + jag;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  const rSteps = Math.max(2, Math.round(h / 9));
  for (let i = 0; i <= rSteps; i++) {
    const t = i / rSteps;
    const jag = (m2Seeded(seedBase + 50 + i * 3.3) - 0.5) * 5;
    ctx.lineTo(xEnd + jag, yTop + t * h);
  }
  for (let i = 3; i >= 0; i--) {
    const t = i / 3;
    const jag = (m2Seeded(seedBase + 120 + i * 2.7) - 0.5) * 6;
    ctx.lineTo(xStart + t * w, yBottom + jag);
  }
  for (let i = rSteps; i >= 0; i--) {
    const t = i / rSteps;
    const jag = (m2Seeded(seedBase + 200 + i * 3.9) - 0.5) * 5;
    ctx.lineTo(xStart + jag, yTop + t * h);
  }
  ctx.closePath();

  let mudGrad = ctx.createLinearGradient(xStart, 0, xEnd, 0);
  mudGrad.addColorStop(0, '#c9b490');
  mudGrad.addColorStop(0.5, '#d8c4a0');
  mudGrad.addColorStop(1, '#b9a37e');
  ctx.fillStyle = mudGrad;
  ctx.fill();
  ctx.strokeStyle = '#5c4a30';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.clip(); // これ以降の素材はこのデコボコ輪郭の中だけに描く

  // --- 大枝(太い枝)：樹皮を剥いで(食べて)白っぽくなった生木の色にする ---
  const logCount = Math.max(1, Math.round(h / 20));
  for (let i = 0; i < logCount; i++) {
    const ly = yTop + (i + 0.5) * (h / logCount) + (m2Seeded(seedBase + 300 + i) - 0.5) * 6;
    const tilt = (m2Seeded(seedBase + 400 + i) - 0.5) * 8;
    const lw = 6 + m2Seeded(seedBase + 500 + i) * 3;
    ctx.save();
    ctx.strokeStyle = i % 2 === 0 ? '#e6d9bd' : '#dcc9a4';
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(xStart - 4, ly - tilt);
    ctx.lineTo(xEnd + 4, ly + tilt);
    ctx.stroke();
    // 丸太の丸みを出すハイライトと、縁に残るうっすらした樹皮の跡
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = Math.max(1, lw * 0.3);
    ctx.beginPath();
    ctx.moveTo(xStart - 4, ly - tilt - lw * 0.2);
    ctx.lineTo(xEnd + 4, ly + tilt - lw * 0.2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(93,64,38,0.35)';
    ctx.lineWidth = Math.max(1, lw * 0.22);
    ctx.beginPath();
    ctx.moveTo(xStart - 4, ly - tilt + lw * 0.42);
    ctx.lineTo(xEnd + 4, ly + tilt + lw * 0.42);
    ctx.stroke();
    // 歯で齧った跡(細かい溝)を等間隔に
    ctx.strokeStyle = 'rgba(120,98,64,0.4)';
    ctx.lineWidth = 1;
    for (let gx = xStart + 4; gx < xEnd; gx += 5) {
      ctx.beginPath();
      ctx.moveTo(gx, ly - tilt - lw / 2 + 1);
      ctx.lineTo(gx, ly - tilt + lw / 2 - 1);
      ctx.stroke();
    }
    ctx.restore();
  }

  // --- 石 ---
  const stoneCount = Math.round(h / 26) + 1;
  for (let i = 0; i < stoneCount; i++) {
    const sx = xStart + m2Seeded(seedBase + 600 + i * 1.7) * w;
    const sy = yTop + m2Seeded(seedBase + 700 + i * 1.3) * h;
    const r = 2.5 + m2Seeded(seedBase + 800 + i) * 3;
    ctx.fillStyle = '#78716a';
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3f3b36';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // --- 泥だまり(隙間を埋める部分) ---
  const mudCount = Math.round(h / 22) + 1;
  for (let i = 0; i < mudCount; i++) {
    const mx = xStart + m2Seeded(seedBase + 900 + i * 1.9) * w;
    const my = yTop + m2Seeded(seedBase + 1000 + i * 1.1) * h;
    const r = 2 + m2Seeded(seedBase + 1100 + i) * 2.5;
    ctx.fillStyle = 'rgba(62,44,30,0.55)';
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- 小枝(細い枝) ---
  const twigCount = Math.round(h / 16);
  for (let i = 0; i < twigCount; i++) {
    const tx = xStart + m2Seeded(seedBase + 1200 + i * 1.4) * w;
    const ty = yTop + m2Seeded(seedBase + 1300 + i * 1.6) * h;
    const tlen = 4 + m2Seeded(seedBase + 1400 + i) * 6;
    const tang = m2Seeded(seedBase + 1500 + i) * Math.PI * 2;
    ctx.strokeStyle = '#2b1d12';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx + Math.cos(tang) * tlen, ty + Math.sin(tang) * tlen);
    ctx.stroke();
  }

  ctx.restore(); // clip解除
  ctx.restore();
}

// 川の"素の"流れ。ダムが完成したかどうかに関わらず、レーン(壁を置く場所)の手前までは
// 常にこの基本の川が奥の岸から手前の岸いっぱいに流れている。池(くさび形)は、この上から
// ダムに近い部分だけを覆うように重ねて描かれるので、まだ池になっていない上流の遠い部分は
// ずっとこの「揺らめく川」のまま見え続ける。
function drawM2BaseRiver() {
  ctx.save();
  ctx.fillStyle = getM2WaterGradient(M2_RIVER_TOP, M2_RIVER_BOTTOM);
  ctx.beginPath();
  const rightX = M2_LANE_X_START + 12; // レーン/壁に少しかぶせて継ぎ目を隠す
  ctx.moveTo(-12, M2_RIVER_TOP + m2WaveTop(-12));
  for (let x = -12; x <= rightX; x += 20) {
    ctx.lineTo(x, M2_RIVER_TOP + m2WaveTop(x));
  }
  ctx.lineTo(rightX, M2_RIVER_BOTTOM + m2WaveBottom(rightX));
  for (let x = rightX; x >= -12; x -= 20) {
    ctx.lineTo(x, M2_RIVER_BOTTOM + m2WaveBottom(x));
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 下流が浅瀬になるほど(=ダムで水がせき止められ、深さの発達度が上がるほど)、
// 川底の泥や石がうっすら透けて見えるようにする演出
function drawM2RiverbedGlimpse(depth) {
  const alpha = Math.min(0.32, Math.max(0, (depth - 0.12) * 0.5));
  if (alpha <= 0.01) return;
  ctx.save();
  ctx.fillStyle = `rgba(120,100,80,${alpha})`;
  for (let i = 0; i < 10; i++) {
    const sx = M2_LANE_X_END + 40 + m2Seeded(5000 + i * 3.1) * (920 - M2_LANE_X_END - 60);
    const sy = M2_RIVER_TOP + 8 + m2Seeded(5100 + i * 2.7) * (M2_RIVER_BOTTOM - M2_RIVER_TOP - 16);
    const r = 4 + m2Seeded(5200 + i) * 5;
    ctx.beginPath();
    ctx.ellipse(sx, sy, r, r * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawM2River(runs, openCount) {
  const riverGrad = getM2WaterGradient(M2_RIVER_TOP, M2_RIVER_BOTTOM);

  // ダムが完成した後は、上流〜レーン部分は renderTopView 側の drawM2BaseRiver()＋
  // 「池(くさび形)」描画がすべて担当する(巣もその中に描かれる)。ここで改めて同じ範囲を
  // 塗りつぶすと、後から描かれるこの塗りが池や巣の絵を覆い隠してしまうため、
  // 完成後はここでは上流側を一切描かず、下流(漏れ出す扇形の水流)だけを描く。
  if (m2Completed) {
    drawM2CompletedDownstream();
    return;
  }

  runs.forEach(run => {
    const yTop = M2_RIVER_TOP + run.start * M2_SEG_HEIGHT;
    const yBottom = M2_RIVER_TOP + (run.end + 1) * M2_SEG_HEIGHT;
    const isTopBank = run.start === 0;
    const isBottomBank = run.end === M2_SEGMENTS - 1;

    ctx.save();
    ctx.fillStyle = riverGrad;
    ctx.beginPath();

    if (!run.filled) {
      // 開いている区間：奥の岸から手前の岸まで、レーンの出口までフルの川幅で流れる。
      // (下流側は、あとでこの関数の最後にまとめて「扇形」として描くので、ここでは
      //  レーンの出口(M2_LANE_X_END)までしか描かない。左右も少し余分に描いて継ぎ目を隠す)
      const rightX = M2_LANE_X_END + 10;
      ctx.moveTo(-12, yTop);
      for (let x = -12; x <= rightX; x += 20) {
        const wave = isTopBank ? m2WaveTop(x) : 0;
        ctx.lineTo(x, yTop + wave);
      }
      ctx.lineTo(rightX, yBottom);
      for (let x = rightX; x >= -12; x -= 20) {
        const wave = isBottomBank ? m2WaveBottom(x) : 0;
        ctx.lineTo(x, yBottom + wave);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      // 塞がった区間：上流側は通常幅のまま流れてきて(岸に接する側は開いている区間と同じ
      // 揺らぎを保ったまま)、ダム手前 M2_EDDY_ZONE の範囲だけ少し盛り上がり、完全に
      // せき止められる前から「淀み(小さな池)」ができているように見せる。
      // (下流側はここでは描かない。水量は保存されるので、下流はもとの川幅まで
      //  扇形に戻る前提で、このあと一括して描く)
      const bulge = M2_EDDY_BULGE;
      const flatEndX = M2_LANE_X_START - M2_EDDY_ZONE;
      ctx.moveTo(-12, yTop + (isTopBank ? m2WaveTop(-12) : 0));
      for (let x = -12; x <= flatEndX; x += 20) {
        const wave = isTopBank ? m2WaveTop(x) : 0;
        ctx.lineTo(x, yTop + wave);
      }
      // 淀みで少し盛り上がる曲線（上側・下側とも、せき止められた区画の分だけ川岸の外側にはみ出す）
      ctx.quadraticCurveTo(
        M2_LANE_X_START - M2_EDDY_ZONE * 0.4, yTop - bulge,
        M2_LANE_X_START - 2, yTop - bulge
      );
      ctx.lineTo(M2_LANE_X_START - 2, yBottom + bulge);
      ctx.quadraticCurveTo(
        M2_LANE_X_START - M2_EDDY_ZONE * 0.4, yBottom + bulge,
        flatEndX, yBottom
      );
      for (let x = flatEndX; x >= -12; x -= 20) {
        const wave = isBottomBank ? m2WaveBottom(x) : 0;
        ctx.lineTo(x, yBottom + wave);
      }
      ctx.closePath();
      ctx.fill();

      // 淀みの水面のきらめき(小さな波紋)
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(M2_LANE_X_START - 18, (yTop + yBottom) / 2, 6 + Math.sin(animFrameTime * 2 + run.start) * 2, 0, Math.PI * 1.4);
      ctx.stroke();
    }
    ctx.restore();
  });

  // 開いている区間の合計幅が狭いほど、そこを流れる水は速く・激しく見えるよう、
  // レーン出口(下流側)にごく短い加速の「白波」テクスチャを重ねる
  if (openCount > 0 && openCount < M2_SEGMENTS) {
    runs.filter(r => !r.filled).forEach(run => {
      const yTop = M2_RIVER_TOP + run.start * M2_SEG_HEIGHT;
      const yBottom = M2_RIVER_TOP + (run.end + 1) * M2_SEG_HEIGHT;
      const intensity = Math.min(1, (M2_SEGMENTS - openCount) / (M2_SEGMENTS - 1));
      ctx.save();
      ctx.strokeStyle = `rgba(255,255,255,${0.25 + intensity * 0.35})`;
      ctx.lineWidth = 1.5;
      for (let k = 0; k < 3; k++) {
        const wy = yTop + (yBottom - yTop) * ((k + 0.5) / 3);
        ctx.beginPath();
        ctx.moveTo(M2_LANE_X_END, wy);
        ctx.lineTo(M2_LANE_X_END + 14 + intensity * 10, wy);
        ctx.stroke();
      }
      ctx.restore();
    });
  }

  // --- 下流：川の水量は常に一定(流量保存)という前提で、まだダムが完成していない間は
  //     下流に流れ着く水の総量は変わらない。壁で塞がれた分だけスキマ(開いている場所)を
  //     通る流れは速く・狭くなるが、そのすぐ先ではもとの川幅いっぱいに扇形に広がって
  //     下流へ流れていく。壁を1つ置くたびに川幅が一気に変わって見えないよう、
  //     スキマの上下端はなめらかに(m2ThroatTop/Bottom)追従させる。
  //     また、スキマが狭くなるほど扇が戻りきるまでの距離を伸ばし、角度をゆるやかにする。 ---
  let targetTop = M2_RIVER_TOP, targetBottom = M2_RIVER_BOTTOM;
  const openRuns = runs.filter(r => !r.filled);
  if (openRuns.length > 0) {
    targetTop = Math.min(...openRuns.map(r => M2_RIVER_TOP + r.start * M2_SEG_HEIGHT));
    targetBottom = Math.max(...openRuns.map(r => M2_RIVER_TOP + (r.end + 1) * M2_SEG_HEIGHT));
  }
  m2ThroatTop += (targetTop - m2ThroatTop) * 0.05;
  m2ThroatBottom += (targetBottom - m2ThroatBottom) * 0.05;

  const startX = M2_LANE_X_END;
  const fanDist = m2FanDistanceFor(openCount / M2_SEGMENTS);
  const fanX = startX + fanDist;

  // 扇の外側、まだ水が戻りきっていないごく手前の部分は乾いた川底として色を付ける。
  // (先にこちらを描き、あとで不透明な水を上から重ねることで、水色に土の色が透けて
  //  見えてしまう不自然さを防ぐ)
  if (m2ThroatTop > M2_RIVER_TOP + 1 || m2ThroatBottom < M2_RIVER_BOTTOM - 1) {
    ctx.save();
    ctx.fillStyle = 'rgba(161, 136, 108, 0.7)';
    if (m2ThroatTop > M2_RIVER_TOP + 1) {
      ctx.fillRect(M2_LANE_X_END, M2_RIVER_TOP, fanDist + 4, m2ThroatTop - M2_RIVER_TOP);
    }
    if (m2ThroatBottom < M2_RIVER_BOTTOM - 1) {
      ctx.fillRect(M2_LANE_X_END, m2ThroatBottom, fanDist + 4, M2_RIVER_BOTTOM - m2ThroatBottom);
    }
    ctx.restore();
  }

  if (openCount > 0) {
    ctx.save();
    ctx.fillStyle = riverGrad;
    ctx.beginPath();
    ctx.moveTo(startX, m2ThroatTop);
    ctx.quadraticCurveTo(startX + fanDist * 0.5, M2_RIVER_TOP, fanX, M2_RIVER_TOP);
    for (let x = fanX; x <= 920; x += 20) ctx.lineTo(x, M2_RIVER_TOP + m2WaveTop(x));
    ctx.lineTo(932, M2_RIVER_TOP + m2WaveTop(920));
    ctx.lineTo(932, M2_RIVER_BOTTOM + m2WaveBottom(920));
    for (let x = 920; x >= fanX; x -= 20) ctx.lineTo(x, M2_RIVER_BOTTOM + m2WaveBottom(x));
    ctx.quadraticCurveTo(startX + fanDist * 0.5, M2_RIVER_BOTTOM, startX, m2ThroatBottom);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  drawM2RiverbedGlimpse(getM2DepthProgress());
}

// ダム完成後の下流描画。本流は完全にふさがれているので、下流に届く水量は
// じわじわ減っていく(m2DownstreamDry↑)が、壁のすき間・下からの滲み出しは
// 完全にはゼロにならないので、下流にもごく細い扇形の流れを残し続ける。
// 流量が下がるほど(=漏れが少ないほど)、扇が広がりきるまでの距離も伸ばし、
// 角度をゆるやかにする。
function drawM2CompletedDownstream() {
  // 乾いた川底のベース（先に描き、この上に不透明な水を重ねる）
  ctx.save();
  ctx.fillStyle = `rgba(161, 136, 108, ${0.15 + m2DownstreamDry * 0.7})`;
  ctx.fillRect(M2_LANE_X_END, M2_RIVER_TOP, 920 - M2_LANE_X_END, M2_RIVER_BOTTOM - M2_RIVER_TOP);
  ctx.restore();

  // 実際にダムを完全に堰き止めることはできないので、下流に残る水量は
  // ゼロにはならない(流量が下がった分だけ、扇の幅も細くなる)
  const flowFraction = Math.max(0.12, 1 - m2DownstreamDry);
  const midY = (M2_RIVER_TOP + M2_RIVER_BOTTOM) / 2;
  const fullHalf = (M2_RIVER_BOTTOM - M2_RIVER_TOP) / 2;
  const fanHalf = fullHalf * flowFraction;
  // 壁のすぐ下流も、点源から染み出すのではなく、その時点の流れの半分くらいの
  // 幅で流れ出し、そこから先で扇状にまた広がっていく方が自然に見える
  // (ダム完成直後、流量がまだ十分残っている間は、もとの川幅の半分程度になる)。
  const throatHalf = Math.max(2, fanHalf * 0.5);
  const startX = M2_LANE_X_END;
  const fanDist = m2FanDistanceFor(flowFraction);
  const fanX = startX + fanDist;

  ctx.save();
  ctx.fillStyle = getM2WaterGradient(midY - fanHalf, midY + fanHalf);
  ctx.beginPath();
  ctx.moveTo(startX, midY - throatHalf);
  ctx.quadraticCurveTo(startX + fanDist * 0.5, midY - fanHalf, fanX, midY - fanHalf);
  for (let x = fanX; x <= 920; x += 20) ctx.lineTo(x, midY - fanHalf + m2WaveTop(x));
  ctx.lineTo(932, midY - fanHalf + m2WaveTop(920));
  ctx.lineTo(932, midY + fanHalf + m2WaveBottom(920));
  for (let x = 920; x >= fanX; x -= 20) ctx.lineTo(x, midY + fanHalf + m2WaveBottom(x));
  ctx.quadraticCurveTo(startX + fanDist * 0.5, midY + fanHalf, startX, midY + throatHalf);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  drawM2RiverbedGlimpse(getM2DepthProgress());
}

// 池が巣を作れるくらい育った後に描く、大枝・小枝・石・泥を組み合わせたドーム状の巣
// (壁と同じ質感になるよう、ジャギーな輪郭＋混ざり合った素材で描く)
function drawM2Nest(baseX, apexY) {
  const nx = baseX - m2PondLength * 0.33; // 池の一番深いところ(ダム寄り)に少し寄せて配置
  const ny = apexY;
  const seed = 4321;
  ctx.save();

  // 水面に浮かぶ土台（デコボコした輪郭の泥・小枝の土台）
  ctx.beginPath();
  const baseSteps = 14;
  for (let i = 0; i <= baseSteps; i++) {
    const t = (i / baseSteps) * Math.PI * 2;
    const jag = 1 + m2Seeded(seed + i * 3.1) * 3;
    const rx = 32 + jag, ry = 11 + jag * 0.4;
    const px = nx + Math.cos(t) * rx;
    const py = ny + 7 + Math.sin(t) * ry;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = '#c9b490';
  ctx.fill();
  ctx.strokeStyle = '#5c4a30';
  ctx.lineWidth = 2;
  ctx.stroke();

  // ドーム本体もジャギーな輪郭にする
  ctx.beginPath();
  const domeSteps = 16;
  for (let i = 0; i <= domeSteps; i++) {
    const t = Math.PI - (i / domeSteps) * Math.PI; // 上半分の弧
    const jag = 1.5 + m2Seeded(seed + 200 + i * 2.3) * 3.5;
    const rx = 27 + jag, ry = 17 + jag * 0.5;
    const px = nx + Math.cos(t) * rx;
    const py = ny + Math.sin(t) * -ry;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.lineTo(nx - 27, ny + 2);
  ctx.closePath();
  ctx.fillStyle = '#d8c4a0';
  ctx.fill();
  ctx.strokeStyle = '#5c4a30';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.clip();

  // 大枝(太い枝)を数本、放射状に組む。樹皮を剥いで(食べて)白っぽくなった生木の色にする
  for (let i = 0; i < 5; i++) {
    const ang = (-Math.PI * 0.85) + (i / 4) * Math.PI * 0.7 + (m2Seeded(seed + 300 + i) - 0.5) * 0.2;
    const lw = 5 + m2Seeded(seed + 400 + i) * 2.5;
    const x0 = nx - Math.cos(ang) * 30, y0 = ny + 4 + Math.sin(-ang) * 4;
    const x1 = nx + Math.cos(ang) * 30, y1 = ny - Math.sin(-ang) * 22;
    ctx.save();
    ctx.strokeStyle = i % 2 === 0 ? '#e6d9bd' : '#dcc9a4';
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = Math.max(1, lw * 0.3);
    ctx.beginPath();
    ctx.moveTo(x0, y0 - lw * 0.2);
    ctx.lineTo(x1, y1 - lw * 0.2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(93,64,38,0.35)';
    ctx.lineWidth = Math.max(1, lw * 0.22);
    ctx.beginPath();
    ctx.moveTo(x0, y0 + lw * 0.42);
    ctx.lineTo(x1, y1 + lw * 0.42);
    ctx.stroke();
    ctx.restore();
  }

  // 小枝(細い枝)を密に重ねる
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.4;
  for (let i = -22; i <= 22; i += 6) {
    const jag = (m2Seeded(seed + 500 + i) - 0.5) * 4;
    ctx.beginPath();
    ctx.moveTo(nx + i, ny + 2);
    ctx.lineTo(nx + i * 0.55 + jag, ny - 14 + jag);
    ctx.stroke();
  }

  // 石を少し埋め込む
  for (let i = 0; i < 4; i++) {
    const sx = nx + (m2Seeded(seed + 600 + i) - 0.5) * 44;
    const sy = ny + (m2Seeded(seed + 700 + i) - 0.9) * 16;
    const r = 2.5 + m2Seeded(seed + 800 + i) * 2;
    ctx.fillStyle = '#78716a';
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3f3b36';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 泥だまり(隙間を埋めるダークな斑点)
  for (let i = 0; i < 6; i++) {
    const mx = nx + (m2Seeded(seed + 900 + i) - 0.5) * 48;
    const my = ny + (m2Seeded(seed + 1000 + i) - 0.85) * 20;
    const r = 2 + m2Seeded(seed + 1100 + i) * 2.2;
    ctx.fillStyle = 'rgba(62,44,30,0.6)';
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// ダムが完成した後も途切れず下流へ流れ続ける、ごく少量の滲み出し水を描く
// （＝川を完全に堰き止めることはできない、という前提を常に表現するための演出）
function updateAndDrawM2Seepage() {
  if (Math.random() < 0.18 && m2SeepParticles.length < 10) {
    m2SeepParticles.push({
      x: M2_LANE_X_START - 4,
      y: (M2_RIVER_TOP + M2_RIVER_BOTTOM) / 2 + (Math.random() - 0.5) * 40,
      speed: 1.0 + Math.random() * 0.7
    });
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(179, 229, 252, 0.55)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (let i = m2SeepParticles.length - 1; i >= 0; i--) {
    const p = m2SeepParticles[i];
    p.x += p.speed;
    ctx.beginPath();
    ctx.moveTo(p.x - 8, p.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    if (p.x > 920) m2SeepParticles.splice(i, 1);
  }
  ctx.restore();
}

// 岸の外側に積み増した延長区画を描く（既存の8区画と継ぎ目なくつながる、大枝・小枝・石・泥の壁）
function drawM2WallExtensions() {
  for (let i = 0; i < m2ExtBuiltTop; i++) {
    const yTop = M2_RIVER_TOP - (i + 1) * M2_SEG_HEIGHT;
    const yBottom = M2_RIVER_TOP - i * M2_SEG_HEIGHT;
    drawM2WallChunk(M2_LANE_X_START, M2_LANE_X_END, yTop + 1, yBottom - 1, 700 + i * 53);
  }
  for (let i = 0; i < m2ExtBuiltBottom; i++) {
    const yTop = M2_RIVER_BOTTOM + i * M2_SEG_HEIGHT;
    const yBottom = M2_RIVER_BOTTOM + (i + 1) * M2_SEG_HEIGHT;
    drawM2WallChunk(M2_LANE_X_START, M2_LANE_X_END, yTop + 1, yBottom - 1, 1900 + i * 53);
  }
}

// 壁の「横（岸のはずれ）」を回り込むように水が下流へちょろちょろ漏れている様子と、
// 次に作るべき延長区画の場所を光らせて示す
function drawM2SideLeak() {
  const slot = getM2LeakSlotRect();
  if (!slot) return;
  const edgeY = m2LeakSide === 'top' ? slot.yBottom : slot.yTop; // 現在の壁の一番外側の端

  // 回り込む水流（壁の端の外側を回って下流へ）
  const startX = M2_LANE_X_START - 8;
  const endX = M2_LANE_X_END + 55;
  ctx.save();
  ctx.strokeStyle = 'rgba(179, 229, 252, 0.9)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = startX; x <= endX; x += 4) {
    const wobble = Math.sin(x * 0.25 + animFrameTime * 6) * 2.2;
    const bend = x < M2_LANE_X_START ? 0 : Math.min(1, (x - M2_LANE_X_START) / (M2_LANE_X_END - M2_LANE_X_START)) *
      (m2LeakSide === 'top' ? -3 : 3); // 壁の端をかすめて回り込むカーブ
    const yy = edgeY + wobble + bend;
    if (x === startX) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  }
  ctx.stroke();
  ctx.restore();

  if (Math.random() < 0.35) {
    spawnM2Splash(endX - 4, edgeY, 1); // 先端からぽたぽた水しぶきが落ちる
  }

  // 次に壁をつなげるべき延長スロットを点滅させて示す
  ctx.save();
  const pulse = 0.35 + Math.sin(animFrameTime * 3) * 0.25;
  ctx.strokeStyle = `rgba(255, 235, 59, ${0.55 + pulse})`;
  ctx.lineWidth = 2.5;
  ctx.setLineDash([5, 4]);
  ctx.strokeRect(M2_LANE_X_START, slot.yTop + 1, M2_LANE_X_END - M2_LANE_X_START, (slot.yBottom - slot.yTop) - 2);
  ctx.setLineDash([]);
  ctx.font = 'bold 13px sans-serif';
  ctx.fillStyle = `rgba(255, 235, 59, ${0.6 + pulse})`;
  ctx.textAlign = 'center';
  ctx.fillText('💧', M2_LANE_X_START + (M2_LANE_X_END - M2_LANE_X_START) / 2, (slot.yTop + slot.yBottom) / 2 + 4);
  ctx.textAlign = 'left';
  ctx.restore();
}


function updateAndDrawM2FlowParticles(openCount) {
  // 開いている(壁がない)セグメントの中心Yリストを毎フレーム計算
  let openCenters = [];
  for (let i = 0; i < M2_SEGMENTS; i++) {
    if (!m2Wall[i]) openCenters.push(M2_RIVER_TOP + i * M2_SEG_HEIGHT + M2_SEG_HEIGHT / 2);
  }

  // 川全体の流量は一定という設定なので、開いている場所が減るほど、
  // そこを通る水は速くなる（流量保存）。速度の倍率をここで決める。
  const speedMultiplier = openCount > 0 ? Math.min(3.2, M2_SEGMENTS / openCount) : 1;

  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';

  m2FlowParticles.forEach(p => {
    if (p.state !== 'blocked') {
      // レーンに近づいたら、一番近い「開いているすき間」へ少しずつ引き寄せられる
      if (p.x > M2_LANE_X_START - 70 && p.x < M2_LANE_X_END && openCenters.length > 0) {
        let nearest = openCenters.reduce((a, b) => Math.abs(b - p.y) < Math.abs(a - p.y) ? b : a);
        p.y += (nearest - p.y) * 0.06;
      }

      // レーン内に入った瞬間、対応するセグメントが塞がっているかを判定
      if (p.x >= M2_LANE_X_START && p.x <= M2_LANE_X_END) {
        const segIndex = Math.min(M2_SEGMENTS - 1, Math.max(0, Math.floor((p.y - M2_RIVER_TOP) / M2_SEG_HEIGHT)));
        if (m2Wall[segIndex]) {
          p.state = 'blocked';
          p.opacity = 1.0;
          spawnM2Splash(M2_LANE_X_START - 3, p.y, 4); // 壁にぶつかった瞬間、小さくしぶきを上げる
        } else if (!p.splashed) {
          // すき間を抜けるとき、残りのすき間の狭さに応じて加速(funnel効果)し、しぶきを飛ばす
          p.speed = Math.min(6.5, p.speed * speedMultiplier);
          p.splashed = true;
          if (openCount < M2_SEGMENTS) spawnM2Splash(M2_LANE_X_END + 6, p.y, 2 + Math.floor((M2_SEGMENTS - openCount)));
        }
      }

      p.x += p.speed;

      // レーンを抜けた後(下流)は、まっすぐ横に流れるだけでなく、扇形に広がる水流に
      // 合わせて元の川岸の高さまで少しずつ戻っていくように弧を描かせる。
      if (p.x > M2_LANE_X_END) {
        if (!p.fanStarted) {
          p.fanStarted = true;
          p.fanFromY = p.y;
          p.fanSign = p.y >= M2_RIVER_CENTER_Y ? 1 : -1;
        }
        const fanDist = m2FanDistanceFor(openCount / M2_SEGMENTS);
        const progress = Math.min(1, (p.x - M2_LANE_X_END) / fanDist);
        const fullHalf = (M2_RIVER_BOTTOM - M2_RIVER_TOP) / 2;
        const desiredY = p.fanFromY + (M2_RIVER_CENTER_Y + p.fanSign * fullHalf * 0.8 - p.fanFromY) * progress;
        p.y += (desiredY - p.y) * 0.08;
      }

      if (p.x > 920) {
        p.x = -10;
        p.y = M2_RIVER_TOP + 10 + Math.random() * (M2_RIVER_BOTTOM - M2_RIVER_TOP - 20);
        p.speed = 1.8 + Math.random() * 1.2;
        p.splashed = false;
        p.fanStarted = false;
      }

      // 矢印っぽい短い線で流れを表現(速いほど少し長く見せる)
      ctx.beginPath();
      ctx.moveTo(p.x - 10 - Math.min(8, p.speed), p.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      // 壁にせき止められた粒子は、その場でフェードして消え、上流側からまた生まれ直す
      p.opacity -= 0.02;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(M2_LANE_X_START - 4, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (p.opacity <= 0) {
        p.state = 'flowing';
        p.x = -10;
        p.y = M2_RIVER_TOP + 10 + Math.random() * (M2_RIVER_BOTTOM - M2_RIVER_TOP - 20);
        p.speed = 1.8 + Math.random() * 1.2;
        p.splashed = false;
        p.fanStarted = false;
      }
    }
  });

  updateAndDrawM2Splashes();
}

// --- 水しぶき（壁にぶつかった時・狭いすき間を抜けた時に発生） ---
function spawnM2Splash(x, y, count) {
  for (let k = 0; k < count; k++) {
    if (m2SplashParticles.length > 140) break; // 増えすぎ防止
    m2SplashParticles.push({
      x: x + (Math.random() - 0.5) * 6,
      y: y + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 1.4,
      vy: -Math.random() * 1.8 - 0.4,
      r: 1 + Math.random() * 1.6,
      life: 1.0
    });
  }
}

function updateAndDrawM2Splashes() {
  for (let i = m2SplashParticles.length - 1; i >= 0; i--) {
    const s = m2SplashParticles[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.06; // 重力で落ちてくる
    s.life -= 0.035;
    if (s.life <= 0) {
      m2SplashParticles.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.fillStyle = '#e1f5fe';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}


function updateAndDrawParticles() {
  for (let i = activeParticles.length - 1; i >= 0; i--) {
    let p = activeParticles[i];

    if (p.type === 'floating_log') {
      p.x += p.vx;
      p.y += p.vy;
      p.opacity -= 0.01;
      drawLogSVG(p.x, p.y, 0.8, p.pointyDown, Math.max(0, p.opacity));
      if (p.opacity <= 0 || p.x > 920) activeParticles.splice(i, 1);
    }
    else if (p.type === 'floating_twig') {
      p.x += p.vx;
      p.opacity -= 0.012;
      drawTwigSVG(p.x, p.y, 0.8, Math.max(0, p.opacity));
      if (p.opacity <= 0 || p.x > 920) activeParticles.splice(i, 1);
    }
    else if (p.type === 'sinking_stone') {
      if (p.y < p.targetY) p.y += 2.5;
      else p.opacity -= 0.015;
      drawStoneSVG(p.x, p.y, 0.8, Math.max(0, p.opacity));
      if (p.opacity <= 0) activeParticles.splice(i, 1);
    }
    else if (p.type === 'dissolving_mud') {
      p.radius += 0.8;
      p.opacity -= 0.02;
      ctx.save();
      ctx.fillStyle = `rgba(109, 76, 65, ${Math.max(0, p.opacity)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      if (p.opacity <= 0) activeParticles.splice(i, 1);
    }
  }
}

// Start Render Loop
render();

</script>
