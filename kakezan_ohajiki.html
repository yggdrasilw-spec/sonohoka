<script>

const num=n=>n<=10?D[n]:(n>=20?D[n/10|0]:'')+'じゅう'+(n%10?D[n%10]:'');

const kc=n=>{const s=num(n);return n%10==0&&n>0?s.replace(/う$/,'っこ'):/[ちく]$/.test(s)?s.replace(/[ちく]$/,'っこ'):s+'こ'};

function groups(){const n=items.length,p=[...Array(n).keys()],f=i=>p[i]==i?i:p[i]=f(p[i]);

 const m={};items.forEach((it,i)=>(m[f(i)]=m[f(i)]||[]).push(it));
 return Object.values(m).map(g=>{const xs=g.map(i=>i.x),ys=g.map(i=>i.y),a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys);

function analyze(gs){
 const g=gs.length;if(!g)return{s:0,h:'<p>おはじきを ドラッグして ならべてみよう！</p>'};
 const c={};gs.forEach(x=>c[x.n]=(c[x.n]||0)+1);
 const n=+Object.keys(c).sort((a,b)=>c[b]-c[a]||b-a)[0],bad=[];gs.forEach((x,i)=>{if(x.n!=n)bad.push(i)});
 let near=0;for(let i=0;i<g;i++)for(let j=i+1;j<g;j++)for(const p of gs[i].its)for(const q of gs[j].its)if(Math.hypot(p.x-q.x,p.y-q.y)<85)near=1;
 const ex=stat()?'':(gs.some(x=>x.mix)?'<p class="hint">おはじきの いろや かたちが まざっているよ。</p>':'')+(near?'<p class="hint">まとまりどうしが ちかいよ。すこし はなして ならべよう。</p>':'');
 if(bad.length){const d=gs[bad[0]].n-n;return{s:1,bad,n,g,h:`<p>まとまりの かずが ちがうよ（${gs.map(x=>x.n+'こ').join('、')}）。</p><p>${n}こずつに そろえよう。あかい まとまりは ${n}こより ${Math.abs(d)}こ ${d<0?'たりない':'おおい'}よ。</p>`+(stat()?'':`<p class="hint">いまの ならべかたを たしざんの しきに すると ${sum(gs)}</p>`)+ex}}
 if(g<2)return{s:2,n,g,t:n,h:`<p><b class="cb">${n}こずつ</b>が <b class="cr">1つぶん</b> ある ので、ぜんぶで <b class="cy">${n}こ</b>。</p><p class="big"><b class="cb">${n}</b>×<b class="cr">1</b>＝<b class="cy">${n}</b></p><p>まとまりが 1つだけだよ。ほかにも ${n}こずつの まとまりを ふやして ならべてみよう。</p>`+ex};
 const t=n*g;return{s:3,n,g,t,h:`<p class="cele">ぜんぶ ${n}こずつに なったね！</p><p><b class="cb">${n}こずつ</b>が <b class="cr">${g}つぶん</b> ある ので、ぜんぶで <b class="cy">${t}こ</b>。</p><p class="big"><b class="cb">${n}</b>×<b class="cr">${g}</b>＝<b class="cy">${t}</b></p>`+ex}}
// ---- 描画 ----
// ---- 造形: 花形おはじき(中央に穴・透明感のある光沢) と 数図ブロック(厚み・縁・くぼみ) ----
const FP=(()=>{let d='';for(let i=0;i<=120;i++){const a=i/120*2*Math.PI;let r=11;for(let k=0;k<5;k++){const b=a-(-Math.PI/2+2*Math.PI*k/5),sn=Math.sin(b),q=9.6*9.6-144*sn*sn;if(q>0){const v=12*Math.cos(b)+Math.sqrt(q);if(v>r)r=v}}d+=(i?'L':'M')+(r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1)}return d+'ZM6.6 0A6.6 6.6 0 1 0 -6.6 0A6.6 6.6 0 1 0 6.6 0Z'})();
const gr=(id,a,b,c)=>`<radialGradient id="${id}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="${a}"/><stop offset=".5" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`;
const lg=(id,a,b)=>`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const OH=(id,g,line)=>`<g id="${id}"><path d="${FP}" transform="translate(1.6,2.6)" fill="#000" fill-opacity=".17" fill-rule="evenodd"/><path d="${FP}" fill="url(#${g})" stroke="${line}" stroke-width="1.2" stroke-linejoin="round" fill-rule="evenodd"/><circle r="8.6" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/><ellipse cx="-4" cy="-15.5" rx="3.6" ry="1.8" transform="rotate(-18 -4 -15.5)" fill="#fff" fill-opacity=".62"/><ellipse cx="-15.5" cy="-5" rx="2.1" ry="3.6" transform="rotate(-30 -15.5 -5)" fill="#fff" fill-opacity=".5"/><ellipse cx="9" cy="14" rx="2.6" ry="1.3" transform="rotate(35 9 14)" fill="#fff" fill-opacity=".22"/></g>`;
const BL=(id,g,dark,inset,line)=>`<g id="${id}"><rect x="-20" y="-20" width="40" height="40" rx="6" fill="${dark}"/><rect x="-20" y="-20" width="37" height="37" rx="6" fill="url(#${g})" stroke="${line}" stroke-width="1"/><rect x="-12.5" y="-12.5" width="22" height="22" rx="3.5" fill="${inset}" stroke="${line}" stroke-opacity=".55"/><path d="M-11 -11.5H8" stroke="#000" stroke-opacity=".14" stroke-width="1.6" stroke-linecap="round"/><path d="M-16 -16.4H11" stroke="#fff" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"/><path d="M-16.4 -15V9" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/></g>`;
const DEFS='<defs>'+gr('gb','#a6e0ff','#1e9be8','#0a64a8')+gr('gg','#bfe08a','#5b9a2f','#356a18')+lg('gy','#ffee80','#f2bd00')+lg('gw','#ffffff','#e4e7eb')+OH('o0','gb','#0a5a96')+OH('o1','gg','#2f5f14')+BL('b2','gy','#cf9a00','#f8cf1f','#b98700')+BL('b3','gw','#b9bec6','#f3f4f6','#a9aeb6')+'</defs>';

function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return[q.x,q.y]}

// ---- 見やすい並びのパターン(よこ/たて/2れつ/2だん/ほうがん/円/さいころ) ----
function pats(n){const P=[],add=f=>P.push(Array.from({length:n},(_,i)=>f(i)));
 add(i=>[(i-(n-1)/2)*S,0]);
 if((n-1)*S<=H-170)add(i=>[0,(i-(n-1)/2)*S]);
 {const r=Math.ceil(n/2);add(i=>[((i%2)-.5)*S,((i/2|0)-(r-1)/2)*S]);add(i=>[((i%r)-(r-1)/2)*S,((i/r|0)-.5)*S])}
 {const c=Math.ceil(Math.sqrt(n)),r=Math.ceil(n/c);add(i=>[((i%c)-(c-1)/2)*S,((i/c|0)-(r-1)/2)*S])}
 if(n>=3){const R=S/(2*Math.sin(Math.PI/n));if(R<150)[0,Math.PI/n].forEach(o=>add(i=>{const a=o-Math.PI/2+2*Math.PI*i/n;return[R*Math.cos(a),R*Math.sin(a)]}))}
 const D={2:[[-18,-18],[18,18]],3:[[-36,-36],[0,0],[36,36]],5:[[-33,-33],[33,-33],[0,0],[-33,33],[33,33]]}[n];
 if(D){P.push(D);P.push(D.map(p=>[p[0],-p[1]]))}
 return P}
function tidy(g,done){const n=g.length;if(n<2){done();return}
 const cx=g.reduce((a,i)=>a+i.x,0)/n,cy=g.reduce((a,i)=>a+i.y,0)/n,cur=g.map(i=>[i.x-cx,i.y-cy]);
 const ch=q=>{let t=0;for(const a of cur)t+=Math.min(...q.map(b=>Math.hypot(a[0]-b[0],a[1]-b[1])));for(const b of q)t+=Math.min(...cur.map(a=>Math.hypot(a[0]-b[0],a[1]-b[1])));return t};
 let best=null,bs=1e9;
 pats(n).forEach(q=>{const xs=q.map(p=>p[0]),ys=q.map(p=>p[1]);if(Math.max(...xs)-Math.min(...xs)>740||Math.max(...ys)-Math.min(...ys)>H-130)return;const sc=ch(q);if(sc<bs){bs=sc;best=q}});
 if(!best){done();return}
 const xs=best.map(p=>p[0]),ys=best.map(p=>p[1]),ox=cl(cx,34-Math.min(...xs),766-Math.max(...xs)),oy=cl(cy,34-Math.min(...ys),H-100-Math.max(...ys));
 const pr=[];g.forEach((_,i)=>best.forEach((q,j)=>pr.push([Math.hypot(cur[i][0]-q[0],cur[i][1]-q[1]),i,j])));pr.sort((a,b)=>a[0]-b[0]);
 const to=[],uj=new Set();pr.forEach(([d,i,j])=>{if(to[i]||uj.has(j))return;to[i]=[ox+best[j][0],oy+best[j][1]];uj.add(j)});
 const from=g.map(i=>[i.x,i.y]),t0=performance.now();anim=1;
 const step=t=>{const e=Math.min(1,Math.max(0,(t-t0)/220)),k=1-Math.pow(1-e,3);
  g.forEach((it,i)=>{it.x=from[i][0]+(to[i][0]-from[i][0])*k;it.y=from[i][1]+(to[i][1]-from[i][1])*k});relax(g);render();
  if(e<1)requestAnimationFrame(step);else{anim=0;done()}};requestAnimationFrame(step)}
function freeSpot(it){for(let y=70;y<H-100;y+=56)for(let x=70;x<740;x+=56)if(!items.some(o=>o!==it&&Math.hypot(o.x-x,o.y-y)<50)){it.x=x;it.y=y;return}}
function after(){const an=analyze(groups()),sig=an.s==3?an.n+'x'+an.g:'';
 if(sig&&sig!=lastSig){SFX.grp();if(mode=='play'){burst(8);const m=$('msg');m.classList.remove('pl');void m.offsetWidth;m.classList.add('pl');if(snd)speak(`ぜんぶ ${an.n}こずつに なったね。`)}}lastSig=sig}
svg.onpointerdown=e=>{if(stat()||drag||anim||e.button>0)return;const p=e.target.closest('[data-pal],[data-id],[data-g]');if(!p)return;const[x,y]=pt(e);let it;
 if(p.dataset.g!=null)drag={grp:groups()[+p.dataset.g].its,lx:x,ly:y,sx:x,sy:y};
 else{if(p.dataset.pal!=null){if(items.length>=36){SFX.ng();shake();return}it={id:nid++,t:+p.dataset.pal,x,y,fresh:1}}else it=items.find(i=>i.id==p.dataset.id);items=items.filter(i=>i!==it);items.push(it);drag=it;drag.sx=x;drag.sy=y}
 dpid=e.pointerId;fb='';SFX.pick();if(svg.setPointerCapture)svg.setPointerCapture(e.pointerId);render()};
svg.onpointermove=e=>{if(!drag||e.pointerId!=dpid)return;const[x,y]=pt(e);
 if(Math.hypot(x-drag.sx,y-drag.sy)>6)drag.mv=1;
 if(drag.grp){const dx=x-drag.lx,dy=y-drag.ly;drag.grp.forEach(i=>{i.x=cl(i.x+dx,24,776);i.y=cl(i.y+dy,24,H-100)});drag.lx=x;drag.ly=y;relax(drag.grp)}
 else{drag.x=cl(x,24,776);drag.y=cl(y,24,H-4);if(drag.y<=H-78)relax([drag])}render()};
const up=e=>{if(!drag||(e&&e.pointerId!=dpid))return;let del=0,g=null;
 if(drag.fresh&&!drag.mv)freeSpot(drag);else if(drag.grp)g=drag.grp;else if(drag.y>H-78){items=items.filter(i=>i!==drag);del=1}
 drag=null;del?SFX.del():SFX.drop();
 if(g)tidy(g,after);else{relax([]);render();after()}};
svg.onpointerup=svg.onpointercancel=svg.onlostpointercapture=up;
// ---- もんだい ----
function newMake(){prob={a:ri(2,5),b:ri(2,5)};items=[];fb='';hl=0;sm=0;$('q').innerHTML=`${prob.a}×${prob.b} の かたちを つくろう！`}
function check(){const an=analyze(groups()),{a,b}=prob,rule=`${a}×${b}は ${a}こずつが ${b}つぶん だよ。`;
 if(an.s==3){fb=an.n==a&&an.g==b?'<p class="okk">⭕ せいかい！</p>'+an.h:an.n==b&&an.g==a?`<p>おしい！ ${b}×${a}の かたちに なっているよ。</p><p>${rule}</p>`:`<p>ざんねん。${an.n}×${an.g}の かたちに なっているよ。</p><p>${rule}</p>`}
 else fb=an.h+(an.s?`<p>${rule}</p>`:'');fb.includes('okk')?(SFX.ok(),burst()):(SFX.ng(),shake());render()}
function newChoose(){const n=ri(2,5),g=ri(2,5),t=ri(0,1),cols=g<4?g:Math.ceil(g/2),rows=g<4?1:2;items=[];ans=0;fb='';hl=0;sm=0;clearInterval(tm);cnt=0;
 for(let i=0;i<g;i++){const cx=100+((i%cols)+.5)*600/cols+rnd(-10,10),cy=(rows==1?190:(i/cols|0)?300:110)+rnd(-10,10),a0=rnd(0,6.28),R=26/Math.sin(Math.PI/n);
  for(let k=0;k<n;k++){const a=a0+2*Math.PI*k/n;items.push({id:nid++,t,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)})}}
 cur={n,g};if(mode=='fill'){fs=0;fillStep();return}
 const seen=new Set(),o=[];[[n,g],[g,n],[n+1,g],[n,g+1],[g+1,n],[n+2,g]].forEach(([a,b])=>{if(!seen.has(a+'×'+b)&&o.length<4){seen.add(a+'×'+b);o.push([a,b])}});
 o.sort(()=>Math.random()-.5);cur={n,g};$('q').textContent='この ならべかたは どの しきに なるかな？';
 $('ch').innerHTML=o.map(([a,b])=>`<button data-v="${a},${b}"><span class="x1">${a}</span>×<span class="x2">${b}</span></button>`).join('')}
$('ch').onclick=e=>{const b=e.target.closest('button');if(!b||ans)return;if(fl())return fillPick(b);const[a,c]=b.dataset.v.split(',').map(Number),{n,g}=cur;
 if(a==n&&c==g){ans=1;b.classList.add('good');fb='<p class="okk">⭕ せいかい！</p>'+analyze(groups()).h;SFX.ok();burst()}
 else{b.classList.add('bad');b.disabled=true;SFX.ng();shake();fb=a==g&&c==n&&n!=g?'<p>おしい！ 1つぶんの かずを さきに かくよ。もういちど えらんでみよう。</p>':'<p>ちがうよ。まとまりを かぞえて、もういちど えらんでみよう。ヒントも つかえるよ。</p>'}
 render()};
// ---- ヒント・しきを かんせい ----
function count(){clearInterval(tm);cnt=0;tm=setInterval(()=>{cnt++;beep(400+cnt*25,.1,'triangle',.15);render();if(cnt>=items.length)clearInterval(tm)},300)}
function hintH(){if(!hl||ans)return'';const{a,b}=prob||{},{n,g}=cur||{};
 const L=mode=='make'?[`${a}×${b}は 「${a}この ${b}つぶん」。まず ${a}こを 1つの まとまりに しよう。`,`${a}この まとまりを ${b}つ つくるよ。まとまりどうしは すこし はなして ならべよう。`,`うすい わくの ばしょに ${a}こずつ ならべてみよう。`]
 :mode=='choose'?['おはじきの まとまりを かこんだよ。あおい かずは、1つの まとまりに いくつ あるかを あらわしているよ。','まとまりに あかい ばんごうを つけたよ。まとまりは いくつぶん あるかな？','しきの あおい わくは「1つぶんの かず」、あかい わくは「いくつぶん」。ずの あおい かずと、あかい ばんごうに あうものを えらぼう。']
 :[['まとまりを かこんだよ。1つの まとまりに いくつ あるかな？','1つぶんの かずを かぞえてみよう。',`1つぶんは ${n}こ だよ。`],['まとまりに あかい ばんごうを つけたよ。まとまりは いくつぶん あるかな？','「いくつぶん」は まとまりの かずだよ。いちばん さいごの あかい ばんごうを みよう。',`${g}つぶん だよ。`],['ぜんぶの おはじきを 1こずつ かぞえるよ。ばんごうを みていてね。','いちばん さいごの ばんごうが、ぜんぶの かずだよ。',`ぜんぶで ${n*g}こ だよ。`]][fs];
 return '<p class="hint">💡 '+L[hl-1]+'</p>'}
function fillStep(){const{n,g}=cur,t=n*g;let h='';
 $('q').className='eq';$('ch').className='lg';
 const bl=(c,v,i)=>`<b class="${c}${fs==i?' cur':jf&&fs-1==i?' pop':''}">${fs>i?v:'？'}</b>`;
 $('q').innerHTML=bl('cb',n,0)+'×'+bl('cr',g,1)+'＝'+bl('cy',t,2);
 if(fs<3){const c=[n,g,t][fs],ds=[[g,n+1,n-1,g+1],[n,g+1,g-1,n+1],[n+g,t+n,t-g,t+1]][fs];
  h=[...new Set([c,...ds,c+1,c+2,c+3].filter(x=>x>0))].slice(0,4).sort(()=>Math.random()-.5).map(v=>`<button data-v="${v}">${v}</button>`).join('')}
 $('ch').innerHTML=h;jf=0;render()}
function fillPick(b){const v=+b.dataset.v,{n,g}=cur;
 if(v!=[n,g,n*g][fs]){b.classList.add('bad');b.disabled=true;fb='<p>ちがうよ。もういちど えらんでみよう。ヒントも つかえるよ。</p>';SFX.ng();shake();render();return}
 fs++;hl=0;fb='';jf=1;if(fs<3)SFX.step();else{SFX.ok();burst();ans=1;fb='<p class="okk">⭕ できた！</p>'+analyze(groups()).h}
 fillStep()}
$('hn').onclick=()=>{hl=Math.min(3,hl+1);sm=1;SFX.hint();render();if(fl()&&fs==2)count()};
$('se').onclick=()=>{snd=!snd;$('se').textContent='♪ こうかおん '+(snd?'ON':'OFF')};
// ---- ともだちと(ならべる→みせる→こたえてもらう) ----
function pairMsg(an){return an.s==3?'<p class="cele">もんだいが できたよ！</p><p>「ともだちに みせる」を おしてね。</p>':an.s==0?'<p>おなじ かずずつの まとまりを つくってね。</p><p>できたら ともだちに みせよう。</p>':an.s==2?'<p>まとまりを 2つ いじょう つくって ならべてね。</p>':an.h}
function pairGo(){const an=analyze(groups());if(an.s!=3){SFX.ng();shake();return}
 ph=1;cur={n:an.n,g:an.g};fs=0;ans=0;hl=0;sm=0;cnt=0;clearInterval(tm);SFX.step();
 fillStep();fb='<p class="cele">ともだちの ばんだよ！</p><p>おはじきを みて、しきを かんせいさせよう。</p>';pairUi();render()}
function pairBack(){ph=0;fb='';ans=0;hl=0;sm=0;cnt=0;clearInterval(tm);lastSig='';$('q').className='';$('q').textContent=PQ;$('ch').className='';$('ch').innerHTML='';pairUi();fit();render()}
function pairUi(){const p1=mode=='pair'&&ph==1;
 $('chk').style.display=mode=='make'||(mode=='pair'&&!p1)?'':'none';$('chk').textContent=mode=='pair'?'ともだちに みせる ▶':'できた！';
 $('nx').style.display=mode=='make'||mode=='choose'||mode=='fill'||p1?'':'none';$('nx').textContent=mode=='pair'?'ならべなおす':'つぎの もんだい';
 $('hn').style.display=mode=='play'||(mode=='pair'&&!p1)?'none':'';$('clr').style.display=mode=='choose'||mode=='fill'||p1?'none':''}
// ---- モード切替 ----
function setMode(m){mode=m;ph=0;items=[];fb='';ans=0;hl=0;sm=0;clearInterval(tm);cnt=0;lastSig='';$('q').className='';$('ch').className='';$('ch').innerHTML='';
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m==m));
 $('q').textContent=m=='play'?'おはじきを ドラッグして、すきなように ならべてみよう':m=='pair'?PQ:'';
 if(m=='make')newMake();if(m=='choose'||m=='fill')newChoose();
 pairUi();fit();render()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.m));
$('chk').onclick=()=>mode=='pair'?pairGo():check();$('sp').onclick=say;
$('clr').onclick=()=>{items=[];fb='';render()};
$('nx').onclick=()=>{if(mode=='pair'){pairBack();return}if(mode=='make'){newMake();render()}else{newChoose();render()}};
window.onresize=()=>{fit();render()};
setMode('play');
</script></body></html>
