<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

#progress{font-size:17px;margin:4px 0;line-height:1.5}#progress[hidden]{display:none}

#q.eq{font-size:clamp(30px,3.6vw,64px);font-size:min(12cqw,72px);white-space:nowrap}

</style></head><body>
<h1>かけ算の しきを おはじきで あらわそう</h1>
<div><button class="tab" data-m="demo">さいしょに見る</button><button class="tab" data-m="play">あそぶ</button><button class="tab" data-m="make">つくろう</button><button class="tab" data-m="choose">どのしき？</button><button class="tab" data-m="fill">しきを かんせい</button><button class="tab" data-m="pair">ともだちと</button></div>
<div id="app"><div id="L"><svg id="sv" viewBox="0 0 800 450"></svg></div>
<div id="RC"><div id="R"><div id="progress" role="status" hidden></div><div id="q"></div><div id="ch"></div>
<div>
<button class="btn main" id="chk">できた！</button>
<button class="btn" id="hn"><span aria-hidden="true">💡</span> ヒント</button>
<button class="btn main" id="demoNext" hidden>デモを はじめる</button>
<button class="btn" id="demoPlay" hidden>あそんでみる</button>
<button class="btn" id="nx">つぎの もんだい</button>
<button class="btn" id="clr">はじめにもどる</button>
<button class="btn" id="undo" disabled>↶ ひとつ もどす</button>
<button class="btn audio-toggle" id="se" aria-label="こうかおん" aria-pressed="true" title="こうかおん ON">🎵</button>
<button class="btn audio-toggle" id="voice" aria-label="じどう よみあげ" aria-pressed="true" title="じどう よみあげ ON">🗣️</button>
</div>
<div id="msg"></div></div>
<details id="ref"><summary><span aria-hidden="true">📖</span> ことばと いろの ヒント</summary><div class="rb">
<p><b>「ずつ」</b>は、どの まとまりも <b>おなじ かず</b> という いみだよ。<br>れい：<b class="cb">3こずつ</b>が <b class="cr">2つぶん</b></p>
<svg viewBox="0 0 230 78" width="190" style="display:block;margin:2px auto"><g fill="none" stroke="#1e88e5" stroke-width="2.5"><ellipse cx="62" cy="42" rx="52" ry="30"/><ellipse cx="168" cy="42" rx="52" ry="30"/></g><g fill="#1e9be8"><use href="#o0" transform="translate(44,42) scale(.4)"/><use href="#o0" transform="translate(62,42) scale(.4)"/><use href="#o0" transform="translate(80,42) scale(.4)"/><use href="#o0" transform="translate(150,42) scale(.4)"/><use href="#o0" transform="translate(168,42) scale(.4)"/><use href="#o0" transform="translate(186,42) scale(.4)"/></g><g fill="#1e88e5"><rect x="42" y="2" width="40" height="18" rx="9"/><rect x="148" y="2" width="40" height="18" rx="9"/></g><g fill="#fff" font-size="12" font-weight="bold" text-anchor="middle"><text x="62" y="15">3こ</text><text x="168" y="15">3こ</text></g><g fill="#e53935"><circle cx="12" cy="42" r="10"/><circle cx="118" cy="42" r="10"/></g><g fill="#fff" font-size="13" font-weight="bold" text-anchor="middle"><text x="12" y="47">1</text><text x="118" y="47">2</text></g></svg>
<div class="row"><b class="cb">あお</b><span><b>1つぶんの かず</b>（○こ<b>ずつ</b>の かず）<br><small>かけられる数（被乗数）＝ かけ算の まえの かず</small></span></div>
<div class="row"><b class="cr">あか</b><span><b>いくつぶん</b>（まとまりの かず）<br><small>かける数（乗数）＝ かけ算の あとの かず</small></span></div>
<div class="row"><b class="cy">き</b><span><b>ぜんぶの かず</b>（こたえ）</span></div>
<p style="font-size:30px;font-weight:bold;text-align:center"><b class="cb">3</b>×<b class="cr">2</b>＝<b class="cy">6</b></p>
</div></details></div></div>
<script>
const COL=['#1e9be8','#5b9a2f','#f5c400','#f2f2f2'],svg=document.getElementById('sv'),$=id=>document.getElementById(id);
const PAL_NAMES=['あおい おはじき','みどりの おはじき','きいろの ブロック','しろい ブロック'];
let pal=0;
let mode='play',items=[],nid=1,drag=null,prob=null,fb='',ans=0,cur=null,hl=0,sm=0,fs=0,H=450,ph=0,jf=0,cnt=0,tm=null,lastSig='',AC=null,snd=1;
let voice=1,audioReady=false,readTimer=null,readState=null;
let history=[],pendingUndo=null;
const colorNum=(c,n)=>`<b class="${c}">${n}</b>`,makeExpr=(a,b)=>`${colorNum('cb',a)}×${colorNum('cr',b)}`;
// モードごとの学習記録。この画面を開いている間、5連続達成を保持する。
const progress={make:{correct:0,streak:0,faded:false},fill:{correct:0,streak:0,faded:false}};
let questionSolved=false,questionAssisted=false,questionColor=false;
function startQuestion(){const p=progress[mode];if(p&&!questionSolved)p.streak=0;questionSolved=false;questionAssisted=false;questionColor=false}
function missQuestion(){const p=progress[mode];if(!p||questionSolved)return;questionAssisted=true;p.streak=0}
function solveQuestion(){const p=progress[mode];if(!p||questionSolved)return;questionSolved=true;p.correct++;if(!questionAssisted){p.streak++;if(p.streak>=5)p.faded=true}}
function progressUi(){const p=progress[mode];$('progress').hidden=!p;if(!p)return;
 $('progress').textContent=`せいかい ${p.correct}もん ／ れんぞくせいかい ${p.streak}もん`+(p.faded?'　いろなしに チャレンジ！':'　5もん れんぞくで いろなしに チャレンジ！');
 $('q').classList.toggle('no-color',p.faded&&!questionColor);
}
function boardState(){return{H,items:items.map(({id,t,x,y})=>({id,t,x,y})).sort((a,b)=>a.id-b.id)}}
function resetUndo(){history=[];pendingUndo=null}
function undoUi(){$('undo').disabled=!history.length||!!drag||!!anim||stat()}
function finishUndo(){if(pendingUndo&&JSON.stringify(pendingUndo.items)!=JSON.stringify(boardState().items)){history.push(pendingUndo);if(history.length>100)history.shift()}pendingUndo=null;undoUi()}
function undo(){if(drag||anim||stat()||!history.length)return;const prev=history.pop();items=prev.items;H=prev.H;fb='';const an=analyze(groups());lastSig=an.s==3?an.n+'x'+an.g:'';fit();render()}
const stat=()=>mode=='demo'||mode=='choose'||mode=='fill'||(mode=='pair'&&ph==1),fl=()=>mode=='fill'||(mode=='pair'&&ph==1),PQ='おはじきを ならべて、ともだちに だす もんだいを つくろう！';
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
// ---- 画面フィット(配置中は座標系を保ち、表示サイズだけを変える) ----
function fit(){const sv=svg,free=mode=='play'||mode=='make'||mode=='pair',big=free&&innerWidth>820&&innerWidth>innerHeight;
 sv.style.height=big?Math.max(260,innerHeight-(sv.getBoundingClientRect().top+scrollY)-parseFloat(getComputedStyle($('L')).paddingBottom)-12)+'px':'';
 const w=sv.clientWidth,h=sv.clientHeight;
 if(!free)H=450;
 else if(!items.length)H=big&&w>0&&h>0?Math.max(300,Math.min(1200,800*h/w)):450;
 sv.setAttribute('viewBox','0 0 800 '+H)}
// ---- 効果音・演出 ----
function beep(f,d,t,v,at){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),b=AC.currentTime+(at||0);o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,b);g.gain.exponentialRampToValueAtTime(.001,b+d);o.connect(g);g.connect(AC.destination);o.start(b);o.stop(b+d)}catch(e){}}
const SFX={pick:()=>beep(660,.08),drop:()=>beep(440,.1,'triangle',.2),del:()=>beep(300,.15,'triangle'),hint:()=>beep(880,.15,'triangle'),
 grp:()=>{beep(784,.12);beep(988,.15,'sine',.15,.1)},step:()=>{beep(660,.12);beep(880,.18,'sine',.15,.1)},
 ok:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.2,'sine',.2,i*.1)),ng:()=>{beep(220,.25,'sawtooth',.08);beep(180,.3,'sawtooth',.08,.12)}};
function burst(n){const L=$('L');for(let i=0;i<(n||14);i++){const e=document.createElement('span'),a=rnd(0,6.28),r=rnd(80,260);e.className='st';e.setAttribute('aria-hidden','true');e.textContent=['⭐','✨','🌟'][i%3];e.style.cssText=`left:50%;top:45%;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;L.appendChild(e);setTimeout(()=>e.remove(),1000)}}
function shake(){const r=$('R');r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake')}
// ---- 読み上げ用(ひらがな化) ----
const D=['れい','いち','に','さん','よん','ご','ろく','なな','はち','きゅう','じゅう'],T=['','ひとつ','ふたつ','みっつ','よっつ','いつつ','むっつ','ななつ','やっつ','ここのつ','とお'];
const num=n=>n<=10?D[n]:(n>=20?D[n/10|0]:'')+'じゅう'+(n%10?D[n%10]:'');
const tsu=n=>n<=10?T[n]:num(n)+'こ';
const kc=n=>{const s=num(n);return n%10==0&&n>0?s.replace(/う$/,'っこ'):/[ちく]$/.test(s)?s.replace(/[ちく]$/,'っこ'):s+'こ'};
function readingState(){const clean=text=>speechText(text).replace(/\s+/g,' ').trim();
 if(mode=='play'){const an=analyze(groups());return{question:'',messages:an.s==3?[`おなじ かずずつに なったね。${an.n}×${an.g}＝${an.t}。`]:[]}}
 const question=fl()&&!ans?['1つぶんの かずを えらぼう。','いくつぶんかを えらぼう。','ぜんぶの かずを えらぼう。'][fs]:fl()?'':clean($('q').innerText);
 return{question,messages:[...$('msg').children].map(el=>clean(el.innerText)).filter(Boolean)}}
function autoRead(){clearTimeout(readTimer);if(drag||anim)return;const next=readingState();
 if(!readState||!voice||!audioReady){readState=next;return}
 const changed=[next.question!=readState.question?next.question:'',...next.messages.filter(text=>!readState.messages.includes(text))].filter(Boolean);
 if(!changed.length){readState=next;return}
 readTimer=setTimeout(()=>{if(!voice||drag||anim)return;readState=next;speak(changed.join(' '))},180)}
function audioUi(){for(const[id,on]of [['se',snd],['voice',voice]]){const b=$(id);b.setAttribute('aria-pressed',String(!!on));b.title=b.getAttribute('aria-label')+' '+(on?'ON':'OFF')}}
function enableAudio(){if(audioReady)return;audioReady=true;autoRead()}
document.addEventListener('pointerdown',enableAudio,{capture:true});document.addEventListener('keydown',enableAudio,{capture:true});
function speechText(text){return text.replace(/[\p{Extended_Pictographic}\uFE0F\u200D\u20E3]/gu,'')}
function speak(t0){if(!voice||!window.speechSynthesis)return;const t=speechText(t0).replace(/\d+(?:\s*[×＋＝]\s*\d+)+/g,(expr,offset,text)=>expr+(/^[。、！？!?]/.test(text.slice(offset+expr.length).trimStart())?'':'。')).replace(/(\d+)こ/g,(_,d)=>kc(+d)).replace(/(\d+)つ/g,(_,d)=>tsu(+d)).replace(/？/g,' はてな ').replace(/＋/g,' たす ').replace(/×/g,' かける ').replace(/＝/g,' は ').replace(/(\d+)/g,(_,d)=>num(+d));
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u)}
// ---- まとまりの認識 ----
function groups(){const n=items.length,p=[...Array(n).keys()],f=i=>p[i]==i?i:p[i]=f(p[i]);
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(Math.hypot(items[i].x-items[j].x,items[i].y-items[j].y)<60)p[f(i)]=f(j);
 const m={};items.forEach((it,i)=>(m[f(i)]=m[f(i)]||[]).push(it));
 return Object.values(m).map(g=>{const xs=g.map(i=>i.x),ys=g.map(i=>i.y),a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys);
  return{its:g,n:g.length,cx:(a+b)/2,cy:(c+d)/2,rx:(b-a)/2*1.42+30,ry:(d-c)/2*1.42+30,mix:new Set(g.map(i=>i.t)).size>1}}).sort((a,b)=>a.cx-b.cx||a.cy-b.cy)}
const sum=gs=>{const a=gs.map(x=>x.n);return(a.length>8?a.slice(0,8).join('＋')+'＋…':a.join('＋'))+'＝'+a.reduce((x,y)=>x+y,0)};
function analyze(gs){
 const g=gs.length;if(!g)return{s:0,h:'<p>おはじきを ドラッグして ならべてみよう！</p>'};
 const c={};gs.forEach(x=>c[x.n]=(c[x.n]||0)+1);
 const n=+Object.keys(c).sort((a,b)=>c[b]-c[a]||b-a)[0],bad=[];gs.forEach((x,i)=>{if(x.n!=n)bad.push(i)});
 let near=0;for(let i=0;i<g;i++)for(let j=i+1;j<g;j++)for(const p of gs[i].its)for(const q of gs[j].its)if(Math.hypot(p.x-q.x,p.y-q.y)<85)near=1;
 const ex=stat()?'':(gs.some(x=>x.mix)?'<p class="hint">おはじきの いろや かたちが まざっているよ。</p>':'')+(near?'<p class="hint">まとまりどうしが ちかいよ。すこし はなして ならべよう。</p>':'');
 if(bad.length){const d=gs[bad[0]].n-n;return{s:1,bad,n,g,h:`<p>まとまりの かずが ちがうよ（${gs.map(x=>x.n+'こ').join('、')}）。</p><p>${n}こずつに そろえよう。あかい まとまりは ${n}こより ${Math.abs(d)}こ ${d<0?'たりない':'おおい'}よ。</p>`+(stat()?'':`<p class="hint">いまの ならべかたを たしざんの しきに すると ${sum(gs)}</p>`)+ex}}
 if(g<2)return{s:2,n,g,t:n,h:`<p><b class="cb">${n}こずつ</b>が <b class="cr">1つぶん</b> ある ので、ぜんぶで <b class="cy">${n}こ</b>。</p><p class="big"><b class="cb">${n}</b>×<b class="cr">1</b>＝<b class="cy">${n}</b></p><p>まとまりが 1つだけだよ。ほかにも ${n}こずつの まとまりを ふやして ならべてみよう。</p>`+ex};
 const t=n*g;return{s:3,n,g,t,h:`<p class="cele">ぜんぶ ${n}こずつに なったね！</p><p><b class="cb">${n}こずつ</b>が <b class="cr">${g}つぶん</b> ある ので、ぜんぶで <b class="cy">${t}こ</b>。</p><p class="big"><b class="cb">${n}</b>×<b class="cr">${g}</b>＝<b class="cy">${t}</b></p>`+ex}}
// ---- 描画 ----
// ---- 造形: 花形おはじき(中央に穴・透明感のある光沢) と 数図ブロック(厚み・縁・くぼみ) ----
const FP=(()=>{let d='';for(let i=0;i<=120;i++){const a=i/120*2*Math.PI;let r=11;for(let k=0;k<5;k++){const b=a-(-Math.PI/2+2*Math.PI*k/5),sn=Math.sin(b),q=9.6*9.6-144*sn*sn;if(q>0){const v=12*Math.cos(b)+Math.sqrt(q);if(v>r)r=v}}d+=(i?'L':'M')+(r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1)}return d+'ZM6.6 0A6.6 6.6 0 1 0 -6.6 0A6.6 6.6 0 1 0 6.6 0Z'})();
const gr=(id,a,b,c)=>`<radialGradient id="${id}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="${a}"/><stop offset=".5" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`;

 ph=1;cur={n:an.n,g:an.g};fs=0;ans=0;hl=0;sm=0;cnt=0;clearInterval(tm);SFX.step();
 fillStep();fb='<p class="cele">ともだちの ばんだよ！</p><p>おはじきを みて、しきを かんせいさせよう。</p>';pairUi();render()}
function pairBack(){ph=0;fb='';ans=0;hl=0;sm=0;cnt=0;clearInterval(tm);lastSig='';$('q').className='';$('q').textContent=PQ;$('ch').className='';$('ch').innerHTML='';pairUi();fit();render()}
function pairUi(){const p1=mode=='pair'&&ph==1;
 $('chk').style.display=mode=='make'||(mode=='pair'&&!p1)?'':'none';$('chk').textContent=mode=='pair'?'ともだちに みせる ▶':'できた！';
 $('nx').style.display=mode=='make'||mode=='choose'||mode=='fill'||p1?'':'none';$('nx').textContent=mode=='pair'?'ならべなおす':'つぎの もんだい';
 $('hn').style.display=mode=='demo'||mode=='play'||(mode=='pair'&&!p1)?'none':'';$('clr').style.display=mode=='demo'||mode=='choose'||mode=='fill'||p1?'none':'';$('undo').style.display=stat()?'none':''}
// ---- さいしょに見る（3こずつを2つ作る操作デモ） ----
let demoStep=0,demoMotion=false,demoRun=0;
function demoMessage(){return [
 '<p>おなじ かずずつの まとまりを つくると、かけざんの しきで あらわせるよ。</p><p>たとえば、3こずつの まとまりを つくってみよう。</p>',
 '<p>おなじ かずずつの まとまりを つくると、かけざんの しきで あらわせるよ。</p><p>したの おはじきを ドラッグして、ちかくに 3こ ならべたよ。</p><p>あおい わくで かこまれた 3こが、1つの まとまりだよ。</p>',
 '<p>すこし はなれた ところにも、3こ ならべたよ。</p><p>3こずつの まとまりが 2つ できたね。</p>',
 `<p>${colorNum('cb','3こずつ')}が ${colorNum('cr','2つぶん')}。ぜんぶで ${colorNum('cy','6こ')}だね。</p><p class="big">${makeExpr(3,2)}＝${colorNum('cy',6)}</p><p>しきは「1つぶんの かず × いくつぶん」。3 × 2 ＝ 6 だよ。</p><p>あそぶ ときは、したの おはじきを ドラッグして、すきな かずずつ ならべてみよう。</p>`
 ][demoStep]}
function demoUi(){const demo=mode=='demo';$('demoNext').hidden=!demo;$('demoPlay').hidden=!demo;
 $('demoNext').disabled=demoMotion;$('demoNext').textContent=['デモを はじめる','もう1つ つくる','しきで あらわす','もういちど 見る'][demoStep]}
function demoAdvance(){if(mode!='demo'||demoMotion)return;if(demoStep==3){setMode('demo');return}
 demoStep++;if(demoStep==3){demoUi();render();return}
 const run=demoRun,base=demoStep==1?230:540;demoMotion=true;demoUi();render();let k=0;
 function move(){if(run!=demoRun||mode!='demo')return;const it={id:nid++,t:0,x:240,y:H-46},sx=it.x,sy=it.y,tx=base+(k-1)*52,ty=190,start=performance.now();items.push(it);
 function frame(now){if(run!=demoRun||mode!='demo')return;const t=Math.min(1,(now-start)/650),ease=t*t*(3-2*t);it.x=sx+(tx-sx)*ease;it.y=sy+(ty-sy)*ease;render();if(t<1)requestAnimationFrame(frame);else if(++k<3)move();else{demoMotion=false;demoUi();render()}}
 requestAnimationFrame(frame)}move()}
$('demoNext').onclick=demoAdvance;$('demoPlay').onclick=()=>setMode('play');
// ---- モード切替 ----
function setMode(m){demoRun++;demoMotion=false;clearTimeout(readTimer);if(window.speechSynthesis)speechSynthesis.cancel();resetUndo();if(progress[mode]&&!questionSolved)progress[mode].streak=0;questionSolved=true;mode=m;ph=0;items=[];fb='';ans=0;hl=0;sm=0;clearInterval(tm);cnt=0;lastSig='';$('q').className='';$('ch').className='';$('ch').innerHTML='';
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m==m));
 $('q').textContent=m=='play'?'おはじきを ドラッグして、すきなように ならべてみよう':m=='pair'?PQ:'';
 if(m=='demo'){demoStep=0;pal=0;$('q').className='demo';$('q').innerHTML='おなじ かずずつの<br>まとまりを つくろう'}
 demoUi();if(m=='make')newMake();if(m=='choose'||m=='fill')newChoose();
 pairUi();fit();render()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.m));
$('chk').onclick=()=>mode=='pair'?pairGo():check();
$('undo').onclick=undo;
$('clr').onclick=()=>{if(drag||anim)return;pendingUndo=boardState();items=[];fb='';lastSig='';finishUndo();render()};
$('nx').onclick=()=>{if(mode=='pair'){pairBack();return}if(mode=='make'){newMake();render()}else{newChoose();render()}};
window.onresize=()=>{fit();render()};
setMode('demo');
</script></body></html>
