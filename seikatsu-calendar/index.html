<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活カレンダー</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div><h1>🌈 せいかつカレンダー</h1><p>写真と絵で、きょうとこれからを見よう</p></div><nav><button data-view="calendar" class="active">月の予定</button><button data-view="timeline">ながい予定表</button><a href="day.html">きょうの予定</a></nav></header>
<main><section id="calendar-view" class="view active"><div class="toolbar"><button id="prev-month">◀ 前の月</button><h2 id="month-title"></h2><button id="next-month">次の月 ▶</button><button id="today-button">きょう</button></div><div id="calendar" class="calendar" aria-label="月間カレンダー"></div><aside id="day-detail" class="detail">日にちを押すと、予定がここに出ます。</aside></section>
<section id="timeline-view" class="view"><div class="timeline-controls"><label>表示する期間 <select id="range-kind"><option value="term">今の学期</option><option value="year">年度</option><option value="custom">好きな期間</option></select></label><label>はじまり <input id="range-start" type="date"></label><label>おわり <input id="range-end" type="date"></label><button id="print-timeline">A3で印刷</button></div><p class="hint">横に動かして見よう。赤い線が「きょう」です。</p><div id="timeline-scroll" class="timeline-scroll"><div id="timeline"></div></div></section>
<section class="teacher"><h2>先生のメニュー</h2><div class="teacher-actions"><button id="add-event">＋ 行事を入れる</button><button id="export">バックアップを書き出す</button><label class="button-like">バックアップを読み込む<input id="import" type="file" accept="application/json" hidden></label></div><p>行事とアップロード写真は、この端末のブラウザ内だけに保存されます。書き出したバックアップファイルの保管は先生が行ってください。</p></section></main>
<dialog id="event-dialog"><form id="event-form" method="dialog"><div class="dialog-title"><h2 id="form-heading">行事を入れる</h2><button value="cancel" aria-label="閉じる">×</button></div><input id="event-id" type="hidden"><label>行事の名前<input id="event-title" required maxlength="30" placeholder="例：えんそく"></label><label>種類<select id="event-category"><option value="gyouji">行事</option><option value="nouji">栽培・調理</option><option value="seikatsu">日常</option><option value="kisetsu">季節</option></select></label><div id="stages"></div><button type="button" id="add-stage">＋ 段階を増やす</button><menu><button value="cancel">やめる</button><button id="save-event" value="default">保存する</button></menu></form></dialog>
<template id="stage-template"><fieldset class="stage-form"><button type="button" class="remove-stage">×</button><label>いつ？<input class="stage-date" type="date" required></label><label>なにをする？<input class="stage-label" required maxlength="20" placeholder="例：しゅうかく"></label><input class="stage-image" type="hidden"><div class="chosen-image">写真・絵をえらぶ</div><button type="button" class="choose-image">写真・絵をえらぶ</button></fieldset></template>
<dialog id="image-dialog"><div class="dialog-title"><h2>写真・絵をえらぶ</h2><button id="close-image" aria-label="閉じる">×</button></div><label class="upload">この端末から写真を追加<input id="image-upload" type="file" accept="image/*" hidden></label><div id="image-palette"></div></dialog><script type="module" src="js/app.js"></script></body></html>
