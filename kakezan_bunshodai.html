<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>かけ算の文章題・立式マスター</title>
<style>
:root{--b:#3b82f6;--bl:#dbeafe;--p:#ec4899;--pl:#fce7f3;--y:#eab308;--yl:#fef08a;--sp:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#fff7d6;overflow:hidden;font-family:"UD デジタル 教科書体 N-R","BIZ UDPGothic","Hiragino Maru Gothic ProN",sans-serif;color:#333}
#app{width:min(100vw,177.78vh);height:min(56.25vw,100vh);font-size:min(1vw,1.7778vh);display:grid;grid-template:7% 93%/46% 54%;background:#fffdf3}
header{grid-column:1/3;display:flex;align-items:center;gap:1em;padding:0 2em;background:#fde68a;font-size:1.8em;font-weight:bold}
#hd{flex:1}
button{font:inherit;border:0;border-radius:.6em;padding:.35em .9em;background:#fff;box-shadow:0 .12em 0 #0003;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.9) translateY(.1em)}
button:focus-visible,input:focus-visible{outline:.2em solid #f59e0b}
#L{padding:1.6em 2em;display:flex;flex-direction:column;gap:.9em}
#q{font-size:2.4em;line-height:1.5;margin:0;font-weight:bold}
#bal{font-size:1.8em;background:#fff;border:.15em solid #f59e0b;border-radius:1em;padding:.4em .8em;min-height:2.6em;visibility:hidden}
#eq{display:flex;align-items:center;gap:.4em;font-size:3em;font-weight:bold}
#eq div{text-align:center}
#eq small{display:block;font-size:.4em}
input{width:2.2em;font:inherit;text-align:center;border-radius:.3em;border:.1em solid;padding:.1em}
.b{border-color:var(--b);background:var(--bl)}.p{border-color:var(--p);background:var(--pl)}.y{border-color:var(--y);background:var(--yl)}
#pad{display:grid;grid-template-columns:repeat(6,1fr);gap:.5em;font-size:2em}
#bt{display:flex;gap:1em;font-size:2em}
#ok,#nx{background:#22c55e;color:#fff}
#R{padding:1.5em;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1em}
#st,#lbs{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center;align-items:center}
#st{width:100%}#st svg{display:block;width:100%;height:auto}
.gp,.an{transform-box:fill-box;transform-origin:center}
.gp.new,.an.new,.lb.nw{animation:pop .6s var(--sp) both}
.em{text-anchor:middle;dominant-baseline:central}
.n{font-weight:bold;text-anchor:middle;dominant-baseline:central;fill:#333}
.lb{font-size:2em;font-weight:bold;padding:.15em .7em;border-radius:.8em;border:.12em solid}
.fm{font-size:4em;font-weight:bold}.fm b{display:inline-block;padding:0 .25em;border-radius:.3em;border:.06em solid}
mark{background:none;color:inherit;border-radius:.3em;padding:0 .08em;display:inline-block;animation:mk .55s var(--sp) both}mark:nth-of-type(2){animation-delay:.15s}mark.c{background:#fed7aa;box-shadow:0 0 0 .08em #fb923c}mark.b{background:var(--bl);box-shadow:0 0 0 .08em var(--b)}mark.p{background:var(--pl);box-shadow:0 0 0 .08em var(--p)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
/* Phase3の動き: 強調 / コピーが横に増える / 具体物→ドット / 累計が順に点灯 */
@keyframes emph{30%{transform:scale(1.1,.92)}55%{transform:scale(.96,1.06)}80%{transform:scale(1.02)}}
@keyframes mk{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-70px) scale(.5);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes hop{40%{transform:translateY(-9px) scale(1.12)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes wig{0%,60%,100%{transform:none}15%{transform:scale(1.1) rotate(-2.5deg)}30%{transform:scale(1.1) rotate(2.5deg)}45%{transform:scale(1.08) rotate(-1deg)}}
@keyframes cp{from{transform:translateX(var(--dx)) scale(.7) rotate(-8deg);opacity:0}25%{opacity:1}to{transform:none;opacity:1}}
@keyframes todot{from{opacity:1;transform:none}30%{transform:scale(1.25) rotate(-10deg)}to{opacity:0;transform:scale(.2) rotate(140deg)}}
@keyframes lit{from{opacity:.15;transform:scale(.3)}to{opacity:1;transform:none}}
.gp.e{animation:emph .9s ease-in-out}.gp.new.e{animation:pop .6s var(--sp) both,emph .9s .6s ease-in-out}.gp.new.c{animation:cp .75s var(--sp) both}
.it{transform-box:fill-box;transform-origin:center}.it.x{opacity:0}.it.x.mv{animation:todot .6s calc(var(--i,0)*.06s) backwards}
.gp.new:not(.c) .it:not(.x){animation:drop .55s calc(.15s + var(--i,0)*.1s) var(--sp) backwards}
.gp.new.c .it:not(.x){animation:hop .5s calc(var(--gd,0s) + .55s + var(--i,0)*.06s) ease-out backwards}
.dt{fill:var(--y);stroke:#ca8a04;stroke-width:1.5;transform-box:fill-box;transform-origin:center}.dt.mv{animation:pop .5s var(--sp) calc(.3s + var(--i,0)*.06s) both}
.an.lit{animation:lit .6s cubic-bezier(.34,1.8,.64,1) both}
path.an{stroke-dasharray:1;stroke-dashoffset:0}path.an.new{animation:draw .9s ease-out both}
#ok.rdy,#nx.rdy{animation:wig 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.gp.new,.gp.e,.an.new,.an.lit,.it.x.mv,.dt.mv,.lb.nw,.gp.new .it,mark,#ok.rdy,#nx.rdy,.bk,.dc,.lv{animation:none!important}button{transition:none}}
/* 表紙・レベルの入口・クリア状況 */
.scr{width:min(100vw,177.78vh);height:min(56.25vw,100vh);font-size:min(1vw,1.7778vh);position:relative;overflow:hidden}
#cv{background:#fff7d6}
#cv:before,#cv:after{content:"";position:absolute;border-radius:50%}
#cv:before{width:50em;height:50em;left:-14em;top:-24em;background:#fdeaa8}
#cv:after{width:46em;height:46em;right:-12em;bottom:-27em;background:#d9f2d0}
#cv>*{position:absolute;z-index:1}
.dc{animation:bob 3.6s ease-in-out var(--d,0s) infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-.35em) rotate(var(--r,0deg))}}
@keyframes bpop{from{transform:scale(.3) rotate(calc(var(--r)*3));opacity:0}to{transform:rotate(var(--r));opacity:1}}
#cvL{left:4em;top:2.5em;width:54em}
.tg{display:inline-block;background:#fff;border:.15em solid #f59e0b;border-radius:2em;padding:.1em .9em;font-size:1.8em;font-weight:bold;color:#b45309}
#ttl{margin-top:.8em}#ttl>div{display:flex;gap:.5em;margin-bottom:.5em}
.bk{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;font-size:4.6em;font-weight:bold;color:#fff;background:var(--c);border-radius:.22em;border-bottom:.08em solid #0003;animation:bpop .6s var(--sp) var(--d) both,bob 3.2s ease-in-out calc(var(--d) + .9s) infinite}
.bk small{font-size:.62em;letter-spacing:-.05em}
#cvbt{display:flex;align-items:center;gap:1.2em;margin-top:1.2em}
#go{font-size:2.8em;background:#22c55e;color:#fff;padding:.25em 1em;border-radius:1em;line-height:1.15}
#go small{display:block;font-size:.42em;font-weight:normal}
#stb{font-size:2em;border:.1em solid #f59e0b}
#cvsum{margin-top:1.1em;font-size:1.7em;font-weight:bold;color:#7c4a1e;display:flex;align-items:center;gap:.7em}
.bar{display:inline-block;width:16em;height:.7em;background:#e5e7eb;border-radius:.4em;overflow:hidden}
.bar i{display:block;height:100%;background:#22c55e;border-radius:.4em}
#cvR{left:59em;top:6em;width:37em;height:26em;background:#fff;border:.25em solid #f59e0b;border-radius:2em;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1em 1.5em;gap:.8em}
#cvf{width:100%}#cvf svg{display:block;width:100%;height:auto}
#cvfm{font-size:2.8em;min-height:1.5em;visibility:hidden}
#snd2{right:2em;top:1em;font-size:1.5em}
#lvs{left:4em;right:4em;bottom:2em}
#lvs h2{margin:0 0 .5em;font-size:2em;color:#7c4a1e}
#lvg{display:grid;grid-template-columns:repeat(5,1fr);gap:.9em}
.lv{position:relative;text-align:left;padding:.7em 1em;border-radius:1.2em;background:#fff;border:.18em solid #fde68a;display:flex;flex-direction:column;gap:.5em;animation:pop .5s var(--sp) var(--d) both}
.lv.cur{border-color:#f59e0b;background:#fff8e1}
.lv .t{display:flex;align-items:center;gap:.6em}
.no{display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;border-radius:50%;color:#fff;font-weight:bold;font-size:1.6em;flex:none}
.lv em{font-style:normal;font-size:1.35em;font-weight:bold;line-height:1.1}
.r2{display:flex;align-items:center;gap:.7em}
.sg{flex:1;display:flex;gap:.12em}.sg i{flex:1;height:1.1em;border-radius:.3em}

.lv u{position:absolute;left:.75em;top:-.75em;text-decoration:none;font-size:1.7em;transform:rotate(-14deg);pointer-events:none;animation:bpop .6s var(--sp) both;--r:-14deg}
.s0{background:#e5e7eb}.sh{background:#fdba74}.s1{background:#4ade80}

#scs{flex:1;display:flex;align-items:center;gap:.6em;font-size:.8em}

#lg{display:flex;align-items:center;gap:1.6em;padding:0 2em;font-size:1.5em;color:#555}
#lg i{display:inline-block;width:1.2em;height:1.2em;border-radius:.3em;vertical-align:middle;margin-right:.3em}
#rows{display:flex;flex-direction:column;justify-content:space-between;gap:.35em;padding:.2em 2em .8em;min-height:0}.rw .no{font-size:1.05em}
.rw{flex:1;min-height:0;display:flex;align-items:center;gap:1em;background:#fff;border-radius:.9em;border:.15em solid #f1e7c8;padding:0 1em}
.rl{width:16em;display:flex;align-items:center;gap:.6em;font-size:1.25em;font-weight:bold}
.cs{flex:1;display:flex;flex-wrap:wrap;gap:.3em}
.ch{position:relative;width:2.2em;height:2.2em;padding:0;border-radius:.55em;font-size:1.1em;font-weight:bold}
.ch.s0{color:#9ca3af}.ch.sh{color:#9a3412}.ch.s1{color:#14532d}
.ch.cur{box-shadow:0 0 0 .2em #f59e0b}
.ch i{position:absolute;right:.1em;top:-.1em;font-size:.55em;font-style:normal;color:#ca8a04}
.rc{width:7em;text-align:right;font-size:1.4em}
/* 確認用モード(URLの末尾に #gallery) */
body.gal{display:block;height:auto;overflow:auto}
#gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;padding:8px;font:14px sans-serif}
#gal p{grid-column:1/-1;margin:0}

#gal.pt{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
#gal.pt figure{text-align:center}
#gal.pt svg{display:inline-block;margin:2px}
#gal figcaption b{color:#dc2626;margin-left:4px}
#gal svg{display:block;width:100%;height:auto}

 sOf=i=>st.h[i]==1?'s1':st.h[i]===0?'sh':'s0',nClr=()=>P.filter((_,i)=>st.h[i]==1).length,cnt=idx=>idx.filter(i=>st.h[i]==1).length;

 if(RM.matches){el.innerHTML=fig(m,3,99,0);fm.innerHTML=fml(m);fm.style.visibility='visible';return}

 at(()=>{fm.innerHTML=fml(m);fm.style.visibility='visible';an(fm,[{transform:'scale(.5)',opacity:0},{transform:'none',opacity:1}],{duration:500,easing:SP})},t4);

 $('ttl').innerHTML=[['か','け','算','の'],['ぶ','ん','しょ','う','だ','い']].map((row,ri)=>`<div>${row.map((c,k)=>{const j=ri*4+k;return`<span class="bk" style="--c:${BKC[j%4]};--r:${[-4,3,-2,4,2,-3,3,-4,2,-2][j%10]}deg;--d:${(j*.08+.1).toFixed(2)}s">${c.length>1?`<small>${c}</small>`:c}</span>`}).join('')}</div>`).join('');

// データ検査: 1つ分×いくつ分=ぜんぶ、式の順番、図のまとまり数・中身の数、文中の数字の位置
function validate(){const e=[];P.forEach((r,i)=>{const t=r[5];
 if((t.match(/\{o\}/g)||[]).length!=1||(t.match(/\{g\}/g)||[]).length!=1)e.push(i+':文中の数字の位置');
 const m=mk(r,r[6],r[7]);
 if(m.o*m.g!=m.total||m.expr!=r[6]+'×'+r[7])e.push(i+':式・ぜんぶの数');
 const h=fig(m,4,0); // まとまり数=いくつ分、中身の数=1つ分×いくつ分、累計の数字=いくつ分
 if((h.match(/class="gp[ "]/g)||[]).length!=m.g||(h.match(/class="it[ "]/g)||[]).length!=m.g*m.o||(h.match(/class="n"/g)||[]).length!=m.g||(h.match(/class="dt[ "]/g)||[]).length!=m.g*m.o)e.push(i+':図のまとまり');
 if(!t.includes('何'))e.push(i+':問い');
 if(!m.u)e.push(i+':単位');if(!m.zu&&!m.text.match(CN))e.push(i+':注目ことば')});
 // 図の幾何: 全容器×中身1〜6個で、中身が内側の矩形からはみ出さない・重ならない
 for(const k in CD){const c=CD[k],[x,y,w,h]=c.r;for(let n=1;n<=6;n++){const{p,z}=place(n,c);
  p.forEach(([a,b],i)=>{if(a-z/2<x-.01||a+z/2>x+w+.01||b-z/2<y-.01||b+z/2>y+h+.01)e.push(k+n+':はみ出し');
   for(let j=i+1;j<n;j++)if(Math.abs(a-p[j][0])<z-.01&&Math.abs(b-p[j][1])<z-.01)e.push(k+n+':重なり')})}}
 return e}
// 確認用: URLの末尾に #gallery で全問のstage4の図を一覧(#gallery-max は 1つ分6×いくつ分6 の最大表示)
function gallery(){document.body.className='gal';ss=9;/* 動きなし */$('app').hidden=true;const mx=/max/.test(location.hash),bd=new Set(validate().map(x=>parseInt(x))),d=document.createElement('div');d.id='gal';
 d.innerHTML='<p><a href="#gallery">もとの数</a>　<a href="#gallery-max">さいだい(6×6)</a>　赤い枠=データ検査NG</p>'+P.map((r,i)=>{const m=mk(r,mx&&!r[8]?6:r[6],mx?6:r[7]);
  return`<figure${bd.has(i)?' class="bad"':''}><figcaption>${i+1}　Lv.${r[0]}　${m.o}×${m.g}＝${m.total}　${r[2]}→${r[3]}</figcaption>${fig(m,4,99,0)}</figure>`}).join('');document.body.append(d)}
// 確認用: URLの末尾に #parts で i-/c- の全部品を「大(約120px)」と「実寸(24px)」で並べる。役割色(青190〜260°・ピンク300〜345°・黄43〜62°)に近く彩度(HSV)が.25以上の色は赤く警告
function hsv(h){h=h.slice(1);if(h.length==3)h=h.replace(/./g,'$&$&');const[r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255),x=Math.max(r,g,b),d=x-Math.min(r,g,b);return[60*(d?x==r?((g-b)/d+6)%6:x==g?(b-r)/d+2:(r-g)/d+4:0),x?d/x:0]}
const roleHue=([t,s])=>s>=.25?t>=190&&t<=260?'青':t>=300&&t<=345?'ピンク':t>=43&&t<=62?'黄':'':'';
function parts(){document.body.className='gal';ss=9;$('app').hidden=true;const w=[],d=document.createElement('div'),sy=[...document.querySelectorAll('#sp symbol')];d.id='gal';d.className='pt';
 const fg=sy.map(s=>{const v=s.viewBox.baseVal,bad=[...new Set(s.outerHTML.match(/#[0-9a-f]{6}\b|#[0-9a-f]{3}\b/gi)||[])].map(c=>[c,roleHue(hsv(c))]).filter(x=>x[1]),sz=n=>`<svg style="width:${n}px;height:${Math.round(n*v.height/v.width)}px" viewBox="0 0 ${v.width} ${v.height}"><use href="#${s.id}" width="${v.width}" height="${v.height}"/></svg>`;
  if(bad.length)w.push(s.id+':'+bad.map(x=>x.join('=')).join(','));
  return`<figure${bad.length?' class="bad"':''}>${sz(120)}<br>${sz(24)}<figcaption>${s.id}${bad.map(x=>`<b>${x[0]}=${x[1]}</b>`).join('')}</figcaption></figure>`}).join(''),
 no=[...new Set([...Object.values(IT).map(n=>'i-'+n),...Object.values(CT).map(n=>'c-'+n).filter(n=>n!='c-plain'&&n!='c-line'),...Object.keys(CD).filter(k=>CD[k].a).map(k=>'c-'+k)])].filter(n=>!document.getElementById(n));
 d.innerHTML=`<p>部品${sy.length}個　色の警告 ${w.length}件${w.length?'：'+w.join(' / '):''}　IT・CTの未定義 ${no.length}件${no.length?'：'+no.join(','):''}　<a href="#gallery">ギャラリー</a>　赤い枠=青・ピンク・黄に近い色あり</p>`+fg;document.body.append(d);
 window.partWarn=w;window.partMissing=no;if(w.length||no.length)console.error('部品検査NG',w,no);else console.log('部品検査OK',sy.length+'個')}
const bad=validate();
if(bad.length)console.error('データ検査NG',bad);else console.log('データ検査OK',P.length+'問');
