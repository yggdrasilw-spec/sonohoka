<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f6ef">
  <title>はじめての まっすぐな線</title>
  <link rel="stylesheet" href="css/chokusen-hajime.css">
  <script src="js/construction-hands.js" defer></script>
  <script src="js/chokusen-hajime.js" defer></script>
</head>
<body>
  <main class="lesson">
    <header class="intro">
      <h1>はじめての<br class="small-break"> <span>まっすぐな<ruby>線<rt>せん</rt></ruby></span></h1>
      <p>じょうぎは どこを おさえると、うごきにくいかな？</p>
    </header>

    <section class="demonstration" aria-labelledby="watch-title">
      <div class="board-top">
        <h2 id="watch-title">じょうぎの うごきを みよう</h2>
        <div class="orientation" role="group" aria-label="せんの むき">
          <button type="button" data-direction="vertical" aria-pressed="true">たての<ruby>線<rt>せん</rt></ruby></button>
          <button type="button" data-direction="horizontal" aria-pressed="false">よこの<ruby>線<rt>せん</rt></ruby></button>
        </div>
        <div class="choices" role="group" aria-label="くらべる うごき">
          <button type="button" data-grip="two" aria-pressed="true">はなれた２かしょ</button>
          <button type="button" data-grip="one" aria-pressed="false">１かしょ</button>
          <button type="button" data-grip="loose" aria-pressed="false">えんぴつが はなれる</button>
        </div>
      </div>
      <figure class="board">
        <svg class="scene" viewBox="0 0 600 338" role="img" aria-labelledby="scene-title scene-desc">
          <title id="scene-title">じょうぎと えんぴつの うごき</title>
          <desc id="scene-desc">みどりの まるは、ゆびで おさえる ところです。</desc>
          <defs>
            <pattern id="squares" width="24" height="24" patternUnits="userSpaceOnUse">
              <path d="M24 0H0V24" fill="none" stroke="#dce9e4"/>
            </pattern>
            <linearGradient id="ruler-color" x2="0" y2="1">
              <stop stop-color="#ffdf80"/><stop offset="1" stop-color="#ffedaa"/>
            </linearGradient>
            <clipPath id="pencil-crop" clipPathUnits="userSpaceOnUse">
              <path d="M-2-84H100V68H62L-2 31Z"/>
            </clipPath>
          </defs>
          <rect width="600" height="360" fill="#fffefa"/>
          <rect width="600" height="360" fill="url(#squares)"/>
          <g id="scene-direction" aria-hidden="true">
            <rect id="old-ruler" x="72" y="112" width="454" height="67" rx="3"
              fill="none" stroke="#9b7753" stroke-width="2" stroke-dasharray="7 5" visibility="hidden"/>
            <path d="M102 112H478" fill="none" stroke="#718d98" stroke-width="3" stroke-dasharray="4 7" stroke-linecap="round"/>
            <g id="ruler">
              <rect x="72" y="112" width="454" height="67" rx="3" fill="url(#ruler-color)" stroke="#8d5b18" stroke-width="2"/>
              <path id="ticks" fill="none" stroke="#8d5b18" stroke-width="1.6"/>
              <path d="M81 171H517" fill="none" stroke="#fff8de" stroke-width="2"/>
            </g>
            <circle cx="102" cy="112" r="4" fill="#4b6e7b"/>
            <circle cx="478" cy="112" r="4" fill="#4b6e7b"/>
            <path id="ink" fill="none" stroke="#164b73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <g id="holding-hand">
              <image href="media/construction-hands/left-hand.png" width="328" height="544" x="-31" y="-26"/>
            </g>
            <g id="pencil">
              <g id="pencil-art" clip-path="url(#pencil-crop)"></g>
            </g>
            <path id="force-arrow" d="M-23-48V-9M-32-19L-23-9L-14-19" fill="none" stroke="#8a359a"
              stroke-width="4" stroke-linecap="round" stroke-linejoin="round" visibility="hidden"/>
            <path id="turn-arrow" fill="none" stroke="#b14f25" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
              d="M286 52Q312 59 321 82M309 76L321 82L324 69" visibility="hidden"/>
            <g id="press-marks">
              <circle class="press-mark" cx="226" cy="139" r="11"/>
              <circle class="press-mark" id="second-mark" r="11"/>
            </g>
          </g>
        </svg>
        <figcaption>
          <span><i class="legend-dot" aria-hidden="true"></i><span id="grip-legend">おやゆび と なかゆび</span></span>
          <span id="force-legend"><i class="legend-arrow" aria-hidden="true">↓</i>じょうぎの ほうへ すこしだけ</span>
        </figcaption>
      </figure>
      <div class="controls">
        <button type="button" class="play" id="play">うごきを みる</button>
        <div class="timeline">
          <label for="time" class="sr-only">うごきの はやおくり・まきもどし</label>
          <input type="range" id="time" min="0" max="1000" value="0">
          <div class="timeline-labels" aria-hidden="true"><span>おさえる</span><span>ひく</span><span>ひきおわり</span></div>
        </div>
      </div>
      <div class="hand-settings" role="group" aria-label="えんぴつを もつ て">
        <span>えんぴつを もつ て</span>
        <button type="button" data-hand="right" aria-pressed="true">みぎ</button>
        <button type="button" data-hand="left" aria-pressed="false">ひだり</button>
      </div>
    </section>

    <aside class="guide" aria-labelledby="tip-title">
      <div class="tip">
        <div class="tip-top">
          <h2 id="tip-title">おさえかたの コツ</h2>
          <button type="button" id="read">よみあげ</button>
        </div>
        <div class="explanation" role="status" aria-atomic="true">
          <p id="explain-main"></p>
          <p id="explain-detail"></p>
        </div>
        <p class="hand-note" id="hand-note"></p>
        <p class="direction-note" id="direction-note"></p>
      </div>

      <section class="try" aria-labelledby="try-title">
        <h2 id="try-title">どっちが いいかな？</h2>
        <p>まっすぐな<ruby>線<rt>せん</rt></ruby>を ひくときは？</p>
        <div class="answers" role="group" aria-label="こたえを えらぶ">
          <button type="button" data-answer="one" aria-pressed="false">１かしょ</button>
          <button type="button" data-answer="two" aria-pressed="false">はなれた２かしょ</button>
        </div>
        <p id="feedback" role="status" aria-atomic="true"></p>
      </section>
    </aside>
  </main>
</body>
</html>
