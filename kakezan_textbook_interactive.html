<script>
const ONE='one',HOW='how',TOTAL='total';
let pageIndex=0,soundOn=false,pages=[];
const main=document.getElementById('main');
function jpCardinal(n){
  n=Number(n); if(!Number.isFinite(n))return String(n);
  const ones=['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
  if(n===0)return 'ゼロ'; if(n<10)return ones[n];
  if(n<20)return 'じゅう'+ones[n-10];
  if(n<100){const t=Math.floor(n/10),o=n%10;return ones[t]+'じゅう'+ones[o]}
  return String(n);
}
function counterReading(n,c){
  n=Number(n); const base=jpCardinal(n);
  const last=n%10;
  const small=(arr)=>n<=10?arr[n]:null;
  if(c==='人'){if(n===1)return'ひとり';if(n===2)return'ふたり';const a={4:'よにん',7:'ななにん'};if(n<10&&a[n])return a[n];if(n>=10&&last===4)return jpCardinal(n-last)+'よにん';return base+'にん'}
  if(c==='台')return base+'だい';
  if(c==='列')return base+'れつ';
  if(c==='段')return base+'だん';
  if(c==='倍')return base+'ばい';
  if(c==='両')return base+'りょう';
  if(c==='そう'||c==='艘'){const a=['','いっそう','にそう','さんそう','よんそう','ごそう','ろくそう','ななそう','はっそう','きゅうそう','じゅっそう'];return small(a)||base+'そう'}
  if(c==='個'||c==='こ'){const a=['','いっこ','にこ','さんこ','よんこ','ごこ','ろっこ','ななこ','はっこ','きゅうこ','じゅっこ'];if(n<=10)return a[n];if(last===1)return jpCardinal(n-1)+'いっこ';if(last===6)return jpCardinal(n-6)+'ろっこ';if(last===8)return jpCardinal(n-8)+'はっこ';return base+'こ'}
  if(c==='箱'||c==='はこ'){const a=['','ひとはこ','ふたはこ','さんばこ','よんはこ','ごはこ','ろっぱこ','ななはこ','はっぱこ','きゅうはこ','じゅっぱこ'];return small(a)||base+'はこ'}
  if(c==='皿'||c==='さら'){const a=['','ひとさら','ふたさら','さんさら','よんさら','ごさら','ろくさら','ななさら','はちさら','きゅうさら','じゅうさら'];return small(a)||base+'さら'}
  if(c==='本'){const a=['','いっぽん','にほん','さんぼん','よんほん','ごほん','ろっぽん','ななほん','はっぽん','きゅうほん','じゅっぽん'];return small(a)||base+'ほん'}
  if(c==='冊'){const a=['','いっさつ','にさつ','さんさつ','よんさつ','ごさつ','ろくさつ','ななさつ','はっさつ','きゅうさつ','じゅっさつ'];return small(a)||base+'さつ'}
  if(c==='枚'){const a=['','いちまい','にまい','さんまい','よんまい','ごまい','ろくまい','ななまい','はちまい','きゅうまい','じゅうまい'];return small(a)||base+'まい'}
  if(c==='つ'){const a=['','ひとつ','ふたつ','みっつ','よっつ','いつつ','むっつ','ななつ','やっつ','ここのつ','とお'];return small(a)||base+'こ'}
  if(c==='cm'||c==='㎝')return base+'センチメートル';
  if(c==='L'||c==='l'||c==='ℓ')return base+'リットル';
  return base+c;
}
function mathExprReading(a,b,ans){return jpCardinal(a)+' かける '+jpCardinal(b)+(ans!==undefined?' は '+jpCardinal(ans):'')}
function normalizeSpeechText(raw){
  let t=String(raw??'').replace(/[①②③④⑤⑥⑦⑧⑨]/g,m=>String('①②③④⑤⑥⑦⑧⑨'.indexOf(m)+1));
  t=t.replace(/(\d+)\s*[×＊*]\s*(\d+)\s*[＝=]\s*(\d+)/g,(_,a,b,c)=>mathExprReading(a,b,c));
  t=t.replace(/(\d+)\s*[×＊*]\s*(\d+)/g,(_,a,b)=>mathExprReading(a,b));
  const counters='cm|㎝|L|l|ℓ|人|台|列|段|倍|両|そう|艘|個|こ|箱|はこ|皿|さら|本|冊|枚|つ';
  t=t.replace(new RegExp('(\\d+)\\s*('+counters+')','g'),(_,n,c)=>counterReading(n,c));
  t=t.replace(/\b(\d+)\b/g,(_,n)=>jpCardinal(n));
  return t.replace(/→/g,'、').replace(/＝/g,' は ').replace(/\/+/g,'、');
}
function getJapaneseVoice(){const vs=speechSynthesis?.getVoices?.()||[];return vs.find(v=>/^ja(?:-|_)/i.test(v.lang))||vs.find(v=>/Japanese|日本/i.test(v.name))||null}
function speak(t){if(!soundOn||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(normalizeSpeechText(t));u.lang='ja-JP';const v=getJapaneseVoice();if(v)u.voice=v;u.rate=.88;u.pitch=1.0;speechSynthesis.speak(u)}
function speakDirect(t){const was=soundOn;soundOn=true;speak(t);soundOn=was}
let lastAutoSpoken='';
function speakLatestActiveFeedback(clicked){
  if(!soundOn||!clicked)return;
  if(clicked.closest('footer')||clicked.id==='soundBtn'||clicked.id==='restartBtn'||clicked.classList.contains('labSpeak'))return;
  const pg=clicked.closest('.page')||pages?.[pageIndex]; if(!pg)return;
  const lab=clicked.closest('.exampleLab');
  let text='';
  if(lab){const st=lab.querySelector('.labStatus'); if(st)text=st.textContent.trim();}
  else{
    const card=clicked.closest('.card')||pg;
    const candidates=[...card.querySelectorAll('.fb.show,.reveal.show,.questionFeedback.ok,.questionFeedback.try,.live,.growth,.caption')].filter(el=>el.offsetParent!==null&&el.textContent.trim());
    if(candidates.length)text=candidates[candidates.length-1].textContent.trim();
  }
  if(text&&text!==lastAutoSpoken){lastAutoSpoken=text;speak(text)}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setTimeout(()=>speakLatestActiveFeedback(b),170)});

function sceneWrap(kind,content){
 const a=SCENE_ASSETS[kind];
 if(!a)return `<div class="sceneHybrid" data-scene="${kind}"><div class="sceneFallback">${content}</div></div>`;
 return `<div class="sceneHybrid generatedScene" data-scene="${kind}" style="--scene-ratio:${a.ratio||'3 / 1'}"><img class="sceneBg" src="${a.src}" alt="${a.alt||''}"><div class="sceneFallback" aria-hidden="true">${content}</div></div>`;
}
function groupDots(n,visible=false){return `<div class="group${visible?' show':''}">${Array.from({length:n},()=>'<span class="dot"></span>').join('')}</div>`}
function groups(nGroups,nEach,visible=false){return `<div class="gridDots">${Array.from({length:nGroups},()=>groupDots(nEach,visible)).join('')}</div>`}
function person(x,y,shirt='shirtA',s=1){return `<g transform="translate(${x},${y}) scale(${s})" class="ink"><circle cx="0" cy="-20" r="14" class="skin"/><path d="M-15 -6h30v38h-30z" class="${shirt}"/><path d="M-10 32v26M10 32v26M-15 5l-16 17M15 5l16 17" fill="none"/></g>`}
function train3x5(focusCar=-1){let p='';for(let car=0;car<3;car++){const x=205+car*220;const dim=focusCar>=0&&car!==focusCar?' opacity=".28"':'';p+=`<g${dim}><rect x="${x}" y="98" width="205" height="105" rx="10" class="trainDark ink"/><rect x="${x+10}" y="110" width="185" height="65" rx="7" class="train ink"/>`;for(let i=0;i<5;i++)p+=person(x+28+i*39,112,['shirtA','shirtB','shirtC','shirtD','shirtE'][i%5],.72);p+='</g>';if(focusCar===car)p+=`<rect x="${x-5}" y="91" width="215" height="120" rx="15" fill="none" stroke="#11a85a" stroke-width="7"/>`}return svg(`<path d="M70 213H860" stroke="#777" stroke-width="5"/><path d="M70 235H860" stroke="#777" stroke-width="5"/>${Array.from({length:16},(_,i)=>`<path d="M${80+i*52} 210v33" stroke="#777" stroke-width="4"/>`).join('')}<rect x="70" y="85" width="128" height="118" rx="11" class="trainDark ink"/><path d="M82 102h65l31 40v61H82z" class="train ink"/><rect x="105" y="113" width="42" height="33" class="window ink"/>${p}<path d="M45 168h45l15 35H30z" class="trainDark ink"/>`,'0 0 900 270')}
function gondola4x3(focus=-1){let c=`<circle cx="450" cy="150" r="35" fill="#f0cf68" class="ink"/>`;const pos=[[450,65],[655,150],[450,235],[245,150]];for(let j=0;j<4;j++){const[x,y]=pos[j];const dim=focus>=0&&j!==focus?' opacity=".28"':'';c+=`<g${dim}><rect x="${x-92}" y="${y-42}" width="184" height="84" rx="42" class="pinkfill ink"/><path d="M${x-80} ${y-6}Q${x} ${y-72} ${x+80} ${y-6}" fill="#7bb9df" class="ink"/>`;for(let i=0;i<3;i++)c+=person(x-44+i*44,y-8,['shirtA','shirtB','shirtC'][i],.57);c+=`</g><path d="M450 150 L${x} ${y}" stroke="#dc776f" stroke-width="8"/>`;if(focus===j)c+=`<rect x="${x-99}" y="${y-49}" width="198" height="98" rx="49" fill="none" stroke="#11a85a" stroke-width="7"/>`}return svg(c,'0 0 900 300')}
function tape(segments){const w=180,x0=35,y=82,total=x0*2+w*segments;return svg(`${Array.from({length:segments},(_,i)=>`<rect x="${x0+i*w}" y="${y}" width="${w}" height="74" fill="#f3d7d2" class="ink"/><text x="${x0+i*w+w/2}" y="${y-18}" text-anchor="middle" font-size="24" font-weight="900">5cm</text>`).join('')}`,`0 0 ${total} 205`)}
function bottle(x,y,label='2L'){return `<g transform="translate(${x},${y})"><path d="M-22 -55h44v12l10 12v85q0 12 -11 16h-42q-11 -4 -11 -16v-75l10 -12z" fill="#78c89a" class="ink"/><rect x="-22" y="-27" width="44" height="28" fill="#f2f2e7" class="ink"/><text x="0" y="-6" text-anchor="middle" font-size="16" font-weight="800" fill="#4d6b4d">${label}</text></g>`}

function sameObjectPicture(object,each,groups){
 const W=760,H=220,gap=Math.min(145,620/Math.max(groups,1)),start=380-gap*(groups-1)/2;let c='';
 for(let g=0;g<groups;g++){const x=start+g*gap;c+=`<rect x="${x-55}" y="45" width="110" height="125" rx="18" fill="#f8fbfc" stroke="#9bcbdc" stroke-width="3"/>`;
  for(let i=0;i<each;i++){const col=i%3,row=Math.floor(i/3),ix=x+(col-1)*27,iy=78+row*36;
   if(object==='はし')c+=`<g transform="translate(${ix-12},${iy-16})"><rect x="0" y="0" width="8" height="45" rx="3" fill="#85c795"/><rect x="13" y="0" width="8" height="45" rx="3" fill="#7db7df"/></g>`;
   else if(object==='ボール')c+=`<circle cx="${ix}" cy="${iy}" r="12" fill="#76c3ec" stroke="#2e97c8" stroke-width="2"/>`;
   else if(object==='えんぴつ')c+=`<g transform="translate(${ix-4},${iy-18})"><rect x="0" y="0" width="9" height="38" rx="2" fill="#efb653"/><path d="M0 0L4.5 -9L9 0Z" fill="#7b4f34"/></g>`;
   else c+=`<circle cx="${ix}" cy="${iy}" r="12" fill="#efb653" stroke="#c9892e" stroke-width="2"/>`;
  }
  c+=`<text x="${x}" y="202" text-anchor="middle" font-size="17" font-weight="900">${g+1}</text>`;
 }
 return svg(c,`0 0 ${W} ${H}`)
}
