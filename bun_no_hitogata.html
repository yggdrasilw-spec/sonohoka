<style>
:root{color-scheme:light;--pink:#ff9ec4;--blue:#7dc8f5;--green:#319c4f}
*{box-sizing:border-box}

#pl{gap:5px}#pl button{min-width:44px;padding:5px 8px}

</style></head><body>
<div id="app"><h1>ぶんの ひとがた　〜しゅごと じゅつご〜</h1>
<nav><button class="tb" onclick="tab(0)">① ひとがたと ぶん</button><button class="tb" onclick="tab(1)">② しゅごと じゅつご</button><button class="tb" onclick="tab(2)">③ くわしく する ことば</button><button class="tb" onclick="tab(3)">④ じぶんで やってみよう</button><button id="sd" aria-pressed="true" onclick="sdt()">音 あり</button></nav>
<div class="wrap">

 <div id="head"><i class="acc" id="hat"></i><div class="face"><div class="v"><b><ruby>主語<rt>しゅご</rt></ruby></b><span>〜が</span><span>〜は</span></div></div><div class="neck"></div></div>

<div class="panel">
 <p>「なにが・だれが」と「どうする・どんなだ・なんだ」を、ひとがたで たしかめよう。ほけんしつで「足が いたい」と つたえるよ。</p>

</div>

<div class="panel">

</div>

<div class="panel">

 <div class="stage"><div class="sent" id="s3"></div></div>
 <div class="row"><button onclick="f3(0)">① しゅごと じゅつごに せん</button><button onclick="f3(1)">② くわしく する ことばを つける</button></div>
 <div class="m" id="m3"></div>
</div>
<div class="panel">
 <p class="practice-intro">ことばを わける → しゅご → じゅつご の じゅんに やろう。</p>
 <div class="problem-picker"><label for="kind">れんしゅう</label><select id="kind" onchange="setKind(this.value)"><option value="all">ぜんぶ</option><option value="0">どうする</option><option value="1">どんなだ</option><option value="2">なんだ</option></select><label for="problem">もんだい</label><select id="problem" onchange="r4(+this.value)"></select><button onclick="r4(qi)">はじめから</button><span id="progress" role="status"></span></div><div class="stage"><div class="sent" id="s4"></div><div id="q4"></div><svg id="maru" aria-hidden="true" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" pathLength="1"/></svg></div>
 <div class="row"><button onclick="h4()">ヒント</button><button id="ck4" onclick="f4()">わけかたを たしかめる</button><button onclick="next4()">つぎの もんだい →</button></div>
 <div class="m" id="m4"></div>
</div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const H=$('#head'),B=$('#body');
function st(h,b){H.className=h==1?'glow':h==0?'dim':'';B.className=b==1?'glow':b==0?'dim':''}
function tab(n){clearMaru();$$('.tb').forEach((e,i)=>(e.classList.toggle('a',i==n),e.setAttribute('aria-pressed',i==n)));$$('.panel').forEach((e,i)=>e.hidden=i!=n);
 $$('.acc').forEach(e=>e.classList.remove('s'));$$('#body [data-t]').forEach(e=>e.classList.remove('hl'));[()=>c1(),()=>r2(),()=>r3(),()=>r4()][n]();fit()}
/* ① */
const C=[['足が……。',1,0,'「足が……」だけだと、どうしたのか わからないね。'],['……いたい。',0,1,'「……いたい」だけだと、なにが いたいのか わからないね。'],['足が　いたい。',1,1,'「なにが」は「足が」、「どんなだ」は「いたい」。あたま（しゅご）と からだ（じゅつご）が そろうと、よく つたわるね。']];
function c1(i){if(i==null){st(2,2);$('#bub').textContent='足が　いたい。';$('#m1').textContent='ボタンを おして、つたわるか どうか たしかめよう。';return}
 const c=C[i];snd(i==2?'ok':'ng');$('#bub').textContent=c[0];st(c[1],c[2]);$('#m1').textContent=c[3]}
/* ② */
const T=['どうする','どんなだ','なんだ'],sh='しんかんせん';
const D=[['からす','が','','なく。',0],['せんせい','が','','しゃべる。',0],['ぼく','は','','しょうがくせいだ。',2],['いぬ','が','','ほえる。',0],['とり','が','','とぶ。',0],
[sh,'は','、','のりものだ。',2],[sh,'は','、','はやい。',1],[sh,'は','、','はしる。',0],[sh,'は','、','かっこいい。',1],[sh,'が','、','とまる。',0]];
let cur=0;
$('#pl').innerHTML=D.map((x,i)=>`<button class="pl" aria-label="ぶん ${i+1}" onclick="r2(${i})">${i+1}</button>`).join('');
function r2(i){if(i!=null)cur=i;const x=D[cur];
 $('#s2').innerHTML=`<span class="sentence-part"><span class="ln r" id="ss">${x[0]}<span class="pt">${x[1]}</span></span>${x[2]}</span><span class="ln b" id="sp">${x[3]}</span>`;
 st(2,2);$$('#body [data-t]').forEach(e=>e.classList.remove('hl'));
 $$('#pl .pl').forEach((e,j)=>{e.classList.toggle('a',j==cur);e.setAttribute('aria-pressed',j==cur)});$('#m2').textContent='ぶんを よく みて、ボタンを おしてみよう。'}

 const A=a.classList.contains('on'),P=b.classList.contains('on');
 $$('#body [data-t]').forEach(e=>e.classList.toggle('hl',P&&e.dataset.t==x[4]));st(A?1:2,P?1:2);
 $('#m2').textContent=(A?`「${x[0]+x[1]}」が しゅご。「${x[1]}」が てがかり。`:'')+(P?`「${x[3].replace('。','')}」は「${T[x[4]]}」。しゅごと つながるね。`:'')}
/* ③ */
const E=[[['赤い','g','hat'],['とりが','r'],['すばやく','g','watch'],['とぶ。','b']],[['ぼくは','r'],['かしこい','g','scarf'],['しょうがくせいだ。','b']]];
const EN=['「赤い」は「とり」を、「すばやく」は「とぶ」を くわしくしているよ。ぼうしと うでどけいを つけてみよう！','「かしこい」は「しょうがくせい」を くわしくしているよ。スカーフを つけてみよう！'];
let ec=0;
function r3(i){if(i!=null)ec=i;$$('.panel')[2].querySelectorAll('.pl').forEach((e,j)=>{e.classList.toggle('a',j==ec);e.setAttribute('aria-pressed',j==ec)});$('#s3').innerHTML=E[ec].map(p=>`<span class="ln ${p[1]}">${p[0]}</span>`).join('');
 $$('.acc').forEach(e=>e.classList.remove('s'));st(2,2);$('#m3').textContent='ぶんを えらんで、ボタンを おしてみよう。'}
function f3(k){snd('tap');if(!k){$$('#s3 .r,#s3 .b').forEach(e=>e.classList.add('on'));st(1,1);$('#m3').textContent='しゅごに あかい せん、じゅつごに あおい ２ほんせん。ここに「くわしくすることば」を たせるよ。'}
 else{f3(0);$$('#s3 .g').forEach(e=>e.classList.add('on'));E[ec].forEach(p=>p[2]&&$('#'+p[2]).classList.add('s'));$('#m3').textContent=EN[ec]}}
/* ④ : each item contains sentence, subject, predicate, type, modifier targets. */
const Q=[],seenQuestions=new Set();
function addQuestion(parts,subject,kind,targets={}){
 const line=parts.join('/');if(seenQuestions.has(line))return;
 seenQuestions.add(line);Q.push([line,subject,parts.length-1,kind,targets]);
}
addQuestion(['ぼくは','ごはんを','たべる。'],0,0,{1:2});
addQuestion(['ねこが','さかなを','たべた。'],0,0,{1:2});
addQuestion(['ともだちが','ほんを','よむ。'],0,0,{1:2});
addQuestion(['あかい','とりが','すばやく','とぶ。'],1,0,{0:1,2:3});
addQuestion(['ぼくは','やさしい','こどもだ。'],0,2,{1:2});
addQuestion(['せんせいが','こくごを','おしえる。'],0,0,{1:2});
addQuestion(['しんかんせんは','えきで','とまる。'],0,0,{1:2});
// Semantically compatible frames: do not cross arbitrary animals, foods and actions.
for(const subject of ['ぼくは','わたしは','おとうとは','いもうとは','ともだちは']){
 for(const object of ['ごはんを','パンを','おにぎりを','りんごを'])addQuestion([subject,object,'たべる。'],0,0,{1:2});
 for(const object of ['ほんを','えほんを','てがみを','ものがたりを'])addQuestion([subject,object,'よむ。'],0,0,{1:2});
}
for(const [subject,place,verb,adverb] of [
 ['いぬが','にわを','はしる。','はやく'],['ねこが','へやで','ねむる。','ぐっすり'],
 ['とりが','そらを','とぶ。','すばやく'],['かえるが','いけで','なく。','げんきに'],
 ['せんせいが','きょうしつで','はなす。','ゆっくり'],['ともだちが','こうえんで','あそぶ。','たのしく'],
 ['おとうとが','へやで','わらう。','にこにこ'],['しんかんせんが','えきで','とまる。','ゆっくり'],
 ['あめが','まちに','ふる。','しとしと'],['かぜが','やまで','ふく。','つよく']]){
 addQuestion([subject,verb],0,0);addQuestion([subject,place,verb],0,0,{1:2});
 addQuestion([subject,adverb,verb],0,0,{1:2});addQuestion([subject,place,adverb,verb],0,0,{1:3,2:3});
}
for(const [subject,predicate] of [
 ['そらは','あおい。'],['うみは','ひろい。'],['やまは','たかい。'],['みずは','つめたい。'],['おちゃは','あつい。'],
 ['りんごは','あかい。'],['いちごは','あまい。'],['レモンは','すっぱい。'],['ぞうは','おおきい。'],['ありは','ちいさい。'],
 ['しんかんせんは','はやい。'],['うさぎは','かわいい。'],['きょうしつは','あかるい。'],['こおりは','かたい。'],['まくらは','やわらかい。']]){
 addQuestion([subject,predicate],0,1);addQuestion([subject,'とても',predicate],0,1,{1:2});
 addQuestion(['この',subject,predicate],1,1,{0:1});addQuestion(['この',subject,'とても',predicate],1,1,{0:1,2:3});
}
for(const [subject,predicate,modifiers] of [
 ['ぼくは','しょうがくせいだ。',['げんきな','やさしい','かしこい']],['わたしは','しょうがくせいだ。',['げんきな','やさしい','かしこい']],
 ['おとうとは','こどもだ。',['げんきな','やさしい','かしこい']],['いもうとは','こどもだ。',['げんきな','やさしい','かしこい']],
 ['おとうさんは','せんせいだ。',['げんきな','やさしい','かしこい']],['チューリップは','はなだ。',['きれいな','かわいい','あかい']],

let qi=0,ph=0,cuts=new Set(),CH=[],practiceKind='all';
const completed=new Set(),cl=x=>x.replace(/。$/,'').replace(/[がは]$/,'');
function activeQuestions(){return Q.map((q,i)=>i).filter(i=>practiceKind==='all'||Q[i][3]===+practiceKind)}
function refreshPicker(){const ids=activeQuestions();$('#problem').innerHTML=ids.map((id,n)=>`<option value="${id}">${n+1} / ${ids.length}</option>`).join('');$('#problem').value=qi;$('#progress').textContent=`できた ${ids.filter(i=>completed.has(i)).length} もん`}
function setKind(value){practiceKind=value;const ids=activeQuestions();r4(ids.find(i=>!completed.has(i))??ids[0])}
function next4(){const ids=activeQuestions(),pos=ids.indexOf(qi);for(let n=1;n<=ids.length;n++){const id=ids[(pos+n)%ids.length];if(!completed.has(id))return r4(id)}r4(ids[(pos+1)%ids.length])}
function clearMaru(){clearTimeout(maruTimer);$('#maru').classList.remove('go')}
function r4(i){if(i!=null)qi=(i+Q.length)%Q.length;refreshPicker();clearMaru();CH=Q[qi][0].split('/');ph=0;cuts=new Set();st(2,2);draw4();
 $$('#body [data-t]').forEach(e=>e.classList.remove('hl'));
 $('#m4').textContent='「ね」と いえる ところを ／ で わけよう。「。」の まえにも ひこう。もういちど おすと けせるよ。'}
function draw4(){const chars=[...CH.join('')],h=[];
 if(!ph)chars.forEach((c,i)=>h.push(`<span class="unit"><span class="glyph">${c}</span>${i<chars.length-1?`<button type="button" class="gp${cuts.has(i)?' on':''}" aria-label="${i+1}もじめ「${c}」の あとで わける" aria-pressed="${cuts.has(i)}" onclick="tg(${i})">${cuts.has(i)?'／':'·'}</button>`:''}</span>`));
 else CH.forEach((c,i)=>h.push(`<span class="chunk"><button type="button" class="ck" onclick="pk(${i})">${c.replace('。','')}</button><small>ね</small>${c.endsWith('。')?'<span>。</span>':''}</span>`));
 $('#s4').innerHTML=h.join('');q4();$('#ck4').disabled=ph>0;$('#ck4').hidden=ph>0;
}
const QT=[['「ね」と','いえる ところで','わけよう'],['どこが','しゅご？'],['どこが','じゅつご？'],['せいかい！','よく できました']];
function q4(){const e=$('#q4');e.dataset.p=ph;e.innerHTML=QT[ph].map(t=>`<div>${t}</div>`).join('')}
function tg(i){if(ph)return;cuts.has(i)?cuts.delete(i):cuts.add(i);snd('tap');const e=$$('#s4 .gp')[i];e.classList.toggle('on',cuts.has(i));e.setAttribute('aria-pressed',cuts.has(i));e.textContent=cuts.has(i)?'／':'·';$('#m4').textContent='わけたら「わけかたを たしかめる」を おそう。／ は おしなおすと けせるよ。'}
function h4(){$('#m4').textContent=[`ヒント：「${CH[0]}ね」と いえるね。「。」の まえにも ひこう。`,'ヒント：「が」「は」が てがかり。「なにが・だれが」に あたる ことばだよ。','ヒント：「どうする・どんなだ・なんだ」に あてはまる ことばを さがそう。','もう できているよ。「つぎの もんだい」で つづけよう。'][ph]}
function f4(){if(ph)return;const ok=new Set();let a=-1;CH.forEach((c,i)=>{a+=c.length;ok.add(i===CH.length-1?a-1:a)});
 const ex=[...cuts].filter(i=>!ok.has(i)),ms=[...ok].filter(i=>!cuts.has(i)),m=$('#m4');
 if(ex.length)return snd('ng'),m.textContent='ことばの とちゅうに ／ が あるよ。「ね」と いえる ところを さがそう。';
 if(ms.length)return snd('ng'),m.textContent=ms.length===1&&ms[0]===Math.max(...ok)?'「。」の まえにも「ね」と いえるね。そこにも ／ を ひこう。':'まだ わけられる ところが あるよ。「ね」を つけて たしかめよう。';
 ph=1;draw4();$('#s4 .ck').focus();snd('ok');maru();m.textContent='ぴったり！ つぎは しゅご。「なにが・だれが」に あたる かたまりを えらぼう。'}
function pk(i){if(ph<1||ph>2)return;const q=Q[qi],c=CH[i].replace('。',''),e=$$('#s4 .ck')[i],m=$('#m4');
 const answer=ph===1?q[1]:q[2];if(i!==answer){snd('ng');
  if(ph===1)m.textContent=i===q[2]?`「${c}」は「${T[q[3]]}」だね。しゅごは「なにが・だれが」に あたるよ。`:`「${c}」は くわしくする ことばだよ。「が」「は」を てがかりに しよう。`;
  else m.textContent=i===q[1]?`「${c}」は しゅごだよ。じゅつごは「どうする・どんなだ・なんだ」を あらわすよ。`:`「${c}」は「${cl(CH[q[4][i]??q[2]])}」を くわしくする ことばだよ。`;
  return;
 }
 if(ph===1){e.classList.add('r','on');st(1,2);ph=2;q4();snd('ok');maru();m.textContent=`せいかい！「${c}」が しゅご。つぎは、しゅごと つながる じゅつごを えらぼう。`}
 else{e.classList.add('b','on');st(1,1);ph=3;q4();snd('fan');maru();completed.add(qi);refreshPicker();
  $$('#body [data-t]').forEach(e=>e.classList.toggle('hl',+e.dataset.t===q[3]));
  $$('#s4 .ck').forEach((x,j)=>j!==q[1]&&j!==q[2]&&x.classList.add('g','on'));
  m.textContent=`せいかい！「${c}」が じゅつご。「${T[q[3]]}」の なかまだね。`+(CH.length>2?'みどりは くわしくする ことばだよ。':'あたまと からだが そろったね。');
 }
}
/* sound */
let AC,snOn=1;
function tone(f,t,d,ty,v){const c=AC,o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.2,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.05)}
function snd(k){if(!snOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
 if(k=='tap')tone(660,0,.08,'triangle',.15);
 else if(k=='ok'){tone(988,0,.16);tone(784,.16,.5)}
 else if(k=='ng'){tone(220,0,.25,'sawtooth',.1);tone(170,.2,.35,'sawtooth',.1)}
 else if(k=='fan')[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.4,'triangle',.18))}catch(e){}}
