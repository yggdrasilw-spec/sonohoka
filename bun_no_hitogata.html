   m.textContent=`せいかい！「${c.replace('。','')}」が じゅつご。みどりの かたまりは「くわしく する ことば」。`+(CH.some(x=>/を$/.test(x))?'「〜を」も そのなかまで、「なにを たべる」のように、うごきを くわしくするよ。':'')}

/* sound */
let AC,snOn=1;
function tone(f,t,d,ty,v){const c=AC,o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.2,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.05)}
