<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つなぎ言葉であそぼう</title>
<style>
:root{--bg:#eaf3e6;--paper:#fff;--ink:#24312a;--green:#2f7d4f;--green-d:#1f5c38;--leaf:#cfe6d0;--orange:#e8833a;--red:#c0392b;--ok:#dff3e3;--ng:#fbe3df;--line:#b9d3bd}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","UD デジタル 教科書体 N-R","Hiragino Sans","Meiryo",sans-serif;font-size:20px;line-height:1.7}
#app{max-width:860px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:30px;margin:8px 0 4px;color:var(--green-d)}
.sub{margin:0 0 20px;color:#4b5f52;font-size:18px}
.menu{display:grid;gap:12px}
.mbtn{display:block;width:100%;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:14px 18px;font:inherit;color:inherit;cursor:pointer}
.mbtn:hover,.mbtn:focus-visible{border-color:var(--green);outline:none}
.mbtn b{display:block;font-size:22px;color:var(--green-d)}
.mbtn span{font-size:17px;color:#4b5f52}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.bar{height:10px;background:var(--leaf);border-radius:6px;overflow:hidden;flex:1;margin:0 14px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.link{background:none;border:0;font:inherit;color:var(--green-d);text-decoration:underline;cursor:pointer;padding:4px}
.card{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.q{font-size:21px;font-weight:bold;margin:0 0 10px;color:var(--green-d)}
.box{border:3px solid var(--green);border-radius:10px;padding:12px 16px;font-size:24px;line-height:1.9;background:#fbfffb}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--orange);text-align:center;color:var(--orange)}
.hint{font-size:17px;color:#4b5f52;margin:10px 0 0}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:22px;color:inherit;cursor:pointer}
.opt .ck{flex:none;width:28px;height:28px;margin-top:5px;border:3px solid var(--green);border-radius:7px;background:#fff;display:grid;place-items:center;font-size:20px;line-height:1;color:#fff}
.opt.sel{border-color:var(--green);background:#f1f9f2}
.opt.sel .ck{background:var(--green)}
.opt.sel .ck::after{content:"✓"}
.opt:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.opt.ok{background:var(--ok);border-color:var(--green)}
.opt.ng{background:var(--ng);border-color:var(--red)}
.opt .note{display:block;font-size:16px;color:#4b5f52;margin-top:2px}
.opt .mk{font-weight:bold;margin-right:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn{font:inherit;font-size:22px;font-weight:bold;background:var(--green);color:#fff;border:0;border-radius:14px;padding:12px 28px;cursor:pointer;min-height:52px}
.btn:disabled{background:#9db8a5;cursor:not-allowed}
.btn.sub2{background:#fff;color:var(--green-d);border:3px solid var(--green)}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.fb{border-radius:14px;padding:12px 16px;margin-top:14px;font-size:19px}
.fb.good{background:var(--ok)}.fb.bad{background:#fff3e0}
.fb h3{margin:0 0 4px;font-size:22px}
.point{border:3px solid var(--orange);border-radius:12px;padding:10px 14px;margin-top:10px;background:#fffaf2;font-size:18px}
.scene{margin-top:14px;border:3px solid #d8e6da;border-radius:16px;background:#f8fbf8;overflow:hidden}
.scene-img{display:none;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#eef5ef}.scene-img.ready{display:block}
.scene-fallback{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;padding:14px}
.scene-card{min-width:0;border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.scene-card small{display:block;color:#607168;font-size:14px;font-weight:bold;margin-bottom:3px}
.scene-card b{font-size:19px;line-height:1.5}
.scene-mid{display:grid;place-items:center;min-width:82px;text-align:center;font-weight:bold;color:var(--green-d)}
.scene-mid .sym{font-size:36px;line-height:1.1;display:block}
.scene-mid .lab{font-size:14px;line-height:1.3;display:block;max-width:86px}
.thinkbox{margin-top:14px;border:3px solid #8eb99a;border-radius:16px;background:#f6fbf7;padding:14px 16px}
.thinkbox h3{margin:0 0 8px;font-size:21px;color:var(--green-d)}
.thinkstep{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:start;margin:8px 0}
.thinkstep .num{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:bold}
.thinkstep p{margin:0;font-size:18px}
.predict{border-left:6px solid var(--orange);background:#fffaf2;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:19px}
.reaction{font-size:22px;font-weight:bold;text-align:center;background:#fff3e0;border-radius:12px;padding:9px 12px;margin-top:10px}
.relation-badge{display:inline-block;background:var(--green-d);color:#fff;border-radius:999px;padding:3px 12px;font-size:17px;font-weight:bold;margin-bottom:5px}
.hintpanel{margin-top:12px;border:3px dashed #e0a461;border-radius:14px;background:#fffaf2;padding:12px 14px}
.hintpanel p{margin:0;font-size:18px}
.retry-note{font-weight:bold;color:var(--green-d);margin-top:8px}
.row.split-actions{justify-content:space-between;align-items:center}
.big{font-size:56px;font-weight:bold;color:var(--green-d);margin:0}
#set{max-width:860px;margin:0 auto;padding:12px 16px 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.tg{font:inherit;font-size:16px;font-weight:bold;border:3px solid var(--line);background:#fff;color:#7a8a80;border-radius:999px;padding:4px 14px;cursor:pointer;min-height:40px}
.tg.on{border-color:var(--green);background:var(--leaf);color:var(--green-d)}
.tg:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn.small{font-size:18px;padding:6px 16px;min-height:42px}
@media(max-width:560px){body{font-size:18px}.box{font-size:21px}.opt{font-size:20px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="set"></div>
<div id="app"></div>
<script>
// ===== データ =====
const REL={
  cause:{name:'りゆう → けっか（順接）',
    exp:'前の文が、後ろの文の「理由・原因」になっているよ。前の文から思いつく内容につながるので、順接というよ。',
    join:[{t:'ので',n:'前の内容が理由になるときに使うよ'},{t:'から',n:'前の内容が理由になるときに使うよ'},{t:'ため',n:'前の内容が原因になるときに使うよ'}],
    sent:[{t:'そのため',n:'前の文が理由になるときに使うよ'},{t:'だから',n:'前の文が理由になるときに使うよ'},{t:'それで',n:'前の文が理由になるときに使うよ'}]},
  contrast:{name:'はんたいの内容（逆接）',
    exp:'前の文から思いつく内容と、反対のことが後ろの文に来ているよ。こういうつなぎ方を逆接というよ。',
    join:[{t:'けれど',n:'反対の内容をつなぐ言葉だよ'},{t:'けれども',n:'反対の内容をつなぐ言葉だよ'},{t:'が',n:'反対の内容をつなぐ言葉だよ'},{t:'のに',n:'思ったことと反対になるときに使うよ'}],
    sent:[{t:'しかし',n:'反対の内容が来るときに使うよ'},{t:'でも',n:'反対の内容が来るときに使うよ'},{t:'けれども',n:'反対の内容が来るときに使うよ'},{t:'ところが',n:'思いがけない反対の内容が来るときに使うよ'}]},
  add:{name:'ならべる・つけたす',
    exp:'同じようなことをならべたり、あとからつけたしたりしているよ。',
    join:[{t:'し',n:'同じようなことをならべるときに使うよ'},{t:'うえに',n:'つけたすときに使うよ'},{t:'だけでなく',n:'つけたすときに使うよ'}],
    sent:[{t:'そして',n:'ならべるときに使うよ'},{t:'それに',n:'つけたすときに使うよ'},{t:'そのうえ',n:'つけたすときに使うよ'},{t:'また',n:'ならべるときに使うよ'}]}
};
// 問題ごとに「前文からの自然な予想」と「実際の後文」を持たせる。
// img は今後生成する横長挿絵の受け皿。画像がまだ無い場合はHTMLの場面カードを表示する。
const ITEMS=[
 {id:'cause_rain_hike',rel:'cause',s1:'昨日は雨がふった',s2:'登山は中止になった',expect:'雨がふると、外の登山はむずかしくなりそう',actual:'登山は中止になった',clue:'雨が、登山を中止する理由になっている',reaction:'「雨だったから中止なんだ」と、わけが分かるね'},
 {id:'cause_oversleep_late',rel:'cause',s1:'朝ねぼうをした',s2:'学校におくれた',expect:'ねぼうすると、家を出る時こくがおそくなりそう',actual:'学校におくれた',clue:'ねぼうが、学校におくれた理由になっている',reaction:'「ねぼうしたから、おくれたんだ」とつながるね'},
 {id:'cause_late_sleepy',rel:'cause',s1:'夕べおそくまでおきていた',s2:'今日はとてもねむかった',expect:'ねる時間がおそいと、次の日はねむくなりそう',actual:'今日はとてもねむかった',clue:'おそくまでおきていたことが、ねむい理由になっている',reaction:'前の出来事が、後ろの出来事のわけになっているね'},
 {id:'cause_practice_kickover',rel:'cause',s1:'毎日れんしゅうした',s2:'さか上がりができるようになった',expect:'毎日れんしゅうすると、前より上手になりそう',actual:'さか上がりができるようになった',clue:'れんしゅうしたことが、できるようになった理由になっている',reaction:'努力したことと、できた結果がつながっているね'},
 {id:'cause_wind_laundry',rel:'cause',s1:'風がとても強かった',s2:'せんたくものがとばされた',expect:'風が強いと、外の物がとばされそう',actual:'せんたくものがとばされた',clue:'強い風が、せんたくものがとんだ原因になっている',reaction:'「風が強かったから」と考えると自然だね'},
 {id:'cause_homework_warning',rel:'cause',s1:'しゅくだいをわすれた',s2:'先生に注意された',expect:'しゅくだいをわすれると、先生から何か言われそう',actual:'先生に注意された',clue:'しゅくだいをわすれたことが、注意された理由になっている',reaction:'前のことが、後ろのことの理由だね'},
 {id:'cause_lunch_full',rel:'cause',s1:'給食をたくさん食べた',s2:'おなかがいっぱいになった',expect:'たくさん食べると、おなかがいっぱいになりそう',actual:'おなかがいっぱいになった',clue:'たくさん食べたことが、いっぱいになった理由になっている',reaction:'予想どおりの結果につながっているね'},
 {id:'cause_quake_train',rel:'cause',s1:'大きな地しんがあった',s2:'電車が止まった',expect:'大きな地しんがあると、安全のため電車が止まりそう',actual:'電車が止まった',clue:'地しんが、電車が止まった原因になっている',reaction:'原因と結果の関係がはっきりしているね'},
 {id:'cause_no_water_flower',rel:'cause',s1:'水やりをわすれた',s2:'花がかれた',expect:'水をあげないと、花が元気をなくしそう',actual:'花がかれた',clue:'水やりをしなかったことが、花がかれた理由になっている',reaction:'前のことから、後ろの結果が自然に考えられるね'},
 {id:'cause_lost_late',rel:'cause',s1:'道にまよった',s2:'やくそくの時間におくれた',expect:'道にまようと、着くまでに時間がかかりそう',actual:'やくそくの時間におくれた',clue:'道にまよったことが、おくれた理由になっている',reaction:'「だから、おくれたんだ」とつながるね'},
 {id:'contrast_rain_sports',rel:'contrast',s1:'朝から雨がふった',s2:'運動会は行われた',expect:'雨なら、運動会は中止やえんきになりそう',actual:'でも、運動会は行われた',clue:'前の文から予想したことと、ちがうことが起きている',reaction:'えっ、雨なのにやったの？　意外だね！'},
 {id:'contrast_run_notfirst',rel:'contrast',s1:'一生けんめい走った',s2:'一番にはなれなかった',expect:'一生けんめい走ったなら、一番になれそう・よい結果になりそう',actual:'でも、一番にはなれなかった',clue:'がんばったことから思う結果と、実際の結果がちがう',reaction:'がんばったのに、思った結果にはならなかったんだね'},
 {id:'contrast_sleep_sleepy',rel:'contrast',s1:'昨日はたくさんねた',s2:'今日もねむかった',expect:'たくさんねたなら、今日はすっきりしていそう',actual:'でも、今日もねむかった',clue:'「よくねた→ねむくない」という予想と反対になっている',reaction:'たくさんねたのに？　ちょっと意外だね！'},
 {id:'contrast_early_late',rel:'contrast',s1:'家を早く出た',s2:'学校に間に合わなかった',expect:'早く家を出たら、学校に間に合いそう',actual:'でも、学校に間に合わなかった',clue:'「早く出た→間に合う」という予想とちがう',reaction:'早く出たのに間に合わない。これは「意外！」だね'},
 {id:'contrast_expensive_popular',rel:'contrast',s1:'その店はねだんが高かった',s2:'とても人気があった',expect:'ねだんが高いと、買う人は少なくなりそう',actual:'でも、とても人気があった',clue:'高いから人気がないだろうという予想とちがう',reaction:'高いのに人気なんだ。予想とちがって意外だね！'},
 {id:'contrast_wakeup_oversleep',rel:'contrast',s1:'早くおきようと思った',s2:'ついねぼうしてしまった',expect:'早くおきようと決めたなら、早くおきそう',actual:'でも、ついねぼうしてしまった',clue:'思っていたことと、実際にしたことが反対になっている',reaction:'「そうするつもり」だったのに、ちがう結果になったね'},
 {id:'contrast_practice_fail',rel:'contrast',s1:'何度もれんしゅうした',s2:'うまくできなかった',expect:'何度もれんしゅうしたなら、うまくできそう',actual:'でも、うまくできなかった',clue:'れんしゅうから予想する結果と、実際の結果がちがう',reaction:'何度もやったのに、まだできなかった。意外なつながりだね'},
 {id:'contrast_cloud_no_rain',rel:'contrast',s1:'空はくもっていた',s2:'雨はふらなかった',expect:'空がくもっていると、雨がふりそう',actual:'でも、雨はふらなかった',clue:'「くもり→雨がふりそう」という予想とちがう',reaction:'ふりそうだったのに、ふらなかったんだね'},
 {id:'contrast_hard_interesting',rel:'contrast',s1:'この本はむずかしかった',s2:'とてもおもしろかった',expect:'むずかしい本なら、読みづらくて楽しみにくそう',actual:'でも、とてもおもしろかった',clue:'むずかしさから思う印象と、実際の感想がちがう',reaction:'むずかしいのに、おもしろかったんだね！'},
 {id:'contrast_little_brother',rel:'contrast',s1:'弟はまだ小さかった',s2:'重い荷物を持ってくれた',expect:'まだ小さいなら、重い荷物を持つのはむずかしそう',actual:'でも、重い荷物を持ってくれた',clue:'小さいからむずかしいだろうという予想とちがう',reaction:'小さいのに持てたんだ。意外で、うれしいね'},
 {id:'add_park_playground',rel:'add',s1:'この公園は広かった',s2:'遊具もたくさんあった',expect:'公園について「広い」というよさを一つ伝えている',actual:'さらに、遊具がたくさんあるという情報も伝えている',clue:'後ろの文が、同じ公園について情報をもう一つ足している',reaction:'「広い」だけでなく、「遊具も多い」と情報がふえたね'},
 {id:'add_mother_skills',rel:'add',s1:'母は料理がじょうずだった',s2:'歌もじょうずだった',expect:'母のよいところを一つ伝えている',actual:'さらに、歌もじょうずだと伝えている',clue:'同じ人について、同じ向きの情報をつけ足している',reaction:'よいところが、もう一つ増えたね'},
 {id:'add_classroom',rel:'add',s1:'教室はあたたかかった',s2:'明るかった',expect:'教室のようすを一つ説明している',actual:'さらに、明るいというようすも説明している',clue:'同じ教室のようすを、もう一つならべている',reaction:'「あたたかい」＋「明るい」。情報を足しているね'},
 {id:'add_lunch',rel:'add',s1:'今日の給食はおいしかった',s2:'量もちょうどよかった',expect:'給食のよかったところを一つ伝えている',actual:'さらに、量もちょうどよかったと伝えている',clue:'給食について、よい点をもう一つつけ足している',reaction:'「おいしい」だけでなく「量もちょうどよい」んだね'},
 {id:'add_brother',rel:'add',s1:'兄はやさしかった',s2:'勉強も教えてくれた',expect:'兄のよいところを一つ伝えている',actual:'さらに、勉強を教えてくれたことも伝えている',clue:'兄についての情報を、後ろでもう一つ足している',reaction:'やさしいし、勉強も教えてくれる。情報が増えたね'},
 {id:'add_park_library',rel:'add',s1:'公園で友だちと遊んだ',s2:'図書館で本もかりた',expect:'その日にしたことを一つ伝えている',actual:'さらに、別にしたことも伝えている',clue:'したことを二つならべている',reaction:'一つ目の出来事に、もう一つ出来事を足しているね'},
 {id:'add_town_sea_mountain',rel:'add',s1:'この町は海が近かった',s2:'山も近かった',expect:'町の特ちょうを一つ伝えている',actual:'さらに、山も近いという特ちょうを伝えている',clue:'同じ町の特ちょうを、もう一つつけ足している',reaction:'海だけでなく山も近い。情報がもう一つ増えたね'},
 {id:'add_summer',rel:'add',s1:'夏休みは海に行った',s2:'お祭りにも行った',expect:'夏休みにしたことを一つ伝えている',actual:'さらに、お祭りに行ったことも伝えている',clue:'夏休みにしたことを二つならべている',reaction:'海に行った。それに、お祭りにも行ったんだね'}
].map(x=>({...x,img:`img/${x.id}.webp`}));
const MODES={
  join:{label:'2つの文を、1つにつなげよう',desc:'2つの文をつなぐ、正しい言い方をえらぶよ'},
  split:{label:'1つの文を、2つにわけよう',desc:'同じ意味になる、2つの文をえらぶよ'},
  fill:{label:'つなぎ言葉をえらぼう',desc:'（　）に入る言葉をえらぶよ'},
  mix:{label:'ぜんぶまぜて10問',desc:'3つのタイプがまざって出るよ'}
};
const N=10;

// ===== ユーティリティ =====
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const joinS=(a,c,b)=>a+c+'、'+b+'。';
const splitS=(a,c,b)=>a+'。'+c+'、'+b+'。';

// ===== 問題生成 =====
function makeProblem(mode,it){
  const {rel,s1,s2}=it;
  const kind=mode==='split'?'sent':mode==='join'?'join':'sent';
  const build=mode==='join'?joinS:splitS;
  const nOk=1+rnd(2);
  const oks=shuffle(REL[rel][kind]).slice(0,nOk).map(c=>({text:mode==='fill'?c.t:build(s1,c.t,s2),ok:true,note:'「'+c.t+'」：'+c.n}));
  const wrongs=[];
  if(rel==='cause'&&mode!=='fill'){
    const c=shuffle(REL.cause[kind])[0];
    wrongs.push({text:build(s2,c.t,s1),ok:false,note:'文の順番がぎゃくだよ。理由と結果が入れかわってしまうね'});
  }
  const others=shuffle(Object.keys(REL).filter(r=>r!==rel));
  const pool=[];
  others.forEach(r=>{const c=shuffle(REL[r][kind]).find(c=>!REL[rel][kind].some(x=>x.t===c.t));if(c)pool.push([c,r])});
  others.forEach(r=>shuffle(REL[r][kind]).forEach(c=>{if(!REL[rel][kind].some(x=>x.t===c.t)&&!pool.some(p=>p[0].t===c.t))pool.push([c,r])}));
  for(const [c,r] of pool){
    if(wrongs.length>=4-nOk)break;
    wrongs.push({text:mode==='fill'?c.t:build(s1,c.t,s2),ok:false,note:'「'+c.t+'」：'+c.n+'。この2つの文には合わないよ'});
  }
  let shown;
  if(mode==='join')shown=`${s1}。<br>${s2}。`;
  else if(mode==='split'){const c=shuffle(REL[rel].join)[0];shown=joinS(s1,c.t,s2)}
  else shown=`${s1}。<br><span class="blank">　</span>、${s2}。`;
  const say=mode==='join'?`${s1}。 ${s2}。`:mode==='split'?shown:`${s1}。 なにが入るかな。 ${s2}。`;
  return{mode,rel,shown,say,opts:shuffle(oks.concat(wrongs)),nOk,item:it,hintLevel:0,attempts:0};
}
function makeRound(mode){
  return shuffle(ITEMS).slice(0,N).map((it,i)=>{
    const m=mode==='mix'?['join','split','fill'][i%3]:mode;
    return makeProblem(m,it);
  }).sort(()=>Math.random()-.5);
}

// ===== 効果音・読み上げ =====
const PREF={se:true,voice:true};
try{const s=JSON.parse(localStorage.getItem('setsuzoku_pref')||'null');if(s){PREF.se=s.se!==false;PREF.voice=s.voice!==false}}catch(e){}
const savePref=()=>{try{localStorage.setItem('setsuzoku_pref',JSON.stringify(PREF))}catch(e){}};
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,v){
  const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v||.18,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);
  o.start(t);o.stop(t+d+.05);
}
const SE={
  tap(){tone(660,0,.08,'triangle',.12)},
  next(){tone(784,0,.07,'triangle',.1);tone(988,.07,.1,'triangle',.1)},
  ok(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{tone(f,i*.1,.35,'triangle',.2);tone(f*2,i*.1,.25,'sine',.05)})},
  ng(){tone(392,0,.22,'sine',.18);tone(311.13,.2,.4,'sine',.18)},
  fan(){[523.25,659.25,783.99,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.13,.4,'triangle',.2));tone(1318.5,.85,.7,'triangle',.18)}
};
const se=n=>{if(PREF.se)try{SE[n]()}catch(e){}};

const yomi=t=>{for(const [a,b] of YOMI)t=t.split(a).join(b);return t};
const NK=['ぜろ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう','じゅう'];
let JV=null,TM=null;
function pickVoice(){try{JV=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=pickVoice;
function stopSay(){clearTimeout(TM);try{speechSynthesis.cancel()}catch(e){}}
function speak(text){
  stopSay();
  if(!PREF.voice||!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(yomi(text));
  u.lang='ja-JP';u.rate=.9;
  if(!JV)pickVoice();
  if(JV)u.voice=JV;
  speechSynthesis.speak(u);
}
function speakLater(text,ms){stopSay();TM=setTimeout(()=>speak(text),ms)}
function renderSet(){
  const el=document.getElementById('set');
  el.innerHTML=`<button class="tg ${PREF.se?'on':''}" id="tse" aria-pressed="${PREF.se}">🔊 こうかおん ${PREF.se?'ON':'OFF'}</button><button class="tg ${PREF.voice?'on':''}" id="tvo" aria-pressed="${PREF.voice}">🗣 よみあげ ${PREF.voice?'ON':'OFF'}</button>`;
  document.getElementById('tse').onclick=()=>{PREF.se=!PREF.se;savePref();renderSet();if(PREF.se)SE.tap()};
  document.getElementById('tvo').onclick=()=>{PREF.voice=!PREF.voice;savePref();renderSet();if(PREF.voice)speak('よみあげを オンに しました');else stopSay()};
  const r=document.getElementById('rd');if(r)r.style.display=PREF.voice?'':'none';
}

// ===== 考え方ヒント・視覚化 =====
const REL_VIEW={
  cause:{symbol:'→',short:'だから、そうなった',kid:'りゆう → けっか',badge:'順接'},
  contrast:{symbol:'↯',short:'あれ？ 予想とちがう',kid:'予想 ↯ ちがう結果',badge:'逆接'},
  add:{symbol:'＋',short:'それに、もう一つ',kid:'情報 ＋ 情報',badge:'つけたし'}
};
function sceneFallback(p,showLabel=false){
  const it=p.item,v=REL_VIEW[p.rel];
  return `<div class="scene-fallback">
    <div class="scene-card"><small>前の文</small><b>${esc(it.s1)}</b></div>
    <div class="scene-mid"><span class="sym">${v.symbol}</span><span class="lab">${showLabel?esc(v.short):'どう つながる？'}</span></div>
    <div class="scene-card"><small>後ろの文</small><b>${esc(it.s2)}</b></div>
  </div>`;
}
function sceneHTML(p,showLabel=false){
  const it=p.item;
  return `<div class="scene" aria-label="文の内容を絵で考えるところ">
    <img class="scene-img" src="${esc(it.img)}" alt="${esc(it.s1+'。'+it.s2+'。')}" hidden>
    <div class="scene-fb">${sceneFallback(p,showLabel)}</div>
  </div>`;
}
function wireSceneImage(root=document){
  root.querySelectorAll('.scene').forEach(scene=>{
    const img=scene.querySelector('.scene-img'),fb=scene.querySelector('.scene-fb');
    if(!img)return;
    img.onload=()=>{img.hidden=false;img.classList.add('ready');if(fb)fb.hidden=true};
    img.onerror=()=>{img.hidden=true;img.classList.remove('ready');if(fb)fb.hidden=false};
  });
}
function hintText(p,level){
  const it=p.item;
  if(p.rel==='add'){
    if(level===1)return '前の文と後ろの文を、両方読もう。「'+it.s1+'」「'+it.s2+'」。どちらも、何について話しているかな？';
    if(level===2)return '前の文では「'+it.s1+'」、後ろの文では「'+it.s2+'」。同じ話題について、どんなことを一つずつ挙げているかな？';
    return it.clue+'よ。二つのことをならべたり、情報をもう一つつけ足したりしているね。';
  }
  if(level===1)return `まず、前の文だけを見よう。「${it.s1}」。このあと、ふつうならどうなりそう？`;
  if(level===2)return `ふつうなら……「${it.expect}」と考えられそうだね。`;
  return `後ろの文は「${it.s2}」。前から考えたこととくらべると、${it.clue}よ。`;
}
function reasoningHTML(p,showName=true){
  const it=p.item,v=REL_VIEW[p.rel];
  if(p.rel==='add')return `<div class="thinkbox"><h3>前と後ろを、両方読んで考えよう</h3>${sceneHTML(p,true)}
    <div class="thinkstep"><span class="num">1</span><p><b>前の文：</b>「${esc(it.s1)}」</p></div>
    <div class="thinkstep"><span class="num">2</span><p><b>後ろの文：</b>「${esc(it.s2)}」</p></div>
    <div class="predict"><b>二つの文に共通する話題は？</b><br>${esc(it.clue)}。</div>
    <div class="thinkstep"><span class="num">3</span><p>${esc(it.reaction)}</p></div>
    ${showName?`<p><span class="relation-badge">つけたし</span><br><b>${esc(v.kid)}</b><br>${esc(REL.add.exp)}</p>`:''}</div>`;
  return `<div class="thinkbox">
    <h3>文のつながりを、じゅんに考えよう</h3>
    ${sceneHTML(p,true)}
    <div class="thinkstep"><span class="num">1</span><p><b>前の文：</b>「${esc(it.s1)}」</p></div>
    <div class="predict"><b>ふつうなら？</b><br>${esc(it.expect)}</div>
    <div class="thinkstep"><span class="num">2</span><p><b>後ろの文：</b>「${esc(it.s2)}」</p></div>
    <div class="thinkstep"><span class="num">3</span><p>${esc(it.clue)}。</p></div>
    <div class="reaction">${esc(it.reaction)}</div>
    ${showName?`<p style="margin:12px 0 0"><span class="relation-badge">${esc(v.badge)}</span><br><b>${esc(v.kid)}</b><br>${esc(REL[p.rel].exp)}</p>`:''}
  </div>`;
}

// ===== 画面 =====
const app=document.getElementById('app');
let S={};
function menu(){
  stopSay();
  app.innerHTML=`<h1>つなぎ言葉であそぼう</h1>
  <p class="sub">文と文の関係を考えて、つなぎ言葉をえらぼう。ただしい答えは、1つとはかぎらないよ。</p>
  <div class="menu">${Object.entries(MODES).map(([k,m])=>`<button class="mbtn" data-m="${k}"><b>${m.label}</b><span>${m.desc}</span></button>`).join('')}</div>`;
  app.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>start(b.dataset.m));
}
function start(mode){se('next');S={mode,probs:makeRound(mode),i:0,score:0,sel:new Set(),done:false};show()}
function show(){
  window.scrollTo({top:0,left:0,behavior:"instant"});
  const p=S.probs[S.i];
  const q={join:'2つの文を、1つの文につなげよう。',split:'この文と同じ意味になるように、2つの文にわけよう。',fill:'（　）に入る つなぎ言葉は どれかな？'}[p.mode];
  app.innerHTML=`<div class="top"><button class="link" id="home">← もどる</button><div class="bar"><i style="width:${S.i/N*100}%"></i></div><span>${S.i+1} / ${N}</span></div>
  <div class="card"><p class="q">${q}</p><div class="box">${p.mode==='split'?esc(p.shown):p.shown}</div>
  ${sceneHTML(p,false)}
  <p class="hint">ただしいものを <b>${p.nOk}こ</b> えらぼう　<button class="btn sub2 small" id="rd">🔈 もんだいを よむ</button></p>
  <div class="opts" id="opts">${p.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="false"><span class="ck"></span><span class="tx">${esc(o.text)}</span></button>`).join('')}</div>
  <div id="hintArea"></div><div id="fb"></div>
  <div class="row split-actions"><button class="btn sub2" id="hintBtn">ヒントを見る</button><button class="btn" id="go" disabled>こたえあわせ</button></div></div>`;
  document.getElementById('home').onclick=()=>{stopSay();menu()};
  const L=['ひとつめ','ふたつめ','みっつめ','よっつめ'];
  document.getElementById('rd').onclick=()=>speak(q+' '+p.say+' えらぶものは、'+p.opts.map((o,k)=>L[k]+'、'+o.text).join(' '));
  renderSet();wireSceneImage(app);
  window.scrollTo({top:0,left:0,behavior:"instant"});
  speakLater(q+' '+p.say,350);
  const go=document.getElementById('go');
  const hintBtn=document.getElementById('hintBtn');
  hintBtn.onclick=()=>{
    se('tap');
    p.hintLevel=Math.min(3,(p.hintLevel||0)+1);
    document.getElementById('hintArea').innerHTML=`<div class="hintpanel"><p><b>ヒント ${p.hintLevel}/3：</b> ${esc(hintText(p,p.hintLevel))}</p></div>`;
    speak(hintText(p,p.hintLevel));
    if(p.hintLevel>=3)hintBtn.disabled=true;
  };
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.done)return;
    const k=+b.dataset.k;
    se('tap');
    S.sel.has(k)?S.sel.delete(k):S.sel.add(k);
    b.classList.toggle('sel',S.sel.has(k));b.setAttribute('aria-pressed',S.sel.has(k));
    go.disabled=S.sel.size===0;
  });
  go.onclick=check;
}
function check(){
  const p=S.probs[S.i];
  const right=p.opts.every((o,k)=>o.ok===S.sel.has(k));
  p.attempts=(p.attempts||0)+1;

  // 1回目の誤答では、正解を明かさず、文意のヒントを見せて再回答させる。
  if(!right && p.attempts===1){
    se('ng');
    S.done=true;
    document.querySelectorAll('.opt').forEach((b,k)=>{
      if(S.sel.has(k))b.classList.add('ng');
      b.disabled=true;
    });
    document.getElementById('fb').innerHTML=`<div class="fb bad"><h3>おしい！　まだ答えは見せないよ</h3>
      <p>つなぎ言葉だけを見るのではなく、<b>${p.rel==='add'?'前と後ろの文で、何を一つずつ挙げているか':'前の文から何が起こりそうか'}</b>考えてみよう。</p></div>
      ${reasoningHTML(p,false)}
      <p class="retry-note">考え方を見たら、もう一度えらんでみよう。</p>`;
    wireSceneImage(document.getElementById('fb'));
    speakLater('おしい。まだ答えは見せないよ。'+(p.rel==='add'?p.item.s1+'。'+p.item.s2+'。'+p.item.clue:p.item.expect+'。後ろの文は、'+p.item.s2)+'。もういちど考えてみよう。',600);
    const go=document.getElementById('go');
    go.disabled=false;go.textContent='もう一度 えらぶ';
    document.getElementById('hintBtn').disabled=true;
    go.onclick=retryCurrent;
    go.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }

  S.done=true;
  if(right)S.score++;
  se(right?'ok':'ng');
  const oksTxt=p.opts.filter(o=>o.ok).map(o=>o.text).join('。 または、');
  speakLater((right?'せいかい！ ':'もう一歩。正しいのは、'+oksTxt+'。 ')+p.item.clue+'。'+REL[p.rel].exp,right?800:600);
  document.querySelectorAll('.opt').forEach((b,k)=>{
    const o=p.opts[k];
    b.classList.remove('sel','ng');
    if(o.ok)b.classList.add('ok');else if(S.sel.has(k))b.classList.add('ng');
    const ck=b.querySelector('.ck');
    if(ck)ck.outerHTML=`<span class="mk">${o.ok?'○':(S.sel.has(k)?'×':'')}</span>`;
    b.querySelector('.tx').insertAdjacentHTML('beforeend',`<span class="note">${esc(o.note)}</span>`);
    b.disabled=true;
  });
  document.getElementById('fb').innerHTML=`<div class="fb ${right?'good':'bad'}"><h3>${right?'せいかい！':'もう一歩！'}</h3>${right?'文の意味から、つながりを考えられたね。':'○がついているのが ただしい答えだよ。考え方も確認しよう。'}</div>
    ${reasoningHTML(p,true)}`;
  wireSceneImage(document.getElementById('fb'));
  document.getElementById('hintBtn').disabled=true;
  const go=document.getElementById('go');
  go.disabled=false;go.textContent=S.i+1<N?'つぎへ':'けっかを見る';
  go.onclick=()=>{se('next');stopSay();S.i++;S.sel=new Set();S.done=false;S.i<N?show():result()};
  go.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function retryCurrent(){
  const p=S.probs[S.i];
  S.done=false;S.sel=new Set();
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=false;b.classList.remove('sel','ng','ok');b.setAttribute('aria-pressed','false');
  });
  document.getElementById('fb').innerHTML='';
  document.getElementById('hintArea').innerHTML=`<div class="hintpanel"><p><b>もう一度：</b> ${esc(hintText(p,3))}この関係に合う言葉をえらぼう。</p></div>`;
  const go=document.getElementById('go');go.disabled=true;go.textContent='こたえあわせ';go.onclick=check;
  speak('もう一度えらぼう。'+hintText(p,3)+'。');
}
function result(){
  const m=S.score===N?'ぜんぶせいかい！つなぎ言葉の名人だね！':S.score>=7?'よくできました！':'もう一度やって、文の関係を考えてみよう。';
  app.innerHTML=`<div class="card" style="text-align:center"><h1>けっか</h1><p class="big">${S.score} / ${N}</p><p>${m}</p>
  <div class="row" style="justify-content:center"><button class="btn" id="again">もう一度</button><button class="btn sub2" id="menu">メニューへ</button></div></div>`;
  se(S.score>=7?'fan':'next');
  speakLater(`${NK[N]}もんちゅう、${NK[S.score]}もん せいかい。 ${m}`,S.score>=7?1300:500);
  document.getElementById('again').onclick=()=>start(S.mode);
  document.getElementById('menu').onclick=menu;
}
renderSet();
menu();
</script>
