<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ながさの たし算・ひき算 v21</title>
  <style>
    :root{
      --bg:#f6f8fc;
      --panel:rgba(255,255,255,.92);
      --ink:#1f2937;
      --muted:#64748b;
      --cm:#ef4444;
      --mm:#2563eb;
      --line:#facc15;
      --shadow:0 18px 45px rgba(15,23,42,.12);
      --radius:22px;
      --px-per-mm:17;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      overflow:hidden;
      font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      background:radial-gradient(circle at top,#ffffff 0%,var(--bg) 60%,#eaf0ff 100%);
      color:var(--ink);
    }
    .app{
      height:100vh;
      padding:10px;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:10px;
    }
    .bar,.stage,.footer{
      background:var(--panel);
      border:1px solid rgba(148,163,184,.22);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }
    .bar{
      padding:10px 12px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;
      gap:10px;
      align-items:center;
    }
    .side{
      min-width:0;
      display:grid;
      grid-template-columns:auto 1fr;
      gap:8px;
      align-items:center;
    }
    .side.right{justify-self:end}
    .side-title{
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      letter-spacing:.04em;
      white-space:nowrap;
      padding:0 2px;
    }
    .length-card{
      min-width:0;
      display:grid;
      grid-template-columns:1fr;
      gap:4px;
    }
    .length-preview{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      font-size:clamp(16px,1.8vw,22px);
      font-weight:900;
      line-height:1;
      white-space:nowrap;
    }
    .length-preview .cm{color:var(--cm)}
    .length-preview .mm{color:var(--mm)}
    .steppers{
      display:grid;
      grid-template-columns:repeat(4,auto);
      gap:6px;
      align-items:stretch;
    }
    .step-block{
      display:grid;
      grid-template-rows:auto auto auto;
      justify-items:center;
      gap:3px;
      min-width:54px;
    }
    .step-label{
      font-size:11px;
      color:var(--muted);
      font-weight:800;
      line-height:1;
    }
    .btn{
      border:none;
      border-radius:999px;
      cursor:pointer;
      user-select:none;
      font-weight:900;
      transition:transform .08s ease, opacity .15s ease, background .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:active{transform:translateY(1px)}
    .small{
      width:28px;
      height:24px;
      line-height:1;
      font-size:15px;
      background:#eef2ff;
      color:#1d4ed8;
    }
    .value{
      min-width:30px;
      text-align:center;
      font-size:16px;
      font-weight:900;
      padding:3px 0;
      border-radius:8px;
      background:#f8fafc;
      border:1px solid rgba(148,163,184,.18);
    }
    .op-wrap{
      display:grid;
      justify-items:center;
      gap:6px;
    }
    .op-btn{
      width:52px;
      height:52px;
      border-radius:999px;
      background:#111827;
      color:#fff;
      font-size:22px;
      box-shadow:0 12px 30px rgba(17,24,39,.15);
    }
    .action-row{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .action{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      background:#2563eb;
      color:#fff;
      box-shadow:0 12px 28px rgba(37,99,235,.16);
    }
    .secondary{
      background:#e5e7eb;
      color:#111827;
      box-shadow:none;
    }
    .sound-btn{
      border:none;
      border-radius:999px;
      padding:8px 12px;
      font-size:18px;
      cursor:pointer;
      background:#f0fdf4;
      color:#16a34a;
      box-shadow:0 4px 12px rgba(22,163,74,.18);
      transition:transform .08s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color:transparent;
      line-height:1;
    }
    .sound-btn.off{
      background:#f1f5f9;
      color:#94a3b8;
      box-shadow:none;
    }
    .sound-btn:active{transform:translateY(1px)}
    .stage{
      position:relative;
      overflow:hidden;
      min-height:0;
      display:flex;
      align-items:stretch;
      justify-content:stretch;
      padding:8px;
    }
    svg{
      width:100%;
      height:100%;
      display:block;
    }
    .footer{
      padding:8px 12px;
      display:grid;
      grid-template-columns:1fr;
      gap:6px;
    }
    .equation{
      display:flex;
      flex-wrap:wrap;
      gap:8px 14px;
      align-items:center;
      justify-content:center;
      font-size:clamp(15px,1.9vw,22px);
      font-weight:900;
      line-height:1.35;
      text-align:center;
    }
    .equation .cm{color:var(--cm)}
    .equation .mm{color:var(--mm)}
    .result{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      font-size:clamp(16px,2vw,24px);
      font-weight:900;
      min-height:1.4em;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:#f8fafc;
      border:1px solid rgba(148,163,184,.22);
      color:#334155;
      font-size:13px;
      font-weight:800;
    }
    .tiny{
      font-size:12px;
      color:var(--muted);
      text-align:center;
      line-height:1.35;
    }


    /* ===== 学習の焦点を前面に出す改善UI ===== */
    body{
      background:linear-gradient(180deg,#fff8fb 0%,#eef7ff 45%,#f8fffb 100%);
      position:relative;
    }
    body::before,body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;}
    body::before{
      background:
        radial-gradient(circle at 12% 18%, rgba(251,191,36,.22) 0 18px, transparent 19px),
        radial-gradient(circle at 86% 14%, rgba(96,165,250,.16) 0 16px, transparent 17px),
        radial-gradient(circle at 20% 88%, rgba(52,211,153,.15) 0 16px, transparent 17px),
        radial-gradient(circle at 78% 84%, rgba(244,114,182,.14) 0 14px, transparent 15px),
        radial-gradient(circle at 58% 10%, rgba(167,139,250,.12) 0 12px, transparent 13px);
      opacity:.9;
    }
    body::after{
      background:linear-gradient(transparent 96%, rgba(255,255,255,.45) 100%);
    }
    .app{position:relative;z-index:1;}
    .app{
      height:100dvh;
      padding:8px;
      gap:8px;
      grid-template-rows:auto auto minmax(0,1fr) auto;
    }
    .bar,.stage,.footer,.concept-strip{
      background:rgba(255,255,255,.96);
      border:2px solid #d9e7f4;
      border-radius:22px;
      box-shadow:0 10px 24px rgba(15,23,42,.08);
      backdrop-filter:none;
    }
    .bar{
      padding:8px 10px;
      display:grid;
      grid-template-columns:minmax(210px,.72fr) minmax(520px,1.9fr) minmax(190px,.7fr);
      gap:10px;
      align-items:center;
    }
    .mode-zone{display:grid;gap:7px;align-content:center}
    .mode-tabs{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
      padding:5px;
      border-radius:16px;
      background:linear-gradient(180deg,#eef7ff 0%,#f5f3ff 100%);
      border:1px solid #dbeafe;
    }
    .mode-tab{
      min-height:38px;
      border:0;
      border-radius:12px;
      background:rgba(255,255,255,.55);
      color:#475569;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .mode-tab:hover{transform:translateY(-1px)}
    .mode-tab[data-mode='+']{color:#b45309}
    .mode-tab[data-mode='−']{color:#0f766e}
    .mode-tab[data-mode='差']{color:#7c3aed}
    .mode-tab.active{
      background:#fff;
      color:#0f172a;
      box-shadow:0 3px 10px rgba(15,23,42,.12);
    }
    .mode-tab[data-mode='+'].active{background:linear-gradient(180deg,#fff6d8 0%,#fffdf4 100%);border:1px solid #fcd34d}
    .mode-tab[data-mode='−'].active{background:linear-gradient(180deg,#dcfce7 0%,#f0fdf4 100%);border:1px solid #86efac}
    .mode-tab[data-mode='差'].active{background:linear-gradient(180deg,#f3e8ff 0%,#faf5ff 100%);border:1px solid #d8b4fe}
    .preset-row{display:flex;gap:6px;flex-wrap:wrap}
    .preset-btn{
      border:2px solid #cbd5e1;
      border-radius:999px;
      background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
      color:#334155;
      padding:7px 11px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 4px 10px rgba(15,23,42,.06);
    }
    .preset-btn.challenge{border-color:#f59e0b;background:linear-gradient(180deg,#fff3c4 0%,#fffbeb 100%);color:#92400e}
    .preset-btn.active{transform:translateY(-1px);box-shadow:0 7px 14px rgba(15,23,42,.10)}
    .preset-btn:not(.challenge).active{background:linear-gradient(180deg,#dbeafe 0%,#eff6ff 100%);border-color:#60a5fa;color:#1d4ed8}
    .preset-btn.challenge.active{background:linear-gradient(180deg,#fde68a 0%,#fff7d6 100%);border-color:#f59e0b;color:#92400e}
    .preset-btn.challenge{position:relative}
    .preset-btn.challenge.extension::after{content:'チャレンジ';position:absolute;top:-8px;right:-7px;font-size:9px;line-height:1;padding:3px 5px;border-radius:999px;background:#f59e0b;color:#fff;border:2px solid #fff}
    .operand-zone{
      min-width:0;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
      gap:8px;
      align-items:center;
    }
    .side{
      min-width:0;
      display:grid;
      grid-template-columns:auto 1fr;
      gap:7px;
      align-items:center;
      padding:7px 9px;
      border-radius:16px;
      background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);
      border:2px solid #dce8f5;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
    }
    .side.right{justify-self:stretch;grid-template-columns:1fr auto}
    .side-title{
      width:32px;
      height:32px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:linear-gradient(180deg,#fef3c7 0%,#fde68a 100%);
      border:2px solid #f59e0b;
      color:#92400e;
      font-size:15px;
      font-weight:950;
      padding:0;
      box-shadow:0 4px 8px rgba(245,158,11,.18);
    }
    .operand-zone > .side.right .side-title{
      background:linear-gradient(180deg,#dbeafe 0%,#bfdbfe 100%);
      border-color:#60a5fa;
      color:#1d4ed8;
      box-shadow:0 4px 8px rgba(96,165,250,.18);
    }
    .length-card{gap:3px}
    .operand-name{font-size:11px;font-weight:900;color:#64748b;text-align:center;letter-spacing:.02em}
    .length-preview{
      gap:7px;
      font-size:clamp(18px,1.65vw,24px);
      justify-content:center;
    }
    .length-preview .cm::before{content:'■ ';font-size:.7em;vertical-align:.08em}
    .length-preview .mm::before{content:'● ';font-size:.68em;vertical-align:.08em}
    .steppers{display:none;grid-template-columns:repeat(2,minmax(50px,72px));gap:7px;justify-content:center}
    .app.edit-values .steppers{display:grid}
    .step-block{min-width:50px;gap:2px}
    .small{width:40px;height:30px;font-size:16px;border:2px solid transparent;box-shadow:0 3px 7px rgba(15,23,42,.08)}
    .small[data-unit='cm']{background:linear-gradient(180deg,#fee2e2 0%,#fff1f2 100%);color:#b91c1c;border-color:#fecaca}
    .small[data-unit='mm']{background:linear-gradient(180deg,#dbeafe 0%,#eff6ff 100%);color:#1d4ed8;border-color:#bfdbfe}
    .value{font-size:16px;padding:3px 0;background:#fff;border:2px solid #e2e8f0;border-radius:10px}
    .step-block:nth-child(1) .value{border-color:#fecaca;background:#fff8f8}
    .step-block:nth-child(2) .value{border-color:#bfdbfe;background:#f8fbff}
    .step-label{font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;background:#fff}
    .step-block:nth-child(1) .step-label{color:#b91c1c;border:1px solid #fecaca}
    .step-block:nth-child(2) .step-label{color:#1d4ed8;border:1px solid #bfdbfe}
    .op-wrap{gap:3px}
    .op-btn{
      width:48px;height:48px;
      background:linear-gradient(180deg,#fdf2f8 0%,#eef2ff 100%);
      color:#0f172a;
      box-shadow:none;
      border:2px dashed #c4b5fd;
      cursor:default;
      pointer-events:none;
    }
    .badge{padding:4px 8px;font-size:11px;background:#fff}
    .tools-zone{display:grid;gap:7px;justify-items:end;align-content:center}
    .action-row{gap:6px;justify-content:flex-end;flex-wrap:nowrap}
    .action{padding:9px 12px;font-size:13px;border:2px solid rgba(255,255,255,.6)}
    #animateBtn{font-size:14px;padding:10px 15px;background:linear-gradient(180deg,#34d399 0%,#0f766e 100%);box-shadow:0 10px 18px rgba(15,118,110,.22)}
    #animateBtn:hover{transform:translateY(-1px)}
    #resetBtn{padding:9px 11px!important;background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);border-color:#cbd5e1}
    .sound-btn{padding:8px 10px;font-size:17px;border:2px solid #bbf7d0}
    .display-settings{font-size:11px;color:#64748b}
    .display-settings summary{cursor:pointer;font-weight:800;text-align:right;list-style:none}
    .display-settings summary::-webkit-details-marker{display:none}
    .display-settings summary::before{content:'';}
    .zoom-row{display:flex;gap:5px;align-items:center;justify-content:flex-end;margin-top:5px}
    .settings-row{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px;flex-wrap:wrap}
    .value-edit-btn,.undo-value-btn{border:1px solid #cbd5e1;border-radius:999px;background:#fff;color:#475569;padding:6px 9px;font-size:11px;font-weight:900;cursor:pointer}
    .value-edit-btn.active{background:#ecfeff;border-color:#67e8f9;color:#0e7490}
    .undo-value-btn:disabled{opacity:.35;cursor:default}
    .app:not(.edit-values) .undo-value-btn{display:none}
    .setting-check{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:7px;font-size:11px;font-weight:850;color:#475569;cursor:pointer;user-select:none}
    .setting-check input{width:16px;height:16px;accent-color:#0f766e}
    .practice-pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#ecfdf5;border:2px solid #6ee7b7;color:#047857;font-size:11px;font-weight:950;white-space:nowrap}
    .practice-pill[hidden]{display:none}
    .practice-pill.review{background:#fff7ed;border-color:#fdba74;color:#9a3412}
    .practice-status{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#f8fafc;border:1px solid #cbd5e1;color:#475569;font-size:10px;font-weight:900;white-space:nowrap}
    .practice-status[hidden]{display:none}

    .concept-strip{
      min-height:62px;
      padding:8px 14px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:14px;
      border-width:2px;
      background:linear-gradient(180deg,#fffef8 0%,#ffffff 100%);
      position:relative;
    }
    .concept-strip::before{
      content:'💡 ポイント';
      position:absolute;
      top:-11px;
      left:16px;
      padding:3px 10px;
      border-radius:999px;
      background:linear-gradient(180deg,#fef3c7 0%,#fde68a 100%);
      color:#92400e;
      font-size:12px;
      font-weight:950;
      border:2px solid #f59e0b;
      box-shadow:0 4px 8px rgba(245,158,11,.14);
    }
    .concept-main{min-width:0;display:grid;gap:5px}
    .question-equation{
      min-width:0;
      display:flex;
      align-items:baseline;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
      font-size:clamp(22px,2.35vw,34px);
      line-height:1.1;
      font-weight:950;
      letter-spacing:.01em;
    }
    .hint-line{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:900;color:#475569}
    .hint-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#ffffff;border:1px solid #dbeafe;box-shadow:0 2px 6px rgba(15,23,42,.04)}
    .hint-badge .num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#e0f2fe;color:#0369a1;font-size:11px;font-weight:950}
    .hint-badge.em{border-color:#bbf7d0;background:#f0fdf4;color:#065f46}
    .hint-badge{transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease,background .16s ease}
    .hint-badge.active{transform:translateY(-1px) scale(1.05);background:#fff7d6;border-color:#f59e0b;color:#92400e;box-shadow:0 0 0 4px rgba(245,158,11,.12),0 5px 12px rgba(15,23,42,.08)}
    .hint-badge.done{opacity:.58;background:#f8fafc;border-color:#cbd5e1}
    .hint-badge.active .num{background:#f59e0b;color:#fff}
    .hint-badge.done .num{background:#94a3b8;color:#fff}
    .check-prompt{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:950;color:#334155}
    .check-prompt::before{content:'?';display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#e0f2fe;color:#0369a1;font-size:13px}
    .check-choice{border:2px solid #cbd5e1;border-radius:999px;background:#fff;padding:6px 12px;font-size:13px;font-weight:950;color:#334155;cursor:pointer;box-shadow:0 2px 6px rgba(15,23,42,.05);transition:transform .12s ease,background .12s ease,border-color .12s ease}
    .check-choice:hover{transform:translateY(-1px)}
    .check-choice.correct{background:#ecfdf5;border-color:#34d399;color:#047857}
    .check-choice.wrong{background:#fff7ed;border-color:#fb923c;color:#9a3412;animation:checkShake .26s ease}
    .check-note{font-size:12px;font-weight:900;color:#92400e}
    .check-note.ok{color:#047857;background:#ecfdf5;border:2px solid #6ee7b7;border-radius:999px;padding:5px 10px}
    @keyframes checkShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
    .question-equation .cm,.concept-strip .cm{color:var(--cm)}
    .question-equation .mm,.concept-strip .mm{color:var(--mm)}
    .question-equation .unknown{font-size:1.15em;color:#0f766e}
    .question-equation .word{font-size:.68em;color:#475569}
    .zero-length{color:#475569;font-weight:900}
    .unit-rule{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:900;color:#475569}
    .unit-chip{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:8px 11px;
      border-radius:999px;
      border:2px solid currentColor;
      background:#fff;
      transition:transform .18s ease,box-shadow .18s ease,background .18s ease,opacity .18s ease;
      box-shadow:0 3px 8px rgba(15,23,42,.06);
    }
    .unit-chip.cm{background:linear-gradient(180deg,#fff4f4 0%,#ffffff 100%)}
    .unit-chip.mm{background:linear-gradient(180deg,#f2f8ff 0%,#ffffff 100%)}
    .unit-chip.cm::before{content:'■';font-size:11px}
    .unit-chip.mm::before{content:'●';font-size:11px}
    .equiv-chip{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;background:#fff7ed;border:2px solid #fdba74;color:#9a3412;font-size:12px;font-weight:950;box-shadow:0 3px 8px rgba(15,23,42,.05)}
    .equiv-chip .cm-eq{color:var(--cm)}
    .equiv-chip .mm-eq{color:var(--mm)}
    .equiv-chip[hidden]{display:none}
    .practice-strip{grid-column:1/-1;display:grid;grid-template-columns:auto auto auto auto minmax(150px,1fr);align-items:center;justify-content:center;gap:8px;padding:6px 8px 1px;border-top:1px dashed #cbd5e1}
    .practice-strip[hidden]{display:none}
    .practice-title{font-size:13px;font-weight:950;color:#047857;white-space:nowrap}
    .practice-answer-label{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;color:#475569;white-space:nowrap}
    .practice-zero-note{font-size:11px;font-weight:850;color:#64748b;white-space:nowrap}
    .practice-input{width:58px;height:34px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;text-align:center;font-size:18px;font-weight:950;color:#0f172a;outline:none}
    .practice-input.cm-input{border-color:#fca5a5;background:#fff7f7}
    .practice-input.mm-input{border-color:#93c5fd;background:#f7fbff}
    .practice-input:focus{box-shadow:0 0 0 3px rgba(59,130,246,.12)}
    .practice-check-btn{border:0;border-radius:999px;background:linear-gradient(180deg,#34d399 0%,#0f766e 100%);color:#fff;padding:8px 13px;font-size:12px;font-weight:950;cursor:pointer;box-shadow:0 5px 10px rgba(15,118,110,.16)}
    .practice-check-btn:disabled{opacity:.45;cursor:default;box-shadow:none}
    .practice-feedback{min-height:1.2em;font-size:12px;font-weight:900;color:#b45309;text-align:left}
    .practice-feedback.ok{color:#047857}
    .practice-feedback.hint{color:#92400e}
    .unit-chip.focus{transform:scale(1.06);box-shadow:0 0 0 4px rgba(15,118,110,.08)}
    .unit-chip.dim{opacity:.35;transform:scale(.96)}

    .now-doing{position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:18;padding:6px 13px;border-radius:999px;background:rgba(255,247,214,.96);border:2px solid #f59e0b;color:#92400e;font-size:13px;font-weight:950;box-shadow:0 5px 12px rgba(15,23,42,.09);pointer-events:none;white-space:nowrap}
    .now-doing[hidden]{display:none}

    .success-card{
      position:absolute;
      left:50%;top:50%;bottom:auto;
      transform:translate(-50%,-50%);
      z-index:40;
      width:min(760px,92%);max-width:92%;min-width:0;
      height:min(350px,calc(100% - 24px));
      max-height:calc(100% - 24px);
      box-sizing:border-box;
      padding:20px 24px;border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.985) 0%,rgba(240,253,250,.985) 100%);
      border:3px solid #34d399;box-shadow:0 18px 40px rgba(15,118,110,.20);
      text-align:center;pointer-events:auto;
      overflow-y:auto;overflow-x:hidden;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      animation:successPop .34s cubic-bezier(.2,.8,.2,1) both;
    }
    /* たしかめ中も、できた後も、同じ中央ポップアップ枠を使う。 */
    .success-card.bottom{top:50%;bottom:auto}
    .success-title{font-size:clamp(25px,3vw,38px);font-weight:950;color:#047857;line-height:1.08}
    .success-main{margin-top:8px;font-size:clamp(17px,1.9vw,23px);font-weight:950;color:#0f172a;line-height:1.35}
    .success-sub{margin-top:7px;font-size:clamp(14px,1.4vw,18px);font-weight:850;color:#475569;line-height:1.45}
    .success-check{width:100%;box-sizing:border-box;margin-top:9px;padding:8px 10px;border-radius:14px;background:#fffbeb;border:2px solid #fde68a;display:grid;gap:7px;justify-items:center}
    .success-check:empty{display:none}
    .success-check-guide{font-size:11px;font-weight:950;color:#92400e}
    .success-check-row{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
    .success-check .check-prompt{font-size:12px;font-weight:950;color:#334155}
    .success-check .check-choice{border:2px solid #cbd5e1;border-radius:999px;background:#fff;padding:6px 10px;font-size:12px;font-weight:950;color:#334155;cursor:pointer}
    .success-check .check-choice:hover{background:#f8fafc}
    .success-check .check-choice.correct{border-color:#34d399;background:#ecfdf5;color:#047857}
    .success-check .check-choice.wrong{border-color:#fb7185;background:#fff1f2;color:#be123c;animation:checkShake .25s ease}
    .success-check .check-note{font-size:15px;font-weight:900;color:#b45309;line-height:1.45}
    .success-check .check-note.ok{color:#047857}
    .success-lock-note{margin-top:10px;font-size:14px;font-weight:900;color:#92400e;line-height:1.4}
    @keyframes checkShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
    .success-actions{display:flex;justify-content:center;gap:12px;margin-top:14px;position:relative;z-index:2;flex-wrap:wrap}
    .success-btn{border:0;border-radius:999px;padding:12px 22px;font-size:17px;font-weight:950;cursor:pointer;box-shadow:0 4px 10px rgba(15,23,42,.10);transition:transform .1s ease;min-height:48px}
    .success-btn:active{transform:translateY(1px)}
    .success-btn:disabled{opacity:.42;cursor:default;filter:grayscale(.25);box-shadow:none}
    .success-btn.next.ready{box-shadow:0 0 0 4px rgba(245,158,11,.15),0 5px 12px rgba(15,23,42,.10)}
    .success-btn.repeat{background:#fff;color:#475569;border:2px solid #cbd5e1}
    .success-btn.next{background:linear-gradient(180deg,#fbbf24 0%,#f59e0b 100%);color:#78350f;border:2px solid #f59e0b}
    .success-spark{position:absolute;top:48%;font-size:20px;animation:sparkFly 1.25s ease-out both;opacity:0}
    .success-card.needs-check{
      border-color:#f59e0b;
      background:linear-gradient(180deg,#fffdf3 0%,#ffffff 100%);
      box-shadow:0 20px 46px rgba(146,64,14,.24);
    }
    .success-card.needs-check .success-title{font-size:clamp(25px,3vw,38px);color:#92400e}
    .success-card.needs-check .success-main{font-size:clamp(17px,1.9vw,23px);margin-top:8px}
    .success-card.needs-check .success-sub{display:none}
    .success-card.needs-check .success-check{margin-top:14px;padding:16px 16px 18px;border-radius:20px;border:3px solid #fbbf24;background:#fff7d6;gap:14px}
    .success-card.needs-check .success-check-guide{font-size:18px;color:#92400e}
    .success-card.needs-check .success-check-row{gap:12px}
    .success-card.needs-check .success-check .check-prompt{width:100%;justify-content:center;font-size:clamp(20px,2.2vw,28px);line-height:1.35}
    .success-card.needs-check .success-check .check-choice{min-width:180px;min-height:54px;padding:11px 18px;font-size:clamp(17px,1.8vw,22px);border-width:3px}
    .success-card.needs-check .success-check .check-note{font-size:15px;line-height:1.4}
    .success-card.needs-check .success-lock-note{font-size:14px;margin-top:10px;color:#92400e}
    .success-card.needs-check .success-actions{margin-top:14px}
    .success-card.needs-check .success-btn.next{font-size:17px;padding:12px 22px}
    .success-card:not(.needs-check) .success-title{font-size:clamp(25px,3vw,38px)}
    .success-card:not(.needs-check) .success-main{font-size:clamp(17px,1.9vw,23px)}
    .success-card:not(.needs-check) .success-sub{font-size:clamp(14px,1.4vw,18px)}
    .success-card:not(.needs-check) .success-btn{font-size:17px;padding:12px 22px;min-height:48px}
    @media (max-width:700px){
      .success-card{width:94%;max-width:94%;padding:16px 14px}
      .success-card.needs-check{width:94%;max-width:94%;padding:16px 14px}
      .success-card.needs-check .success-check .check-choice{min-width:135px}
    }
    @keyframes successPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.88)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.02)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    @keyframes sparkFly{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(var(--rot))}}

    .stage{
      padding:4px;
      border-width:2px;
      box-shadow:0 5px 16px rgba(15,23,42,.06);
      background:linear-gradient(180deg,#ffffff 0%,#fcfdff 100%);
    }
    svg{overflow:visible}
    .footer{
      min-height:60px;
      padding:7px 12px;
      gap:4px;
      box-shadow:0 5px 16px rgba(15,23,42,.06);
      background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
    }
    .equation{font-size:clamp(18px,1.8vw,25px);line-height:1.2}
    .result{font-size:clamp(17px,1.75vw,24px);min-height:1.2em}
    .tiny{font-size:13px;font-weight:800;color:#475569;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:5px 10px}
    .tiny strong{color:#0f172a}

    .footer.result-hidden{min-height:36px;padding:5px 12px}
    .footer.result-hidden .equation,.footer.result-hidden .result{display:none}

    @media (max-width:1050px){
      .bar{grid-template-columns:190px minmax(480px,1fr) 175px;gap:7px}
      .preset-btn{padding:5px 7px;font-size:11px}
      .side{padding:5px}
      .steppers{grid-template-columns:repeat(2,52px)}
      .action{padding:8px 9px}
      #animateBtn{padding:9px 10px;font-size:12px}
      .concept-strip{grid-template-columns:1fr;gap:5px;padding:6px 10px}
      .unit-rule{justify-content:center}
      .hint-line{font-size:11px}
      .practice-strip{grid-template-columns:1fr auto auto;gap:6px}
      .practice-title{grid-column:1/-1;text-align:center}
      .practice-feedback{grid-column:1/-1;text-align:center}
    }
    @media (max-width:820px){
      body{overflow:auto}
      .app{height:auto;min-height:100dvh;grid-template-rows:auto auto minmax(420px,1fr) auto}
      .bar{grid-template-columns:1fr;}
      .mode-zone{grid-template-columns:1fr auto;align-items:center}
      .operand-zone{grid-row:2}
      .tools-zone{grid-template-columns:1fr auto;justify-items:stretch}
      .action-row{justify-content:center}
      .display-settings{justify-self:end}
    }

    /* ===== v18: 情報を厳選した児童向けUI ===== */
    .bar{grid-template-columns:minmax(210px,.62fr) minmax(500px,2fr) minmax(132px,.42fr);gap:8px;padding:7px 9px}
    .mode-zone{gap:0}
    .mode-tabs{padding:4px;gap:4px}
    .mode-tab{min-height:40px;font-size:14px}
    .operand-name,.badge{display:none!important}
    .side{padding:8px 10px}
    .tools-zone{display:flex;align-items:center;justify-content:flex-end;gap:5px}
    .action-row{gap:5px}
    #animateBtn{font-size:15px;padding:11px 16px}
    #resetBtn{min-width:42px;width:42px;padding:9px!important;font-size:0}
    #resetBtn::before{content:'↺';font-size:20px}
    .sound-btn{min-width:42px;width:42px;padding:8px;font-size:17px}
    .display-settings{position:relative}
    .display-settings summary{width:42px;height:42px;display:grid;place-items:center;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:18px;text-align:center}
    .display-settings[open]{z-index:20}
    .display-settings[open]::after{content:'';position:absolute;right:0;top:46px;width:290px;height:1px}
    .display-settings > :not(summary){position:relative;z-index:21}
    .display-settings[open]{padding:0}
    .display-settings[open] .settings-caption:first-of-type{margin-top:7px}
    .display-settings .settings-caption{font-size:10px;font-weight:950;color:#64748b;text-align:left;margin:8px 0 3px}
    .display-settings .preset-row{display:flex;justify-content:flex-end}
    .preset-row{display:none}
    .display-settings[open]{background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:5px 8px 9px;box-shadow:0 12px 28px rgba(15,23,42,.14)}
    .display-settings[open] summary{margin-left:auto}
    .display-settings .preset-btn{padding:6px 8px;font-size:10px;box-shadow:none}
    .learning-meta{display:flex;justify-content:center;min-height:0}
    .practice-status{display:none!important}
    .practice-pill{padding:4px 9px;border-width:1px;font-size:10px}
    .concept-strip{grid-template-columns:minmax(0,1fr) auto;min-height:54px;padding:7px 12px;gap:8px}
    .concept-strip::before{display:none}
    .concept-main{gap:3px}
    .hint-line{min-height:18px;font-size:12px;gap:4px}
    .hint-line .hint-badge{padding:3px 8px;box-shadow:none;border-width:1px}
    .unit-rule{display:none}
    .unit-rule.show-equivalence{display:flex}
    .unit-rule #cmRule,.unit-rule #mmRule,.unit-rule > span:not(.equiv-chip){display:none}
    .footer.result-hidden{display:none}
    .footer .tiny{display:none}
    .footer{min-height:48px;padding:6px 10px}
    .success-spark{display:none}
    .success-card{padding:20px 24px;width:min(760px,92%);max-width:92%}
    .success-sub{font-size:clamp(14px,1.4vw,18px)}
    .practice-strip{padding-top:5px}
    @media (max-width:1050px){
      .bar{grid-template-columns:180px minmax(470px,1fr) 132px}
    }
    @media (max-width:820px){
      .bar{grid-template-columns:1fr}
      .tools-zone{justify-content:center}
      .display-settings{position:static}
    }

    /* v18b: 通常時は重複する数値編集欄を隠す */
    .bar{grid-template-columns:minmax(280px,420px) auto;justify-content:space-between}
    .mode-zone{max-width:420px}
    .operand-zone{display:none}
    .app.edit-values .bar{grid-template-columns:180px minmax(500px,1fr) 132px}
    .app.edit-values .operand-zone{display:grid}
    @media (max-width:1050px){
      .bar{grid-template-columns:minmax(250px,400px) auto}
      .app.edit-values .bar{grid-template-columns:170px minmax(450px,1fr) 132px}
    }
    @media (max-width:820px){
      .bar,.app.edit-values .bar{grid-template-columns:1fr}
      .app.edit-values .operand-zone{display:grid}
    }

  

    /* ===== v19: 練習では答え入力を主役にする ===== */
    .app.practice-mode .concept-strip{
      grid-template-columns:1fr;
      padding:8px 10px 10px;
      gap:5px;
      background:linear-gradient(180deg,#ffffff 0%,#f7fffb 100%);
      border-color:#a7f3d0;
    }
    .app.practice-mode .hint-line{display:none}
    .app.practice-mode #animateBtn{display:none}
    .app.practice-mode .question-equation{font-size:clamp(24px,2.65vw,38px);margin:1px 0 3px}
    .app.practice-mode .learning-meta{margin-bottom:1px}
    .app.practice-mode .unit-rule.show-equivalence{justify-content:center;margin:1px 0 2px}
    .practice-strip{
      grid-column:1/-1;
      display:grid;
      grid-template-columns:1fr;
      justify-items:center;
      gap:7px;
      padding:9px 10px 8px;
      border:3px solid #6ee7b7;
      border-radius:20px;
      background:linear-gradient(180deg,#ecfdf5 0%,#ffffff 72%);
      box-shadow:0 7px 18px rgba(5,150,105,.10);
    }
    .practice-strip[hidden]{display:none}
    .practice-title{
      font-size:clamp(17px,1.7vw,22px);
      font-weight:950;
      color:#065f46;
      line-height:1.05;
    }
    .practice-answer-box{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      width:min(650px,100%);
      padding:8px 12px;
      border-radius:16px;
      background:#fff;
      border:2px solid #d1fae5;
    }
    .practice-answer-prefix{font-size:17px;font-weight:950;color:#334155;margin-right:2px}
    .practice-unit-field{
      display:flex;
      align-items:center;
      gap:6px;
      padding:5px 8px;
      border-radius:14px;
      border:2px solid transparent;
      background:#fff;
    }
    .practice-unit-field.cm-field{border-color:#fecaca;background:#fff7f7}
    .practice-unit-field.mm-field{border-color:#bfdbfe;background:#f7fbff}
    .practice-unit-name{font-size:20px;font-weight:950;white-space:nowrap;letter-spacing:.01em}
    .cm-field .practice-unit-name{color:#b91c1c}
    .mm-field .practice-unit-name{color:#1d4ed8}
    .practice-input{
      width:82px;
      height:54px;
      border:3px solid #94a3b8;
      border-radius:12px;
      background:#fff;
      text-align:center;
      font-size:29px;
      font-weight:950;
      line-height:1;
      color:#0f172a;
      outline:none;
      appearance:textfield;
      -moz-appearance:textfield;
    }
    .practice-input::-webkit-outer-spin-button,.practice-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .practice-input::placeholder{color:#94a3b8;opacity:1}
    .practice-input.cm-input{border-color:#ef4444;background:#fff}
    .practice-input.mm-input{border-color:#2563eb;background:#fff}
    .practice-input.cm-input:focus{box-shadow:0 0 0 5px rgba(239,68,68,.14);border-color:#dc2626}
    .practice-input.mm-input:focus{box-shadow:0 0 0 5px rgba(37,99,235,.14);border-color:#1d4ed8}
    .practice-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
    .practice-check-btn{
      min-height:46px;
      border-radius:14px;
      padding:10px 22px;
      font-size:16px;
      box-shadow:0 7px 14px rgba(15,118,110,.18);
    }
    .practice-hint-btn{
      min-height:42px;
      border:2px solid #cbd5e1;
      border-radius:14px;
      background:#fff;
      color:#475569;
      padding:8px 13px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
    }
    .practice-hint-btn:disabled{opacity:.42;cursor:default}
    .practice-zero-note{font-size:11px;font-weight:850;color:#64748b}
    .practice-zero-note[hidden]{display:none}
    .practice-feedback{
      min-height:22px;
      max-width:680px;
      font-size:13px;
      line-height:1.35;
      font-weight:900;
      color:#b45309;
      text-align:center;
    }
    .practice-feedback.ok{font-size:15px;color:#047857}
    .app.practice-mode .stage{margin-top:0}
    @media (max-width:700px){
      .practice-answer-box{gap:6px;padding:7px}
      .practice-answer-prefix{width:100%;text-align:center;font-size:15px}
      .practice-unit-field{padding:4px 6px}
      .practice-unit-name{font-size:17px}
      .practice-input{width:68px;height:50px;font-size:26px}
      .practice-check-btn{width:min(280px,100%)}
    }

    .app.practice-mode .practice-strip{animation:answerReady .32s ease-out both}
    .app.practice-mode .success-sub{display:none}
    @keyframes answerReady{from{opacity:.72;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <div class="app">
    <div class="bar">
      <div class="mode-zone">
        <div class="mode-tabs" role="group" aria-label="けいさんの しゅるい">
          <button class="mode-tab active" data-mode="+" id="modeAddBtn">たしざん</button>
          <button class="mode-tab" data-mode="−" id="modeSubBtn">ひきざん</button>
          <button class="mode-tab" data-mode="差" id="modeDiffBtn">ちがい</button>
        </div>
      </div>

      <div class="operand-zone">
        <div class="side">
          <div class="side-title">①</div>
          <div class="length-card">
            <div class="operand-name">① の ながさ</div>
            <div class="length-preview" id="leftPreview"></div>
            <div class="steppers" id="leftSteppers"></div>
          </div>
        </div>

        <div class="op-wrap">
          <button class="btn op-btn" id="opBtn" aria-label="けいさんの きごう">＋</button>
          <div class="badge" id="modeBadge">たしざん</div>
        </div>

        <div class="side right">
          <div class="length-card">
            <div class="operand-name">② の ながさ</div>
            <div class="length-preview" id="rightPreview"></div>
            <div class="steppers" id="rightSteppers"></div>
          </div>
          <div class="side-title">②</div>
        </div>
      </div>

      <div class="tools-zone">
        <div class="action-row">
          <button class="action" id="animateBtn">▶ やってみる</button>
          <button class="btn secondary action" id="resetBtn" aria-label="はじめにもどす" title="はじめにもどす">↺ はじめにもどす</button>
          <button class="sound-btn" id="soundBtn" title="おとの オン・オフ">🔊</button>
        </div>
        <details class="display-settings">
          <summary>⚙</summary>
          <div class="settings-caption">まなびかた</div>
          <div class="preset-row settings-levels">
            <button class="preset-btn" id="presetBasicBtn">① きほん</button>
            <button class="preset-btn challenge" id="presetChallengeBtn">★ チャレンジ 10mm→1cm</button>
          </div>
          <div class="settings-caption">かず・ひょうじ</div>
          <div class="settings-row"><button class="value-edit-btn" id="valueEditBtn">✏ かずを かえる</button><button class="undo-value-btn" id="undoValueBtn" disabled>↩ ひとつ もどす</button></div>
          <label class="setting-check"><input type="checkbox" id="joinFirstToggle"><span>まず2ほんを つないで みる</span></label>
          <div class="zoom-row">
            <button class="btn small" id="scaleDownBtn">－</button>
            <div id="scaleDisplay" style="min-width:46px;text-align:center;font-size:12px;font-weight:900;padding:3px 5px;border-radius:8px;background:#f8fafc;border:1px solid #cbd5e1;color:#1f2937;">100%</div>
            <button class="btn small" id="scaleUpBtn">＋</button>
          </div>
        </details>
      </div>
    </div>

    <div class="concept-strip">
      <div class="concept-main">
        <div class="question-equation" id="questionEquation" aria-live="polite"></div>
        <div class="learning-meta"><span class="practice-pill" id="practicePill" hidden></span><span class="practice-status" id="practiceStatus" hidden></span></div>
        <div class="hint-line" id="hintLine" aria-live="polite"></div>
      </div>
      <div class="unit-rule" id="unitRule" aria-label="cmとmmの かえかた">
        <span class="unit-chip cm" id="cmRule">cm の なかま</span>
        <span>と</span>
        <span class="unit-chip mm" id="mmRule">mm の なかま</span>
        <span class="equiv-chip" id="equivChip" hidden><span class="cm-eq">■ 1cm</span><span>＝</span><span class="mm-eq">● 10mm</span></span>
      </div>
      <div class="practice-strip" id="practiceStrip" hidden>
        <div class="practice-title">こたえを いれよう</div>
        <div class="practice-answer-box" aria-label="こたえを いれる">
          <span class="practice-answer-prefix">こたえ</span>
          <label class="practice-unit-field cm-field">
            <input class="practice-input cm-input" id="practiceCmInput" type="number" inputmode="numeric" min="0" max="25" autocomplete="off" placeholder="□" aria-label="cmの こたえ">
            <span class="practice-unit-name">cm</span>
          </label>
          <label class="practice-unit-field mm-field">
            <input class="practice-input mm-input" id="practiceMmInput" type="number" inputmode="numeric" min="0" max="9" autocomplete="off" placeholder="□" aria-label="mmの こたえ">
            <span class="practice-unit-name">mm</span>
          </label>
        </div>
        <div class="practice-actions">
          <button class="practice-check-btn" id="practiceCheckBtn" type="button">✓ こたえあわせ</button>
          <button class="practice-hint-btn" id="practiceHintBtn" type="button">💡 うごきで ヒント</button>
        </div>
        <span class="practice-zero-note" id="practiceZeroNote">ないほうは からっぽでOK</span>
        <span class="practice-feedback" id="practiceFeedback" aria-live="polite"></span>
      </div>
    </div>

    <div class="stage">
      <div class="now-doing" id="nowDoing" hidden aria-live="polite"></div>
      <svg id="svg" viewBox="0 0 2200 760" aria-label="ながさの たしざん・ひきざん">
        <defs>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".14"/>
          </filter>
          <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffe55b"/>
            <stop offset="100%" stop-color="#facc15"/>
          </linearGradient>
        </defs>

        <g id="sceneRoot">
          <g id="labels" font-family="system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
          </g>

          <g id="tracks"></g>
          <g id="units"></g>
          <g id="resultLayer"></g>
        </g>
      </svg>
    </div>

    <div class="footer">
      <div class="equation" id="equation"></div>
      <div class="result" id="resultText"></div>
      <div class="tiny"><strong>ポイント：</strong> <span class="cm">cm は cm どうし</span>、<span class="mm">mm は mm どうし</span>で けいさんしよう。</div>
    </div>
  </div>

<script>
/* =====================================================
   長さの加法アニメーション — 新仕様
   ===================================================== */
(() => {
  'use strict';

  /* ── 定数 ── */
  const PX   = 17;          // 1mm = 17px
  const CMpx = 10 * PX;    // 1cm = 170px
  const LX   = 60;          // 左の線 X
  const RX   = 1200;        // 互換用（実際の右位置は getRX() で自動調整）
  const TY   = 50;          // 上段 Y（左の線）
  const CX   = 60;          // まとめる場所 X
  const VB_W = 2200;        // SVG viewBox 幅
  const NS   = 'http://www.w3.org/2000/svg';
  const C    = { cm:'#ef4444', mm:'#2563eb' };

  // 左の線が7cm以上のとき上下レイアウトに切り替える
  const LAYOUT_THRESHOLD_CM = 7;
  const TY2      = 190;   // 右の線のY（上下レイアウト時）
  const CY_SIDE  = 210;   // まとめる場所 Y（横並びレイアウト）
  const CY_STACK = 340;   // まとめる場所 Y（上下レイアウト時）

  // viewBox高さ
  const VB_H_SIDE  = 560;
  const VB_H_STACK = 700;
  // 減法専用レイアウト定数
  const SUB_TY_TOP = 50;   // 上段（被減数）Y
  const SUB_TY_BOT = 210;  // 下段（減数）Y
  const VB_H_SUB   = 560;  // 減法viewBox高さ（まとめる場所不要で低め）

  // 現在のレイアウトに応じた値を返すヘルパー（加法用）
  const isStack = () => state.op === '−' || state.op === '差' || state.left.cm >= LAYOUT_THRESHOLD_CM;
  const getRX   = () => isStack() ? LX : LX + totMm(state.left) * PX + 220;
  const getRY   = () => isStack() ? TY2 : TY;
  const getCY   = () => isStack() ? CY_STACK : CY_SIDE;
  // 減法の右側説明パネル。長い線でも重ならず、必ずviewBox内へ収める。
  const getSubPanelX = () => Math.max(1400, LX + Math.max(totMm(state.left), totMm(state.right)) * PX + 360);

  // まとめる場所の線の合計幅(px)を計算し、はみ出す場合のスケールを返す
  // 合計16cmを超えると CX + totalMm*PX > VB_W になり得る
  function calcScale() {
    const totalMm = (state.left.cm + state.right.cm) * 10
                  + state.left.mm + state.right.mm;
    const endX = CX + totalMm * PX;
    const margin = 80; // 右端に少し余白
    const available = VB_W - margin;
    // 合計が18cmを超えたら縮小（18cm = 3060px、CX=60を足すと3120 > 2200）
    const MAX_FREE_CM = 18;
    const maxFreeEndX = CX + MAX_FREE_CM * CMpx; // 18cmまでは縮小しない
    if (endX <= maxFreeEndX) return 1;
    return available / endX;
  }

  /* ── state ── */
  const state = { left:{cm:3,mm:4}, right:{cm:2,mm:3}, op:'+', animating:false, manualScale:1.0, currentPreset:'basic', practiceIndex:0, isPractice:false, practiceRound:0, practiceSolved:false, practiceTier:'core', practiceFocus:'', directGroup:true, adaptiveReviewQueue:[], adaptivePrepared:false, currentProblemAdaptive:false, currentProblemTag:'', currentProblemWrong:0, currentProblemHint:false, practiceStats:{wrong:0,hints:0,independent:0,weaknesses:{},errorPatterns:{}} };

  /* ── DOM refs ── */
  const svg         = document.getElementById('svg');
  const sceneRoot   = document.getElementById('sceneRoot');
  const gTracks     = document.getElementById('tracks');
  const gUnits      = document.getElementById('units');
  const gResult     = document.getElementById('resultLayer');
  const leftPreview = document.getElementById('leftPreview');
  const rightPreview= document.getElementById('rightPreview');
  const leftSteppers= document.getElementById('leftSteppers');
  const rightSteppers=document.getElementById('rightSteppers');
  const opBtn       = document.getElementById('opBtn');
  const modeBadge   = document.getElementById('modeBadge');
  const animateBtn  = document.getElementById('animateBtn');
  const resetBtn    = document.getElementById('resetBtn');
  const equation    = document.getElementById('equation');
  const resultText  = document.getElementById('resultText');
  const footerPanel = document.querySelector('.footer');
  const questionEquation = document.getElementById('questionEquation');
  const cmRule = document.getElementById('cmRule');
  const mmRule = document.getElementById('mmRule');
  const unitRule = document.getElementById('unitRule');
  const presetBasicBtn = document.getElementById('presetBasicBtn');
  const presetChallengeBtn = document.getElementById('presetChallengeBtn');
  const hintLine = document.getElementById('hintLine');
  const valueEditBtn = document.getElementById('valueEditBtn');
  const undoValueBtn = document.getElementById('undoValueBtn');
  const joinFirstToggle = document.getElementById('joinFirstToggle');
  const equivChip = document.getElementById('equivChip');
  const nowDoing = document.getElementById('nowDoing');
  const practicePill = document.getElementById('practicePill');
  const practiceStatus = document.getElementById('practiceStatus');
  const practiceStrip = document.getElementById('practiceStrip');
  const practiceCmInput = document.getElementById('practiceCmInput');
  const practiceMmInput = document.getElementById('practiceMmInput');
  const practiceCheckBtn = document.getElementById('practiceCheckBtn');
  const practiceHintBtn = document.getElementById('practiceHintBtn');
  const practiceZeroNote = document.getElementById('practiceZeroNote');
  const practiceFeedback = document.getElementById('practiceFeedback');
  const appEl = document.querySelector('.app');
  const undoStack = [];
  const modeTabs = [...document.querySelectorAll('.mode-tab')];

  /* ── 音声エンジン ── */
  let soundOn = true;
  const soundBtn = document.getElementById('soundBtn');

  function updateSoundBtn() {
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.classList.toggle('off', !soundOn);
    soundBtn.title = soundOn ? 'おとを きる' : 'おとを だす';
  }
  soundBtn.addEventListener('click', () => { soundOn = !soundOn; updateSoundBtn(); });
  updateSoundBtn();

  // AudioContext（初回インタラクションで生成）
  let _ctx = null;
  let _masterGain = null;

  function getCtx() {
    if (!_ctx) {
      _ctx = new (window.AudioContext || window.webkitAudioContext)();
      _masterGain = _ctx.createGain();
      _masterGain.connect(_ctx.destination);
    }
    if (_ctx.state === 'suspended') _ctx.resume();
    return _ctx;
  }

  // 全効果音を即時停止
  function stopAllSound() {
    if (_masterGain) {
      _masterGain.gain.setValueAtTime(0, _ctx.currentTime);
      // 少し後に戻す（次の操作に備えて）
      setTimeout(() => { if (_masterGain) _masterGain.gain.setValueAtTime(1, _ctx.currentTime); }, 200);
    }
  }

  // 基本的なビープ音を生成
  function beep({ freq=440, type='sine', vol=0.18, dur=0.12, attack=0.01, decay=0.06 }={}) {
    if (!soundOn) return;
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(_masterGain);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + attack);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + attack + decay + dur);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + attack + decay + dur + 0.05);
  }

  // コイン音（セグメント移動時）
  function playCoin() {
    beep({ freq:880, type:'triangle', vol:0.15, dur:0.06, attack:0.005, decay:0.09 });
  }

  // cmグループ移動音（少し太め）
  function playCm() {
    beep({ freq:440, type:'triangle', vol:0.18, dur:0.08, attack:0.008, decay:0.1 });
    setTimeout(()=>beep({ freq:550, type:'triangle', vol:0.12, dur:0.05, attack:0.005, decay:0.07 }), 50);
  }

  // mmグループ移動音（軽め高め）
  function playMm() {
    beep({ freq:660, type:'sine', vol:0.13, dur:0.05, attack:0.005, decay:0.07 });
  }

  // テキスト出現音
  function playPop() {
    beep({ freq:523, type:'sine', vol:0.14, dur:0.08, attack:0.01, decay:0.12 });
  }

  // 繰り上がり点滅音
  function playBlink() {
    beep({ freq:740, type:'square', vol:0.08, dur:0.04, attack:0.005, decay:0.05 });
  }

  // ぶー（操作ブロック時）
  function playBuzz() {
    beep({ freq:120, type:'sawtooth', vol:0.25, dur:0.30, attack:0.01, decay:0.25 });
    setTimeout(()=>beep({ freq:100, type:'sawtooth', vol:0.18, dur:0.20, attack:0.01, decay:0.20 }), 120);
  }

  // 単位グループを一瞬光らせる（移動着地後に呼ぶ）
  function flashUnit(g, color) {
    const paths = [...g.querySelectorAll('path')];
    const lines = [...g.querySelectorAll('line')];
    const origSw  = paths[0]?.getAttribute('stroke-width') ?? '7';
    const origFilt = paths[0]?.getAttribute('filter') ?? 'none';

    // 光らせる
    [...paths, ...lines].forEach(el => {
      el.setAttribute('stroke-width', String(Number(origSw) + 7));
      el.setAttribute('filter', 'url(#glowFilter)');
    });

    // 300ms 後にフェードアウトして元に戻す
    setTimeout(() => {
      [...paths, ...lines].forEach(el => {
        el.style.transition = 'stroke-width 250ms ease, opacity 250ms ease';
        el.setAttribute('stroke-width', origSw);
        el.removeAttribute('filter');
      });
    }, 300);
  }

  // 数字のみ読み上げ — SpeechSynthesisは遅延が大きいので
  // Web Audioで数字に対応した音程ビープを即時再生する
  const NUMBER_FREQS = [
    262, 294, 330, 349, 392, 440, 494, 523, 587, 659, 698 // 0〜10
  ];
  function speakNumber(n) {
    if (!soundOn) return;
    const freq = NUMBER_FREQS[Math.min(n, NUMBER_FREQS.length - 1)] || 440;
    beep({ freq, type:'sine', vol:0.22, dur:0.13, attack:0.008, decay:0.10 });
  }

  // 完成ファンファーレ
  function playFanfare() {
    if (!soundOn) return;
    const ctx = getCtx();
    const notes = [
      {freq:523.25, t:0},
      {freq:659.25, t:0.12},
      {freq:783.99, t:0.24},
      {freq:1046.5, t:0.38},
    ];
    notes.forEach(({freq, t})=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + t);
      gain.gain.setValueAtTime(0, ctx.currentTime + t);
      gain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.28);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.32);
    });
  }

  // ── 読み上げ管理 ──
  // 中断用トークン：stopSpeech() だけが上げる。speakAndWait は読み取り専用で使う
  let _ttsGen = 0;
  let _ttsResolve = null; // 現在待機中の speakAndWait の resolve
  let _ttsDelayTimer = null; // 80ms遅延タイマー（stopSpeech でキャンセル）
  let _ttsEstTimer = null;   // 推定待機タイマー（stopSpeech でキャンセル）

  function getJaVoice() {
    if (!window.speechSynthesis) return null;
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v=>v.lang==='ja-JP') || voices.find(v=>v.lang.startsWith('ja')) || null;
  }

  // 読み上げを即時停止し、待機中の speakAndWait を即 resolve して解放する
  function stopSpeech() {
    _ttsGen++;
    if (_ttsDelayTimer) { clearTimeout(_ttsDelayTimer); _ttsDelayTimer = null; }
    if (_ttsEstTimer)   { clearTimeout(_ttsEstTimer);   _ttsEstTimer = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (_ttsResolve) { _ttsResolve(); _ttsResolve = null; }
  }

  // 読み上げが終わるまで待つ Promise
  // ・stopSpeech() が呼ばれたら即 resolve（中断）
  // ・Chrome の「cancel 直後 onend 誤爆」を避けるため speak() は 80ms 遅延
  // ・フォールバック: maxMs 後に強制 resolve
  function speakAndWait(text, maxMs=5000) {
    return new Promise(resolve => {
      if (!soundOn || !window.speechSynthesis) { resolve(); return; }

      const myGen = _ttsGen;

      let settled = false;
      let timer = null;

      function done(reason) {
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        _ttsResolve = null;
        resolve();
      }

      _ttsResolve = () => done('stopSpeech');

      _ttsDelayTimer = setTimeout(() => {
        _ttsDelayTimer = null;
        if (myGen !== _ttsGen) { done('interrupted'); return; }

        const utt = new SpeechSynthesisUtterance(text);
        utt.lang   = 'ja-JP';
        utt.rate   = 1.0;
        utt.pitch  = 1.1;
        utt.volume = 0.9;
        const jaVoice = getJaVoice();
        if (jaVoice) utt.voice = jaVoice;

        // onend が発火すれば理想だが、Chrome(file://)では発火しないため
        // テキスト長から読み上げ時間を推定して待つ
        // 実測: 約160ms/文字 + 余裕500ms
        const estimatedMs = Math.min(maxMs, Math.max(1200, text.length * 160 + 500));
        utt.onend = () => done('onend');
        // onerror は無視（interrupted が誤爆するため）

        _ttsEstTimer = setTimeout(() => { _ttsEstTimer = null; done('estimated'); }, estimatedMs);
        timer = _ttsEstTimer;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utt);
      }, 80);
    });
  }

  // voiceschanged で音声リストをプリロード
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.addEventListener?.('voiceschanged', () => {
      window.speechSynthesis.getVoices();
    });
  }
  const el = (tag, attrs={}) => {
    const n = document.createElementNS(NS, tag);
    for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, String(v));
    return n;
  };
  // sleep：state.animating が false になったら即 resolve（リセット時に中断）
  function sleep(ms) {
    return new Promise(r => {
      const t = setTimeout(r, ms);
      const check = setInterval(() => {
        if (!state.animating) { clearTimeout(t); clearInterval(check); r(); }
      }, 30);
      // 正常終了時もインターバルをクリア
      setTimeout(() => clearInterval(check), ms + 50);
    });
  }

  /* ── 単純計算 ── */
  const totMm  = s => s.cm*10 + s.mm;
  const resMm  = () => { const a=totMm(state.left),b=totMm(state.right); return state.op==='+'?a+b:a-b; };

  /* ── UI 更新 ── */
  function updateModeUI() {
    opBtn.textContent = state.op === '+' ? '＋' : state.op === '−' ? '−' : '↔';
    modeBadge.textContent = state.op === '+' ? '🍀 たしざん' : state.op === '−' ? '🌱 ひきざん' : '🔍 ちがい';
    modeTabs.forEach(btn => {
      const active = btn.dataset.mode === state.op;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    presetBasicBtn.textContent = '① きほん';
    presetChallengeBtn.textContent = state.op === '+' ? '★ チャレンジ 10mm→1cm' : '② くりさがり';
    presetChallengeBtn.classList.toggle('extension', state.op === '+');
    animateBtn.textContent = state.isPractice ? '💡 うごきで ヒント' : (state.op === '差' ? '🔍 ちがいを みつける' : '▶ やってみる');
    joinFirstToggle.checked = !state.directGroup;
    updatePresetUI();
  }

  function updatePresetUI() {
    const basicActive = state.currentPreset === 'basic' && !state.isPractice;
    const challengeActive = state.currentPreset === 'challenge' && !state.isPractice;
    presetBasicBtn.classList.toggle('active', basicActive);
    presetChallengeBtn.classList.toggle('active', challengeActive);
    presetBasicBtn.setAttribute('aria-pressed', basicActive ? 'true' : 'false');
    presetChallengeBtn.setAttribute('aria-pressed', challengeActive ? 'true' : 'false');
    practicePill.hidden = !state.isPractice;
    practicePill.classList.toggle('review', !!state.currentProblemAdaptive);
    if (state.isPractice) {
      if (state.currentProblemAdaptive) {
        const baseLen = (PROBLEM_BANKS.core[state.op] || []).length;
        const reviewNo = Math.max(1, state.practiceRound - baseLen);
        practicePill.textContent = `たしかめ ${reviewNo}/${Math.max(1,state.adaptiveReviewQueue.length)}`;
      } else if (state.practiceTier === 'advanced') {
        const label = state.op === '+' ? '★ チャレンジ' : 'くりさがり';
        practicePill.textContent = `${label} ${state.practiceRound}/${getPracticeBank('advanced', state.op).length}`;
      } else {
        const baseLen = (PROBLEM_BANKS.core[state.op] || []).length;
        practicePill.textContent = `れんしゅう ${Math.min(state.practiceRound,baseLen)}/${baseLen}`;
      }
    } else {
      practicePill.textContent = 'れんしゅう';
    }
    practiceStatus.hidden = !state.isPractice || state.practiceTier === 'advanced';
    if (!practiceStatus.hidden) {
      practiceStatus.textContent = state.currentProblemAdaptive
        ? 'もういちど たしかめちゅう'
        : `じぶんでできた ${state.practiceStats.independent}こ`;
    }
  }

  function needsConversion() {
    const L = state.left, R = state.right;
    if (state.op === '+') return L.mm + R.mm >= 10;
    if (state.op === '−') return totMm(L) >= totMm(R) && L.mm < R.mm;
    if (state.op === '差') {
      const long = totMm(L) >= totMm(R) ? L : R;
      const short = long === L ? R : L;
      return long.mm < short.mm;
    }
    return false;
  }

  function updateEquivalence() {
    // 練習中は最初から変換ルールを見せず、誤答またはヒント使用後だけ出す。
    const show = needsConversion() && (!state.isPractice || state.currentProblemWrong > 0 || state.currentProblemHint);
    equivChip.hidden = !show;
    unitRule.classList.toggle('show-equivalence', show);
  }

  function updatePracticeUI() {
    practiceStrip.hidden = !state.isPractice;
    appEl.classList.toggle('practice-mode', state.isPractice);
    if (!state.isPractice) {
      practiceZeroNote.hidden = true;
      practiceHintBtn.disabled = false;
      return;
    }
    const solved = !!state.practiceSolved;
    practiceCheckBtn.disabled = solved;
    practiceHintBtn.disabled = solved || state.animating;
    practiceCmInput.disabled = solved;
    practiceMmInput.disabled = solved;
    // 0の単位を表示しないルールは全問題で共通。条件表示にして答えの手掛かりにしない。
    practiceZeroNote.hidden = false;
  }

  function resetPracticeInputs() {
    practiceCmInput.value = '';
    practiceMmInput.value = '';
    practiceFeedback.textContent = '';
    practiceFeedback.className = 'practice-feedback';
    practiceCheckBtn.disabled = false;
    practiceHintBtn.disabled = false;
    practiceCmInput.disabled = false;
    practiceMmInput.disabled = false;
    state.practiceSolved = false;
  }

  function expectedPracticeAnswer() {
    const lm = totMm(state.left), rm = totMm(state.right);
    const total = state.op === '+' ? lm + rm : state.op === '差' ? Math.abs(lm - rm) : lm - rm;
    const safe = Math.max(0, total);
    return {cm:Math.floor(safe/10), mm:safe%10};
  }


  // 固定問題は、数字の置換ではなく「つまずきの種類」が変わるように順序設計する。
  // たし算の core は教科書の本線として繰り上がりなし。10mm→1cm は advanced（発展）。
  const PROBLEM_BANKS = {
    core: {
      '+': [
        // ① 最小構成：両方の単位をそのままcmはcm、mmはmmで足す
        {left:{cm:2,mm:3}, right:{cm:1,mm:4}, tag:'basic', focus:'まずは ■cmどうし・●mmどうし'},

  // ひき算・ちがいは、まず変換なしを練習してから、くり下がりへ進む。

  // つまずいた種類だけを最後に1〜3問追加する「たしかめ問題」。

  // 誤答の「種類」に合わせた補修問題。数字ではなく、考え方の穴を狙って出す。

      wrongOperation:{left:{cm:6,mm:7},right:{cm:2,mm:3},focus:'たしかめ：いまは「ひきざん」',reviewPattern:'wrongOperation'},

      cmPart:{left:{cm:8,mm:7},right:{cm:3,mm:2},focus:'たしかめ：■cm の けいさん',reviewPattern:'cmPart'},
      mmPart:{left:{cm:7,mm:9},right:{cm:2,mm:3},focus:'たしかめ：●mm の けいさん',reviewPattern:'mmPart'},
      generic:{left:{cm:7,mm:9},right:{cm:3,mm:4},focus:'たしかめ：■cmどうし・●mmどうし',reviewPattern:'generic'},
    },
    '差': {
      unitSwap:{left:{cm:6,mm:8},right:{cm:3,mm:3},focus:'たしかめ：■cm と ●mm の いれる ばしょ',reviewPattern:'unitSwap'},
      wrongOperation:{left:{cm:6,mm:7},right:{cm:2,mm:3},focus:'たしかめ：「ちがい」は ながいほう−みじかいほう',reviewPattern:'wrongOperation'},
      equalMmZero:{left:{cm:8,mm:4},right:{cm:3,mm:4},focus:'たしかめ：おなじ●mmなら のこらない',reviewPattern:'equalMmZero'},
      borrowForgot:{left:{cm:7,mm:2},right:{cm:4,mm:9},focus:'たしかめ：ながいほうの■1cm → ●10mm',reviewPattern:'borrowForgot'},
      cmPart:{left:{cm:7,mm:8},right:{cm:3,mm:3},focus:'たしかめ：■cm の ちがい',reviewPattern:'cmPart'},
      mmPart:{left:{cm:7,mm:9},right:{cm:3,mm:4},focus:'たしかめ：●mm の ちがい',reviewPattern:'mmPart'},
      generic:{left:{cm:7,mm:5},right:{cm:3,mm:1},focus:'たしかめ：ながいほうから みじかいほうを ひく',reviewPattern:'generic'},
    }
  };

  const ERROR_PATTERN_LABELS = {
    unitSwap:'■cm と ●mm の いれる ばしょ',
    wrongOperation:'けいさんの しゅるい',
    zeroMm:'●mm がないとき',
    equalMmZero:'おなじ●mmを ひくと のこらない',
    carryForgot:'●10mm → ■1cm',
    borrowForgot:'■1cm → ●10mm のあとの■cm',
    cmPart:'■cm のなかま',
    mmPart:'●mm のなかま',
    generic:'cmはcm、mmはmm'
  };

  function resetAdaptiveSession() {
    state.adaptiveReviewQueue = [];
    state.adaptivePrepared = false;
    state.currentProblemAdaptive = false;
    state.currentProblemTag = '';
    state.currentProblemWrong = 0;
    state.currentProblemHint = false;
    state.practiceStats = {wrong:0,hints:0,independent:0,weaknesses:{},errorPatterns:{}};
  }

  function addWeakness(tag, weight=1) {
    if (!tag) tag = 'basic';
    const w = state.practiceStats.weaknesses;
    w[tag] = (w[tag] || 0) + weight;
  }

  function addErrorPattern(pattern, weight=1) {
    if (!pattern) pattern = 'generic';
    const e = state.practiceStats.errorPatterns || (state.practiceStats.errorPatterns = {});
    e[pattern] = (e[pattern] || 0) + weight;
  }

  function recordPracticeWrong(pattern='generic') {
    if (!state.isPractice || state.practiceSolved) return;
    state.currentProblemWrong += 1;
    state.practiceStats.wrong += 1;
    // 問題タイプより、実際に起きた誤答パターンを強めに記録する。
    addWeakness(state.currentProblemTag, 1);
    addErrorPattern(pattern, state.currentProblemWrong === 1 ? 3 : 2);
  }

  function recordPracticeHint() {
    if (!state.isPractice || state.practiceSolved || state.currentProblemHint) return;
    state.currentProblemHint = true;
    state.practiceStats.hints += 1;
    addWeakness(state.currentProblemTag, 1);
  }

  function prepareAdaptiveReviewQueue() {
    if (state.adaptivePrepared || state.practiceTier !== 'core') return;
    state.adaptivePrepared = true;
    const stats = state.practiceStats;
    let count = 0;
    if (stats.wrong >= 2 || stats.hints >= 2) count = 1;
    if (stats.wrong >= 4 || stats.hints >= 3 || stats.independent <= 3) count = 2;
    if (stats.wrong >= 6 || stats.hints >= 4 || stats.independent <= 2) count = 3;
    if (!count) return;

    const selected = [];
    const used = new Set();
    const allowedCoreTags = new Set((PROBLEM_BANKS.core[state.op] || []).map(p=>p.tag));
    const addCandidate = (p, key, tag='basic') => {
      if (!p || used.has(key) || selected.length >= count) return;
      used.add(key);
      selected.push({...p, tag, adaptive:true, adaptiveKey:key});
    };

    // 1. 「何をどう間違えたか」を最優先。
    const rankedPatterns = Object.entries(stats.errorPatterns || {})
      .sort((a,b)=>b[1]-a[1])
      .map(([pattern])=>pattern);
    rankedPatterns.forEach(pattern => {
      const p = DIAGNOSTIC_REVIEW_PROBLEMS[state.op]?.[pattern];
      addCandidate(p, `pattern:${pattern}`, `diag_${pattern}`);
    });

    // 2. 誤答パターンだけで足りなければ、苦戦した問題タイプを補う。
    const rankedTags = Object.entries(stats.weaknesses)
      .sort((a,b)=>b[1]-a[1])
      .map(([tag])=>tag);
    rankedTags.forEach(tag => {
      if (!allowedCoreTags.has(tag)) return;
      const p = REVIEW_PROBLEMS[state.op]?.[tag];
      addCandidate(p, `tag:${tag}`, tag);
    });

    // 3. 最後の保険。今の基本範囲にある種類だけを最大3問まで。
    Object.entries(REVIEW_PROBLEMS[state.op] || {}).forEach(([tag,p])=>{
      if (!allowedCoreTags.has(tag)) return;
      addCandidate(p, `tag:${tag}`, tag);
    });

    state.adaptiveReviewQueue = selected;
  }

  function getPracticeBank(tier=state.practiceTier, op=state.op) {
    const bank = PROBLEM_BANKS[tier]?.[op];
    if (bank && bank.length) {
      if (tier === 'core' && op === state.op && state.adaptiveReviewQueue.length) {
        return [...bank, ...state.adaptiveReviewQueue];
      }
      return bank;
    }
    return PROBLEM_BANKS.core[op] || PROBLEM_BANKS.core['+'];
  }

  function loadPracticeProblem(tier='core', resetIndex=false) {
    stopCurrentAnimation();
    clearUndo();
    state.practiceTier = tier;
    if (resetIndex) {
      state.practiceIndex = 0;
      if (tier === 'core') resetAdaptiveSession();
    }
    const bank = getPracticeBank(tier, state.op);
    const idx = state.practiceIndex % bank.length;
    const problem = bank[idx];
    state.practiceIndex = idx + 1;
    state.practiceRound = idx + 1;
    state.left = {...problem.left};
    state.right = {...problem.right};
    state.practiceFocus = problem.focus || '';
    state.currentProblemAdaptive = !!problem.adaptive;
    state.currentProblemTag = problem.tag || 'basic';
    state.currentProblemWrong = 0;
    state.currentProblemHint = false;
    state.currentPreset = tier === 'advanced' ? 'challenge' : 'basic';
    state.isPractice = true;
    state.practiceSolved = false;
    state.manualScale = 1;
    updateScaleDisplay();
    renderAll();
    resetPracticeInputs();
    if (state.currentProblemAdaptive) {
      const pattern = problem.reviewPattern || (problem.adaptiveKey || '').replace('pattern:','');
      const label = ERROR_PATTERN_LABELS[pattern];
      practiceFeedback.textContent = label ? `ここだけ もう1もん。${label}を たしかめよう。` : 'ここだけ もう1もん たしかめよう。';
      practiceFeedback.className = 'practice-feedback hint';
    }
  }

  function toCmMm(totalMm) {
    const t = Math.max(0, Math.abs(totalMm));
    return {cm:Math.floor(t/10), mm:t%10};
  }

  function classifyPracticeError(cm, mm, exp) {
    const L = state.left, R = state.right;
    const cmOK = cm === exp.cm, mmOK = mm === exp.mm;

    if (cm === exp.mm && mm === exp.cm && !(exp.cm === exp.mm)) {
      return {pattern:'unitSwap', message:'■cm と ●mm の いれる ばしょを みなおそう。'};
    }

    // いまの演算とは別の演算をした形を拾う。
    const lm = totMm(L), rm = totMm(R);
    const alt = state.op === '+' ? toCmMm(lm-rm) : toCmMm(lm+rm);
    if (cm === alt.cm && mm === alt.mm) {
      const word = state.op === '+' ? 'たしざん' : state.op === '−' ? 'ひきざん' : '「ちがい」';
      return {pattern:'wrongOperation', message:`いまは ${word} だよ。けいさんを もういちど みよう。`};
    }

    if (state.op === '+' && L.mm + R.mm >= 10) {
      const rem = (L.mm + R.mm) % 10;
      const forgotCarryCm = L.cm + R.cm;
      if (cm === forgotCarryCm && mm === rem) {
        return {pattern:'carryForgot', message:'10mmからできた ■1cm を、cmのなかまに たすのを わすれていないかな？'};
      }
    }

    if (state.op === '−' && totMm(L) >= totMm(R) && L.mm < R.mm) {
      const borrowedMm = L.mm + 10 - R.mm;
      const forgotBorrowCm = L.cm - R.cm;
      if (cm === forgotBorrowCm && mm === borrowedMm) {
        return {pattern:'borrowForgot', message:'■1cm を ●10mm に かえたから、cmは1 ちいさくして ひこう。'};
      }
    }

    if (state.op === '差') {
      const long = totMm(L) >= totMm(R) ? L : R;
      const short = long === L ? R : L;
      if (long.mm < short.mm) {
        const borrowedMm = long.mm + 10 - short.mm;
        const forgotBorrowCm = long.cm - short.cm;
        if (cm === forgotBorrowCm && mm === borrowedMm) {
          return {pattern:'borrowForgot', message:'ながいほうの ■1cm を ●10mm に かえたから、cmも1 ちいさくしよう。'};
        }
      }
    }

    // mmがない場合や同じmmは、低学年で起きやすい境界の誤りとして分ける。
    if (exp.mm > 0 && mm === 0 && (L.mm === 0 || R.mm === 0)) {
      return {pattern:'zeroMm', message:'●mm が ないほうが あっても、もうひとつの ●mm は そのままだよ。'};
    }
    if (exp.mm === 0 && mm !== 0 && L.mm === R.mm && state.op !== '+') {
      return {pattern:'equalMmZero', message:'おなじ ●mm を ひくと、●mm は のこらないよ。'};
    }

    if (!cmOK && mmOK) return {pattern:'cmPart', message:'●mm は できているよ。■cm だけ もういちど みよう。'};
    if (cmOK && !mmOK) return {pattern:'mmPart', message:'■cm は できているよ。●mm だけ もういちど みよう。'};
    return {pattern:'generic', message:'■cm は ■cmどうし、●mm は ●mmどうし。もういちど みよう。'};
  }

  function checkPracticeAnswer() {
    if (!state.isPractice) return;
    if (state.animating) { showBlockToast(); return; }
    const cmRaw = practiceCmInput.value.trim();
    const mmRaw = practiceMmInput.value.trim();
    if (cmRaw === '' && mmRaw === '') {
      practiceFeedback.textContent = 'こたえを いれよう。ないほうは からっぽでOK。';
      practiceFeedback.className = 'practice-feedback hint';
      return;
    }
    const cm = cmRaw === '' ? 0 : Number(cmRaw);
    const mm = mmRaw === '' ? 0 : Number(mmRaw);
    if (!Number.isInteger(cm) || !Number.isInteger(mm) || cm < 0 || mm < 0 || mm > 9) {
      practiceFeedback.textContent = 'cm と mm の かずを みなおそう。ないほうは からっぽでOK。';
      practiceFeedback.className = 'practice-feedback hint';
      return;
    }
    const exp = expectedPracticeAnswer();
    const cmOK = cm === exp.cm;
    const mmOK = mm === exp.mm;
    if (!cmOK || !mmOK) {
      const diag = classifyPracticeError(cm, mm, exp);
      recordPracticeWrong(diag.pattern);
      updateEquivalence();
      practiceFeedback.textContent = diag.message;
      practiceFeedback.className = 'practice-feedback hint';
      return;
    }

    if (state.currentProblemWrong === 0 && !state.currentProblemHint) {
      state.practiceStats.independent += 1;
    }
    const baseLenNow = (PROBLEM_BANKS.core[state.op] || []).length;
    if (state.practiceTier === 'core' && !state.currentProblemAdaptive && state.practiceRound === baseLenNow) {
      prepareAdaptiveReviewQueue();
    }
    state.practiceSolved = true;
    practiceFeedback.textContent = `✓ せいかい！ ${lengthText(exp)}`;
    practiceFeedback.className = 'practice-feedback ok';
    practiceCheckBtn.disabled = true;
    practiceHintBtn.disabled = true;
    practiceCmInput.disabled = true;
    practiceMmInput.disabled = true;
    updateEquation();
    footerPanel.classList.remove('result-hidden');
    equation.style.opacity = '1';
    resultText.style.opacity = '1';
    playFanfare();
    const kind = state.op === '+' ? 'add' : state.op === '−' ? 'subtract' : 'difference';
    setTimeout(()=>showSuccess(kind), 220);
  }

  function updateHintLine() {
    const L = state.left, R = state.right;
    const hasCm = L.cm > 0 || R.cm > 0;
    const hasMm = L.mm > 0 || R.mm > 0;
    let text = '';

    if (state.isPractice && state.practiceFocus) {
      text = state.practiceFocus;
    } else if (state.currentPreset === 'custom') {
      text = 'じぶんで つくった ながさで たしかめよう';
    } else if (state.op === '差') {
      text = 'ながいほうから、みじかいほうを くらべよう';
    } else if (hasCm && hasMm) {
      text = '■cm は ■cm、●mm は ●mm と けいさんする';
    } else if (hasCm) {
      text = '■cm どうしを けいさんする';
    } else if (hasMm) {
      text = '●mm どうしを けいさんする';
    }
    hintLine.innerHTML = text ? `<span class="hint-badge focus-cue">${text}</span>` : '';
  }

  function guideLabel(step=0) {
    const L = state.left, R = state.right;
    const hasCm = L.cm > 0 || R.cm > 0;
    const hasMm = L.mm > 0 || R.mm > 0;
    if (state.op === '差') {
      return step === 1 ? 'ながいほうを みる' : step === 2 ? 'おなじ ところを けす' : step === 3 ? 'のこりが「ちがい」' : '';
    }
    if (step === 1) return hasCm ? '■ cm どうし' : '';
    if (step === 2) return hasMm ? '● mm どうし' : '';
    if (step === 3) {
      if (needsConversion()) return state.op === '+' ? '●10mm を ■1cm に' : '■1cm を ●10mm に';
      return 'こたえを まとめる';
    }
    return '';
  }

  function lengthHtml(v, sign='') {
    const parts = [];
    if (v.cm > 0) parts.push(`<span class="cm">${v.cm}cm</span>`);
    if (v.mm > 0) parts.push(`<span class="mm">${v.mm}mm</span>`);
    if (!parts.length) return `${sign}<span class="zero-length">0</span>`;
    return `${sign}${parts.join('')}`;
  }

  function lengthText(v) {
    const parts = [];
    if (v.cm > 0) parts.push(`${v.cm}cm`);
    if (v.mm > 0) parts.push(`${v.mm}mm`);
    return parts.length ? parts.join(' ') : '0';
  }

  function unitAddParts(a, b, total, unit, color) {
    if (a === 0 && b === 0) return [{text:`${unit} は なし`,color}];
    if (a === 0) return [{text:`${b}${unit}`,color},{text:' だけ',color:'#111827'}];
    if (b === 0) return [{text:`${a}${unit}`,color},{text:' だけ',color:'#111827'}];
    return [
      {text:`${a}${unit} `,color},{text:'＋ ',color:'#111827'},
      {text:`${b}${unit}`,color},{text:' ＝ ',color:'#111827'},
      {text:`${total}${unit}`,color},
    ];
  }

  function unitSubParts(a, b, total, unit, color) {
    if (a === 0 && b === 0) return [{text:`${unit} は なし`,color}];
    if (b === 0) return [{text:`${a}${unit}`,color},{text:' は そのまま',color:'#111827'}];
    if (total === 0) return [
      {text:`${a}${unit}`,color},{text:' － ',color:'#111827'},
      {text:`${b}${unit}`,color},{text:' ＝ のこらない',color:'#111827'},
    ];
    return [
      {text:`${a}${unit}`,color},{text:' － ',color:'#111827'},
      {text:`${b}${unit}`,color},{text:' ＝ ',color:'#111827'},
      {text:`${total}${unit}`,color},
    ];
  }

  function updateQuestionEquation() {
    const L = state.left, R = state.right;
    if (state.op === '差') {
      questionEquation.innerHTML = `${lengthHtml(L)} <span class="word">と</span> ${lengthHtml(R)} <span class="word">の ちがい</span> <span>＝</span> <span class="unknown">？</span>`;
    } else {
      const op = state.op === '+' ? '＋' : '−';
      questionEquation.innerHTML = `${lengthHtml(L)} <span>${op}</span> ${lengthHtml(R)} <span>＝</span> <span class="unknown">？</span>`;
    }
  }
  function setPreviewValues() {
    document.getElementById('leftCmVal').textContent  = state.left.cm;
    document.getElementById('leftMmVal').textContent  = state.left.mm;
    document.getElementById('rightCmVal').textContent = state.right.cm;
    document.getElementById('rightMmVal').textContent = state.right.mm;
  }
  function renderPreviewTexts() {
    leftPreview.innerHTML  = lengthHtml(state.left);
    rightPreview.innerHTML = lengthHtml(state.right);
    setPreviewValues();
  }
  function updateEquation() {
    const L=state.left, R=state.right, op=state.op;
    const lm=totMm(L), rm=totMm(R);
    const signed= op==='+' ? lm+rm : op==='差' ? Math.abs(lm-rm) : lm-rm;
    const sign  = signed<0?'-':'';
    const abs   = Math.abs(signed);
    const result = {cm:Math.floor(abs/10), mm:abs%10};
    const resultHtml = lengthHtml(result, sign);
    if (op === '+') {
      equation.innerHTML = `<span>${lengthHtml(L)} + ${lengthHtml(R)}</span><span>=</span><span>${resultHtml}</span>`;
      resultText.innerHTML = `cmはcm、mmはmmで けいさん。だから ${resultHtml}`;
    } else if (op === '差') {
      equation.innerHTML = `<span>${lengthHtml(L)} と ${lengthHtml(R)} の ちがい</span><span>=</span><span>${resultHtml}</span>`;
      resultText.innerHTML = `おなじところをけすと、ちがいは ${resultHtml}`;
    } else {
      equation.innerHTML = `<span>${lengthHtml(L)} − ${lengthHtml(R)}</span><span>=</span><span>${resultHtml}</span>`;
      resultText.innerHTML = `cmはcm、mmはmmで けいさん。こたえは ${resultHtml}`;
    }
  }

  function snapshotForUndo() {
    return {
      left:{...state.left}, right:{...state.right}, op:state.op,
      currentPreset:state.currentPreset, practiceIndex:state.practiceIndex,
      isPractice:state.isPractice, practiceRound:state.practiceRound, practiceSolved:state.practiceSolved, practiceTier:state.practiceTier, practiceFocus:state.practiceFocus,
      adaptiveReviewQueue:state.adaptiveReviewQueue.map(p=>({...p,left:{...p.left},right:{...p.right}})), adaptivePrepared:state.adaptivePrepared,
      currentProblemAdaptive:state.currentProblemAdaptive, currentProblemTag:state.currentProblemTag, currentProblemWrong:state.currentProblemWrong, currentProblemHint:state.currentProblemHint,
      practiceStats:{...state.practiceStats,weaknesses:{...state.practiceStats.weaknesses},errorPatterns:{...(state.practiceStats.errorPatterns||{})}}
    };
  }

  function updateUndoUI() {
    undoValueBtn.disabled = undoStack.length === 0;
  }

  function clearUndo() {
    undoStack.length = 0;
    updateUndoUI();
  }

  function pushUndo() {
    undoStack.push(snapshotForUndo());
    if (undoStack.length > 12) undoStack.shift();
    updateUndoUI();
  }

  function undoValueChange() {
    if (state.animating || undoStack.length === 0) return;
    const prev = undoStack.pop();
    state.left = {...prev.left};
    state.right = {...prev.right};
    state.op = prev.op;
    state.currentPreset = prev.currentPreset;
    state.practiceIndex = prev.practiceIndex;
    state.isPractice = prev.isPractice;
    state.practiceRound = prev.practiceRound;
    state.practiceSolved = prev.practiceSolved;
    state.practiceTier = prev.practiceTier || 'core';
    state.practiceFocus = prev.practiceFocus || '';
    state.adaptiveReviewQueue = prev.adaptiveReviewQueue || [];
    state.adaptivePrepared = !!prev.adaptivePrepared;
    state.currentProblemAdaptive = !!prev.currentProblemAdaptive;
    state.currentProblemTag = prev.currentProblemTag || '';
    state.currentProblemWrong = prev.currentProblemWrong || 0;
    state.currentProblemHint = !!prev.currentProblemHint;
    state.practiceStats = prev.practiceStats || {wrong:0,hints:0,independent:0,weaknesses:{},errorPatterns:{}};
    if (!state.practiceStats.errorPatterns) state.practiceStats.errorPatterns = {};
    updateUndoUI();
    renderAll();
  }

  function changeValue(side, unit, delta) {
    if (state.animating) { showBlockToast(); return; }
    const s = state[side];
    const before = unit === 'cm' ? s.cm : s.mm;
    const after = unit === 'cm'
      ? Math.max(0,Math.min(25,before+delta))
      : Math.max(0,Math.min(9,before+delta));
    if (after === before) return;
    pushUndo();
    if (unit==='cm') s.cm = after;
    if (unit==='mm') s.mm = after;
    state.currentPreset = 'custom';
    state.isPractice = false;
    state.practiceSolved = false;
    state.currentProblemAdaptive = false;
    renderAll();
  }
