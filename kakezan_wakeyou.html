<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かけ算を わけよう</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#26323a;--sub:#6c7a84;--line:#c9d6de;--c1:#f5a83b;--c1bg:#fdeccb;--t1:#b36200;--c2:#2f9fd0;--c2bg:#d4ecf8;--t2:#0b6d98;--btn:#e3ecf1;--on:#26323a;--onink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161d22;--card:#212b32;--ink:#eaf0f3;--sub:#9fb0ba;--line:#3b4a54;--c1:#f7b755;--c1bg:#4a3a1c;--t1:#ffc470;--c2:#4db4e2;--c2bg:#183e52;--t2:#7cc9ee;--btn:#2d3a43;--on:#eaf0f3;--onink:#161d22}}
:root[data-theme="dark"]{--bg:#161d22;--card:#212b32;--ink:#eaf0f3;--sub:#9fb0ba;--line:#3b4a54;--c1:#f7b755;--c1bg:#4a3a1c;--t1:#ffc470;--c2:#4db4e2;--c2bg:#183e52;--t2:#7cc9ee;--btn:#2d3a43;--on:#eaf0f3;--onink:#161d22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"UD デジタル 教科書体 N","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;line-height:1.5}
main{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,36vw,440px);align-items:start;gap:10px;padding:10px}
aside{display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:calc(100dvh - 20px)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px;margin:0;animation:rise .8s cubic-bezier(.2,1.5,.4,1) both}
aside .card:nth-child(1){animation-delay:.2s}aside .card:nth-child(2){animation-delay:.35s}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
.fig{min-width:0;min-height:0;padding:8px;position:sticky;top:10px;height:calc(100dvh - 20px);display:flex;flex-direction:column}
.diagram-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border-radius:12px}
.diagram-scroll:focus-visible{outline:3px solid var(--c2);outline-offset:-3px}
.diagram-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 2px 2px;flex-shrink:0}
#zoomHelp{font-size:13px;margin:0;flex-basis:100%}
.fig.enlarged #fig{width:900px;height:auto;max-height:none}
.factor{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fig #hc{margin-top:8px;border:0;border-top:2px solid var(--line);border-radius:0;padding:8px 2px 2px;animation:none}
#fig{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cell{cursor:pointer}
.cell rect{stroke:var(--line);stroke-width:1;transition:fill .4s}
.cell circle{transition:fill .4s}
.cell.p1 rect{fill:var(--c1bg)}.cell.p1 circle{fill:var(--c1)}
.cell.p2 rect{fill:var(--c2bg)}.cell.p2 circle{fill:var(--c2)}
.t1{color:var(--t1)}.t2{color:var(--t2)}
.pn{display:inline-block;font-variant-numeric:tabular-nums}
.eq{font-size:clamp(18px,4.4vh,28px);font-weight:700;text-align:center;line-height:1.45}
.eq2{font-size:clamp(18px,4vh,26px);font-weight:700;text-align:center}
.ans{margin:6px auto 0;width:fit-content;background:var(--on);color:var(--onink);border-radius:16px;padding:4px 18px;font-size:clamp(22px,5.4vh,34px);font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:6px 0}
.lab{flex-basis:100%;font-size:14px;color:var(--sub)}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--btn);border:2px solid var(--line);border-radius:14px;min-width:42px;height:44px;padding:0 10px;cursor:pointer;box-shadow:0 4px 0 var(--line);touch-action:manipulation;
transition:transform .22s cubic-bezier(.3,1.8,.5,1),box-shadow .22s,background-color .3s,color .3s,border-color .3s}
@media (hover:hover){button:hover{transform:translateY(-2px) scale(1.06)}}
button:active{transform:translateY(3px) scale(.93);box-shadow:0 1px 0 var(--line);transition-duration:.06s}
button:focus-visible,input:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
button[aria-pressed="true"]{background:var(--on);color:var(--onink);border-color:var(--on)}
.mute{font-size:20px;padding:0}
.num{font-size:28px;font-weight:700;min-width:1.6ch;text-align:center}
.x{font-size:24px;font-weight:700}
input[type=range]{flex:1;min-width:80px;height:36px;accent-color:var(--c1)}
.cut{font-size:20px;font-weight:700;color:var(--ink)}
.hint{font-size:13px;color:var(--sub);margin:2px 0 0}
@media (max-width:760px),(max-aspect-ratio:1/1){main{grid-template-columns:1fr}aside{min-height:0}.fig{position:static;height:auto}.diagram-scroll{flex:none;max-height:50dvh}#fig{height:auto}}
@media (prefers-reduced-motion:reduce){.card{animation:none}button{transition:none}}
:root{--hb:#2f6fdf;--hr:#e0484f;--hy:#f7c92b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hb:#6ea6ff;--hr:#ff7a80}}
:root[data-theme="dark"]{--hb:#6ea6ff;--hr:#ff7a80}
#cells{transition:opacity .4s}#hint{pointer-events:none}
.hz{transform-box:fill-box;transform-origin:center;opacity:0;animation:hp .5s cubic-bezier(.3,1.7,.5,1) forwards}
.hz.st{opacity:1;animation:none}
@keyframes hp{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.cb{color:var(--hb)}.cr{color:var(--hr)}.cy{background:var(--hy);color:#3a2c00;padding:0 6px;border-radius:6px}
.hm{font-size:clamp(15px,2.9vh,20px);font-weight:700;line-height:1.7;margin:4px 0 0;min-height:3.4em}
.hm .cy{display:inline-block;animation:yy .6s ease-out both}
@keyframes yy{40%{transform:scale(1.35)}}
.hb1{color:var(--t1)}.hb2{color:var(--t2)}
@media (prefers-reduced-motion:reduce){.hz{opacity:1;animation:none}#cells{transition:none}.hm .cy{animation:none}}
.diagram-stage{position:relative;height:100%;min-height:220px}.fig.enlarged .diagram-stage{width:900px;height:auto}
#drawLayer{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}#drawLayer[hidden]{display:none}
#cutPreview,#totals{pointer-events:none}#totals text{font-size:34px;font-weight:900;fill:var(--ink);stroke:var(--card);stroke-width:9px;paint-order:stroke;stroke-linejoin:round}
.cut-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.cut-tools button{height:auto;min-height:44px;padding:6px 12px}
#cutNow{position:absolute;z-index:2;background:#b63d27;color:white;border-color:#8c291c;font-size:17px;white-space:nowrap;height:44px;padding:0 10px;box-shadow:0 3px 0 #8c291c;transition:none}#cutNow:hover{transform:none}button:disabled{opacity:.45;cursor:default}
#cutStatus{min-height:1.5em}body.hide-formulas #eq1,body.hide-formulas #eq2{display:none}
#samuraiFx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden;display:none}
#samuraiFx.active{display:block}#samuraiFx .cutin{position:absolute;left:0;right:0;top:22%;height:48%;background:linear-gradient(110deg,#102938ed,#176b82ed,transparent);transform:skewY(-5deg);animation:cutin .75s both}
#samuraiFx img{position:absolute;height:min(78vh,620px);max-width:80vw;object-fit:contain;left:12%;bottom:7%;animation:hero .75s both}
#samuraiFx strong{position:absolute;right:12%;top:42%;font-size:clamp(34px,7vw,90px);color:#fff5be;text-shadow:3px 4px #17394c;animation:cutin .75s both}
.blade-flash{position:absolute;width:150%;height:7px;background:#fff4ab;box-shadow:0 0 14px 5px #ffc760;left:-25%;top:50%;transform:rotate(-28deg) scaleX(0);animation:blade .55s .18s both}
@keyframes cutin{0%{opacity:0;translate:-100% 0}18%,65%{opacity:1;translate:0 0}100%{opacity:0;translate:100% 0}}
@keyframes hero{0%{opacity:0;translate:-160px 0}18%,65%{opacity:1;translate:0 0}100%{opacity:0;translate:90px 0}}
@keyframes blade{0%{transform:rotate(-28deg) scaleX(0)}25%,60%{transform:rotate(-28deg) scaleX(1)}100%{opacity:0;transform:rotate(-28deg) scaleX(1)}}
@media(max-width:760px),(max-aspect-ratio:1/1){.diagram-stage{height:auto}#samuraiFx img{left:0;max-width:90vw}#samuraiFx strong{right:5%;top:35%}}
@media(prefers-reduced-motion:reduce){#samuraiFx{display:none!important}}
</style>
</head>
<body>
<main>
<div class="card fig" id="figureCard"><div class="diagram-scroll" id="diagramScroll" tabindex="0" role="region" aria-label="アレイ図。大きくした図は上下左右に動かせます"><div class="diagram-stage"><svg id="fig" role="img" aria-label="アレイ図"><g id="cells"></g><g id="deco"></g><g id="fx"></g><g id="hint"></g><g id="totals"></g><g id="cutPreview"></g></svg><canvas id="drawLayer" hidden aria-label="きる前の図に、たてかよこの線を描く"></canvas></div></div>
<div class="diagram-tools"><button class="mute" id="mute" aria-label="おとを けす">🔊</button><button id="zoom" aria-pressed="false" aria-controls="diagramScroll">ずを おおきく</button><p id="zoomHelp" hidden>おおきくした ずは、ゆびや スクロールで うごかせるよ。</p></div></div>

<aside>
<div class="card">
  <div class="eq" id="eq1"><span class="pn" id="e0"></span> ＝ <span class="pn t1" id="e1"></span> ＋ <span class="pn t2" id="e2"></span></div>
  <div class="eq2" id="eq2">＝ <span class="pn t1" id="p1"></span> ＋ <span class="pn t2" id="p2"></span> ＝ <span class="pn" id="ps"></span></div>
  <div class="ans" id="ans">こたえ　<span class="pn" id="aa"></span>×<span class="pn" id="ab"></span> ＝ <span class="pn" id="ar"></span></div>
</div>

<div class="card">
  <div class="row"><span class="lab">かける かず</span>
    <span class="factor" role="group" aria-label="まえの数"><button data-s="a-" aria-label="まえの数を減らす">－</button><span class="num pn" id="na"></span><button data-s="a+" aria-label="まえの数を増やす">＋</button></span>
    <span class="x">×</span>
    <span class="factor" role="group" aria-label="あとの数"><button data-s="b-" aria-label="あとの数を減らす">－</button><span class="num pn" id="nb"></span><button data-s="b+" aria-label="あとの数を増やす">＋</button></span>
  </div>
  <div class="row"><span class="lab">わける ほう</span>
    <button id="ma" aria-pressed="true"><span class="pn" id="mat"></span></button><button id="mb" aria-pressed="false"><span class="pn" id="mbt"></span></button>
  </div>
  <div class="row"><span class="lab">きりかた　<span class="cut"><span class="pn t1" id="ck"></span> と <span class="pn t2" id="cn"></span></span></span>
    <button data-s="k-" aria-label="きる位置を戻す">◀</button>
    <input type="range" id="sl" min="1" max="6" step="1" value="5" aria-label="きる位置">
    <button data-s="k+" aria-label="きる位置を進める">▶</button>
  </div>
  <div class="cut-tools"><button id="uncut" aria-pressed="false">きる前に もどす</button><button id="pen" aria-pressed="true" hidden>ペン ON</button></div>
  <p class="hint" id="cutStatus" role="status">ずの ○ を タップしても、そこで きれるよ。</p>
  <div class="cut-tools" role="group" aria-label="ひょうじと えんしゅつ"><button id="formulas" aria-pressed="true">パーツの式 ON</button><button id="showTotals" aria-pressed="false">図の合計 OFF</button><button id="effects" aria-pressed="true">侍の演出 ON</button></div>
</div>
<div class="card" id="hc">
  <div class="row"><span class="lab">なぜ その しきに なるの？</span>
    <button id="hb">ヒント</button>
    <button id="h0" aria-pressed="true"></button><button class="hb1" id="h1" aria-pressed="false"></button><button class="hb2" id="h2" aria-pressed="false"></button>
  </div>
  <p class="hm" id="hm"></p>
</div>
</aside>
</main>
<div id="samuraiFx" aria-hidden="true"><div class="cutin"></div><img src="media/wakeyou-samurai.png" alt=""><strong>いざ、わける！</strong><div class="blade-flash"></div></div>

<script>
/* ===== ばね(スプリング)アニメーション ===== */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
class P{constructor(x=0,k=200,c=17){this.x=this.t=x;this.v=0;this.k=k;this.c=RM?c*1.8:c}
 step(d){this.v+=(this.k*(this.t-this.x)-this.c*this.v)*d;this.x+=this.v*d}
 get still(){return Math.abs(this.t-this.x)<.002&&Math.abs(this.v)<.02}}
const go=(p,t,inst)=>{p.t=t;if(inst)p.x=t};

/* ===== 効果音(Web Audio で合成) ===== */
let ac=null,mst=null,nb=null,muted=false,lastTick=0;
let swordBuffer=null,swordReady=null;const swordVoices=new Set();
const swordBytes=fetch('media/wakeyou-sword.mp3').then(r=>{if(!r.ok)throw Error('sword audio');return r.arrayBuffer()}).catch(()=>null);
function loadSword(){if(!ac)return Promise.resolve();if(!swordReady)swordReady=swordBytes.then(bytes=>bytes?ac.decodeAudioData(bytes):null).then(buffer=>{swordBuffer=buffer}).catch(()=>{});return swordReady}
function stopSword(){for(const source of swordVoices){try{source.stop()}catch(_){} }swordVoices.clear()}
try{muted=localStorage.getItem('wk_mute')==='1'}catch(e){}
function unlock(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mst=ac.createGain();mst.gain.value=.6;
 const cp=ac.createDynamicsCompressor();mst.connect(cp);cp.connect(ac.destination)}
 if(ac.state==='suspended')ac.resume();loadSword()}catch(e){}}
addEventListener('pointerdown',unlock,{passive:true,capture:true});addEventListener('keydown',unlock,{passive:true,capture:true});
const PENT=[0,2,4,7,9],note=(i,b=330)=>b*Math.pow(2,(PENT[i%5]+12*Math.floor(i/5))/12);
function tone(f,{d=.18,type='sine',v=.22,at=0,to=0}={}){
 if(!ac||muted)return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(mst);o.start(t);o.stop(t+d+.03)}
function swoosh({d=.25,f0=500,f1=2500,v=.15,at=0,q=1.4}={}){
 if(!ac||muted)return;
 if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const t=ac.currentTime+at,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
 s.buffer=nb;f.type='bandpass';f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.25);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(f);f.connect(g);g.connect(mst);s.start(t);s.stop(t+d+.03)}
const pluck=(f,at=0,v=.2)=>{tone(f,{d:.34,v,at});tone(f*2,{d:.12,type:'triangle',v:v*.3,at})};
const sThunk=(at=.1)=>tone(150,{d:.16,to:62,v:.26,at});
const sCut=k=>{swoosh({d:.16,f0:3800,f1:700,v:.17,q:2});tone(1800,{d:.04,type:'square',v:.05});pluck(note(k+2,260),.02,.24);sThunk(.1)};
const sTick=k=>{const n=performance.now();if(n-lastTick<35)return;lastTick=n;pluck(note(k+2,260),0,.16);tone(2200,{d:.025,type:'square',v:.035})};
const sGrow=n=>{swoosh({d:.2,f0:500,f1:2200,v:.1});for(let i=0;i<Math.min(n,7);i++)pluck(note(i+2),i*.05,.15);if(!n)pluck(note(4),0,.18)};
const sShrink=n=>{swoosh({d:.25,f0:2400,f1:400,v:.12});for(let i=0;i<Math.min(Math.max(n,1),5);i++)tone(note(7-i,330),{d:.14,type:'triangle',v:.12,at:i*.05})};
const sMode=()=>{swoosh({d:.38,f0:500,f1:3000,v:.16,q:1.1});pluck(note(5),.06,.2);pluck(note(8),.16,.2);sThunk(.3)};
const sNo=()=>tone(190,{d:.13,to:120,type:'square',v:.09});
const sBoing=()=>{tone(200,{d:.24,to:440,v:.2});tone(400,{d:.2,to:800,type:'triangle',v:.06})};
const sDing=at=>{pluck(note(10),at,.16);pluck(note(12),at+.08,.12)};
$=id=>document.getElementById(id);
function muteUI(){const b=$('mute');b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-label',muted?'おとを だす':'おとを けす');if(muted)stopSword();if(mst)mst.gain.value=muted?0:.6}
muteUI();

/* ===== 状態と図形 ===== */
const S={a:7,b:6,mode:'a',k:5};
const V={split:true,formulas:true,totals:false,effects:true,pen:true,ready:false,busy:false};
const C=30,G=18,R=11,LM=120,TM=24,NS='http://www.w3.org/2000/svg';
const el=(t,at,par)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);par&&par.appendChild(e);return e};
const fig=$('fig'),cellsG=$('cells'),deco=$('deco'),fxG=$('fx'),sl=$('sl');
const nOf=()=>S.mode==='a'?S.a:S.b;
const clampK=()=>{S.k=Math.min(Math.max(S.k,1),nOf()-1)};
const brace=L=>{const h=L/2,e=Math.min(10,L/4);return `M0 ${-h}Q8 ${-h} 8 ${-h+e}L8 ${-e}Q8 0 16 0Q8 0 8 ${e}L8 ${h-e}Q8 ${h} 0 ${h}`};
const vw=new P(0,120,20),vh=new P(0,120,20);
const cells=new Map(),parts=[];
let downCell=null;

function mkBrace(col){
 const g=el('g',{},deco),path=el('path',{fill:'none',stroke:'var(--sub)','stroke-width':2,'stroke-linecap':'round'},g);
 const lb=el('text',{y:8,'text-anchor':'middle','font-size':24,'font-weight':700,fill:`var(${col})`},deco);
 return {g,path,lb,txt:'',w:30,cx:new P(0),cy:new P(0),L:new P(0,190,15),th:new P(0,150,10),lx:new P(0),lc:new P(0),ls:new P(0,260,13)}}
const B0=mkBrace('--ink'),B1=mkBrace('--t1'),B2=mkBrace('--t2'),braces=[B0,B1,B2];
const cl={g:el('g',{},deco),cx:new P(0),cy:new P(0),len:new P(0,170,16),th:new P(0,140,11),gl:new P(0,120,9)};
cl.line=el('line',{stroke:'var(--sub)','stroke-dasharray':'5 6','stroke-linecap':'round'},cl.g);

function mk(i,j,x,y,p){
 const g=el('g',{class:'cell p'+p,transform:`translate(${x+C/2} ${y+C/2}) scale(0)`},cellsG);el('rect',{x:-C/2,y:-C/2,width:C,height:C,rx:4},g);const d=el('circle',{r:R},g);
 const c={key:i+','+j,i,j,g,dot:d,p,pt:p,x:new P(x,190,17),y:new P(y,190,17),sc:new P(0,260,12),rot:new P(RM?0:-140,170,9),ds:new P(1,320,11),wake:0,woke:true,dying:false};
 c.sc.t=1;c.rot.t=0;g._c=c;cells.set(c.key,c);return c}
function kill(c,now){c.dying=true;c.g.style.pointerEvents='none';c.sc.t=0;c.rot.t=c.rot.x+(Math.random()<.5?-1:1)*(RM?0:160);c.wake=now+(RM?0:Math.random()*150);c.woke=false}

function placeBrace(b,o,inst){
 go(b.cx,o.cx,inst);go(b.cy,o.cy,inst);go(b.L,o.L,false);go(b.th,o.th,inst);
 if(o.txt!==b.txt){b.txt=o.txt;b.lb.textContent=o.txt;b.w=b.lb.getComputedTextLength()||o.txt.length*15;if(!inst)b.ls.x=1.35}
 go(b.lx,o.pos==='L'?LM-34-b.w/2:o.pos==='R'?o.cx+26+b.w/2:o.cx,inst);
 go(b.lc,o.pos==='B'?o.cy+36:o.cy,inst);b.ls.t=1}

function layout(kind){
 const {a,b,mode,k}=S,ma=mode==='a',now=performance.now(),init=kind==='init',n=nOf();
 const gap=V.split?G:0,W=b*C+(ma?0:gap),H=a*C+(ma?gap:0);
 let right=ma?120:12,bottom=ma?12:70;
 if(!V.split&&V.ready){const w=Math.max(180,fig.clientWidth),h=Math.max(100,fig.clientHeight),wide=innerWidth>760&&innerWidth>innerHeight;
  if(ma)right=Math.max(right,150*(LM+W+12)/Math.max(54,w-150),wide?150*(TM+H+12)/h:0);
  else bottom=Math.max(bottom,60*(LM+W+12)/w,wide?60*(TM+H+12)/Math.max(40,h-60):0);
 }
 go(vw,LM+W+right,init);go(vh,TM+H+bottom,init);
 let born=0,killed=0;

canvas.addEventListener('pointerup',e=>{if(!stroke||stroke.id!==e.pointerId)return;const pts=stroke.pts;const end=point(e);if(end)pts.push(end);const cut=recognizeCut(pts);clearInk();
 if(cut){Object.assign(S,cut);V.ready=true;update('preview');sTick(S.k)}else $('cutStatus').textContent='線は ドットの あいだに、たてか よこへ まっすぐ ひこう。';
});
canvas.addEventListener('pointercancel',()=>{clearInk()});canvas.addEventListener('lostpointercapture',()=>{clearInk()});
function samuraiSound(){if(!ac||muted||!swordBuffer)return;const source=ac.createBufferSource();source.buffer=swordBuffer;source.connect(mst);swordVoices.add(source);source.onended=()=>swordVoices.delete(source);source.start()}
async function performCut(){
 if(V.busy||V.split||!V.ready)return;clearInk();const animated=V.effects&&!RM;V.busy=true;
 const controls=[...document.querySelectorAll('button,input')].filter(e=>e.id!=='mute');controls.forEach(e=>e.disabled=true);
 unlock();if(V.effects&&!muted)await loadSword();
 const commit=()=>{V.split=true;V.ready=false;if(V.effects)samuraiSound();update('cut');const ma=S.mode==='a',cx=ma?LM+S.b*C/2:LM+S.k*C+G/2,cy=ma?TM+S.k*C+G/2:TM+S.a*C/2,len=(ma?S.b:S.a)*C;
  if(V.effects){burst(cx,cy,len,ma);if(!RM){const slash=el('line',{x1:ma?LM:cx,y1:ma?cy:TM,x2:ma?LM+len:cx,y2:ma?cy:TM+len,stroke:'#e8a322','stroke-width':5,'stroke-linecap':'round','stroke-dasharray':len},fxG);
   slash.animate([{strokeDashoffset:len,opacity:1},{strokeDashoffset:0,opacity:1,offset:.45},{strokeDashoffset:0,opacity:0}],{duration:550,easing:'ease-out'}).finished.then(()=>slash.remove()).catch(()=>slash.remove())}}
 };
 const done=()=>{V.busy=false;controls.forEach(e=>e.disabled=false);$('samuraiFx').classList.remove('active');$('uncut').focus();$('cutStatus').textContent=`わけても ぜんぶで ${S.a*S.b}こ。${$('e1').textContent} と ${$('e2').textContent} に わかれたね。`};
 if(animated){$('samuraiFx').classList.add('active');setTimeout(commit,280);setTimeout(done,800)}else{commit();done()}
}
$('cutNow').onclick=performCut;
$('cutNow').addEventListener('pointerup',e=>{if(e.pointerType==='touch'||e.pointerType==='pen'){e.preventDefault();performCut()}});

sl.max=nOf()-1;sl.value=S.k;
update('init');
</script>
