"unit": "L", "img": "img/questions/kettle.webp", "eximg": "img/explanations/kettle.webp"}, {"cat": "V", "key": "bucket", "label": "バケツのみず", "n": 8, "unit": "L", "img": "img/questions/bucket.webp", "eximg": "img/explanations/bucket.webp"}, {"cat": "V", "key": "bath", "label": "おふろのみず", "n": 200, "unit": "L", "img": "img/questions/bath.webp", "eximg": "img/explanations/bath.webp"}, {"cat": "W", "key": "clip", "label": "クリップ1このおもさ", "n": 1, "unit": "g", "img": "img/questions/clip.webp", "eximg": "img/explanations/clip.webp"}, {"cat": "W", "key": "coin_w", "label": "1円玉1まいのおもさ", "n": 1, "unit": "g", "img": "img/questions/coin_w.webp", "eximg": "img/explanations/coin_w.webp"}, {"cat": "W", "key": "candy", "label": "あめ1このおもさ", "n": 4, "unit": "g", "img": "img/questions/candy.webp", "eximg": "img/explanations/candy.webp"}, {"cat": "W", "key": "pencil2", "label": "えんぴつ1本のおもさ", "n": 5, "unit": "g", "img": "img/questions/pencil2.webp", "eximg": "img/explanations/pencil2.webp"}, {"cat": "W", "key": "egg", "label": "たまご1このおもさ", "n": 60, "unit": "g", "img": "img/questions/egg.webp", "eximg": "img/explanations/egg.webp"}, {"cat": "W", "key": "apple", "label": "りんご1このおもさ", "n": 300, "unit": "g", "img": "img/questions/apple.webp", "eximg": "img/explanations/apple.webp"}, {"cat": "W", "key": "smartphone", "label": "スマートフォンのおもさ", "n": 170, "unit": "g", "img": "img/questions/smartphone.webp", "eximg": "img/explanations/smartphone.webp"}, {"cat": "W", "key": "textbook", "label": "教科書1さつのおもさ", "n": 400, "unit": "g", "img": "img/questions/textbook.webp", "eximg": "img/explanations/textbook.webp"}, {"cat": "W", "key": "randoseru2", "label": "にもつ入りランドセルのおもさ", "n": 3, "unit": "kg", "img": "img/questions/randoseru2.webp", "eximg": "img/explanations/randoseru2.webp"}, {"cat": "W", "key": "ricebag", "label": "おこめのふくろのおもさ", "n": 5, "unit": "kg", "img": "img/questions/ricebag.webp", "eximg": "img/explanations/ricebag.webp"}, {"cat": "W", "key": "cat", "label": "ネコのおもさ", "n": 4, "unit": "kg", "im const CH={"L": ["mm", "cm", "m"], "V": ["mL", "dL", "L"], "W": ["g", "kg"], "K": ["m", "km"]},CN={"L": "ながさ（2年）", "V": "かさ（2年）", "W": "おもさ（3年）", "K": "きょり（3年）"};
let S;const $=id=>document.getElementById(id);const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function menu(){document.getElementById('app').innerHTML=`<div class="card menu"><h1>たんいをえらぼう</h1><p>絵を見て、ぴったりの「たんい」をえらぼう。</p><div class="categoryBtns">${Object.keys(CN).map(k=>`<button class="btn" onclick="start('${k}')">${CN[k]}</button>`).join('')}<button class="btn primary" onclick="start()">ぜんぶまぜる（10問）</button></div><p class="small">ぜんぶで ${Q.length} もん。身近なものの量を、絵と単位のめやすでたしかめよう。</p></div>`}
function start(c,list){const pool=list||Q.filter(q=>!c||q.cat===c);S={list:shuffle([...pool]).slice(0,Math.min(10,pool.length)),i:0,ok:0,miss:[],c};show()}


// Keep each original illustration intact: the SVG viewport selects its complete card.
const SOURCE_SHEETS={"a":["カラフルな日本語ことばカード9枚.png",1254,1254],"b":["カラフルな日本語学習フラッシュカード_恒一.png",1254,1254],"c":["かわいい学習カード10枚セット.png",1983,793],"d":["水の学習フラッシュカードセット.png",1448,1086],"e":["飲みものカードのかわいいイラストセット.png",1448,1086],"f":["かわいい日本地理フラッシュカードセット.png",1254,1254],"k":["きょりのもんだいカード集.png",1448,1086],"w":["かわいい重さのもんだいカード.png",1448,1086],"r":["小学生向け_身近な量のものさし_恒一.png",1448,1086]};

const UNIT_VIEWPORTS={"mm":["r",0,0,482,362],"cm":["r",483,0,482,362],"m":["r",966,0,482,362],"km":["r",0,362,482,362],"mL":["r",483,362,482,362],"dL":["r",966,362,482,362],"L":["r",0,724,482,362],"g":["r",483,724,482,362],"kg":["r",966,724,482,362]};
function cardPicture(crop,label,cls='qpic'){
 const [sheet,x,y,w,h]=crop,[name,sw,sh]=SOURCE_SHEETS[sheet];
 const id='card-'+sheet+'-'+x+'-'+y+'-'+cls;
 return `<svg class="${cls}" viewBox="${x} ${y} ${w} ${h}" role="img" aria-label="${label}"><defs><clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath></defs><image clip-path="url(#${id})" href="img/source_sheets/${name}" width="${sw}" height="${sh}"/></svg>`;
}

function show(){const q=S.list[S.i];S.q=q;S.done=false;document.getElementById('app').innerHTML=`<div class="top"><b>${S.i+1} / ${S.list.length}</b><span>せいかい ${S.ok}</span></div><div class="card" style="text-align:center">${cardPicture(CARD_VIEWPORTS[q.key],q.label)}<div class="q">${q.label}は <span class="n">${q.n}</span> <span class="blank">　　　</span> くらいです。</div></div><div class="choices">${CH[q.cat].map(u=>`<button class="u" onclick="pick('${u}',this)">${u}</button>`).join('')}</div><div id="fb" class="fb"></div><div id="ex"></div>`}
function pick(u,b){if(S.done)return;S.done=true;const a=S.q.unit,ok=u===a;if(ok)S.ok++;else S.miss.push(S.q);document.querySelectorAll('.u').forEach(x=>{x.disabled=true;if(x.textContent===a)x.classList.add('ok')});if(!ok)b.classList.add('ng');document.getElementById('fb').innerHTML=`<p class="${ok?'g':'r'}">${ok?'○ せいかい！':'× こたえは「'+a+'」'}</p><button class="btn" onclick="explain()">どうして？</button><button class="btn primary" onclick="next()">つぎへ →</button>`;if(!ok)explain()}
function explain(){const q=S.q;document.getElementById('ex').innerHTML=`<div class="card explanation"><h2>${q.label}</h2><div class="quantity-pictures"><div>${cardPicture(CARD_VIEWPORTS[q.key],q.label,'ex-figure')}</div><div><h3>1${q.unit} のめやす</h3>${cardPicture(UNIT_VIEWPORTS[q.unit],'1'+q.unit+'のめやす','ref-figure')}</div></div><p class="quantity-answer">およそ ${q.n} ${q.unit}</p><p>1${q.unit} が、およそ ${q.n} こぶんの量です。</p></div>`;document.getElementById('ex').scrollIntoView({behavior:'smooth',block:'start'})}
function next(){S.i++;S.i<S.list.length?show():result()}
function result(){const t={},m={};S.list.forEach(q=>t[q.cat]=(t[q.cat]||0)+1);S.miss.forEach(q=>m[q.cat]=(m[q.cat]||0)+1);document.getElementById('app').innerHTML=`<div class="card result"><h1>${S.ok} / ${S.list.length} もん せいかい</h1>${Object.keys(t).map(k=>`<p>${CN[k]}　${t[k]-(m[k]||0)} / ${t[k]}</p>`).join('')}<button class="btn" onclick="start(S.c)">もういちど</button>${S.miss.length?`<button class="btn" onclick="start(null,S.miss)">まちがえた問題</button>`:''}<button class="btn primary" onclick="menu()">メニュー</button></div>`}
menu();
</script></body></html>
