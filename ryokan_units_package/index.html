<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たんいをえらぼう</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#222;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}#app{max-width:920px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border:2px solid #d9e3ee;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #15314b14}.menu h1{font-size:30px;margin:0 0 8px}.qpic{width:min(100%,520px);height:300px;object-fit:contain;border-radius:16px;background:white}.q{font-size:25px;font-weight:700;line-height:1.6}.n{color:#185FA5;font-size:34px}.blank{display:inline-block;min-width:110px;border-bottom:4px solid #185FA5;color:#185FA5}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.u{min-width:120px;font-size:26px;font-weight:800;padding:14px 22px;border:3px solid #b9c6d4;border-radius:16px;background:white;cursor:pointer}.u:hover{border-color:#185FA5;transform:translateY(-1px)}.u.ok{background:#EAF3DE;border-color:#3B6D11}.u.ng{background:#FCEBEB;border-color:#A32D2D}.fb{text-align:center;font-size:22px}.g{color:#3B6D11;font-weight:800}.r{color:#A32D2D;font-weight:800}.btn{font:inherit;font-size:18px;font-weight:700;cursor:pointer;border:2px solid #9db4ca;border-radius:14px;background:white;padding:11px 18px;margin:5px}.primary{background:#185FA5;color:white;border-color:#185FA5}.expic{width:100%;max-width:820px;border-radius:18px;border:2px solid #d9e3ee}.small{font-size:15px;color:#596b7c}.result{font-size:22px;text-align:center}.categoryBtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.categoryBtns .btn{font-size:20px;padding:18px 10px}@media(max-width:600px){#app{padding:8px}.qpic{height:220px}.q{font-size:21px}.u{min-width:92px;font-size:22px}.categoryBtns{grid-template-columns:1fr}.expic{border-radius:10px}}
</style></head><body><div id="app"></div><script>
const Q=[{"cat": "L", "key": "pencil", "label": "えんぴつのながさ", "n": 14, "unit": "cm", "img": "img/questions/pencil.webp", "eximg": "img/explanations/pencil.webp"}, {"cat": "L", "key": "eraser", "label": "けしゴムのながさ", "n": 5, "unit": "cm", "img": "img/questions/eraser.webp", "eximg": "img/explanations/eraser.webp"}, {"cat": "L", "key": "coin", "label": "1円玉のよこはば", "n": 2, "unit": "cm", "img": "img/questions/coin.webp", "eximg": "img/explanations/coin.webp"}, {"cat": "L", "key": "notebook", "label": "ノートのよこのながさ", "n": 18, "unit": "cm", "img": "img/questions/notebook.webp", "eximg": "img/explanations/notebook.webp"}, {"cat": "L", "key": "ant", "label": "アリのからだのながさ", "n": 5, "unit": "mm", "img": "img/questions/ant.webp", "eximg": "img/explanations/ant.webp"}, {"cat": "L", "key": "blackboard", "label": "こくばんのよこのながさ", "n": 4, "unit": "m", "img": "img/questions/blackboard.webp", "eximg": "img/explanations/blackboard.webp"}, {"cat": "L", "key": "pool", "label": "プールのながさ", "n": 25, "unit": "m", "img": "img/questions/pool.webp", "eximg": "img/explanations/pool.webp"}, {"cat": "L", "key": "door", "label": "ドアのたかさ", "n": 2, "unit": "m", "img": "img/questions/door.webp", "eximg": "img/explanations/door.webp"}, {"cat": "L", "key": "tulip", "label": "チューリップのたかさ", "n": 30, "unit": "cm", "img": "img/questions/tulip.webp", "eximg": "img/explanations/tulip.webp"}, {"cat": "L", "key": "hand", "label": "2年生のてのひらのよこはば", "n": 6, "unit": "cm", "img": "img/questions/hand.webp", "eximg": "img/explanations/hand.webp"}, {"cat": "L", "key": "ruler", "label": "ものさしのながさ", "n": 30, "unit": "cm", "img": "img/questions/ruler.webp", "eximg": "img/explanations/ruler.webp"}, {"cat": "L", "key": "randoseru", "label": "ランドセルのたかさ", "n": 30, "unit": "cm", "img": "img/questions/randoseru.webp", "eximg": "img/explanations/randoseru.webp"}, {"cat": "L", "key": "child", "label": "2年生のせのたかさ", "n": 120, "unit": "cm", "img": "img/questions/child.webp", "eximg": "img/explanations/child.webp"}, {"cat": "L", "key": "giraffe", "label": "キリンのたかさ", "n": 5, "unit": "m", "img": "img/questions/giraffe.webp", "eximg": "img/explanations/giraffe.webp"}, {"cat": "L", "key": "bus", "label": "バスのながさ", "n": 10, "unit": "m", "img": "img/questions/bus.webp", "eximg": "img/explanations/bus.webp"}, {"cat": "L", "key": "ricegrain", "label": "ごはん1つぶのながさ", "n": 7, "unit": "mm", "img": "img/questions/ricegrain.webp", "eximg": "img/explanations/ricegrain.webp"}, {"cat": "L", "key": "banana", "label": "バナナのながさ", "n": 18, "unit": "cm", "img": "img/questions/banana.webp", "eximg": "img/explanations/banana.webp"}, {"cat": "L", "key": "scissors", "label": "はさみのながさ", "n": 16, "unit": "cm", "img": "img/questions/scissors.webp", "eximg": "img/explanations/scissors.webp"}, {"cat": "V", "key": "spoon", "label": "小さじ1ぱいのみず", "n": 5, "unit": "mL", "img": "img/questions/spoon.webp", "eximg": "img/explanations/spoon.webp"}, {"cat": "V", "key": "eyedrops", "label": "目薬1本のえき", "n": 5, "unit": "mL", "img": "img/questions/eyedrops.webp", "eximg": "img/explanations/eyedrops.webp"}, {"cat": "V", "key": "yogurt", "label": "小さい乳酸菌飲料1本", "n": 65, "unit": "mL", "img": "img/questions/yogurt.webp", "eximg": "img/explanations/yogurt.webp"}, {"cat": "V", "key": "juice", "label": "小さいジュースのパック", "n": 200, "unit": "mL", "img": "img/questions/juice.webp", "eximg": "img/explanations/juice.webp"}, {"cat": "V", "key": "cup", "label": "コップ1ぱいのみず", "n": 2, "unit": "dL", "img": "img/questions/cup.webp", "eximg": "img/explanations/cup.webp"}, {"cat": "V", "key": "bottle", "label": "水とうのおちゃ", "n": 6, "unit": "dL", "img": "img/questions/bottle.webp", "eximg": "img/explanations/bottle.webp"}, {"cat": "V", "key": "pet", "label": "ペットボトルのおちゃ", "n": 500, "unit": "mL", "img": "img/questions/pet.webp", "eximg": "img/explanations/pet.webp"}, {"cat": "V", "key": "shampoo", "label": "シャンプーのボトル", "n": 5, "unit": "dL", "img": "img/questions/shampoo.webp", "eximg": "img/explanations/shampoo.webp"}, {"cat": "V", "key": "kettle", "label": "やかんのみず", "n": 2, "unit": "L", "img": "img/questions/kettle.webp", "eximg": "img/explanations/kettle.webp"}, {"cat": "V", "key": "bucket", "label": "バケツのみず", "n": 8, "unit": "L", "img": "img/questions/bucket.webp", "eximg": "img/explanations/bucket.webp"}, {"cat": "V", "key": "bath", "label": "おふろのみず", "n": 200, "unit": "L", "img": "img/questions/bath.webp", "eximg": "img/explanations/bath.webp"}, {"cat": "W", "key": "clip", "label": "クリップ1このおもさ", "n": 1, "unit": "g", "img": "img/questions/clip.webp", "eximg": "img/explanations/clip.webp"}, {"cat": "W", "key": "coin_w", "label": "1円玉1まいのおもさ", "n": 1, "unit": "g", "img": "img/questions/coin_w.webp", "eximg": "img/explanations/coin_w.webp"}, {"cat": "W", "key": "candy", "label": "あめ1このおもさ", "n": 4, "unit": "g", "img": "img/questions/candy.webp", "eximg": "img/explanations/candy.webp"}, {"cat": "W", "key": "pencil2", "label": "えんぴつ1本のおもさ", "n": 5, "unit": "g", "img": "img/questions/pencil2.webp", "eximg": "img/explanations/pencil2.webp"}, {"cat": "W", "key": "egg", "label": "たまご1このおもさ", "n": 60, "unit": "g", "img": "img/questions/egg.webp", "eximg": "img/explanations/egg.webp"}, {"cat": "W", "key": "apple", "label": "りんご1このおもさ", "n": 300, "unit": "g", "img": "img/questions/apple.webp", "eximg": "img/explanations/apple.webp"}, {"cat": "W", "key": "smartphone", "label": "スマートフォンのおもさ", "n": 170, "unit": "g", "img": "img/questions/smartphone.webp", "eximg": "img/explanations/smartphone.webp"}, {"cat": "W", "key": "textbook", "label": "教科書1さつのおもさ", "n": 400, "unit": "g", "img": "img/questions/textbook.webp", "eximg": "img/explanations/textbook.webp"}, {"cat": "W", "key": "randoseru2", "label": "にもつ入りランドセルのおもさ", "n": 3, "unit": "kg", "img": "img/questions/randoseru2.webp", "eximg": "img/explanations/randoseru2.webp"}, {"cat": "W", "key": "ricebag", "label": "おこめのふくろのおもさ", "n": 5, "unit": "kg", "img": "img/questions/ricebag.webp", "eximg": "img/explanations/ricebag.webp"}, {"cat": "W", "key": "cat", "label": "ネコのおもさ", "n": 4, "unit": "kg", "img": "img/questions/cat.webp", "eximg": "img/explanations/cat.webp"}, {"cat": "W", "key": "child2", "label": "2年生のたいじゅう", "n": 25, "unit": "kg", "img": "img/questions/child2.webp", "eximg": "img/explanations/child2.webp"}, {"cat": "K", "key": "schoolyard", "label": "校庭1しゅうのながさ", "n": 200, "unit": "m", "img": "img/questions/schoolyard.webp", "eximg": "img/explanations/schoolyard.webp"}, {"cat": "K", "key": "schoolpark", "label": "学校から近くの公園まで", "n": 500, "unit": "m", "img": "img/questions/schoolpark.webp", "eximg": "img/explanations/schoolpark.webp"}, {"cat": "K", "key": "homestation", "label": "家から駅までのきょり", "n": 1, "unit": "km", "img": "img/questions/homestation.webp", "eximg": "img/explanations/homestation.webp"}, {"cat": "K", "key": "walk15", "label": "あるいて15分くらいのきょり", "n": 1, "unit": "km", "img": "img/questions/walk15.webp", "eximg": "img/explanations/walk15.webp"}, {"cat": "K", "key": "walk30", "label": "あるいて30分くらいのみちのり", "n": 2, "unit": "km", "img": "img/questions/walk30.webp", "eximg": "img/explanations/walk30.webp"}, {"cat": "K", "key": "hike", "label": "えんそくコースのきょり", "n": 3, "unit": "km", "img": "img/questions/hike.webp", "eximg": "img/explanations/hike.webp"}, {"cat": "K", "key": "towntown", "label": "町からとなりの町まで", "n": 5, "unit": "km", "img": "img/questions/towntown.webp", "eximg": "img/explanations/towntown.webp"}, {"cat": "K", "key": "run10", "label": "10kmコースのきょり", "n": 10, "unit": "km", "img": "img/questions/run10.webp", "eximg": "img/explanations/run10.webp"}, {"cat": "K", "key": "tokyoosaka", "label": "東京から大阪までのきょり", "n": 500, "unit": "km", "img": "img/questions/tokyoosaka.webp", "eximg": "img/explanations/tokyoosaka.webp"}, {"cat": "K", "key": "fuji_d", "label": "富士山のたかさ", "n": 3776, "unit": "m", "img": "img/questions/fuji_d.webp", "eximg": "img/explanations/fuji_d.webp"}];
const CH={"L": ["mm", "cm", "m"], "V": ["mL", "dL", "L"], "W": ["g", "kg"], "K": ["m", "km"]},CN={"L": "ながさ（2年）", "V": "かさ（2年）", "W": "おもさ（3年）", "K": "きょり（3年）"};
let S;const $=id=>document.getElementById(id);const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function menu(){document.getElementById('app').innerHTML=`<div class="card menu"><h1>たんいをえらぼう</h1><p>絵を見て、ぴったりの「たんい」をえらぼう。</p><div class="categoryBtns">${Object.keys(CN).map(k=>`<button class="btn" onclick="start('${k}')">${CN[k]}</button>`).join('')}<button class="btn primary" onclick="start()">ぜんぶまぜる（10問）</button></div><p class="small">ぜんぶで ${Q.length} もん。問題の絵と、答え合わせ用の量感カードをすべて画像化しています。</p></div>`}
function start(c,list){const pool=list||Q.filter(q=>!c||q.cat===c);S={list:shuffle([...pool]).slice(0,Math.min(10,pool.length)),i:0,ok:0,miss:[],c};show()}
function show(){const q=S.list[S.i];S.q=q;S.done=false;document.getElementById('app').innerHTML=`<div class="top"><b>${S.i+1} / ${S.list.length}</b><span>せいかい ${S.ok}</span></div><div class="card" style="text-align:center"><img class="qpic" src="${q.img}" alt="${q.label}"><div class="q">${q.label}は <span class="n">${q.n}</span> <span class="blank">　　　</span> くらいです。</div></div><div class="choices">${CH[q.cat].map(u=>`<button class="u" onclick="pick('${u}',this)">${u}</button>`).join('')}</div><div id="fb" class="fb"></div><div id="ex"></div>`}
function pick(u,b){if(S.done)return;S.done=true;const a=S.q.unit,ok=u===a;if(ok)S.ok++;else S.miss.push(S.q);document.querySelectorAll('.u').forEach(x=>{x.disabled=true;if(x.textContent===a)x.classList.add('ok')});if(!ok)b.classList.add('ng');document.getElementById('fb').innerHTML=`<p class="${ok?'g':'r'}">${ok?'○ せいかい！':'× こたえは「'+a+'」'}</p><button class="btn" onclick="explain()">どうして？</button><button class="btn primary" onclick="next()">つぎへ →</button>`;if(!ok)explain()}
function explain(){document.getElementById('ex').innerHTML=`<div class="card" style="text-align:center"><img class="expic" src="${S.q.eximg}" alt="${S.q.label}の解説"></div>`;document.getElementById('ex').scrollIntoView({behavior:'smooth',block:'start'})}
function next(){S.i++;S.i<S.list.length?show():result()}
function result(){const t={},m={};S.list.forEach(q=>t[q.cat]=(t[q.cat]||0)+1);S.miss.forEach(q=>m[q.cat]=(m[q.cat]||0)+1);document.getElementById('app').innerHTML=`<div class="card result"><h1>${S.ok} / ${S.list.length} もん せいかい</h1>${Object.keys(t).map(k=>`<p>${CN[k]}　${t[k]-(m[k]||0)} / ${t[k]}</p>`).join('')}<button class="btn" onclick="start(S.c)">もういちど</button>${S.miss.length?`<button class="btn" onclick="start(null,S.miss)">まちがえた問題</button>`:''}<button class="btn primary" onclick="menu()">メニュー</button></div>`}
menu();
</script></body></html>
