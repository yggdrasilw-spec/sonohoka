        function uniqueNumberOptions(answer, offsets = [-3, -2, 2, 3]) {
            const vals = new Set([answer]);
            for (const d of shuffle(offsets)) {
                if (vals.size >= 3) break;
                const v = answer + d;
                if (v >= 0) vals.add(v);
            }
            while (vals.size < 3) vals.add(answer + vals.size + 1);
            return shuffle([...vals]);
        }

        function renderPairSelectionQuestion(content, cfg, onCorrect) {
            const nums = cfg.nums;
            const correctPair = [...cfg.correctPair].sort((a, b) => a - b);
            LearningSupport.setQuestionData({
                type: cfg.type || 'pair-selection', nums: [...nums], correctPair: [...correctPair],
                prompt: cfg.prompt || '', parenPos: cfg.parenPos || null
            });
            if (cfg.prompt) content.appendChild(showMessage(cfg.prompt, cfg.speaker || '🧑‍🏫'));
            const engine = makeExprHost(content);
            engine.reset(nums, ['+', '+'], cfg.parenPos || null);
            if (cfg.parenPos) engine.setParenActive(true);
            const status = el('div', { class: 'pair-status' }, ['2つ えらんでね']);
            content.appendChild(status);
            let picked = [];
            let done = false;
            engine.setTappable(async (idx) => {
                if (done) return;
                if (picked.includes(idx)) {
                    picked = picked.filter(x => x !== idx);
                    engine.unhighlight([idx]);
                    status.textContent = picked.length ? 'あと1つ えらんでね' : '2つ えらんでね';
                    return;
                }
                picked.push(idx);
                engine.highlight([idx], 'hl-gold');
                status.textContent = picked.length === 1 ? 'あと1つ えらんでね' : 'たしかめるよ';
                if (picked.length < 2) return;
                const sorted = [...picked].sort((a, b) => a - b);
                if (sorted[0] === correctPair[0] && sorted[1] === correctPair[1]) {
                    done = true;
                    engine.setTappable(null);
                    engine.clearHighlight();
                    engine.highlight(correctPair, 'hl-blue');
                    status.textContent = 'この2つ！';
                    onCorrect?.(engine, correctPair);
                } else {
                    const bad = [...picked];
                    LearningSupport.recordWrong({
                        type: cfg.wrongType || 'wrong-pair-order',
                        misconceptionTag: cfg.misconceptionTag || (cfg.parenPos ? 'ignored_parentheses' : 'wrong_first_group'),
                        selectedIndices: bad,
                        selectedValues: bad.map(i => nums[i]),
                        expectedIndices: correctPair
                    });
                    picked = [];
                    status.textContent = 'もういちど 2つ えらぼう';
                    await engine.flashWrong(bad);
                    engine.clearHighlight();
                }
            });
            return engine;
        }

        function renderOrderPracticeQuestion(content, cfg, onCorrect) {
            const nums = cfg.nums;
            const pair = [...cfg.correctPair].sort((a, b) => a - b);
            const partial = nums[pair[0]] + nums[pair[1]];
            const final = nums.reduce((a, b) => a + b, 0);
            LearningSupport.setQuestionData({
                type: 'three-step-order', nums: [...nums], parenPos: cfg.parenPos || null,
                correctPair: [...pair], intermediateAnswer: partial, finalAnswer: final
            });
            content.appendChild(showMessage(cfg.prompt || '① さいしょに けいさんする2つを えらぼう。', '🧑‍🏫'));
            const work = el('div', {});
            content.appendChild(work);
            const engine = makeExprHost(work);
            engine.reset(nums, ['+', '+'], cfg.parenPos || null);
            if (cfg.parenPos) engine.setParenActive(true);
            const status = el('div', { class: 'pair-status' }, ['① 2つ えらんでね']);
            work.appendChild(status);
            let picked = [];
            let phase = 'pair';

            engine.setTappable(async (idx) => {
                if (phase !== 'pair') return;
                if (picked.includes(idx)) {
                    picked = picked.filter(x => x !== idx);
                    engine.unhighlight([idx]);
                    return;
                }
                picked.push(idx);
                engine.highlight([idx], 'hl-gold');
                if (picked.length < 2) return;
                const sorted = [...picked].sort((a, b) => a - b);
                if (sorted[0] !== pair[0] || sorted[1] !== pair[1]) {
                    const bad = [...picked]; picked = [];
                    LearningSupport.recordWrong({
                        type: cfg.parenPos ? 'ignored-parentheses' : 'wrong-pair-order',
                        misconceptionTag: cfg.parenPos ? 'ignored_parentheses' : 'wrong_first_group',
                        selectedValues: bad.map(i => nums[i]), expectedPair: pair.map(i => nums[i])
                    });
                    status.textContent = 'ちがう組だね。もういちど。';
                    await engine.flashWrong(bad);
                    engine.clearHighlight();
                    return;
                }
                phase = 'intermediate';
                engine.setTappable(null);
                engine.clearHighlight();
                engine.highlight(pair, 'hl-blue');
                status.textContent = `① ${nums[pair[0]]}+${nums[pair[1]]} を さいしょに！`;
                await sleep(250);
                showIntermediate();
            });

            function showIntermediate() {
                const area = el('div', { class: 'feedback-slot' });
                work.appendChild(area);
                area.appendChild(showMessage(`② ${nums[pair[0]]}+${nums[pair[1]]} の こたえは？`, '🤔'));
                const opts = el('div', { class: 'quiz-options mt-4' });
                uniqueNumberOptions(partial).forEach(v => {
                    const b = el('button', { class: 'quiz-option' }, [String(v)]);
                    b.onclick = async () => {
                        if (phase !== 'intermediate') return;
                        if (v !== partial) {
                            LearningSupport.recordWrong({ type: 'intermediate', misconceptionTag: 'wrong_intermediate_result', value: v, expected: partial });
                            b.classList.add('wrong'); b.disabled = true;
                            return;
                        }
                        phase = 'animating';
                        opts.querySelectorAll('button').forEach(x => x.disabled = true);
                        engine.showCalc(pair, partial);
                        await sleep(550);
                        const nextNums = pair[0] === 0 ? [partial, nums[2]] : [nums[0], partial];
                        await engine.commitStep(nextNums, ['+']);
                        area.innerHTML = '';
                        phase = 'final';
                        showFinal(area);
                    };
                    opts.appendChild(b);
                });
                area.appendChild(opts);
            }

            function showFinal(area) {
                area.appendChild(showMessage('③ さいごの こたえは？', '🤔'));
                const opts = el('div', { class: 'quiz-options mt-4' });
                uniqueNumberOptions(final).forEach(v => {
                    const b = el('button', { class: 'quiz-option' }, [String(v)]);
                    b.onclick = async () => {
                        if (phase !== 'final') return;
                        if (v !== final) {
                            LearningSupport.recordWrong({ type: 'final', misconceptionTag: 'wrong_final_result', value: v, expected: final });
                            b.classList.add('wrong'); b.disabled = true;
                            return;
                        }
                        phase = 'done';
                        opts.querySelectorAll('button').forEach(x => x.disabled = true);
                        engine.highlight([0, 1], 'hl-blue');
                        engine.showCalc([0, 1], final);
                        await sleep(450);
                        await engine.commitFinal(final);
                        LearningSupport.recordCorrect();
                        onCorrect?.();
                    };
                    opts.appendChild(b);
                });
                area.appendChild(opts);
            }
        }

        function renderYesNoQuestion(content, prompt, correctYes, onCorrect, detail = {}) {
            LearningSupport.setQuestionData({ type: 'yes-no', prompt, correctYes, ...detail });
            content.appendChild(showMessage(prompt, '🤔'));
            const feedback = el('div', {});

        function freshMasteryQuestion(stageId, skill, generator) {
            const key = `${stageId}:${skill}`;
            if (!state.masterySeen.has(key)) state.masterySeen.set(key, new Set());
            const seen = state.masterySeen.get(key);
            for (let i=0;i<30;i++) {
                const q=generator();
                const sig=JSON.stringify(q);
                if (!seen.has(sig)) { seen.add(sig); return q; }
            }
            return generator();
        }

        function generateRoundQuestion() {
            const target=[10,20,30,40][randInt(0,3)];
            let a=Math.max(1,randInt(Math.max(1,target-16),target-2));
            let b=target-a;
            if(b<=0){a=Math.floor(target/2);b=target-a;}
            let c=randInt(2,19);
            for(let k=0;k<30 && ((a+c)%10===0 || (b+c)%10===0);k++) c=randInt(2,19);
            const tagged=[{v:a,p:true},{v:b,p:true},{v:c,p:false}];
            const mixed=shuffle(tagged);
            return {nums:mixed.map(x=>x.v),correctPair:mixed.map((x,i)=>x.p?i:null).filter(x=>x!==null),target};
        }

        function renderMasterySkill(content,stageId,skill,onCorrect) {
            if(skill==='order'){
                const q=freshMasteryQuestion(stageId,'order',()=>({nums:[randInt(2,9),randInt(2,9),randInt(2,9)]}));
                renderOrderPracticeQuestion(content,{nums:q.nums,correctPair:[0,1],prompt:`${q.nums.join('+')}。①さいしょの2つ → ②とちゅう → ③さいご の順で。`},onCorrect);return;
            }

                renderPairSelectionQuestion(content,{nums:q.nums,correctPair:[0,1],prompt:'（　）がないよ。さいしょに計算する2つは？'},onCorrect);return;
            }
            if(skill==='paren' || skill==='calc'){
                const q=freshMasteryQuestion(stageId,skill,()=>{const nums=[randInt(2,9),randInt(2,9),randInt(2,9)],right=Math.random()<.5;return{nums,pair:right?[1,2]:[0,1],parenPos:right?{start:1,end:2}:{start:0,end:1}};});
                renderOrderPracticeQuestion(content,{nums:q.nums,correctPair:q.pair,parenPos:q.parenPos,prompt:`${q.parenPos.start===0?'（'+q.nums[0]+'+'+q.nums[1]+'）+'+q.nums[2]:q.nums[0]+'+（'+q.nums[1]+'+'+q.nums[2]+'）'}。かっこから すすめよう。`},onCorrect);return;
            }
            if(skill==='assoc-calc'){renderAssociativityMastery(content,onCorrect);return;}
            if(skill==='round'){renderRoundMastery(content,onCorrect);return;}
            if(skill==='swap'){renderSwapMastery(content,onCorrect);return;}
            if(skill.startsWith('eq-')){renderEqualityMastery(content,skill,onCorrect);return;}
            if(skill==='regroup'){renderRegroupMastery(content,onCorrect);return;}
            if(skill.startsWith('story-') && !['story-to-expr'].includes(skill)){renderStoryGroupingMastery(content,skill,onCorrect);return;}
            if(skill==='story-to-expr'){renderStoryToExprMastery(content,onCorrect);return;}
            if(skill==='expr-to-story'){renderExprToStoryMastery(content,onCorrect);return;}
            if(skill.startsWith('reason-')){renderReasonMastery(content,skill,onCorrect);return;}
            renderYesNoQuestion(content,'この問題の大事な考えを じぶんで確かめられた？',true,onCorrect);
        }

        function renderMasteryCheck(stageId) {
            const session=LearningSupport.getSession(stageId);
            if(!state.masteryRun || state.masteryRun.stageId!==stageId){
                const plan=masteryPlan(stageId);
                if(session.supportUsed) plan.push(plan[plan.length-1]);
                state.masteryRun={stageId,plan,index:0,attempt:0,supportedAtStart:session.supportUsed};
            }
            const run=state.masteryRun;
            clearContent();
            const content=document.getElementById('content');content.classList.add('stage-mode');
            LearningSupport.begin(stageId,`mastery-${run.index+1}-try${++run.attempt}`);
            content.appendChild(el('div',{class:'mastery-banner'},[`じりきチェック ${run.index+1} / ${run.plan.length}：はじめて見る数・形で、ヒントなしで できるかな` ]));
            content.appendChild(masteryProgressDots(run));
            content.appendChild(showMessage(`「${masteryStageTitle(stageId)}」を、さっきとちがう問題で たしかめるよ。まちがえても大丈夫。そのときは別の問題でもう一度。`,'🧑‍🏫'));
            const finishItem=()=>{
                const cur=LearningSupport.current;
                const independent=!!cur && !cur.supportUsed && cur.wrongCount===0 && cur.hintLevel===0;
                LearningSupport.recordCorrect();
                if(!independent){
                    content.appendChild(showMessage('ここまでできたね。ただ、この問題ではヒント・いっしょに確認・まちがいのどれかがあったので、「できた判定」にはまだしないよ。','💡'));
                    content.appendChild(el('div',{class:'text-center mt-4'},[el('button',{class:'btn btn-primary',onclick:()=>renderMasteryCheck(stageId)},['🔄 数をかえて もう1回'])]));
                    return;
                }
                run.index++;run.attempt=0;
                if(run.index<run.plan.length){
                    content.appendChild(showMessage('ヒントなしで できた！ つぎは別の見方も たしかめよう。','✅'));
                    content.appendChild(el('div',{class:'text-center mt-4'},[el('button',{class:'btn btn-primary',onclick:()=>renderMasteryCheck(stageId)},['つぎの じりきチェック →'])]));
                    return;
                }
                LearningSupport.markMasteryConfirmed(stageId);
                finalizeStageCompletion(stageId);
                state.masteryRun=null;
                clearContent();
                const done=document.getElementById('content');done.classList.add('stage-mode');
                done.appendChild(stageHeader(`ステージ${stageId}：マスター！`,'ちがう数・ちがう形でも じぶんで できた',1,1));
                done.appendChild(showMessage('本番と同じ問題を覚えただけではなく、類題をヒントなしで通ったよ。これでクリア。','🏆'));
                const buttons=[];
                if(stageId<11) buttons.push(el('button',{class:'btn btn-secondary',onclick:()=>openStage(stageId+1,{restart:true})},[`ステージ${stageId+1}へ →`]));
                buttons.push(el('button',{class:'btn btn-outline',onclick:()=>showScreen('stage-select')},['🏠 ステージへ']));
                done.appendChild(el('div',{class:'btn-group mt-4'},buttons));
                LearningSupport.mount();
            };
            renderMasterySkill(content,stageId,run.plan[run.index],finishItem);
            content.appendChild(homeBtn());
            LearningSupport.mount();
        }

        function reviewSkillForStage(stageId) {
            const map={1:'order',2:'paren',3:Math.random()<.5?'left':'paren',4:'assoc-calc',5:'round',6:'swap',7:['eq-reverse','eq-expr','eq-false'][randInt(0,2)],8:['regroup','round','swap','eq-expr'][randInt(0,3)],9:['story-category','story-phase','story-round'][randInt(0,2)],10:Math.random()<.5?'story-to-expr':'expr-to-story',11:['reason-category','reason-phase','reason-round','reason-multi'][randInt(0,3)]};
            return map[stageId] || 'order';
        }

        function startSpacedReview(stageIds) {
            state.reviewQueue=[...stageIds];state.reviewIndex=0;renderSpacedReview();
        }

        function renderSpacedReview() {
            const stageId=state.reviewQueue[state.reviewIndex];
            if(!stageId){showScreen('home');return;}
            state.stage=stageId;
            state.currentScreen='stage';
            clearContent();
            const content=document.getElementById('content');content.classList.add('stage-mode');
            LearningSupport.begin(stageId,`spaced-review-${Date.now()}`);
            content.appendChild(el('div',{class:'review-banner'},[`🧠 時間をあけた おさらい ${state.reviewIndex+1} / ${state.reviewQueue.length}　（ステージ${stageId}）`]));
            content.appendChild(showMessage('前にできたことを、答えを見ずに思い出せるか たしかめよう。','🧑‍🏫'));
            const skill=reviewSkillForStage(stageId);
            const finish=()=>{
                const cur=LearningSupport.current;const independent=!!cur&&!cur.supportUsed&&cur.wrongCount===0&&cur.hintLevel===0;LearningSupport.recordCorrect();
                if(!independent){content.appendChild(showMessage('思い出す途中で助けを使ったので、別の問題でもう一度。できるまでここで練習していいよ。','💡'));content.appendChild(el('div',{class:'text-center mt-4'},[el('button',{class:'btn btn-primary',onclick:renderSpacedReview},['🔄 もう1問'])]));return;}
                const rec=state.reviewRecords[stageId]||{count:0,lastAt:0};rec.count=(rec.count||0)+1;rec.lastAt=Date.now();state.reviewRecords[stageId]=rec;saveProgress();state.reviewIndex++;

        // かっこの かきかえ もんだいを 1つ 作る（例：(7+12)+8 = 7+(□+8)、こたえは 12）
        function genParenProblem() {
            const a = randInt(2, 9), b = randInt(2, 29), c = randInt(2, 9);
            const total = a + b + c;
            if (Math.random() < 0.5) {
                return { given: `(${a} + ${b}) + ${c}`, before: `${a} + (`, after: ` + ${c})`, answer: b, total };
            }
            return { given: `${a} + (${b} + ${c})`, before: `(${a} + `, after: `) + ${c}`, answer: b, total };
        }

        // くふうして けいさんする もんだいを 1つ 作る（とちゅうの こたえ→さいごの こたえ の 2かい あなうめ）
        function genCalcProblem() {
            // 必ず、かっこの中が 10/20/30/40 の「きりのいい数」になるように作る。
            const target = [10, 20, 30, 40][randInt(0, 3)];
            const groupFirst = Math.random() < 0.5;
            let a, b, c;
            if (groupFirst) {
                a = randInt(2, Math.max(2, target - 2));
                b = target - a;
                c = randInt(2, 20);
            } else {
                b = randInt(2, Math.max(2, target - 2));
                c = target - b;
                a = randInt(2, 20);
            }
            const given = groupFirst ? `(${a} + ${b}) + ${c}` : `${a} + (${b} + ${c})`;
            const partial = target;
            const before2 = groupFirst ? '' : `${a} + `;
            const after2 = groupFirst ? ` + ${c}` : '';
            const total = a + b + c;
            return { given, partial, before2, after2, total };
        }

        function renderParenQuestion(content, onCorrect) {
            const p = genParenProblem();
            // 「□に中央の数を写すだけ」にならないよう、完成した式を比べて選ばせる。
            const m = p.given.match(/\d+/g).map(Number);
            const [a,b,c] = m;
            const givenGroupsLeft = p.given.trim().startsWith('(');
            const correct = givenGroupsLeft ? `${a} + (${b} + ${c})` : `(${a} + ${b}) + ${c}`;
            const unchanged = p.given;
            const reordered = givenGroupsLeft ? `${a} + (${c} + ${b})` : `(${b} + ${a}) + ${c}`;
            LearningSupport.setQuestionData({
                type:'regrouping-choice', given:p.given, correct, distractors:[unchanged,reordered],
                rule:'change-grouping-keep-number-order'
            });
            content.appendChild(showMessage('数の ならびは そのままにして、「まとめる場所だけ」を かえた式は どれ？', '🧑‍🏫'));
            const box=el('div',{class:'calc-quiz-expr'},[el('div',{},[p.given])]);
            content.appendChild(box);
            const row=el('div',{class:'quiz-options quiz-options-text mt-4'}); const feedback=el('div',{});
            shuffle([correct,unchanged,reordered]).forEach(v=>{
                const bEl=el('button',{class:'quiz-option'},[v]);
                bEl.onclick=()=>{
                    if(v===correct){
                        row.querySelectorAll('button').forEach(x=>x.disabled=true); bEl.classList.add('correct');
                        LearningSupport.recordCorrect();
                        feedback.appendChild(showMessage('せいかい！ 数のならびは かえず、（　）の場所だけを かえられたね。', '🎉'));
                        feedback.appendChild(el('div',{class:'text-center mt-4'},[el('button',{class:'btn btn-primary',onclick:onCorrect},['つぎの もんだいへ →'])]));
                    } else {

                        LearningSupport.recordWrong({type:'number-input',misconceptionTag:tag,value:v,expected:correct});
                        bEl.classList.add('wrong'); bEl.disabled=true;
                    }
                };
                row.appendChild(bEl);
            });
            content.appendChild(row); content.appendChild(feedback);
        }


        function renderCalcQuestion(content, onCorrect) {
            const p = genCalcProblem();
            let typed = '';

            LearningSupport.setQuestionData({
                type:'calculation-two-step', given:p.given, intermediate:p.partial, final:p.total

            const exprBox=el('div',{class:'calc-quiz-expr'},[
                el('div',{},[p.given]),

                el('div',{class:'mt-4'},['= ',blank2]),
            ]);
            content.appendChild(exprBox); const feedback=el('div',{}); content.appendChild(feedback);
            function activeBlank(){return stage===1?blank1:blank2;}
            function updateBlank(){const b=activeBlank();b.textContent=typed===''?'？':typed;b.className='blank'+(typed?' filled':'');}
            function submit(){
                if(typed==='')return;
                const answer=stage===1?p.partial:p.total; const b=activeBlank();

                    b.className='blank correct'; typed='';

                    }

        // ============================================================

        const THINKING_PRACTICE_ROUND = 8;
        const REASON_DEFS = [
            { key:'round', icon:'🧮', img:'img/reason_round.svg', label:'けいさん', detail:'たすと きりのいい数になる' },
            { key:'category', icon:'🎒', img:'img/reason_category.svg', label:'なかま', detail:'おなじ なかまをまとめる' },
            { key:'phase', icon:'⏰', img:'img/reason_phase.svg', label:'とき', detail:'おなじ ときの できごとをまとめる' },
        ];

        // 「なかま」と「とき」の正解位置が固定されないよう、構造そのものを毎回変える。
        function yen() { return randInt(1, 18) * 5; }
        const THINKING_CATALOG = {
            drink:[{label:'ジュース',icon:'🧃'},{label:'ぎゅうにゅう',icon:'🥛'}],
            stationery:[{label:'けしゴム',icon:'🧽'},{label:'えんぴつ',icon:'✏️'},{label:'ノート',icon:'📓'}],
            fruit:[{label:'りんご',icon:'🍎'},{label:'みかん',icon:'🍊'},{label:'バナナ',icon:'🍌'}],
            toy:[{label:'にんぎょう',icon:'🪆'},{label:'くるま',icon:'🚗'},{label:'ボール',icon:'⚽'}],
            book:[{label:'えほん',icon:'📖'},{label:'ずかん',icon:'📚'}],
            snack:[{label:'クッキー',icon:'🍪'},{label:'あめ',icon:'🍬'}],
        };
        function pickCatalog(cat, index=0){ const a=THINKING_CATALOG[cat]; return a[index%a.length]; }
        function genThinkingInstance(forceIdx = null) {
            const categoryPairLeft = forceIdx === 0 ? false : Math.random() < .5;
            const phasePairLeft = forceIdx === 0 ? true : Math.random() < .5;
            const cats = categoryPairLeft ? ['stationery','stationery','fruit'] : ['drink','fruit','fruit'];
            const used={};
            const items=cats.map((cat,i)=>{
                const n=used[cat]||0;used[cat]=n+1;const base=pickCatalog(cat,n);
                return {count:yen(),label:base.label,icon:base.icon,category:cat,phase:(phasePairLeft?(i<2?'first':'later'):(i===0?'first':'later'))};
            });
            const first=items.filter(x=>x.phase==='first').map(x=>`${x.count}円の ${x.label}`);
            const later=items.filter(x=>x.phase==='later').map(x=>`${x.count}円の ${x.label}`);
            const firstText=first.length===2?`${first[0]}と ${first[1]}を 買いました`:`${first[0]}を 買いました`;
            const laterText=later.length===2?`あとから ${later[0]}と ${later[1]}を 買いました`:`あとから ${later[0]}を 買いました`;
            return {idx:0,text:`おみせで、${firstText}。${laterText}。ぜんぶで いくら つかいましたか。`,items,categoryPairLeft,phasePairLeft};
        }

        function makeReasonIcon(def) {
            const box = el('span', { class: 'reason-icon' });

        function getTruthForPair(items, groupIdx) {
            const pair = groupIdx === 0 ? [0, 1] : [1, 2];
            const [i1, i2] = pair;
            return {
                pair, i1, i2,
                truth: {
                    round: (items[i1].count + items[i2].count) % 10 === 0,
                    category: items[i1].category === items[i2].category,
                    phase: items[i1].phase === items[i2].phase,
                }
            };
        }

        function genThinkingInstanceUntil(checker, maxTry = 120) {
            for (let i = 0; i < maxTry; i++) {
                const inst = genThinkingInstance();
                if (checker(inst)) return inst;
            }
            return genThinkingInstance();
        }

                            const s = items[i1].count + items[i2].count;
                            note = isTrue ? ` ${items[i1].count}+${items[i2].count}=${s} で、きりのいい数になるね。` : ` ${items[i1].count}+${items[i2].count} は きりのいい数に ならないね。`;
                        } else if (reasonKey === 'category') {
                            note = isTrue ? ' おなじ なかま どうしだね。' : ' ちがう なかま どうしだね。';
                        } else if (reasonKey === 'phase') {
                            note = isTrue ? ' おなじ ときの できごと だね。' : ' べつの ときの できごと だね。';

                    } else {

        function renderSubsetReasonQuestion(content, inst, groupIdx, keys, onCorrect) {
            const items = inst.items;

                { mode:'binary', key:'category', expected:false, title:'② なかま：あてはまらない？', prompt:'おなじ なかま かな' },
                { mode:'binary', key:'phase', expected:true, title:'③ とき：あてはまる？', prompt:'おなじ ときの できごと かな' },
                { mode:'binary', key:'phase', expected:false, title:'④ とき：あてはまらない？', prompt:'おなじ ときの できごと かな' },
                { mode:'binary', key:'round', expected:true, title:'⑤ けいさん：YESの例', prompt:'きりのいい数に なって けいさんしやすい かな' },
                { mode:'binary', key:'round', expected:false, title:'⑥ けいさん：NOの例', prompt:'きりのいい数に なって けいさんしやすい かな' },

            ];
            const total=plan.length; const correct=Math.min(state.thinkingPracticeCorrect||0,total);
            content.appendChild(stageHeader('ステージ11：しきの きもち', `${correct} / ${total} もん せいかい`, total, correct));
            if(correct>=total){
                if(!state.completedStages.has(11)){const done=completeStage(11);if(!done)return;}
                content.appendChild(showMessage('「あてはまる」だけでなく、「あてはまらない」も たしかめたよ。しきの まとめ方の意味を 読めるようになったね。','🏆'));
                content.appendChild(el('div',{class:'btn-group mt-4'},[
                    el('button',{class:'btn btn-primary',onclick:()=>{state.thinkingPracticeCorrect=0;LearningSupport.resetStage(11);showScreen('stage');}},['🔄 もういちど']),
                    el('button',{class:'btn btn-outline',onclick:()=>showScreen('stage-select')},['🏠 ステージへ'])
                ]));
                content.appendChild(homeBtn());return;
            }
            const onCorrect=()=>{state.thinkingPracticeCorrect=(state.thinkingPracticeCorrect||0)+1;showScreen('stage');};
            const phase=plan[correct]; content.appendChild(showMessage(phase.title,'🧑‍🏫'));
            if(phase.mode==='binary'){
                const groupIdx=randInt(0,1);
                const inst=genThinkingInstanceUntil(candidate=>getTruthForPair(candidate.items,groupIdx).truth[phase.key]===phase.expected);
                renderBinaryReasonQuestion(content,inst,groupIdx,phase.key,onCorrect,phase.prompt);
            }else if(phase.mode==='subset'){
                const groupIdx=randInt(0,1);
                renderSubsetReasonQuestion(content,genThinkingInstance(),groupIdx,phase.keys,onCorrect);
            }else{
                const inst=genThinkingInstance(); const groupIdx=randInt(0,1);
                renderReasonQuestion(content,inst,groupIdx,onCorrect);
            }
            content.appendChild(homeBtn());
        }

        // ============================================================
        // 先生支援（TeacherBridge & 先生ダッシュボード連携）
        // ============================================================
        const STAGE_TITLES = {
            1: 'ひだりからけいさん',
            2: 'かっこちゃんとうじょう',
            3: 'どっちが先？クイズ',
            4: 'こたえはおなじ！',
            5: 'きりのいいかず',
            6: 'きりのいいかず（3つの数）',
            7: 'じゅんばんを かえよう！',
            8: 'かっこを つけよう！',
            9: 'かっこを はずそう！',
            10: 'おはなしから しきへ',
            11: 'しきの きもち'
        };

        function renderTeacherConnectCard() {
            const card = el('div', { class: 'teacher-connect-card' });

            const left = el('div', { style: 'display: flex; align-items: center; gap: 8px;' });
            left.appendChild(el('span', { style: 'font-size: 20px;' }, ['🧑‍🏫']));

            const nameWrap = el('div', { style: 'text-align: left;' });
            const currentNickname = window.StudentProfile ? window.StudentProfile.getNickname() || 'たろう' : 'たろう';
            const nickSpan = el('span', {
                id: 'studentNicknameDisplay',
                style: 'color: #0284c7; cursor: pointer; text-decoration: underline;',
                title: 'クリックして名前を変更'
            }, [currentNickname]);
            nickSpan.addEventListener('click', () => {
                if (!window.StudentProfile) return;
                const old = window.StudentProfile.getNickname() || 'たろう';
                const newName = prompt('なまえを入力してください（ひらがな・カタカナ・漢字）:', old);
                if (newName && newName.trim()) {
                    const saved = window.StudentProfile.setNickname(newName.trim());
                    nickSpan.textContent = saved;
                }
            });

            const nameLine = el('div', { style: 'font-size: 13px; font-weight: 900; color: #334155;' }, ['なまえ：', nickSpan]);
            const subText = el('div', {
                id: 'teacherConnSubText',
                style: 'font-size: 11px; color: #64748b;'
            }, ['先生コードがあれば入れよう']);
            nameWrap.appendChild(nameLine);
            nameWrap.appendChild(subText);
            left.appendChild(nameWrap);
            card.appendChild(left);

            const right = el('div', { style: 'display: flex; align-items: center; gap: 6px;' });
            const codeInput = el('input', {
                type: 'text',
                id: 'teacherCodeInput',
                placeholder: '先生コード',
                maxlength: '8',
                autocomplete: 'off',
                style: 'width: 100px; padding: 6px 8px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 14px; font-weight: 900; text-align: center; text-transform: uppercase;'
            });

            const sess = window.TeacherBridge ? window.TeacherBridge.getSessionState() : { connected: false, teacherCode: '' };
            if (sess.connected && sess.teacherCode) {
                codeInput.value = sess.teacherCode;
            } else if (window.StudentProfile) {
                const urlParams = new URLSearchParams(window.location.search);
                const codeFromUrl = urlParams.get('teacherCode') || urlParams.get('code');
                const lastCode = codeFromUrl || window.StudentProfile.getLastTeacherCode();
                if (lastCode) codeInput.value = lastCode;
            }

            const connectBtn = el('button', {
                id: 'teacherConnectBtn',
                class: 'btn btn-primary',
                style: 'padding: 6px 12px; font-size: 13px; min-width: unset; border-radius: 10px;',
                type: 'button'
            }, [sess.connected ? '切断' : 'つなぐ']);

            const indicator = el('span', {
                id: 'teacherConnIndicator',
                title: sess.connected ? '先生に接続中: ' + sess.teacherCode : '先生未接続',
                style: 'font-size: 16px;'
            }, [sess.connected ? '🟢' : '⚪']);

            connectBtn.addEventListener('click', handleConnectTeacher);
            codeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleConnectTeacher();
            });

            right.appendChild(codeInput);
            right.appendChild(connectBtn);
            right.appendChild(indicator);
            card.appendChild(right);

            if (sess.connected) {
                subText.textContent = '先生につながっています (' + sess.teacherCode + ')';
            }

            return card;
        }

        function updateTeacherIndicator(overrideStatus, overrideCode) {
            const sess = window.TeacherBridge ? window.TeacherBridge.getSessionState() : { connected: false, teacherCode: '' };
            const status = overrideStatus || (sess.connected ? 'connected' : 'none');
            const code = overrideCode || sess.teacherCode || '';

            const ind = document.getElementById('teacherConnIndicator');
            const topBtn = document.getElementById('topTeacherStatusBtn');
            const topTxt = document.getElementById('topTeacherStatusText');
            const subTxt = document.getElementById('teacherConnSubText');
            const btn = document.getElementById('teacherConnectBtn');

            if (status === 'connected') {
                if (ind) { ind.textContent = '🟢'; ind.title = '先生に接続中: ' + code; }
                if (btn) btn.textContent = '切断';
                if (subTxt) subTxt.textContent = '先生につながっています (' + code + ')';
                if (topBtn) topBtn.style.display = 'inline-flex';
                if (topTxt) topTxt.textContent = '先生: ' + code;
            } else if (status === 'connecting') {
                if (ind) { ind.textContent = '🟡'; ind.title = '接続確認中...'; }
                if (btn) btn.textContent = '確認中';
                if (subTxt) subTxt.textContent = '接続確認中...';
            } else {
                if (ind) { ind.textContent = '⚪'; ind.title = '先生未接続'; }
                if (btn) btn.textContent = 'つなぐ';
                if (subTxt) subTxt.textContent = '先生コードがあれば入れよう';
                if (topBtn) topBtn.style.display = 'none';
            }
        }

        async function handleConnectTeacher() {
            if (!window.TeacherBridge) return;
            const input = document.getElementById('teacherCodeInput');
            const code = input ? input.value.trim() : '';
            const sess = window.TeacherBridge.getSessionState();

            if (sess.connected) {
                window.TeacherBridge.leaveSession(true);
                updateTeacherIndicator('none');
                if (input) input.value = '';
                return;
            }

            if (!code) {
                alert('先生コードを入力してください。');
                return;
            }

            updateTeacherIndicator('connecting');
            const res = await window.TeacherBridge.joinSession(code);
            if (res.success) {
                updateTeacherIndicator('connected', res.code);
            } else {
                updateTeacherIndicator('none');
                alert(res.message);
            }
        }

        function initTeacherBridgeIntegration() {
            if (!window.TeacherBridge || !window.StudentProfile) return;

            window.TeacherBridge.init({
                appId: 'tashizan-daibouken',
                appName: 'たしざん大冒険'
            });

            const topBtn = document.getElementById('topTeacherStatusBtn');
            if (topBtn) {
                topBtn.addEventListener('click', () => {
                    const sess = window.TeacherBridge.getSessionState();
                    if (sess.connected) {
                        alert('先生コード [' + sess.teacherCode + '] で先生とつながっています。');
                    }
                });
            }

            window.TeacherBridge.onTeacherStatusChange(({ status }) => {
                const banner = document.getElementById('teacherNoticeBanner');
                const icon = document.getElementById('teacherNoticeIcon');
                const main = document.getElementById('teacherNoticeMain');
                const sub = document.getElementById('teacherNoticeSub');

                if (banner) {
                    if (status === 'teacher_coming') {
                        banner.classList.remove('hidden');
                        banner.style.borderColor = '#f59e0b';
                        banner.style.background = '#fffbeb';
                        banner.style.color = '#92400e';
                        if (icon) icon.textContent = '🏃';
                        if (main) main.textContent = '先生が見に来ます';
                        if (sub) sub.textContent = 'この画面で待っていてね';
                    } else if (status === 'teacher_supporting') {
                        banner.classList.remove('hidden');
                        banner.style.borderColor = '#3b82f6';
                        banner.style.background = '#eff6ff';
                        banner.style.color = '#1e40af';
                        if (icon) icon.textContent = '👀';
                        if (main) main.textContent = '先生といっしょに見ているよ';
                        if (sub) sub.textContent = '';
                    } else {
                        banner.classList.add('hidden');
                    }
                }

                if (LearningSupport.current) {
                    if (status === 'teacher_coming') {
                        LearningSupport.showHint(Math.max(1, LearningSupport.current.hintLevel || 1), '先生が いま そちらへ むかっているよ。');
                    } else if (status === 'teacher_supporting') {
                        LearningSupport.showHint(Math.max(1, LearningSupport.current.hintLevel || 1), '先生と いっしょに 見ているよ。');
                    }
                }
            });

            window.TeacherBridge.onSessionEnded(() => {
                updateTeacherIndicator('none');
                const banner = document.getElementById('teacherNoticeBanner');
                if (banner) banner.classList.add('hidden');
                alert('この先生コードの時間は終了しました。\n教材はこのまま続けられます。先生に新しいコードを聞いてください。');
            });

            const urlParams = new URLSearchParams(window.location.search);
            const codeFromUrl = urlParams.get('teacherCode') || urlParams.get('code');
            if (codeFromUrl) {
                handleConnectTeacher();
            }
        }

        // ============================================================
        // バックボタン／初期表示
        // ============================================================
        document.getElementById('backBtn').addEventListener('click', () => {
            if (state.currentScreen === 'stage') {
                if (confirm('ステージを ちゅうだんして ホームへ もどる？')) {
                    rememberStageProgress(state.stage);
                    if (window.TeacherBridge) window.TeacherBridge.pause();
                    showScreen('home');
                }
            } else {
                showScreen('home');
            }
        });

        initTeacherBridgeIntegration();
        showScreen('home');
    </script>
</body>
