<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>整数のせいしつ　発展ラボ</title>
<style>
:root{--paper:#fdfdf8;--grid:#d9e6f2;--ink:#243447;--red:#d6336c;--org:#f08c00;--blue:#1c7ed6;--grn:#2f9e44}
*{box-sizing:border-box}
html{font-size:min(1.04vw,1.85vh)}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;background:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:1.2rem 1.2rem}
.app{width:100vw;height:100vh;display:grid;grid-template-columns:23% 1fr 29%;grid-template-rows:auto 1fr;gap:.6rem;padding:.6rem}
header{grid-column:1/4;display:flex;align-items:center;gap:.9rem}
h1{font-size:1.2rem;margin:0;white-space:nowrap}
#tabs{display:flex;gap:.4rem;flex:1}
#tabs button{flex:1;padding:.5rem .3rem;border:.12rem solid var(--ink);background:#fff;border-radius:.5rem;font:inherit;font-size:1.05rem;font-weight:bold;cursor:pointer}
#tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
section{background:#fff;border:.14rem solid var(--ink);border-radius:.7rem;padding:.9rem;min-height:0;min-width:0}
#left{display:flex;flex-direction:column;gap:1rem;overflow:auto}
#q{font-size:1.2rem;line-height:1.75}
#q b,.t b{color:var(--red)}
#inp{display:flex;flex-wrap:wrap;gap:.8rem;align-items:end;border-top:.1rem dashed #adb5bd;padding-top:1rem}
#inp label{font-size:1rem;display:flex;flex-direction:column;gap:.2rem}
#inp input{width:6rem;font:inherit;font-size:1.5rem;padding:.2rem;border:.15rem solid var(--blue);border-radius:.4rem}
button{font:inherit;color:var(--ink)}
#rnd,#fs,#ctl button,.sb{padding:.45rem .8rem;border:.12rem solid var(--ink);background:#fff;border-radius:.5rem;cursor:pointer;font-weight:bold;font-size:1.05rem}
.sb{margin:.2rem .3rem .2rem 0}
#ctl .go{background:var(--blue);color:#fff;border-color:var(--blue)}
button:focus-visible,input:focus-visible{outline:.2rem solid var(--org);outline-offset:.15rem}
button:disabled{opacity:.35;cursor:default}
#fig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;overflow:hidden;background:#fffefa}
#fig svg{flex:1 1 0;min-height:0;width:100%;max-width:none!important}
#right{display:flex;flex-direction:column;gap:.6rem}
#txt{flex:1;overflow:auto;min-height:0}
#ctl{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;border-top:.1rem dashed #adb5bd;padding-top:.6rem;font-size:1.05rem}
.t{font-size:1.2rem;line-height:1.8;margin:.6rem 0;background:#f8fafc;border-left:.35rem solid #adb5bd;border-radius:.4rem;padding:.4rem .8rem}
.tb,b.tb{color:var(--blue)!important}.tg,b.tg{color:var(--grn)!important}.tp,b.tp{color:#e64980!important}.ty,b.ty{color:#d98e00!important}.tk,b.tk{color:#8d5524!important}.ta,b.ta{color:#e64980!important}
#inp label.tb{color:var(--blue)}#inp label.tg{color:var(--grn)}#inp label.tk{color:#8d5524}#inp label.ta{color:#e64980}
.stt{font-size:1.15rem;font-weight:bold;background:var(--ink);color:#fff;padding:.35rem .8rem;border-radius:.4rem;margin-bottom:.4rem}
select{font:inherit;font-size:1.1rem;padding:.3rem;border:.15rem solid var(--blue);border-radius:.4rem;background:#fff}
.tok{transition:transform .8s cubic-bezier(.35,0,.2,1),opacity .6s}.tok rect{transition:fill .6s,stroke .6s}
.veh{opacity:0;transform-box:fill-box;transform-origin:center}.veh.stay{opacity:1}.veh.go{animation:dep .9s ease-in forwards}
@keyframes dep{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateX(70px)}}
.dc{cursor:grab;touch-action:none}svg.dr{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.dc.drag{cursor:grabbing}.dc.anim{transition:transform .55s cubic-bezier(.35,0,.2,1)}.dc rect{transition:fill .3s,stroke .3s}
.glow{animation:glw .9s ease-in-out infinite alternate}@keyframes glw{from{filter:drop-shadow(0 0 0 transparent)}to{filter:drop-shadow(0 0 10px var(--gc,#e64980))}}
.go2{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}
.figp{font-size:1.5rem;line-height:2.3;align-self:stretch}.figp .chip{font-size:1.4rem}
.cards,.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:.4rem 0;font-size:1.7rem}
.card,.slot{width:5.2rem;height:6.2rem;border:.2rem solid var(--ink);border-radius:.6rem;background:#ffe9b8;display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:bold;position:relative}
.slot{background:#fff}.slot small{position:absolute;top:0;left:.3rem;font-size:.8rem;font-weight:normal}
.card.ev,.slot.ev{background:#ffd8a8;border-color:var(--org)}
.chip{display:inline-block;min-width:2.2rem;text-align:center;padding:.1rem .5rem;margin:.12rem;border-radius:1rem;background:#edf2f7;font-weight:bold;font-size:1.1rem}
.chip.hi{background:var(--blue);color:#fff}.chip.hi.cg{background:var(--grn)}.chip.hi.big{background:var(--red);transform:scale(1.2)}
.chip.pr{background:var(--grn);color:#fff}.chip.co{outline:.12rem solid var(--red);outline-offset:.08rem}
.ans{border:.2rem solid var(--red);border-radius:.7rem;color:var(--red);font-size:1.7rem;font-weight:bold;padding:.4rem 1rem;margin:.6rem 0;display:inline-block;background:#fff5f8}
table{border-collapse:collapse;margin:.4rem 0;font-size:1.1rem}td,th{border:.08rem solid #adb5bd;padding:.2rem .6rem;text-align:center}th{background:#e7f5ff;font-size:.9rem}
.mv{transition:transform .7s cubic-bezier(.35,0,.2,1)}
.dv{transition:transform .6s cubic-bezier(.35,0,.2,1),opacity .2s}
.pop{animation:pop .6s ease-out}@keyframes pop{from{opacity:0}to{opacity:1}}
svg text{font-family:inherit}
@media (prefers-reduced-motion:reduce){.dv{transition-duration:.01s}.dc.anim{transition-duration:.01s}.glow{animation:none}.veh.go{animation:none;opacity:1}.tok{transition-duration:.01s}.mv{transition-duration:.01s}.pop{animation:none}}
@media (max-aspect-ratio:1/1){html{font-size:min(2.6vw,2.2vh)}body{overflow:auto}.app{height:auto;display:flex;flex-direction:column}#fig{min-height:70vw}#fig svg{flex:none;height:auto}#txt{overflow:visible}}

/* Readable at school-tablet widths and browser zoom. */
html{font-size:16px}body{overflow:auto}
.app{height:auto;min-height:100svh;grid-template-columns:minmax(240px,23%) minmax(0,1fr) minmax(300px,29%);grid-template-rows:auto 1fr;align-items:start}
header{grid-column:1/-1;flex-wrap:wrap;min-width:0}h1{white-space:normal;font-size:1.1rem;line-height:1.5;overflow-wrap:anywhere}
#tabs{flex:1 1 100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}#tabs:empty{display:none}
#tabs button{min-width:0;line-height:1.5;font-size:1rem;overflow-wrap:anywhere}
button,select,input{min-height:44px}button{line-height:1.5}#fs{margin-left:auto}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #c15c00;outline-offset:3px}
#left{overflow:visible}#fig{min-height:520px;overflow:visible;justify-content:flex-start;width:100%}
#fig svg{flex:none;height:auto;max-height:560px;width:100%}#fig svg.dr{max-height:390px}
#right{min-height:520px}#txt{overflow:visible}#q,.t{font-size:1.05rem;line-height:1.8}
#ctl{margin-top:auto}.tb,b.tb{color:#145ca4!important}.tg,b.tg{color:#237833!important}.ty,b.ty{color:#885300!important}.tp,b.tp,.ta,b.ta{color:#aa205b!important}
#inp{gap:.6rem}#inp label{max-width:100%}#inp input{width:5rem;font-size:1.25rem}#inp select{max-width:100%}
.figp{font-size:1.1rem;line-height:1.8;width:100%}.figp .chip{font-size:1.05rem}
.card-tools{width:100%;padding:.7rem;background:#f3f7fc;border:1px solid #b9c9da;border-radius:.6rem;font-size:1rem;line-height:1.6}
.card-tools p{margin:.2rem 0 .6rem}.tool-row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.tool-row button{border:2px solid #243447;border-radius:.5rem;background:#fff;padding:.4rem .6rem;font-size:1rem;min-width:60px}
.tool-row button[aria-pressed=true]{background:#ffe9b8;border-color:#b65300;box-shadow:0 0 0 2px #b65300}
.groups{width:100%;display:grid;gap:.6rem}.group-box{border:2px solid #b9c9da;padding:.7rem;border-radius:.7rem;background:#f7faff;font-size:1.1rem;line-height:1.65}
.group-box.chosen{border:3px solid #b62959;background:#fff4f8}.group-box strong{font-size:1.3rem}.group-box span{display:block}
details{margin:.7rem 0;width:100%}summary{cursor:pointer;padding:.5rem;border:1px solid #b9c9da;border-radius:.5rem;line-height:1.6;font-size:1rem}
.number-list{display:flex;flex-wrap:wrap;gap:.5rem;padding:.6rem 0}.number-list span{padding:.3rem .5rem;background:#eef3f8;border-radius:.3rem;font-size:1rem}
.step-select{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;width:100%;font-size:1rem}.step-select select{max-width:100%;width:100%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.notice{padding:.7rem;border-left:4px solid #b62959;background:#fff4f8;font-size:1rem;line-height:1.8}
.chip{max-width:100%}table{width:100%;font-size:1rem}td,th{padding:.3rem;overflow-wrap:anywhere}.ans{max-width:100%;overflow-wrap:anywhere}
@media(max-width:1199px){.app{grid-template-columns:minmax(240px,32%) minmax(0,1fr)}#right{grid-column:1/-1;min-height:0}#fig{min-height:420px}}
@media(max-width:760px){html{font-size:16px}.app{display:flex;flex-direction:column;padding:.5rem;gap:.6rem}.app>header,.app>section{width:100%}#tabs{grid-template-columns:repeat(2,minmax(0,1fr))}#fig{min-height:0;padding:.7rem}#fig svg{height:auto;min-height:0;max-height:none}#right{min-height:0}#inp{gap:.5rem}#ctl{position:static}.t{padding:.5rem .6rem}.group-box{font-size:1rem}.figp{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div><div class="app">
<header><h1>整数のせいしつ　発展ラボ</h1><div id="tabs" role="tablist"></div><button id="fs">全画面</button></header>
<section id="left"><div id="q"></div><div id="inp"></div><p id="inputNotice" class="notice" role="status" hidden></p></section>
<section id="fig"></section>
<section id="right" role="tabpanel" aria-labelledby="tab-0"><div id="txt"></div>
<div id="ctl"><button id="bk">◀ もどる</button><button id="nx" class="go">つぎへ ▶</button><button id="all">ぜんぶ見る</button><span id="cnt"></span><label class="step-select">見たい場面へ<select id="stepJump" aria-label="見たい場面へ移動"></select></label></div></section>
</div>
<script>
const $=s=>document.querySelector(s);
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a/gcd(a,b)*b;
const divs=n=>[...Array(n)].map((_,i)=>i+1).filter(i=>n%i==0);
const mul=(n,m)=>{const r=[];for(let k=n;k<=m;k+=n)r.push(k);return r};
const chips=(l,hi,big,co=[],cl='')=>l.slice(0,100).map(x=>`<span class="chip ${hi.includes(x)?'hi'+(x===big?' big':'')+(cl?' '+cl:''):''}${co.includes(x)?' co':''}">${x}</span>`).join('')+(l.length>100?'…':'');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const dots=(n,c,x,y,col,sq)=>{let s='';for(let i=0;i<n;i++){const X=x+(i%c)*18,Y=y+Math.floor(i/c)*18;
 s+=sq?`<rect x="${X-7}" y="${Y-5}" width="14" height="10" rx="3" fill="${col}"/>`:`<circle cx="${X}" cy="${Y}" r="7" fill="${col}"/>`}return s};
const GUMMY='#ed8c38', CANDY=['#e64980','#1c7ed6','#2f9e44','#f08c00'];
const candyDots=(n,c,x,y)=>{let s='';for(let i=0;i<n;i++)s+=dots(1,1,x+(i%c)*18,y+Math.floor(i/c)*18,CANDY[i%4],1);return s};

const G={dp:0,pd:0,cn:1,rn:1,last:'',max:0,pos:null,dv:1,ps:-1,an:0,auto:0,tk:null,tr:[-1,-1,-1],hint:0,msg:'',bad:[],ok:0};
function share(a,b,g,x,y){
 const per=Math.min(g,6),bw=86,bh=(Math.ceil(x/4)+Math.ceil(y/4))*18+30,pr=Math.max(Math.ceil(a/10),Math.ceil(b/10)),py=26+pr*18+16,rows=Math.ceil(g/per),H=py+rows*(bh+10)+8;
 const bx=p=>8+(p%per)*(bw+10),by=p=>py+Math.floor(p/per)*(bh+10),M=g*2;
 G.max=M;
 G.pos=(k,i,st)=>{const n=k?y:x,p=Math.floor(i/n),j=i%n;
  if(p*2+k<st)return[bx(p)+14+(j%4)*18,by(p)+30+(k?Math.ceil(x/4)*18:0)+Math.floor(j/4)*18];
  return[(k?366:26)+(i%10)*18,26+Math.floor(i/10)*18]};
 let sv=`<text x="20" y="14" font-size="14" font-weight="bold" fill="#8d5524">グミ ${a}個</text><text x="360" y="14" font-size="14" font-weight="bold" fill="#e64980">ラムネ ${b}個</text>`;
 for(let p=0;p<g;p++)sv+=`<rect x="${bx(p)}" y="${by(p)}" width="${bw}" height="${bh}" rx="8" fill="#fff" stroke="#243447" stroke-width="2"/><text x="${bx(p)+6}" y="${by(p)+15}" font-size="12">${p+1}袋め</text>`;
 for(let k=0;k<2;k++)for(let i=0;i<(k?b:a);i++){const[X,Y]=G.pos(k,i,G.pd),n=k?y:x;
  sv+=`<g class="mv" data-k="${k}" data-i="${i}" data-j="${i%n}" data-m="${Math.floor(i/n)*2+k}" style="transform:translate(${X}px,${Y}px)">${k?`<rect x="-7" y="-5" width="14" height="10" rx="3" fill="${CANDY[i%4]}"/>`:`<circle r="7" fill="${GUMMY}"/>`}</g>`}
 const m=G.dp,nm=(q)=>{const p=Math.floor(q/2),k=q%2;return`${p+1}袋めに ${k?'ラムネ':'グミ'}を <b>${k?y:x}個</b>（${k?b:a}÷${g}）`};
 let msg=m==0?`はじめはまだ1つも分けていません。1袋分を1種類ずつ配ってみましょう。<br>つぎ：${nm(0)}`:m>=M?`${nm(m-1)} 配りました。これで全袋に配り終わりました。`:`${nm(m-1)} 配りました。<br>つぎ：${nm(m)}`;
 let h=`<svg class="sh" viewBox="0 0 640 ${H}">${sv}</svg><p class="t">${msg}</p>
 <div><button class="sb" id="dn" ${m>=M?'disabled':''}>▶ 1種類ずつ配る</button><button class="sb" id="da">${UI.autoplay?'⏸ 自動配りを止める':'▶▶ 自動で配る'}</button><button class="sb" id="dr">もどす</button></div>`;
 if(m>=M)h+=`<p class="t">${a}÷${g}＝<b>${x}</b>　${b}÷${g}＝<b>${y}</b></p><div class="ans">1袋の中身　グミ${x}個、ラムネ${y}個</div>`;
 return h}
function divfind(a,nm,k){
 const mx=Math.floor(Math.sqrt(a)),n=Math.min(G.dv,mx),done=n>=mx;
 let rows='',found=[],pairs=[];
 for(let i=1;i<=n;i++){const q=Math.floor(a/i),r=a%i;
  rows+=`<tr><td>${a}÷${i}</td><td>＝ ${q}${r?`　あまり ${r}`:''}</td><td>${r?'×':'<b>○</b>'}</td><td>${r?'':`<span class="chip hi">${i}</span> と <span class="chip pr">${q}</span>`}</td></tr>`;
  if(!r){pairs.push(`${i}×${q}`);found.push(i);if(q!=i)found.push(q)}}
 found.sort((p,q)=>p-q);
 const q=Math.floor(a/n),r=a%n,pair=!r&&q!=n;
 // ---- figure: pool -> n boxes (and pair: q boxes), items move by CSS transition
 const pp=i=>[26+(i%10)*18,40+Math.floor(i/10)*18],poolB=40+Math.ceil(a/10)*18;
 const c=q>12?8:4,cw=c*16+12,bh=Math.ceil(q/c)*16+24,ay=poolB+14,aTop=ay+12;
 const cw2=Math.min(n,4)*16+12,c2=Math.min(n,4),bh2=Math.ceil(n/c2)*16+24,per=Math.max(1,Math.floor(680/(cw2+8)));
 const bTitle=aTop+bh+22,bTop=bTitle+12,H=pair?bTop+Math.ceil(q/per)*(bh2+8)+8:aTop+bh+14;
 const step=Math.min(90,Math.floor(2600/a)),dB=a*step+1100;
 const shape=(i,st)=>k?`<rect x="-6" y="-4" width="12" height="9" rx="3" fill="${CANDY[i%4]}" ${st}/>`:`<circle r="6" fill="${GUMMY}" ${st}/>`;
 const item=(i,tx,ty,d,b,st)=>{const[px,py]=pp(i);return`<g class="dv" data-tx="${tx}" data-ty="${ty}" data-d="${d}" ${b?'data-b="1"':''} style="transform:translate(${px}px,${py}px);${b?'opacity:0':''}">${shape(i,st)}</g>`};
 let sv=`<text x="20" y="22" font-size="14" font-weight="bold" fill="${k?'#e64980':'#8d5524'}">もとの ${k?'ラムネ':'グミ'} ${a}個</text>`;
 sv+=`<text x="8" y="${ay+2}" font-size="14" font-weight="bold">① ${n}袋に 1つずつ 順に配る</text>`;
 for(let p=0;p<n;p++)sv+=`<rect x="${8+p*(cw+8)}" y="${aTop}" width="${cw}" height="${bh}" rx="6" fill="#fff" stroke="#243447" stroke-width="2"/><text x="${12+p*(cw+8)}" y="${aTop+13}" font-size="11">${p+1}袋め</text>`;
 const lx=8+n*(cw+8);
 if(r)sv+=`<rect x="${lx}" y="${aTop}" width="${Math.min(r,4)*16+12}" height="${Math.ceil(r/4)*16+24}" rx="6" fill="#fff5f8" stroke="#d6336c" stroke-width="2" stroke-dasharray="4 3"/><text x="${lx+4}" y="${aTop+13}" font-size="11" fill="#d6336c">あまり${r}</text>`;
 if(pair){sv+=`<text x="8" y="${bTitle}" font-size="14" font-weight="bold" fill="#2f9e44">② ペア：${q}袋に 配っても ちょうど！（1袋 ${n}個）</text>`;
  for(let p=0;p<q;p++)sv+=`<rect x="${8+(p%per)*(cw2+8)}" y="${bTop+Math.floor(p/per)*(bh2+8)}" width="${cw2}" height="${bh2}" rx="6" fill="#fff" stroke="#2f9e44" stroke-width="2"/>`}
 for(let i=0;i<a;i++){let tx,ty,st='';
  if(i<n*q){const b=i%n,j=Math.floor(i/n);tx=8+b*(cw+8)+14+(j%c)*16;ty=aTop+16+Math.floor(j/c)*16}
  else{const kk=i-n*q;tx=lx+14+(kk%4)*16;ty=aTop+16+Math.floor(kk/4)*16;st='stroke="#d6336c" stroke-width="2"'}
  sv+=item(i,tx,ty,i*step,0,st)}
 if(pair)for(let i=0;i<a;i++){const b=i%q,j=Math.floor(i/q);
  sv+=item(i,8+(b%per)*(cw2+8)+14+(j%c2)*16,bTop+Math.floor(b/per)*(bh2+8)+16+Math.floor(j/c2)*16,dB+i*step,1,'')}
 let msg=r?`${nm}${a}個を ${n}袋に同じ数ずつ配ると、1袋 ${q}個で、あまりが <b>${r}個</b> でます。あまりがあるので、${n}は約数では<b>ありません</b>。`
  :`${nm}${a}個を ${n}袋に配ると、1袋 <b>${q}個</b> でちょうど配れます（あまり0）。<b>${n}は約数</b>です。`+(q!=n?`<br>ということは、${q}袋に配れば 1袋 ${n}個 でも ちょうど（図の②）。<br>だから <b>${n} と ${q} はペア</b>で、両方とも約数です。`:`<br>${n}×${n}＝${a} なので、ペアの数も同じ ${n} です。`);
 let o=`<svg class="sh" viewBox="0 0 700 ${H}" style="max-width:700px">${sv}</svg><p class="t">「${nm}${a}個を、1袋、2袋、3袋…に同じ数ずつ配る」と考えて、<b>わり算</b>でしらべます。あまりが出ない（わりきれる）ときの<b>わる数</b>が約数。そのときの<b>商（答え）もペア</b>で約数になります。</p>
 <p class="t">${msg}</p>
 <table><tr><th>わり算</th><th>答え</th><th>わりきれる？</th><th>記録（わる数と ペアの商）</th></tr>${rows}</table>`;
 o+=done?`<p class="t">${n}までしらべました。つぎの${n+1}は ${n+1}×${n+1}＝${(n+1)**2} で ${a} より大きく、これ以上は ペアで見つけた数ばかりです。ここでおしまい。</p><p class="t">かけ算で ${a} になるペア：<b>${pairs.join('、')}</b><br>${nm}${a}個の約数：${chips(found,found)}（${found.length}こ）</p>`
  :`<p class="t">見つけた約数（これまで）：${chips(found,found)}</p>`;

  else if(s==3)h+=`<p class="t">のこりの2まいを <b>${dw}順</b> に ならべます。<br>左から <b class="tb">百の位</b>、<b class="ty">十の位</b>。</p>`+(zero?`<p class="t">0は <b class="tb">百の位</b> に おけません。<br>（0だと 3けたの数にならないため）</p>`:'');

{n:'グミとラムネを分ける',steps:5,ti:['グミとラムネを見る','グミの約数をさがす','ラムネの約数をさがす','公約数と最大公約数','1袋ぶんずつ配る'],f:[['グミ(個)',20,1,60,'tk'],['ラムネ(個)',30,1,60,'ta']],
 rd:()=>{const g=rnd(2,8);return[g*rnd(2,6),g*rnd(2,6)]},
 q:v=>`遠足のおみやげに、グミを<b>${v[0]}個</b>、ラムネを<b>${v[1]}個</b>用意しました。全員の袋に、グミは同じ個数、ラムネも同じ個数になるよう入れます。使い残しは出しません。<br>作れる袋の数をいちばん多くすると何袋？ そのとき、1袋に入るグミとラムネはそれぞれ何個？`,
 r(v,s){const[a,b]=v,g=gcd(a,b),x=a/g,y=b/g;let h='';

{n:'布のパーツで正方形',steps:3,ti:['布パーツの形を見る','布パーツをふやして、長さをそろえる','答え：最小公倍数'],f:[['たて(cm)',4,1,30,'tg'],['横(cm)',10,1,30,'tb']],
 rd:()=>[rnd(2,12),rnd(2,12)],
 q:v=>`たて<b>${v[0]}cm</b>・横<b>${v[1]}cm</b>の長方形の布パーツで、小さな正方形のマットを作ります。パーツは切らず、回さず、同じ向きで、すきまも重なりもなく敷きつめます。<br>完成する最小の正方形の1辺は何cm？`,
 r(v,s){const[h0,w0]=v,L=lcm(h0,w0),cols=L/w0,rows=L/h0;
  if(s==0){const k=190/Math.max(h0,w0),W=w0*k,H=h0*k;
   return`<svg viewBox="0 0 400 260"><rect x="110" y="50" width="${W}" height="${H}" fill="#ffc9de" stroke="#d6336c" stroke-width="3"/><line x1="110" y1="38" x2="${110+W}" y2="38" stroke="#1c7ed6" stroke-width="4"/><text x="${110+W/2}" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c7ed6">横 ${w0}cm</text><line x1="98" y1="50" x2="98" y2="${50+H}" stroke="#2f9e44" stroke-width="4"/><text x="88" y="${50+H/2}" text-anchor="end" font-size="18" font-weight="bold" fill="#2f9e44">たて ${h0}cm</text></svg>
   <p class="t">布パーツをならべて広げると、<br><b class="tb">横の長さ</b>は <b class="tb">${w0}の倍数</b>、<br><b class="tg">たての長さ</b>は <b class="tg">${h0}の倍数</b> になります。</p>
   <p class="t">正方形になるのは、<br><b class="tb">横</b>と<b class="tg">たて</b>が <b>同じ長さ</b> のとき。</p>`}
  if(s==1)return grow(w0,h0,L,G.cn,G.rn,1)+`<p class="t">布パーツを1まいずつふやして、<br><b class="tb">横</b>と<b class="tg">たて</b>の長さを見くらべよう。</p><p class="t">ふえた長さは、倍数リストに色がつきます。<br>最小公倍数をこえても、3ばいまで ふやせます。</p>`;

{n:'水やりのタイミング',steps:4,ti:['午前9時に同時に水やり','数直線に水やりをならべる','はじめて重なるのは？','時こくになおす'],
 f:[['青の水やり器(分おき)',9,1,30,'tb'],['緑の水やり器(分おき)',12,1,30,'tg']],
 rd:()=>[rnd(2,12),rnd(2,12)],
 q:v=>`温室に2台の自動水やり器があります。青は<b>${v[0]}分ごと</b>、緑は<b>${v[1]}分ごと</b>に水を出します。午前9時に2台を一緒に動かしました。<br>9時より後で、2台の水やりが初めて重なる時刻を求めよう。`,
 r(v,s){const[a,b]=v,L=lcm(a,b),k=620/L,X=n=>40+n*k,TR='<b class="tb">青の水やり器</b>',BS='<b class="tg">緑の水やり器</b>';
  const tick=(n,col,up,st)=>`<line x1="${X(n)}" y1="100" x2="${X(n)}" y2="${up?75:125}" stroke="${col}" stroke-width="3"/><circle cx="${X(n)}" cy="${up?72:128}" r="5" fill="${col}"/>${k*st>=22||n==0||n==L?`<text x="${X(n)}" y="${up?60:148}" text-anchor="middle" font-size="12">${n}</text>`:''}`;
  const veh=(n,up)=>`<g transform="translate(${X(n)} ${up?40:178})"><text class="veh${s>=2&&n==L?' stay':''}" data-n="${n}" text-anchor="middle" font-size="24">${up?'💧':'🌱'}</text></g>`;
  let sv=`<line x1="40" y1="100" x2="${X(L)+20}" y2="100" stroke="#243447" stroke-width="3"/><text x="6" y="80" font-size="13" font-weight="bold" fill="#1c7ed6">青</text><text x="6" y="132" font-size="13" font-weight="bold" fill="#2f9e44">緑</text>`;
  if(s>=1){for(let n=0;n<=L;n+=a)sv+=tick(n,'#1c7ed6',1,a)+veh(n,1);for(let n=0;n<=L;n+=b)sv+=tick(n,'#2f9e44',0,b)+veh(n,0);
   sv+=`<line class="cur" x1="${X(0)}" y1="28" x2="${X(0)}" y2="170" stroke="#868e96" stroke-width="2" stroke-dasharray="3 3"/><text class="clk" x="350" y="16" text-anchor="middle" font-size="16" font-weight="bold">${jikoku(0)}</text>`}
  else sv+=tick(0,'#243447',1,1).replace(/<text.*?<\/text>/,'');
  if(s>=2)sv+=`<line x1="${X(L)}" y1="28" x2="${X(L)}" y2="165" stroke="#d6336c" stroke-width="3" stroke-dasharray="6 4"/><text x="${X(L)}" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6336c">${L}分後 ★</text>`;
  sv+=`<text x="${X(0)}" y="192" text-anchor="middle" font-size="12">午前9時</text>`;
  let h=`<svg class="tl" viewBox="0 0 700 200" data-l="${L}" data-k="${k}">${sv}</svg>`;
  const btn=`<div><button class="sb" id="tp">▶ 水やりアニメを見る</button><button class="sb" id="ts">⏸ 止める</button></div>`;
  if(s==0)h+=`<p class="t">午前9時に ${TR}と${BS}が 同時に水やりします。<br>この時こくを <b>0分</b> とします。</p><p class="t">${TR}は ${a}分ごと、${BS}は ${b}分ごとに水やり。</p>`;
  if(s==1)h+=`<p class="t">${TR}が水やりするのは<br>${a}分、${a*2}分、${a*3}分… ＝ <b class="tb">${a}の倍数</b></p><p class="t">${BS}が水やりするのは<br>${b}分、${b*2}分、${b*3}分… ＝ <b class="tg">${b}の倍数</b></p>`+btn;
  if(s==2)h+=`<p class="t">${TR}（${a}の倍数）：${chips(mul(a,L),[L],L,[],'cb')}</p><p class="t">${BS}（${b}の倍数）：${chips(mul(b,L),[L],L,[],'cg')}</p><p class="t">最初に同じになる数（<b>最小公倍数</b>）は <b>${L}</b>。<br>→ 午前9時の <b>${L}分後</b>。</p>`+btn;
  if(s==3)h+=`<p class="t">午前9時 ＋ ${L}分 ＝ ${jikoku(L)}</p><div class="ans">答え　${jikoku(L)}</div>`+btn;
  return h}}

];

function draw(){const a=document.activeElement,id=a?.id;const ds=a?.dataset;const key=ds?.i!==undefined?'[data-i="'+ds.i+'"]':null;stopDrag();$('#inputNotice').hidden=true;drawBase();finishDraw();
 if(a&&a!==document.body&&!a.isConnected){const next=id?document.getElementById(id):key?document.querySelector(key):null;if(next&&!next.disabled)next.focus({preventScroll:true});}}
document.addEventListener('change',e=>{if(e.target.id!=='stepJump')return;const n=+e.target.value;if(!Number.isInteger(n)||n<0||n>=stepTitles().length)return;rs();step=n;draw();});
function setFullscreen(){const op=document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();if(op&&op.catch)op.catch(()=>announce('全画面にできませんでした。このまま使えます。'));else if(!op)announce('このブラウザでは全画面に対応していません。');}
function readInteger(t,min,max,previous){const raw=t.value.trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
 if(!/^\d+$/.test(raw)||!Number.isSafeInteger(Number(raw))||+raw<min||+raw>max){t.value=previous;const msg=`${min}から${max}までの整数を入れてね。前の数に戻しました。`;$('#inputNotice').hidden=false;$('#inputNotice').textContent=msg;announce(msg);return null;}$('#inputNotice').hidden=true;t.value=String(+raw);return +raw;}

draw();
