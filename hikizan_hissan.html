// ============================================================
// 音声読み上げ（すべての数字・演算記号を日本語の読みに変換してから話す）
// ============================================================
let voiceOn=true,ttsWarmedUp=false,currentUtter=null;

// 0〜9999の整数を日本語の読み（ひらがな）に変換する
function numToYomi(n){
  n=Math.round(n);
  if(n===0)return'ぜろ';
  if(n<0)return'まいなす '+numToYomi(-n);
  const ichiMap=['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
  const juuMap  =['','じゅう','にじゅう','さんじゅう','よんじゅう','ごじゅう','ろくじゅう','ななじゅう','はちじゅう','きゅうじゅう'];
  const hyakuMap=['','ひゃく','にひゃく','さんびゃく','よんひゃく','ごひゃく','ろっぴゃく','ななひゃく','はっぴゃく','きゅうひゃく'];
  const senMap  =['','せん','にせん','さんぜん','よんせん','ごせん','ろくせん','ななせん','はっせん','きゅうせん'];
  const sen=Math.floor(n/1000)%10, hyaku=Math.floor(n/100)%10, juu=Math.floor(n/10)%10, ichi=n%10;
  let s='';
  s+=senMap[sen];
  s+=hyakuMap[hyaku];
  s+=juuMap[juu];
  s+=ichiMap[ichi];
  return s;
}

// 助数詞つきの数（0〜10）を、正しい読み（音の変化込み）に変換する
const HON_MAP=['ぜろほん','いっぽん','にほん','さんぼん','よんほん','ごほん','ろっぽん','ななほん','はっぽん','きゅうほん','じゅっぽん'];
const KO_MAP =['ぜろこ','いっこ','にこ','さんこ','よんこ','ごこ','ろっこ','ななこ','はっこ','きゅうこ','じゅっこ'];
const MAI_MAP=['ぜろまい','いちまい','にまい','さんまい','よんまい','ごまい','ろくまい','ななまい','はちまい','きゅうまい','じゅうまい'];

// HTML（タグ・数字・演算記号入り）を読み上げ用の日本語テキストに変換する
function toSpeechText(html){
  let s=String(html);
  s=s.replace(/<br\s*\/?>/gi,'。');     // 改行は「、」のように一拍おく
  s=s.replace(/<[^>]+>/g,'');           // 残りのタグは除去
  // 読み間違えやすい言葉は先に決まった読みへ置き換える（数字変換より前に処理する）
  s=s.replace(/1つ/g,'ひとつ');
  // 助数詞（本／こ／まい）がつく数字は、音の変化（いっぽん・じゅっこ等）を考慮して先に変換する
  s=s.replace(/(\d+)本/g,(m,d)=>HON_MAP[parseInt(d,10)]??(numToYomi(parseInt(d,10))+'ほん'));
  s=s.replace(/(\d+)こ/g,(m,d)=>KO_MAP[parseInt(d,10)]??(numToYomi(parseInt(d,10))+'こ'));
  s=s.replace(/(\d+)まい/g,(m,d)=>MAI_MAP[parseInt(d,10)]??(numToYomi(parseInt(d,10))+'まい'));
  s=s.replace(/くり上/g,'くりあ');
  s=s.replace(/くり下/g,'くりさ');       // 「くり下げ」を「くりさげ」と正しく読ませる
  s=s.replace(/入らない/g,'はいらない');
  s=s.replace(/＋|\+/g,' たす ');
  s=s.replace(/－|-/g,' ひく ');
  s=s.replace(/×/g,' かける ');
  s=s.replace(/÷/g,' わる ');
  s=s.replace(/＝|=/g,' は ');
  s=s.replace(/▶|◀/g,'');
  s=s.replace(/\d+/g,m=>numToYomi(parseInt(m,10))); // 残りの数字をすべて日本語の読みに変換
  s=s.replace(/\s+/g,' ').trim();
  return s;
}

// 無音のウォームアップ発話（一部のブラウザは最初の発話が無視されることがあるため、
// 起動直後（や音声ON直後）に1音だけ無音で読み上げてエンジンを起こしておく）
function warmupTTS(){
  if(ttsWarmedUp)return;
  if(!('speechSynthesis'in window))return;
  try{
    const u=new SpeechSynthesisUtterance('ん');
    u.lang='ja-JP';u.volume=0;
    window.speechSynthesis.speak(u);
    ttsWarmedUp=true;
  }catch(e){/* 読み上げ非対応環境では無視 */}
}

function speakText(text){
  if(!voiceOn)return;
  if(!('speechSynthesis'in window))return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=.95;u.pitch=1.05;
    currentUtter=u;
    window.speechSynthesis.speak(u);
  }catch(e){/* 読み上げ非対応環境では無視 */}
}

function speakStep(descHtml){
  speakText(toSpeechText(descHtml));
}

function toggleVoice(){
  voiceOn=!voiceOn;
  const btn=document.getElementById('btn-voice');
  btn.classList.toggle('off',!voiceOn);
  if(voiceOn){
    warmupTTS();
  } else if('speechSynthesis'in window){
    window.speechSynthesis.cancel();
  }
}

// ============================================================
// ステップ定義
// ============================================================
function buildSteps(){
  const aH=Math.floor(numA/100),aJ=Math.floor((numA%100)/10),aI=numA%10;
  const bH=Math.floor(numB/100),bJ=Math.floor((numB%100)/10),bI=numB%10;
  const ans=numA-numB;

  // 桁の判定：ひき算では答えがひかれる数より大きくならないので、
  // 表示する桁数はひかれる数(A)の桁数で決まる。
  const has3=(aH>0);

  // ============================================================
  // 繰り下がり計算（カスケード対応）
  // 十の位が0などで「一の位への借用」のために、さらに百の位から
  // 十の位へ先に借りておく必要があるケース（例：305-148）に対応する。
  // ============================================================
  const needBorrowI = (aI < bI); // 一の位で繰り下がりが必要か

  // 一の位が十の位から1借りようとした時、十の位がもともと0なら、
  // 先に百の位から十の位へ1借りておく必要がある（カスケード）。
  const needCascadeForI = needBorrowI && has3 && (aJ===0);
  // カスケードした場合の「十の位の値（百から借りた直後、まだ一の位に貸す前）」
  // 例：305-148 → 十の位はもともと0。百から1借りて 0+10=10 になる。
  const jBeforeLendToI = needCascadeForI ? (aJ+10) : aJ;

  // 一の位へ1渡した後の十の位の値
  const jAfterBorrowI = jBeforeLendToI - (needBorrowI?1:0);
  const iAns = needBorrowI ? (aI+10-bI) : (aI-bI);

  // ---- 十の位 ----
  const needBorrowJ = has3 && (jAfterBorrowI < bJ);   // 十の位で繰り下がりが必要か(3桁のとき)
  const jAns = needBorrowJ ? (jAfterBorrowI+10-bJ) : (jAfterBorrowI-bJ);

  // ---- 百の位 ----
  // 百の位は、カスケードで十の位に貸した分(needCascadeForI)と、
  // 十の位の引き算で貸した分(needBorrowJ)の両方を考慮する。
  // ただしカスケードと十の位借用は同時には起こらない
  // （カスケードする時点でjBeforeLendToI=9になり、9から更に借りる(needBorrowJ)ことは無い設計のため）。
  const hAfterBorrowJ = has3 ? (aH - ((needCascadeForI||needBorrowJ)?1:0)) : 0;
  const hAns = has3 ? (hAfterBorrowJ - bH) : 0;

  const hBase={
    aH,aJ,aI,bH,bJ,bI,iAns,jAns,hAns,has3,
    showAH:false,showAJ:false,showAI:false,
    showBH:false,showBJ:false,showBI:false,
    showMinus:false,showLine:false,
    borrowFromH:false,borrowFromJ:false,
    hAfterBorrow:hAfterBorrowJ,jAfterBorrow:jAfterBorrowI,
    jBeforeLend:jBeforeLendToI,
    jDisplayOverride:null, // カスケードで十の位がまだ「中間値(9等)」のときに表示する値
    borrowHPop:false,borrowJPop:false,
    showBridge10:false,bridge10Pop:false,
    // 百の位から十の位へ「くり下げた後の十の位」がさらに繰り下がる場合に、
    // 十の位の斜線つき小さい赤字数字のさらに上へ表示する「10」の赤字表示。
    showBridge100:false,bridge100Pop:false,
    // ブリッジ計算（真のブリッジ）：一の位の「10」と「7」を結ぶコの字線、
    // ひかれる数の横に書く補助計算の答え、「＋」記号。
    showBridgeLineI:false,bridgeLineIPop:false,
    showBridgeAnsI:false,bridgeAnsIPop:false,bridgeAnsIVal:0,
    showBridgePlusI:false,bridgePlusIPop:false,
    // 同様に、十の位（百の位からのくり下がり）用。
    showBridgeLineJ:false,bridgeLineJPop:false,
    showBridgeAnsJ:false,bridgeAnsJPop:false,bridgeAnsJVal:0,
    showBridgePlusJ:false,bridgePlusJPop:false,
    showAnsI:false,showAnsJ:false,showAnsH:false,
    hlIchi:false,hlJuu:false,hlHyaku:false,ansBox:false
  };

  const tBase={
    hyakuA:{count:0,alpha:1,hl:null,ghost:0}, juuA:{count:0,alpha:1,hl:null,ghost:0}, ichiA:{count:0,alpha:1,hl:null,ghost:0},
    hyakuB:{count:0,alpha:1,hl:null,ghost:0}, juuB:{count:0,alpha:1,hl:null,ghost:0}, ichiB:{count:0,alpha:1,hl:null,ghost:0},
    hyakuAns:{count:0,alpha:1,hl:null,ghost:0}, juuAns:{count:0,alpha:1,hl:null,ghost:0}, ichiAns:{count:0,alpha:1,hl:null,ghost:0},
    showAnsRow:false,
    // 対消滅エフェクト用：今まさに消えるペアの個数（A側・B側それぞれ何個が消滅対象か）
    annihilateIchi:0, annihilateJuu:0, annihilateHyaku:0,
    // 一の位へ繰り下げた「10の塊」の半透明痕跡。show=trueの間、bridge10-layerに
    // count個は通常表示、残り(10-count)個は半透明ghostとして常に描画され続ける。
    // アニメーション終了後もステップを跨いで(cloneStateで)引き継がれるため、
    // 計算の最後まで痕跡が消えない。
    bridgeTen:{show:false,count:0},
    // 百の位から十の位へ追加でくり下げた「10本の10」の半透明な痕跡。
    // bridgeTenと同じ考え方で、bridge100-layer（永続レイヤー）に描画される。
    // count個は通常表示、残り(10-count)個は半透明ghostとして描画され続ける。
    bridgeHyaku:{show:false,count:0},
    // 百の位から十の位へカスケードでくり下げて「10本の10」になった時、
    // その表示位置をひかれる数の通常位置ではなく、じゅうのくらいの
    // タイトルテキストの高さまでY軸方向で上げるためのフラグ。
    // 一度trueになったら、その問題の残りのステップでは常にtrueのまま
    // （cloneStateで引き継がれる）で、ひっ算の補助数字の表示位置と対応させる。
    juuRaised:false
  };

  const list=[];
  function prev(){return list.length?cloneState(list[list.length-1]):{h:cloneState(hBase),t:cloneState(tBase),title:'',desc:'',anim:null};}

  // Step0: 空スタート
  {
    const p=prev();
    p.title='はじめましょう！';
    p.desc=`<span class="ac">${numA} － ${numB}</span> を ひっ算で けいさんします。<br>じゅんばんに すうじを かいていきましょう。`;
    list.push(p);
  }

  // 百の位A（3桁のとき）
  if(has3){
    const p=prev();
    p.title=`<span class="hc">${aH}</span> を書く（ひゃくのくらい）`;
    p.desc=`<span class="hc">ひゃくのくらい</span>の <span class="hc">${aH}</span> を書きます。<br>大きな正方形タイルが <span class="hc">${aH}まい</span> あります。`;
    p.h.showAH=true;
    p.t.hyakuA={count:aH,alpha:1,hl:'#2980b9'};
    p.anim='appear-hyaku-a';
    list.push(p);
  }

  // 十の位A
  {
    const p=prev();
    p.title=`<span class="jc">${aJ}</span> を書く（じゅうのくらい）`;
    p.desc=`<span class="jc">じゅうのくらい</span>の <span class="jc">${aJ}</span> を書きます。`;
    p.h.showAJ=true;
    p.t.hyakuA={count:aH,alpha:1,hl:null};
    p.t.juuA={count:aJ,alpha:1,hl:'#f39c12'};
    p.anim='appear-juu-a';
    list.push(p);
  }

  // 一の位A
  {
    const p=prev();
    p.title=`<span class="ic">${aI}</span> を書く（いちのくらい）`;
    p.desc=`<span class="ic">いちのくらい</span>の <span class="ic">${aI}</span> を書きます。`;
    p.h.showAI=true;
    p.t.juuA={count:aJ,alpha:1,hl:null};
    p.t.ichiA={count:aI,alpha:1,hl:'#e91e63'};
    p.anim='appear-ichi-a';
    list.push(p);
  }

  // － 記号
  {
    const p=prev();
    p.title='－ を書く';
    p.desc='ひき算の きごうを 書きます。';
    p.h.showMinus=true;
    p.t.ichiA={count:aI,alpha:1,hl:null};
    p.anim=null;
    list.push(p);
  }

  // 百の位B（ひく数も3桁のときだけ。ひく数が2桁以下なら百の位は空白のままにする＝
  // 147－18のような問題で「147－018」のように0を書いてしまうのを防ぐ）
  if(has3 && bH>0){
    const p=prev();
    p.title=`<span class="hc">${bH}</span> を書く（ひゃくのくらい）`;
    p.desc=`ひく数の <span class="hc">ひゃくのくらい</span> の <span class="hc">${bH}</span> を書きます。`;
    p.h.showBH=true;
    p.t.hyakuB={count:bH,alpha:1,hl:'#2980b9'};
    p.anim='appear-hyaku-b';
    list.push(p);
  }

  // 十の位B
  {
    const p=prev();
    p.title=`<span class="jc">${bJ}</span> を書く（じゅうのくらい）`;
    p.desc=`ひく数の <span class="jc">じゅうのくらい</span> の <span class="jc">${bJ}</span> を書きます。`;
    p.h.showBJ=true;
    p.t.hyakuB={count:bH,alpha:1,hl:null};
    p.t.juuB={count:bJ,alpha:1,hl:'#f39c12'};
    p.anim='appear-juu-b';
    list.push(p);
  }

  // 一の位B
  {
    const p=prev();
    p.title=`<span class="ic">${bI}</span> を書く（いちのくらい）`;
    p.desc=`ひく数の <span class="ic">いちのくらい</span> の <span class="ic">${bI}</span> を書きます。`;
    p.h.showBI=true;
    p.t.juuB={count:bJ,alpha:1,hl:null};
    p.t.ichiB={count:bI,alpha:1,hl:'#e91e63'};
    p.anim='appear-ichi-b';
    list.push(p);
  }

  // 横線
  {
    const p=prev();
    p.title='横線を引く';
    p.desc='<span class="rc">定規でまっすぐ 線を引きます。</span><br>この線の下に こたえを書きます。';
    p.h.showLine=true;
    p.t.ichiB={count:bI,alpha:1,hl:null};
    p.anim=null;
    list.push(p);
  }

  // ============================================================
  // 一の位の計算
  // ============================================================
  if(!needBorrowI){
    // 繰り下がり不要：そのまま対消滅
    const p=prev();
    p.title=`いちのくらいの けいさん：${aI}－${bI}＝${iAns}`;
    p.desc=`<span class="ic">いちのくらい</span>を けいさんします。<br>`
      +`<span class="ic">${aI} － ${bI} ＝ ${iAns}</span>`;
    p.h.hlIchi=true;p.h.showAnsI=true;
    p.t.ichiA={count:0,alpha:1,hl:null,ghost:aI};
    p.t.ichiB={count:0,alpha:1,hl:null,ghost:bI};
    p.t.ichiAns={count:iAns,alpha:1,hl:null,ghost:0};
    p.t.showAnsRow=true;
    p.t.annihilateIchi=bI;
    p.anim='annihilate-ichi';
    list.push(p);
  } else {
    // 繰り下がりが必要
    // ステップ1: 7から8はひけないと気づく
    {
      const p=prev();
      p.title=`${aI}から${bI}は ひけない…`;
      p.desc=`<span class="ic">いちのくらい</span>を 見てみましょう。<br>`
        +`<span class="ic">${aI}</span> から <span class="ic">${bI}</span> は ひけません。<br>`
        +`<span class="jc">じゅうのくらい</span>から <span class="cc">1</span> くり下げます。`;
      p.h.hlIchi=true;
      p.anim=null;
      list.push(p);
    }
    // カスケード：十の位がもともと0で貸せないので、先に百の位から十の位へ1借りる
    if(needCascadeForI){
      {
        const p=prev();
        p.title=`じゅうのくらいは ${aJ}… ひゃくのくらいから くり下げる`;
        p.desc=`<span class="jc">じゅうのくらい</span>は <span class="jc">${aJ}</span>なので、<br>`
          +`いちのくらいに かす ことが できません。<br>`
          +`さきに <span class="hc">ひゃくのくらい</span>から <span class="jc">じゅうのくらい</span>へ <span class="cc">1</span> くり下げます。`;
        p.h.borrowFromH=true;p.h.borrowHPop=true;p.h.hlHyaku=true;
        p.t.hyakuA={count:aH-1,alpha:1,hl:null,ghost:1};
        p.t.juuA={count:jBeforeLendToI,alpha:1,hl:'#e74c3c',ghost:0};
        p.t.juuRaised=true; // 10本の10になった瞬間から、表示をじゅうのくらいのタイトル位置まで上げる
        p.anim='borrow-h-to-j-cascade';
        list.push(p);
      }
      {
        const p=prev();
        p.title=`じゅうのくらいは ${jBeforeLendToI} に なった`;
        p.desc=`ひゃくのくらいから くり下げた <span class="cc">1まい</span>（10本ぶん）と、<br>`
          +`もとの <span class="jc">${aJ}本</span> を あわせて、<br>`
          +`じゅうのくらいは <span class="jc">${jBeforeLendToI}本</span> に なりました。`;
        p.h.borrowHPop=false;
        p.h.jDisplayOverride=jBeforeLendToI;
        p.t.juuA={count:jBeforeLendToI,alpha:1,hl:null,ghost:0};
        p.anim=null;
        list.push(p);
      }
    }
    // ステップ2: 十の位から1借りる（くり下げ線・上の小さい数字）
    {
      const p=prev();
      p.title=`じゅうのくらいから 1 くり下げる`;
      p.desc=`<span class="jc">じゅうのくらい</span>の <span class="jc">${jBeforeLendToI}</span>本 のうち、<br>`
        +`<span class="cc">1本</span> を いちのくらいに くり下げます。<br>`
        +`じゅうのくらいは のこり <span class="jc">${jAfterBorrowI}</span> になります。`;
      p.h.borrowFromJ=true;p.h.borrowJPop=true;p.h.hlJuu=true;
      p.t.juuA={count:jAfterBorrowI,alpha:1,hl:null,ghost:1};
      p.anim='borrow-j-to-i';
      list.push(p);
    }
    // ステップ3: 借りた棒が10個に分解される（ブリッジの「10」表示）
    {
      const p=prev();
      p.title='くり下げた 1本が 10こに なる';
      p.desc=`くり下げた <span class="cc">1本</span>（10の たば）を、<br>`
        +`バラバラに して <span class="cc">10こ</span> にします。`;
      p.h.borrowJPop=false;
      p.h.showBridge10=true;p.h.bridge10Pop=true;
      p.t.bridgeTen={show:true,count:10};
      p.anim='unbundle-10';
      list.push(p);
    }
    const tenMinusB=10-bI;
    if(calcMethod==='bridge'){
      // ブリッジ計算：筆算に「コの字線」「＋の答え」「＋記号」を順番に書き込む
      // (1) 10と7を線でむすぶ
      {
        const p=prev();
        p.title=`ブリッジ：10と${bI}を線でむすぶ`;
        p.desc=`<span class="rc">ブリッジ計算</span>を します。<br>`
          +`くり下げた <span class="cc">10</span> と、ひく数の <span class="ic">${bI}</span> を 線で むすびます。<br>`
          +`10－${bI}は…`;
        p.h.bridge10Pop=false;
        p.h.hlIchi=true;
        p.h.showBridgeLineI=true;p.h.bridgeLineIPop=true;
        p.anim=null;
        list.push(p);
      }
      // (2) 10-7の答えを、ひかれる数の横に書く
      {
        const p=prev();
        p.h.bridgeLineIPop=false;
        p.title=`10－${bI}＝${tenMinusB}`;
        p.desc=`<span class="cc">10 － ${bI} ＝ ${tenMinusB}</span><br>`
          +`${aI}の よこに <span class="rc">${tenMinusB}</span> と 書きます。`;
        p.h.showBridgeAnsI=true;p.h.bridgeAnsIPop=true;p.h.bridgeAnsIVal=tenMinusB;
        p.t.ichiB={count:0,alpha:1,hl:null,ghost:bI};
        p.t.annihilateIchi=bI; // 10この方(borrowed)とbI個が対消滅
        p.t.bridgeTen={show:true,count:tenMinusB}; // bI個が使用済み(ghost)、残りtenMinusB個はまだ通常表示
        p.anim='annihilate-bridge10';
        list.push(p);
      }
      // (3) ＋の記号を書く
      {
        const p=prev();
        p.h.bridgeAnsIPop=false;
        p.title=`${aI}と${tenMinusB}を たしざんに`;
        p.desc=`${aI}と <span class="rc">${tenMinusB}</span> の あいだに <span class="rc">＋</span> を 書きます。<br>`
          +`${aI}＋${tenMinusB}は…`;
        p.h.showBridgePlusI=true;p.h.bridgePlusIPop=true;
        p.anim=null;
        list.push(p);
      }
      // (4) 答えが決まる
      {
        const p=prev();
        p.h.bridgePlusIPop=false;
        p.title=`${aI}＋${tenMinusB}＝${iAns}`;
        p.desc=`<span class="ic">${aI} ＋ ${tenMinusB} ＝ ${iAns}</span><br>`
          +`いちのくらいの こたえは <span class="ic">${iAns}</span> です。`;
        p.h.showAnsI=true;
        p.t.ichiAns={count:iAns,alpha:1,hl:null};
        p.t.ichiA={count:0,alpha:1,hl:null,ghost:aI};
        p.t.showAnsRow=true;
        p.t.bridgeTen={show:true,count:0}; // 残りも答えへ移動済み→10個すべてghost
        p.anim='bridge-add-remainder';
        list.push(p);
      }
    } else {
      // 通常：教科書的な言い回しで1ステップ（じゅうのくらいと同じ形式・計算の順序はブリッジと同じ）
      const p=prev();
      const sum=10+aI;
      p.title=`いちのくらいの けいさん：${sum}－${bI}＝${iAns}`;
      p.desc=`くり下げた 1こ（10こぶん）と、もとの <span class="ic">${aI}こ</span> を あわせて<br>`
        +`<span class="ic">${sum}こ</span>。そこから <span class="ic">${bI}</span> を ひきます。<br>`
        +`<span class="ic">${sum} － ${bI} ＝ ${iAns}</span>`;
      p.h.bridge10Pop=false;
      p.h.hlIchi=true;p.h.showAnsI=true;
      p.t.ichiA={count:0,alpha:1,hl:null,ghost:aI};
      p.t.ichiB={count:0,alpha:1,hl:null,ghost:bI};
      p.t.ichiAns={count:iAns,alpha:1,hl:null,ghost:0};
      p.t.showAnsRow=true;
      p.t.annihilateIchi=bI;
      p.t.bridgeTen={show:true,count:0};
      p.anim='annihilate-bridge10-borrowed';
      list.push(p);
    }
  }

  // ============================================================
  // 十の位の計算
  // ============================================================
  if(!needBorrowJ){
    const p=prev();
    p.title=`じゅうのくらいの けいさん：${jAfterBorrowI}－${bJ}＝${jAns}`;
    p.desc=`<span class="jc">じゅうのくらい</span>を けいさんします。<br>`
      +(needBorrowI?`くり下げた あとの <span class="jc">${jAfterBorrowI}</span> から<br>`:'')
      +`<span class="jc">${jAfterBorrowI} － ${bJ} ＝ ${jAns}</span>`;
    p.h.hlIchi=false;p.h.hlJuu=true;p.h.showAnsJ=true;
    p.h.borrowJPop=false;
    // 十の位のA行は、もとの本数(aJ、カスケード時はjBeforeLendToI)から最終的にjAnsまで減る。
    // 累積のghost数 = もとの本数 - jAns。
    p.t.juuA={count:0,alpha:1,hl:null,ghost:jBeforeLendToI};
    p.t.juuB={count:0,alpha:1,hl:null,ghost:bJ};
    p.t.juuAns={count:jAns,alpha:1,hl:null,ghost:0};
    p.t.annihilateJuu = bJ; // 十の位の対消滅数
    p.anim='annihilate-juu';
    list.push(p);
  } else {
    // 十の位でも繰り下がりが必要（3桁のとき）
    {
      const p=prev();
      p.title=`${jAfterBorrowI}から${bJ}は ひけない…`;
      p.desc=`<span class="jc">じゅうのくらい</span>を 見てみましょう。<br>`
        +`<span class="jc">${jAfterBorrowI}</span> から <span class="jc">${bJ}</span> は ひけません。<br>`
        +`<span class="hc">ひゃくのくらい</span>から <span class="cc">1</span> くり下げます。`;
      p.h.hlIchi=false;p.h.hlJuu=true;
      p.anim=null;
      list.push(p);
    }
    {
      const p=prev();
      p.title=`ひゃくのくらいから 1 くり下げる`;
      p.desc=`<span class="hc">ひゃくのくらい</span>の <span class="hc">${aH}まい</span> のうち、<br>`
        +`<span class="cc">1まい</span> を じゅうのくらいに くり下げます。<br>`
        +`ひゃくのくらいは のこり <span class="hc">${hAfterBorrowJ}</span> になります。`;
      p.h.borrowFromH=true;p.h.borrowHPop=true;p.h.hlHyaku=true;
      p.t.hyakuA={count:hAfterBorrowJ,alpha:1,hl:null,ghost:1};
      p.anim='borrow-h-to-j-move';
      list.push(p);
    }
    // ステップ：くり下げた1まい(100)が10本の棒にバラバラになる（一の位のunbundle-10と対応する処理）
    {
      const p=prev();
      p.title='くり下げた 1まいが 10本に なる';
      p.desc=`くり下げた <span class="cc">1まい</span>（100のたば）を、<br>`
        +`バラバラに して <span class="cc">10本</span> にします。`;
      p.h.borrowHPop=false;
      p.h.showBridge100=true;p.h.bridge100Pop=true;
      p.t.bridgeHyaku={show:true,count:10};
      p.anim='unbundle-100-to-j';
      list.push(p);
    }
    if(calcMethod==='bridge'){
      const tenMinusBJ=10-bJ;
      // (1) 10とbJを線でむすぶ
      {
        const p=prev();
        p.title=`ブリッジ：10と${bJ}を線でむすぶ`;
        p.desc=`<span class="rc">ブリッジ計算</span>を します。<br>`
          +`くり下げた <span class="cc">10</span> と、ひく数の <span class="jc">${bJ}</span> を 線で むすびます。<br>`
          +`10－${bJ}は…`;
        p.h.borrowHPop=false;p.h.bridge100Pop=false;
        p.h.hlHyaku=false;p.h.hlJuu=true;
        p.h.showBridgeLineJ=true;p.h.bridgeLineJPop=true;
        p.anim=null;
        list.push(p);
      }
      // (2) 10-bJの答えを、じゅうのくらいの横に書く
      {
        const p=prev();
        p.h.bridgeLineJPop=false;
        p.title=`10－${bJ}＝${tenMinusBJ}`;
        p.desc=`<span class="cc">10 － ${bJ} ＝ ${tenMinusBJ}</span><br>`
          +`${jAfterBorrowI}の よこに <span class="rc">${tenMinusBJ}</span> と 書きます。`;
        p.h.showBridgeAnsJ=true;p.h.bridgeAnsJPop=true;p.h.bridgeAnsJVal=tenMinusBJ;
        p.t.juuB={count:0,alpha:1,hl:null,ghost:bJ};
        p.t.annihilateJuu=bJ; // 借りた10この方(borrowed)とbJ個が対消滅
        p.t.bridgeHyaku={show:true,count:tenMinusBJ}; // bJ個が使用済み(ghost)、残りtenMinusBJ個はまだ通常表示
        p.anim='annihilate-bridge100';
        list.push(p);
      }
      // (3) ＋の記号を書く
      {
        const p=prev();
        p.h.bridgeAnsJPop=false;
        p.title=`${jAfterBorrowI}と${tenMinusBJ}を たしざんに`;
        p.desc=`${jAfterBorrowI}と <span class="rc">${tenMinusBJ}</span> の あいだに <span class="rc">＋</span> を 書きます。<br>`
          +`${jAfterBorrowI}＋${tenMinusBJ}は…`;
        p.h.showBridgePlusJ=true;p.h.bridgePlusJPop=true;
        p.anim=null;
        list.push(p);
      }
      // (4) 答えが決まる
      {
        const p=prev();
        p.h.bridgePlusJPop=false;
        p.title=`${jAfterBorrowI}＋${tenMinusBJ}＝${jAns}`;
        p.desc=`<span class="jc">${jAfterBorrowI} ＋ ${tenMinusBJ} ＝ ${jAns}</span><br>`
          +`じゅうのくらいの こたえは <span class="jc">${jAns}</span> です。`;
        p.h.showAnsJ=true;
        p.t.juuA={count:0,alpha:1,hl:null,ghost:jBeforeLendToI};
        p.t.juuB={count:0,alpha:1,hl:null,ghost:bJ};
        p.t.juuAns={count:jAns,alpha:1,hl:null,ghost:0};
        p.t.annihilateJuu=bJ;
        p.t.bridgeHyaku={show:true,count:0}; // 残りも答えへ移動済み→10個すべてghost
        p.anim='bridge-add-remainder-juu';
        list.push(p);
      }
    } else {
      // 通常：教科書的な言い回しで1ステップ（計算の順序はブリッジと同じ）
      const p=prev();
      const sum=10+jAfterBorrowI;
      p.title=`じゅうのくらいの けいさん：${sum}－${bJ}＝${jAns}`;
      p.desc=`くり下げた 1まい（10本ぶん）と、もとの <span class="jc">${jAfterBorrowI}本</span> を あわせて<br>`
        +`<span class="jc">${sum}本</span>。そこから <span class="jc">${bJ}</span> を ひきます。<br>`
        +`<span class="jc">${sum} － ${bJ} ＝ ${jAns}</span>`;
      p.h.borrowHPop=false;
      p.h.bridge100Pop=false;
      p.h.hlHyaku=false;p.h.hlJuu=true;p.h.showAnsJ=true;
      // 修正: ここでは百の位から借りた「10本の10」は含めない。
      // その10本はbridge100-layer（ヘッダー上の永続レイヤー）に既に半透明表示されて
      // いるため、juuAのghostにも含めてしまうと十の位A列に二重表示されてしまう。
      // juuA列自体が保持するghostは、もともとA列にあった本数(jBeforeLendToI)のみ。
      p.t.juuA={count:0,alpha:1,hl:null,ghost:jBeforeLendToI};
      p.t.juuB={count:0,alpha:1,hl:null,ghost:bJ};
      p.t.juuAns={count:jAns,alpha:1,hl:null,ghost:0};
      p.t.annihilateJuu=bJ;
      p.t.bridgeHyaku={show:true,count:0};
      p.anim='annihilate-juu-borrowed';
      list.push(p);
    }
  }

  // ============================================================
  // 百の位の計算（3桁のとき）
  // ============================================================
  if(has3){
    const p=prev();
    if(bH>0){
      p.title=`ひゃくのくらいの けいさん：${hAfterBorrowJ}－${bH}＝${hAns}`;
      p.desc=`<span class="hc">ひゃくのくらい</span>を けいさんします。<br>`
        +(needBorrowJ?`くり下げた あとの <span class="hc">${hAfterBorrowJ}</span> から<br>`:'')
        +`<span class="hc">${hAfterBorrowJ} － ${bH} ＝ ${hAns}</span>`;
    } else {
      // ひく数に百の位が無い場合：0を引く計算は書かず、そのまま書き下ろす言い回しにする
      p.title=`ひゃくのくらいの こたえ：${hAns}`;
      p.desc=`<span class="hc">ひゃくのくらい</span>には ひく数がありません。<br>`
        +(needBorrowJ?`くり下げた あとの <span class="hc">${hAfterBorrowJ}</span> を そのまま `:`${hAfterBorrowJ} を そのまま `)
        +`こたえに 書きます。<br><span class="hc">こたえ：${hAns}</span>`;
    }
    p.h.hlJuu=false;p.h.hlHyaku=true;p.h.showAnsH=true;
    const hExistingGhost=(needCascadeForI||needBorrowJ)?1:0;
    p.t.hyakuA={count:0,alpha:1,hl:null,ghost:hAfterBorrowJ+hExistingGhost};
    p.t.hyakuB={count:0,alpha:1,hl:null,ghost:bH};
    p.t.hyakuAns={count:hAns,alpha:1,hl:null,ghost:0};
    p.t.annihilateHyaku=bH;
    p.anim='annihilate-hyaku';
    list.push(p);
  }

  // 最終
  {
    const p=prev();
    p.title=`こたえは ${ans} です！`;
    const parts=[];
    if(has3) parts.push(`<span class="hc">ひゃくのくらい ${hAns}</span>`);
    parts.push(`<span class="jc">じゅうのくらい ${jAns}</span>`);
    parts.push(`<span class="ic">いちのくらい ${iAns}</span>`);
    p.desc=parts.join('、')+`<br><span class="ac">${numA} － ${numB} ＝ ${ans}</span>`;
    p.h.hlJuu=false;p.h.hlHyaku=false;p.h.ansBox=true;
    p.t.annihilateIchi=0;p.t.annihilateJuu=0;p.t.annihilateHyaku=0;
    p.anim=null;
    list.push(p);
  }

  return list;
}

// ============================================================
// タイル描画
// ============================================================
// 十の位のA行(svg-juu-a)を、カスケードでくり下げた「10本の10」の表示のあいだだけ、
// じゅうのくらいのタイトルテキストの高さまでY軸方向で上に上げる。
// 一の位の実装（bridge10-layerで一の位の上に表示する仕組み）と同じ考え方だが、
// こちらはsvg-juu-a自体をCSS transformで押し上げるだけなので、
// 他のアニメーション（borrow-j-to-iやannihilate-juu等）がsvg-juu-aの
// getBoundingClientRect()を使って座標計算をしても、常に正しい（上がった）
// 位置を自動的に参照できる。
function updateJuuRaisedTransform(ts){
  const svgJA=document.getElementById('svg-juu-a');
  svgJA.style.transform=''; // まず解除して「元の位置」を測れるようにする
  if(!ts.juuRaised)return;
  const hdrRect=document.getElementById('hdr-juu').getBoundingClientRect();
  const curRect=svgJA.getBoundingClientRect();
  const dy=(hdrRect.top+hdrRect.height/2)-(curRect.top+curRect.height/2);
  svgJA.style.transform=`translateY(${dy}px)`;
}

function paintTiles(ts){
  const rHyaku=DISPLAY_MODE==='card'?renderHyakusCard:renderHyakus;
  const rJuu  =DISPLAY_MODE==='card'?renderSticksCard:renderSticks;
  const rIchi =DISPLAY_MODE==='card'?renderIchiCard  :renderIchi;

  rHyaku(document.getElementById('svg-hyaku-a'), ts.hyakuA.count,ts.hyakuA.alpha,ts.hyakuA.hl,null,ts.hyakuA.ghost);
  rJuu  (document.getElementById('svg-juu-a'),   ts.juuA.count,  ts.juuA.alpha,  ts.juuA.hl,null,ts.juuA.ghost);
  updateJuuRaisedTransform(ts);
  rIchi (document.getElementById('svg-ichi-a'),  ts.ichiA.count, ts.ichiA.alpha, ts.ichiA.hl,ts.ichiA.ghost);
  rHyaku(document.getElementById('svg-hyaku-b'), ts.hyakuB.count,ts.hyakuB.alpha,ts.hyakuB.hl,null,ts.hyakuB.ghost);
  rJuu  (document.getElementById('svg-juu-b'),   ts.juuB.count,  ts.juuB.alpha,  ts.juuB.hl,null,ts.juuB.ghost);
  rIchi (document.getElementById('svg-ichi-b'),  ts.ichiB.count, ts.ichiB.alpha, ts.ichiB.hl,ts.ichiB.ghost);

  const rowAns=document.getElementById('row-ans');
  if(ts.showAnsRow){
    rowAns.style.display='table-row';
    rHyaku(document.getElementById('svg-hyaku-ans'), ts.hyakuAns.count,ts.hyakuAns.alpha,ts.hyakuAns.hl,null,ts.hyakuAns.ghost);
    rJuu  (document.getElementById('svg-juu-ans'),   ts.juuAns.count,  ts.juuAns.alpha,  ts.juuAns.hl,null,ts.juuAns.ghost);
    rIchi (document.getElementById('svg-ichi-ans'),  ts.ichiAns.count, ts.ichiAns.alpha, ts.ichiAns.hl,ts.ichiAns.ghost);
  } else {
    rowAns.style.display='none';
    // 答え行が非表示のときは、中のSVGも必ず空にしておく。
    // ここでクリアしておかないと、以前の問題や以前のステップで
    // 十の位・百の位の答え欄に描かれたタイルがDOMに残ったままになり、
    // 後続の対消滅アニメーション（annihilate-ichi等）内で答え行を
    // 一時的にtable-rowへ切り替える瞬間に、そのタイルが一瞬だけ
    // 見えてしまう（現在の答えとは無関係な、古い個数のタイルが
    // ちらつくバグの原因になっていた）。
    document.getElementById('svg-hyaku-ans').innerHTML='';
    document.getElementById('svg-juu-ans').innerHTML='';
    document.getElementById('svg-ichi-ans').innerHTML='';
  }

  renderBridgeTen(ts);
  renderBridgeHyaku(ts);
}

// 一の位へ繰り下げた「10の塊」の半透明痕跡を、bridge10-layer（永続レイヤー）に描画する。
// anim-layerと違ってステップ移動時にクリアされないため、この関数がステップごとに
// 呼ばれることで、ts.bridgeTenの状態に応じて常に最新の見た目に描き直される。
// count個は通常表示（まだ使われていない分）、残り(10-count)個は半透明ghost（使用済み分）。
function renderBridgeTen(ts){
  const bl=document.getElementById('bridge10-layer');
  bl.innerHTML='';
  const bt=ts.bridgeTen;
  if(!bt||!bt.show)return;
  const tileArea=document.getElementById('tile-area');
  const tileRect=tileArea.getBoundingClientRect();
  if(!tileRect.width)return; // レイアウト未確定（非表示など）の場合は描かない
  // 波及的繰り下がりの十の位と同じロジック：いちのくらいのタイトル位置(hdr-ichi)
  // を中心に、通常サイズのタイルで表示する。
  const hc=hdrCenter('hdr-ichi');
  if(DISPLAY_MODE==='card'){
    bridgeCardPositions(10,hc,'ichi').forEach((p,i)=>{
      const isGhost=i>=bt.count;
      drawCardSingle(bl,p.x,p.y,'ichi',1,isGhost?.45:1,null,isGhost);
    });
    return;
  }
  const u=U;
  bridgeIchiPositions(10,hc).forEach((p,i)=>{
    const isGhost=i>=bt.count;
    const attrs={x:p.x-u/2,y:p.y-u/2,width:u,height:u,fill:FC,
      stroke:isGhost?'#8a8a8a':SC,'stroke-width':1,rx:.6,opacity:isGhost?.45:1};
    if(isGhost)attrs['stroke-dasharray']='2,1.5';
    mk('rect',attrs,bl);
  });
}

// 百の位から十の位へくり下げた「10本の10」の半透明な痕跡を、bridge100-layer（永続レイヤー）に描画する。
// じゅうのくらいのタイトル位置(hdr-juu)を中心に、小さい棒タイル10本を横に並べて表示する。
// count個は通常表示（まだ使われていない分）、残り(10-count)個は半透明ghost（使用済み分）。
function renderBridgeHyaku(ts){
  const bl=document.getElementById('bridge100-layer');
  bl.innerHTML='';
  const bh=ts.bridgeHyaku;
  if(!bh||!bh.show)return;
  const tileArea=document.getElementById('tile-area');
  const tileRect=tileArea.getBoundingClientRect();
  if(!tileRect.width)return; // レイアウト未確定（非表示など）の場合は描かない
  // 波及的繰り下がり(borrow-h-to-j-cascade)と同じロジック：じゅうのくらいの
  // タイトル位置(hdr-juu)を中心に、通常サイズの棒で表示する。
  const hc=hdrCenter('hdr-juu');
  if(DISPLAY_MODE==='card'){
    bridgeCardPositions(10,hc,'juu').forEach((p,i)=>{
      const isGhost=i>=bh.count;
      drawCardSingle(bl,p.x,p.y,'juu',1,isGhost?.45:1,isGhost?null:'#e35d3a',isGhost);
    });
    return;
  }
  const G2=U*.15,stickH=10*U+9*G2;
  bridgeStickPositions(10,hc).forEach((p,i)=>{
    const isGhost=i>=bh.count;
    const g=mk('g',{},bl);
    drawStick(g,p.x,p.y,U,isGhost?.45:1,isGhost?'#8a8a8a':'#e35d3a');
    if(isGhost){
      mk('rect',{x:p.x-U/2-1,y:p.y-stickH/2-1,width:U+2,height:stickH+2,
        fill:'none',stroke:'#8a8a8a','stroke-width':.8,'stroke-dasharray':'2,1.5',rx:1},bl);
    }
  });
}

// ============================================================
// アニメーション本体
// ============================================================
// カード方式のときの汎用トランジション。
// タイル方式は「1個ずつ動く・対消滅する」といった位ごとの専用アニメーションを
// 多数もつが、カード方式ではすべてのステップで共通のシンプルなクロスフェードに
// 統一する（＝どのステップでも同じ見た目で確実に動く。個々の飛行アニメーションは
// 今回は実装していない）。
function runCardTransition(nextState,onDone){
  const tileArea=document.getElementById('tile-area');
  tileArea.style.transition='opacity .16s ease';
  tileArea.style.opacity='.25';
  setTimeout(()=>{
    paintTiles(nextState);
    tileArea.style.opacity='1';
    setTimeout(()=>{tileArea.style.transition='';onDone();},180);
  },160);
}

function runAnim(animType,prevState,nextState,onDone){
  const layer=document.getElementById('anim-layer');
  layer.innerHTML='';
  if(!animType){onDone();return;}

  const aH=Math.floor(numA/100),aJ=Math.floor((numA%100)/10),aI=numA%10;
  const bH=Math.floor(numB/100),bJ=Math.floor((numB%100)/10),bI=numB%10;
  const has3=(aH>0);
  const needBorrowI=(aI<bI);
  const needCascadeForI = needBorrowI && has3 && (aJ===0);
  const jBeforeLendToI = needCascadeForI ? (aJ+10) : aJ;
  const jAfterBorrowI=jBeforeLendToI-(needBorrowI?1:0);
  const iAns=needBorrowI?(aI+10-bI):(aI-bI);
  const needBorrowJ=has3&&(jAfterBorrowI<bJ);
  const jAns=needBorrowJ?(jAfterBorrowI+10-bJ):(jAfterBorrowI-bJ);
  const hAfterBorrowJ=has3?(aH-((needCascadeForI||needBorrowJ)?1:0)):0;
  const hAns=has3?(hAfterBorrowJ-bH):0;

  // 百タイル描画スケール（hyakuセル用：動的に広がった幅に対応。縮尺は常にHYAKU_TILE_REF_H基準）
  const HW=vbW('svg-hyaku-a');
  const u=U,G=u*.15,side=10*u+9*G;
  const su=u*Math.min((HW-8)/side,(HYAKU_TILE_REF_H-8)/side);

  // --- appear-hyaku-a / b ---
  if(animType==='appear-hyaku-a'||animType==='appear-hyaku-b'){
    const id=animType==='appear-hyaku-a'?'svg-hyaku-a':'svg-hyaku-b';
    const count=animType==='appear-hyaku-a'?aH:bH;
    const svgEl=document.getElementById(id);
    svgEl.innerHTML='';
    if(DISPLAY_MODE==='card'){
      const W=vbW(id),H=vbH(id);
      const{pos}=cardBoxPositions(count,0,'hyaku',W,H);
      let si=0;
      (function next(){
        if(si>=count){onDone();return;}
        const p=pos[si];
        const g=mk('g',{opacity:0},svgEl);
        drawCardSingle(g,p.cx,p.cy,'hyaku',p.scale,1,null,false);
        tween(280,t=>g.setAttribute('opacity',t),()=>{si++;next();});
      })();
      return;
    }
    const W=vbW(id),H=vbH(id);let si=0;
    (function next(){
      if(si>=count){onDone();return;}
      const{cx,cy}=hyakuTilePos(si,count,W,H,su);
      const g=mk('g',{opacity:0},svgEl);
      drawHyakuScaled(g,cx,cy,su,1,SC);
      tween(280,t=>g.setAttribute('opacity',t),()=>{si++;next();});
    })();
    return;
  }

  // --- appear-juu-a / b ---
  if(animType==='appear-juu-a'||animType==='appear-juu-b'){
    const id=animType==='appear-juu-a'?'svg-juu-a':'svg-juu-b';
    const count=animType==='appear-juu-a'?aJ:bJ;
    const svgEl=document.getElementById(id);
    svgEl.innerHTML='';
    if(DISPLAY_MODE==='card'){
      const W=vbW(id),H=vbH(id);
      const{pos}=cardBoxPositions(count,0,'juu',W,H);
      let si=0;
      (function next(){
        if(si>=count){onDone();return;}
        const p=pos[si];
        const g=mk('g',{opacity:0},svgEl);
        drawCardSingle(g,p.cx,p.cy,'juu',p.scale,1,null,false);
        tween(220,t=>g.setAttribute('opacity',t),()=>{si++;next();});
      })();
      return;
    }
    const W=vbW(id),H=86;
    const centers=stickCenters(count,W,H);
    let si=0;
    (function next(){
      if(si>=count){onDone();return;}
      const{cx,cy}=centers[si];
      const g=mk('g',{opacity:0},svgEl);
      drawStick(g,cx,cy,U,1);
      tween(200,t=>g.setAttribute('opacity',t),()=>{si++;next();});
    })();
    return;
  }

  // --- appear-ichi-a / b ---
  if(animType==='appear-ichi-a'||animType==='appear-ichi-b'){
    const id=animType==='appear-ichi-a'?'svg-ichi-a':'svg-ichi-b';
    const count=animType==='appear-ichi-a'?aI:bI;
    const svgEl=document.getElementById(id);
    svgEl.innerHTML='';
    if(DISPLAY_MODE==='card'){
      const W=vbW(id),H=vbH(id);
      const{pos}=cardBoxPositions(count,0,'ichi',W,H);
      let si=0;
      (function next(){
        if(si>=count){onDone();return;}
        const p=pos[si];
        const g=mk('g',{opacity:0},svgEl);
        drawCardSingle(g,p.cx,p.cy,'ichi',p.scale,1,null,false);
        tween(140,t=>g.setAttribute('opacity',t),()=>{si++;next();});
      })();
      return;
    }
    const W=110,H=86;
    const tmp=mk('svg',{width:0,height:0,style:'position:absolute;visibility:hidden'});
    document.body.appendChild(tmp);
    const pos=drawIchi(tmp,count,W,H,1,null);
    document.body.removeChild(tmp);
    let ii=0;
    (function next(){
      if(ii>=pos.length){onDone();return;}
      const{cx,cy}=pos[ii];
      const r=mk('rect',{x:cx-U/2,y:cy-U/2,width:U,height:U,fill:FC,stroke:SC,'stroke-width':1,rx:.6,opacity:0},svgEl);
      tween(140,t=>r.setAttribute('opacity',t),()=>{ii++;next();});
    })();
    return;
  }

  // ============================================================
  // 対消滅アニメーション（共通エンジン）
  // svgA: A側(被減数)のSVG要素, svgB: B側(減数)のSVG要素
  // countA: A側に現在ある個数, countB: 消す個数(=B側の個数)
  // drawFn: 1個を描く関数 drawFn(parent,cx,cy,scale,color)
  // getPositions: SVG内でのN個の中心座標配列を返す関数 (svgEl,count)=>[{cx,cy},...]
  // onAllDone: 全消滅完了後、残ったA側の個数を答え欄に描く処理
  // ============================================================
  function runAnnihilation(opts){
    const {svgA, svgB, countA, countB, getPositions, drawUnit, unitSize, onAllDone} = opts;
    const existingGhostA = opts.existingGhostA || 0; // 借用などで既にA側に残っているghost数
    // A側・B側それぞれの「消える対象」の座標を取得（末尾countB個を対象とする）
    // A側の座標はcountA+existingGhostA個の配置で計算する（ghost分も含めた全体レイアウト）。
    // countAのみで計算すると、existingGhostA分を追加した際に中心座標がずれてしまうため。
    const allPosAFull = getPositions(svgA, countA + existingGhostA);
    const allPosA = allPosAFull.slice(0, countA);
    const allPosB = getPositions(svgB, countB);
    const targetA = allPosA.slice(Math.max(0,countA-countB)); // A側の後ろからcountB個
    const remainA = countA - countB;

    function drawUnitAt(parent,x,y,a){
      a=a??1;
      const isGhost=a<.5;
      if(DISPLAY_MODE==='card'){
        drawCardSingle(parent,x,y,drawUnit,1,a,null,isGhost);
        return;
      }
      if(drawUnit==='ichi'){
        mk('rect',{x:x-unitSize/2,y:y-unitSize/2,width:unitSize,height:unitSize,fill:FC,stroke:isGhost?'#aaa':SC,'stroke-width':1,rx:.6,opacity:a},parent);
      } else if(drawUnit==='juu'){
        drawStick(parent,x,y,unitSize,a,SC);
        if(isGhost){
          // renderSticksのghost枠と同じ計算式で囲み枠を追加し、表現を統一する
          const G=unitSize*.15,TH=10*unitSize+9*G;
          mk('rect',{x:x-unitSize/2-2,y:y-TH/2-2,width:unitSize+4,height:TH+4,
            fill:'none',stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'3,2',rx:2},parent);
        }
      } else {
        drawHyakuScaled(parent,x,y,unitSize,a,SC);
        if(isGhost){
          // renderHyakusのghost枠と同じ計算式で囲み枠を追加し、表現を統一する
          const side2=10*unitSize+9*unitSize*.15;
          mk('rect',{x:x-side2/2-2,y:y-side2/2-2,width:side2+4,height:side2+4,
            fill:'none',stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'3,2',rx:2},parent);
        }
      }
    }

    // A側・B側は、まだ何も結ばれていない間は通常表示(濃い色)のまま。
    // 個々のタイルを<g>要素として描き、後で「そのペアの番が来た瞬間」に
    // 個別に隠せるようにしておく。
    // A側にはexistingGhostA分(借用などで既に半透明になっている分)も最初から表示しておく。
    // これを省くと、アニメーション開始の瞬間だけ既存ghostが消えて見える矛盾が生じる。
    svgA.innerHTML='';
    const allPosAWithGhost = getPositions(svgA, countA + existingGhostA);
    const elA=allPosAWithGhost.map((p,i)=>{
      const g=mk('g',{},svgA);
      const isExistingGhost = i >= countA; // 末尾existingGhostA個が既存ghost分
      drawUnitAt(g,p.cx,p.cy,isExistingGhost?.45:1);
      return g;
    }).slice(0,countA); // 対消滅ロジックで使うのはcountA個分のみ(既存ghost分はelAに含めない)
    svgB.innerHTML='';
    const elB=allPosB.map(p=>{
      const g=mk('g',{},svgB);
      drawUnitAt(g,p.cx,p.cy,1);
      return g;
    });

    const lA=targetA.map(p=>svgToLayer(svgA,p.cx,p.cy));
    const lB=allPosB.map(p=>svgToLayer(svgB,p.cx,p.cy));
    const elTargetA=elA.slice(Math.max(0,countA-countB)); // targetAに対応するDOM要素

    layer.innerHTML='';
    const n=Math.min(lA.length,lB.length);
    if(n===0){ if(onAllDone) onAllDone(); onDone(); return; }

    // 「右から」結ばれるように、配列の末尾（＝最後に描かれたタイル。
    // 一の位が6〜9個等で2行に折り返す場合は最終行の右端）から逆順に処理する。
    // 以前はx座標で毎回ソートしていたが、A側とB側で行の折り返し位置
    // （5個ずつ等）が食い違う場合に、見た目の順番が右から1つずつに
    // ならないことがあったため、座標に依存しないインデックス逆順に統一する。
    const order=Array.from({length:n},(_,i)=>n-1-i);

    const tileRect=document.getElementById('tile-area').getBoundingClientRect();
    const destX=tileRect.width-20, destY=20; // tile-area内の右上付近の固定点（全ペア共通の移動先）

    const STAGGER=230; // 1ペアあたりの開始ディレイ（線アニメ220msより長くして重なりを避ける）
    let doneCount=0;

    function runPair(i){
      const a=lA[i], b=lB[i];
      const realA=elTargetA[i], realB=elB[i];
      const posA=targetA[i], posB=allPosB[i]; // svgA/svgB内のローカル座標(描き直し用)
      const line=mk('line',{x1:b.x,y1:b.y,x2:b.x,y2:b.y,stroke:'#ff7043','stroke-width':2.5,'stroke-linecap':'round'},layer);
      // フェーズ1: 線がB→Aへ伸びる（この間、本体タイルはまだ通常表示のまま）
      tween(220, t=>{
        const cx=b.x+(a.x-b.x)*t, cy=b.y+(a.y-b.y)*t;
        line.setAttribute('x2',cx); line.setAttribute('y2',cy);
      }, ()=>{
        // フェーズ2: つながった瞬間グロウ（本体タイルに直接光らせる。まだ半透明にはしない）
        realA.setAttribute('class','glow-pop');
        realB.setAttribute('class','glow-pop');
        setTimeout(()=>{
          // フェーズ3: 移動開始の瞬間に、
          // 1) 元の場所(realA/realB)はその場で半透明のghostに変えて残す
          // 2) 別に濃い色の分身をlayerに出して右上へ移動・フェードアウトさせる
          const GHOST_A=.45;
          realA.innerHTML=''; drawUnitAt(realA,posA.cx,posA.cy,GHOST_A);
          realB.innerHTML=''; drawUnitAt(realB,posB.cx,posB.cy,GHOST_A);
          realA.removeAttribute('class'); realB.removeAttribute('class');
          const gA=mk('g',{},layer); drawUnitAt(gA,a.x,a.y,1);
          const gB=mk('g',{},layer); drawUnitAt(gB,b.x,b.y,1);
          tween(550, t=>{
            const dxA=(destX-a.x)*t, dyA=(destY-a.y)*t;
            const dxB=(destX-b.x)*t, dyB=(destY-b.y)*t;
            gA.setAttribute('transform',`translate(${dxA},${dyA})`);
            gB.setAttribute('transform',`translate(${dxB},${dyB})`);
            // 濃い色の分身は移動しながら最後にフェードアウトして消える。
            const op=1-t;
            gA.setAttribute('opacity',op);
            gB.setAttribute('opacity',op);
            line.setAttribute('opacity',op);
            line.setAttribute('x1',b.x+dxB); line.setAttribute('y1',b.y+dyB);
            line.setAttribute('x2',a.x+dxA); line.setAttribute('y2',a.y+dyA);
          }, ()=>{
            line.remove(); gA.remove(); gB.remove();
            doneCount++;
            if(doneCount>=n) afterAllPairs();
          });
        }, 250); // グロウを少し見せてから移動開始
      });
    }

    // 「右から」の順序で、1組ずつSTAGGERだけディレイをかけて開始する
    order.forEach((i,k)=>setTimeout(()=>runPair(i), k*STAGGER));

    function afterAllPairs(){
      // 全ペア完了：対消滅したタイルは、元の位置に半透明のghostとして残す。
      // A側：消えた分(countB個)+既存ghost分をghostとして、残った分(remainA個)は通常表示。
      svgA.innerHTML='';
      renderPlace(drawUnit,svgA,remainA,1,null,countB+existingGhostA);
      // B側：全部消えたので、countB個まるごとghostとして残す。
      svgB.innerHTML='';
      renderPlace(drawUnit,svgB,0,1,null,countB);

      // フェーズ4: 残ったA側のタイル(通常表示分)が結果欄へ移動。
      // 移動後、A側の元の位置にはremainA個分もghostとして残し続ける
      // （= A側は最終的に「countB個ghost + remainA個ghost」が薄く残る）。
      if(remainA===0){
        if(onAllDone) onAllDone();
        onDone();
        return;
      }
      const ansEl = opts.svgAns;
      document.getElementById('row-ans').style.display='table-row';
      ansEl.innerHTML='';

      // 移動元（現在svgA内に見えているremainA個の配置）と
      // 移動先（答え欄内でのremainA個の配置）をあらかじめ求めておく。
      // allPosAは「remainA個の実表示 + countB個ghost」を描いた際と同じ
      // 全体レイアウト（countA個ぶん）で計算済みなので、先頭remainA個が
      // そのまま現在の見た目上の位置と一致する。
      const fromPosA=allPosA.slice(0,remainA);
      const toPosAns=getPositions(ansEl,remainA);
      const fromL=fromPosA.map(p=>svgToLayer(svgA,p.cx,p.cy));
      const toL=toPosAns.map(p=>svgToLayer(ansEl,p.cx,p.cy));

      // 結果をひと呼吸見せてから、実際に答え欄へ移動するアニメーションを行う。
      setTimeout(()=>{
        // 移動開始と同時に、元の位置(svgA)は全てghost化して残す
        svgA.innerHTML='';
        renderPlace(drawUnit,svgA,0,1,null,countA+existingGhostA);

        // 濃い色の分身をanim-layerに出し、A側の元位置→答え欄へ実際に移動させる
        const movers=fromL.map(f=>{
          const g=mk('g',{},layer);
          drawUnitAt(g,f.x,f.y,1);
          return g;
        });
        tween(500, t=>{
          movers.forEach((g,i)=>{
            const dx=(toL[i].x-fromL[i].x)*t, dy=(toL[i].y-fromL[i].y)*t;
            g.setAttribute('transform',`translate(${dx},${dy})`);
          });
        }, ()=>{
          movers.forEach(g=>g.remove());
          ansEl.innerHTML='';
          renderPlace(drawUnit,ansEl,remainA,1,null,0);
          if(onAllDone) onAllDone();
          onDone();
        });
      }, 350);
    }
  }

  // --- annihilate-ichi: 繰り下がり不要の一の位の対消滅 ---
  if(animType==='annihilate-ichi'){
    runAnnihilation({
      svgA: document.getElementById('svg-ichi-a'),
      svgB: document.getElementById('svg-ichi-b'),
      svgAns: document.getElementById('svg-ichi-ans'),
      countA: aI, countB: bI,
      drawUnit:'ichi', unitSize:U,
      getPositions:(svgEl,count)=>{
        if(DISPLAY_MODE==='card') return cardGetPositions('ichi')(svgEl,count);
        const W=110,H=svgEl===document.getElementById('svg-ichi-ans')?94:86;
        const tmp=mk('svg',{width:0,height:0});
        return drawIchi(tmp,count,W,H,1,null);
      }
    });
    return;
  }

  // --- borrow-j-to-i: 十の位から一の位へ棒1本をくり下げる ---
  if(animType==='borrow-j-to-i'){
    if(DISPLAY_MODE==='card'){
      const svgJA=document.getElementById('svg-juu-a');
      const W=vbW('svg-juu-a'),H=vbH('svg-juu-a');
      const baseCount=jBeforeLendToI;
      const{pos}=cardBoxPositions(baseCount,0,'juu',W,H);

      const src=svgToLayer(svgJA,srcLocal.cx,srcLocal.cy);
      const dest=hdrCenter('hdr-ichi');
      renderCardPlace('juu',svgJA,baseCount-1,1,null,1);
      cardFly(layer,src,dest,'juu','#e74c3c',500,()=>{
        layer.innerHTML='';
        const g2=mk('g',{opacity:.4},layer);
        drawCardSingle(g2,dest.x,dest.y,'juu',1,1,'#e74c3c',false);
        onDone();
      });

    }
    const svgJA=document.getElementById('svg-juu-a');
    const W=vbW('svg-juu-a'),H=86;
    const baseCount=jBeforeLendToI; // カスケード済みなら10等、通常はaJそのもの
    // 最後の1本（一番右）を借りる対象とする
    const srcLocal=stickCenters(baseCount,W,H)[baseCount-1];
    const src=svgToLayer(svgJA,srcLocal.cx,srcLocal.cy);
    // 移動先：いちのくらいのタイトル位置(hdr-ichi)中心。
    // 波及的繰り下がりの十の位(hdr-juu基準)と同じロジックに統一する。
    const dest=hdrCenter('hdr-ichi');

    // 残りの本数は通常表示、借りた1本は元の位置に半透明の痕跡として描く（renderSticksのghost機能を利用）
    renderSticks(svgJA,baseCount-1,1,null,null,1);

    const g=mk('g',{},layer);
    drawStick(g,src.x,src.y,U,1,'#e74c3c');
    tween(500,t=>{
      const tx=src.x+(dest.x-src.x)*t, ty=src.y+(dest.y-src.y)*t;
      g.setAttribute('transform',`translate(${tx-src.x},${ty-src.y})`);
    },()=>{
      layer.innerHTML='';
      // 移動先(一の位の上)にも半透明で残す（次のunbundle-10で使う）。
      // 移動元(十の位)の半透明の痕跡はsvgJA内にそのまま残り続ける(renderSticksのghostで描画済み)。
      const g2=mk('g',{opacity:.4},layer);
      drawStick(g2,dest.x,dest.y,U,1,'#e74c3c');
      onDone();
    });
    return;
  }

  // --- borrow-h-to-j-cascade: 百の位タイル1枚が十の位へ降りて10本の棒に展開される（十の位が0の時のカスケード借用）---
  if(animType==='borrow-h-to-j-cascade'){
    if(DISPLAY_MODE==='card'){
      const svgHA=document.getElementById('svg-hyaku-a');
      const svgJA=document.getElementById('svg-juu-a');

      cardFly(layer,src,dest,'hyaku','#e74c3c',500,()=>{

    // renderHyakusと同じ並べ方(hyakuTilePos)で、最後の1枚(index aH-1, total aH)の位置を求める
    const srcLocal=hyakuTilePos(aH-1,aH,W,H,su);
    const src=svgToLayer(svgHA,srcLocal.cx,srcLocal.cy);
    const svgJA=document.getElementById('svg-juu-a');
    // 着地位置は「ひかれる数」の通常位置ではなく、じゅうのくらいのタイトル位置(hdr-juu)中心にする。
    // こうしておくことで、アニメーション終了直後にupdateJuuRaisedTransform()が
    // svg-juu-aを押し上げても、見た目がジャンプしない。
    const dest=hdrCenter('hdr-juu');

    renderHyakus(svgHA,aH-1,1,null,null,1);
    svgJA.innerHTML=''; // 十の位はもともと0本なので空のまま
    const g=mk('g',{},layer);
    drawHyakuScaled(g,src.x,src.y,su,1,'#e74c3c');
    tween(500,t=>{
      const tx=src.x+(dest.x-src.x)*t, ty=src.y+(dest.y-src.y)*t;
      const sc=1-t*0.3;
      g.setAttribute('transform',`translate(${tx-src.x},${ty-src.y})`);
    },()=>{
      layer.innerHTML='';
      // 十の位のA行に、借りてきた分の棒(jBeforeLendToI本)を展開して表示する
      renderSticks(svgJA,jBeforeLendToI,1,'#e74c3c');
      onDone();
    });
    return;
  }

  // --- borrow-h-to-j-move: 百の位から十の位へタイル1枚をくり下げる（この時点ではまだバラバラにしない） ---
  // 十の位から一の位への「borrow-j-to-i」と対応する処理：くり下げた1枚を
  // じゅうのくらいのタイトル位置(hdr-juu)まで運び、そこに半透明の100タイルとして
  // 着地させるところまでを1ステップとする。バラバラにする演出は次のunbundle-100-to-jで行う。
  if(animType==='borrow-h-to-j-move'){
    // この間は「動いている実物」をanim-layerで見せるため、永続レイヤー(bridge100-layer)側の
    // 静止した重複表示を一時的に消しておく（onDone後のpaintTilesで正しい状態に描き直される）。
    document.getElementById('bridge100-layer').innerHTML='';
    if(DISPLAY_MODE==='card'){
      const svgHA=document.getElementById('svg-hyaku-a');
      const W=vbW('svg-hyaku-a'),H=vbH('svg-hyaku-a');
      const{pos}=cardBoxPositions(aH,0,'hyaku',W,H);
      const srcLocal=pos[aH-1];
      const src=svgToLayer(svgHA,srcLocal.cx,srcLocal.cy);
      const dest=hdrCenter('hdr-juu');
      renderCardPlace('hyaku',svgHA,aH-1,1,null,1);
      cardFly(layer,src,dest,'hyaku','#e74c3c',500,()=>{
        layer.innerHTML='';
        // borrow-j-to-iと同じく、移動先(じゅうのくらいのタイトル上)にも
        // 半透明の100タイルとして残す（次のunbundle-100-to-jで使う）。
        const g2=mk('g',{opacity:.4},layer);
        drawCardSingle(g2,dest.x,dest.y,'hyaku',1,1,'#e74c3c',false);
        onDone();
      });
      return;
    }
    const svgHA=document.getElementById('svg-hyaku-a');
    const W=vbW('svg-hyaku-a'),H=vbH('svg-hyaku-a');
    const srcLocal=hyakuTilePos(aH-1,aH,W,H,su);
    const src=svgToLayer(svgHA,srcLocal.cx,srcLocal.cy);
    // 着地位置は「ひかれる数」の通常位置ではなく、じゅうのくらいのタイトル位置(hdr-juu)中心にする。
    // 波及的繰り下がり(borrow-h-to-j-cascade)と同じ着地ロジック。
    const dest=hdrCenter('hdr-juu');

    renderHyakus(svgHA,aH-1,1,null,null,1);
    const g=mk('g',{},layer);
    drawHyakuScaled(g,src.x,src.y,su,1,'#e74c3c');
    tween(500,t=>{
      const tx=src.x+(dest.x-src.x)*t, ty=src.y+(dest.y-src.y)*t;
      g.setAttribute('transform',`translate(${tx-src.x},${ty-src.y})`);
    },()=>{
      layer.innerHTML='';
      // borrow-j-to-iと同じく、移動先(じゅうのくらいのタイトル上)にも
      // 半透明の100タイルとして残す（次のunbundle-100-to-jで使う）。
      const g2=mk('g',{opacity:.4},layer);
      drawHyakuScaled(g2,dest.x,dest.y,su,1,'#e74c3c');
      onDone();
    });
    return;
  }

  // --- unbundle-100-to-j: くり下げた1枚(100)が10本の棒にバラバラになる ---
  // 一の位の「unbundle-10」と対応する処理。
  if(animType==='unbundle-100-to-j'){
    // layer上の半透明の100タイル(borrow-h-to-j-moveで残したもの)を消して、
    // じゅうのくらいのタイトル位置に10本の棒として展開する
    layer.innerHTML='';
    // この間は「動いている実物」をanim-layerで見せるため、永続レイヤー(bridge100-layer)側の
    // 静止した重複表示を一時的に消しておく（onDone後のpaintTilesで正しい状態に描き直される）。
    document.getElementById('bridge100-layer').innerHTML='';
    const dest=hdrCenter('hdr-juu');
    if(DISPLAY_MODE==='card'){
      const g=mk('g',{opacity:0},layer);
      bridgeCardPositions(10,dest,'juu').forEach(p=>{
        drawCardSingle(g,p.x,p.y,'juu',1,1,'#e35d3a',false);
      });
      tween(350,t=>g.setAttribute('opacity',t),()=>{
        layer.innerHTML='';
        onDone();
      });
      return;
    }
    // 10本を、じゅうのくらいのタイトル位置(hdr-juu)中心にフルサイズで展開して表示
    // (波及的繰り下がりでsvg-juu-aに直接描かれる棒と同じ大きさ・並べ方に統一)
    const g=mk('g',{opacity:0},layer);
    bridgeStickPositions(10,dest).forEach(p=>{
      drawStick(g,p.x,p.y,U,1,'#e35d3a');
    });
    tween(350,t=>g.setAttribute('opacity',t),()=>{
      // このあとonDone()経由でpaintTiles()が呼ばれ、bridge100-layer（永続レイヤー）に
      // 同じ10本の棒が描き直されるので、anim-layer側の仮描画は消しておく
      layer.innerHTML='';
      onDone();
    });
    return;
  }

  // --- unbundle-10: くり下げた1本(または1枚)が10個に分解される ---
  if(animType==='unbundle-10'){
    // layer上の半透明グレーの棒(borrow-j-to-iで残したもの)を、一の位エリアに10個のブロックとして展開する
    layer.innerHTML='';
    // この間は「動いている実物」をanim-layerで見せるため、永続レイヤー(bridge10-layer)側の
    // 静止した重複表示を一時的に消しておく（onDone後のpaintTilesで正しい状態に描き直される）。
    document.getElementById('bridge10-layer').innerHTML='';
    if(DISPLAY_MODE==='card'){
      const svgIA=document.getElementById('svg-ichi-a');
      renderCardPlace('ichi',svgIA,aI,1,null,0);
      const hc=hdrCenter('hdr-ichi');
      const g=mk('g',{opacity:0},layer);
      bridgeCardPositions(10,hc,'ichi').forEach(p=>{
        drawCardSingle(g,p.x,p.y,'ichi',1,1,null,false);
      });
      tween(350,t=>g.setAttribute('opacity',t),()=>{
        layer.innerHTML='';
        onDone();
      });
      return;
    }
    const svgIA=document.getElementById('svg-ichi-a');
    const W=110,H=86;
    renderIchi(svgIA,aI,1,null); // 元の一の位はそのまま
    // 10個を、いちのくらいのタイトル位置(hdr-ichi)中心に通常サイズで展開して表示
    // (十の位の波及的繰り下がりと同じ「タイトル位置中心・フルサイズ」ロジック)
    const hc=hdrCenter('hdr-ichi');
    const g=mk('g',{opacity:0},layer);
    bridgeIchiPositions(10,hc).forEach(p=>{
      mk('rect',{x:p.x-U/2,y:p.y-U/2,width:U,height:U,fill:FC,stroke:SC,'stroke-width':1,rx:.6},g);
    });
    tween(350,t=>g.setAttribute('opacity',t),()=>{
      // このあとonDone()経由でpaintTiles()が呼ばれ、bridge10-layer（永続レイヤー）に
      // 同じ10個のブロックが描き直されるので、anim-layer側の仮描画は消しておく
      // （残しておくと二重に重なって見えてしまう）。
      layer.innerHTML='';
      onDone();
    });
    return;
  }

  // --- annihilate-bridge10 / annihilate-direct10: 借りてきた10個とBの一の位を対消滅 ---
  if(animType==='annihilate-bridge10'||animType==='annihilate-direct10'){
    // この間は「動いている実物」をanim-layerで見せるため、永続レイヤー(bridge10-layer)側の
    // 静止した重複表示を一時的に消しておく（onDone後のpaintTilesで正しい状態に描き直される）。
    document.getElementById('bridge10-layer').innerHTML='';
    if(DISPLAY_MODE==='card'){
      const svgIB=document.getElementById('svg-ichi-b');
      const hc=hdrCenter('hdr-ichi');
      const pos10=bridgeCardPositions(10,hc,'ichi');
      const n=Math.min(10,bI);
      const remainTen=10-n;
      const usedTen=pos10.slice(remainTen);
      const WB=vbW('svg-ichi-b'),HB=vbH('svg-ichi-b');
      const{pos:posBLocal}=cardBoxPositions(bI,0,'ichi',WB,HB);
      const posB=posBLocal.map(p=>svgToLayer(svgIB,p.cx,p.cy));

      layer.innerHTML='';
      const elTen=pos10.map(p=>{const g=mk('g',{},layer);drawCardSingle(g,p.x,p.y,'ichi',1,1,null,false);return g;});
      const elUsedTen=elTen.slice(remainTen);
      svgIB.innerHTML='';
      const elBReal=posBLocal.map(p=>{const g=mk('g',{},svgIB);drawCardSingle(g,p.cx,p.cy,'ichi',1,1,null,false);return g;});

      cardAnnihilatePairs({
        posA:usedTen, posB, realA:elUsedTen, realB:elBReal,
        place:'ichi', color:null,
        onAllDone:()=>{
          layer.innerHTML='';
          renderCardPlace('ichi',svgIB,0,1,null,bI);
          onDone();
        }
      });
      return;
    }
    const svgIA=document.getElementById('svg-ichi-a');
    const svgIB=document.getElementById('svg-ichi-b');
    const svgIAns=document.getElementById('svg-ichi-ans');
    const W=110,H=86;
    const tileRect=document.getElementById('tile-area').getBoundingClientRect();
    // 借りてきた10個の座標（unbundle-10・renderBridgeTenと同じ計算＝いちのくらいヘッダー中心）
    const hc=hdrCenter('hdr-ichi');
    const sz=U;
    const pos10=bridgeIchiPositions(10,hc);

    // Bのアニメ用座標
    const posB=drawIchi(mk('svg',{width:0,height:0}),bI,W,H,1,null).map(p=>svgToLayer(svgIB,p.cx,p.cy));

    const n=Math.min(10,posB.length);
    const remainTen=10-n; // ブリッジ計算の残り(10-bI)。pos10の先頭remainTen個が「残る側」。
    // 対消滅に使う10個側はpos10の末尾n個（右側）。Bの一の位もx降順（右から）で結ぶ。
    const usedTen=pos10.slice(remainTen);
    const bOrder=Array.from({length:n},(_,i)=>i).sort((i,j)=>posB[j].x-posB[i].x);

    layer.innerHTML='';
    // 借りてきた10個は、まだ何も結ばれていない間は通常表示(濃い色)のまま。
    // 個々を<g>要素として描き、ペアの番が来た瞬間に個別に隠せるようにする。
    const elTen=pos10.map(p=>{
      const g=mk('g',{},layer);
      mk('rect',{x:p.x-sz/2,y:p.y-sz/2,width:sz,height:sz,fill:FC,stroke:SC,'stroke-width':1,rx:.5},g);
      return g;
    });
    const elUsedTen=elTen.slice(remainTen);
    // Bの一の位も同様に、個別の<g>要素として通常表示で描く。
    svgIB.innerHTML='';
    const posBLocal=drawIchi(mk('svg',{width:0,height:0}),bI,W,H,1,null);
    const elBReal=posBLocal.map(p=>{
      const g=mk('g',{},svgIB);
      mk('rect',{x:p.cx-U/2,y:p.cy-U/2,width:U,height:U,fill:FC,stroke:SC,'stroke-width':1,rx:.6},g);
      return g;
    });

    const destX=tileRect.width-20, destY=20; // runAnnihilationと同じ「右上の固定点」に統一
    const STAGGER=230; // 線アニメ220msより長くして重なりを避ける
    let doneCount=0;

    function runPair(i){
      const a=usedTen[i], b=posB[bOrder[i]];
      const bLocal=posBLocal[bOrder[i]]; // svgIB内のローカル座標(realBへの描画に使う)
      const realA=elUsedTen[i], realB=elBReal[bOrder[i]];
      const line=mk('line',{x1:b.x,y1:b.y,x2:b.x,y2:b.y,stroke:'#ff7043','stroke-width':2.5,'stroke-linecap':'round'},layer);
      tween(220,t=>{
        const cx2=b.x+(a.x-b.x)*t, cy2=b.y+(a.y-b.y)*t;
        line.setAttribute('x2',cx2); line.setAttribute('y2',cy2);
      },()=>{
        // つながった瞬間グロウ（本体タイルに直接光らせる。まだ半透明にはしない）
        realA.setAttribute('class','glow-pop');
        realB.setAttribute('class','glow-pop');
        setTimeout(()=>{
          // 移動開始の瞬間に、
          // 1) 元の場所(realA/realB)はその場で半透明のghostに変えて残す
          // 2) 別に濃い色の分身をlayerに出して右上へ移動・フェードアウトさせる
          const GHOST_A=.45;
          realA.innerHTML='';
          mk('rect',{x:a.x-sz/2,y:a.y-sz/2,width:sz,height:sz,fill:FC,stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'2,1.5',rx:.5,opacity:GHOST_A},realA);
          realB.innerHTML='';
          mk('rect',{x:bLocal.cx-U/2,y:bLocal.cy-U/2,width:U,height:U,fill:FC,stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'2,1.5',rx:.6,opacity:GHOST_A},realB);
          realA.removeAttribute('class'); realB.removeAttribute('class');
          const ga=mk('g',{},layer);
          mk('rect',{x:a.x-sz/2,y:a.y-sz/2,width:sz,height:sz,fill:FC,stroke:SC,'stroke-width':1,rx:.5},ga);
          const gb=mk('g',{},layer);
          mk('rect',{x:b.x-U/2,y:b.y-U/2,width:U,height:U,fill:FC,stroke:SC,'stroke-width':1,rx:.6},gb);
          tween(550,t=>{
            const dxA=(destX-a.x)*t, dyA=(destY-a.y)*t;
            const dxB=(destX-b.x)*t, dyB=(destY-b.y)*t;
            ga.setAttribute('transform',`translate(${dxA},${dyA})`);
            gb.setAttribute('transform',`translate(${dxB},${dyB})`);
            // 濃い色の分身は移動しながら最後にフェードアウトして消える。
            const op=1-t;
            ga.setAttribute('opacity',op);
            gb.setAttribute('opacity',op);
            line.setAttribute('opacity',op);

        setTimeout(()=>{
          const GHOST_A=.45;
          realA.innerHTML=''; drawStick(realA,a.x,a.y,su2,GHOST_A,'#8a8a8a');
          realB.innerHTML=''; drawStick(realB,bLocal.cx,bLocal.cy,U,GHOST_A,'#8a8a8a');
          realA.removeAttribute('class'); realB.removeAttribute('class');
          const ga=mk('g',{},layer); drawStick(ga,a.x,a.y,su2,1,'#e35d3a');
          const gb=mk('g',{},layer); drawStick(gb,b.x,b.y,U,1,SC);
          tween(550,t=>{
            const dxA=(destX-a.x)*t, dyA=(destY-a.y)*t;
            const dxB=(destX-b.x)*t, dyB=(destY-b.y)*t;
            ga.setAttribute('transform',`translate(${dxA},${dyA})`);
            gb.setAttribute('transform',`translate(${dxB},${dyB})`);
            const op=1-t;
            ga.setAttribute('opacity',op);
            gb.setAttribute('opacity',op);
            line.setAttribute('opacity',op);
            line.setAttribute('x1',b.x+dxB); line.setAttribute('y1',b.y+dyB);
            line.setAttribute('x2',a.x+dxA); line.setAttribute('y2',a.y+dyA);
          },()=>{
            line.remove(); ga.remove(); gb.remove();
            doneCount++;
            if(doneCount>=n) afterAllPairs();
          });
        },250);
      });
    }
    // 「右から」の順序（usedTen/bOrderは既に右から並んでいる）で、1組ずつディレイをかけて開始
    for(let i=0;i<n;i++) setTimeout(()=>runPair(i), i*STAGGER);

    function afterAllPairs(){
      layer.innerHTML='';
      // Bの十の位はghostとして痕跡を残す（paintTilesでも同じghost指定をしているが、
      // ここで描いておくことでonDone直前の見た目も正しくなる）
      renderSticks(svgJB,0,1,null,null,bJ);
      // 借りてきた10本（remainTen本は通常表示、残りはghost）は、このあとonDone()経由で
      // paintTiles()が呼ばれた際にts.bridgeHyakuの状態からbridge100-layer（永続レイヤー）に
      // 描き直されるので、ここでanim-layerに仮描画する必要はない。
      onDone();
    }
    return;
  }

  // --- bridge-add-remainder-juu: ブリッジ計算の残りに元のじゅうのくらいを足す ---
  if(animType==='bridge-add-remainder-juu'){
    // この間は「動いている実物」をanim-layerで見せるため、永続レイヤー(bridge100-layer)側の
    // 静止した重複表示を一時的に消しておく（onDone後のpaintTilesで正しい状態に描き直される）。
    document.getElementById('bridge100-layer').innerHTML='';
    if(DISPLAY_MODE==='card'){
      const tenMinusBJ=10-bJ;
      const svgJA=document.getElementById('svg-juu-a');
      const svgJAns=document.getElementById('svg-juu-ans');
      const existingGhostA=needBorrowI?1:0;
      document.getElementById('row-ans').style.display='table-row';
      const hc=hdrCenter('hdr-juu');
      const remainTen=tenMinusBJ;
      const pos10Full=bridgeCardPositions(10,hc,'juu');
      const posRemain=pos10Full.slice(0,remainTen);
      const WA=vbW('svg-juu-a'),HA=vbH('svg-juu-a');
      const{pos:posAExistingFull}=cardBoxPositions(jAfterBorrowI+existingGhostA,0,'juu',WA,HA);
      const posAExistingActive=posAExistingFull.slice(0,jAfterBorrowI);
      const posAExistingLayer=posAExistingActive.map(p=>svgToLayer(svgJA,p.cx,p.cy));

      layer.innerHTML='';
      svgJAns.innerHTML='';
      svgJA.innerHTML='';
      for(let i=0;i<10;i++){
        drawCardSingle(layer,pos10Full[i].x,pos10Full[i].y,'juu',1,.45,null,true);
      }
      renderCardPlace('juu',svgJA,0,1,null,jAfterBorrowI+existingGhostA);

      const allSrc=[...posRemain,...posAExistingLayer];
      const jAns2=remainTen+jAfterBorrowI;
      const WAns=vbW('svg-juu-ans'),HAns=vbH('svg-juu-ans');
      const{pos:posAnsLocal}=cardBoxPositions(jAns2,0,'juu',WAns,HAns);
      const lDestAll=posAnsLocal.map(p=>svgToLayer(svgJAns,p.cx,p.cy));

      setTimeout(()=>{
        cardFlyMany(layer,allSrc,lDestAll,'juu',null,550,()=>{
          layer.innerHTML='';
          renderCardPlace('juu',svgJAns,jAns2,1,null,0);
          onDone();
        });
      },350);
      return;
    }
    const tenMinusBJ=10-bJ;
    const svgJA=document.getElementById('svg-juu-a');
    const svgJAns=document.getElementById('svg-juu-ans');
    const existingGhostA = needBorrowI ? 1 : 0;
    const W=vbW('svg-juu-a');

    function juuPosBridge(count,W2,H2){
      return stickCenters(count,W2,H2);
    }

    // 答え欄(row-ans)の表示・座標計算は、必ずsvgJAnsのレイアウトが確定してから行う。
    document.getElementById('row-ans').style.display='table-row';

    // 借りてきた「10本の10」のうち、まだ使われず残っているremainTen本の座標
    // （renderBridgeHyakuと同じ計算＝じゅうのくらいヘッダー中心）
    const hc=hdrCenter('hdr-juu');
    const su2=U;
    const remainTen=tenMinusBJ;
    const pos10Full=bridgeStickPositions(10,hc);
    const posRemain=pos10Full.slice(0,remainTen);

    // すでに(繰り下げ前から)十の位A列に表示されている棒(jAfterBorrowI本、+既存ghost分)の座標
    const posAExistingFull=juuPosBridge(jAfterBorrowI+existingGhostA,W,86);
    const posAExistingActive=posAExistingFull.slice(0,jAfterBorrowI);
    const posAExistingLayer=posAExistingActive.map(p=>svgToLayer(svgJA,p.cx,p.cy));

    layer.innerHTML='';
    svgJAns.innerHTML='';
    svgJA.innerHTML='';

    // 移動開始時に、元の位置に半透明のghostを残しておく。
    // 1) 借用エリア全体(10本)：前ステップで既にbJ本はghost化済みなので、10本まとめてghost基準を描く
    const G2=su2*.15,stickH=10*su2+9*G2;
    for(let i=0;i<10;i++){
      const p=pos10Full[i];
      drawStick(layer,p.x,p.y,su2,.45,'#8a8a8a');
      mk('rect',{x:p.x-su2/2-1,y:p.y-stickH/2-1,width:su2+2,height:stickH+2,
        fill:'none',stroke:'#8a8a8a','stroke-width':.8,'stroke-dasharray':'2,1.5',rx:1},layer);
    }
    // 2) もとの十の位A列(jAfterBorrowI本、+既存ghost分)
    renderSticks(svgJA,0,1,null,null,jAfterBorrowI+existingGhostA);

    const remainGroup=posRemain.map(p=>{const g=mk('g',{},layer);drawStick(g,p.x,p.y,su2,1,'#e35d3a');return g;});
    const aGroup=posAExistingLayer.map(p=>{const g=mk('g',{},layer);drawStick(g,p.x,p.y,U,1,SC);return g;});

    const allSrc=[...posRemain,...posAExistingLayer];
    const allG=[...remainGroup,...aGroup];

    // 答え欄の目標座標
    const jAns2=remainTen+jAfterBorrowI;
    const posAns=juuPosBridge(jAns2,W,94);
    const lDestAll=posAns.map(p=>svgToLayer(svgJAns,p.cx,p.cy));

    setTimeout(()=>{
      tween(550,t=>{
        allG.forEach((g,i)=>{
          const dest=lDestAll[i]||lDestAll[lDestAll.length-1];
          const dx=(dest.x-allSrc[i].x)*t, dy=(dest.y-allSrc[i].y)*t;
          g.setAttribute('transform',`translate(${dx},${dy})`);
        });
      },()=>{
        layer.innerHTML='';
        renderSticks(svgJAns,jAns2,1,null);
        // 借用エリア全体(10本)は、このあとonDone()経由でpaintTiles()が呼ばれた際に
        // ts.bridgeHyaku(count:0=すべてghost)の状態からbridge100-layer（永続レイヤー）へ
        // 描き直されるので、ここでanim-layerに仮描画する必要はない。
        onDone();
      });
    },350);
    return;
  }

  // --- annihilate-juu-borrowed: 十の位でくり下げた後の対消滅 ---
  // ひゃくのくらいから借りてきて、ヘッダー上(bridge100-layer)にすでに表示されている
  // 「10本の10」を、そのまま対消滅の実体として使う（新たにA列へ10本を描き直さない）。
  if(animType==='annihilate-juu-borrowed'){
    document.getElementById('bridge100-layer').innerHTML='';
    if(DISPLAY_MODE==='card'){
      const svgJA=document.getElementById('svg-juu-a');
      const svgJB=document.getElementById('svg-juu-b');
      const svgJAns=document.getElementById('svg-juu-ans');
      const existingGhostA=needBorrowI?1:0;
      const hc=hdrCenter('hdr-juu');
      const pos10=bridgeCardPositions(10,hc,'juu');
      const WB=vbW('svg-juu-b'),HB=vbH('svg-juu-b');
      const{pos:posBLocal}=cardBoxPositions(bJ,0,'juu',WB,HB);
      const posB=posBLocal.map(p=>svgToLayer(svgJB,p.cx,p.cy));
      const WA=vbW('svg-juu-a'),HA=vbH('svg-juu-a');
      const{pos:posAExistingFull}=cardBoxPositions(jAfterBorrowI+existingGhostA,0,'juu',WA,HA);
      const posAExistingActive=posAExistingFull.slice(0,jAfterBorrowI);
      const posAExistingLayer=posAExistingActive.map(p=>svgToLayer(svgJA,p.cx,p.cy));

      const n=Math.min(10,bJ);
      const remainTen=10-n;
      const usedTen=pos10.slice(remainTen);

      layer.innerHTML='';
      const elTen=pos10.map(p=>{const g=mk('g',{},layer);drawCardSingle(g,p.x,p.y,'juu',1,1,'#e35d3a',false);return g;});
      const elUsedTen=elTen.slice(remainTen);
      svgJB.innerHTML='';
      const elBReal=posBLocal.map(p=>{const g=mk('g',{},svgJB);drawCardSingle(g,p.cx,p.cy,'juu',1,1,null,false);return g;});

      cardAnnihilatePairs({
        posA:usedTen, posB, realA:elUsedTen, realB:elBReal,
        place:'juu', color:'#e35d3a',
        onAllDone:()=>{
          layer.innerHTML='';
          renderBridgeHyaku(nextState);
          renderCardPlace('juu',svgJB,0,1,null,bJ);

          document.getElementById('row-ans').style.display='table-row';
          const jAns2=remainTen+jAfterBorrowI;
          const WAns=vbW('svg-juu-ans'),HAns=vbH('svg-juu-ans');
          const{pos:posAnsLocal}=cardBoxPositions(jAns2,0,'juu',WAns,HAns);
          const lDestAll=posAnsLocal.map(p=>svgToLayer(svgJAns,p.cx,p.cy));

          svgJA.innerHTML='';
          renderCardPlace('juu',svgJA,0,1,null,jAfterBorrowI+existingGhostA);

          const remainSrc=pos10.slice(0,remainTen);
          const allSrc=[...remainSrc,...posAExistingLayer];

          svgJAns.innerHTML='';
          setTimeout(()=>{
            cardFlyMany(layer,allSrc,lDestAll,'juu',null,550,()=>{
              layer.innerHTML='';
              renderCardPlace('juu',svgJAns,jAns2,1,null,0);
              onDone();
            });
          },350);
        }
      });
      return;
    }
    const svgJA=document.getElementById('svg-juu-a');
    const svgJB=document.getElementById('svg-juu-b');
    const svgJAns=document.getElementById('svg-juu-ans');
    const existingGhostA = needBorrowI ? 1 : 0;

    function juuPos(count,W2,H2){
      return stickCenters(count,W2,H2);
    }
    const W=vbW('svg-juu-a');

    // 借りてきた「10本の10」の座標（renderBridgeHyakuと同じ計算＝じゅうのくらいヘッダー中心）
    const hc=hdrCenter('hdr-juu');
    const su2=U;
    const pos10=bridgeStickPositions(10,hc);

    // Bの十の位(bJ本)の座標
    const posBLocal=juuPos(bJ,W,86);
    const posB=posBLocal.map(p=>svgToLayer(svgJB,p.cx,p.cy));

    // すでに(繰り下げ前から)十の位A列に表示されている棒(jAfterBorrowI本、+既存ghost分)の座標
    const posAExistingFull=juuPos(jAfterBorrowI+existingGhostA,W,86);
    const posAExistingActive=posAExistingFull.slice(0,jAfterBorrowI);
    const posAExistingLayer=posAExistingActive.map(p=>svgToLayer(svgJA,p.cx,p.cy));

    const n=Math.min(10,bJ);
    const remainTen=10-n; // 借りてきた10本のうち、まだ使われず残る本数
    const usedTen=pos10.slice(remainTen); // 対消滅に使う側(右＝末尾n本)
    const bOrder=Array.from({length:n},(_,i)=>i).sort((i,j)=>posB[j].x-posB[i].x);

    layer.innerHTML='';
    // 借りてきた10本を、個別の<g>要素としてlayerに描く(ヘッダー上の実体をそのまま動かす)
    const elTen=pos10.map(p=>{
      const g=mk('g',{},layer);
      drawStick(g,p.x,p.y,su2,1,'#e35d3a');
      return g;
    });
    const elUsedTen=elTen.slice(remainTen);
    // Bの十の位も、個別の<g>要素として通常表示で描く
    svgJB.innerHTML='';
    const elBReal=posBLocal.map(p=>{
      const g=mk('g',{},svgJB);
      drawStick(g,p.cx,p.cy,U,1,SC);
      return g;
    });

    const tileRect=document.getElementById('tile-area').getBoundingClientRect();
    const destX=tileRect.width-20, destY=20;
    const STAGGER=230;
    let doneCount=0;

    function runPair(i){
      const a=usedTen[i], b=posB[bOrder[i]];
      const bLocal=posBLocal[bOrder[i]];
      const realA=elUsedTen[i], realB=elBReal[bOrder[i]];
      const line=mk('line',{x1:b.x,y1:b.y,x2:b.x,y2:b.y,stroke:'#ff7043','stroke-width':2.5,'stroke-linecap':'round'},layer);
      tween(220,t=>{
        const cx2=b.x+(a.x-b.x)*t, cy2=b.y+(a.y-b.y)*t;
        line.setAttribute('x2',cx2); line.setAttribute('y2',cy2);
      },()=>{
        realA.setAttribute('class','glow-pop');
        realB.setAttribute('class','glow-pop');
        setTimeout(()=>{
          const GHOST_A=.45;
          realA.innerHTML=''; drawStick(realA,a.x,a.y,su2,GHOST_A,'#8a8a8a');
          realB.innerHTML=''; drawStick(realB,bLocal.cx,bLocal.cy,U,GHOST_A,'#8a8a8a');
          realA.removeAttribute('class'); realB.removeAttribute('class');
          const ga=mk('g',{},layer); drawStick(ga,a.x,a.y,su2,1,'#e35d3a');
          const gb=mk('g',{},layer); drawStick(gb,b.x,b.y,U,1,SC);
          tween(550,t=>{
            const dxA=(destX-a.x)*t, dyA=(destY-a.y)*t;
            const dxB=(destX-b.x)*t, dyB=(destY-b.y)*t;
            ga.setAttribute('transform',`translate(${dxA},${dyA})`);
            gb.setAttribute('transform',`translate(${dxB},${dyB})`);
            const op=1-t;
            ga.setAttribute('opacity',op);
            gb.setAttribute('opacity',op);
            line.setAttribute('opacity',op);
            line.setAttribute('x1',b.x+dxB); line.setAttribute('y1',b.y+dyB);
            line.setAttribute('x2',a.x+dxA); line.setAttribute('y2',a.y+dyA);
          },()=>{
            line.remove(); ga.remove(); gb.remove();
            doneCount++;
            if(doneCount>=n) afterAllPairs();
          });
        },250);
      });
    }
    for(let i=0;i<n;i++) setTimeout(()=>runPair(i), i*STAGGER);

    function afterAllPairs(){
      layer.innerHTML='';
      // 「10本の10」の半透明痕跡は、この後の答え欄への移動アニメーション中も
      // 消えずに残り続けてほしいので、ここでbridge100-layer（永続レイヤー）に
      // 最終状態(count:0=10本すべてghost)を先に描いておく。こうしておけば、
      // このあとlayer側で移動アニメーションを行っている間も痕跡が途切れず、
      // onDone()後のpaintTilesでも同じ見た目のまま引き継がれる。
      renderBridgeHyaku(nextState);
      // Bの十の位はghostとして痕跡を残す
      renderSticks(svgJB,0,1,null,null,bJ);

      // 残った借用分(remainTen本)＋もとから十の位にあった分(jAfterBorrowI本)を、
      // まとめて答え欄(jAns本)へ移動する。
      document.getElementById('row-ans').style.display='table-row';
      const jAns2=remainTen+jAfterBorrowI;
      const posAns=juuPos(jAns2,W,94);
      const lDestAll=posAns.map(p=>svgToLayer(svgJAns,p.cx,p.cy));

      // 移動開始時に、元の位置(A列/ヘッダー上)は全てghost化して残しておく
      svgJA.innerHTML='';
      renderSticks(svgJA,0,1,null,null,jAfterBorrowI+existingGhostA);

      const remainSrc=pos10.slice(0,remainTen); // 既にlayer座標
      const allSrc=[...remainSrc,...posAExistingLayer];
      const remainGroup=remainSrc.map(p=>{const g=mk('g',{},layer);drawStick(g,p.x,p.y,su2,1,SC);return g;});
      const aGroup=posAExistingLayer.map(p=>{const g=mk('g',{},layer);drawStick(g,p.x,p.y,U,1,SC);return g;});
      const allG=[...remainGroup,...aGroup];

      svgJAns.innerHTML='';
      setTimeout(()=>{
        tween(550,t=>{
          allG.forEach((g,i)=>{
            const dest=lDestAll[i]||lDestAll[lDestAll.length-1];
            const dx=(dest.x-allSrc[i].x)*t, dy=(dest.y-allSrc[i].y)*t;
            g.setAttribute('transform',`translate(${dx},${dy})`);
          });
        },()=>{
          layer.innerHTML='';
          renderSticks(svgJAns,jAns2,1,null);
          onDone();
        });
      },350);
    }
    return;
  }

  // --- annihilate-hyaku: 百の位の対消滅 ---
  if(animType==='annihilate-hyaku'){
    runAnnihilation({
      svgA: document.getElementById('svg-hyaku-a'),
      svgB: document.getElementById('svg-hyaku-b'),
      svgAns: document.getElementById('svg-hyaku-ans'),
      countA: hAfterBorrowJ, countB: bH,
      existingGhostA: (needCascadeForI||needBorrowJ) ? 1 : 0,
      drawUnit:'hyaku', unitSize:su,
      getPositions:(svgEl,count)=>{
        if(!count) return [];
        if(DISPLAY_MODE==='card') return cardGetPositions('hyaku')(svgEl,count);
        const W=vbW('svg-hyaku-a'),H=parseInt(svgEl.getAttribute('height'))||86;
        return Array.from({length:count},(_,i)=>hyakuTilePos(i,count,W,H,su));
      }
    });
    return;
  }

  // ここまでのどの専用アニメーションにも一致しなかった場合のフォールバック。
  // カード方式では、個別演出をまだ用意していないanimTypeでも見た目が固まらないよう、
  // 簡易クロスフェードで確実に次の状態へ切り替える。
  if(DISPLAY_MODE==='card'){runCardTransition(nextState,onDone);return;}

  layer.innerHTML='';
  onDone();
}

// 千タイルスケール計算
function getSenScale(){
  const W=110,H=86,u=U,G=u*.15,W10=10*u+9*G,H10=10*u+9*G,OX=u*.35,OY=u*.35;
  const needW=W10+9*OX,needH=H10+9*OY;
  return u*Math.min((W-6)/needW,(H-6)/needH);
}

// ============================================================
// レイアウト更新（列の表示/非表示・幅の動的拡張）
// <col>要素を1つ操作するだけで thead/tbody 両方の対応列が同時に
// 表示/非表示・幅変更される（tableの仕様）ため、ヘッダーとデータの
// ズレは構造的に発生しない。
// ============================================================
function updateLayout(){
  const aH=Math.floor(numA/100),aJ=Math.floor((numA%100)/10),aI=numA%10;
  const bH=Math.floor(numB/100),bJ=Math.floor((numB%100)/10),bI=numB%10;
  // ひき算では桁が増えることはなく、ひかれる数(A)の桁数がそのまま最大桁数になる
  const has3=(aH>0);

  // 百の位列（col要素の表示切替＋ th/td も同じ値で連動させ二重に保証する）
  const hyakuDisp=has3?'':'none';
  document.getElementById('colgrp-hyaku').style.display=has3?'table-column':'none';
  document.querySelectorAll('.th-hyaku, .td-hyaku').forEach(el=>{el.style.display=hyakuDisp;});

  // ---- 十の位の幅・高さ：くり下げで一時的に増える本数も考慮 ----
  // 表示しうる最大本数：A行のaJ本、もしくは(借りてきた後の)十の位の本数+10(ブリッジ表示)
  const maxJuuCount=Math.max(aJ,bJ,10+aJ,1);
  let juuWidth,juuHeight,juuHeightAns;
  if(DISPLAY_MODE==='card'){
    // カード方式：5枚で1段・あふれたら次の段という固定レイアウトなので、
    // cardNeedWidth/cardNeedHeightで実際に必要な幅・高さを逆算する。
    juuWidth=Math.max(124,Math.round(cardNeedWidth(maxJuuCount,'juu')));
    juuHeight=Math.max(86,Math.round(cardNeedHeight(maxJuuCount,'juu')));
    juuHeightAns=juuHeight+8;
  } else {
    const juuNeedW=stickLayout(Math.min(maxJuuCount,19)).totW+16; // renderSticksと同じ計算式（5本グループ間隔込み）＋余白
    juuWidth=Math.max(124,Math.round(juuNeedW));
    juuHeight=86;juuHeightAns=94;
  }
  document.querySelector('col.col-juu').style.width=juuWidth+'px';
  ['svg-juu-a','svg-juu-b'].forEach(id=>{
    const svg=document.getElementById(id);
    svg.setAttribute('width',juuWidth);
    svg.setAttribute('height',juuHeight);
    svg.setAttribute('viewBox',`0 0 ${juuWidth} ${juuHeight}`);
  });
  {
    const svg=document.getElementById('svg-juu-ans');
    svg.setAttribute('width',juuWidth);
    svg.setAttribute('height',juuHeightAns);
    svg.setAttribute('viewBox',`0 0 ${juuWidth} ${juuHeightAns}`);
  }

  // ---- 百の位の幅・高さ：A行の枚数が多い場合に大きく広げる ----
  // タイル方式では hyakuFootprint（実際のタイル配置の共通関数）から逆算し、
  // カード方式では cardNeedWidth/cardNeedHeight（5枚ずつ横一列の固定レイアウト）から逆算する。
  const maxHyakuCount=Math.max(aH,1);
  let hyakuWidth,hyakuHeight,hyakuHeightAns;
  if(DISPLAY_MODE==='card'){
    hyakuWidth=Math.max(124,Math.round(cardNeedWidth(maxHyakuCount,'hyaku')));
    hyakuHeight=Math.max(86,Math.round(cardNeedHeight(maxHyakuCount,'hyaku')));
    hyakuHeightAns=hyakuHeight+8;
  } else {
    const hyakuFp=hyakuFootprint(maxHyakuCount,hyakuRefSu());
    const hyakuNeedW=hyakuFp.width+16; // 左右の余白
    hyakuWidth=Math.max(124,Math.round(hyakuNeedW));
    const hyakuNeedH=hyakuFp.height+8; // 上下の余白
    hyakuHeight=Math.max(86,Math.round(hyakuNeedH));
    hyakuHeightAns=hyakuHeight+8; // 答え行はもともと86→94のように+8高くする慣例に合わせる
  }
  document.getElementById('colgrp-hyaku').style.width=hyakuWidth+'px';
  ['svg-hyaku-a','svg-hyaku-b'].forEach(id=>{
    const svg=document.getElementById(id);
    svg.setAttribute('width',hyakuWidth);
    svg.setAttribute('height',hyakuHeight);
    svg.setAttribute('viewBox',`0 0 ${hyakuWidth} ${hyakuHeight}`);
  });
  {
    const svg=document.getElementById('svg-hyaku-ans');
    svg.setAttribute('width',hyakuWidth);
    svg.setAttribute('height',hyakuHeightAns);
    svg.setAttribute('viewBox',`0 0 ${hyakuWidth} ${hyakuHeightAns}`);
  }

  // ---- 一の位の幅・高さ：カード方式では、じゅうのくらいから借りてきた「10このカード」が
  // bridge10-layer（ヘッダー中心・5枚×2段の固定レイアウト）にあふれずに収まるよう、
  // あらかじめ列の幅を広げておく。cardNeedWidth(5枚ぶん)を確保しておけば、
  // カードは常に縮小されない一定サイズのまま表示され、枠からはみ出すこともない。
  // タイル方式は今まで通り固定サイズ(110×86)のままでよい。
  const maxIchiCount=Math.max(aI,bI,10,1);
  let ichiWidth,ichiHeight,ichiHeightAns;
  if(DISPLAY_MODE==='card'){
    ichiWidth=Math.max(110,Math.round(cardNeedWidth(maxIchiCount,'ichi')));
    ichiHeight=Math.max(86,Math.round(cardNeedHeight(maxIchiCount,'ichi')));
    ichiHeightAns=ichiHeight+8;
  } else {
    ichiWidth=110;ichiHeight=86;ichiHeightAns=94;
  }
  document.querySelector('col.col-ichi').style.width=ichiWidth+'px';
  ['svg-ichi-a','svg-ichi-b'].forEach(id=>{
    const svg=document.getElementById(id);
    svg.setAttribute('width',ichiWidth);
    svg.setAttribute('height',ichiHeight);
    svg.setAttribute('viewBox',`0 0 ${ichiWidth} ${ichiHeight}`);
  });
  {
    const svg=document.getElementById('svg-ichi-ans');
    svg.setAttribute('width',ichiWidth);
    svg.setAttribute('height',ichiHeightAns);
    svg.setAttribute('viewBox',`0 0 ${ichiWidth} ${ichiHeightAns}`);
  }

}

// ============================================================
// UI更新
// ============================================================
function updateUI(skipAnim){
  const step=steps[stepIdx];
  const total=steps.length;
  document.getElementById('step-num').textContent=stepIdx+1;
  document.getElementById('step-title-text').innerHTML=step.title;
  document.getElementById('step-desc').innerHTML=step.desc;
  speakStep(step.desc);
  document.getElementById('step-ind').textContent=`${stepIdx+1} / ${total}`;
  document.getElementById('btn-prev').disabled=animBusy||(stepIdx===0);
  document.getElementById('btn-next').disabled=animBusy||(stepIdx===total-1);
  drawHissan(document.getElementById('hissan-svg'),step.h);

  if(skipAnim||!step.anim){paintTiles(step.t);return;}

  const prevT=stepIdx>0?steps[stepIdx-1].t:step.t;
  paintTiles(prevT);
  animBusy=true;
  document.getElementById('btn-next').disabled=true;
  document.getElementById('btn-prev').disabled=true;

  runAnim(step.anim,prevT,step.t,()=>{
    paintTiles(step.t);
    animBusy=false;
    document.getElementById('btn-prev').disabled=(stepIdx===0);
    document.getElementById('btn-next').disabled=(stepIdx===total-1);
  });
}

function goStep(dir){
  if(animBusy)return;
  cancelAnim();
  document.getElementById('anim-layer').innerHTML='';
  const newIdx=stepIdx+dir;
  if(newIdx<0||newIdx>=steps.length)return;
  stepIdx=newIdx;
  updateUI(dir<0);
}

function setProblem(a,b){
  if(animBusy)return;
  cancelAnim();
  numA=a;numB=b;stepIdx=0;
  document.getElementById('inp-a').value=a;
  document.getElementById('inp-b').value=b;
  document.querySelectorAll('.problem-btn').forEach(btn=>{
    btn.classList.toggle('active',btn.textContent.replace(/\s/g,'')==`${a}－${b}`);
  });
  document.getElementById('anim-layer').innerHTML='';
  updateLayout();
  steps=buildSteps();
  updateUI(true);
}

// タイル方式／カード方式の切り替え。stepsのデータ自体（数値・状態）は
// モードに依存しないので作り直さなくてよく、レイアウト幅の再計算と、
// 現在のステップの再描画だけ行えばよい。
function setDisplayMode(mode){
  if(animBusy||mode===DISPLAY_MODE)return;
  cancelAnim();
  DISPLAY_MODE=mode;
  document.getElementById('mode-btn-tile').classList.toggle('active',mode==='tile');
  document.getElementById('mode-btn-card').classList.toggle('active',mode==='card');
  document.getElementById('anim-layer').innerHTML='';
  updateLayout();
  updateUI(true);
}

function setMethod(m){
  if(animBusy)return;
  calcMethod=m;
  document.getElementById('btn-bridge').classList.toggle('active',m==='bridge');
  document.getElementById('btn-normal').classList.toggle('active',m==='normal');
  cancelAnim();
  document.getElementById('anim-layer').innerHTML='';
  stepIdx=0;
  updateLayout();
  steps=buildSteps();
  updateUI(true);
}

function generateFromInput(){
  const va=parseInt(document.getElementById('inp-a').value);
  const vb=parseInt(document.getElementById('inp-b').value);
  const err=document.getElementById('err-msg');
  if(!Number.isInteger(va)||!Number.isInteger(vb)||va<1||va>999||vb<1||vb>999||vb>=va){
    err.style.display='block';setTimeout(()=>err.style.display='none',3000);return;
  }
  err.style.display='none';
  document.querySelectorAll('.problem-btn').forEach(btn=>btn.classList.remove('active'));
  numA=va;numB=vb;stepIdx=0;
  cancelAnim();
  document.getElementById('anim-layer').innerHTML='';
  updateLayout();
  steps=buildSteps();
  updateUI(true);
}

document.getElementById('inp-a').addEventListener('keydown',e=>{if(e.key==='Enter')generateFromInput();});
document.getElementById('inp-b').addEventListener('keydown',e=>{if(e.key==='Enter')generateFromInput();});

// キーボードの矢印キーで「すすむ／もどる」を操作する。
// ただし数字入力欄など、テキスト入力中に矢印キーで値を操作したい要素に
// フォーカスがある場合は、ステップ送りを行わずそのまま通常の動作に任せる。
document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  e.preventDefault();
  goStep(e.key==='ArrowRight'?1:-1);
});

// 初期化
updateLayout();
steps=buildSteps();
warmupTTS();
updateUI(true);
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,warmupTTS,{once:true}));
</script>
