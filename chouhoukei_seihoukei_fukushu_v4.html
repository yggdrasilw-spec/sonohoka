<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>長方形・正方形 ふくしゅう v4</title>
<style>
  :root{
    --ink:#20314a; --sub:#586b86; --paper:#f7fbff; --panel:#ffffff;
    --blue:#2f7df4; --blue2:#dfeeff; --green:#18a06b; --green2:#dcf7ec;
    --orange:#f59e0b; --orange2:#fff2d5; --red:#e44747; --red2:#ffe6e6;
    --violet:#805ad5; --violet2:#eee7ff; --line:#cbd8e6; --shadow:0 16px 40px rgba(32,49,74,.14);
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#dce8f5;font-family:"Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink)}
  button,input{font:inherit}
  button{cursor:pointer}
  #viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation}
  #stageFrame{position:relative;overflow:hidden;flex:none}
  #stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:linear-gradient(145deg,#f9fcff 0%,#eef7ff 56%,#fff8ed 100%);overflow:hidden;box-shadow:0 24px 70px rgba(20,45,74,.22)}
  #stage::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(60,145,170,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(60,145,170,.07) 1px,transparent 1px);background-size:24px 24px}
  .screen{position:absolute;inset:0;padding:26px 38px;display:none;z-index:1}
  .screen.active{display:flex;flex-direction:column}
  .topbar{height:60px;display:flex;align-items:center;gap:16px;flex:none}
  .brand{font-weight:900;font-size:23px;letter-spacing:.02em;white-space:nowrap}
  .modeTag{padding:8px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:16px}
  .progressWrap{margin-left:auto;width:360px;display:flex;align-items:center;gap:12px}
  .progressText{font-size:15px;font-weight:800;color:var(--sub);min-width:62px;text-align:right}
  .progressTrack{height:11px;border-radius:999px;background:#dbe6f2;overflow:hidden;flex:1}
  .progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#69a9ff);border-radius:inherit;transition:width .25s ease}
  .home{align-items:center;justify-content:center;text-align:center;padding-top:46px!important}
  .heroKicker{font-weight:900;color:var(--blue);font-size:22px;letter-spacing:.12em;margin-bottom:10px}
  .heroTitle{font-size:58px;line-height:1.1;font-weight:1000;margin:0;text-shadow:0 3px 0 #fff}
  .heroSub{font-size:24px;font-weight:800;color:var(--sub);margin:14px 0 28px}
  .shapeHero{width:560px;height:130px;margin:0 auto 18px;display:flex;justify-content:center;gap:36px;align-items:center}
  .modeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:1080px}
  .modeCard{background:rgba(255,255,255,.93);border:3px solid #fff;border-radius:26px;box-shadow:var(--shadow);padding:22px 20px 20px;min-height:170px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;text-align:left;position:relative;overflow:hidden}
  .modeCard:hover,.modeCard:focus-visible{transform:translateY(-5px) scale(1.015);box-shadow:0 22px 50px rgba(32,49,74,.20);outline:none;border-color:#b8d4fa}
  .modeCard .num{font-size:15px;font-weight:1000;color:var(--blue);letter-spacing:.09em}
  .modeCard h2{font-size:28px;margin:7px 0 8px}
  .modeCard p{font-size:17px;line-height:1.55;margin:0;color:var(--sub);font-weight:700}
  .modeCard .pill{position:absolute;right:15px;top:15px;border-radius:999px;background:var(--blue2);color:#235fb8;padding:6px 10px;font-weight:900;font-size:13px}

  #content{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr .85fr;gap:22px;position:relative}
  .card{background:rgba(255,255,255,.96);border:2px solid rgba(190,208,226,.85);border-radius:28px;box-shadow:var(--shadow);min-height:0}
  .questionCard{padding:24px 30px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .qLabel{font-size:15px;font-weight:1000;color:var(--blue);letter-spacing:.13em;margin-bottom:8px}
  .qText{font-size:34px;line-height:1.35;font-weight:1000;margin:0 0 12px}
  .qText .blank{display:inline-block;min-width:120px;border-bottom:5px solid var(--blue);color:var(--blue);text-align:center;padding:0 6px}
  .visual{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0 2px}
  .visual svg{max-width:100%;max-height:100%;overflow:visible}
  .sideCard{padding:20px;display:flex;flex-direction:column;min-height:0;position:relative}
  .teacherPrompt{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
  .teacherPrompt .listen{font-size:20px;color:var(--sub);font-weight:800}
  .bigAnswer{font-size:36px;font-weight:1000;color:var(--green);line-height:1.35;animation:pop .26s cubic-bezier(.2,.9,.2,1.3)}
  .explain{font-size:19px;line-height:1.55;color:var(--ink);font-weight:800;background:var(--green2);border:2px solid #b6ead7;border-radius:18px;padding:14px 18px;width:100%}
  .options{display:grid;grid-template-columns:1fr;gap:10px;margin:auto 0}
  .option{width:100%;min-height:66px;border:3px solid #d9e5f0;border-radius:18px;background:#fff;padding:10px 14px;font-size:22px;font-weight:900;color:var(--ink);transition:.12s ease;text-align:left;display:flex;align-items:center;gap:12px}
  .option::before{content:attr(data-key);display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#edf4fb;color:var(--sub);font-size:15px;flex:none}
  .option:hover,.option.focused{border-color:#80b6ff;background:#f4f9ff;transform:translateX(4px)}
  .option.correct{border-color:#56c49a;background:var(--green2);color:#126b4b}
  .option.wrong{border-color:#ef8d8d;background:var(--red2);color:#a62828;animation:shake .26s linear}
  .option:disabled{cursor:default}
  .feedback{min-height:74px;border-radius:18px;padding:12px 15px;font-size:17px;line-height:1.45;font-weight:850;margin-top:12px;background:#f3f7fb;color:var(--sub);border:2px solid #e0e8f1;display:flex;align-items:center}
  .feedback.ok{background:var(--green2);border-color:#afe5d1;color:#126b4b}
  .feedback.ng{background:var(--orange2);border-color:#ffd99a;color:#8c5a00}
  .actions{height:70px;display:flex;align-items:center;gap:12px;padding-top:10px;flex:none}
  .btn{border:none;border-radius:16px;padding:13px 20px;font-weight:1000;font-size:18px;min-height:52px;box-shadow:0 5px 0 rgba(30,48,75,.12);transition:transform .08s ease,filter .12s ease}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(30,48,75,.12)}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.secondary{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .btn.voice{background:var(--violet2);color:#6241b0;border:2px solid #d7c9ff}
  .btn.next{margin-left:auto;background:var(--green);color:#fff;min-width:150px}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  .kbd{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:7px;background:#edf2f7;border:1px solid #cad6e3;box-shadow:0 2px 0 #b9c5d3;font-size:13px;margin:0 3px;color:#52647d;font-weight:900}
  .hintBubble{position:absolute;right:22px;bottom:18px;max-width:310px;background:#fff6d9;border:2px solid #f4d47a;border-radius:18px 18px 4px 18px;padding:12px 15px;font-size:16px;font-weight:850;color:#74520a;box-shadow:0 8px 22px rgba(108,78,14,.10)}
  .hidden{display:none!important}
  .recognizing{animation:pulse 1s infinite}
  .voiceHeard{font-size:18px;font-weight:900;color:#6241b0;background:var(--violet2);border-radius:14px;padding:10px 13px;width:100%;margin-bottom:8px}

  .selectionBoard,.definitionBoard{width:100%;height:100%;max-height:440px;overflow:visible}
  .gridPaper{fill:url(#gridPattern)}
  .candidateMain{fill:#fff;stroke:#5f6770;stroke-width:4.5;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .16s ease,stroke .16s ease,stroke-width .16s ease,filter .16s ease}
  .shapeChoiceSvg,.defChoiceSvg{cursor:pointer;outline:none}
  .shapeChoiceSvg:hover .candidateMain,.defChoiceSvg:hover .candidateMain{stroke:#2f7df4;stroke-width:6}
  .shapeChoiceSvg.selected .candidateMain,.defChoiceSvg.selected .candidateMain{stroke:#2f7df4;stroke-width:7;filter:drop-shadow(0 3px 3px rgba(47,125,244,.24))}
  .selectionBoard.target-square .shapeChoiceSvg.correct .candidateMain{fill:#fff300;stroke:#555}
  .selectionBoard.target-rect .shapeChoiceSvg.correct .candidateMain{fill:#f000f0;stroke:#555}
  .selectionBoard.target-righttri .shapeChoiceSvg.correct .candidateMain{fill:#0bdce6;stroke:#555}
  .shapeChoiceSvg.wrong .candidateMain,.defChoiceSvg.wrong .candidateMain{stroke:#e44747;stroke-width:7;filter:drop-shadow(0 3px 3px rgba(228,71,71,.18))}
  .defChoiceSvg.correct .candidateMain{fill:#dcf7ec;stroke:#18a06b;stroke-width:6}
  .shapeHit{fill:transparent;stroke:none;pointer-events:all}
  .shapeLabel{font-size:19px;font-weight:1000;fill:#40536b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .selectInfo{font-size:18px;font-weight:900;color:var(--sub);margin-bottom:10px}
  .definitionBox{margin-top:10px;border:3px solid #72b993;background:#edfdf5;border-radius:16px;padding:10px 13px;font-size:17px;font-weight:1000;color:#126b4b;line-height:1.45}
  .reasonList{display:grid;gap:7px;margin-top:8px}
  .reasonChip{background:#fff7dc;border:2px solid #f0d27d;border-radius:12px;padding:7px 9px;font-size:14px;font-weight:900;line-height:1.35;color:#72540e}
  .sideTour{stroke:#ef2b20;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.16}
  .vertexTour{fill:#ef2b20;stroke:#fff;stroke-width:3;opacity:.16}
  .sideTour,.vertexTour{opacity:0;animation:none}.tourActive{opacity:1;animation:tourReveal .8s ease-out both}@keyframes tourReveal{from{opacity:0}to{opacity:1}}

  .numberBox{display:flex;gap:14px;align-items:center;justify-content:center;margin:auto}
  .numInput{width:180px;height:80px;border:4px solid #adcaf0;border-radius:18px;background:#fff;font-size:42px;font-weight:1000;text-align:center;color:var(--ink);outline:none}
  .numInput:focus{border-color:var(--blue);box-shadow:0 0 0 5px rgba(47,125,244,.12)}
  .unit{font-size:28px;font-weight:1000}
  .keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
  .keypad button{height:48px;border:2px solid #d7e2ed;background:#fff;border-radius:13px;font-weight:1000;font-size:20px}

  .summary{align-items:center;justify-content:center;text-align:center}
  .summary h1{font-size:44px;margin:0 0 12px}
  .scoreRing{width:190px;height:190px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--score)*1%),#dfebf4 0);display:grid;place-items:center;margin:18px auto;position:relative}
  .scoreRing::before{content:"";width:150px;height:150px;background:#fff;border-radius:50%;position:absolute}
  .scoreText{position:relative;font-size:42px;font-weight:1000}
  .summaryMsg{font-size:22px;font-weight:850;color:var(--sub);margin-bottom:18px}
  .summaryButtons{display:flex;gap:14px;justify-content:center}

  .miniLegend{position:absolute;left:18px;bottom:15px;font-size:13px;color:#6b7d95;font-weight:800;background:rgba(255,255,255,.78);padding:7px 10px;border-radius:10px}
  .rightAngleMark{fill:none;stroke:#ef4444;stroke-width:7;stroke-linecap:butt;stroke-linejoin:miter}
  .edge{stroke:#3f4d60;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .edgeThin{stroke:#52647a;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .accentEdge{stroke:#2f7df4;stroke-width:10;fill:none;stroke-linecap:round}
  .vertexDot{fill:#e44747;stroke:#fff;stroke-width:3}
  .dimText{font-size:26px;font-weight:900;fill:#20314a}
  .perimeterGlow{stroke:#e44747;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000}
  .answerShown .perimeterGlow{animation:draw 1.2s ease forwards}
  .sideTick{stroke:#2f7df4;stroke-width:5;stroke-linecap:round}
  .oppositeA{stroke:#2f7df4;stroke-width:9}
  .oppositeB{stroke:#f59e0b;stroke-width:9}
  .cornerPulse{animation:corner 1.4s ease-in-out infinite}
  @keyframes pop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18);transform:scale(1.03)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes corner{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes tourPulse{0%,12%,100%{opacity:.16}4%,8%{opacity:1;filter:drop-shadow(0 0 5px rgba(239,43,32,.28))}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="viewport"><div id="stageFrame"><main id="stage" aria-live="polite">
  <section id="home" class="screen home active">
    <div class="heroKicker">かたちの なまえだけでなく</div>
    <h1 class="heroTitle">いみも こたえよう</h1>
    <div class="heroSub">長方形・正方形・直角三角形の ふくしゅう</div>
    <div class="shapeHero" id="shapeHero" aria-hidden="true"></div>
    <div class="modeGrid">
      <button class="modeCard" data-mode="teacher">
        <span class="pill">先生向け</span><div class="num">MODE 1</div><h2>せんせいと いっしょ</h2>
        <p>もんだい → みんなで答える → こたえを表示。元のスライドに近い進め方。</p>
      </button>
      <button class="modeCard" data-mode="quick">
        <span class="pill">3〜5分</span><div class="num">MODE 2</div><h2>10もん チャレンジ</h2>
        <p>選ぶ・数字を入れる・声で答える。毎回少し問題が変わる短時間復習。</p>
      </button>
      <button class="modeCard" data-mode="all">
        <span class="pill">しっかり</span><div class="num">MODE 3</div><h2>ぜんぶ ふくしゅう</h2>
        <p>定義から見分け、まわりの長さまで一通り確認。</p>
      </button>
    </div>
    <div class="miniLegend"><span class="kbd">Esc</span> いつでも さいしょにもどる</div>
  </section>

  <section id="lesson" class="screen">
    <div class="topbar">
      <div class="brand">形のなまえと いみ</div><div id="modeTag" class="modeTag"></div>
      <div class="progressWrap"><div id="progressText" class="progressText"></div><div class="progressTrack"><div id="progressBar" class="progressBar"></div></div></div>
    </div>
    <div id="content">
      <article id="questionCard" class="card questionCard">
        <div class="qLabel" id="qLabel">もんだい</div>
        <h2 id="qText" class="qText"></h2>
        <div id="visual" class="visual"></div>
      </article>
      <aside id="sideCard" class="card sideCard"></aside>
    </div>
    <div id="actions" class="actions"></div>
  </section>

  <section id="summary" class="screen summary">
    <h1 id="summaryTitle">おわり！</h1>
    <div id="scoreRing" class="scoreRing" style="--score:0"><div id="scoreText" class="scoreText"></div></div>
    <div id="summaryMsg" class="summaryMsg"></div>
    <div class="summaryButtons"><button class="btn secondary" id="homeBtn">さいしょへ</button><button class="btn primary" id="retryBtn">もういちど</button></div>
  </section>
</main></div></div>
<script>
window.addEventListener('error',function(e){
  try{
    var box=document.getElementById('runtimeError');
    if(!box){
      box=document.createElement('div'); box.id='runtimeError';
      box.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#fff4e5;border:2px solid #f59e0b;border-radius:12px;padding:10px 14px;font:700 14px sans-serif;color:#6b4600';
      document.body.appendChild(box);
    }
    box.textContent='読み込み中にエラーが起きました。Chromeで開き直してください。 '+(e.message||'');
  }catch(_){}
});
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const stage=$('#stage'), stageFrame=$('#stageFrame'), viewport=$('#viewport'), home=$('#home'), lesson=$('#lesson'), summary=$('#summary');
  const qText=$('#qText'), visual=$('#visual'), sideCard=$('#sideCard'), actions=$('#actions');
  const modeTag=$('#modeTag'), progressText=$('#progressText'), progressBar=$('#progressBar'), questionCard=$('#questionCard');
  const W=1280,H=720;
  function fit(){
    // 16:9 の設計画面を、端末の表示領域に「contain」で最大表示する。
    // スマホ縦持ちでは横幅いっぱいの16:9、横持ちでは高さ（または幅）いっぱいになる。
    const vv=window.visualViewport;
    const rect=viewport.getBoundingClientRect();
    const vw=Math.max(1, Math.min(rect.width || innerWidth || W, vv ? vv.width : (innerWidth||W)));
    const vh=Math.max(1, Math.min(rect.height || innerHeight || H, vv ? vv.height : (innerHeight||H)));
    const scale=Math.max(0.05, Math.min(vw/W, vh/H));
    const sw=Math.round(W*scale*100)/100;
    const sh=Math.round(H*scale*100)/100;
    stageFrame.style.width=sw+'px';
    stageFrame.style.height=sh+'px';
    stage.style.transform='scale('+scale+')';
  }
  addEventListener('resize',fit,{passive:true});
  if(window.visualViewport){
    visualViewport.addEventListener('resize',fit,{passive:true});
    visualViewport.addEventListener('scroll',fit,{passive:true});
  }
  addEventListener('orientationchange',()=>setTimeout(fit,120),{passive:true});
  requestAnimationFrame(fit);
  setTimeout(fit,150);
  setTimeout(fit,700);

  const norm = s => (s||'').toString().normalize('NFKC').toLowerCase().replace(/[\s、。,.!！?？・\-ー]/g,'').replace(/ちょう点/g,'頂点').replace(/ちょうてん/g,'頂点').replace(/三本|さんぼん/g,'3本').replace(/四本|よんほん|よんぼん/g,'4本');
  const esc = s => String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  function svgWrap(inner,w=520,h=300,view=`0 0 ${w} ${h}`){return `<svg viewBox="${view}" role="img" aria-label="図形">${inner}</svg>`}
  function rightMark(x,y,dir='ru',size=28,cls='rightAngleMark'){
    // 頂点そのものには重ねない。2本の辺に両端が触れ、辺と合わせると小さな正方形になる「カギ型」。
    const paths={
      ru:`M ${x} ${y-size} L ${x+size} ${y-size} L ${x+size} ${y}`,
      rd:`M ${x+size} ${y} L ${x+size} ${y+size} L ${x} ${y+size}`,
      ld:`M ${x-size} ${y} L ${x-size} ${y+size} L ${x} ${y+size}`,
      lu:`M ${x-size} ${y} L ${x-size} ${y-size} L ${x} ${y-size}`
    };
    return `<path class="${cls}" d="${paths[dir]||paths.ru}"/>`;
  }
  function triSvg(opts={}){
    const mark=opts.mark?rightMark(105,230,'ru',30):'';
    return svgWrap(`<polygon points="105,230 105,65 390,230" class="edge" fill="#eaf4ff"/>${mark}`,500,300);
  }
  function quadSvg(){return svgWrap(`<polygon points="105,70 370,55 420,225 80,235" class="edge" fill="#eef6ff"/>`,500,300)}
  function lineSvg(){return svgWrap(`<line x1="70" y1="92" x2="435" y2="92" class="edge"/><text x="252" y="62" text-anchor="middle" class="dimText">まっすぐ</text><path d="M70 215 C145 145 210 285 285 210 S390 150 435 210" class="edgeThin"/><text x="252" y="270" text-anchor="middle" style="font-size:22px;font-weight:900;fill:#7b8798">こういう線では ない</text>`,500,300)}
  function sideSvg(){
    // 元スライドと同じく、三角形と四角形の複数の辺を順に赤く示す。
    return svgWrap(`<g transform="translate(16 10)"><polygon points="45,225 170,55 275,225" class="edgeThin" fill="#ededed"/>
      <line x1="45" y1="225" x2="170" y2="55" class="sideTour tour1"/><line x1="170" y1="55" x2="275" y2="225" class="sideTour tour2"/><line x1="275" y1="225" x2="45" y2="225" class="sideTour tour3"/></g>
      <g transform="translate(295 6)"><polygon points="35,225 190,55 335,95 375,220" class="edgeThin" fill="#ededed"/>
      <line x1="35" y1="225" x2="190" y2="55" class="sideTour tour4"/><line x1="190" y1="55" x2="335" y2="95" class="sideTour tour5"/><line x1="335" y1="95" x2="375" y2="220" class="sideTour tour6"/><line x1="375" y1="220" x2="35" y2="225" class="sideTour tour7"/></g>`,720,300);
  }
  function vertexSvg(){

  ];

  function showScreen(el){[home,lesson,summary].forEach(x=>x.classList.remove('active'));el.classList.add('active')}
  function start(mode){
    state.mode=mode;state.lastMode=mode;state.index=0;state.score=0;state.attempted=0;state.answerShown=false;state.optionFocus=0;state.shapeSelected=new Set();state.currentDynamic=null;
    if(mode==='teacher') state.questions=[...Q];
    else if(mode==='quick'){
      const core=Q.filter(q=>q.kind==='mcq');
      const selected=shuffle(core).slice(0,7);
      const def=shuffle(Q.filter(q=>q.kind==='defselect')).slice(0,1);
      const nums=shuffle(Q.filter(q=>['perim-rect','perim-square'].includes(q.id))).slice(0,1);
      const shape=shuffle(Q.filter(q=>q.kind==='shapes')).slice(0,1);
      state.questions=shuffle([...selected,...def,...nums,...shape]).slice(0,10);
    } else state.questions=[...Q];
    showScreen(lesson);render();
  }

  function dynamicFor(q){
    if(q.kind!=='number') return null;
    if(state.mode==='teacher') return q.source;
    if(q.id==='perim-rect'){
      let w=2+Math.floor(Math.random()*7), h=2+Math.floor(Math.random()*5); if(w===h) w=Math.min(9,w+1); return {w,h};
    }
    return {s:2+Math.floor(Math.random()*7)};
  }
  function current(){return state.questions[state.index]}
  function render(){
    clearTimeout(tourTimer); state.touring=false;
    const q=current(); if(!q){finish();return}
    state.answerShown=false;state.optionFocus=0;state.shapeSelected=new Set();state.currentDynamic=dynamicFor(q);
    state.shapeOrder=q.kind==='shapes'?shapeSetBase.map((x,i)=>({...x,orig:i})):null;
    questionCard.classList.remove('answerShown');
    modeTag.textContent=state.mode==='teacher'?'せんせいと いっしょ':state.mode==='quick'?'10もん チャレンジ':'ぜんぶ ふくしゅう';
    progressText.textContent=`${state.index+1} / ${state.questions.length}`;progressBar.style.width=`${((state.index+1)/state.questions.length)*100}%`;
    qText.textContent=q.q;
    renderVisual(q,false);
    if(state.mode==='teacher') renderTeacher(q); else renderPractice(q);
    if(['side-name','vertex-name'].includes(q.id)) startTour();
  }
  let tourTimer;
  function startTour(){
    state.touring=true;
    const marks=[...visual.querySelectorAll('.sideTour,.vertexTour')];
    const buttons=[...sideCard.querySelectorAll('button'),...actions.querySelectorAll('button')].filter(b=>!b.disabled);
    buttons.forEach(b=>b.disabled=true);
    const feedback=$('#feedback');if(feedback)feedback.textContent='1つずつ 見てから こたえよう。';
    let i=0;
    function step(){
      if(i<marks.length){marks[i++].classList.add('tourActive');tourTimer=setTimeout(step,800);}
      else{state.touring=false;buttons.forEach(b=>b.disabled=false);if(feedback)feedback.textContent='えらんで こたえよう。';}
    }
    step();
  }
  function renderVisual(q,reveal){
    if(q.kind==='number'){
      const d=state.currentDynamic||q.source;
      visual.innerHTML=q.id==='perim-rect'?perimeterRectSvg(d.w,d.h,reveal):perimeterSquareSvg(d.s,reveal);
    } else if(q.kind==='shapes'){
      visual.innerHTML=state.mode==='teacher'?shapeGridTeacher(q.target,reveal):shapeGridSvgHTML(q.target,reveal);
    } else if(q.kind==='defselect'){
      visual.innerHTML=definitionGridSvg(q.target,reveal,state.mode!=='teacher');
    } else visual.innerHTML=q.visual;
  }

  function renderTeacher(q){
    sideCard.innerHTML=`<div class="teacherPrompt"><div class="listen">まず、みんなで こたえよう。</div><div id="teacherAnswer" class="hidden"></div><div id="teacherExplain" class="hidden"></div></div>`;
    actions.innerHTML=`<button class="btn secondary" id="prevBtn">← もどる</button><button class="btn primary" id="revealBtn">こたえを みる</button><button class="btn next" id="nextBtn" disabled>つぎへ →</button>`;
    $('#prevBtn').disabled=state.index===0;$('#prevBtn').onclick=prev;$('#revealBtn').onclick=revealTeacher;$('#nextBtn').onclick=next;
  }
  function answerText(q){
    if(q.kind==='number'){
      const d=state.currentDynamic||q.source;
      const ans=q.id==='perim-rect'?2*(d.w+d.h):4*d.s;
      const formula=q.id==='perim-rect'?`${d.w}＋${d.w}＋${d.h}＋${d.h}＝${ans}`:`${d.s}＋${d.s}＋${d.s}＋${d.s}＝${ans}`;
      return `${formula}<br>答え ${ans} cm`;
    }
    if(q.kind==='shapes') return `正しいものは 3つ。`;
    if(q.kind==='defselect') return `定義に合う形は 3つ。`;
    return q.answer;
  }
  function revealTeacher(){
    if(state.touring)return;
    const q=current();state.answerShown=true;questionCard.classList.add('answerShown');renderVisual(q,true);
    const a=$('#teacherAnswer'),e=$('#teacherExplain');a.className='bigAnswer';a.innerHTML=answerText(q);e.className='explain';e.textContent=q.explain;
    $('#revealBtn').disabled=true;$('#nextBtn').disabled=false;
  }

  function renderPractice(q){
    if(q.kind==='mcq') renderMcq(q); else if(q.kind==='number') renderNumber(q); else if(q.kind==='defselect') renderDefSelect(q); else renderShapes(q);
  }
  function voiceAvailable(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
  function renderMcq(q){
    const opts=shuffle(q.options);
    sideCard.innerHTML=`<div class="options" id="options">${opts.map((o,i)=>`<button class="option" data-key="${i+1}" data-value="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="heard"></div><div id="feedback" class="feedback">えらんで こたえよう。${(q.voice||q.voiceRequired)?' 声でも答えられます。':''}</div>`;
    const voiceBtn=(q.voice||q.voiceRequired)?`<button class="btn voice" id="voiceBtn" ${voiceAvailable()?'':'disabled'}>🎤 こえで こたえる</button>`:'';
    actions.innerHTML=`<button class="btn secondary" id="readBtn">🔊 もんだいを よむ</button>${voiceBtn}<button class="btn next" id="nextBtn" disabled>つぎへ →</button>`;
    [...document.querySelectorAll('.option')].forEach((b,i)=>{b.onclick=()=>checkMcq(q,b.dataset.value,b); if(i===0)b.classList.add('focused')});
    $('#readBtn').onclick=()=>speak(q.q); if($('#voiceBtn')) $('#voiceBtn').onclick=()=>recognize(q); $('#nextBtn').onclick=next;
  }
  function checkMcq(q,val,btn=null){
    if(state.answerShown || state.touring) return;
    const ok=norm(val)===norm(q.answer);state.attempted++;
    const fb=$('#feedback');
    if(ok){state.score++;state.answerShown=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(norm(b.dataset.value)===norm(q.answer))b.classList.add('correct')});fb.className='feedback ok';fb.textContent='せいかい！ '+q.explain;$('#nextBtn').disabled=false;}
    else {if(btn){btn.classList.add('wrong');btn.disabled=true}fb.className='feedback ng';fb.textContent='もういちど。ヒント：'+q.hint;}
  }
  function speak(text){
    if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.92;speechSynthesis.speak(u);
  }
  function recognize(q){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
    const rec=new SR();rec.lang='ja-JP';rec.interimResults=false;rec.maxAlternatives=3;const b=$('#voiceBtn');b.classList.add('recognizing');b.textContent='🎤 きいています…';
    rec.onresult=e=>{const heard=[...e.results[0]].map(a=>a.transcript);$('#heard').innerHTML=`<div class="voiceHeard">「${esc(heard[0])}」と きこえました</div>`;const ok=heard.some(t=>voiceMatch(q,t));if(ok)checkMcq(q,q.answer);else{$('#feedback').className='feedback ng';$('#feedback').textContent='もういちど。ヒント：'+q.hint;state.attempted++;}};
    rec.onerror=()=>{$('#feedback').className='feedback ng';$('#feedback').textContent='声をうまく聞き取れませんでした。選んで答えてもOKです。'};
    rec.onend=()=>{b.classList.remove('recognizing');b.textContent='🎤 こえで こたえる'};rec.start();
  }
  function voiceMatch(q,t){
    const n=norm(t);
    if(q.voice) return q.voice.some(a=>n.includes(norm(a)));
    if(q.voiceRequired) return q.voiceRequired.every(a=>n.includes(norm(a)) || (a==='かこ'&&/囲/.test(t)) || (a==='へん'&&/辺/.test(t)) || (a==='かど'&&/角/.test(t)));
    return false;
  }
  function renderNumber(q){
    const d=state.currentDynamic||q.source;
    const ans=q.id==='perim-rect'?2*(d.w+d.h):4*d.s;
    sideCard.innerHTML=`<div class="numberBox"><input id="numInput" class="numInput" inputmode="numeric" maxlength="3" aria-label="答え"/><span class="unit">cm</span></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-num="${n}">${n}</button>`).join('')}</div><div id="feedback" class="feedback">まわり ぜんぶの 長さを 考えよう。</div>`;
    actions.innerHTML=`<button class="btn secondary" id="readBtn">🔊 もんだいを よむ</button><button class="btn primary" id="checkBtn">こたえあわせ</button><button class="btn next" id="nextBtn" disabled>つぎへ →</button>`;
    const inp=$('#numInput');document.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{if(inp.value.length<3)inp.value+=b.dataset.num});$('#readBtn').onclick=()=>speak(q.q);$('#checkBtn').onclick=()=>checkNumber(q,ans);$('#nextBtn').onclick=next;setTimeout(()=>inp.focus(),0);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkNumber(q,ans)});
  }
  function checkNumber(q,ans){
    if(state.answerShown)return;state.attempted++;const val=Number($('#numInput').value);const fb=$('#feedback');
    if(val===ans){state.score++;state.answerShown=true;questionCard.classList.add('answerShown');renderVisual(q,true);fb.className='feedback ok';const d=state.currentDynamic;const formula=q.id==='perim-rect'?`${d.w}＋${d.w}＋${d.h}＋${d.h}＝${ans}`:`${d.s}＋${d.s}＋${d.s}＋${d.s}＝${ans}`;fb.textContent=`せいかい！ ${formula}。答え ${ans}cm。`;$('#checkBtn').disabled=true;$('#nextBtn').disabled=false;}
    else {fb.className='feedback ng';fb.textContent='もういちど。ヒント：'+q.hint;}
  }
  function renderDefSelect(q){
    const set=defSets[q.target];
    sideCard.innerHTML=`<div class="selectInfo">定義に合う形を 3つ えらぼう。</div><div id="selectedCount" class="feedback">いま 0 / 3 えらんでいます。</div><div id="feedback" class="feedback">${q.hint}</div>`;
    actions.innerHTML=`<button class="btn secondary" id="readBtn">🔊 もんだいを よむ</button><button class="btn primary" id="defCheck" disabled>定義で たしかめる</button><button class="btn next" id="nextBtn" disabled>つぎへ →</button>`;
    document.querySelectorAll('.defChoiceSvg').forEach((b,i)=>b.onclick=()=>toggleDef(i,b));
    $('#readBtn').onclick=()=>speak(q.q);$('#defCheck').onclick=()=>checkDef(q,set);$('#nextBtn').onclick=next;
  }
  function toggleDef(i,b){
    if(state.answerShown)return;
    if(state.shapeSelected.has(i)){state.shapeSelected.delete(i);b.classList.remove('selected')}else if(state.shapeSelected.size<3){state.shapeSelected.add(i);b.classList.add('selected')}
    $('#selectedCount').textContent=`いま ${state.shapeSelected.size} / 3 えらんでいます。`;$('#defCheck').disabled=state.shapeSelected.size!==3;
  }
  function checkDef(q,set){
    state.attempted++;let ok=true;
    set.shapes.forEach((sh,i)=>{const sel=state.shapeSelected.has(i);if(sel!==sh.ok)ok=false;const g=document.querySelector(`[data-def-idx="${i}"]`);if(sh.ok)g.classList.add('correct');if(sel&&!sh.ok)g.classList.add('wrong')});
    state.answerShown=true; if(ok)state.score++;
    const fb=$('#feedback');fb.className='feedback '+(ok?'ok':'ng');
    const reasons=set.shapes.map((sh,i)=>sh.ok?'':`<div class="reasonChip">${['ア','イ','ウ','エ','オ','カ'][i]}：${sh.reason}</div>`).filter(Boolean).join('');
    fb.innerHTML=`<div style="width:100%"><b>${ok?'せいかい！':'定義で たしかめよう。'}</b><div class="definitionBox">${set.definition}</div><div class="reasonList">${reasons}</div></div>`;
    $('#defCheck').disabled=true;$('#nextBtn').disabled=false;document.querySelectorAll('.defChoiceSvg').forEach(g=>g.style.pointerEvents='none');
  }

  function renderShapes(q){
    sideCard.innerHTML=`<div class="selectInfo">図を 3つ えらんだら、こたえあわせ。</div><div id="selectedCount" class="feedback">いま 0 / 3 えらんでいます。</div><div id="feedback" class="feedback">${q.hint}</div>`;
    actions.innerHTML=`<button class="btn primary" id="shapeCheck" disabled>こたえあわせ</button><button class="btn next" id="nextBtn" disabled>つぎへ →</button>`;
    document.querySelectorAll('.shapeChoiceSvg').forEach((b,i)=>b.onclick=()=>toggleShape(i,b));$('#shapeCheck').onclick=()=>checkShapes(q);$('#nextBtn').onclick=next;
  }
  function toggleShape(i,b){
    if(state.answerShown)return;if(state.shapeSelected.has(i)){state.shapeSelected.delete(i);b.classList.remove('selected')}else if(state.shapeSelected.size<3){state.shapeSelected.add(i);b.classList.add('selected')}
    $('#selectedCount').textContent=`いま ${state.shapeSelected.size} / 3 えらんでいます。`;$('#shapeCheck').disabled=state.shapeSelected.size!==3;
  }
  function checkShapes(q){
    state.attempted++;const arr=state.shapeOrder;let ok=true;for(let i=0;i<arr.length;i++){const should=arr[i].groups.includes(q.target);const sel=state.shapeSelected.has(i);if(should!==sel)ok=false;const b=document.querySelector(`[data-shape-idx="${i}"]`);if(should)b.classList.add('correct');if(sel&&!should)b.classList.add('wrong')}
    const fb=$('#feedback');if(ok){state.score++;state.answerShown=true;fb.className='feedback ok';fb.textContent='せいかい！ '+q.explain;document.querySelectorAll('.shapeChoiceSvg').forEach(b=>b.disabled=true);$('#shapeCheck').disabled=true;$('#nextBtn').disabled=false;}
    else {fb.className='feedback ng';fb.textContent='正しい形を緑で示しました。形の向きではなく、かどや辺を見よう。';state.answerShown=true;$('#shapeCheck').disabled=true;$('#nextBtn').disabled=false;}
  }

  function next(){if(state.index<state.questions.length-1){state.index++;render()}else finish()}
  function prev(){if(state.index>0){state.index--;render()}}
  function finish(){
    showScreen(summary);const total=state.questions.length;
    if(state.mode==='teacher'){$('#scoreRing').style.display='none';$('#summaryTitle').textContent='これで おわりです';$('#summaryMsg').textContent='形の名前だけでなく、「どんな形か」も言えたかな？';}
    else {$('#scoreRing').style.display='grid';const pct=Math.round((state.score/total)*100);$('#scoreRing').style.setProperty('--score',pct);$('#scoreText').textContent=`${state.score}/${total}`;$('#summaryTitle').textContent='ふくしゅう おわり！';$('#summaryMsg').textContent=pct>=90?'定義も見分けも、よくできています。':pct>=70?'あと少し。まちがえた定義をもう一度見ると定着します。':'「かど」と「へん」を見ながら、もう一度やってみよう。';}
  }
  function goHome(){clearTimeout(tourTimer);state.touring=false;if('speechSynthesis' in window)speechSynthesis.cancel();showScreen(home)}

  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('#homeBtn').onclick=goHome;$('#retryBtn').onclick=()=>start(state.lastMode||'quick');

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){goHome();return}
    if(!lesson.classList.contains('active'))return;
    const q=current();
    if(state.mode==='teacher'){
      if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();state.answerShown?next():revealTeacher()}
      if(e.key==='ArrowLeft'){e.preventDefault();prev()}
      return;
    }
    if(q.kind==='mcq'){
      const buttons=[...document.querySelectorAll('.option:not(:disabled)')];if(!buttons.length)return;
      if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();state.optionFocus=(state.optionFocus+1)%buttons.length;buttons.forEach(b=>b.classList.remove('focused'));buttons[state.optionFocus]?.classList.add('focused')}
      if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();state.optionFocus=(state.optionFocus-1+buttons.length)%buttons.length;buttons.forEach(b=>b.classList.remove('focused'));buttons[state.optionFocus]?.classList.add('focused')}
      if(e.key==='Enter'&&!state.answerShown){e.preventDefault();const b=buttons[state.optionFocus]||buttons[0];if(b)b.click()}
      if(e.key==='Enter'&&state.answerShown){e.preventDefault();next()}
    } else if(state.answerShown&&e.key==='Enter'){next()}
  });

  try{
    $('#shapeHero').innerHTML=`${squareSvg({marks:true,ticks:false,rotate:8})}${rectSvg({marks:true})}${rightTriSvg()}`
      .replace(/<svg/g,'<svg style="width:170px;height:120px"')
      .replace(/viewBox="0 0 520 330"/g,'viewBox="0 20 520 290"')
      .replace(/viewBox="0 0 520 315"/g,'viewBox="0 20 520 290"')
      .replace(/viewBox="0 0 520 310"/g,'viewBox="0 20 520 290"');
  }catch(err){ console.error(err); }
})();
</script>
</body>
</html>
