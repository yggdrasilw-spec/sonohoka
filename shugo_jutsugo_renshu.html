function load(){
  const[t,r,y]=Q[q];
  w=t.split("|");a=[...(lv?y:r)];g=w.map(()=>"0");lk=w.map(()=>false);
  if(lv){[...r].forEach((c,i)=>{if(lv==1?c!="2":c!="3"){g[i]=c;lk[i]=true}})}
  tries=done=0;
  $("#no").textContent=`セット${k+1}　レベル${lv+1}　${q+1} / ${Q.length}`;
  $("#next").hidden=true;$("#chk").hidden=$("#ans").hidden=false;
  say(MSG[lv]);draw();
}
function draw(r){
  const focus=S.contains(document.activeElement)?document.activeElement.dataset.i:null;
  S.className="t"+role(tool);
  S.innerHTML=w.map((x,i)=>{
    const v=g[i],lb=PT[v]||RL[v],tag=lk[i]?"span":"button";
    return `<${tag}${lk[i]?"":' type="button"'} class="ch${v!="0"?" c"+role(v):""}${lk[i]?" lk":""}${r&&!lk[i]?(v==a[i]?" ok":" ng"):""}" data-i="${i}">${x}${lb?`<small>${lb}</small>`:""}</${tag}>`;
  }).join("");
  fit();
  if(focus!=null)S.children[focus]?.focus();
}
// ドラッグ&ドロップ: ボタンから半透明の色枠が指について動き、ぶんせつへ はなすと つく(タップもできる)
const TOL=matchMedia("(pointer:coarse)").matches?28:12;
function hit(x,y){
  let bi=-1,bd=1e9;
  [...S.children].forEach((c,i)=>{
    if(lk[i])return;
    const r=c.getBoundingClientRect(),d=Math.hypot(Math.max(r.left-x,0,x-r.right),Math.max(r.top-y,0,y-r.bottom));
    if(d<=TOL&&d<bd){bd=d;bi=i}
  });
  return bi;
}
TL.onpointerdown=e=>{
  const b=e.target.closest(".tool");
  if(!b||q0||e.button>0)return;
  dt=b.dataset.t;q0={x:e.clientX,y:e.clientY,id:e.pointerId};dragging=0;
  try{b.setPointerCapture(e.pointerId)}catch(_){}
};
TL.onclick=e=>{const b=e.target.closest(".tool");if(b)setTool(b.dataset.t)};
TL.oncontextmenu=e=>e.preventDefault();
addEventListener("pointermove",e=>{
  if(q0?.id!==e.pointerId)return;
  const lp={x:e.clientX,y:e.clientY};
  if(!dragging){
    if(done||Math.hypot(lp.x-q0.x,lp.y-q0.y)<=8)return;
    dragging=1;setTool(dt);
    const fs=parseFloat(getComputedStyle(S).fontSize);
    G.className="t"+role(dt);G.textContent=PT[dt]||"";
    G.style.cssText=`display:flex;width:${fs*1.7}px;height:${fs*3.4}px;font-size:${fs*.42}px`;
    document.body.classList.add("dr");
  }
  G.style.left=lp.x+"px";G.style.top=lp.y+"px";
  const h=hit(lp.x,lp.y);
  [...S.children].forEach((c,i)=>c.classList.toggle("pv",i==h));
});
function up(e){
  if(q0?.id!==e.pointerId)return;
  const was=dragging;
  q0=null;dragging=0;G.style.display="none";document.body.classList.remove("dr");
  if(!was)return;
  const i=e.type==="pointerup"&&!done?hit(e.clientX,e.clientY):-1;
  if(i>=0)g[i]=dt;
  draw();
}
addEventListener("pointerup",up);addEventListener("pointercancel",up);
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault()},{passive:false});
S.onclick=e=>{const c=e.target.closest(".ch");if(!c||done)return;const i=+c.dataset.i;if(!lk[i]){g[i]=tool;draw()}};
let AC;function beep(f){try{AC=AC||new(window.AudioContext||webkitAudioContext)();const c=AC;if(c.state=="suspended")c.resume();const o=c.createOscillator(),v=c.createGain();o.frequency.value=f;o.connect(v);v.connect(c.destination);v.gain.setValueAtTime(.2,c.currentTime);v.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.start();o.stop(c.currentTime+.4)}catch(e){}}
function fin(){done=1;$("#chk").hidden=$("#ans").hidden=true;$("#next").hidden=false;$("#next").textContent=q==Q.length-1?"けっかをみる":"つぎへ";$("#next").focus()}
$("#chk").onclick=()=>{
  if(g.some((v,i)=>!lk[i]&&v=="0"))return say("まだ えらんでいない ぶんせつが あるよ。");
  tries++;const n=g.filter((v,i)=>!lk[i]&&v!=a[i]).length;draw(1);
  if(n){beep(300);say(`ちがう ところが ${n}こ あるよ。×の ところを なおして、もういちど！`)}
  else{
    if(tries==1)score++;
    say(["ぜんぶ せいかい！","ピッタリ！ すごい！","かんぺき！ その ちょうし！"][Math.random()*3|0]);beep(880);boom();
    const m=$("#maru");m.classList.remove("show");void m.offsetWidth;m.classList.add("show");fin();
  }
};
$("#ans").onclick=()=>{g=g.map((v,i)=>lk[i]?v:a[i]);draw(1);say("こたえは これだよ。よく みてから つぎへ すすもう。");fin()};
$("#menu .grid").innerHTML=`<span></span>`+LV.map((v,i)=>`<div class="lh"><b>${v[0]}</b><span class="st">${"★".repeat(i+1)}</span><small>${v[1]}</small></div>`).join("")+SETS.map((t,i)=>`<div class="sl"><b>${t[0]}</b><small>${t[1]}</small></div>`+LV.map((v,l)=>`<button class="set" data-k="${i}" data-l="${l}" aria-label="${t[0]} ${v[0]} ${questions(i,l).length}もん"><b>${questions(i,l).length}もん</b><i></i></button>`).join("")).join("");
function menu(){
  done=1;$("#menu").hidden=false;$("#home").hidden=true;$("#no").textContent="";
  TL.inert=$("#right").inert=true;
  document.querySelectorAll(".set").forEach(b=>{const i=+b.dataset.k,l=+b.dataset.l,total=questions(i,l).length,record=best[i*LV.length+l];b.querySelector("i").textContent=record==null?"":`${record===total?"👑":"★"} ${record} / ${total}`;b.classList.toggle("gold",record===total)});
}
function start(i,l){k=i;lv=l;Q=questions(i,l);q=0;score=0;pal(l);$("#menu").hidden=true;$("#home").hidden=false;TL.inert=$("#right").inert=false;load()}
$("#menu").onclick=e=>{const b=e.target.closest(".set");if(b)start(+b.dataset.k,+b.dataset.l)};
$("#home").onclick=menu;
$("#go").onclick=()=>{beep(660);$("#cover").hidden=true;$("#menu").inert=false;document.body.classList.remove("cv")};
$("#back").onclick=()=>{$("#cover").hidden=false;$("#menu").inert=true;document.body.classList.add("cv")};
function fit(){
  const stage=$("#stage").getBoundingClientRect();
  const parts=[...S.querySelectorAll(".ch")];
  S.style.maxHeight=Math.max(0,stage.height-24)+"px";
  for(let size=Math.min(44,Math.max(20,Math.floor(innerHeight*.06)));size>=13;size--){
    S.style.fontSize=size+"px";
    if(parts.every(part=>{
      const r=part.getBoundingClientRect();
      return r.top>=stage.top+6&&r.bottom<=stage.bottom-6&&r.left>=stage.left+6&&r.right<=stage.right-6;
    }))break;
  }
}
new ResizeObserver(()=>{if($("#menu").hidden&&S.querySelector(".ch"))fit()}).observe($("#stage"));
function boom(){const st=$("#stage");for(let i=0;i<26;i++){const e=document.createElement("i"),a=Math.random()*6.28,d=80+Math.random()*Math.min(innerWidth,innerHeight)*.4;e.className="cf";e.style.cssText=`--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-40}px;--rot:${Math.random()*720-360}deg;background:${["#e0393e","#1f6fd6","#2a9d55","#f0a500"][i%4]};animation-delay:${Math.random()*.15}s`;st.appendChild(e);setTimeout(()=>e.remove(),1500)}}
$("#next").onclick=()=>{
  if(q<Q.length-1){q++;load()}
  else if(q==Q.length)menu();
  else{q++;const j=k*LV.length+lv,ratio=score/Q.length,stars=Math.round(ratio*5);best[j]=Math.max(best[j]||0,score);S.className="";S.innerHTML=`<div class="end">セット${k+1} レベル${lv+1} おわり！<br><span class="stars">${"★".repeat(stars)}${"☆".repeat(5-stars)}</span><br>いっかいで せいかい：${score} / ${Q.length}<br><span class="cmt">${ratio===1?"パーフェクト！":ratio>=.7?"よく できました！":"もういちど ちょうせんしよう！"}</span></div>`;if(ratio>=.8)boom();$("#next").textContent="セットを えらぶ";say("")}
};
menu();
</script></body></html>
