<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>10倍・10で割るひみつ ～コインやお札で見る位取り～</title>
<style>
  :root{
    --blue:#2f6fb0;
    --blue-bg:#eaf3fc;
    --yellow:#e0b400;
    --yellow-bg:#fff8dc;
    --pink:#e7648a;
    --green:#2f8f5b;
    --ink:#2f3a3f;
    --paper:#fffefb;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:#f4f7f5;
    margin:0;
    padding:20px;
    color:var(--ink);
  }
  h1{
    font-size:22px;
    color:var(--green);
    margin:0 0 14px 4px;
  }
  h1 .q{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--green);
    color:#fff;
    font-size:16px;
    margin-right:8px;
  }
  .panel{
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    padding:16px 20px;
    margin-bottom:16px;
  }
  .config-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
  }
  .group-editor{
    display:flex;
    align-items:center;
    gap:6px;
    background:#f0f4f2;
    border-radius:10px;
    padding:6px 10px;
    border:1px solid #dde5e1;
  }
  .group-editor select, .group-editor input{
    font-size:14px;
    padding:4px 6px;
    border-radius:6px;
    border:1px solid #ccc;
  }
  .group-editor input[type=number]{width:52px;}
  .group-editor button{
    border:none;background:#e88;color:#fff;border-radius:6px;
    width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1;
  }
  .btn{
    border:none;
    border-radius:20px;
    padding:8px 18px;
    font-size:14px;
    cursor:pointer;
    font-weight:bold;
    color:#fff;
    transition:transform .1s;
  }
  .btn:active{transform:scale(0.95);}
  .btn.add{background:var(--blue);}
  .btn.build{background:var(--green);}
  .btn.next{background:var(--pink);}
  .btn.reset{background:#999;}
  .btn.auto{background:#c98b2e;}
  .btn:disabled{background:#ccc;cursor:not-allowed;}
  .btn.mode-btn{background:#cfd8d5;color:#4a5750;}
  .btn.mode-btn.active{background:var(--green);color:#fff;}
  #status{
    font-size:15px;
    min-height:22px;
    margin-top:4px;
    color:#555;
  }
  #equation{
    font-size:20px;
    font-weight:bold;
    color:var(--blue);
    margin-top:2px;
  }
  #stage{
    width:100%;
    overflow-x:auto;
    background:linear-gradient(180deg,#fbfdfc,#f2f6f4);
    border-radius:16px;
  }
  svg{display:block;}
  .set-label{
    font-size:13px;
    fill:#888;
    font-weight:bold;
  }
  .frame-blue{
    fill:none;
    stroke:var(--blue);
    stroke-width:2.5;
  }
  .frame-yellow{
    fill:none;
    stroke:var(--yellow);
    stroke-width:3;
  }
  .sparkle-star{
    pointer-events:none;
  }
  .flash-circle{
    fill:#fffbe0;
    pointer-events:none;
  }
  .coin-img{
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.28));
  }
  .exchange-text{
    font-size:34px;
    font-weight:900;
    fill:var(--pink);
    text-anchor:middle;
  }
  .result-label{
    font-size:14px;
    fill:#555;
    text-anchor:middle;
  }
  .arrow-line{
    stroke:#c0392b;
    stroke-width:3;
    fill:none;
    marker-end:url(#arrowhead);
  }
  table.pvt{
    border-collapse:collapse;
    font-size:20px;
    font-weight:bold;
    text-align:center;
  }
  table.pvt th, table.pvt td{
    width:56px;height:44px;
    border:2px solid #999;
  }
  table.pvt th{background:#eee;font-size:14px;}
  .pvt-svg{background:#fff;border-radius:12px;overflow:visible;}
  .pv-header-text{font-size:14px;font-weight:bold;fill:#555;text-anchor:middle;}
  .pv-row-label{font-size:13px;fill:#555;font-weight:bold;text-anchor:middle;}
  .pv-digit{font-size:22px;font-weight:900;fill:#333;text-anchor:middle;}
  .pv-digit-moving{fill:#c0392b;}
  .pv-digit-result{fill:#c0392b;}
  .pv-digit-result.pv-history{fill:#333;}
  .pv-arrow{stroke:#c0392b;stroke-width:2.5;fill:none;}
  .pv-arrow.pv-history{stroke:#333;}
  .footer-note{
    font-size:12px;color:#999;margin-top:10px;
  }

  /* ===== 数字カードモード ===== */
  .mode-group-label{font-size:13px;font-weight:800;color:#65706b;margin-right:2px;}
  .representation-row{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #e2e8e4;}
  .btn.repr-btn{background:#d8e0dd;color:#425049;}
  .btn.repr-btn.active{background:#2f8f5b;color:#fff;}
  .sub-config{width:100%;}
  .card-config-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .card-number-box{display:flex;align-items:center;gap:8px;background:#f0f4f2;border:1px solid #dde5e1;border-radius:10px;padding:7px 10px;}
  .card-number-box label{font-size:13px;font-weight:800;color:#53605a;}
  #cardNumberInput{width:min(360px,68vw);font-size:22px;font-weight:900;letter-spacing:.04em;padding:7px 10px;border:2px solid #aebbb5;border-radius:8px;text-align:center;background:#fff;}
  .view-toggle{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .btn.view-btn{background:#e8ecea;color:#44514b;}
  .btn.view-btn.active{background:#2f6fb0;color:#fff;}
  .card-help{font-size:12px;color:#68716c;line-height:1.55;margin-top:7px;}
  #cardStage{display:none;padding:14px;min-height:300px;overflow-x:auto;background:linear-gradient(180deg,#fbfdfc,#f2f6f4);border-radius:16px;}
  .card-stage-title{font-size:17px;font-weight:900;text-align:center;margin:2px 0 10px;color:#37433d;}
  .card-stage-explain{font-size:14px;line-height:1.7;text-align:center;margin:8px auto 0;max-width:900px;color:#58615d;}
  .card-equation-big{font-size:clamp(24px,4vw,38px);font-weight:900;text-align:center;margin:10px 0 4px;color:#2f6fb0;letter-spacing:.03em;}
  .card-svg{display:block;margin:0 auto;max-width:none;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .card-place-name{font-size:12px;font-weight:800;fill:#4f5954;text-anchor:middle;}
  .card-place-sub{font-size:10px;font-weight:700;fill:#707a75;text-anchor:middle;}
  .card-row-label-svg{font-size:13px;font-weight:900;fill:#555;text-anchor:middle;}
  .digit-card-rect{stroke-width:2;rx:8;ry:8;}
  .digit-card-text{font-size:28px;font-weight:900;text-anchor:middle;dominant-baseline:middle;fill:#222;}
  .digit-card-moving{filter:drop-shadow(0 4px 4px rgba(0,0,0,.18));}
  .digit-arrow{stroke:#c0392b;stroke-width:2.8;fill:none;marker-end:url(#cardArrow);}
  .decimal-divider{stroke:#b8c0bc;stroke-width:2;stroke-dasharray:4 5;}
  .decimal-dot{fill:#c0392b;stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 1px rgba(0,0,0,.16));}
  .decimal-row-dot{fill:#c0392b;stroke:#fff;stroke-width:1.4;filter:drop-shadow(0 1px 1px rgba(0,0,0,.14));}
  .point-track{stroke:#b9c0bc;stroke-width:3;stroke-linecap:round;}
  .point-label{font-size:13px;font-weight:800;fill:#68716c;text-anchor:middle;}
  .point-tape{display:flex;justify-content:flex-start;align-items:flex-end;gap:0;margin:14px auto 8px;width:max-content;min-width:max-content;padding:18px 28px 34px;position:relative;}
  .point-slot{width:58px;height:70px;position:relative;display:flex;align-items:center;justify-content:center;}
  .point-digit-card{width:48px;height:56px;border:2px solid #6f767d;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.08);transition:opacity .35s,transform .35s;}
  .point-digit-card.ghost{opacity:.2;border-style:dashed;}
  .point-marker{position:absolute;width:11px;height:11px;border-radius:50%;background:#c0392b;transform:translate(-50%,-50%);transition:left .85s cubic-bezier(.25,.75,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.18);z-index:5;pointer-events:none;}
  .point-marker::after{content:'小数点';position:absolute;white-space:nowrap;font-size:11px;font-weight:800;color:#c0392b;top:13px;left:50%;transform:translateX(-50%);}
  .point-boundary{position:absolute;bottom:9px;width:2px;height:12px;background:#c7ceca;transform:translateX(-50%);}
  .point-result{font-size:18px;font-weight:900;text-align:center;min-height:30px;color:#2f6fb0;margin-top:4px;}
  .mini-pvt-wrap{margin:18px auto 0;max-width:100%;overflow-x:auto;}
  .mini-pvt-caption{text-align:center;font-size:13px;font-weight:800;color:#5d6661;margin-bottom:6px;}

  /* ===== 常時表示のステップ操作 ===== */
  body{padding-bottom:96px;}
  .floating-step-controls{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:12000;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    border:1px solid rgba(88,104,96,.18);
    border-radius:22px;
    background:rgba(255,255,255,.94);
    box-shadow:0 5px 18px rgba(0,0,0,.16);
    backdrop-filter:blur(6px);
  }
  .floating-step-controls .btn{
    min-width:112px;
    min-height:44px;
    padding:9px 16px;
    font-size:15px;
    box-shadow:0 2px 5px rgba(0,0,0,.10);
  }
  .btn.back{background:#66736d;}
  .step-key-hint{
    font-size:11px;
    font-weight:800;
    color:#7a8580;
    white-space:nowrap;
    padding:0 4px;
  }
  @media(max-width:700px){
    #cardNumberInput{font-size:19px;}
    .point-slot{width:50px;height:64px;}
    .point-digit-card{width:42px;height:50px;font-size:26px;}
    .floating-step-controls{right:8px;bottom:8px;padding:6px;gap:6px;}
    .floating-step-controls .btn{min-width:88px;min-height:42px;padding:8px 12px;font-size:13px;}
    .step-key-hint{display:none;}
  }

</style>
</head>
<body>

<h1 id="mainTitle"><span class="q">?</span>数を10倍すると、もとの数からどのようにかわるか考えよう。</h1>

<div class="panel">
  <div class="config-row representation-row">
    <span class="mode-group-label">見せ方</span>
    <button class="btn repr-btn active" id="reprMoneyBtn">お金</button>
    <button class="btn repr-btn" id="reprCardsBtn">数字カード</button>
  </div>
  <div class="config-row" style="margin-bottom:12px;">
    <span class="mode-group-label">変化</span>
    <button class="btn mode-btn active" id="modeMulBtn">×10（10倍）</button>
    <button class="btn mode-btn" id="modeDivBtn">÷10（1/10にする）</button>
  </div>

  <div id="moneyConfig" class="sub-config">
    <div class="config-row" id="groupList"></div>
    <div class="config-row" style="margin-top:10px;">
      <button class="btn add" id="addGroupBtn">＋ コインやお札の種類を追加</button>
      <button class="btn build" id="buildBtn">この組み合わせでつくる</button>
    </div>
  </div>

  <div id="cardConfig" class="sub-config" style="display:none;">
    <div class="card-config-row">
      <div class="card-number-box">
        <label for="cardNumberInput">もとの数</label>
        <input id="cardNumberInput" type="text" inputmode="decimal" value="345.6" maxlength="24" aria-label="もとの数">
      </div>
      <div class="view-toggle">
        <span class="mode-group-label">アニメーション</span>
        <button class="btn view-btn active" id="viewDigitsBtn">位が動く</button>
        <button class="btn view-btn" id="viewPointBtn">小数点が動く</button>
      </div>
      <button class="btn build" id="cardBuildBtn">この数でつくる</button>
    </div>
    <div class="card-help">整数だけでなく小数も入力できます。位取り表には小数点と「十分の一・百分の一・千分の一…」の位も表示します。</div>
  </div>
</div>

<div class="panel">
  <div class="config-row">
    <button class="btn auto" id="autoBtn">▶▶ オート再生</button>
    <button class="btn reset" id="resetBtn">さいしょから</button>
  </div>
  <div id="equation"></div>
  <div id="status">「この組み合わせでつくる」を押すと、アニメーションが始まります。</div>
</div>

<div class="panel">
  <div id="stage">
    <svg id="svgRoot" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
        </marker>
      </defs>
      <g id="layer-sets"></g>
      <g id="layer-frames"></g>
      <g id="layer-effects"></g>
      <g id="layer-results"></g>
    </svg>
  </div>
  <div id="cardStage"></div>
  <div class="footer-note" id="footerNote">位取り表は最後のステップで表示されます。</div>
  <div id="pvtWrap" style="margin-top:14px;"></div>
</div>

<div class="floating-step-controls" id="floatingStepControls" aria-label="アニメーションの操作">
  <button class="btn back" id="backBtn" disabled aria-label="1つ前にもどる">◀ もどる</button>
  <span class="step-key-hint">← / → キー</span>
  <button class="btn next" id="nextBtn" aria-label="1つ先へ進む">つぎへ ▶</button>
</div>

<script>
/* ============================================================
   設定：コインの種類・枚数・倍率は自由に変更できます
   ============================================================ */
let CONFIG = {
  representation: 'money', // 'money' = お金, 'cards' = 数字カード
  cardNumber: '345.6',
  cardView: 'digits',       // 'digits' = 位が動く, 'point' = 小数点が動く
  mode: 'multiply',   // 'multiply' = ×10のパターン, 'divide' = ÷10のパターン
  groups: [
    { value: 10, count: 2 },
    { value: 5,  count: 1 }
  ],
  multiplier: 10
};

const COIN_VALUES = [1,5,10,50,100,500,1000,5000,10000];

/* モードごとに選べる金種を制限する
   ×10パターン：10倍すると存在しない金額（5000円→5万円、10000円→10万円）は選べない
   ÷10パターン：10で割ると存在しない金額（1円→0.1円、5円→0.5円）は選べない */
function allowedValues(mode){
  return mode === 'divide'
    ? COIN_VALUES.filter(v => v % 10 === 0)
    : COIN_VALUES.filter(v => v * 10 <= 10000);
}
const R = 22;              // 硬貨の半径
const STACK_OVERLAP = 15;  // 同じ種類の硬貨を重ねる量
const GROUP_GAP = 44;      // 種類ごとのすき間（黄色枠が重ならないよう広め）
const SET_GAP = 95;        // セット間の横のすき間
const X0 = 140;            // 最初のセットのX座標
const Y0 = 130;            // 最初のセットのY座標（フレーム上端）

function coinImagePath(v){
  const webpSet = new Set([1000,5000,10000]);   // 紙幣はwebp、それ以外はpng
  return `img/${v}yen.${webpSet.has(v) ? 'webp' : 'png'}`;
}

function coinImageBox(v){
  if(v >= 1000){
    // 紙幣は横長の長方形として表示
    return { w: R*3.4, h: R*1.7 };
  }
  return { w: R*2, h: R*2 };   // 硬貨は正方形の枠に収める
}

function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function drawCoin(parent, cx, cy, value, id){
  const g = svgEl('g', {class:'coin', 'data-id':id, transform:`translate(${cx},${cy})`});
  const box = coinImageBox(value);
  const path = coinImagePath(value);
  const img = svgEl('image', {
    class:'coin-img',
    x: -box.w/2, y: -box.h/2, width: box.w, height: box.h,
    href: path,
    preserveAspectRatio: 'xMidYMid meet'
  });
  img.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', path); // 古いブラウザ向け
  g.appendChild(img);
  parent.appendChild(g);
  return g;
}



/* ------------------------------------------------------------
   レイアウト計算：1セット分の高さや各コインのy位置
   ------------------------------------------------------------ */
function computeSetLayout(){
  let y = Y0 + 14 + R;
  const groupsY = [];
  let maxHalfWidth = R; // コインだけなら硬貨の半径がそのまま基準
  CONFIG.groups.forEach((g, gi) => {
    const box = coinImageBox(g.value);
    maxHalfWidth = Math.max(maxHalfWidth, box.w/2); // 紙幣が含まれる場合は横幅の半分で上書き
    const coinYs = [];
    for(let k=0;k<g.count;k++){
      coinYs.push(y + k*STACK_OVERLAP);
    }
    groupsY.push(coinYs);
    const blockHeight = R*2 + (g.count-1)*STACK_OVERLAP;
    y = y + blockHeight - R + GROUP_GAP;
  });
  const contentBottom = y - GROUP_GAP + R + 14;
  const framePad = 10;
  return { groupsY, frameTop: Y0, frameBottom: contentBottom, frameLeft: -(maxHalfWidth+framePad), frameRight: maxHalfWidth+framePad };
}

let layout = null;
let setsShown = 0;
let stepIndex = 0;
let steps = [];
let autoTimer = null;
let stepSnapshots = [];
let isStepRunning = false;

const layerSets = document.getElementById('layer-sets');
const layerFrames = document.getElementById('layer-frames');
const layerEffects = document.getElementById('layer-effects');
const layerResults = document.getElementById('layer-results');
const svgRoot = document.getElementById('svgRoot');
const statusEl = document.getElementById('status');
const equationEl = document.getElementById('equation');
const nextBtn = document.getElementById('nextBtn');
const backBtn = document.getElementById('backBtn');
const autoBtn = document.getElementById('autoBtn');

function originalTotal(){
  return CONFIG.groups.reduce((s,g)=> s + g.value*g.count, 0);
}
function newTotal(){
  return originalTotal() * CONFIG.multiplier;
}

function setStatus(msg){ statusEl.textContent = msg; }
function setEquation(msg){ equationEl.textContent = msg; }

/* ------------------------------------------------------------
   効果音（Web Audio APIで簡単な音を合成）
   ------------------------------------------------------------ */
let audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){ /* オーディオが使えない環境では無音のまま進める */ }
  return audioCtx;
}
function playTone(freq, dur, opts={}){
  const ctx = ensureAudio();
  if(!ctx) return;
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = opts.type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if(opts.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(opts.freqEnd,1), t0+dur);
  const peak = opts.gain ?? 0.16;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peak, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+dur+0.03);
}
function playSlideSound(){ playTone(520, 0.16, {type:'sine', freqEnd:760, gain:0.11}); }
function playZeroAppearSound(){
  playTone(660, 0.12, {type:'square', gain:0.14});
  setTimeout(()=>playTone(990, 0.18, {type:'sine', gain:0.15}), 90);
}
function playZeroVanishSound(){ playTone(480, 0.24, {type:'sine', freqEnd:110, gain:0.13}); }
function playFinishChime(){
  playTone(523.25, 0.15, {gain:0.13});
  setTimeout(()=>playTone(659.25, 0.15, {gain:0.13}), 120);
  setTimeout(()=>playTone(783.99, 0.25, {gain:0.15}), 240);
}
function playSetAppearSound(){ playTone(720, 0.09, {type:'sine', freqEnd:900, gain:0.07}); }
function playFrameAppearSound(){ playTone(340, 0.2, {type:'triangle', freqEnd:460, gain:0.09}); }
function playExchangeSound(){
  playTone(523.25, 0.12, {gain:0.15});
  setTimeout(()=>playTone(659.25, 0.12, {gain:0.15}), 90);
  setTimeout(()=>playTone(880, 0.22, {gain:0.17}), 180);
}
function playConvergeWhoosh(){ playTone(280, 0.4, {type:'sawtooth', freqEnd:1000, gain:0.05}); }
function playDivergeWhoosh(){ playTone(1000, 0.4, {type:'sawtooth', freqEnd:280, gain:0.05}); }
function playSparkleChime(){
  playTone(1046.5, 0.16, {gain:0.13});
  setTimeout(()=>playTone(1318.5, 0.22, {gain:0.14}), 80);
}
function playSelectSound(){ playTone(700, 0.09, {type:'square', gain:0.09}); }
function playDiscardSound(){ playTone(420, 0.28, {type:'sine', freqEnd:140, gain:0.07}); }
function playClickSound(){ playTone(600, 0.06, {type:'sine', gain:0.06}); }

/* ------------------------------------------------------------
   1セット分（縦にコインを並べたもの＋青いわく）を描画
   ------------------------------------------------------------ */
function drawSet(index){
  const cx = X0 + index*SET_GAP;
  const g = svgEl('g', {class:'coin-set', id:'set-'+index, opacity:0});
  layerSets.appendChild(g);

  CONFIG.groups.forEach((grp, gi) => {
    layout.groupsY[gi].forEach((cy, k) => {
      drawCoin(g, cx, cy, grp.value, `s${index}-g${gi}-k${k}`);
    });
  });

  const label = svgEl('text', {class:'set-label', x:cx, y: Y0 - 14, 'text-anchor':'middle'});
  label.textContent = '×' + (index+1);
  g.appendChild(label);

  const frame = svgEl('rect', {
    class:'frame-blue',
    x: cx + layout.frameLeft, y: layout.frameTop,
    width: layout.frameRight - layout.frameLeft,
    height: layout.frameBottom - layout.frameTop,
    rx: 10
  });
  g.appendChild(frame);

  g.style.transition = 'opacity .5s ease';
  requestAnimationFrame(()=> requestAnimationFrame(()=> g.setAttribute('opacity',1)) );
  playSetAppearSound();
  return g;
}

/* ------------------------------------------------------------
   黄色い横長のわく（あるグループを10セット分まとめて囲む）
   ------------------------------------------------------------ */
function drawYellowFrame(gi){
  const ys = layout.groupsY[gi];
  const top = ys[0] - R - 6;
  const bottom = ys[ys.length-1] + R + 6;
  const left = X0 + layout.frameLeft - 4;
  const right = X0 + (setsShown-1)*SET_GAP + layout.frameRight + 4;
  const rect = svgEl('rect', {
    class:'frame-yellow', id:'yframe-'+gi,
    x:left, y:top, width:right-left, height:bottom-top, rx:14, opacity:0
  });
  layerFrames.appendChild(rect);
  rect.style.transition = 'opacity .5s ease';
  requestAnimationFrame(()=> requestAnimationFrame(()=> rect.setAttribute('opacity',1)) );
  playFrameAppearSound();
  return {rect, top, bottom, left, right};
}

/* ------------------------------------------------------------
   青いわく（各セットの枠）をフェードアウトして消す
   ------------------------------------------------------------ */
function removeBlueFrames(){
  document.querySelectorAll('.frame-blue').forEach(el => {
    if(!el.isConnected) return;
    el.style.transition = 'opacity .5s ease';
    el.style.opacity = 0;
    setTimeout(()=> el.remove(), 500);
  });
}

/* ------------------------------------------------------------
   キラリーン！ エフェクト（中心にフラッシュ＋星が飛び散る）
   ------------------------------------------------------------ */
function sparkleEffect(cx, cy){
  const g = svgEl('g', {class:'sparkle-burst'});
  layerEffects.appendChild(g);
  playSparkleChime();

  // 中心のフラッシュ
  const flash = svgEl('circle', {class:'flash-circle', cx, cy, r:2, opacity:0.9});
  g.appendChild(flash);
  flash.style.transition = 'r .45s ease-out, opacity .45s ease-out';
  requestAnimationFrame(()=> requestAnimationFrame(()=> {
    flash.setAttribute('r', 46);
    flash.setAttribute('opacity', 0);
  }));

  // 飛び散る星
  const colors = ['#fff59d','#ffffff','#ffd54f'];
  const starPath = 'M0,-9 L2.3,-2.3 L9,0 L2.3,2.3 L0,9 L-2.3,2.3 L-9,0 L-2.3,-2.3 Z';
  const starCount = 8;
  for(let i=0;i<starCount;i++){
    const angle = (Math.PI*2/starCount)*i - Math.PI/2;
    const dist = 44;
    const sx = cx + Math.cos(angle)*dist;
    const sy = cy + Math.sin(angle)*dist;
    const star = svgEl('path', {
      class:'sparkle-star', d:starPath, fill:colors[i%colors.length],
      transform:`translate(${cx},${cy}) scale(0)`, opacity:0
    });
    g.appendChild(star);
    const delay = i*0.03;
    star.style.transition = `transform .45s cubic-bezier(.34,1.56,.64,1) ${delay}s, opacity .3s ease ${delay}s`;
    requestAnimationFrame(()=> requestAnimationFrame(()=> {
      star.setAttribute('transform', `translate(${sx},${sy}) scale(1)`);
      star.setAttribute('opacity', 1);
    }));
    setTimeout(()=> {
      star.style.transition = 'opacity .35s ease';
      star.setAttribute('opacity', 0);
    }, 480+delay*1000);
  }
  setTimeout(()=> g.remove(), 950);
}

/* ------------------------------------------------------------
   あるグループの全コインを中心に集めて → 新しいコインに変身
   青いわくを消し、黄色いわくを正方形に縮めながら
   コインを中心に集め、キラリーン！で変身させる
   ------------------------------------------------------------ */
function convergeGroup(gi, frameInfo){
  return new Promise(resolve => {
    removeBlueFrames();

    const grp = CONFIG.groups[gi];
    const centerX = (frameInfo.left+frameInfo.right)/2;
    const centerY = (frameInfo.top+frameInfo.bottom)/2;
    const frameHeight = frameInfo.bottom - frameInfo.top;
    const squareSize = frameHeight;              // 縦横比が正方形ぐらいになる
    const newLeft = centerX - squareSize/2;

    // 黄色いわくを、横方向に中心へ縮めて正方形にする
    const rect = document.getElementById('yframe-'+gi) || frameInfo.rect;
    if(!rect){ resolve(); return; }
    rect.style.transition = 'x 1s ease, width 1s ease';
    rect.setAttribute('x', newLeft);
    rect.setAttribute('width', squareSize);

    // 同時に、コインを黄色いわくの中心座標へ集める（重ねるように）
    const coins = [];
    for(let s=0;s<setsShown;s++){
      layout.groupsY[gi].forEach((cy,k) => {
        const el = document.querySelector(`[data-id="s${s}-g${gi}-k${k}"]`);
        if(el) coins.push(el);
      });
    }
    coins.forEach(el => {
      el.style.transition = 'transform 1s ease-in, opacity 1s ease-in';
      el.setAttribute('transform', `translate(${centerX},${centerY}) scale(0.15)`);
      el.style.opacity = 0.15;
    });
    playConvergeWhoosh();

    setTimeout(() => {
      coins.forEach(el => el.remove());

      // キラリーン！
      sparkleEffect(centerX, centerY);

      setTimeout(() => {
        const newValue = grp.value * CONFIG.multiplier;
        const startY = centerY - ((grp.count-1)*STACK_OVERLAP)/2;
        const rg = svgEl('g', {class:'result-coins', opacity:0});
        layerResults.appendChild(rg);
        for(let k=0;k<grp.count;k++){
          drawCoin(rg, centerX, startY + k*STACK_OVERLAP, newValue, `res-${gi}-${k}`);
        }
        const lbl = svgEl('text', {class:'result-label', x:centerX, y: frameInfo.top - 12});
        lbl.textContent = `${grp.value}×10=${newValue}`;
        rg.appendChild(lbl);

        rg.style.transformBox = 'fill-box';
        rg.style.transformOrigin = 'center';
        rg.style.transform = 'scale(0.3)';
        rg.style.transition = 'opacity .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1)';
        requestAnimationFrame(()=> requestAnimationFrame(()=> {
          rg.setAttribute('opacity',1);
          rg.style.transform = 'scale(1)';
        }));
        resolve();
      }, 380);
    }, 1000);
  });
}

/* ------------------------------------------------------------
   ÷10パターン：中心の大きいお金 → キラリーン！ →
   1/10の金額を10セット、横に広げる（convergeGroupの逆再生）
   ------------------------------------------------------------ */
function divergeGroup(gi, centerInfo){
  return new Promise(resolve => {
    const grp = CONFIG.groups[gi];
    const { centerX, centerY, squareSize, left, right, top, bottom } = centerInfo;

    sparkleEffect(centerX, centerY);

    setTimeout(() => {
      const bigEl = document.getElementById('bigcoin-'+gi);
      if(bigEl) bigEl.remove();

      // 黄色いわく（正方形）を中心にフェードイン
      const rect = svgEl('rect', {
        class:'frame-yellow', id:'yframe-'+gi,
        x:centerX-squareSize/2, y:top, width:squareSize, height:bottom-top, rx:14, opacity:0
      });
      layerFrames.appendChild(rect);
      rect.style.transition = 'opacity .4s ease';
      requestAnimationFrame(()=> requestAnimationFrame(()=> rect.setAttribute('opacity',1)));

      // 1/10の金額の硬貨・お札を10セット分、いったん中心に重ねて生成
      const smallValue = grp.value / 10;
      const coinInfos = [];
      for(let s=0;s<10;s++){
        const cx = X0 + s*SET_GAP;
        layout.groupsY[gi].forEach((cy,k) => {
          const el = drawCoin(layerSets, centerX, centerY, smallValue, `s${s}-g${gi}-k${k}`);
          el.setAttribute('transform', `translate(${centerX},${centerY}) scale(0.15)`);
          el.style.opacity = 0.15;
          coinInfos.push({el, cx, cy});
        });
      }

      setTimeout(() => {
        // 黄色いわくを横に広げる
        rect.style.transition = 'x 1s ease, width 1s ease';
        rect.setAttribute('x', left);
        rect.setAttribute('width', right-left);

        // 硬貨・お札を10セットの位置へ広げる
        coinInfos.forEach(({el, cx, cy}) => {
          el.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
          el.setAttribute('transform', `translate(${cx},${cy}) scale(1)`);
          el.style.opacity = 1;
        });
        playDivergeWhoosh();

        setTimeout(resolve, 1050);
      }, 350);
    }, 500);
  });
}

/* ------------------------------------------------------------
   位取り表（アニメーション版・複数回の続けて10倍/10で割るに対応）
   もとの数字が、コピーされて斜めにスライドしながら
   1つ上（×10）または1つ下（÷10）の位へ移動する様子をみせる。
   「続けてさらに10倍／10で割る」を押すたびに、下に新しい行を追加していく。
   直前の変換（赤色）は、次の変換が始まると黒色（履歴）に変わる。
   ------------------------------------------------------------ */
const PVT_CELL_W = 56;
const PVT_CELL_H = 46;
const PVT_HEADER_H = 32;
const PVT_LABEL_W = 68;
const PVT_RIGHT_MARGIN = 60;                 // 一の位の「0」が欄外へ消えるための余白
const PVT_COL_NAMES  = ['一','十','百','千','万','十万','百万','千万'];
const PVT_COL_COLORS = ['#fbdfe8','#fff3bf','#dbeafe','#dcfce7','#f3e8ff','#ffe4d6','#e0f7f4','#ece4ff'];
const PVT_MAX_DIGITS = PVT_COL_NAMES.length; // これ以上は「続けて10倍」をグレーアウト

let pvt = null; // 現在の位取り表のアニメーション状態

function pvtDigitAt(num, place){
  return Math.floor(num / Math.pow(10,place)) % 10;
}
function pvtRowY(rowIndex){
  return PVT_HEADER_H + rowIndex*PVT_CELL_H + PVT_CELL_H/2;
}
function pvtUpdateSvgSize(){
  const totalW = PVT_LABEL_W + pvt.digitsNeeded*PVT_CELL_W + PVT_RIGHT_MARGIN;
  const totalH = PVT_HEADER_H + Math.max(pvt.rowCount,1)*PVT_CELL_H + 10;
  pvt.svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
  pvt.svg.setAttribute('width', totalW);
  pvt.svg.setAttribute('height', totalH);
}

/* 桁数が足りなくなったら、左側に新しい列を追加する。
   ラベル列（もと／×10 など）はそのままの位置に残し、
   それ以外の要素（ヘッダー・数字・矢印）だけを右にずらす。 */
function pvtEnsureColumns(requiredDigits){
  if(requiredDigits <= pvt.digitsNeeded){ pvtUpdateSvgSize(); return; }
  const delta = requiredDigits - pvt.digitsNeeded;

  pvt.svg.querySelectorAll('rect,text,line').forEach(el => {
    if(el.classList.contains('pv-label-elem')) return;
    ['x','x1','x2'].forEach(attr => {
      if(el.hasAttribute(attr)) el.setAttribute(attr, parseFloat(el.getAttribute(attr)) + delta*PVT_CELL_W);
    });
  });

  for(let newIndex=0; newIndex<delta; newIndex++){
    const place = requiredDigits - 1 - newIndex;
    const x = PVT_LABEL_W + newIndex*PVT_CELL_W;
    const color = PVT_COL_COLORS[place] || '#eee';
    pvt.svg.appendChild(svgEl('rect', {x, y:0, width:PVT_CELL_W, height:PVT_HEADER_H, fill:color, stroke:'#999', 'stroke-width':1.5}));
    const hText = svgEl('text', {x:x+PVT_CELL_W/2, y:PVT_HEADER_H/2+5, class:'pv-header-text'});
    hText.textContent = PVT_COL_NAMES[place] || (place+1)+'桁目';
    pvt.svg.appendChild(hText);
    for(let r=0; r<pvt.rowCount; r++){
      const cellY = pvtRowY(r) - PVT_CELL_H/2;
      const fill = r===0 ? color : '#fff';
      pvt.svg.appendChild(svgEl('rect', {x, y:cellY, width:PVT_CELL_W, height:PVT_CELL_H, fill, stroke:'#999', 'stroke-width':1.5}));
    }
  }
  pvt.digitsNeeded = requiredDigits;
  pvtUpdateSvgSize();
}

/* 新しい行（ラベル＋セルの枠）を一番下に追加する */
function pvtAddRow(labelText){
  const rowIndex = pvt.rowCount;
  const cellY = pvtRowY(rowIndex) - PVT_CELL_H/2;
  pvt.svg.appendChild(svgEl('rect', {x:0, y:cellY, width:PVT_LABEL_W, height:PVT_CELL_H, fill:'#f7f7f7', stroke:'#999', 'stroke-width':1.5, class:'pv-label-elem'}));
  const lt = svgEl('text', {x:PVT_LABEL_W/2, y:pvtRowY(rowIndex)+5, class:'pv-row-label pv-label-elem'});
  lt.textContent = labelText;
  pvt.svg.appendChild(lt);
  for(let i=0; i<pvt.digitsNeeded; i++){
    const place = pvt.digitsNeeded-1-i;
    const x = PVT_LABEL_W + i*PVT_CELL_W;
    const fill = rowIndex===0 ? (PVT_COL_COLORS[place]||'#fff') : '#fff';
    pvt.svg.appendChild(svgEl('rect', {x, y:cellY, width:PVT_CELL_W, height:PVT_CELL_H, fill, stroke:'#999', 'stroke-width':1.5}));
  }
  pvt.rowCount++;
  pvtUpdateSvgSize();
  return rowIndex;
}

/* もとの数字（一番上の行）を静止状態で配置する */
function pvtPlaceDigitsInRow(rowIndex, value){
  const rowY = pvtRowY(rowIndex);
  for(let place=0; place<pvt.digitsNeeded; place++){
    const blank = value < Math.pow(10,place) && !(place===0 && value===0);
    if(blank) continue;
    const i = pvt.digitsNeeded-1-place;
    const x = PVT_LABEL_W + i*PVT_CELL_W + PVT_CELL_W/2;
    const t = svgEl('text', {x, y: rowY+7, class:'pv-digit', 'data-row':rowIndex, 'data-place':place});
    t.textContent = pvtDigitAt(value, place);
    pvt.svg.appendChild(t);
  }
}

/* 直前の変換（赤色）を履歴（黒色）に変える */
function pvtRecolorHistory(){
  pvt.svg.querySelectorAll('.pv-digit-result:not(.pv-history), .pv-arrow:not(.pv-history)').forEach(el => {
    el.classList.add('pv-history');
    if(el.tagName === 'line') el.setAttribute('marker-end', 'url(#pvArrowheadBlack)');
  });
}

function updatePvtOpText(fromTotal, toTotal, mode){
  const textDiv = document.getElementById('pvtOpText');
  if(!textDiv) return;
  textDiv.innerHTML = mode==='divide'
    ? `<b>${fromTotal} ÷ 10 = ${toTotal}</b><br><span style="font-size:13px;color:#666;">それぞれの位の数が、1つずつ下の位にうつり、一の位の 0 がなくなります。</span>`
    : `<b>${fromTotal} × 10 = ${toTotal}</b><br><span style="font-size:13px;color:#666;">それぞれの位の数が、1つずつ上の位にうつり、一の位に 0 がつきます。</span>`;
}

function updatePvtContinueButtons(){
  const mulBtn = document.getElementById('pvtMulBtn');
  const divBtn = document.getElementById('pvtDivBtn');
  const total = pvt.lastTotal;
  if(mulBtn) mulBtn.disabled = !(String(total*10).length <= PVT_MAX_DIGITS);
  if(divBtn) divBtn.disabled = !(total % 10 === 0 && total/10 >= 1);
}

/* 「続けて」の操作が金額的にコイン・お札アニメで再現可能か判定する */
function coinAnimationFeasible(mode, groupValues){
  // 硬貨・紙幣の画像は10万円未満の金額しか用意されていないため、
  // 変換前・変換後のどちらの金額も10万円未満であることを確認する
  const IMAGE_LIMIT = 100000;
  if(!groupValues.every(v => v < IMAGE_LIMIT)) return false; // すでに10万円以上ならその時点で不可
  if(mode === 'divide'){
    return groupValues.every(v => v % 10 === 0 && v/10 >= 1);
  }
  return groupValues.every(v => v*10 < IMAGE_LIMIT); // 10倍して10万円以上になる場合も不可
}

/* 続けて10倍／10で割るときに、コイン・お札のアニメーションを
   もう一度最初から（現在の金額を新しい「もと」として）再生する */
async function runCoinContinueAnimation(mode, groupValues){
  const savedConfig = CONFIG;
  const savedLayout = layout;
  const savedSteps = steps;
  const savedStepIndex = stepIndex;

  CONFIG = {
    mode,
    groups: savedConfig.groups.map((g,i) => ({ value: groupValues[i], count: g.count })),
    multiplier: 10
  };
  layout = computeSetLayout();
  const totalWidth = X0 + (CONFIG.multiplier-1)*SET_GAP + layout.frameRight + 140;
  const totalHeight = Math.max(layout.frameBottom + 40, 480);
  svgRoot.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
  svgRoot.setAttribute('width', totalWidth);
  svgRoot.setAttribute('height', totalHeight);
  layerSets.innerHTML = ''; layerFrames.innerHTML = ''; layerEffects.innerHTML = ''; layerResults.innerHTML = '';
  setsShown = 0;

  buildSteps(true); // skipPvt：位取り表は別で管理しているので追加しない
  const localSteps = steps;
  setEquation(`${originalTotal()}`);
  for(const stepFn of localSteps){
    await stepFn();
    await new Promise(r => setTimeout(r, 820));
  }

  steps = savedSteps;
  stepIndex = savedStepIndex;
  CONFIG = savedConfig;
  layout = savedLayout;
}

/* 「続けてさらに10倍／10で割る」ボタンが押されたときの処理 */
async function pvtContinue(mode){
  if(!pvt || pvt.animating) return;
  pvt.animating = true;
  const fromRowIndex = pvt.rowCount - 1;
  const fromTotal = pvt.lastTotal;
  const toTotal = mode === 'multiply' ? fromTotal*10 : fromTotal/10;
  const mulBtn = document.getElementById('pvtMulBtn');
  const divBtn = document.getElementById('pvtDivBtn');
  if(mulBtn) mulBtn.disabled = true;
  if(divBtn) divBtn.disabled = true;

  const chk = document.getElementById('pvtCoinAnimChk');
  const wantsCoinAnim = chk && chk.checked;
  const feasible = coinAnimationFeasible(mode, pvt.groupValues);
  if(wantsCoinAnim && feasible){
    await runCoinContinueAnimation(mode, pvt.groupValues);
  } else if(wantsCoinAnim && !feasible){
    setStatus('（今回は金額の都合で、コイン・お札のアニメーションは省略します）');
  }

  pvtRunTransition(mode, fromTotal, toTotal, fromRowIndex, () => {
    pvt.lastTotal = toTotal;
    pvt.groupValues = pvt.groupValues.map(v => mode==='divide' ? v/10 : v*10);
    pvt.animating = false;
    updatePvtOpText(fromTotal, toTotal, mode);
    updatePvtContinueButtons();
    document.getElementById('pvtWrap').scrollIntoView({behavior:'smooth', block:'nearest'});
  });
}

/* 位取り表の初回表示（ステップ⑨／⑥から呼ばれる） */
function buildPlaceValueTable(mode){
  const orig = originalTotal();
  const neu = mode === 'divide' ? orig / 10 : orig * 10;

  const svg = svgEl('svg', {class:'pvt-svg'});
  const defs = svgEl('defs', {});
  const marker = svgEl('marker', {id:'pvArrowhead', markerWidth:8, markerHeight:8, refX:6, refY:3, orient:'auto'});
  marker.appendChild(svgEl('path', {d:'M0,0 L6,3 L0,6 Z', fill:'#c0392b'}));
  defs.appendChild(marker);
  const markerBlack = svgEl('marker', {id:'pvArrowheadBlack', markerWidth:8, markerHeight:8, refX:6, refY:3, orient:'auto'});
  markerBlack.appendChild(svgEl('path', {d:'M0,0 L6,3 L0,6 Z', fill:'#333'}));
  defs.appendChild(markerBlack);
  svg.appendChild(defs);

  pvt = { svg, digitsNeeded:0, rowCount:0, lastTotal:orig, animating:true, groupValues: CONFIG.groups.map(g=>g.value) };

  const wrap = document.getElementById('pvtWrap');
  wrap.innerHTML = '';
  wrap.appendChild(svg);

  pvtEnsureColumns(Math.max(String(Math.max(orig,neu)).length, 3));
  pvtAddRow('もと');
  pvtPlaceDigitsInRow(0, orig);

  const textDiv = document.createElement('div');
  textDiv.id = 'pvtOpText';

    pvt.animating = false;
    updatePvtOpText(orig, neu, mode);
    updatePvtContinueButtons();
  });
}

/* ------------------------------------------------------------
   位取り表：ある行(fromRowIndex)から次の行へ、数字が斜めに
   スライドするアニメーション本体。続けて10倍／10で割るでも共通利用。
   ------------------------------------------------------------ */
function pvtRunTransition(mode, fromTotal, toTotal, fromRowIndex, onDone){
  pvtRecolorHistory(); // 直前の変換を履歴色（黒）にする

  const neededDigits = Math.max(pvt.digitsNeeded, String(Math.max(fromTotal,toTotal)).length, 3);
  pvtEnsureColumns(neededDigits);
  const toRowIndex = pvtAddRow(mode === 'divide' ? '÷10' : '×10');

  const fromRowY = pvtRowY(fromRowIndex);
  const toRowY = pvtRowY(toRowIndex);

  const moves = [];
  if(mode === 'multiply'){
    for(let place=0; place<pvt.digitsNeeded; place++){
      const blank = fromTotal < Math.pow(10,place) && !(place===0 && fromTotal===0);
      if(blank) continue;
      moves.push({ fromPlace:place, toPlace:place+1, digit:pvtDigitAt(fromTotal,place) });
    }
  } else {
    for(let place=1; place<pvt.digitsNeeded; place++){
      if(fromTotal < Math.pow(10,place)) continue;
      moves.push({ fromPlace:place, toPlace:place-1, digit:pvtDigitAt(fromTotal,place) });
    }
  }
  moves.sort((a,b)=> b.fromPlace - a.fromPlace); // 高い位から順に、少しずつ間をあけて動かす

  const staggerStep = 160;
  let delay = 0;

  moves.forEach(mv => {
    const fromIndex = pvt.digitsNeeded-1-mv.fromPlace;
    const fromX = PVT_LABEL_W + fromIndex*PVT_CELL_W + PVT_CELL_W/2;
    const inRange = mv.toPlace>=0 && mv.toPlace<pvt.digitsNeeded;
    const toIndex = pvt.digitsNeeded-1-mv.toPlace;
    const toX = inRange ? (PVT_LABEL_W + toIndex*PVT_CELL_W + PVT_CELL_W/2) : fromX;

    setTimeout(() => {
      playSlideSound();

      const origEl = pvt.svg.querySelector(`text[data-row="${fromRowIndex}"][data-place="${mv.fromPlace}"]`);
      if(origEl){ origEl.style.transition = 'opacity .4s ease'; origEl.style.opacity = 0.25; }

      const moving = svgEl('text', {x: fromX, y: fromRowY+7, class:'pv-digit pv-digit-moving'});
      moving.textContent = mv.digit;
      pvt.svg.appendChild(moving);

      const arrow = svgEl('line', {
        x1: fromX, y1: fromRowY+16, x2: fromX, y2: fromRowY+16,
        class:'pv-arrow', 'marker-end':'url(#pvArrowhead)', opacity:0
      });
      pvt.svg.appendChild(arrow);

      requestAnimationFrame(()=> requestAnimationFrame(()=> {
        moving.style.transition = 'transform .7s cubic-bezier(.35,.05,.25,1)';
        moving.style.transform = `translate(${toX-fromX}px, ${toRowY-fromRowY}px)`;
        arrow.style.transition = 'opacity .3s ease, x2 .7s ease, y2 .7s ease';
        arrow.setAttribute('opacity', 0.85);
        arrow.setAttribute('x2', toX);
        arrow.setAttribute('y2', toRowY-16);
      }));

      setTimeout(()=>{
        const fixed = svgEl('text', {x: toX, y: toRowY+7, class:'pv-digit pv-digit-result', 'data-row':toRowIndex, 'data-place':mv.toPlace});
        fixed.textContent = mv.digit;
        pvt.svg.appendChild(fixed);
        moving.remove();
      }, 720);
    }, delay);
    delay += staggerStep;
  });

  const afterMoves = delay + 750;

  if(mode === 'multiply'){
    // 一の位に「0」が出現するアニメーション
    setTimeout(() => {
      const toIndex = pvt.digitsNeeded-1;
      const x = PVT_LABEL_W + toIndex*PVT_CELL_W + PVT_CELL_W/2;
      const zero = svgEl('text', {x, y: toRowY+7, class:'pv-digit pv-digit-result', 'data-row':toRowIndex, 'data-place':0});
      zero.textContent = '0';
      zero.style.opacity = 0;
      zero.style.transformBox = 'fill-box';
      zero.style.transformOrigin = 'center';
      zero.style.transform = 'scale(0.2)';
      pvt.svg.appendChild(zero);
      playZeroAppearSound();
      requestAnimationFrame(()=> requestAnimationFrame(()=> {
        zero.style.transition = 'transform .5s cubic-bezier(.34,1.56,.64,1), opacity .3s ease';
        zero.style.opacity = 1;
        zero.style.transform = 'scale(1.25)';
        setTimeout(()=>{ zero.style.transition = 'transform .2s ease'; zero.style.transform = 'scale(1)'; }, 260);
      }));
      setTimeout(playFinishChime, 500);
      setTimeout(()=> onDone && onDone(), 700);
    }, afterMoves);
  } else {
    // 一の位の「0」：もとの「0」はそのまま残し、コピーが右下（欄外）へスライドしたあと消える
    setTimeout(() => {
      const fromIndex0 = pvt.digitsNeeded-1; // place 0
      const fromX0 = PVT_LABEL_W + fromIndex0*PVT_CELL_W + PVT_CELL_W/2;
      const offIndex = pvt.digitsNeeded; // 表の外（右）へ
      const offX = PVT_LABEL_W + offIndex*PVT_CELL_W + PVT_CELL_W/2;

      playSlideSound();
      // もとの「0」自体は残すが、他の桁と同じ薄さに揃えて浮かないようにする
      const origZeroEl = pvt.svg.querySelector(`text[data-row="${fromRowIndex}"][data-place="0"]`);
      if(origZeroEl){ origZeroEl.style.transition = 'opacity .4s ease'; origZeroEl.style.opacity = 0.25; }

      const moving = svgEl('text', {x: fromX0, y: fromRowY+7, class:'pv-digit pv-digit-moving'});
      moving.textContent = '0';
      moving.style.transformBox = 'fill-box';
      moving.style.transformOrigin = 'center';
      pvt.svg.appendChild(moving);

      const arrow = svgEl('line', {
        x1: fromX0, y1: fromRowY+16, x2: fromX0, y2: fromRowY+16,
        class:'pv-arrow', 'marker-end':'url(#pvArrowhead)', opacity:0
      });
      pvt.svg.appendChild(arrow);

      requestAnimationFrame(()=> requestAnimationFrame(()=> {
        moving.style.transition = 'transform .7s cubic-bezier(.35,.05,.25,1)';
        moving.style.transform = `translate(${offX-fromX0}px, ${toRowY-fromRowY}px)`;
        arrow.style.transition = 'opacity .3s ease, x2 .7s ease, y2 .7s ease';
        arrow.setAttribute('opacity', 0.85);
        arrow.setAttribute('x2', offX);
        arrow.setAttribute('y2', toRowY-16);
      }));

      setTimeout(()=>{
        // 欄外に到着した「0」のコピーを、消える演出とともに消去する（もとの0は残ったまま）
        playZeroVanishSound();
        moving.style.transition = 'transform .4s ease-in, opacity .4s ease-in';
        moving.style.transform = `translate(${offX-fromX0}px, ${toRowY-fromRowY}px) scale(0.2)`;
        moving.style.opacity = 0;
        setTimeout(()=> moving.remove(), 420);
      }, 720);

      setTimeout(playFinishChime, 720+450);
      setTimeout(()=> onDone && onDone(), 720+650);
    }, afterMoves);
  }
}


/* ============================================================
   数字カードモード：整数・小数を同じ位取り表で扱う
   ============================================================ */
const CARD_CELL_W = 70;
const CARD_CELL_H = 72;
const CARD_HEADER_H = 62;
const CARD_LABEL_W = 76;
const CARD_POINT_GAP = 44;
const CARD_ROW_GAP = 12;
const CARD_MAX_TOTAL_DIGITS = 20;
const CARD_MIN_FRAC_PLACES = 3;
const CARD_MAX_FRAC_PLACES = 6;

const CARD_COLOR_CYCLE = [
  {bg:'#fce4ec', stroke:'#d81b60'},
  {bg:'#fff6bf', stroke:'#c99b00'},
  {bg:'#cfeaf6', stroke:'#287ba3'},
  {bg:'#ededed', stroke:'#6f767d'}
];

function mod4(n){ return ((n%4)+4)%4; }
function cardPlaceColor(exp){ return CARD_COLOR_CYCLE[mod4(exp)]; }

function normalizeDecimalInput(raw){
  let s = String(raw ?? '').trim().replace(/[，,\s]/g,'').replace('．','.');
  if(!/^\d*(?:\.\d*)?$/.test(s) || !/\d/.test(s)) return null;
  let [intPart='', fracPart=''] = s.split('.');
  intPart = intPart.replace(/^0+(?=\d)/,'');
  if(intPart==='') intPart='0';
  fracPart = (fracPart||'').replace(/0+$/,'');
  return fracPart ? `${intPart}.${fracPart}` : intPart;
}

function decimalShift(value, delta){
  const s = normalizeDecimalInput(value);
  if(s===null) return null;
  const [intPart, fracPart=''] = s.split('.');
  let digits = intPart + fracPart;
  let pos = intPart.length + delta;
  if(pos < 0){ digits = '0'.repeat(-pos) + digits; pos = 0; }
  if(pos > digits.length){ digits += '0'.repeat(pos-digits.length); }
  let out;
  if(pos===0) out = '0.' + digits;
  else if(pos===digits.length) out = digits;
  else out = digits.slice(0,pos)+'.'+digits.slice(pos);
  return normalizeDecimalInput(out);
}

function decimalParts(value){
  const s = normalizeDecimalInput(value);
  const [intPart, fracPart=''] = s.split('.');
  return {s,intPart,fracPart};
}

function displayMapForDecimal(value){
  const {intPart, fracPart} = decimalParts(value);
  const map = new Map();
  for(let i=0;i<intPart.length;i++){
    const exp = intPart.length-1-i;
    map.set(exp, intPart[i]);
  }
  for(let i=0;i<fracPart.length;i++) map.set(-(i+1), fracPart[i]);
  return map;
}

/* 動かす数字：先頭の構造上の0は動かさない。数字の途中にある0は動かす。 */
function movableDigitsForDecimal(value){
  const {intPart, fracPart} = decimalParts(value);
  const all = [];
  for(let i=0;i<intPart.length;i++) all.push({exp:intPart.length-1-i, digit:intPart[i]});
  for(let i=0;i<fracPart.length;i++) all.push({exp:-(i+1), digit:fracPart[i]});
  const first = all.findIndex(x=>x.digit!=='0');
  if(first<0) return [{exp:0,digit:'0'}];
  let last = all.length-1;
  while(last>first && all[last].digit==='0') last--;
  return all.slice(first,last+1);
}

function cardPlaceLabel(exp){
  const pos = ['一','十','百','千','万','十万','百万','千万','億','十億','百億','千億','兆','十兆','百兆','千兆','京','十京','百京','千京'];
  if(exp>=0) return pos[exp] || `10^${exp}`;
  const neg = {[-1]:'十分の一',[-2]:'百分の一',[-3]:'千分の一',[-4]:'一万分の一',[-5]:'十万分の一',[-6]:'百万分の一'};
  return neg[exp] || `10^${exp}`;
}

function cardPlaceSub(exp){
  if(exp===0) return '1';
  if(exp>0) return exp<=6 ? String(10**exp) : `10^${exp}`;
  return exp>=-6 ? `1/${10**(-exp)}` : `10^${exp}`;
}

function cardRangeForValues(a,b){
  const maps=[displayMapForDecimal(a),displayMapForDecimal(b)];
  const exps=[];
  maps.forEach(m=>m.forEach((_,e)=>exps.push(e)));
  let maxExp=Math.max(2,...exps);
  let minExp=Math.min(-CARD_MIN_FRAC_PLACES,...exps);
  maxExp=Math.min(maxExp,19);
  minExp=Math.max(minExp,-CARD_MAX_FRAC_PLACES);
  return {maxExp,minExp};
}

function cardColumnX(exp, maxExp){
  let x = CARD_LABEL_W + (maxExp-exp)*CARD_CELL_W;
  if(exp<0) x += CARD_POINT_GAP;
  return x;
}
function cardCenterX(exp,maxExp){ return cardColumnX(exp,maxExp)+CARD_CELL_W/2; }
function cardDecimalX(maxExp){ return CARD_LABEL_W + (maxExp+1)*CARD_CELL_W + CARD_POINT_GAP/2; }

function appendCardDefs(svg){
  const defs=svgEl('defs',{});
  const marker=svgEl('marker',{id:'cardArrow',markerWidth:8,markerHeight:8,refX:6,refY:3,orient:'auto'});
  marker.appendChild(svgEl('path',{d:'M0,0 L6,3 L0,6 Z',fill:'#c0392b'}));
  defs.appendChild(marker); svg.appendChild(defs);
}

function drawCardPlaceTableBase(svg, range, rows=2){
  const {maxExp,minExp}=range;
  const tableRight = cardColumnX(minExp,maxExp)+CARD_CELL_W;
  const totalW = tableRight+18;
  const totalH = CARD_HEADER_H + rows*(CARD_CELL_H+CARD_ROW_GAP)+18;
  svg.setAttribute('viewBox',`0 0 ${totalW} ${totalH}`);
  svg.setAttribute('width',totalW);
  svg.setAttribute('height',totalH);

  for(let exp=maxExp; exp>=minExp; exp--){
    const x=cardColumnX(exp,maxExp), c=cardPlaceColor(exp);
    svg.appendChild(svgEl('rect',{x,y:0,width:CARD_CELL_W,height:CARD_HEADER_H,fill:c.bg,stroke:c.stroke,'stroke-width':1.5,rx:5}));
    const t=svgEl('text',{x:x+CARD_CELL_W/2,y:23,class:'card-place-name'}); t.textContent=cardPlaceLabel(exp); svg.appendChild(t);
    const st=svgEl('text',{x:x+CARD_CELL_W/2,y:44,class:'card-place-sub'}); st.textContent=cardPlaceSub(exp); svg.appendChild(st);
    for(let r=0;r<rows;r++){
      const y=CARD_HEADER_H+r*(CARD_CELL_H+CARD_ROW_GAP);
      svg.appendChild(svgEl('rect',{x,y,width:CARD_CELL_W,height:CARD_CELL_H,fill:'#fff',stroke:'#a9b0ac','stroke-width':1.4,rx:4}));
    }
  }
  const dx=cardDecimalX(maxExp);
  svg.appendChild(svgEl('line',{x1:dx,y1:0,x2:dx,y2:totalH-10,class:'decimal-divider'}));
  const dtext=svgEl('text',{x:dx,y:14,class:'point-label'}); dtext.textContent='小数点'; svg.appendChild(dtext);

  for(let r=0;r<rows;r++){
    const y=CARD_HEADER_H+r*(CARD_CELL_H+CARD_ROW_GAP)+CARD_CELL_H/2+5;
    svg.appendChild(svgEl('rect',{x:0,y:y-CARD_CELL_H/2,width:CARD_LABEL_W-7,height:CARD_CELL_H,fill:'#f5f7f6',stroke:'#a9b0ac','stroke-width':1.3,rx:5}));
    drawCardRowDecimalPoint(svg,r,{maxExp,minExp});
  }
  return {totalW,totalH};
}

function drawDigitCard(svg, exp, digit, row, range, opts={}){
  const x=cardColumnX(exp,range.maxExp)+8;
  const y=CARD_HEADER_H+row*(CARD_CELL_H+CARD_ROW_GAP)+8;
  const c=cardPlaceColor(exp);
  const g=svgEl('g',{'data-exp':exp,'data-row':row});
  const rect=svgEl('rect',{x,y,width:CARD_CELL_W-16,height:CARD_CELL_H-16,fill:c.bg,stroke:c.stroke,class:'digit-card-rect'});
  const text=svgEl('text',{x:x+(CARD_CELL_W-16)/2,y:y+(CARD_CELL_H-16)/2+1,class:'digit-card-text'}); text.textContent=digit;
  g.appendChild(rect); g.appendChild(text);
  if(opts.opacity!=null) g.setAttribute('opacity',opts.opacity);
  svg.appendChild(g); return g;
}

function drawCardRowLabel(svg,row,text){
  const y=CARD_HEADER_H+row*(CARD_CELL_H+CARD_ROW_GAP)+CARD_CELL_H/2+5;
  const t=svgEl('text',{x:(CARD_LABEL_W-7)/2,y,class:'card-row-label-svg'}); t.textContent=text; svg.appendChild(t);
}

/* 小数点は数字の中央ではなく、数字の字面の下端（ベースライン付近）に合わせる。
   位取り表では小数点の位置自体は固定なので、各行に同じ位置で必ず表示する。 */
function drawCardRowDecimalPoint(svg,row,range){
  const cx=cardDecimalX(range.maxExp);
  const cellTop=CARD_HEADER_H+row*(CARD_CELL_H+CARD_ROW_GAP);
  const cy=cellTop+52;
  const dot=svgEl('circle',{cx,cy,r:5.2,class:'decimal-row-dot','data-decimal-row':row});
  svg.appendChild(dot);
  return dot;
}

function drawStaticDecimalRow(svg, value, row, range){
  const map=displayMapForDecimal(value);
  map.forEach((digit,exp)=>{
    if(exp<=range.maxExp && exp>=range.minExp) drawDigitCard(svg,exp,digit,row,range);
  });
}

function setCardStageMessage(html){
  const el=document.getElementById('cardStageMessage');
  if(el) el.innerHTML=html;
}

function buildDigitsMoveScene(){
  const start=CONFIG.cardNumber;
  const result=decimalShift(start, CONFIG.mode==='multiply'?1:-1);
  const range=cardRangeForValues(start,result);
  const cardStage=document.getElementById('cardStage');
  cardStage.innerHTML='';
  const title=document.createElement('div'); title.className='card-stage-title'; title.textContent='位取り表は固定。数字カードが1つとなりの位へ動く'; cardStage.appendChild(title);
  const eq=document.createElement('div'); eq.className='card-equation-big'; eq.textContent=start; eq.id='cardEquationBig'; cardStage.appendChild(eq);
  const svg=svgEl('svg',{class:'card-svg'}); appendCardDefs(svg); drawCardPlaceTableBase(svg,range,2); drawCardRowLabel(svg,0,'もと'); drawCardRowLabel(svg,1,CONFIG.mode==='multiply'?'×10':'÷10'); drawStaticDecimalRow(svg,start,0,range); cardStage.appendChild(svg);
  const msg=document.createElement('div'); msg.id='cardStageMessage'; msg.className='card-stage-explain'; msg.innerHTML='小数点は、<b>一の位と十分の一の位の間</b>に固定されています。'; cardStage.appendChild(msg);

  steps=[];
  steps.push(()=>{
    setEquation(`${start}`);
    setStatus('① もとの数を位取り表に置きます。小数点の位置も確認します。');
    setCardStageMessage('小数点は、<b>一の位と十分の一の位の間</b>に固定されています。');
  });
  steps.push(()=>new Promise(resolve=>{
    /* 「もどる」は cardStage.innerHTML を復元するため、build時の svg 参照は古くなる。
       毎回いま画面に存在するSVGを取り直して操作する。 */
    const liveSvg=document.querySelector('#cardStage svg.card-svg');
    if(!liveSvg){ resolve(); return; }
    const moveBy=CONFIG.mode==='multiply'?1:-1;
    const movers=movableDigitsForDecimal(start).filter(x=>x.exp+moveBy<=range.maxExp && x.exp+moveBy>=range.minExp);
    let delay=0;
    movers.sort((a,b)=>b.exp-a.exp).forEach(({exp,digit})=>{
      setTimeout(()=>{
        playSlideSound();
        const src=liveSvg.querySelector(`g[data-row="0"][data-exp="${exp}"]`);
        if(src) src.setAttribute('opacity','.25');
        const fromX=cardCenterX(exp,range.maxExp), toExp=exp+moveBy, toX=cardCenterX(toExp,range.maxExp);
        const fromY=CARD_HEADER_H+CARD_CELL_H/2, toY=CARD_HEADER_H+(CARD_CELL_H+CARD_ROW_GAP)+CARD_CELL_H/2;
        const c=cardPlaceColor(toExp);
        const g=svgEl('g',{class:'digit-card-moving'});
        const r=svgEl('rect',{x:fromX-(CARD_CELL_W-16)/2,y:fromY-(CARD_CELL_H-16)/2,width:CARD_CELL_W-16,height:CARD_CELL_H-16,fill:c.bg,stroke:c.stroke,class:'digit-card-rect'});
        const t=svgEl('text',{x:fromX,y:fromY+1,class:'digit-card-text'});t.textContent=digit;g.appendChild(r);g.appendChild(t);liveSvg.appendChild(g);
        const arrow=svgEl('line',{x1:fromX,y1:fromY+24,x2:fromX,y2:fromY+24,class:'digit-arrow',opacity:0});liveSvg.appendChild(arrow);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          g.style.transition='transform .75s cubic-bezier(.3,.05,.25,1)';
          g.style.transform=`translate(${toX-fromX}px,${toY-fromY}px)`;
          arrow.style.transition='opacity .25s,x2 .75s,y2 .75s';arrow.setAttribute('opacity','.85');arrow.setAttribute('x2',toX);arrow.setAttribute('y2',toY-25);
        }));
        setTimeout(()=>{g.remove(); drawDigitCard(liveSvg,toExp,digit,1,range);},770);
      },delay);
      delay+=150;
    });
    setTimeout(()=>{
      const resultMap=displayMapForDecimal(result);
      resultMap.forEach((digit,exp)=>{
        if(exp>range.maxExp||exp<range.minExp) return;
        if(!liveSvg.querySelector(`g[data-row="1"][data-exp="${exp}"]`)){
          const g=drawDigitCard(liveSvg,exp,digit,1,range,{opacity:0});
          requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.transition='opacity .35s, transform .35s';g.setAttribute('opacity','1');}));
          if(digit==='0') playZeroAppearSound();
        }
      });
      document.getElementById('cardEquationBig').textContent=`${start} ${CONFIG.mode==='multiply'?'× 10':'÷ 10'} = ${result}`;
      setEquation(`${start} ${CONFIG.mode==='multiply'?'× 10':'÷ 10'} = ${result}`);
      setStatus(CONFIG.mode==='multiply'?'② それぞれの数字が1つ上の位へ移りました。':'② それぞれの数字が1つ下の位へ移りました。');
      setCardStageMessage(CONFIG.mode==='multiply'
        ? '数字が<b>1つ左の位</b>へ移ります。小数点は動いていません。だから、数は10倍になります。'
        : '数字が<b>1つ右の位</b>へ移ります。小数点は動いていません。<b>10でわった結果、もとの数の1/10になります。</b>');
      playFinishChime(); resolve();
    },delay+900);
  }));
  steps.push(()=>{
    setStatus('③ 小数点を基準に見ると、数字の位置が1つずれたことが確認できます。');
    setCardStageMessage(`位取り表では<b>数字の位が変わった</b>と見えます。同じ変化を「小数点が動く」見方にも切り替えられます。`);
  });
}

function commonPointTapeData(start, result){
  const raw=(v)=>{ const [i,f='']=decimalParts(v).s.split('.'); return {digits:i+f,pos:i.length}; };
  let a=raw(start), b=raw(result);
  /* 10倍/1/10なので、共通の数字列は片側に0を補えば一致する。 */
  let leftPad=0,rightPad=0;
  while(a.pos+leftPad<0 || b.pos+leftPad<0) leftPad++;
  let maxLen=Math.max(a.digits.length,b.digits.length);
  let tape=a.digits;
  if(CONFIG.mode==='multiply' && b.digits.length>a.digits.length) tape=b.digits;
  if(CONFIG.mode==='divide' && b.digits.length>a.digits.length) tape=b.digits;
  /* 0.36→0.036 のような場合は、結果側の増えた0を使う */
  if(b.digits.length>tape.length) tape=b.digits;
  if(a.digits.length>tape.length) tape=a.digits;
  // 末尾0が必要な×10整数
  if(CONFIG.mode==='multiply' && b.pos>b.digits.length-0 && tape.length<b.pos) tape=tape+'0'.repeat(b.pos-tape.length);
  // 位置合わせ：結果と開始の数字列の共通部分を右寄せ/左寄せする簡易調整
  let sourcePos=a.pos, targetPos=b.pos;
  if(b.digits.length>a.digits.length){
    if(b.digits.endsWith(a.digits)){ const d=b.digits.length-a.digits.length; sourcePos+=d; }
    else if(b.digits.startsWith(a.digits)){ /* sourcePos stays */ }
  }
  if(a.digits.length>b.digits.length){
    if(a.digits.endsWith(b.digits)){ const d=a.digits.length-b.digits.length; targetPos+=d; }
  }
  return {tape,sourcePos,targetPos,a,b};
}

function buildPointMoveScene(){
  const start=CONFIG.cardNumber;
  const result=decimalShift(start, CONFIG.mode==='multiply'?1:-1);
  const range=cardRangeForValues(start,result);
  const cardStage=document.getElementById('cardStage'); cardStage.innerHTML='';
  const title=document.createElement('div'); title.className='card-stage-title'; title.textContent='数字カードは固定。小数点を1つ動かして同じ変化を見る'; cardStage.appendChild(title);
  const eq=document.createElement('div'); eq.className='card-equation-big'; eq.id='cardEquationBig'; eq.textContent=start; cardStage.appendChild(eq);
  const data=commonPointTapeData(start,result);
  const tape=document.createElement('div'); tape.className='point-tape'; tape.id='pointTape';
  const activeStartDigits=decimalParts(start).intPart+decimalParts(start).fracPart;
  for(let i=0;i<data.tape.length;i++){
    const slot=document.createElement('div'); slot.className='point-slot';
    const card=document.createElement('div'); card.className='point-digit-card'; card.textContent=data.tape[i]; card.dataset.index=i;
    // 結果のためだけに補われた0は最初は薄くする
    if(data.tape.length>activeStartDigits.length){
      const extra=data.tape.length-activeStartDigits.length;
      if((data.tape.endsWith(activeStartDigits) && i<extra) || (data.tape.startsWith(activeStartDigits) && i>=activeStartDigits.length)) card.classList.add('ghost');
    }
    slot.appendChild(card); tape.appendChild(slot);
  }
  const marker=document.createElement('div'); marker.className='point-marker'; marker.id='pointMarker'; tape.appendChild(marker);
  cardStage.appendChild(tape);
  const pointResult=document.createElement('div'); pointResult.id='pointResult'; pointResult.className='point-result'; pointResult.textContent=''; cardStage.appendChild(pointResult);
  const msg=document.createElement('div'); msg.id='cardStageMessage'; msg.className='card-stage-explain'; msg.innerHTML='数字カードの並びは変えません。赤い小数点だけに注目します。'; cardStage.appendChild(msg);

  /* 同じ数を位取り表でも静止表示し、「位が変わる」見方との対応を残す */
  const mini=document.createElement('div'); mini.className='mini-pvt-wrap';
  const cap=document.createElement('div'); cap.className='mini-pvt-caption'; cap.textContent='位取り表で見ると'; mini.appendChild(cap);
  const svg=svgEl('svg',{class:'card-svg'}); appendCardDefs(svg); drawCardPlaceTableBase(svg,range,2); drawCardRowLabel(svg,0,'もと'); drawCardRowLabel(svg,1,CONFIG.mode==='multiply'?'×10':'÷10'); drawStaticDecimalRow(svg,start,0,range); drawStaticDecimalRow(svg,result,1,range); mini.appendChild(svg); cardStage.appendChild(mini);

  function pointBoundaryX(pos){
    const liveTape=document.getElementById('pointTape');
    if(!liveTape) return 0;
    const slots=[...liveTape.querySelectorAll('.point-slot')];
    if(!slots.length) return 0;
    if(pos<=0) return slots[0].offsetLeft;
    if(pos>=slots.length){
      const last=slots[slots.length-1];
      return last.offsetLeft+last.offsetWidth;
    }
    return slots[pos].offsetLeft;
  }
  function pointBaselineY(){
    const liveTape=document.getElementById('pointTape');
    if(!liveTape) return 0;
    const card=liveTape.querySelector('.point-digit-card');
    if(!card) return 0;
    /* offsetTop は slot 基準になるため、そのままだと小数点が上へずれる。
       tape 基準の実座標に直して、数字のベースライン（字面の下端）へ合わせる。 */
    const tapeRect=liveTape.getBoundingClientRect();
    const cardRect=card.getBoundingClientRect();
    return (cardRect.top-tapeRect.top)+cardRect.height-11;
  }
  function placePoint(pos,animate=true){
    const liveMarker=document.getElementById('pointMarker');
    if(!liveMarker) return;
    if(!animate) liveMarker.style.transition='none';
    liveMarker.style.left=pointBoundaryX(pos)+'px';
    liveMarker.style.top=pointBaselineY()+'px';
    if(!animate){
      liveMarker.getBoundingClientRect();
      liveMarker.style.transition='left .85s cubic-bezier(.25,.75,.2,1)';
    }
  }
  requestAnimationFrame(()=>placePoint(data.sourcePos,false));

  steps=[];
  steps.push(()=>{
    setEquation(start); setStatus('① 数字カードはそのまま固定します。まず、もとの小数点の位置を見ます。');
    setCardStageMessage('下の位取り表では、<b>一の位と十分の一の位の間</b>が小数点です。上では数字カードを固定して、同じ変化を別の見方で表します。');
  });
  steps.push(()=>new Promise(resolve=>{
    playSlideSound();
    placePoint(data.targetPos,true);
    setStatus(CONFIG.mode==='multiply'?'② 小数点を右へ1つ動かして見ると、10倍した数になります。':'② 10でわると、数字の位が1つ下がります。数字を固定して見ると、小数点が左へ1つ動いたように見えます。');
    setCardStageMessage(CONFIG.mode==='multiply'
      ? '数字の並びを固定すると、<b>小数点が右へ1つ動いた</b>ように見えます。'
      : '数字の並びを固定すると、<b>小数点が左へ1つ動いた</b>ように見えます。');
    setTimeout(()=>{
      const liveTape=document.getElementById('pointTape');
      const liveResult=document.getElementById('pointResult');
      if(liveTape) liveTape.querySelectorAll('.point-digit-card.ghost').forEach(el=>el.classList.remove('ghost'));
      const resultText=`${start} ${CONFIG.mode==='multiply'?'× 10':'÷ 10'} = ${result}`;
      if(liveResult) liveResult.textContent=resultText;
      const bigEq=document.getElementById('cardEquationBig');
      if(bigEq) bigEq.textContent=resultText;
      setEquation(resultText); playFinishChime(); resolve();
    },900);
  }));
  steps.push(()=>{
    setStatus('③ 上は「小数点が動く」見方、下は「数字の位が変わる」見方です。表している変化は同じです。');
    setCardStageMessage('「小数点を動かす」は別のルールではありません。<b>数字の位が1つ変わった結果を、小数点を基準に見た表し方</b>です。');
  });
}

function validateCardNumber(showMessage=true){
  const input=document.getElementById('cardNumberInput');
  const n=normalizeDecimalInput(input.value);
  if(n===null){ if(showMessage) alert('0以上の数を、数字と小数点で入力してください。'); return null; }
  const digits=n.replace('.','').length;
  const frac=(n.split('.')[1]||'').length;
  if(digits>CARD_MAX_TOTAL_DIGITS || frac>CARD_MAX_FRAC_PLACES){
    if(showMessage) alert(`数字カードでは、全体${CARD_MAX_TOTAL_DIGITS}けた以内・小数第${CARD_MAX_FRAC_PLACES}位までにしてください。`);
    return null;
  }
  const shifted=decimalShift(n,CONFIG.mode==='multiply'?1:-1);
  const shiftedFrac=(shifted.split('.')[1]||'').length;
  if(shifted.replace('.','').length>CARD_MAX_TOTAL_DIGITS || shiftedFrac>CARD_MAX_FRAC_PLACES){
    if(showMessage) alert('10倍／÷10した後の数が、表示できる範囲をこえます。');
    return null;
  }
  input.value=n; CONFIG.cardNumber=n; return n;
}

function buildStepsMultiply(skipPvt){

    setStatus('①まず、コインやお札を縦に並べます（同じ種類は少し重ねて置きます）。青いわくで囲みました。');
  });

  for(let i=1;i<10;i++){
    steps.push((idx=>()=>{
      setsShown = idx+1;
      drawSet(idx);
      setEquation(`${originalTotal()} が ${idx+1} セット`);
      setStatus(`③10倍するために、同じ${originalTotal()}円のセットを右にふやしていきます。（${idx+1}／10）`);
    })(i));
  }

  const frameInfos = [];
  CONFIG.groups.forEach((g, gi) => {
    steps.push(()=>{

      frameInfos[gi] = info;
      setStatus(`④⑤「${g.value}円 × 10セット」を黄色いわくで囲みます。（${gi+1}／${CONFIG.groups.length}）`);
    });
  });

  steps.push(()=>{
    showExchangeText();
    setStatus('⑥両替！　同じ種類のコインやお札が10まい集まると、上の位の1まいに変身します。');
  });

  CONFIG.groups.forEach((g, gi) => {
    steps.push(async ()=>{
      fadeOutExchangeText();
      setStatus(`⑦⑧青いわくが消え、黄色いわくが真ん中に向かって縮んで正方形に。${g.value}円×10セットが中心に集まり、キラリーン！${g.value*CONFIG.multiplier}円 に変わります。`);
      await convergeGroup(gi, frameInfos[gi]);
    });

    steps.push(()=>{
      buildPlaceValueTable('multiply');
      setEquation(`${originalTotal()} × 10 = ${newTotal()}`);

      document.getElementById('pvtWrap').scrollIntoView({behavior:'smooth', block:'nearest'});
    });

/* ------------------------------------------------------------
   ÷10のパターン（×10の完全な逆再生）
   1. 中心に選んだお金（大きい金額）を表示
   2. 両替して1/10の金額を10セット、横に広げる
   3. そのうち1セット（左はし）だけを選ぶ
   4. 選ばれなかった9セットは消える
   ------------------------------------------------------------ */
function buildStepsDivide(skipPvt){
  steps = [];

  // 10セット分の最終レイアウトをあらかじめ計算しておき、
  // 中心にお金を表示する位置に使う（convergeGroupの計算と同じ考え方）
  const centerInfos = CONFIG.groups.map((g, gi) => {
    const ys = layout.groupsY[gi];
    const top = ys[0] - R - 6;
    const bottom = ys[ys.length-1] + R + 6;
    const left = X0 + layout.frameLeft - 4;
    const right = X0 + 9*SET_GAP + layout.frameRight + 4;
    const centerX = (left+right)/2;
    const centerY = (top+bottom)/2;
    const squareSize = bottom - top;
    return { centerX, centerY, squareSize, left, right, top, bottom };
  });

  steps.push(()=>{
    setsShown = 0;
    CONFIG.groups.forEach((g, gi) => {
      const ci = centerInfos[gi];
      const startY = ci.centerY - ((g.count-1)*STACK_OVERLAP)/2;
      const gEl = svgEl('g', {class:'coin-set', id:'bigcoin-'+gi, opacity:0});
      layerSets.appendChild(gEl);
      for(let k=0;k<g.count;k++){
        drawCoin(gEl, ci.centerX, startY + k*STACK_OVERLAP, g.value, `big-g${gi}-k${k}`);
      }
      gEl.style.transition = 'opacity .5s ease';
      requestAnimationFrame(()=> requestAnimationFrame(()=> gEl.setAttribute('opacity',1)));
    });
    setEquation(`${originalTotal()}`);
    setStatus('①中心に、選んだコインやお札を表示します。');
  });

  CONFIG.groups.forEach((g, gi) => {
    steps.push(async ()=>{
      setStatus(`②両替して、${g.value}円を10等分した ${g.value/10}円 を10セット、横にならべます。（${gi+1}／${CONFIG.groups.length}）`);
      await divergeGroup(gi, centerInfos[gi]);
    });
  });

  steps.push(()=>{
    setsShown = 10;
    for(let s=0;s<10;s++){
      const frame = svgEl('rect', {
        class:'frame-blue', 'data-set': s,
        x: X0+s*SET_GAP+layout.frameLeft, y: layout.frameTop,
        width: layout.frameRight - layout.frameLeft,
        height: layout.frameBottom - layout.frameTop,
        rx: 10, opacity:0
      });
      layerSets.appendChild(frame);
      frame.style.transition = 'opacity .5s ease';
      requestAnimationFrame(()=> requestAnimationFrame(()=> frame.setAttribute('opacity',1)));
    }
    setEquation(`${originalTotal()} ÷ 10`);
    setStatus('③10等分されたお金が、10セットに分かれました。それぞれを青いわくで囲みます。');
  });

  steps.push(()=>{
    setStatus('④この中から1セットだけを選びます（左はし）。');
    highlightSet(0);
  });

  steps.push(()=>{
    setStatus('⑤選ばれなかった9セットは消えます。残った1セットが答えです。');
    discardOtherSets(0);
  });

  if(!skipPvt){
    steps.push(()=>{
      buildPlaceValueTable('divide');
      setEquation(`${originalTotal()} ÷ 10 = ${originalTotal()/10}`);
      setStatus('⑥位取り表でも確認しましょう。それぞれの位の数字が、1つ下の位に移ります。');
      document.getElementById('pvtWrap').scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  }
}

function buildSteps(skipPvt){
  if(CONFIG.mode === 'divide') buildStepsDivide(skipPvt);
  else buildStepsMultiply(skipPvt);
}

function captureStepSnapshot(){
  return {
    layerSets: layerSets.innerHTML,
    layerFrames: layerFrames.innerHTML,
    layerEffects: layerEffects.innerHTML,
    layerResults: layerResults.innerHTML,
    pvtWrap: document.getElementById('pvtWrap').innerHTML,
    cardStage: document.getElementById('cardStage').innerHTML,
    stageDisplay: document.getElementById('stage').style.display,
    cardStageDisplay: document.getElementById('cardStage').style.display,
    pvtDisplay: document.getElementById('pvtWrap').style.display,
    footerNote: document.getElementById('footerNote').textContent,
    status: statusEl.textContent,
    equation: equationEl.textContent,
    setsShown
  };
}

function restoreStepSnapshot(snap){
  if(!snap) return;
  layerSets.innerHTML = snap.layerSets;
  layerFrames.innerHTML = snap.layerFrames;
  layerEffects.innerHTML = snap.layerEffects;
  layerResults.innerHTML = snap.layerResults;
  document.getElementById('pvtWrap').innerHTML = snap.pvtWrap;
  document.getElementById('cardStage').innerHTML = snap.cardStage;
  document.getElementById('stage').style.display = snap.stageDisplay;
  document.getElementById('cardStage').style.display = snap.cardStageDisplay;
  document.getElementById('pvtWrap').style.display = snap.pvtDisplay;
  document.getElementById('footerNote').textContent = snap.footerNote;
  statusEl.textContent = snap.status;
  equationEl.textContent = snap.equation;
  setsShown = snap.setsShown;
  updateStepButtons();
}

function initStepSnapshots(){
  stepSnapshots = [captureStepSnapshot()];
  updateStepButtons();
}

function updateStepButtons(){
  if(backBtn) backBtn.disabled = isStepRunning || stepIndex <= 0;
  if(nextBtn){
    nextBtn.disabled = isStepRunning || stepIndex >= steps.length;
    nextBtn.textContent = stepIndex >= steps.length ? 'おわり' : 'つぎへ ▶';
  }
}

function runPreviousStep(){
  if(isStepRunning || stepIndex <= 0) return;
  stopAuto();
  stepIndex--;
  restoreStepSnapshot(stepSnapshots[stepIndex]);
  stepSnapshots = stepSnapshots.slice(0, stepIndex + 1);
}

async function runStep(){
  if(isStepRunning) return;
  if(stepIndex >= steps.length){
    setStatus(CONFIG.representation==='cards' ? 'これで数字カードのアニメーションはおわりです。「さいしょから」でもう一度見られます。' : 'これで10倍・÷10のアニメーションはおわりです。「さいしょから」でもう一度見られます。');
    stopAuto();
    updateStepButtons();
    return;
  }
  isStepRunning = true;
  updateStepButtons();
  const fn = steps[stepIndex];
  const targetIndex = stepIndex + 1;
  try{
    await fn();
    // requestAnimationFrame内で最終位置・最終透明度を設定する描画を待ってから保存する。
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    stepIndex = targetIndex;
    stepSnapshots = stepSnapshots.slice(0, stepIndex);
    stepSnapshots[stepIndex] = captureStepSnapshot();
    if(stepIndex >= steps.length) stopAuto();
  } finally {
    isStepRunning = false;
    updateStepButtons();
  }
}

function resetStage(){
  layerSets.innerHTML = '';
  layerFrames.innerHTML = '';
  layerEffects.innerHTML = '';
  layerResults.innerHTML = '';
  document.getElementById('pvtWrap').innerHTML = '';
  document.getElementById('cardStage').innerHTML = '';
  setsShown = 0;
  stepIndex = 0;
  stepSnapshots = [];
  isStepRunning = false;
  setEquation('');
  stopAuto();
  updateStepButtons();
}

function buildScene(){
  if(CONFIG.representation === 'cards'){ buildCardScene(); return; }
  resetStage();
  document.getElementById('stage').style.display='block';
  document.getElementById('cardStage').style.display='none';
  document.getElementById('pvtWrap').style.display='block';
  document.getElementById('footerNote').textContent='位取り表は最後のステップで表示されます。';
  layout = computeSetLayout();
  const totalWidth = X0 + (CONFIG.multiplier-1)*SET_GAP + layout.frameRight + 140;
  const totalHeight = Math.max(layout.frameBottom + 40, 480);
  svgRoot.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
  svgRoot.setAttribute('width', totalWidth);
  svgRoot.setAttribute('height', totalHeight);
  buildSteps();
  setStatus('準備ができました。「つぎへ」ボタンでアニメーションを進めます。');
  setEquation(`${originalTotal()}`);
  initStepSnapshots();
}

function stopAuto(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; autoBtn.textContent='▶▶ オート再生'; }

function renderGroupEditors(){
  groupListEl.innerHTML = '';
  const allowed = allowedValues(CONFIG.mode);
  CONFIG.groups.forEach((g, i) => {
    const row = document.createElement('div');
    row.className = 'group-editor';

    const sel = document.createElement('select');
    allowed.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v + '円';
      if(v === g.value) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = () => { g.value = parseInt(sel.value); };

    const numIn = document.createElement('input');
    numIn.type = 'number'; numIn.min = 1; numIn.max = 9; numIn.value = g.count;
    numIn.onchange = () => { g.count = Math.max(1, Math.min(9, parseInt(numIn.value)||1)); numIn.value = g.count; };

    const label = document.createElement('span');
    label.textContent = 'まい';
    label.style.fontSize = '13px';

    const delBtn = document.createElement('button');
    delBtn.textContent = '×';
    delBtn.onclick = () => {
      if(CONFIG.groups.length <= 1) return;
      CONFIG.groups.splice(i,1);
      renderGroupEditors();
    };

    row.appendChild(sel);
    row.appendChild(numIn);
    row.appendChild(label);
    row.appendChild(delBtn);
    groupListEl.appendChild(row);
  });
}

function setMode(mode){
  if(CONFIG.mode === mode) return;

    CONFIG.groups.forEach(g => { if(!allowed.includes(g.value)) g.value = allowed[0]; });

}
function setCardView(view){
  CONFIG.cardView=view;
  viewDigitsBtn.classList.toggle('active',view==='digits');
  viewPointBtn.classList.toggle('active',view==='point');
  if(CONFIG.representation==='cards') buildScene();
}
reprMoneyBtn.onclick=()=>setRepresentation('money');
reprCardsBtn.onclick=()=>setRepresentation('cards');
viewDigitsBtn.onclick=()=>setCardView('digits');
viewPointBtn.onclick=()=>setCardView('point');
document.getElementById('cardBuildBtn').onclick=buildScene;
document.getElementById('cardNumberInput').addEventListener('keydown',e=>{ if(e.key==='Enter') buildScene(); });

modeMulBtn.onclick = () => setMode('multiply');
modeDivBtn.onclick = () => setMode('divide');

document.getElementById('addGroupBtn').onclick = () => {
  if(CONFIG.groups.length >= 4) { alert('コインやお札の種類は4種類までにしましょう。'); return; }
  CONFIG.groups.push({value: allowedValues(CONFIG.mode)[0], count:1});
  renderGroupEditors();
};
document.getElementById('buildBtn').onclick = buildScene;
nextBtn.onclick = runStep;
backBtn.onclick = runPreviousStep;
document.getElementById('resetBtn').onclick = () => { buildScene(); };
autoBtn.onclick = () => {
  if(autoTimer){ stopAuto(); return; }
  autoBtn.textContent = '■ 停止';
  autoTimer = setInterval(()=>{
    if(stepIndex >= steps.length){ stopAuto(); return; }
    if(!isStepRunning) runStep();
  }, 1300);
};

/* ← / → で戻る・進む。入力欄を編集中はカーソル移動を優先する。 */
document.addEventListener('keydown', e => {
  const target=e.target;
  const tag=(target && target.tagName || '').toLowerCase();
  const editing = tag==='input' || tag==='textarea' || tag==='select' || (target && target.isContentEditable);
  if(editing || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if(e.key==='ArrowRight'){
    e.preventDefault();
    runStep();
  }else if(e.key==='ArrowLeft'){
    e.preventDefault();
    runPreviousStep();
  }
});

renderGroupEditors();
buildScene();
</script>
</body>
</html>
