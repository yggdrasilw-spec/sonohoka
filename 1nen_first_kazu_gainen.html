<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>かずのがいねん 1ねんせい</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4ff;--ink:#24345c;--card:#fff;--red:#e8505b;--blue:#3b82f6;--yel:#ffc93c;--grn:#2fb56a;--line:#c9d9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;font-weight:700;touch-action:manipulation}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff}
header h1{font-size:20px;margin:0;font-weight:900}
#back{display:none;background:var(--yel);color:var(--ink);border:0;border-radius:20px;padding:6px 16px;font:inherit;font-size:16px}
main{max-width:1000px;margin:0 auto;padding:14px 14px 190px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tile{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:16px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tile b{display:block;font-size:22px}.tile span{font-size:40px}.tile small{font-size:14px;font-weight:500}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:12px}
.q{font-size:22px;margin:0 0 8px}
.btn{font:inherit;font-size:18px;border:3px solid var(--ink);background:var(--yel);color:var(--ink);border-radius:14px;padding:8px 16px;cursor:pointer;margin:4px}
.pb{display:block;width:100%;height:60px;border:3px solid var(--ink);border-radius:18px;cursor:pointer;background:var(--pc);box-shadow:0 7px 0 var(--pd),0 7px 0 3px var(--ink);transform:translateY(0);transition:transform .08s,box-shadow .08s;margin:4px 0 10px;-webkit-tap-highlight-color:transparent}
.pb:active,.pb.dn{transform:translateY(6px);box-shadow:0 1px 0 var(--pd),0 1px 0 3px var(--ink)}
.pb:focus-visible{outline:4px solid var(--yel);outline-offset:3px}
.btn.alt{background:#fff}.btn.on{background:var(--ink);color:#fff}
.msg{min-height:34px;font-size:22px;color:var(--grn)}.msg.ng{color:var(--red)}
/* compare */
.cmp{position:relative;padding:8px}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:nowrap;margin:26px 0}
.it{font-size:clamp(30px,8vw,54px);line-height:1;padding:4px;border-radius:10px;cursor:pointer;user-select:none}
.it.sel{outline:4px solid var(--blue)}
.it.done{background:#e2f7ea}
.oi{position:relative}.oi sub{position:absolute;right:-4px;bottom:-6px;font-size:15px!important;line-height:1;background:rgba(255,255,255,.92);border-radius:8px;padding:1px 3px}
/* 線つなぎ：1つ1つを固定サイズのマスにして、絵文字とブロックを同じ中心に重ねる（切り替えで位置が動かない） */
#cm{font-size:min(54px,max(22px,calc((100vw - 64px)/13)))}
#cm .row{gap:.2em}
#cm .it{position:relative;flex:0 0 auto;width:1.25em;height:1.25em;padding:0;font-size:inherit}
#cm .it .e,#cm .it .bk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:transform .3s ease,opacity .3s ease;transition-delay:var(--d,0s)}
#cm .it .e{display:flex;align-items:center;justify-content:center;width:1em;height:1em;line-height:1;font-size:1em;font-style:normal;font-weight:400}
#cm .it .bk{display:block;width:.95em;height:.95em;box-sizing:border-box;border:3px solid var(--ink);border-radius:.16em;opacity:0;transform:translate(-50%,-50%) scale(.2)}
#cm[data-b="1"] .it .e{opacity:0;transform:translate(-50%,-50%) scale(.2)}
#cm[data-b="1"] .it .bk{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* 「どっちが おおい？」ポップアップ（ひらがなの ボタンを やめて、絵だけを えらぶ） */
.cpop{position:fixed;left:0;right:0;bottom:96px;z-index:40;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.pcard{pointer-events:auto;width:min(520px,100%);background:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 14px 18px;box-shadow:0 12px 32px rgba(36,52,92,.38);animation:pup .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pup{from{transform:translateY(36px) scale(.9);opacity:0}}
.pq{font-size:20px;text-align:center;margin-bottom:8px}
.prow{display:flex;gap:14px}
.pk{flex:1;height:96px;font:inherit;font-size:56px;line-height:1;background:var(--yel);border:3px solid var(--ink);border-radius:20px;cursor:pointer;box-shadow:0 8px 0 #c99a10,0 8px 0 3px var(--ink);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent;margin-bottom:8px}
.pk{position:relative}
.pk .pkb{position:absolute;left:50%;top:50%;width:78px;height:78px;border:3px solid var(--ink);border-radius:14px;opacity:0;transform:translate(-50%,-50%) scale(.2);transition:transform .3s ease,opacity .3s ease}
.pk .pke{position:relative;z-index:1;display:inline-block;transition:font-size .3s}
.cpop[data-b] .pk .pkb{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cpop[data-b] .pk .pke{font-size:46px}
.pk:active{transform:translateY(7px);box-shadow:0 1px 0 #c99a10,0 1px 0 3px var(--ink)}
.pk.ng{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* trace */
canvas{background:#fff;border:3px dashed var(--line);border-radius:16px;touch-action:none;width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.dots{display:flex;flex-direction:column;align-items:center;gap:4px;margin:8px 0}
.dr{display:flex;gap:4px}.dot{width:22px;height:22px;border-radius:50%;background:var(--red)}.dot.e{background:transparent;border:2px solid var(--line)}
.nums{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.nums .btn{min-width:48px;font-size:22px;margin:2px}
/* bunkai */
.zone{position:relative;height:380px;background:#f4f8ff;border:3px solid var(--ink);border-radius:16px;touch-action:none;overflow:hidden}
.box{position:absolute;bottom:8px;width:44%;height:200px;border:4px dashed;border-radius:14px;display:flex;align-items:flex-start;justify-content:center;font-size:16px;padding-top:2px}.zone .ohaji{width:36px;height:36px}
.box.r{left:4%;border-color:var(--red);color:var(--red)}.box.w{right:4%;border-color:#8a94a8;color:#8a94a8;background:#fff}
.ohaji{position:absolute;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);cursor:grab;touch-action:none}
.ohaji.r{background:var(--red)}.ohaji.w{background:#fff}
.eq{font-size:30px;text-align:center;margin:8px 0}
/* ten */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:10px auto}
.cell{aspect-ratio:1;font:inherit;font-size:34px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
.cell.sel{background:var(--yel)}.cell.gone{visibility:hidden}
.frame{display:grid;grid-template-columns:repeat(5,30px);gap:4px;justify-content:center;margin:8px auto}
.frame i{width:30px;height:30px;border:2px solid var(--ink);border-radius:6px;background:#fff}.frame i.a{background:var(--red)}.frame i.b{background:var(--blue)}
.tg{background:#fff;color:#24345c;border:0;border-radius:16px;padding:4px 10px;font:inherit;font-size:13px}header{flex-wrap:wrap;gap:8px 10px!important}
.msg.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}.msg.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.fx{position:fixed;pointer-events:none;font-size:30px;animation:fly 1s ease-out forwards;z-index:50}@keyframes fly{to{transform:translate(var(--dx),-140px) rotate(180deg);opacity:0}}
.hl{outline:5px solid #ff9f1c;border-radius:12px;animation:hlp .5s infinite alternate}@keyframes hlp{to{transform:scale(1.18)}}
#thn{position:fixed!important;right:12px;bottom:74px;z-index:45;font-size:20px!important;padding:12px 18px!important;border:3px solid #24345c!important;border-radius:32px!important;box-shadow:0 4px 0 #24345c}#thn.wig{animation:wig .7s infinite}@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.1)}75%{transform:rotate(8deg) scale(1.1)}}
.fg{position:absolute;font-size:44px;z-index:60;pointer-events:none;animation:fgb .5s infinite alternate}@keyframes fgb{to{transform:translateY(-14px)}}
.tree{display:flex;flex-direction:column;align-items:center;margin:8px 0}.bx{width:64px;height:64px;border:4px solid var(--ink);border-radius:12px;background:#fff;font-size:38px;display:flex;align-items:center;justify-content:center}.bx.q{background:#fff8e0;border-color:var(--red);color:var(--red)}.tb{display:flex;gap:56px}
.sq,.nc{transition:background .45s}sub{display:inline-block;animation:pop .45s}.cq span{display:inline-block;animation:pop .45s}

/* ===== 位置ズレ防止：きりかえても レイアウトを うごかさない ===== */
.msg{min-height:72px}.tg{min-width:8.5em}#bblk{min-width:9.5em}
.eq,.nums,.msg,.bx{font-variant-numeric:tabular-nums}
.sp{position:relative}.sp sub{position:absolute;right:-6px;bottom:-8px;line-height:1;background:rgba(255,255,255,.92);border-radius:8px;padding:1px 3px}
.btn.c{height:190px;min-height:190px!important;width:112px;min-width:112px!important;padding:4px;display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden}
.c .ns{height:60px;font-size:44px;line-height:60px;visibility:hidden}.c .ds{height:80px;display:flex;align-items:center;justify-content:center;visibility:hidden}.c .dots{margin:0}
.c.m0 .ns,.c.rev .ns,.c.m1 .ds,.c.rev .ds{visibility:visible}
.zb{font-size:48px;text-align:center;min-height:80px;border:4px solid var(--ink);border-radius:50%;padding:12px;max-width:300px;margin:auto;background:#fff8e0}
.zg{font-size:48px;line-height:1.2;white-space:nowrap}.zg .a.off{visibility:hidden}

/* ===== 「つぎへ」ボタン：せいかい するまで かくして、でたら おおきく めだたせる（ひらがなが よめなくても ▶ で わかる） ===== */
#nx{display:block!important;visibility:hidden;width:100%;height:76px;margin:12px 0 10px;padding:0 16px;font-size:30px;font-weight:700;letter-spacing:.06em;background:var(--yel);color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 #c99a10,0 8px 0 4px var(--ink);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
#nx.show{visibility:visible;animation:nxin .4s cubic-bezier(.2,1.4,.4,1),nxp .8s .5s ease-in-out infinite alternate}
#nx.show:active{animation:none;transform:translateY(7px);box-shadow:0 1px 0 #c99a10,0 1px 0 4px var(--ink)}
@keyframes nxin{from{transform:translateY(26px) scale(.85);opacity:0}}@keyframes nxp{to{transform:scale(1.03)}}
#nx{scroll-margin-bottom:130px}

/* ===== 「つぎの ステージへ」：でたら グローして ゆびが しめす ===== */
#cb{gap:12px!important;padding:10px 12px!important;transition:background .3s}
#cb.up{background:#eafff2;border-top-color:var(--grn)}
#nxt{position:relative;flex:1;max-width:520px;height:64px;margin:0;padding:0 14px;font-size:24px;font-weight:900;letter-spacing:.05em;background:var(--grn);color:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 #1b7f48,0 6px 0 4px var(--ink),0 0 0 0 rgba(47,181,106,.8);animation:nxtin .6s cubic-bezier(.2,1.5,.4,1),nxtglow 1.3s .6s ease-in-out infinite}
#nxt::before{content:'👇';position:absolute;left:50%;top:-50px;font-size:36px;line-height:1;transform:translateX(-50%);animation:nxtpt .55s ease-in-out infinite alternate;pointer-events:none}
#nxt:active{animation:none;transform:translateY(6px);box-shadow:0 0 0 #1b7f48,0 0 0 4px var(--ink)}
@keyframes nxtin{from{transform:scale(.3);opacity:0}}
@keyframes nxtglow{0%,100%{transform:scale(1);box-shadow:0 6px 0 #1b7f48,0 6px 0 4px var(--ink),0 0 0 0 rgba(47,181,106,.8)}50%{transform:scale(1.05);box-shadow:0 6px 0 #1b7f48,0 6px 0 4px var(--ink),0 0 26px 12px rgba(47,181,106,.6)}}
@keyframes nxtpt{to{transform:translate(-50%,-12px)}}
@media (prefers-reduced-motion:reduce){#nxt,#nxt::before{animation:none}}

/* ===== ぜんぶ やる：できた かずに ✓ ===== */
.nums .btn.dn{background:#cdeed9;border-color:var(--grn)}
.nums .btn.dn::after{content:' ✓';color:var(--grn)}
.nums .btn.on.dn{background:var(--ink);color:#fff}.nums .btn.on.dn::after{color:#9be7b9}
.chip{display:inline-block;margin:3px 4px;padding:5px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;font-size:20px}
.chip.dn{background:#cdeed9;border-color:var(--grn)}.chip.dn::after{content:' ✓';color:var(--grn)}

/* ===== 横長(16:9)画面：スクロールなしで おさまるように ===== */
body.cb main{padding-bottom:calc(76px + 8px)}
.box{height:calc(100% - 112px)}
@media (min-aspect-ratio:3/2){
 header{padding:6px 14px}header h1{font-size:18px}
 main{max-width:1180px;padding:8px 12px 12px}
 body.cb main{padding-bottom:74px}
 .panel{padding:8px 12px;margin-bottom:6px}
 .q{font-size:20px;margin:0 0 4px}
 .btn{font-size:17px;padding:5px 14px;margin:3px}
 .msg{min-height:56px;font-size:20px}
 #nx{height:52px;margin:6px 0 4px;font-size:24px;border-width:3px;box-shadow:0 5px 0 #c99a10,0 5px 0 3px var(--ink)}
 #cb{padding:6px 12px!important}#nxt{height:50px;font-size:22px}
 .row{margin:10px 0}
 .eq{margin:4px 0}
 .dot{width:18px;height:18px}.dots{margin:4px 0}
 /* なぞりがき：ひだりに せつめい、みぎに ますがめ */
 .panel.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:start}
 .panel.tr>*{grid-column:1}
 .panel.tr>canvas{grid-column:2;grid-row:1/span 5;width:min(340px,max(200px,calc(100vh - 190px)))}
 /* わけかた：ひだりに おはじき、みぎに しき */
 .panel.bk{display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:14px;grid-template-areas:"n n" "q q" "z e" "m m"}
 .panel.bk>.nums{grid-area:n}.panel.bk>.q{grid-area:q}.panel.bk>.zone{grid-area:z}.panel.bk>.eq{grid-area:e;align-self:start}.panel.bk>.msg{grid-area:m}.panel.bk>#nx{grid-column:1/-1}
 .zone{height:clamp(220px,calc(100vh - 360px),380px)}
}

@media (min-aspect-ratio:3/2){
 .panel.sk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px;grid-template-areas:"n n" "q q" "t r" "t d" "t f" "m m" "x x"}
 .panel.sk>.nums:first-child{grid-area:n}.panel.sk>.q{grid-area:q}.panel.sk>.tree{grid-area:t;margin:2px 0}.panel.sk>.nums:nth-last-child(3){grid-area:r}
 .panel.sk>.sdw{grid-area:d}.panel.sk>.frame{grid-area:f;margin:2px auto}.panel.sk>.msg{grid-area:m}.panel.sk>#nx{grid-area:x}
 .panel.sk .bx{width:56px;height:56px;font-size:32px}
 .panel.sz{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:18px;align-items:start}
 .panel.sz>*{grid-column:1}.panel.sz>.sbars{grid-column:2;grid-row:1/span 6;display:grid!important;grid-template-columns:repeat(2,288px);gap:4px 12px;width:auto!important;margin:0}
 .panel.vt{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:18px;align-items:start}
 .panel.vt>*{grid-column:1}.panel.vt>#rw{grid-column:2;grid-row:1/span 6;margin:0}.panel.vt #rw{gap:2px!important}.panel.vt #rw .it{font-size:30px;padding:2px}.panel.vt #rw b{font-size:16px}
 .panel.ky{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
 .panel.ky>.q,.panel.ky>.msg{grid-column:1/-1}.panel.ky>.msg{min-height:34px}
 .grid{max-width:300px;gap:6px;margin:6px auto}.cell{font-size:28px}
 .frame{margin:4px auto}
}

@media (min-aspect-ratio:3/2){
 .panel.nr{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:18px;align-items:start}
 .panel.nr>*{grid-column:1}.panel.nr>#ng{grid-column:2;grid-row:1/span 5;width:300px;margin:4px 0}
 .panel .g{min-height:62px!important;font-size:22px!important}
 .grid{max-width:250px}
 .zone{height:clamp(220px,calc(100vh - 372px),380px)}
}

@media (min-aspect-ratio:3/2){
 .panel.tr>canvas{max-width:none;width:min(440px,max(200px,calc(100vh - 185px)))}
 #thn{bottom:6px!important;padding:8px 16px!important;font-size:18px!important}
}

/* ===== すばやく いくつと いくつ ===== */
.hbar{height:12px;border-radius:8px;background:#e3ecf9;overflow:hidden;margin:6px auto;max-width:420px}
.hbar i{display:block;height:100%;width:100%;transform-origin:left center}
@keyframes hyt{0%{transform:scaleX(1);background:#2fb56a}60%{background:#ffc93c}100%{transform:scaleX(0);background:#ffc93c}}
.hdots{text-align:center;min-height:36px}.hnote{font-size:18px}
.hdt{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin:2px;border:3px solid var(--line);border-radius:50%;font-size:15px}
.hdt.half{background:#fff3c4;border-color:var(--yel)}.hdt.ok{background:#cdeed9;border-color:var(--grn)}
.hsum{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px}
.hch{padding:6px 12px;border:3px solid var(--line);border-radius:14px;font-size:20px;background:#fff}.hch.f{background:#cdeed9;border-color:var(--grn)}.hch.s{background:#fff3c4;border-color:var(--yel)}
#hp .btn{min-width:62px;height:58px;font-size:28px}
@media (min-aspect-ratio:3/2){
 .panel.hy{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px;grid-template-areas:"n n" "q q" "t p" "b f" "d d" "m m";align-items:start}
 .panel.hy>#hn{grid-area:n}.panel.hy>.q{grid-area:q}.panel.hy>#ht{grid-area:t;margin:0}.panel.hy>#hp{grid-area:p}.panel.hy>#hb{grid-area:b;width:100%}.panel.hy>#hyf{grid-area:f;margin:2px auto}.panel.hy>#hd{grid-area:d;min-height:34px}.panel.hy>.msg{grid-area:m;min-height:44px}
 .panel.hy .bx{width:54px;height:54px;font-size:30px}.panel.hy .tree svg{height:28px}
 #hp .btn{min-width:54px;height:46px;font-size:24px;margin:2px}
 .panel.hy .bx{width:48px;height:48px;font-size:28px}.panel.hy .tree svg{height:22px}
 .panel.hy .hdt{width:26px;height:26px;font-size:13px}
}

/* ===== かくして なんこ？：ひとつの おおきな てで まとめて かくす ===== */
.hgrp{position:relative;display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:14px 16px;min-width:124px;min-height:92px;animation:hdrop .5s cubic-bezier(.2,1.3,.4,1)}
.bhand{position:absolute;left:-4px;top:-10px;width:calc(100% + 8px);height:calc(100% + 16px);pointer-events:none;overflow:visible;filter:drop-shadow(0 4px 0 rgba(36,52,92,.25))}
.bhand *{vector-effect:non-scaling-stroke}
@keyframes hdrop{from{transform:translateY(-70px) rotate(-8deg);opacity:0}}
</style></head><body>
<header><button id="back" onclick="back()">◀ もどる</button><h1 id="ttl">かずのがいねん</h1><span style="flex:1"></span><button class="tg" id="tsn"></button><button class="tg" id="tvx"></button><button class="tg" id="trd">🔈 もういちど</button><button class="tg" id="thn" style="background:#ffc93c">💡 ヒント</button></header>
<main id="app"></main>
<div id="cb" style="display:none;position:fixed;left:0;right:0;bottom:0;gap:10px;align-items:center;justify-content:center;background:#fff;border-top:3px solid #24345c;padding:6px"></div>
<script>
const $=(s,e=document)=>e.querySelector(s), app=$('#app');
const R=n=>Math.floor(Math.random()*n), shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

const beam=(a,b,ms=700,h)=>{const p=rc(a),q=rc(b),x1=h?p.right:p.left+p.width/2,y1=h?p.top+p.height/2:p.bottom-6,x2=h?q.left:q.left+q.width/2,y2=h?q.top+q.height/2:q.top+6,L=Math.hypot(x2-x1,y2-y1),s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70';s.innerHTML=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-dasharray="${L}"/>`;s.classList.add('hzo');document.body.appendChild(s);s.firstChild.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:ms,easing:'ease-in-out',fill:'both'});later(()=>s.remove(),ms+400)};

 later(()=>{hl(Rr);beam(L,Rr,900,1)},600);later(()=>{L.classList.remove('hl');Rr.classList.remove('hl');L.click();Rr.click()},1800);later(()=>info(`${L.dataset.n}こと ${L.dataset.n}こ。かずが おなじ！`),2600)};

{const _k=HN.kakusu;HN.kakusu=()=>{const first=$('#pd')&&!$('#pd').children.length;_k();if(first)popIn($$('#hg'),250)}}

/* ===== すばやく いくつと いくつ（せいかくさ と はやさ を そだてる ドリル） =====
   ・1もんごとに こたえるまでの じかんを はかり、「ペアごと」に きろく（localStorage: kg_facts）
   ・はやい(4びょう いない)せいかい=+1、おそい せいかい=+0.5、まちがい=-1。どの ペアも 2に なったら そのかずは クリア
   ・ヒントを つかった もんだいは すすまない。こたえの ドットは ヒントを おすまで みえない */
const HY_FAST=4000,HY_NEED=2;
let FACTS={};try{FACTS=JSON.parse(localStorage.getItem(pk()+'_facts')||'{}')}catch(e){}
const saveF=()=>{try{localStorage.setItem(pk()+'_facts',JSON.stringify(FACTS))}catch(e){}};
function recFact(k,ok,ms,hinted){const f=FACTS[k]||(FACTS[k]={n:0,ok:0,fast:0,best:0,avg:0,t:0});f.n++;
 if(ok){f.ok++;if(ms<15000){f.avg=f.avg?Math.round(f.avg*.7+ms*.3):Math.round(ms);if(!f.best||ms<f.best)f.best=Math.round(ms);if(!hinted&&ms<=HY_FAST)f.fast++}}
 f.t=Date.now();saveF()}
function hayai(){curMod='hayai';cleanup();killTimers();
 const RQ=LIM<=5?[5]:LIM<=9?[6,7,8,9]:[10],BT=cur?RQ:[5,6,7,8,9,10];
 let N=BT[0],P={},cool={},sess={},last=0,t0=0,tmo=0,streak=0;
 const S={N,a:0,busy:true,hinted:false};window.HY=S;
 GATE=cur?{total:RQ.length,done:new Set()}:null;
 NEXTFN=()=>{if(cur&&GATE&&GATE.done.size>=GATE.total){const nb=document.getElementById('nxt');if(nb){nb.click();return}}
  const lf=GATE?RQ.filter(k=>!GATE.done.has(k)):[];start(lf.length?lf[0]:N)};
 const bx=(v,q)=>`<div class="bx${q?' q':''}">${v}</div>`;
 const dots=()=>{const d=$('#hd');if(d)d.innerHTML=Object.keys(P).map(a=>`<span class="hdt ${P[a]>=HY_NEED?'ok':P[a]>0?'half':''}">${a}</span>`).join('')};
 const next=()=>{const pend=Object.keys(P).map(Number).filter(a=>P[a]<HY_NEED);if(!pend.length)return fin();
  let pool=pend.filter(a=>a!=last&&!cool[a]);if(!pool.length)pool=pend.filter(a=>a!=last);if(!pool.length)pool=pend;
  Object.keys(cool).forEach(k=>{if(cool[k]>0)cool[k]--});
  const a=pool[R(pool.length)];last=a;S.a=a;S.N=N;S.hinted=false;
  $('#ht').innerHTML=bx(N)+'<svg viewBox="0 0 120 40" width="120" height="40"><path d="M60 2 L20 38 M60 2 L100 38" stroke="#24345c" stroke-width="4" fill="none"/></svg>'+`<div class="tb">${bx(a)}${bx('?',1)}</div>`;
  const f=$('#hyf');f.style.visibility='hidden';f.innerHTML=Array.from({length:N},(_,i)=>`<i class="${i<a?'a':'b'}" style="width:28px;height:28px"></i>`).join('');
  $$('#hp .btn').forEach(x=>x.classList.remove('hl'));
  const m=$('.msg');m.textContent='';m.className='msg';
  const bi=$('#hb i');bi.style.animation='none';void bi.offsetWidth;bi.style.animation=`hyt ${HY_FAST}ms linear forwards`;
  t0=performance.now();S.busy=false};
 const ans=(v)=>{if(S.busy||!S.a)return;S.busy=true;const a=S.a,b=N-a,ms=performance.now()-t0,ok=v==b,key=N+':'+a,m=$('.msg'),hinted=S.hinted;
  $('#hb i').style.animationPlayState='paused';
  if(ok){const fast=ms<=HY_FAST;recFact(key,true,ms,hinted);
   if(!hinted){(sess[a]=sess[a]||[]).push(ms);P[a]+=fast?1:.5;streak=fast?streak+1:0}else{streak=0;cool[a]=1}
   sfx('ok');m.textContent=hinted?'ヒントを つかったから、もういちど でるよ':fast?'⚡ はやい！':'せいかい！ つぎは もっと はやく';m.className='msg pop';
   if(fast&&!hinted&&streak>=3)burst(m);
   tmo=setTimeout(next,hinted?1200:fast?650:1000)}
  else{recFact(key,false,ms,hinted);P[a]=Math.max(0,P[a]-1);cool[a]=2;streak=0;sfx('ng');
   $('#hyf').style.visibility='visible';const bt=$(`#hp [data-p="${b}"]`);if(bt)bt.classList.add('hl');
   m.textContent=`${N} は ${a} と ${b}。ドットで たしかめよう`;m.className='msg ng shake';speak(`${N}は ${a}と ${b}`,{ch:'fb'});
   tmo=setTimeout(next,2400)}
  dots()};
 const fin=()=>{S.busy=true;clearTimeout(tmo);prog.hy=prog.hy||{};prog.hy[N]=1;saveP();
  const rows=Object.keys(P).map(Number).map(a=>{const t=sess[a]||[];return{a,avg:t.length?t.reduce((x,y)=>x+y,0)/t.length:0}}),
   slow=rows.filter(r=>r.avg>HY_FAST).sort((x,y)=>y.avg-x.avg).slice(0,3),fz=r=>r.avg&&r.avg<=HY_FAST;
  $('#ht').innerHTML=`<div class="hsum">${rows.map(r=>`<span class="hch ${fz(r)?'f':'s'}">${r.a}と${N-r.a}${fz(r)?' ⚡':''}</span>`).join('')}</div>`;
  $('#hb').style.visibility='hidden';
  $('#hd').innerHTML=`<span class="hnote">${slow.length?'もうすこし： '+slow.map(r=>`${r.a}と${N-r.a}`).join('、'):'ぜんぶ はやかった！ ⚡'}</span>`;
  if(GATE&&RQ.includes(N))gateOk(N);
  $$('#hn [data-n]').forEach(x=>x.classList.toggle('dn',!!(GATE&&GATE.done.has(+x.dataset.n))));

  say(`ぜんぶ できたよ！ ${N}の いくつと いくつ${lf?'。つぎの かずも やってみよう':''}`)};
 const start=n=>{clearTimeout(tmo);N=n;P={};cool={};sess={};last=0;streak=0;S.busy=true;S.a=0;S.N=N;
  for(let a=1;a<N;a++)P[a]=0;
  app.innerHTML=`<div class="panel hy"><div class="nums" id="hn">${BT.map(k=>`<button class="btn ${k==N?'on':'alt'}${(GATE&&GATE.done.has(k))?' dn':''}" data-n="${k}">${k}</button>`).join('')}</div>
  <p class="q">いくつと いくつ？ はやく こたえよう</p>
  <div class="tree" id="ht"></div><div class="hbar" id="hb"><i></i></div>
  <div class="nums" id="hp">${padH(0,N)}</div><div class="frame" id="hyf" style="visibility:hidden;grid-template-columns:repeat(5,28px)"></div>
  <div class="hdots" id="hd"></div><div class="msg"></div></div>`;
  $('#hn').onclick=e=>{const b=e.target.closest('[data-n]');if(b)start(+b.dataset.n)};
  $('#hp').onclick=e=>{const b=e.target.closest('[data-p]');if(b)ans(+b.dataset.p)};
  dots();next()};
 cleanup=()=>{clearTimeout(tmo);window.HY=null;NEXTFN=null};
 start(N)}
