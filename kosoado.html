<!DOCTYPE html>
<!--
こそあど言葉マスター(単一HTML・外部ファイルなし) 記録: Phase 8 = おうようへん追加＋読み上げ(2026-11-12) ／ Phase 7 完了
問題: 91問(RAW=[系列,根拠0〜3,物,文,place])。新しい問題は RAW の末尾に足す(IDが通し番号のため)
根拠 0=話し手の近く 1=聞き手の近く 2=遠い 3=たずねる
place(省略=ground): hand(手に持つ) desk・shelf(へや) window(窓の外・根拠2) fold・roll・cut(やり方の実演・根拠0/1) kidfold・kidplane(遠くの子・根拠2) wide(両腕で大きさ・根拠0/1) trio(同じ物3つ・根拠0〜2)
Phase 7: 敵対的レビュー修正(保存データ検証・修飾キー・消去の二度押し・aria-live)／島の動き(くも・波・やし・かもめ)／れんぞく／くじら=きょうのラッキーもんだい案内(start('lucky'))・ふね=つづきから／たからばこ開封・メダル／手触り(入場・さざ波・ことばが空欄へ飛ぶ・振動)／金カード(pf=直近ノーミス・ノーヒント。もう一度れんしゅうの対象から外れる)／場面の雲・ちょうちょ
確認: ?dev=1 で検証結果／#gallery で全場面の一覧(左右反転・ヒント0〜3の切りかえ)
動き: reduced() のとき止めて、静止した完成形を出す。縦画面(PORT)の viewBox は 100 -96 600 496
おうようへん: ADV=[題名,場面,人物,物,会話,空欄](末尾に足す) advScene(話者ごとに指さし・はねる)・advStart/advPick・validateAdv。成績は P.adv。
読み上げ: TTS(warm=無音ウォームアップ/say/stop)・yomi()と YOMI(読み直し辞書。読み違いを見つけたら1行足す)。P.tts=false でオフ。
主な関数: renderScene(場面) person・gArm(人物と腕) PDEMO・KID・TRIO(実演) ROOM・ROOM_W・DESK・SHELF(へや) validateQuestionBank(検証)
-->

.msg>span:first-child{flex:1 1 12em;min-width:0}.msg>span:last-child{flex:none;white-space:nowrap}
.gcard{max-width:44%}
@media(max-width:620px){.zbar{display:grid;grid-template-columns:repeat(4,1fr)}}
/* ことばの一覧: せまい・縦長のときは「表 → 見本」と縦に並べてスクロール */
@media(max-aspect-ratio:1/1),(max-width:599px){
 .lst{display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;gap:10px;padding:0 2px 4px}
 .tbl{flex:none;overflow:visible}
 .tg{height:auto;grid-template-columns:minmax(0,1.1fr) repeat(4,minmax(0,1fr));grid-template-rows:auto repeat(8,clamp(40px,5.6vh,54px))}
 .tg .rh{padding:0 .35em;font-size:clamp(11px,3.1vw,16px)}
 #demo svg{max-height:none}
 .cell{font-size:clamp(13px,3.4vw,24px)}
 .demo{flex:none;overflow:visible}
 #demo{width:min(100%,640px);align-self:center}
}
/* 縦長: 見出しは全幅、ずかんのカードは縦並び */
@media(max-aspect-ratio:1/1){
 .hd .meter{flex:1 1 100%;min-width:0}
 .logo{font-size:clamp(20px,7.4vw,56px)}
 .zg2{--zr:76px;gap:6px}
 .zt{flex-direction:column;gap:2px;padding:3px 4px;border-bottom-width:5px;font-size:clamp(13px,min(3.4vw,4.2vh),22px)}
 .zi{width:min(54cqh,72cqw)}
 .zt.lk .zi{width:min(40cqh,60cqw)}
}
/* 低い画面(スマホ横など): 余白を詰める */
@media(max-height:520px){
 .hd .sub{display:none}
 .logo{font-size:clamp(20px,8vh,34px)}
 .msg{min-height:2.6em}
 .zc{min-height:2.4em;padding:.15em .6em}
 .big{font-size:clamp(24px,8vh,40px)}
 #dtx p{margin:1px 0;font-size:clamp(12px,3.2vh,16px)}
 .dbtn{gap:6px}.dbtn .btn{font-size:12px;padding:.2em .6em}
 #demo svg{max-height:30vh}
}
@media(max-height:420px){
 .nx{display:none}
 .ft{row-gap:6px}.ft .btn{padding:.28em .6em;box-shadow:0 3px 0 var(--ink)}.ft .btn.pri{padding:.32em .8em}
}
/* ===== Phase 7: 島の動き・おまけ ===== */
.dr{animation:dr 9s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(26px)}}
.wv{animation:wv 3.2s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(7px)}}
.psw{transform-box:fill-box;transform-origin:50% 100%;animation:psw 3.2s ease-in-out infinite alternate}@keyframes psw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.gl{pointer-events:none;animation:gl 16s linear infinite}@keyframes gl{from{transform:translateX(-70px)}to{transform:translateX(900px)}}
.fw{transform-box:fill-box;transform-origin:50% 100%;animation:fw .45s ease-in-out infinite alternate}@keyframes fw{to{transform:scaleY(.4)}}
.whl{cursor:pointer}.wb{animation:wbob 2.6s ease-in-out infinite alternate}@keyframes wbob{from{transform:translateY(5px)}to{transform:translateY(1.5px)}}
.sp,.spc{transform-box:fill-box;transform-origin:50% 100%}.sp{opacity:0}.whl.on .wb{animation:wjump .55s ease-out}.whl.on .sp{animation:sp 1.1s .1s ease-out both}.spc{animation:sp 1.7s ease-out infinite}
@keyframes wjump{0%{transform:translateY(4px)}40%{transform:translateY(-12px)}100%{transform:translateY(4px)}}@keyframes sp{0%{opacity:1;transform:translateY(10px) scaleY(.2)}55%{opacity:1;transform:translateY(-4px) scaleY(1)}100%{opacity:0;transform:translateY(-10px)}}
.lkb{font-size:inherit;padding:.05em .8em;background:linear-gradient(#FFF6CF,#FFE27A)}
.gem{transform-box:fill-box;transform-origin:center;animation:gem 1.1s cubic-bezier(.2,.8,.3,1) both,gb 1.4s 1.1s ease-in-out infinite alternate}
@keyframes gem{0%{transform:translateY(14px) scale(0);opacity:0}55%{transform:translateY(-40px) scale(1.25);opacity:1}100%{transform:translateY(-24px) scale(1);opacity:1}}@keyframes gb{from{transform:translateY(-24px)}to{transform:translateY(-30px)}}
.med{transform-box:fill-box;transform-origin:center;animation:med 1s cubic-bezier(.2,.8,.3,1) both}@keyframes med{0%{transform:scale(0) rotate(-200deg)}100%{transform:none}}
.toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:9;pointer-events:none;white-space:nowrap;background:#FFF3C9;border:3px solid var(--ink);border-radius:999px;padding:.25em 1em;font-weight:800;font-size:clamp(14px,2.6vw,26px);box-shadow:0 4px 0 var(--ink);animation:toast 2.2s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.lkw{color:var(--far);font-size:1.12em}
/* ===== Phase 7.1: 手触り・見た目 ===== */
.btn{overflow:hidden}.tg button,.zb,button.zt{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:rp .5s ease-out forwards}@keyframes rp{from{transform:scale(0);opacity:.28}to{transform:scale(1);opacity:0}}
.fly{position:fixed;z-index:50;pointer-events:none;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:.15em .7em;font-weight:800;font-size:clamp(16px,3vw,30px);box-shadow:0 4px 0 var(--ink),0 8px 14px rgba(30,42,58,.25)}
.stage{isolation:isolate}.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;border-radius:inherit;box-shadow:inset 0 0 38px rgba(30,42,58,.14)}
.bar i{background-size:28.28px 28.28px;animation:stp 1.2s linear infinite}@keyframes stp{to{background-position-x:28.28px}}
#go{animation:brt 2.4s ease-in-out infinite}@keyframes brt{50%{filter:brightness(1.1) saturate(1.15)}}
.isl:active .hv{transform:scale(.95)}.zt:not(.lk):active{transform:scale(.96)}
.zt.gold{border-color:#E0A21B;background:linear-gradient(#FFFBE3,#FFE9A0);box-shadow:0 0 0 2px rgba(242,182,50,.45),0 4px 10px rgba(242,182,50,.35)}
.zt.gold::after{content:"";position:absolute;inset:-20% -60%;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%);transform:translateX(-70%);animation:foil 3.8s ease-in-out infinite}
.zg2 .zt.gold:nth-child(3n)::after{animation-delay:-1.3s}.zg2 .zt.gold:nth-child(3n+1)::after{animation-delay:-2.6s}
@keyframes foil{0%,55%{transform:translateX(-70%)}100%{transform:translateX(70%)}}
.bf{animation:bf 18s linear infinite}@keyframes bf{0%{transform:translate(-40px,0)}25%{transform:translate(220px,-28px)}50%{transform:translate(480px,8px)}75%{transform:translate(740px,-24px)}100%{transform:translate(900px,0)}}
.wf{transform-box:fill-box;transform-origin:50% 50%;animation:wf .22s ease-in-out infinite alternate}@keyframes wf{to{transform:scaleX(.35)}}

/* ===== おうようへん ===== */
.adg{position:relative;z-index:2;flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 10px 6px;overflow:auto;max-height:54%;background:#EAF4FB}
.al{display:flex;flex-shrink:0;align-items:flex-start;gap:8px;max-width:94%;animation:pop .5s both;font-size:clamp(15px,min(2.5vw,4.2vh),27px);font-weight:700;line-height:1.55}
.al.lb{flex-direction:row-reverse;align-self:flex-end}
.al>span{background:#fff;border:3px solid var(--c);border-radius:16px;padding:.15em .7em;box-shadow:0 3px 0 rgba(30,42,58,.15)}
.al .an{flex:none;color:#fff;background:var(--c);border-radius:12px;padding:.1em .6em;font-size:.68em;align-self:center}
.al.on>span{background:#FFFBE6;box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 28%,transparent)}
.fl2{color:var(--li);border-bottom:4px solid var(--li);padding:0 .15em}
.blk2{display:inline-block;min-width:1.5em;text-align:center;color:#aaa;border-bottom:4px dotted #bbb}
.stage svg{min-height:110px}
.bn{animation:bn .7s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-9px)}}
.dsh{animation:dsh 1s linear infinite}@keyframes dsh{to{stroke-dashoffset:-24}}
.rn{animation:rn .7s linear infinite}@keyframes rn{from{transform:none;opacity:1}to{transform:translate(-12px,46px);opacity:0}}
.fk{transform-box:fill-box;transform-origin:center;animation:fwk 2.4s ease-out infinite}@keyframes fwk{0%{transform:scale(.1) rotate(0);opacity:1}100%{transform:scale(1.1) rotate(25deg);opacity:0}}
.sun{transform-box:fill-box;transform-origin:center;animation:sunr 14s linear infinite}@keyframes sunr{to{transform:rotate(360deg)}}
.st{animation:stk 1.8s ease-in-out infinite}@keyframes stk{50%{opacity:.25}}

/* ===== 出題中の演出(人物のリアクション・選択肢の入場) ===== */
.ps{transform-box:fill-box;transform-origin:50% 100%}
.cheer .ps{animation:jmp .75s ease-out both}.cheer svg>g:nth-of-type(n) .ps{animation-delay:0s}
@keyframes jmp{0%{transform:none}25%{transform:translateY(-30px) scale(.94,1.08)}50%{transform:translateY(0) scale(1.08,.9)}70%{transform:translateY(-10px)}100%{transform:none}}
.sad .ps{animation:hsk .6s ease-in-out both}
@keyframes hsk{0%,100%{transform:none}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.choices .btn:not(.bad):not(.good){animation:pop .45s both}
.choices .btn:nth-child(2){animation-delay:.06s!important}.choices .btn:nth-child(3){animation-delay:.12s!important}.choices .btn:nth-child(4){animation-delay:.18s!important}
@media(hover:hover){.choices .btn:not(:disabled):hover{transform:translateY(-3px) rotate(-1.2deg)}}

 if(ph)g+=[ax,bx].map(x=>{const d=x<400?1:-1,me=x===sx;return `<g transform="translate(${x+d*30} 202) rotate(${d*14})"><rect x="-9" y="-26" width="18" height="52" rx="6" fill="#2B3445" stroke="${C.ink}" stroke-width="2.5"/><rect x="-6" y="-21" width="12" height="38" rx="2.5" fill="${me?'#FFF3B0':'#8FD3FF'}"/><circle cy="21.5" r="2" fill="#8FD3FF"/></g><circle cx="${x+d*24}" cy="214" r="6" fill="${SK}" stroke="${C.ink}" stroke-width="2"/><path class="${me?'st':''}" d="M${x+d*48} 190q${d*9} 12 0 24M${x+d*58} 183q${d*14} 19 0 38" fill="none" stroke="${me?sc:'#9AA7B8'}" stroke-width="3.5" stroke-linecap="round"/>`}).join('');
 q.objs.forEach(([t,k,c,s])=>{if(q.demo==='fold'&&t==='paper'){const performer=li===0?'a':'b',x=performer==='a'?ax:bx;g+=PDEMO('fold',x,258,.9,performer==='a'?C.sp:C.li,x<400?1:-1);return}const[x,y]=PS[k];g+=ic(t,x,y,s||1,c||C.far,'pop')});
 if(h>=1&&tg)g+=`<path class="dsh" d="M${sx} 176Q${(sx+tg[0])/2} ${Math.min(176,tg[1])-50} ${tg[0]} ${tg[1]-48}" fill="none" stroke="${sc}" stroke-width="6" stroke-dasharray="1 12" stroke-linecap="round"/>`;

 $('#bk').onclick=menu;if($('#rdq'))$('#rdq').onclick=()=>{const q=S.queue[S.i],li=S.bi>=q.bk.length?q.lines.length-1:q.bk[S.bi].li;TTS.say(q.lines.slice(0,li+1).map((_,k)=>advIt(q,k)),1)};$('#ahb').onclick=advHint;$('#anx').onclick=()=>{S.i++;advShow()};advDraw();TTS.say(q.lines.slice(0,q.bk[0].li+1).map((_,k)=>advIt(q,k)));if(S.i)SFX.pop()}

 document.querySelectorAll('#ach .btn').forEach(b=>b.onclick=()=>advPick(b));const a=$('#sc .adg');if(a)a.scrollTop=a.scrollHeight;if(hadFocus){const buttons=[...document.querySelectorAll('#ach .btn:not(:disabled)')];(buttons.find(b=>b.dataset.w===focusWord)||buttons[0])?.focus()}}

 {const m='ヒント'+S.h+'：'+(S.h<2?'いま 話している 人は だれかな？ はねている 人と ふきだしの 色を 見よう。':b.h);$('#msg').textContent=m;TTS.say([[m,1,.9]])}advDraw();if(S.h>=2)$('#ahb').disabled=true}

  setTimeout(()=>{if(CUR!=='adv'||S!==session||S.queue[S.i]!==q)return;S.lock=0;S.mc=0;S.bad=[];const nb=q.bk[S.bi],nl=nb?nb.li:q.lines.length-1,it=[];if(!nb||nb.li!==b.li)it.push(advIt(q,b.li));for(let k=b.li+1;k<=nl;k++)it.push(advIt(q,k));if(it.length)TTS.say(it);if(S.bi>=q.bk.length)return advDone();S.ch=shuffle(WORD_SETS[q.bk[S.bi].f]);$('#ahb').disabled=false;advDraw()},430)}

/* ===== 読み上げ(Web Speech API) =====
 遅れ対策: 起動時にvoicesを先読みし、最初の操作で音量0の発話を1回流してエンジンを温める。声は一度だけ選んで使い回す。
 読み間違い対策: 読み上げる文は必ず yomi() を通す(漢字の読み・記号・空欄を直す)。読みを足すときは YOMI に1行足す */
const YOMI=[[/校長室/g,'こうちょうしつ'],[/三百円/g,'さんびゃくえん'],[/一つ/g,'ひとつ'],[/一しょ/g,'いっしょ'],[/花火/g,'ハナビ'],[/花/g,'ハナ'],[/晴れ/g,'ハレ'],[/箱/g,'ハコ'],[/初めて/g,'ハジメテ'],[/見え/g,'みえ'],[/四時/g,'よじ'],[/入口/g,'いりぐち'],[/お店/g,'おみせ'],[/木かげ/g,'こかげ'],[/日なた/g,'ひなた'],[/手洗い/g,'てあらい'],[/(?<![一-龥])本/g,'ほん'],[/方向/g,'ほうこう'],[/方/g,'ほう'],[/何て/g,'なんて'],[/何/g,'なに'],[/上/g,'うえ'],[/中/g,'なか'],[/外/g,'そと'],[/家/g,'いえ'],[/席/g,'せき'],[/受付/g,'うけつけ'],[/空/g,'そら'],[/行([くこけっき])/g,'い$1'],[/来て/g,'きて'],[/[①-④]/g,'はてな'],[/[「」『』()（）・]/g,'、'],[/[ 　]+/g,' ']];
/* 語頭の「は」は「わ」と読まれたり助詞と間違われたりするので、文節の頭の「は＋次の1字」をカタカナにする(ハしを→ハシを) */
const haKata=s=>s.replace(/(^|[ 、。！？])は([ぁ-ん])/g,(m,p,c)=>p+'ハ'+String.fromCharCode(c.charCodeAt(0)+96));
const yomi=t=>haKata(YOMI.reduce((s,[a,b])=>s.replace(a,b),String(t)).trim());
const TTS=(()=>{const ss=window.speechSynthesis,ok=!!ss&&typeof SpeechSynthesisUtterance==='function';let v=null,warm=false,tk=0;
 const pick=()=>{if(!ok)return null;if(v)return v;const l=ss.getVoices().filter(x=>/^ja/i.test(x.lang));return v=l.find(x=>/kyoko|nanami|haruka|sayaka|o-ren|otoya|google/i.test(x.name))||l.find(x=>x.localService)||l[0]||null};
 const mk=(t,p,r,vol)=>{const x=new SpeechSynthesisUtterance(t),w=pick();x.lang='ja-JP';if(w)x.voice=w;x.rate=r||.9;x.pitch=p||1;x.volume=vol==null?1:vol;return x};
 const T={ok,
  warm(){if(!ok||warm)return;try{const x=mk('あ',1,2,0);x.onstart=()=>{warm=true};ss.speak(x)}catch(e){}},
  say(items,force){if(!ok||(P.tts===false&&!force))return;try{const vs=ss.getVoices();if(vs.length&&!pick())return;const my=++tk;ss.cancel();ss.resume&&ss.resume();
   setTimeout(()=>{if(my!==tk)return;items.forEach(([t,p,r])=>{const s=yomi(t);if(s)ss.speak(mk(s,p,r))})},40)}catch(e){}},
  stop(){tk++;try{ok&&ss.cancel()}catch(e){}}};
 if(ok){ss.onvoiceschanged=()=>{v=null;pick()};pick();T.warm();['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>T.warm(),true))}
 return T})();
const readQ=(q,f)=>TTS.say([[q.sentence.replace('{b}','はてな'),1,.85]],f);
const advIt=(q,k)=>[q.lines[k][1].replace(/\{(\d)\}/g,(_,d)=>S.fill[d-1]||'はてな'),q.lines[k][0]==='a'?.95:1.35,.88];
const rdBtn=()=>TTS.ok?'<button class="btn" id="rdq">よむ</button>':'';

 const dr=()=>{$('#gal').innerHTML=QUESTION_BANK.map(q=>`<figure><figcaption>${q.id}　${q.answer}　${q.scene.target.place}</figcaption>${renderScene(q,!!fl,hl,q.answer,null)}</figure>`).join('');$('#gf').textContent='左右反転: '+(fl?'あり':'なし');$('#gh').textContent='ヒント: '+hl};
 app.innerHTML=`<div class="galwrap"><div class="galbar"><button class="btn" id="gf"></button><button class="btn" id="gh"></button><span>全${QUESTION_BANK.length}問／検証 ${ERR.length?'NG '+ERR.length+'件':'OK'}</span></div><div id="gal" class="gal"></div></div>`;
 $('#gf').onclick=()=>{fl^=1;dr()};$('#gh').onclick=()=>{hl=(hl+1)%4;dr()};dr()}

else title();
