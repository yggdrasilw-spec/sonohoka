<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大きい数ラボ｜教科書92〜105ページ v13 敵対レビュー強化版</title>
<style>
  :root{
    --green:#2f855a; --green2:#3fa574; --greenSoft:#eaf7ef;
    --blue:#2b6cb0; --blueSoft:#eaf2fb; --orange:#c56a13; --orangeSoft:#fff4e7;
    --red:#c53030; --redSoft:#fff0f0; --ink:#25313b; --muted:#687681;
    --line:#d9e0e5; --bg:#f7f7f3; --card:#fff; --shadow:0 4px 18px rgba(25,40,52,.08);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.6}
  button,input,select{font:inherit}
  button{touch-action:manipulation}
  .app{min-height:100vh}
  header{background:linear-gradient(135deg,#2f855a,#3fa574);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .headInner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .titleWrap{min-width:240px;flex:1}
  h1{font-size:1.25rem;margin:0;letter-spacing:.02em}
  .subtitle{font-size:.78rem;opacity:.92}
  .headTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .topBtn{border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:7px 10px;cursor:pointer}
  .topBtn[aria-pressed="true"]{background:#fff;color:var(--green)}
  .shell{max-width:1100px;margin:0 auto;padding:14px}
  .navCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);margin-bottom:12px}
  .stageNav{display:grid;grid-template-columns:repeat(10,minmax(70px,1fr));gap:6px}
  .stageBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 5px;cursor:pointer;color:var(--ink);min-height:54px}
  .stageBtn .p{font-size:.69rem;color:var(--muted);display:block}
  .stageBtn .n{font-size:.76rem;font-weight:700;display:block;line-height:1.25}
  .stageBtn.active{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--greenSoft);background:#fbfffc}
  .stageBtn.done::after{content:"✓";display:inline-block;margin-left:4px;color:var(--green);font-weight:800}
  .progressRow{display:flex;gap:10px;align-items:center;margin-top:9px;font-size:.82rem;color:var(--muted)}
  .bar{height:8px;background:#edf1f3;border-radius:999px;overflow:hidden;flex:1}
  .bar>span{display:block;height:100%;background:var(--green2);width:0;transition:width .25s}
  main{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-height:560px}
  .stageHead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
  .stageHead h2{margin:0;font-size:1.2rem}
  .stageHead .goal{font-size:.88rem;color:var(--muted);margin-top:3px;max-width:760px}
  .pageBadge{background:var(--greenSoft);color:var(--green);border-radius:999px;padding:5px 10px;font-weight:700;font-size:.8rem;white-space:nowrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid2>* ,.grid3>*{min-width:0}
  .panel{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
  .panel.soft{background:#fbfcfd}
  .panel h3{margin:0 0 9px;font-size:1rem}
  .prompt{font-size:1.1rem;font-weight:700;margin:8px 0 14px}
  .bigNumber{font-size:2rem;font-weight:800;letter-spacing:.04em;text-align:center;margin:12px 0}
  .numRead{text-align:center;color:var(--muted);font-size:.95rem;margin-top:-8px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn{border:none;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;min-height:44px}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.green{background:var(--green);color:#fff}
  .btn.orange{background:var(--orange);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--redSoft);color:var(--red);border:1px solid #f2c9c9}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .answerInput{width:min(220px,100%);padding:9px 10px;border:2px solid #b8c3cb;border-radius:9px;font-size:1rem;background:#fff}
  .answerInput:focus{outline:3px solid #d9ebff;border-color:var(--blue)}
  .answerInput.ok{border-color:var(--green);background:var(--greenSoft)}
  .answerInput.ng{border-color:var(--red);background:var(--redSoft)}
  .feedback{min-height:30px;margin-top:10px;font-weight:700}
  .feedback.ok{color:var(--green)} .feedback.ng{color:var(--red)} .feedback.info{color:var(--blue)}
  .hint{display:none;margin-top:12px;padding:11px 12px;background:var(--orangeSoft);border-left:4px solid var(--orange);border-radius:8px;font-size:.92rem}
  .hint.show{display:block}
  .choices{display:flex;gap:8px;flex-wrap:wrap}
  .choice{border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;min-height:44px}
  .choice.selected{border-color:var(--blue);background:var(--blueSoft)}
  .choice.correct{border-color:var(--green);background:var(--greenSoft)}
  .choice.wrong{border-color:var(--red);background:var(--redSoft)}
  .miniNote{font-size:.82rem;color:var(--muted)}
  .keyIdea{background:var(--greenSoft);border-left:4px solid var(--green);padding:10px 12px;border-radius:8px;margin:12px 0;font-weight:700}
  .footerNav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}

  /* place value */
  .pvScroll{overflow-x:auto;padding-bottom:4px}
  .pvTable{display:grid;grid-template-columns:repeat(9,minmax(74px,1fr));min-width:720px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pvCell{border-right:1px solid var(--line);min-height:112px;padding:8px;text-align:center;background:#fff}
  .pvCell:last-child{border-right:0}
  .pvName{font-size:.72rem;color:var(--muted);min-height:35px}
  .pvDigit{font-size:1.4rem;font-weight:800;margin:5px 0}
  .pvCount{font-size:.78rem;color:var(--muted)}
  .pvCell.hot{background:var(--orangeSoft)}
  .bundleBtn{margin-top:5px;border:1px solid #e7c291;background:#fff8ef;color:#8b4c0c;border-radius:8px;padding:5px 6px;font-size:.74rem;cursor:pointer}
  .tokenBox{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .token{border:1px solid #aab6be;background:#fff;border-radius:8px;padding:6px 8px;font-weight:700}
  .tokenControls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .smallBtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 6px;cursor:pointer;font-size:.82rem}

  /* number line */
  .numberlineWrap{overflow-x:auto}
  .nlLearningGrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.72fr);gap:12px;align-items:start}
  .nlVisualPanel{min-width:0}
  .nl{position:relative;min-width:640px;height:165px;margin:4px 0 6px}
  .nl svg{width:100%;height:100%;display:block}
  .nlLabel{position:absolute;transform:translateX(-50%);top:30px;font-size:.78rem;white-space:nowrap;color:#49545c}
  .nlMark{position:absolute;transform:translateX(-50%);top:96px;text-align:center;font-size:.8rem;font-weight:700;color:var(--green)}
  .nlMark .tri{font-size:1.15rem;line-height:1}
  .nlClickArea{position:absolute;left:4%;right:4%;top:58px;height:72px;cursor:crosshair}
  .nlClickArea.locked{pointer-events:none;cursor:not-allowed;background:rgba(120,130,140,.04);border-radius:10px}
  .zoomPair{display:grid;grid-template-columns:1fr;gap:5px}
  .zoomLink{text-align:center;color:var(--muted);font-size:.78rem;margin:-5px 0}
  .nlStepGuide{margin-top:5px;padding:8px 10px;border:1px solid #e7b2b2;border-radius:11px;background:#fffafa}
  .nlStepGuide.confirmed{border-color:#9dd4b4;background:#f6fff9}
  .nlStepCaption{text-align:center;color:#b42318;font-size:.74rem;font-weight:900;line-height:1.25;margin-bottom:5px}
  .nlStepGuide.confirmed .nlStepCaption{color:#166534}
  .nlStepRow{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
  .nlStepRow strong{font-size:.95rem}
  .nlStepInput{width:118px;padding:6px 8px;border:2px solid #df7676;border-radius:9px;text-align:center;font-size:1.05rem;font-weight:800}
  .nlStepInput.ok{border-color:var(--green);background:var(--greenSoft)}
  .nlStepInput.ng{border-color:var(--red);background:var(--redSoft)}
  .nlStepFeedback{min-height:20px;margin-top:4px;text-align:center;font-size:.78rem;font-weight:800}
  .nlStepGuide.confirmed .nlStepRow{display:none}
  .nlConceptPanel{border:1px solid #d5dfec;border-radius:12px;background:#f8fbff;padding:11px;min-height:160px}
  .nlConceptPanel h4{margin:0 0 7px;font-size:.92rem;color:#24407f}
  .nlConceptLead{font-size:.84rem;font-weight:800;line-height:1.55;margin-bottom:8px}
  .nlConceptEquation{padding:7px 9px;border-radius:9px;background:#eef4ff;color:#1f3f8f;font-weight:900;text-align:center;margin:7px 0}
  .nlConceptPanel .pveHead{min-height:34px;font-size:.7rem}
  .nlConceptPanel .pveDigit{height:44px;font-size:1.35rem}
  .nlConceptPanel .pveSub{display:none}
  .nlMainTask{margin-top:10px;padding-top:10px;border-top:1px solid #e3e8ec}
  .nlMainTask.locked{opacity:.42;pointer-events:none;filter:grayscale(.2)}
  .nlSupport{margin-top:10px;padding:10px 11px;border:1px solid #e5c585;border-radius:11px;background:#fffaf0;font-size:.86rem;line-height:1.65}
  .nlSupport strong{color:#8b4c0c}
  .nlWalkControls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .nlWalkValue{min-width:130px;text-align:center;padding:7px 9px;border-radius:9px;background:#fff;border:1px solid #d9e0e5;font-size:1rem;font-weight:900}
  .nlWalkControls .btn{min-height:38px;padding:7px 11px}
  .nlInlineNote{text-align:center;font-size:.75rem;color:var(--muted);margin-top:5px}

  /* p102-103: stepwise place-shift lab */
  .shiftLesson{position:relative;padding-bottom:76px;min-width:0;max-width:100%}
  .shiftModeBar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .shiftModeBtn{border:2px solid #cbd3d9;background:#fff;color:#34414a;border-radius:10px;padding:8px 12px;min-height:42px;font-weight:900;cursor:pointer}
  .shiftModeBtn.active{border-color:var(--blue);background:var(--blueSoft);color:#1f5f99}
  .shiftModeBtn.done::after{content:' ✓';color:var(--green)}
  .shiftTarget{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid #d9e0e5;border-radius:11px;background:#fbfcfd;margin-bottom:10px}
  .shiftTarget strong{font-size:1.1rem}
  .shiftRepeat{font-size:.8rem;color:#56636d;font-weight:800;background:#eef4ff;border-radius:999px;padding:5px 9px}
  .shiftDemoEquation{text-align:center;font-size:clamp(1.15rem,2.5vw,1.55rem);font-weight:900;margin:8px 0;color:#25313b;min-height:38px}
  .shiftBoard{overflow-x:auto;padding-bottom:4px;min-width:0;max-width:100%}
  .shiftAnimTable{min-width:700px;border:2px solid #7f878e;border-radius:12px;overflow:hidden;background:#fff}
  .shiftHeaderRow,.shiftDataRow{display:grid;grid-template-columns:66px minmax(630px,1fr)}
  .shiftRowTag{display:flex;align-items:center;justify-content:center;padding:6px;font-size:.78rem;font-weight:900;color:#52606a;background:#f3f5f7;border-right:1px solid #aeb6bd}
  .shiftHeads{display:grid;grid-template-columns:repeat(8,1fr)}
  .shiftHead{padding:7px 2px;text-align:center;border-right:1px solid #aeb6bd;font-size:.7rem;color:#4e5962;min-height:44px;font-weight:800;background:#fafbfc}
  .shiftHead:nth-child(4){border-right:5px solid #697078}
  .shiftHead:last-child{border-right:0}
  .shiftRail{position:relative;height:72px;border-top:1px solid #cbd2d8;background:linear-gradient(to right,transparent 12.35%,#d7dde1 12.5%,transparent 12.65%) 0 0/12.5% 100%}
  .shiftDataRow + .shiftDataRow .shiftRail,.shiftDataRow + .shiftDataRow .shiftRowTag{border-top:1px solid #cbd2d8}
  .shiftDigitCard{position:absolute;top:13px;transform:translateX(-50%);width:44px;height:44px;border-radius:9px;border:2px solid var(--pveStroke,#87949d);background:var(--pveBg,#fff);color:var(--pveText,#25313b);display:flex;align-items:center;justify-content:center;font-size:1.55rem;font-weight:900;transition:left .62s cubic-bezier(.25,.1,.2,1),opacity .32s,transform .62s cubic-bezier(.25,.1,.2,1);box-shadow:0 2px 5px rgba(31,41,55,.08)}
  .shiftDigitCard.ghost{opacity:.28;box-shadow:none}
  .shiftDigitCard.newZero{animation:shiftZeroIn .42s ease}
  @keyframes shiftZeroIn{from{opacity:0;transform:translateX(-50%) scale(.45)}to{opacity:1;transform:translateX(-50%) scale(1)}}
  .shiftStepExplain{margin-top:9px;padding:9px 11px;border-left:4px solid var(--blue);border-radius:8px;background:#f7fbff;font-size:.88rem;font-weight:800;line-height:1.6;min-height:48px}
  .shiftProgressDots{display:flex;justify-content:center;gap:7px;margin:8px 0 1px}
  .shiftProgressDot{width:12px;height:12px;border-radius:50%;border:2px solid #9aa6ae;background:#fff}
  .shiftProgressDot.done{background:var(--green);border-color:var(--green)}
  .shiftProgressDot.current{box-shadow:0 0 0 3px rgba(43,108,176,.16);border-color:var(--blue)}
  .shiftFloatingControls{position:fixed;right:16px;bottom:14px;z-index:9500;display:flex;align-items:center;gap:7px;padding:7px;border:1px solid #cdd6dc;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 6px 22px rgba(0,0,0,.16);backdrop-filter:blur(5px)}
  .shiftFloatingControls .btn{min-width:102px;min-height:44px;padding:8px 12px}
  .shiftKeyHint{font-size:.7rem;color:#6f7c85;font-weight:800;white-space:nowrap}
  .shiftPracticeLink{margin-top:8px;font-size:.78rem;color:var(--muted)}
  @media(max-width:650px){
    .shiftFloatingControls{right:7px;bottom:7px;padding:5px;gap:5px}
    .shiftFloatingControls .btn{min-width:82px;min-height:42px;padding:7px 9px;font-size:.8rem}
    .shiftKeyHint{display:none}
    .shiftLesson{padding-bottom:70px}
  }

  .reviewSkills{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
  .skill{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:.78rem;background:#fff}
  .skill.good{border-color:#9dd4b4;background:var(--greenSoft);color:var(--green)}
  .skill.need{border-color:#f1b2b2;background:var(--redSoft);color:var(--red)}
  .conceptCards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .concept{border:2px solid var(--line);border-radius:14px;padding:16px;background:#fff}
  .concept h3{margin:0 0 8px}
  .concept .icon{font-size:1.7rem}


  .stageBtn:disabled{opacity:.42;cursor:not-allowed;background:#f3f4f5}
  .masteryLine{font-size:.8rem;color:var(--muted);margin-top:5px}
  .masteryDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccd4d9;margin-right:4px}
  .masteryDot.on{background:var(--green)}
  .connectionBox{display:none;margin-top:12px;padding:11px;border:1px solid #b8dcc7;border-radius:10px;background:#f5fff8}
  .connectionBox.show{display:block}
  .ticketRow{display:grid;grid-template-columns:repeat(10,minmax(28px,1fr));gap:5px;margin:10px 0}
  .ticket{border:2px solid #c38a58;background:#fff3e6;border-radius:5px;padding:9px 2px;text-align:center;font-size:.72rem;font-weight:800;transition:transform .3s,opacity .3s}
  .ticket.bundle{transform:translateY(-8px) scale(.92);opacity:.35}
  .newBundle{display:inline-block;border:3px solid #b46a2a;background:#fff0dc;border-radius:8px;padding:14px 18px;font-weight:900;font-size:1.15rem}
  .lockedPV{background:#f3f4f5;color:#9aa3aa;display:flex;align-items:center;justify-content:center;min-height:112px;font-size:.75rem}
  .expr{font-size:1.25rem;font-weight:800;line-height:1.8}
  .shiftTrack{position:relative;min-width:650px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .shiftHeads{display:grid;grid-template-columns:repeat(8,1fr)}
  .shiftHead{padding:7px 2px;text-align:center;border-right:1px solid var(--line);font-size:.7rem;color:var(--muted);min-height:42px}
  .shiftHead:last-child{border-right:0}
  .shiftRail{position:relative;height:72px;border-top:1px solid var(--line);background:linear-gradient(to right,transparent 12.4%,var(--line) 12.5%,transparent 12.6%) 0 0/12.5% 100%}
  .digitCard{position:absolute;top:13px;transform:translateX(-50%);width:44px;height:44px;border-radius:9px;border:2px solid #87949d;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.55rem;font-weight:900;transition:left .42s ease,opacity .32s ease,transform .42s ease}
  .digitCard.newZero{animation:zeroIn .45s ease}
  @keyframes zeroIn{from{opacity:0;transform:translateX(-50%) scale(.4)}to{opacity:1;transform:translateX(-50%) scale(1)}}
  .reflection{width:100%;min-height:78px;border:2px solid #b8c3cb;border-radius:9px;padding:9px;font:inherit;resize:vertical}
  .evidenceLine{font-size:.69rem;color:#687681;margin-top:2px;line-height:1.25}
  .evidenceLine .ind{color:#237a4b;font-weight:800}
  .evidenceLine .sup{color:#a35b12;font-weight:800}
  .evidenceLine .exp{color:#52606a;font-weight:800}
  .lessonDone{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid #a9d6bb;border-radius:11px;background:#f5fff8;margin-bottom:10px;font-size:.86rem}
  .lessonDone strong{color:#237a4b}
  .lessonLocked{padding:18px;border:1px dashed #c8d0d6;border-radius:12px;background:#fafbfc;color:#66717a;text-align:center;font-weight:800}
  .coreBadge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#eaf7ef;color:#237a4b;font-size:.7rem;font-weight:900;vertical-align:middle}
  .extraBadge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#f1f3f5;color:#687681;font-size:.7rem;font-weight:800;vertical-align:middle}
  .reviewStatusNote{font-size:.74rem;color:#687681;margin-top:4px}
  .teacherTag{font-size:.72rem;background:rgba(255,255,255,.18);padding:3px 6px;border-radius:999px}
  .hiddenAnswer{font-weight:800;color:var(--muted);letter-spacing:.08em}
  .evidenceHelp{margin-top:6px;font-size:.72rem;color:var(--muted)}
  .evidenceHelp summary{cursor:pointer;font-weight:800;display:inline-block}
  .evidenceHelp div{margin-top:5px;padding:7px 9px;border:1px solid #e1e6e9;border-radius:8px;background:#fafbfc;line-height:1.55}
  .attemptBadge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#fff4e7;color:#8b4c0c;font-size:.7rem;font-weight:900}

  /* shared place-value engine: p93-97 */
  .pveWrap{width:100%;overflow:hidden;border:2px solid #7f878e;border-radius:12px;background:#fff;box-shadow:0 3px 10px rgba(31,41,55,.06)}
  .pveGrid{display:grid;width:100%;min-width:0}
  .pveCol{min-width:0;border-right:1px solid var(--pveStroke);background:#fff;position:relative}
  .pveCol:last-child{border-right:0}
  .pveCol.groupBoundary{border-right-width:5px;border-right-color:#697078}
  .pveHead{min-height:42px;padding:6px 2px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--pveBg);color:var(--pveText);font-size:clamp(.68rem,1.55vw,.84rem);font-weight:900;border-bottom:1px solid var(--pveStroke);white-space:nowrap}
  .pveDigit{height:58px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.35rem,3vw,1.9rem);font-weight:900;color:var(--pveText);background:#fff;position:relative}
  .pveSub{min-height:32px;padding:4px 2px 6px;text-align:center;font-size:clamp(.57rem,1.35vw,.72rem);font-weight:700;color:#66717a;background:#fafbfc;border-top:1px solid #edf0f2;overflow:hidden;text-overflow:ellipsis}
  .pve-c0{--pveBg:#fce4ec;--pveStroke:#d81b60;--pveText:#b3154e}
  .pve-c1{--pveBg:#fff6bf;--pveStroke:#c99b00;--pveText:#8e7200}
  .pve-c2{--pveBg:#cfeaf6;--pveStroke:#287ba3;--pveText:#236a8a}
  .pve-c3{--pveBg:#ededed;--pveStroke:#6f767d;--pveText:#4f555b}
  .pveCol.focus{box-shadow:inset 0 0 0 3px #f59e0b;z-index:2}
  .pveCol.focus .pveHead{box-shadow:inset 0 3px 0 #f59e0b}

<body>
<div class="app" id="app">
<header>
  <div class="headInner">
    <div class="titleWrap">
      <h1>大きい数ラボ</h1>
      <div class="subtitle">教科書92〜105ページ「大きい数のしくみ」｜位取り・何こ分・数直線・式をつなぐ <span class="teacherTag">v12 hardened</span></div>
    </div>
    <div class="headTools">
      <button class="topBtn" id="soundBtn" aria-pressed="true">🔊 よみ上げ ON</button>
      <button class="topBtn" id="freeModeBtn" aria-pressed="false">👩‍🏫 先生用プレビュー</button>
      <button class="topBtn" id="resetBtn">↺ はじめから</button>
    </div>
  </div>
</header>
<div class="shell">
  <section class="navCard" aria-label="学習の流れ">
    <div class="stageNav" id="stageNav"></div>
    <div class="progressRow"><span id="progressText">0 / 10</span><div class="bar"><span id="progressBar"></span></div></div>
  </section>
  <main id="main"></main>
</div>
</div>
<script>
(() => {
  'use strict';
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const fmt=n=>String(Math.trunc(Number(n))); // 3年生の学習画面ではカンマを使わない
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const pick=a=>a[rand(0,a.length-1)];
  const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  const STAGES=[
    {p:'92',n:'導入',goal:'これまでの数と、これから学ぶ大きい数をつなげる。'},
    {p:'93–95',n:'位取り',goal:'10こ集まると1つ上の位になる仕組みを、実際にまとめながら理解する。'},
    {p:'96',n:'読む・書く',goal:'数字・読み方・各位の数字を行き来する。'},
    {p:'97',n:'1000の何こ分',goal:'大きい数を「1000が何こ分」としてとらえる。'},
    {p:'98–99',n:'数直線',goal:'代表問題で1目盛りの考え方をつかみ、必要なら教科書の残りも練習する。'},
    {p:'100',n:'比較・計算',goal:'もとにする数の何こ分かに直して、大小比較や計算を考える。'},
    {p:'101',n:'いろいろな見方',goal:'1つの数を、たし算・ひき算・何こ分など複数の見方で表す。'},
    {p:'102–103',n:'10倍・100倍・1000倍',goal:'10倍・100倍・1000倍、10でわるときの位の移動を理解する。'},
    {p:'104',n:'たしかめ',goal:'単元全体の6つの力を確かめ、必要な見方へ戻って確かめる。'},
    {p:'105',n:'算数の目',goal:'「位に注目」「もとにする数の何こ分」という2つの見方にまとめる。'}
  ];

  const STORAGE_KEY='ookiiKazuLab_progress';
  const SCHEMA_VERSION=6;
  const LEGACY_STORAGE_KEYS=['ookiiKazuLab_v5_smallstep_hardened','ookiiKazuLab_v4_smallstep','ookiiKazuLab_v3'];
  const defaultState=()=>({
    schemaVersion:SCHEMA_VERSION,
    stage:0, sound:true, freeMode:false,
    mastery:Array.from({length:STAGES.length},()=>[]),
    learningEvidence:{}, attemptEvidence:{}, currentAttempted:false,
    introIndex:0,
    pvCounts:[0,0,0,0,2,4,1,5,3], pvHighest:4, bundleDemoDone:false,
    pvChallenge:null, pvPracticeKind:'forward', pvChallengeCycle:0, pvBuildSolved:false,
    rwProblem:null, rwCycle:0,
    baseProblem:null, baseCycle:0,
    nlProblem:null,
    compareIndex:0, compareProblem:null, compareLens:'unit', comparePhase:0,
    viewsIndex:0, viewsProblem:null, viewsClassSelected:null, viewsLens:'place', viewsStep:0,
    shiftValue:25, shiftMessage:'', shiftChain:0, shiftUnlock:1,
    shiftDemo:{mode:'x10',step:0,customStart:null,animating:false}, shiftDemoDone:{},
    shiftChallenge:{n:25,op:10,answer:250,hintLevel:0,mode:'x10',mixed:false}, shiftMixedOrder:null, shiftMixedPos:0, shiftMixedSelected:null,
    reviewIndex:0, reviewResults:[], reviewRemediation:false, reviewRetryingIndex:null,
    finalStep:0, finalSelected:null, finalOrders:null, finalResponses:{}, reflection1:'', reflection2:'',
    focusNumber:24153
  });
  function normalizeEvidenceRecord(raw={}){
    const level=raw.level||raw.bestLevel||null;
    return {...raw,level,bestLevel:level,experienced:raw.experienced??!!level,
      supportedEver:raw.supportedEver??(level==='supported'),independentEver:raw.independentEver??(level==='independent'),
      attempts:Number(raw.attempts)||0,wrongCount:Number(raw.wrongCount??raw.wrong)||0,
      hintUsed:Number(raw.hintUsed)||(raw.supportUsed?1:0),remediationUsed:Number(raw.remediationUsed)||0};
  }
  function loadState(){
    try{
      let raw=localStorage.getItem(STORAGE_KEY),sourceKey=STORAGE_KEY;
      if(!raw){for(const k of LEGACY_STORAGE_KEYS){raw=localStorage.getItem(k);if(raw){sourceKey=k;break}}}
      if(!raw)return defaultState();
      const saved=JSON.parse(raw),d=defaultState();
      const merged={...d,...saved,schemaVersion:SCHEMA_VERSION,freeMode:false,
        learningEvidence:(saved.learningEvidence&&typeof saved.learningEvidence==='object')?saved.learningEvidence:{},
        attemptEvidence:(saved.attemptEvidence&&typeof saved.attemptEvidence==='object')?saved.attemptEvidence:{},
        finalResponses:(saved.finalResponses&&typeof saved.finalResponses==='object')?saved.finalResponses:{},
        mastery:Array.from({length:STAGES.length},(_,i)=>Array.isArray(saved.mastery?.[i])?saved.mastery[i]:[])};
      Object.keys(merged.learningEvidence).forEach(id=>{merged.learningEvidence[id]=normalizeEvidenceRecord(merged.learningEvidence[id])});
      merged.mastery.forEach((keys,stage)=>keys.forEach(key=>{const id=stage+'::'+key;if(!merged.learningEvidence[id])merged.learningEvidence[id]=normalizeEvidenceRecord({level:'supported',legacy:true,supportUsed:true})}));
      if(sourceKey!==STORAGE_KEY)localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));
      return merged;
    }catch(e){return defaultState()}
  }
  const state=loadState();
  const NL_CORE_INDEXES=[0,1,4,6,7,10,12,8,9];
  const REQUIRED=[
    ['intro:0','intro:1','intro:2','intro:3'],
    ['bundle1000','pv:10man','pv:100man','pv:1000man','pv:build'],
    ['rw:read1','rw:read2','rw:write1','rw:write2','rw:decomp1','rw:decomp2'],
    ['base:f23','base:f75','base:r34','base:r75','base:f389','base:r389','base:bridge100'],
    NL_CORE_INDEXES.map(i=>'nl:'+i),
    Array.from({length:6},(_,i)=>'cmp:'+i),
    ['views:16000','views:73000','views:classify'],
    ['shift:x10','shift:x100','shift:x1000','shift:div10','shift:mixed:x10','shift:mixed:x100','shift:mixed:x1000','shift:mixed:div10'],
    Array.from({length:17},(_,i)=>'review:'+i),
    ['final:0','final:1','final:2','reflection']
  ];

  function saveState(force=false){
    if(state.freeMode&&!force)return;
    try{state.schemaVersion=SCHEMA_VERSION;localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
  }
  function hasMastery(stage,key){return state.mastery[stage]?.includes(key)}
  const EVIDENCE_RANK={experience:1,supported:2,independent:3};
  function evidenceId(stage,key){return stage+'::'+key}
  function evidenceFor(stage,key){
    const id=evidenceId(stage,key),e=state.learningEvidence[id];
    if(e)return e;
    return hasMastery(stage,key)?normalizeEvidenceRecord({level:'supported',legacy:true,supportUsed:true}):null;
  }
  function ensureEvidence(stage,key){
    const id=evidenceId(stage,key);
    if(!state.learningEvidence[id])state.learningEvidence[id]=normalizeEvidenceRecord(evidenceFor(stage,key)||{});
    else state.learningEvidence[id]=normalizeEvidenceRecord(state.learningEvidence[id]);
    return state.learningEvidence[id];
  }
  function attemptFor(stage,key){
    const id=evidenceId(stage,key);
    if(!state.attemptEvidence[id])state.attemptEvidence[id]={wrong:0,supportUsed:false};
    return state.attemptEvidence[id];
  }
  function resetAttempt(key=null,stage=state.stage){
    state.currentAttempted=false;
    if(key!=null)delete state.attemptEvidence[evidenceId(stage,key)];
  }
  function setEvidence(key,level='independent',stage=state.stage){
    const e=ensureEvidence(stage,key),prevRank=EVIDENCE_RANK[e.level]||0,newRank=EVIDENCE_RANK[level]||0;
    if(newRank>prevRank)e.level=level;
    e.bestLevel=e.level;
    e.experienced=true;
    if(level==='supported')e.supportedEver=true;
    if(level==='independent')e.independentEver=true;
    return e;
  }
  function noteWrong(key,stage=state.stage){
    const a=attemptFor(stage,key),e=ensureEvidence(stage,key);
    a.wrong=(a.wrong||0)+1;e.wrongCount=(e.wrongCount||0)+1;e.attempts=(e.attempts||0)+1;
    state.learningEvidence[evidenceId(stage,key)]=e;saveState();
  }
  function noteSupport(key,stage=state.stage){
    const a=attemptFor(stage,key),e=ensureEvidence(stage,key);
    a.supportUsed=true;e.hintUsed=(e.hintUsed||0)+1;
    state.learningEvidence[evidenceId(stage,key)]=e;saveState();
  }
  function noteRemediation(key,stage=state.stage){
    const a=attemptFor(stage,key),e=ensureEvidence(stage,key);
    a.supportUsed=true;e.remediationUsed=(e.remediationUsed||0)+1;
    state.learningEvidence[evidenceId(stage,key)]=e;saveState();
  }
  function completionLevel(key,stage=state.stage){
    const a=state.attemptEvidence[evidenceId(stage,key)];
    return a?.supportUsed||a?.wrong>0?'supported':'independent';
  }
  function markMastery(key,stage=state.stage,level='independent'){
    // 先に evidence を確定する。mastery を先に追加すると、新規記録まで旧版由来と誤認するため。
    const e=setEvidence(key,level,stage);
    if(!hasMastery(stage,key))state.mastery[stage].push(key);
    if(level==='supported'||level==='independent')e.attempts=(e.attempts||0)+1;
    state.learningEvidence[evidenceId(stage,key)]=e;
    saveState();updateNav();
  }
  function markExperience(key,stage=state.stage){markMastery(key,stage,'experience')}
  function stageComplete(i){return REQUIRED[i].every(k=>hasMastery(i,k))}
  function unlockedMax(){let i=0;while(i<STAGES.length-1&&stageComplete(i))i++;return i}
  function recordAttempt(ok,key=null){if(!key)return;if(ok)markMastery(key,state.stage,completionLevel(key));else noteWrong(key);saveState()}
  function stageEvidenceSummary(i){
    let independent=0,supported=0,experience=0;
    REQUIRED[i].forEach(k=>{const e=evidenceFor(i,k);if(!e)return;if(e.level==='independent')independent++;else if(e.level==='supported')supported++;else if(e.level==='experience')experience++;});
    return {independent,supported,experience,total:REQUIRED[i].length};
  }

  const placeValues=[
    {name:'一億',v:100000000},{name:'千万',v:10000000},{name:'百万',v:1000000},{name:'十万',v:100000},{name:'一万',v:10000},
    {name:'千',v:1000},{name:'百',v:100},{name:'十',v:10},{name:'一',v:1}
  ];

  function speak(text){
    if(!state.sound || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();

  function jpUnder10000(n){
    n=Math.floor(n); if(n===0)return '';
    const d=['','一','二','三','四','五','六','七','八','九'];
    let s='';
    const th=Math.floor(n/1000); n%=1000;
    const h=Math.floor(n/100); n%=100;
    const t=Math.floor(n/10); const o=n%10;
    if(th)s+=(th===1?'':d[th])+'千';
    if(h)s+=(h===1?'':d[h])+'百';
    if(t)s+=(t===1?'':d[t])+'十';
    if(o)s+=d[o];
    return s;
  }
  function jpNumber(n){
    n=Math.floor(Number(n));
    if(!Number.isFinite(n)||n<0||n>999999999)return fmt(n);
    if(n===0)return '零';
    const oku=Math.floor(n/100000000); n%=100000000;
    const man=Math.floor(n/10000); const rest=n%10000;
    let s='';
    if(oku)s+=jpUnder10000(oku)+'億';
    if(man)s+=jpUnder10000(man)+'万';
    if(rest)s+=jpUnder10000(rest);
    return s;
  }

  function sharedPlaceValueHTML({number=0,maxExp=null,minExp=0,focusExp=null,counts=null,id='pve',badgeExp=null,badgeText='',showSub=true,empty=false}={}){
    const hi=maxExp==null?pvHighestExp(number,3):clamp(maxExp,minExp,8);

  function aggregatePreviewHTML({kind,base,count,answer,id='agg',solved=false}={}){
    const baseExp=pvExpFromValue(base);

  function runAggregateAnimation({kind,base,count,answer,id='agg'}){
    const baseExp=pvExpFromValue(base),host=$(`#${id}Table`),result=$(`#${id}Result`); if(!host)return;
    const maxExp=Math.max(pvHighestExp(answer,baseExp),baseExp+String(count).length-1);
    if(kind==='forward'){
      host.innerHTML=sharedPlaceValueHTML({number:0,maxExp,minExp:0,focusExp:baseExp,id,badgeExp:baseExp,badgeText:`${count}こ`});
      const source=$(`#${id}-exp-${baseExp}`); if(!source)return;
      const sr=source.getBoundingClientRect(),chars=[...String(count)];
      chars.forEach((ch,index)=>{
        const exp=baseExp+chars.length-1-index,target=$(`#${id}-exp-${exp}`); if(!target)return;
        const tr=target.getBoundingClientRect(),fly=document.createElement('div'); fly.className='flying-digit';fly.textContent=ch;
        const sx=sr.left+sr.width/2+(index-(chars.length-1)/2)*8,sy=sr.top+sr.height*.55,tx=tr.left+tr.width/2,ty=tr.top+tr.height*.55;
        fly.style.left=(sx-23)+'px';fly.style.top=(sy-23)+'px';document.body.appendChild(fly);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{fly.style.transform=`translate(${tx-sx}px,${ty-sy}px) scale(.82)`;fly.style.opacity='.86'}));
        setTimeout(()=>fly.remove(),780);
      });
      setTimeout(()=>{host.innerHTML=sharedPlaceValueHTML({number:answer,maxExp,minExp:0,focusExp:baseExp,id});result.textContent=`${fmt(base)} × ${count} = ${fmt(answer)}`;speak(`${fmt(base)}を${count}こ集めると${jpNumber(answer)}`)},800);
    }else{
      host.innerHTML=sharedPlaceValueHTML({number:answer,maxExp,minExp:0,focusExp:baseExp,id});
      const target=$(`#${id}-exp-${baseExp}`); if(!target)return; const tr=target.getBoundingClientRect();
      const chars=[...String(count)]; let moving=0;
      for(let exp=maxExp;exp>=baseExp;exp--){
        const digit=pvDigitAt(answer,exp),source=$(`#${id}-exp-${exp}`); if(!source)continue;
        const sr=source.getBoundingClientRect(),fly=document.createElement('div');fly.className='flying-digit';fly.textContent=String(digit);
        const sx=sr.left+sr.width/2,sy=sr.top+sr.height*.55,tx=tr.left+tr.width/2+(moving-(chars.length-1)/2)*15,ty=tr.top+tr.height*.56;
        fly.style.left=(sx-23)+'px';fly.style.top=(sy-23)+'px';document.body.appendChild(fly);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{fly.style.transform=`translate(${tx-sx}px,${ty-sy}px) scale(.72)`;fly.style.opacity='.86'}));
        setTimeout(()=>fly.remove(),780); moving++;
      }
      setTimeout(()=>{host.innerHTML=sharedPlaceValueHTML({number:0,maxExp,minExp:0,focusExp:baseExp,id,badgeExp:baseExp,badgeText:`${count}こ`});result.textContent=`${fmt(answer)} は ${fmt(base)} が ${count}こ分`;speak(`${fmt(answer)}は${fmt(base)}を${count}こ集めた数`)},800);
    }
  }

  const REVIEW_SKILLS=['位取り','何こ分','数直線','比較・式','いろいろな見方','位の移動'];
  function reviewSkillStats(skill){

  }

  function wireReview(){

  function shuffledCopy(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=rand(0,i);[x[i],x[j]]=[x[j],x[i]]}return x}
  function ensureFinalOrders(){const valid=Array.isArray(state.finalOrders)&&state.finalOrders.length===finalQs.length&&state.finalOrders.every(x=>Array.isArray(x)&&x.length===3);if(valid)return state.finalOrders;const correctPositions=shuffledCopy([0,1,2]);state.finalOrders=finalQs.map((q,step)=>{const order=Array(3),wrong=shuffledCopy([0,1,2].filter(i=>i!==q.ei));order[correctPositions[step]]=q.ei;let w=0;for(let pos=0;pos<3;pos++)if(order[pos]==null)order[pos]=wrong[w++];return order});saveState();return state.finalOrders}

  function finalMapHTML(reveal=false){

  }
  function finalProofHTML(q){if(q.kind==='unit'){const lc=q.left/q.unit,rc=q.right/q.unit,ans=q.result/q.unit;return `<div class="finalProof"><div class="finalProofTitle">同じもとで「何こ分」にそろえる</div><div class="unitCompare"><div class="unitSide"><div class="unitSideTitle">${fmt(q.left)}</div><div class="unitCount">${fmt(q.unit)} が ${lc}こ</div></div><div class="unitMiddle">−</div><div class="unitSide"><div class="unitSideTitle">${fmt(q.right)}</div><div class="unitCount">${fmt(q.unit)} が ${rc}こ</div></div></div><div class="reviewMiniFormula">${lc} − ${rc} ＝ ${ans}　→　${fmt(q.unit)} × ${ans} ＝ ${fmt(q.result)}</div>${sharedPlaceValueHTML({number:q.result,maxExp:pvHighestExp(q.left,3),focusExp:pvExpFromValue(q.unit),id:'finalProofPV'})}</div>`}const counts=[0,0,0,0,0,0,0,0,0],exp=pvExpFromValue(q.unit);counts[8-exp]=10;return `<div class="finalProof"><div class="finalProofTitle">10こ集めると、1つ上へ</div>${sharedPlaceValueHTML({number:0,maxExp:Math.max(4,exp+1),counts,focusExp:exp,id:'finalCarryPV'})}<div class="reviewMiniFormula">${fmt(q.unit)} が 10こ ＝ ${fmt(q.unit*10)} が 1こ</div></div>`}
  function finalSynthesisHTML(){const all=finalQs.every((_,i)=>hasMastery(9,'final:'+i));if(!all)return '';return `<div class="finalSynthesis"><h3>この単元のつながり</h3><div class="finalSynthesisFlow"><span>10こ集まる</span><b>→</b><span>1つ上の位</span><b>→</b><span>その位を「1こ」と見る</span><b>→</b><span>大きな数を小さな個数で考えられる</span></div><p class="miniNote">位取り・何こ分・数直線・式・10倍は、10進位取りの同じ仕組みを違う角度から見ています。</p></div>`}
  function renderFinal(){const q=finalQs[state.finalStep],solved=hasMastery(9,'final:'+state.finalStep),orders=ensureFinalOrders(),resp=finalResponse(state.finalStep),all=finalQs.every((_,i)=>hasMastery(9,'final:'+i));state.finalSelected=resp.selected;const prevDisabled=state.finalStep===0?'disabled':'',nextDisabled=state.finalStep===finalQs.length-1||(!state.freeMode&&!solved)?'disabled':'';return `${finalMapHTML(all)}<section class="panel"><h3>最後の説明問題 ${state.finalStep+1}/3</h3><div class="miniNote">小さい数で確かめてから、大きい数へ広げます。</div><div class="prompt">${q.q}</div><input class="answerInput" id="finalAns" inputmode="numeric" value="${esc(resp.value??'')}"><div class="prompt" style="font-size:1rem">その理由としていちばんよい説明は？</div><div class="choices">${orders[state.finalStep].map(i=>`<button class="choice ${resp.selected===i?'selected':''}" data-final-exp="${i}">${q.exps[i]}</button>`).join('')}</div><div id="finalFb" class="feedback">${solved?'✓ 答えと理由を説明できました。':''}</div><div id="finalHint" class="hint"></div><div id="finalProofHost">${solved?finalProofHTML(q):''}</div><div class="actions"><button class="btn primary" id="finalCheck">答えと説明を判定</button><button class="btn orange" id="finalHintBtn">ヒント</button><button class="btn ghost" id="finalPrev" ${prevDisabled}>◀ 前</button><button class="btn ghost" id="finalNext" ${nextDisabled}>次 ▶</button></div></section><div id="finalSynthesisHost">${finalSynthesisHTML()}</div>${all?`<section class="panel soft" style="margin-top:14px"><h3>振り返り</h3><div class="miniNote">3つの説明問題を終えたので、最後に自分の言葉でまとめます。</div><label>自分がいちばん使いやすかった見方<textarea id="reflection1" class="reflection" placeholder="位取り、何こ分、数直線、式など">${esc(state.reflection1||'')}</textarea></label><label>数が大きくなっても変わらないと思った決まり<textarea id="reflection2" class="reflection" placeholder="自分の言葉で書こう">${esc(state.reflection2||'')}</textarea></label><div id="reflectionFb" class="feedback"></div><div class="actions"><button class="btn green" id="saveReflection">振り返りを保存</button></div></section>`:`<div class="lessonLocked" style="margin-top:14px">3つの説明問題を順に終えると、振り返りが開きます。</div>`}`}
  function wireFinal(){const q=finalQs[state.finalStep],resp=finalResponse(state.finalStep);$('#finalAns')?.addEventListener('input',e=>{resp.value=e.target.value;saveState()});$$('[data-final-exp]').forEach(b=>b.addEventListener('click',()=>{state.finalSelected=+b.dataset.finalExp;resp.selected=state.finalSelected;$$('[data-final-exp]').forEach(x=>x.classList.toggle('selected',x===b));saveState()}));$('#finalCheck').addEventListener('click',()=>{resp.value=$('#finalAns').value;resp.selected=state.finalSelected;const okNum=Number(resp.value)===q.a,okExp=state.finalSelected===q.ei,ok=okNum&&okExp;if(ok){const key='final:'+state.finalStep;markMastery(key,state.stage,completionLevel(key));feedback($('#finalFb'),'正解。答えだけでなく、なぜその見方が使えるかまで説明できました。','ok');saveState();setTimeout(()=>render(),650)}else{noteWrong('final:'+state.finalStep);feedback($('#finalFb'),!okNum?'「何を1こと見るか」または「10こ集まるとどうなるか」を確かめよう。':'答えは合っています。理由を選び直そう。','ng')}});$('#finalHintBtn').addEventListener('click',()=>{noteSupport('final:'+state.finalStep);setHint('#finalHint',state.finalStep<2?'9と7は、それぞれ何が9こ・7こなのかを言葉にしよう。':'一→十、十→百、百→千でも同じことが起きるか考えよう。')});$('#finalPrev').addEventListener('click',()=>{if(state.finalStep<=0)return;state.finalStep--;state.finalSelected=finalResponse(state.finalStep).selected;saveState();render()});$('#finalNext').addEventListener('click',()=>{if(state.finalStep>=finalQs.length-1)return;if(!state.freeMode&&!hasMastery(9,'final:'+state.finalStep))return;state.finalStep++;state.finalSelected=finalResponse(state.finalStep).selected;saveState();render()});$('#saveReflection')?.addEventListener('click',()=>{state.reflection1=$('#reflection1').value.trim();state.reflection2=$('#reflection2').value.trim();if(state.reflection1.length>=5&&state.reflection2.length>=5){markExperience('reflection');feedback($('#reflectionFb'),'保存しました。単元の学習がすべてつながりました。','ok')}else feedback($('#reflectionFb'),'2つとも、5文字以上を目安に自分の言葉で書こう。','ng');saveState();updateNav()})}

  $('#soundBtn').addEventListener('click',()=>{state.sound=!state.sound;$('#soundBtn').setAttribute('aria-pressed',String(state.sound));$('#soundBtn').textContent=state.sound?'🔊 よみ上げ ON':'🔇 よみ上げ OFF';if(!state.sound&&'speechSynthesis'in window)speechSynthesis.cancel();saveState()});
  let teacherPreviewSnapshot=null,teacherHoldTimer=null,teacherHoldTriggered=false;
  function teacherButtonText(){return state.freeMode?'🔓 先生用プレビュー中':'👩‍🏫 先生用プレビュー'}
  function enterTeacherPreview(){teacherPreviewSnapshot=JSON.stringify({...state,freeMode:false});state.freeMode=true;render()}
  function exitTeacherPreview(){if(teacherPreviewSnapshot){const restored=JSON.parse(teacherPreviewSnapshot);Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,restored)}state.freeMode=false;teacherPreviewSnapshot=null;saveState(true);render()}
  function toggleTeacherPreview(){state.freeMode?exitTeacherPreview():enterTeacherPreview()}
  const freeBtn=$('#freeModeBtn');freeBtn.title='先生用。1.5秒長押しで切り替えます。';
  freeBtn.addEventListener('click',e=>{e.preventDefault()});
  freeBtn.addEventListener('pointerdown',e=>{e.preventDefault();teacherHoldTriggered=false;freeBtn.textContent='長押し…';teacherHoldTimer=setTimeout(()=>{teacherHoldTriggered=true;toggleTeacherPreview();const b=$('#freeModeBtn');b.setAttribute('aria-pressed',String(state.freeMode));b.textContent=teacherButtonText()},1500)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>freeBtn.addEventListener(ev,()=>{if(teacherHoldTimer)clearTimeout(teacherHoldTimer);teacherHoldTimer=null;if(!teacherHoldTriggered)freeBtn.textContent=teacherButtonText()}));
  $('#resetBtn').addEventListener('click',()=>{if(confirm('学習の記録も含めて、はじめからに戻しますか？')){localStorage.removeItem(STORAGE_KEY);LEGACY_STORAGE_KEYS.forEach(k=>localStorage.removeItem(k));Object.assign(state,defaultState());$('#soundBtn').setAttribute('aria-pressed','true');$('#soundBtn').textContent='🔊 よみ上げ ON';$('#freeModeBtn').setAttribute('aria-pressed','false');$('#freeModeBtn').textContent=teacherButtonText();render()}});

  $('#soundBtn').setAttribute('aria-pressed',String(state.sound));$('#soundBtn').textContent=state.sound?'🔊 よみ上げ ON':'🔇 よみ上げ OFF';$('#freeModeBtn').setAttribute('aria-pressed',String(state.freeMode));$('#freeModeBtn').textContent=teacherButtonText();
  updateNav(); render();
})();
</script>
</body>
