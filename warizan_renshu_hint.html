  var lastKey = null;
  function newProblem(){
    var lvl = String(state.level || "1");
    var p;
    var maxH = 3;

    if(lvl === "1") { p = genLevel1(lastKey); maxH = 3; }
    else if(lvl === "2") { p = genLevel2(lastKey); maxH = 5; }
    else if(lvl === "3-1") { p = genLevel3_1(lastKey); maxH = 3; }
    else if(lvl === "3-2") { p = genLevel3_2(lastKey); maxH = 3; }
    else if(lvl === "4-1") { p = genLevel4_1(lastKey); maxH = 3; }
    else if(lvl === "4-2") { p = genLevel4_2(lastKey); maxH = 4; }
    else if(lvl === "4-3") { p = genLevel4_3(lastKey); maxH = 4; }
    else if(lvl === "5-1") { p = genLevel5_1(lastKey); maxH = 5; }
    else if(lvl === "5-2") { p = genLevel5_2(lastKey); maxH = 5; }
    else if(lvl === "5-3") { p = genLevel5_3(lastKey); maxH = 5; }
    else if(lvl === "5-4") { p = genLevel5_4(lastKey); maxH = 4; }
    else if(lvl === "6-1") { p = genLevel6_1(lastKey); maxH = 5; }
    else if(lvl === "6-2") { p = genLevel6_2(lastKey); maxH = 5; }
    else if(lvl === "6-3") { p = genLevel6_3(lastKey); maxH = 5; }
    else { p = genLevel1(lastKey); maxH = 3; }

    lastKey = p.dividend + "-" + p.divisor + "-" + p.quotient;
    state.problem = p;
    state.hintStage = 0;
    state.maxHint = maxH;
    state.inputDigits = "";
    state.inputRemainder = "";
    state.activeField = "q";
    state.answered = false;
    state.counted = false;
    state.isWrongState = false;
    feedback.textContent = "";
    feedback.className = "";
    nextProblemBtn.classList.remove("show");
    buildKeypad();
    renderAll(false);
  }

  // ------------------------------------------------------------------
  // keypad / answer input & auto check
  // ------------------------------------------------------------------
  function buildKeypad(){
    keypad.innerHTML = "";
    var nums = [1,2,3,4,5,6,7,8,9];
    nums.forEach(function(n){
      var b = document.createElement("button");
      b.textContent = n;
      b.addEventListener("click", function(){ pressDigit(n); });
      keypad.appendChild(b);
    });
    var zero = document.createElement("button");
    zero.textContent = "0";
    zero.addEventListener("click", function(){ pressDigit(0); });
    keypad.appendChild(zero);

    var clearBtn = document.createElement("button");
    clearBtn.textContent = "けす";
    clearBtn.className = "clear";
    clearBtn.addEventListener("click", clearDigit);
    keypad.appendChild(clearBtn);

    if(state.problem && state.problem.hasRemainder){
      var switchBtn = document.createElement("button");
      switchBtn.textContent = "きりかえ";
      switchBtn.className = "wide";
      switchBtn.addEventListener("click", function(){
        playSound('switch');
        state.activeField = state.activeField === "q" ? "r" : "q";
        renderAnswerDisplay();
      });
      keypad.appendChild(switchBtn);
    }
  }

  function checkCurrentAnswer(){
    if(state.answered) return;
    var p = state.problem;
    if(!p) return;

    var hasRem = !!p.hasRemainder;
    var correct = false;

    if(!hasRem){
      correct = state.inputDigits.length > 0 && parseInt(state.inputDigits, 10) === p.quotient;
    } else {
      correct = state.inputDigits.length > 0 && state.inputRemainder.length > 0 &&
                parseInt(state.inputDigits, 10) === p.quotient &&
                parseInt(state.inputRemainder, 10) === p.remainder;
    }

    if(!state.counted){
      state.counted = true;
      state.score.total++;
      if(correct) state.score.correct++;
      scoreBox.classList.add("show");
      document.getElementById("scoreCorrect").textContent = state.score.correct;
      document.getElementById("scoreTotal").textContent = state.score.total;
    }

    if(correct){
      state.answered = true;
      state.isWrongState = false;
      hintNextBtn.disabled = true;

      var raidActive = isRaidConnected();

      if(raidActive){
        state.streak++;
        updateStreakUI();

        var baseDamage = 10;
        var multiplier = 1;
        var isCritical = false;
        if(state.streak >= 5){
          multiplier = 3;
          isCritical = true;
        } else if(state.streak >= 3){
          multiplier = 2;
          isCritical = true;
        }
        var finalDamage = baseDamage * multiplier;

        var modeDesc = p.title || ("わり算Lv" + state.level);
        sendAttack(finalDamage, modeDesc + " (" + state.streak + "連勝 " + multiplier + "倍)");

        if(isCritical){
          playSound('critical');
        } else {
          playSound('correct');
        }

        var critMsg = isCritical ? " 🔥【" + state.streak + "れんぞく！ " + multiplier + "倍クリティカル！】" : "";
        feedback.textContent = "💥 せいかい！ ボスに " + finalDamage + " ダメージ！" + critMsg;
      } else {
        state.streak = 0;
        updateStreakUI();
        playSound('correct');
        feedback.textContent = "せいかい！ よくできました！";
      }

      feedback.className = "good";
      state.hintStage = state.maxHint;
      renderAll(false);
      nextProblemBtn.classList.add("show");
    } else {
      state.streak = 0;
      state.isWrongState = true;
      updateStreakUI();
      playSound('wrong');
      feedback.textContent = "おしい！ もういちど かんがえてみよう";
      feedback.className = "bad";
      var card = document.querySelector("#problemScreen .card");
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      renderAnswerDisplay();
    }
  }

  function pressDigit(n){
    if(state.answered) return;
    playSound('click');

    var p = state.problem;
    if(!p) return;

    var hasRem = !!p.hasRemainder;
    var targetDigits = p.targetQuotientDigits || 1;

    // 不正解直後の数字押下時はクリアして新規入力
    if(state.isWrongState){
      state.isWrongState = false;
      state.inputDigits = "";
      state.inputRemainder = "";
      state.activeField = "q";
      feedback.textContent = "";
      feedback.className = "";
    }

    if(state.activeField === "q"){
      if(state.inputDigits.length >= targetDigits) return;
      state.inputDigits += String(n);
      renderAnswerDisplay();

      // レベル1で商が10の場合のみ、1が入力された時は2桁目待ち
      if(String(state.level) === "1" && p.quotient === 10){
        if(state.inputDigits === "1"){
          return;
        } else {
          checkCurrentAnswer();
          return;
        }
      }

      // 商の入力が目標桁数に達したか判定
      if(state.inputDigits.length >= targetDigits){
        if(!hasRem){
          checkCurrentAnswer();
        } else {
          state.activeField = "r";
          renderAnswerDisplay();
          if(state.inputRemainder.length > 0){
            checkCurrentAnswer();
          }
        }
      }
    } else {
      // あまりの入力（余りは常に1桁）
      state.inputRemainder = String(n);
      renderAnswerDisplay();
      if(state.inputDigits.length >= targetDigits){
        checkCurrentAnswer();
      } else {
        state.activeField = "q";
        renderAnswerDisplay();
      }
    }
  }

  function clearDigit(){
    if(state.answered) return;
    playSound('click');
    state.isWrongState = false;
    if(state.activeField === "q"){
      state.inputDigits = state.inputDigits.slice(0,-1);
    } else {
      state.inputRemainder = state.inputRemainder.slice(0,-1);
    }
    feedback.textContent = "";
    feedback.className = "";
    renderAnswerDisplay();
  }

  function renderAnswerDisplay(){
    answerDisplay.innerHTML = "";
    var p = state.problem;
    if(!p) return;

    var hasRem = !!p.hasRemainder;
    var targetDigits = p.targetQuotientDigits || 1;

    if(!hasRem){
      var chip = document.createElement("span");
      chip.className = "chip active" + (state.isWrongState ? " wrong" : "");
      chip.textContent = state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits);
      var lbl = document.createElement("span");
      lbl.textContent = "こたえ　";
      answerDisplay.appendChild(lbl);
      answerDisplay.appendChild(chip);
    } else {
      var qLabel = document.createElement("span");
      qLabel.textContent = "しょう　";
      qLabel.className = "label-clickable" + (state.activeField === "q" ? " active" : "");
      qLabel.addEventListener("click", function(){
        playSound('switch');
        state.activeField = "q";
        renderAnswerDisplay();
      });

      var qChip = document.createElement("span");
      qChip.className = "chip" + (state.activeField === "q" ? " active" : "") + (state.isWrongState ? " wrong" : "");
      qChip.textContent = state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits);
      qChip.addEventListener("click", function(){
        playSound('switch');
        state.activeField = "q";
        renderAnswerDisplay();
      });

      var rLabel = document.createElement("span");
      rLabel.textContent = "　あまり　";
      rLabel.className = "label-clickable" + (state.activeField === "r" ? " active" : "");
      rLabel.addEventListener("click", function(){
        playSound('switch');
        state.activeField = "r";
        renderAnswerDisplay();
      });

      var rChip = document.createElement("span");
      rChip.className = "chip" + (state.activeField === "r" ? " active" : "") + (state.isWrongState ? " wrong" : "");
      rChip.textContent = state.inputRemainder.length ? state.inputRemainder : "?";
      rChip.addEventListener("click", function(){
        playSound('switch');
        state.activeField = "r";
        renderAnswerDisplay();
      });

      answerDisplay.appendChild(qLabel);
      answerDisplay.appendChild(qChip);
      answerDisplay.appendChild(rLabel);
      answerDisplay.appendChild(rChip);
    }
    updateEquationSlots();
  }

  // ------------------------------------------------------------------
  // SVG layout helpers
  // ------------------------------------------------------------------
  var LAYOUT = {
    eqY: 46,
    eqFont: 30,
    hintTop: 100,
    lineH: 34
  };

  // Fixed digit columns used by the hint-4/5 subtraction diagram (and the
  // dividend once that diagram is on screen). Every number involved -
  // わられる数 / 引く数 / 答え(あまり) - is drawn one digit at a time, each
  // digit centered ("text-anchor:middle") on its own column X. Because the
  // glyph is centered rather than the whole number being right-aligned as a
  // single string, columns line up exactly even though digits like "1" and
  // "8" have different rendered widths.
  var SUB_COLS = { onesX: 90, colW: 26, fontSize: 30 };

  // A single digit character, centered on x,y. No fill/class of its own -
  // color comes from the wrapping <g> (see renderNumberColumns) so the whole
  // number can be recolored / animated together.
  function digitText(x, y, txt, extra){
    var attrs = { x:x, y:y, "text-anchor":"middle", "font-size": extra && extra.size || 26,
                  "font-weight":"800", "font-family":"'M PLUS Rounded 1c', sans-serif" };
    if(extra){ for(var k in extra){ if(k!=="size") attrs[k]=extra[k]; } }
    return el("text", attrs, txt);
  }

  // Renders `number` as separate digit glyphs on the shared SUB_COLS columns,
  // ones place at SUB_COLS.onesX, tens place one column to the left, etc.
  // Returns the <g> wrapper (not yet attached to the document).
  function renderNumberColumns(number, y, cls, id){
    var str = String(number);
    var g = el("g", { id: id || null });
    if(cls) g.setAttribute("class", cls);
    else g.setAttribute("fill", "#2B2A4C");
    for(var i=0; i<str.length; i++){
      var place = str.length - 1 - i; // 0 = ones, 1 = tens, ...
      var x = SUB_COLS.onesX - place*SUB_COLS.colW;
      g.appendChild(digitText(x, y, str[i], {size:SUB_COLS.fontSize}));
    }
    return g;
  }

  function clearSvg(){ svg.innerHTML = ""; }

  function bigText(x, y, txt, cls, extra){
    var attrs = { x:x, y:y, "text-anchor":"middle", "font-size": extra && extra.size || 26,
                  "font-weight":"800", "font-family":"'M PLUS Rounded 1c', sans-serif" };
    if(extra){ for(var k in extra){ if(k!=="size") attrs[k]=extra[k]; } }
    var t = el("text", attrs, txt);
    if(cls) t.setAttribute("class", cls);
    else if(!attrs.fill) t.setAttribute("fill", "#2B2A4C");
    return t;
  }

  // SVG text helper whose visual vertical center is explicitly aligned to y.
  // This is used where a text line and a surrounding □ must share the same
  // vertical center rather than relying on the font baseline offset.
  function middleText(x, y, txt, cls, extra){
    var attrs = { x:x, y:y, "text-anchor":"middle", "dominant-baseline":"middle",
                  "font-size": extra && extra.size || 26,
                  "font-weight":"800", "font-family":"'M PLUS Rounded 1c', sans-serif" };
    if(extra){ for(var k in extra){ if(k!=="size") attrs[k]=extra[k]; } }
    var t = el("text", attrs, txt);
    if(cls) t.setAttribute("class", cls);
    else if(!attrs.fill) t.setAttribute("fill", "#2B2A4C");
    return t;
  }

  function calcSvgFontSize(text, maxPixelWidth, baseSize, minSize){
    if(!text) return baseSize;
    var str = String(text);
    var len = 0;
    for(var i = 0; i < str.length; i++){
      var code = str.charCodeAt(i);
      len += (code > 255) ? 1.0 : 0.58;
    }
    var estWidth = len * baseSize;
    if(estWidth <= maxPixelWidth) return baseSize;
    var scaled = Math.floor(maxPixelWidth / len);
    return Math.max(minSize || 12, scaled);
  }

  function box(x, y, w, h, extraClass){
    return el("rect", {
      x:x-w/2, y:y-h/2, width:w, height:h, rx:8,
      fill:"#fff", stroke:"#3E6D9C", "stroke-width":3,
      class: extraClass || ""
    });
  }

  function outlineBox(x, y, w, h, color){
    return el("rect", {
      x:x-w/2, y:y-h/2, width:w, height:h, rx:8,
      fill:"none", stroke: color || "#FF8C42", "stroke-width":3
    });
  }

  function arrowPath(d){
    var p = el("path", { d:d, fill:"none", stroke:"#FF8C42", "stroke-width":4, "stroke-linecap":"round" });
    return p;
  }
  function arrowHead(x, y, angleDeg){
    var g = el("g", { transform: "translate("+x+","+y+") rotate("+angleDeg+")" });
    g.appendChild(el("path", { d:"M0,0 L-10,-6 L-10,6 Z", fill:"#FF8C42" }));
    return g;
  }
  // Given the arrowhead's tip position/angle, returns a point pulled back
  // along the same axis so the line's rounded end lands well inside the
  // triangle's body (not right at its tip), so the round stroke-cap never
  // peeks out past the clean triangle edge.
  function arrowLineEnd(tipX, tipY, angleDeg, back){
    var rad = (angleDeg||0) * Math.PI/180;
    var b = (back===undefined) ? 8 : back;
    return { x: tipX - Math.cos(rad)*b, y: tipY - Math.sin(rad)*b };
  }

  function animateDraw(pathEl, duration, onDone){
    var len = pathEl.getTotalLength();
    pathEl.style.strokeDasharray = len;
    pathEl.style.strokeDashoffset = len;
    pathEl.getBoundingClientRect(); // force reflow
    pathEl.style.transition = "stroke-dashoffset " + duration + "ms ease";
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        pathEl.style.strokeDashoffset = 0;
      });
    });
    if(onDone) setTimeout(onDone, duration + 30);
  }

  // ------------------------------------------------------------------
  // main render dispatcher
  // ------------------------------------------------------------------
  function renderAll(forward){
    var lvl = String(state.level || "1");
    if(lvl === "1") renderLevel1(forward);
    else if(lvl === "2") renderLevel2(forward);
    else if(lvl.startsWith("3")) renderLevel3(forward);
    else if(lvl.startsWith("4")) renderLevel4(forward);
    else renderLevelLongDivision(forward);
    renderHintControls();
    renderAnswerDisplay();
  }

  function renderHintControls(){
    hintBackBtn.disabled = state.hintStage <= 0;
    hintNextBtn.disabled = state.hintStage >= state.maxHint || state.answered;
    hintNextBtn.textContent = state.hintStage >= state.maxHint ? "ヒント おわり" : "ヒント ▶";
    hintDots.innerHTML = "";
    for(var i=1;i<=state.maxHint;i++){
      var d = document.createElement("span");
      if(i <= state.hintStage) d.className = "on";
      hintDots.appendChild(d);
    }
  }

  function updateEquationSlots(){
    var p = state.problem;
    if(!p) return;
    var targetDigits = p.targetQuotientDigits || 1;
    var qs = document.getElementById("qSlot");
    if(qs){
      if(state.hintStage < state.maxHint){
        qs.textContent = state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits);
        qs.setAttribute("class", state.inputDigits.length ? "slot-blue" : "slot-wait");
      }
    }
    var rs = document.getElementById("rSlot");
    if(rs && p.hasRemainder){
      if(state.hintStage < state.maxHint){
        rs.textContent = state.inputRemainder.length ? state.inputRemainder : "?";
        rs.setAttribute("class", state.inputRemainder.length ? "slot-blue" : "slot-wait");
      }
    }
  }

  // ==================================================================
  // LEVEL 1
  // ==================================================================
  function renderLevel1(forward){
    var p = state.problem;
    var stage = state.hintStage;
    svg.setAttribute("viewBox", "0 0 500 260");
    clearSvg();
    var hintCaptionElL1 = document.getElementById("hintCaption");
    if(hintCaptionElL1) hintCaptionElL1.textContent = "";

    // row 1: main equation  8 ÷ 2 = ?
    var g1 = el("g", {});
    g1.appendChild(bigText(150, LAYOUT.eqY, p.dividend, null, {size:32}));
    g1.appendChild(bigText(190, LAYOUT.eqY, "÷", null, {size:32}));
    g1.appendChild(bigText(230, LAYOUT.eqY, p.divisor, null, {size:32}));
    g1.appendChild(bigText(270, LAYOUT.eqY, "=", null, {size:32}));
    var slotTxt = (stage >= 3) ? p.quotient : (state.inputDigits.length ? state.inputDigits : "?");
    var slotCls = (stage >= 3) ? "slot-orange" : (state.inputDigits.length ? "slot-blue" : "slot-wait");
    var qSlot = bigText(320, LAYOUT.eqY, slotTxt, slotCls, {size:34, id:"qSlot"});
    g1.appendChild(qSlot);
    svg.appendChild(g1);

    if(stage >= 1){
      var boxCx = 320, boxCy = 126;
      var g2 = el("g", { class: (forward && stage===1) ? "fade-in" : "" });
      g2.appendChild(middleText(240, boxCy, p.divisor, null, {size:26}));
      g2.appendChild(middleText(268, boxCy, "×", null, {size:26}));
      g2.appendChild(box(boxCx, boxCy, 48, 40, "hintBox"));
      var boxTxt = "";
      if(stage >= 2) boxTxt = p.quotient;
      var boxText = middleText(boxCx, boxCy, boxTxt, "slot-orange", {size:26, id:"boxText"});
      if(forward && stage===2) boxText.setAttribute("class", boxText.getAttribute("class")+" fade-in");
      g2.appendChild(boxText);
      g2.appendChild(middleText(372, boxCy, "=", null, {size:26}));
      g2.appendChild(middleText(410, boxCy, p.dividend, null, {size:26}));
      svg.appendChild(g2);

      if(stage >= 3){
        var tipX1 = boxCx, tipY1 = 66, tipAngle1 = -90;
        var lineEnd1 = arrowLineEnd(tipX1, tipY1, tipAngle1);
        var pathD = "M " + boxCx + " " + (boxCy-22) + " L " + lineEnd1.x + " " + lineEnd1.y;
        var arrow = arrowPath(pathD);
        var head1 = arrowHead(tipX1, tipY1, tipAngle1);
        if(forward) head1.style.opacity = "0";
        var g3 = el("g", {});
        g3.appendChild(arrow);
        g3.appendChild(head1);
        svg.appendChild(g3);
        if(forward){
          animateDraw(arrow, 550, function(){
            head1.style.opacity = "1";
            qSlot.textContent = p.quotient;
            qSlot.setAttribute("class", "slot-orange pop");
          });
        }
      }
    }
    updateEquationSlots();
  }

  // ==================================================================
  // LEVEL 2
  // ==================================================================
  function renderLevel2(forward){
    var p = state.problem;
    var stage = state.hintStage;
    var listCount = p.quotient + 1;
    var listStartY = 110;
    var correctFinalY = 110;
    var visibleRows = stage <= 2 ? listCount : 1;
    var listEndY = listStartY + (visibleRows-1)*LAYOUT.lineH;
    var needSubArea = stage >= 4;
    var totalH = needSubArea ? 265 : Math.max(190, listEndY + 70);
    svg.setAttribute("viewBox", "0 0 500 " + totalH);
    clearSvg();

    // ---- row 1: main equation ----
    // From hint 3 onward the division equation moves slightly upward and then stays fixed.
    var eqY = stage >= 3 ? 36 : LAYOUT.eqY;
    var g1 = el("g", { id:"divisionEquation" });
    // From hint 4 onward the subtraction diagram appears directly beneath the
    // dividend, so from that point on the dividend is drawn digit-by-digit on
    // the same fixed columns the subtraction uses, keeping every place value
    // lined up. Before hint 4 there's nothing to align to, so it's drawn as
    // a single centered number as before.
    if(stage >= 4){
      g1.appendChild(renderNumberColumns(p.dividend, eqY, null, "dividendDigits"));
    } else {
      g1.appendChild(bigText(80, eqY, p.dividend, null, {size:30}));
    }
    g1.appendChild(bigText(125, eqY, "÷", null, {size:30}));
    g1.appendChild(bigText(165, eqY, p.divisor, null, {size:30}));
    g1.appendChild(bigText(200, eqY, "=", null, {size:30}));

    // On the way INTO stage 3, the "?" only turns into the number once the arrow
    // animation (built in buildList) finishes. On any other transition (already past
    // stage 3, or stepping backward into it) show the final number immediately.
    var quotientRevealedNow = stage > 3 || (stage === 3 && !forward);
    var qTxt = quotientRevealedNow ? p.quotient : (state.inputDigits.length ? state.inputDigits : "?");
    var qCls = quotientRevealedNow ? "slot-orange" : (state.inputDigits.length ? "slot-blue" : "slot-wait");
    var qSlot = bigText(235, eqY, qTxt, qCls, {size:30, id:"qSlot"});
    g1.appendChild(qSlot);

    if(stage >= 3){
      var amariLabel = bigText(300, eqY, "あまり", null, {size:22});
      amariLabel.setAttribute("fill", "#6b6a8c");
      if(forward && stage === 3) amariLabel.setAttribute("class", "fade-in");
      g1.appendChild(amariLabel);

      // Same rule as the quotient: only reveal immediately when arriving from a step
      // that already knows it (stepping backward), otherwise wait for the subtraction's
      // arrow animation (in buildSubtraction) to update this slot itself.
      var remainderRevealedNow = stage > 5 || (stage === 5 && !forward);
      var rTxt = remainderRevealedNow ? p.remainder : (state.inputRemainder.length ? state.inputRemainder : "?");
      var rCls = remainderRevealedNow ? "slot-orange" : (state.inputRemainder.length ? "slot-blue" : "slot-wait");
      var rSlot = bigText(365, eqY, rTxt, rCls, {size:30, id:"rSlot"});
      if(forward && stage === 3) rSlot.setAttribute("class", rSlot.getAttribute("class")+" fade-in");
      g1.appendChild(rSlot);
    }

    // Stage 3: animate the equation into its final position before the arrow appears.
    if(stage === 3 && forward){
      g1.style.transform = "translateY(10px)";
      g1.style.transition = "transform .45s ease";
      setTimeout(function(){ g1.style.transform = "translateY(0)"; }, 40);
    }
    svg.appendChild(g1);

    var hintCaptionEl = document.getElementById("hintCaption");
    if(stage < 1){ if(hintCaptionEl) hintCaptionEl.textContent = ""; updateEquationSlots(); return; }

    var captionMap = {
      1: "ちょうどに ならない！ わりきれないね！",
      2: "これが いちばん おおきくて、ちかいね",
      3: "３が わり算の こたえだよ",
      4: "つぎは あまりを もとめるよ！",
      5: "あまりが わかったね！"
    };
    if(hintCaptionEl){
      hintCaptionEl.textContent = captionMap[stage] || "";
      hintCaptionEl.className = forward ? "fade-in" : "";
    }

    // ---- multiplication list ----
    var correctIndex = p.quotient;
    var listG = el("g", { id:"listG" });
    svg.appendChild(listG);
    buildList(listG, p, listCount, correctIndex, stage, forward, listStartY, correctFinalY);

    // ---- subtraction diagram (stage 4-5) ----
    if(stage >= 4){
      // Keep it compact and directly beneath the division equation.
      buildSubtraction(svg, p, 72, stage, forward);
    }

    updateEquationSlots();
  }

  function buildList(container, p, listCount, correctIndex, stage, forward, startY, correctFinalY){
    // Keep the multiplier column aligned with the quotient slot above.
    var divisorX = 155;
    var timesX = 195;
    var multiplierX = 235;
    var equalsX = 265;
    var productX = 305;
    var labelX = 385;

    for(var i=1; i<=listCount; i++){
      var isCorrect = (i === correctIndex);
      var isOver = (i === listCount);

      // Stage 3 onward: wrong formulas have already completed the stage-2 shatter.
      if(stage >= 3 && !isCorrect) continue;

      var originalY = startY + (i-1)*LAYOUT.lineH;
      // From hint 3 onward the correct formula is rendered at its final fixed position.
      // During hint 3 it starts visually at its old position and animates into this spot.
      var y = stage >= 3 ? correctFinalY : originalY;
      var rowClass = isCorrect ? "correct-row" : "wrong-row";
      if(forward && stage===1) rowClass += " fade-in";
      var rowG = el("g", { class: rowClass });

      rowG.appendChild(bigText(divisorX, y+7, p.divisor, null, {size:20}));
      rowG.appendChild(bigText(timesX, y+7, "×", null, {size:20}));

      if(stage === 1){
        rowG.appendChild(box(multiplierX, y, 30, 30, ""));
        rowG.appendChild(bigText(multiplierX, y+7, i, null, {size:20}));
      } else {
        rowG.appendChild(bigText(multiplierX, y+7, i, isCorrect && stage>=3 ? "slot-orange" : null, {size:20, id: isCorrect ? "multiplierText" : null}));
      }

      rowG.appendChild(bigText(equalsX, y+7, "=", null, {size:20}));
      var prodTxt = bigText(productX, y+7, p.divisor*i, null, {size:20, id: isCorrect ? "productText" : null});
      rowG.appendChild(prodTxt);

      if(isOver){
        rowG.appendChild(bigText(labelX, y+7, "（おおきいね！）", null, {size:14, fill:"#E8505B"}));
      } else if(isCorrect && stage < 4){
        // From hint 4 onward this row is busy becoming part of the subtraction step,
        // so the "ちょうどいい！" label is retired.
        rowG.appendChild(bigText(labelX, y+7, "（ちょうどいい！）", null, {size:14, fill:"#2FAE8B"}));
      }

      if(!isCorrect && stage === 2){
        var strike = el("line", { x1:divisorX-22, y1:y+1, x2:labelX+32, y2:y+1, class:"strike-line" });
        rowG.appendChild(strike);
        if(!forward){
          rowG.classList.add("gray", "shatter");
        } else {
          (function(target, delay){
            setTimeout(function(){
              target.classList.add("strike");
              setTimeout(function(){
                target.classList.add("gray");
                setTimeout(function(){ target.classList.add("shatter"); }, 220);
              }, 430);
            }, delay);
          })(rowG, Math.max(20, (i-1)*40));
        }
      }

      if(isCorrect && stage === 2){
        // After the wrong rows disappear, keep the correct equation at the top of the list.
        rowG.appendChild(outlineBox(multiplierX, y, 30, 30, "#FF8C42"));
        var shift = correctFinalY-originalY;
        if(!forward){
          rowG.style.transform = "translate(0," + shift + ")";
        } else {
          (function(target, shift){
            setTimeout(function(){ target.style.transform = "translate(0," + shift + ")"; }, 920);
          })(rowG, shift);
        }
      }

      if(isCorrect && stage >= 3){
        rowG.appendChild(outlineBox(multiplierX, y, 30, 30, "#FF8C42"));

        if(stage === 3){
          // Move the correct multiplication equation into its final, readable position first.
          var shift3 = correctFinalY-originalY;
          if(forward){
            rowG.style.transform = "translateY(" + (originalY-correctFinalY) + "px)";
            rowG.style.transition = "transform .45s ease";
            setTimeout(function(target){ target.style.transform = "translateY(0)"; }, 60, rowG);
          } else {
            rowG.style.transform = "translateY(0)";
          }
        }
      }

      container.appendChild(rowG);

      if(isCorrect && stage === 3){
        // The arrow appears only after the equation has moved into place.
        var arrowStartY = correctFinalY - 16;
        var tipX2 = multiplierX, tipY2 = eqYForArrow(), tipAngle2 = -90;
        var lineEnd2 = arrowLineEnd(tipX2, tipY2, tipAngle2);
        var arrow = arrowPath("M " + multiplierX + " " + arrowStartY + " L " + lineEnd2.x + " " + lineEnd2.y);
        var arrowHeadEl = arrowHead(tipX2, tipY2, tipAngle2);
        if(forward){
          // Stay fully invisible while the equation is still sliding into place,
          // so nothing is drawn (line or head) until that move has finished.
          arrow.style.opacity = "0";
          arrowHeadEl.style.opacity = "0";
        }
        container.appendChild(arrow);
        container.appendChild(arrowHeadEl);
        if(forward){
          setTimeout(function(pathEl, headEl, pRef){
            pathEl.style.opacity = "1";
            // The triangle only appears once the line has fully drawn itself in.
            animateDraw(pathEl, 500, function(){
              headEl.style.opacity = "1";
              var qSlot = document.getElementById("qSlot");
              if(qSlot){ qSlot.textContent = pRef.quotient; qSlot.setAttribute("class","slot-orange pop"); }
            });
          }, 520, arrow, arrowHeadEl, p);
        }
      }
    }

    function eqYForArrow(){ return 36; }
  }

  function rightText(x, y, txt, cls, extra){
    var attrs = { x:x, y:y, "text-anchor":"end", "font-size": extra && extra.size || 26,
                  "font-weight":"800", "font-family":"'M PLUS Rounded 1c', sans-serif" };
    if(extra){ for(var k in extra){ if(k!=="size") attrs[k]=extra[k]; } }
    var t = el("text", attrs, txt);
    if(cls) t.setAttribute("class", cls);
    else if(!attrs.fill) t.setAttribute("fill", "#2B2A4C");
    return t;
  }

  function buildSubtraction(svgRoot, p, topY, stage, forward){
    var g = el("g", { class: (forward && stage===4) ? "fade-in" : "" });

    var productY = topY;

    // The number being subtracted (引く数) is drawn one digit per fixed
    // column - the same SUB_COLS columns as the dividend above it - so the
    // tens and ones places always line up, regardless of digit glyph widths.
    var prodTarget = renderNumberColumns(p.divisor*p.quotient, productY, "slot-orange", "subProduct");
    g.appendChild(prodTarget);
    svgRoot.appendChild(g);

    // Measure the subtrahend's real rendered box (so this works for 1- or 2-digit
    // products alike) and place the minus sign and underline the way a paper-and-pencil
    // subtraction is written: minus sign directly beside the number, on the same line,
    // with the underline spanning just that line.
    var prodBox = prodTarget.getBBox();
    var minusRightX = prodBox.x - 8;
    var minusEl = rightText(minusRightX, productY, "−", null, {size:26});
    g.appendChild(minusEl);
    var minusBox = minusEl.getBBox();

    var lineY = prodBox.y + prodBox.height + 8;
    var underlineLeft = minusBox.x - 4;
    var underlineRight = Math.max(prodBox.x + prodBox.width, SUB_COLS.onesX + SUB_COLS.colW/2) + 4;
    var answerY = lineY + 30;

    g.appendChild(el("line", {
      x1:underlineLeft, y1:lineY, x2:underlineRight, y2:lineY,
      stroke:"#2B2A4C", "stroke-width":3, "stroke-linecap":"round"
    }));

    if(stage === 4 && forward){
      // Start from just above the multiplication answer, travel upward,
      // then turn left at the target height. One bend only.
      var src = document.getElementById("productText");
      prodTarget.style.opacity = "0";
      if(src){
        var srcBox = src.getBoundingClientRect();
        var dstBox = prodTarget.getBoundingClientRect();
        var svgBox = svg.getBoundingClientRect();
        var vb = svg.viewBox.baseVal;
        var scaleX = vb.width / svgBox.width, scaleY = vb.height / svgBox.height;
        var sx = (srcBox.left + srcBox.width/2 - svgBox.left) * scaleX;
        var syTop = (srcBox.top - svgBox.top) * scaleY;
        var dx = (dstBox.right - svgBox.left) * scaleX - 2;
        var dy = (dstBox.top + dstBox.height/2 - svgBox.top) * scaleY;
        var tipAngle3 = 180;
        var lineEnd3 = arrowLineEnd(dx, dy, tipAngle3);
        var pathD = "M "+sx+" "+syTop+" L "+sx+" "+dy+" L "+lineEnd3.x+" "+lineEnd3.y;
        var arrow = arrowPath(pathD);
        var head3 = arrowHead(dx, dy, tipAngle3);
        head3.style.opacity = "0";
        svgRoot.appendChild(arrow);
        svgRoot.appendChild(head3);
        animateDraw(arrow, 600, function(){
          head3.style.opacity = "1";
          prodTarget.style.opacity = "1";
          prodTarget.setAttribute("class", "slot-orange pop");
        });
      } else {
        prodTarget.style.opacity = "1";
      }
    }

    if(stage >= 5){
      // Answer is immediately below the underline, on the same digit columns
      // as the dividend and the subtracted number above it.
      var remEl = renderNumberColumns(p.remainder, answerY, "slot-orange", "subRemainder");
      svgRoot.appendChild(remEl);

      if(forward && stage === 5){
        remEl.style.opacity = "0";
        // Step 1: the subtraction's own answer appears first, by itself.
        setTimeout(function(){
          remEl.style.opacity = "1";
          remEl.setAttribute("class", "slot-orange pop");

          // Step 2: only once that's visible does the arrow start growing up to
          // the "あまり ?" slot. Its endpoint is measured against the slot's real
          // position, so it always lands exactly on it regardless of layout.
          setTimeout(function(){
            var rSlot = document.getElementById("rSlot");
            if(!rSlot) return;
            var eqRow = document.getElementById("listG");
            var srcBox = remEl.getBoundingClientRect();
            var dstBox = rSlot.getBoundingClientRect();
            var eqBox = eqRow ? eqRow.getBoundingClientRect() : null;
            var svgBox = svg.getBoundingClientRect();
            var vb = svg.viewBox.baseVal;
            var scaleX = vb.width / svgBox.width, scaleY = vb.height / svgBox.height;

            // Start just below the subtraction's own answer.
            var sx = (srcBox.left + srcBox.width/2 - svgBox.left) * scaleX;
            var sy = (srcBox.bottom - svgBox.top) * scaleY + 4;
            // Target: just below the "あまり ?" slot.
            var dx = (dstBox.left + dstBox.width/2 - svgBox.left) * scaleX;
            var dy = (dstBox.bottom - svgBox.top) * scaleY + 6;
            // Drop below both the answer AND the multiplication equation before
            // heading sideways, so the arrow never crosses through that equation.
            var eqBottom = eqBox ? (eqBox.bottom - svgBox.top) * scaleY : sy;
            var dropY = Math.max(sy, eqBottom) + 14;

            var tipAngle4 = -90;
            var lineEnd4 = arrowLineEnd(dx, dy, tipAngle4);
            var pathD2 = "M "+sx+" "+sy+" L "+sx+" "+dropY+" L "+dx+" "+dropY+" L "+lineEnd4.x+" "+lineEnd4.y;
            var arrow2 = arrowPath(pathD2);
            var head4 = arrowHead(dx, dy, tipAngle4);
            head4.style.opacity = "0";
            svgRoot.appendChild(arrow2);
            svgRoot.appendChild(head4);

            // Step 3: only after the arrow finishes does "?" become the number,
            // and the triangle only appears once the line is fully drawn.
            animateDraw(arrow2, 650, function(){
              head4.style.opacity = "1";
              rSlot.textContent = p.remainder;
              rSlot.setAttribute("class", "slot-orange pop");
            });
          }, 420);
        }, 60);
      } else {
        remEl.style.opacity = "1";
      }
    }
  }

  // ==================================================================
  // LEVEL 3 (何十・何百のわり算)
  // ==================================================================
  function renderLevel3(forward){
    var p = state.problem;
    var stage = state.hintStage;
    svg.setAttribute("viewBox", "0 0 500 240");
    clearSvg();

    var hintCaptionEl = document.getElementById("hintCaption");
    if(hintCaptionEl) hintCaptionEl.textContent = "";

    // 式
    var g1 = el("g", {});
    g1.appendChild(bigText(140, 44, p.dividend, null, {size:32}));
    g1.appendChild(bigText(195, 44, "÷", null, {size:32}));
    g1.appendChild(bigText(235, 44, p.divisor, null, {size:32}));
    g1.appendChild(bigText(275, 44, "=", null, {size:32}));

    var targetDigits = p.targetQuotientDigits || 2;
    var slotTxt = (stage >= 3) ? p.quotient : (state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits));
    var slotCls = (stage >= 3) ? "slot-orange" : (state.inputDigits.length ? "slot-blue" : "slot-wait");
    var qSlot = bigText(335, 44, slotTxt, slotCls, {size:34, id:"qSlot"});
    g1.appendChild(qSlot);
    svg.appendChild(g1);

    var isHundred = String(p.level) === "3-2";
    var unitName = isHundred ? "100" : "10";
    var unitCount = isHundred ? Math.round(p.dividend / 100) : Math.round(p.dividend / 10);
    var unitAns = isHundred ? Math.round(p.quotient / 100) : Math.round(p.quotient / 10);

    // ステップ1: まとまりアイコンの描画（数が多い場合も枠からはみ出ないよう段階的に縮小調整）
    if(stage >= 1){
      var g2 = el("g", { class: (forward && stage === 1) ? "fade-in" : "" });
      var boxW, boxH, gap, fontSize, rx;
      if(unitCount <= 8){
        boxW = 40; boxH = 32; gap = 6; fontSize = 13; rx = 6;
      } else if(unitCount <= 12){
        boxW = 32; boxH = 28; gap = 4; fontSize = 11; rx = 5;
      } else if(unitCount <= 16){
        boxW = 24; boxH = 24; gap = 3; fontSize = 9.5; rx = 4;
      } else {
        boxW = 19; boxH = 22; gap = 2; fontSize = 8; rx = 3;
      }

      var totalW = unitCount * boxW + (unitCount - 1) * gap;
      var startX = Math.round((500 - totalW) / 2);
      var boxY = 74 + Math.round((32 - boxH) / 2);

      for(var i = 0; i < unitCount; i++){
        var bx = startX + i * (boxW + gap);
        var r = el("rect", {
          x: bx, y: boxY, width: boxW, height: boxH, rx: rx,
          fill: isHundred ? "#fef3c7" : "#dbeafe",
          stroke: isHundred ? "#f59e0b" : "#3b82f6",
          "stroke-width": (unitCount > 16) ? 1.5 : 2
        });
        var t = el("text", {
          x: bx + boxW / 2,
          y: boxY + boxH / 2 + (fontSize * 0.35),
          "text-anchor": "middle",
          fill: isHundred ? "#b45309" : "#1d4ed8",
          "font-size": fontSize,
          "font-weight": 800,
          "font-family": "'M PLUS Rounded 1c', sans-serif"
        });
        t.textContent = unitName;
        g2.appendChild(r);
        g2.appendChild(t);
      }
      var caption1 = middleText(250, 130, unitName + " の まとまりが " + unitCount + " こ あるよ！", null, {size: 16});
      g2.appendChild(caption1);
      svg.appendChild(g2);
    }

    // ステップ2: 束をもとにした割り算
    if(stage >= 2){
      var g3 = el("g", { class: (forward && stage === 2) ? "fade-in" : "" });
      var subEqTxt = unitCount + " ÷ " + p.divisor + " ＝ " + unitAns + " （" + unitName + "が " + unitAns + "こ分）";
      var subEqSz = calcSvgFontSize(subEqTxt, 460, 19, 14);
      var subEq = middleText(250, 168, subEqTxt, "slot-orange", {size: subEqSz});
      g3.appendChild(subEq);
      svg.appendChild(g3);
    }

    // ステップ3: 答え確定
    if(stage >= 3){
      var g4 = el("g", { class: (forward && stage === 3) ? "fade-in" : "" });
      var finalTxt = middleText(250, 206, "だから　答えは " + p.quotient + " ！", "slot-orange", {size: 22});
      g4.appendChild(finalTxt);
      svg.appendChild(g4);
      if(forward){
        qSlot.textContent = p.quotient;
        qSlot.setAttribute("class", "slot-orange pop");
      }
    }
  }

  // ==================================================================
  // LEVEL 4 (2けた暗算・分解ツリー＆束の解体)
  // ==================================================================
  function renderLevel4(forward){
    var p = state.problem;
    var stage = state.hintStage;
    svg.setAttribute("viewBox", "0 0 500 250");
    clearSvg();

    // 式
    var g1 = el("g", {});
    g1.appendChild(bigText(140, 42, p.dividend, null, {size:32}));
    g1.appendChild(bigText(195, 42, "÷", null, {size:32}));
    g1.appendChild(bigText(235, 42, p.divisor, null, {size:32}));
    g1.appendChild(bigText(275, 42, "=", null, {size:32}));

    var targetDigits = p.targetQuotientDigits || 2;
    var slotTxt = (stage >= state.maxHint) ? p.quotient : (state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits));
    var slotCls = (stage >= state.maxHint) ? "slot-orange" : (state.inputDigits.length ? "slot-blue" : "slot-wait");
    var qSlot = bigText(335, 42, slotTxt, slotCls, {size:34, id:"qSlot"});
    g1.appendChild(qSlot);

    if(p.hasRemainder){
      g1.appendChild(middleText(390, 42, "あまり", null, {size:18}));
      var rTxt = (stage >= state.maxHint) ? p.remainder : (state.inputRemainder.length ? state.inputRemainder : "?");
      var rCls = (stage >= state.maxHint) ? "slot-orange" : (state.inputRemainder.length ? "slot-blue" : "slot-wait");
      g1.appendChild(bigText(440, 42, rTxt, rCls, {size:30, id:"rSlot"}));
    }
    svg.appendChild(g1);

    var isUnbundle = String(p.level) !== "4-1";
    var part1 = p.tenPart || 0;
    var part2 = isUnbundle ? (p.unbundlePart || 0) : (p.onePart || 0);

    // ステップ1: 分解ツリー
    if(stage >= 1){
      var g2 = el("g", { class: (forward && stage === 1) ? "fade-in" : "" });
      var l1 = el("line", { x1: 155, y1: 52, x2: 110, y2: 82, stroke: "#cbd5e1", "stroke-width": 2.5 });
      var l2 = el("line", { x1: 155, y1: 52, x2: 210, y2: 82, stroke: "#cbd5e1", "stroke-width": 2.5 });
      g2.appendChild(l1); g2.appendChild(l2);

      g2.appendChild(box(110, 102, 54, 32, "hintBox"));
      g2.appendChild(middleText(110, 102, part1, null, {size:19}));

      g2.appendChild(box(210, 102, 54, 32, "hintBox"));
      g2.appendChild(middleText(210, 102, part2, null, {size:19}));

      var capTxt = isUnbundle ? "十の位のあまり（10の束）をバラして " + part2 + " と分けるよ！" : "十の位（" + part1 + "）と 一の位（" + part2 + "）に分けるよ！";
      var capSz = calcSvgFontSize(capTxt, 460, 15, 12);
      g2.appendChild(middleText(250, 142, capTxt, null, {size: capSz}));
      svg.appendChild(g2);
    }

    // ステップ2: 1つ目の計算（十の位のわり算）
    // 2つの式を確実に離し（cx1=130, cx2=365）、重なりを防止
    if(stage >= 2){
      var g3 = el("g", { class: (forward && stage === 2) ? "fade-in" : "" });
      var ans1 = Math.floor(part1 / p.divisor);
      var eqStr1 = part1 + " ÷ " + p.divisor + " ＝ " + ans1;
      var sz1 = calcSvgFontSize(eqStr1, 215, 18, 13);
      g3.appendChild(middleText(130, 174, eqStr1, "slot-orange", {size: sz1}));
      svg.appendChild(g3);
    }

    // ステップ3: 2つ目の計算（一の位のわり算）
    // 余りが出る場合などで式が長くなっても枠からはみ出ないよう自動調整
    if(stage >= 3){
      var g4 = el("g", { class: (forward && stage === 3) ? "fade-in" : "" });
      var ans2 = Math.floor(part2 / p.divisor);
      var rem2 = part2 % p.divisor;
      var eqStr2 = part2 + " ÷ " + p.divisor + " ＝ " + ans2 + (rem2 > 0 ? " あまり " + rem2 : "");
      var sz2 = calcSvgFontSize(eqStr2, 215, 18, 12);
      g4.appendChild(middleText(365, 174, eqStr2, "slot-orange", {size: sz2}));
      svg.appendChild(g4);
    }

    // ステップ4: 合わせて答え
    if(stage >= 4 || (stage >= 3 && !isUnbundle)){
      var g5 = el("g", { class: (forward) ? "fade-in" : "" });
      var finStr = "合わせて　答えは " + p.quotient + (p.remainder > 0 ? " あまり " + p.remainder : "") + " ！";
      var finSz = calcSvgFontSize(finStr, 460, 21, 15);
      g5.appendChild(middleText(250, 216, finStr, "slot-orange", {size: finSz}));
      svg.appendChild(g5);
      if(forward){
        qSlot.textContent = p.quotient;
        qSlot.setAttribute("class", "slot-orange pop");
        var rSlotEl = document.getElementById("rSlot");
        if(rSlotEl && p.remainder > 0){
          rSlotEl.textContent = p.remainder;
          rSlotEl.setAttribute("class", "slot-orange pop");
        }
      }
    }
  }

  // ==================================================================
  // LEVEL 5 & 6 (筆算レンダラー)
  // ==================================================================
  function renderLevelLongDivision(forward){
    var p = state.problem;
    var stage = state.hintStage;
    svg.setAttribute("viewBox", "0 0 500 260");
    clearSvg();

    var ox = 160, oy = 65;
    var colW = 26, rowH = 26;

    var divStr = String(p.dividend);
    var qStr = String(p.quotient);

    // 割る数
    svg.appendChild(middleText(ox - 30, oy + rowH, p.divisor, null, {size: 24}));

    // 筆算かっこ線と上の横棒
    var barWidth = (divStr.length + 1) * colW + 8;
    var bracketPath = el("path", {
      d: "M " + (ox - 14) + " " + (oy + rowH + 6) +
         " C " + (ox - 22) + " " + (oy + rowH - 6) + " " + (ox - 22) + " " + (oy + 4) + " " + (ox - 12) + " " + oy +
         " L " + (ox + barWidth) + " " + oy,
      fill: "none",
      stroke: "#2b2a4c",
      "stroke-width": 2.5,
      "stroke-linecap": "round"
    });
    svg.appendChild(bracketPath);

    // 割られる数の各桁
    for(var i = 0; i < divStr.length; i++){
      svg.appendChild(middleText(ox + i * colW + 12, oy + rowH, divStr[i], null, {size: 24}));
    }

    // 商の表示
    var qOffset = divStr.length - qStr.length;
    for(var j = 0; j < qStr.length; j++){
      var qChar = (stage >= state.maxHint) ? qStr[j] : (state.inputDigits[j] || "?");
      var qCls = (stage >= state.maxHint) ? "slot-orange" : (state.inputDigits[j] ? "slot-blue" : "slot-wait");
      if(p.zeroInMiddle && qStr[j] === "0" && stage >= 2){
        qCls = "slot-orange pop";
      }
      var qDigitEl = middleText(ox + (j + qOffset) * colW + 12, oy - 6, qChar, qCls, {size: 26});
      svg.appendChild(qDigitEl);
    }

    // ステップ解説
    if(stage >= 1){
      var gStep1 = el("g", { class: (forward && stage === 1) ? "fade-in" : "" });
      var firstQ = parseInt(qStr[0], 10);
      var firstProd = p.divisor * firstQ;
      var prodStr = String(firstProd);
      for(var k = 0; k < prodStr.length; k++){
        gStep1.appendChild(middleText(ox + k * colW + 12, oy + rowH * 2, prodStr[k], null, {size: 22}));
      }
      var line1 = el("line", {
        x1: ox - 4, y1: oy + rowH * 2 + 8,
        x2: ox + divStr.length * colW + 4, y2: oy + rowH * 2 + 8,
        stroke: "#2b2a4c", "stroke-width": 2
      });
      gStep1.appendChild(line1);
      gStep1.appendChild(middleText(370, 80, "① たてる → ② かける！", "slot-orange", {size: 16}));
      svg.appendChild(gStep1);
    }

    if(stage >= 2){
      var gStep2 = el("g", { class: (forward && stage === 2) ? "fade-in" : "" });
      if(p.zeroInMiddle){
        gStep2.appendChild(middleText(370, 120, "十の位でわれないから\n商に「0」をたてる！", "slot-orange", {size: 15}));
      } else {
        gStep2.appendChild(middleText(370, 120, "③ ひく → ④ おろす！", null, {size: 16}));
      }
      svg.appendChild(gStep2);
    }

    if(stage >= 3){
      var gStep3 = el("g", { class: (forward && stage === 3) ? "fade-in" : "" });
      var remY = oy + rowH * 4;
      var remLine = el("line", {
        x1: ox + Math.max(0, divStr.length - 2) * colW, y1: remY - 14,
        x2: ox + divStr.length * colW + 4, y2: remY - 14,
        stroke: "#2b2a4c", "stroke-width": 2
      });
      gStep3.appendChild(remLine);

      var remTxt = middleText(ox + (divStr.length - 1) * colW + 12, remY, String(p.remainder), "slot-orange", {size: 24});
      gStep3.appendChild(remTxt);

      var finMsg = p.remainder > 0 ? "あまりは " + p.remainder + " ！" : "あまりなし（0）！";
      gStep3.appendChild(middleText(370, 165, finMsg, "slot-orange", {size: 17}));
      svg.appendChild(gStep3);
    }

    if(stage >= state.maxHint){
      var gFin = el("g", { class: forward ? "fade-in" : "" });
      gFin.appendChild(middleText(370, 210, "筆算かんせい！", "slot-orange pop", {size: 22}));
      svg.appendChild(gFin);
    }
  }

  // ------------------------------------------------------------------
  // hint navigation
  // ------------------------------------------------------------------
  hintNextBtn.addEventListener("click", function(){
    if(state.hintStage >= state.maxHint || state.answered) return;
    playSound('step');
    state.hintStage++;
    renderAll(true);
  });
  hintBackBtn.addEventListener("click", function(){
    if(state.hintStage <= 0) return;
    playSound('step');
    state.hintStage--;
    renderAll(false);
  });

  // ------------------------------------------------------------------
  // answer checking (submitBtn fallback)
  // ------------------------------------------------------------------
  if(submitBtn){
    submitBtn.addEventListener("click", function(){
      checkCurrentAnswer();
    });
  }

  nextProblemBtn.addEventListener("click", function(){
    playSound('click');
    newProblem();
  });

  // ------------------------------------------------------------------
  // level select / navigation
  // ------------------------------------------------------------------
  document.querySelectorAll(".category-header").forEach(function(header){
    header.addEventListener("click", function(){
      playSound('click');
      var category = header.parentElement;
      category.classList.toggle("open");
    });
  });

  document.querySelectorAll("#levelSelect .level-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      playSound('click');
      state.level = btn.getAttribute("data-level");
      state.score = { correct:0, total:0 };
      scoreBox.classList.remove("show");
      document.getElementById("levelSelect").style.display = "none";
      document.getElementById("problemScreen").classList.add("show");
      lastKey = null;
      newProblem();
    });
  });

  document.getElementById("backToLevels").addEventListener("click", function(){
    playSound('click');
    document.getElementById("problemScreen").classList.remove("show");
    document.getElementById("levelSelect").style.display = "block";
    scoreBox.classList.remove("show");
  });

  // Initialize Raid Boss UI
  initRaidUI();

  // Test hooks
  window.__warizan = {
    state: state,
    pressDigit: pressDigit,
    clearDigit: clearDigit,
    newProblem: newProblem,
    checkCurrentAnswer: checkCurrentAnswer
  };

})();
</script>
</body>
</html>
