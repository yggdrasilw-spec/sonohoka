<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>わり算れんしゅう ヒントつき もんだいしゅう</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');

  :root{
    --paper:#FBF3E1;
    --paper-line:#E4D6AE;
    --ink:#2B2A4C;
    --ink-soft:#6b6a8c;
    --accent:#FF8C42;
    --accent-soft:#FFE7CC;
    --accent-deep:#E06B1F;
    --good:#2FAE8B;
    --good-soft:#DBF3EA;
    --bad:#E8505B;
    --bad-soft:#FDE3E1;
    --card:#FFFFFF;
    --blue:#3E6D9C;
    --blue-soft:#E4EEF8;
  }

  *{ box-sizing: border-box; }

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  body{
    margin:0;
    min-height:100vh;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 40px;
    font-family:'M PLUS Rounded 1c', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    align-items:stretch;
    padding: 10px 12px;
  }

  #app{
    width:100%;
    max-width: 1240px;
    height:100%;
    min-height:0;
    display:flex;
    flex-direction:column;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
    flex:0 0 auto;
    gap:8px;
  }

  header.top h1{
    font-size: 1.3rem;
    font-weight:800;
    margin:0;
    letter-spacing: .02em;
  }

  #scoreBox{
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    padding: 6px 16px;
    font-weight:700;
    font-size:.95rem;
    color: var(--ink-soft);
    display:none;
    align-items:center;
    gap:6px;
  }
  #scoreBox.show{ display:flex; }
  #scoreBox b{ color: var(--good); font-size:1.05rem; }

  .sound-btn{
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    cursor: pointer;
    transition: transform .1s, border-color .15s;
    user-select: none;
    flex-shrink: 0;
  }
  .sound-btn:hover{
    transform: scale(1.08);
    border-color: var(--accent);
  }
  .sound-btn.sound-off{
    filter: grayscale(1) opacity(0.45);
  }

  /* ---------- raid boss controls ---------- */
  .raid-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    position:relative;
  }
  .raid-code-box{
    display:flex;
    align-items:center;
    gap:4px;
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    padding: 3px 8px;
  }
  .raid-code-box input{
    width: 64px;
    border: none;
    outline: none;
    background: transparent;
    font-family: monospace, inherit;
    font-weight: 800;
    font-size: .9rem;
    text-align: center;
    color: var(--blue);
  }
  .raid-btn{
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: .8rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .15s;
  }
  .raid-btn:hover{ opacity: .9; }
  .conn-status{
    font-size: .85rem;
    cursor: default;
  }
  .boss-mini-status{
    display: none;
    align-items: center;
    gap: 4px;
    background: #fff8e6;
    border: 2px solid #ffd166;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: .85rem;
    font-weight: 800;
    color: #b45309;
    box-shadow: 0 2px 6px rgba(180,83,9,.1);
    animation: fadeInAnim .3s ease;
  }
  .boss-mini-status.show{ display: flex; }
  .streak-badge{
    display: none;
    align-items: center;
    gap: 4px;
    background: #fff1f2;
    border: 2px solid #fda4af;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: .85rem;
    font-weight: 800;
    color: #e11d48;
  }
  .streak-badge.show{ display: flex; }
  .user-profile-box{
    display: flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    padding: 2px 6px;
    position: relative;
  }
  .avatar-select-btn{
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 1px 3px;
    border-radius: 8px;
    transition: transform .1s;
  }
  .avatar-select-btn:hover{ transform: scale(1.15); }
  .avatar-picker-popover{
    position: absolute;
    top: 38px;
    left: 0;
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 12px;
    padding: 6px 8px;
    display: none;
    gap: 6px;
    z-index: 1000;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .avatar-picker-popover.show{ display: flex; }
  .avatar-option{
    font-size: 1.4rem;
    cursor: pointer;
    padding: 3px;
    border-radius: 6px;
    transition: background .15s;
  }
  .avatar-option:hover{ background: var(--accent-soft); }
  .name-input-box input{
    width: 60px;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-weight: 700;
    font-size: .85rem;
    text-align: center;
    color: var(--ink);
  }
  .raid-msg{
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    font-size: .8rem;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    border: 2px solid var(--paper-line);
    white-space: nowrap;
    z-index: 1000;
    display: none;
    animation: fadeInAnim .2s ease;
  }
  .raid-msg.show{ display: block; }
  .raid-msg.error{ color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
  .raid-msg.good{ color: var(--good); border-color: var(--good); background: var(--good-soft); }
  .raid-msg.warn{ color: var(--accent-deep); border-color: var(--accent); background: var(--accent-soft); }

  .card{
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 6px 0 var(--paper-line), 0 8px 20px rgba(43,42,76,.08);
    padding: 16px;
  }

  /* ---------- level select accordion ---------- */
  #levelSelect {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-right: 10px;
  }
  #levelSelect::-webkit-scrollbar {
    width: 8px;
  }
  #levelSelect::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.04);
    border-radius: 999px;
  }
  #levelSelect::-webkit-scrollbar-thumb {
    background: var(--paper-line);
    border-radius: 999px;
  }
  #levelSelect::-webkit-scrollbar-thumb:hover {
    background: var(--ink-soft);
  }

  .level-category {
    margin-bottom: 12px;
    border: 2px solid var(--paper-line);
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
  }
  .category-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--card);
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: background .15s;
  }
  .category-header:hover {
    background: var(--paper-line);
  }
  .category-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--ink);
  }
  .category-arrow {
    font-size: 0.85rem;
    color: var(--ink-soft);
    transition: transform .2s ease;
  }
  .level-category.open .category-arrow {
    transform: rotate(180deg);
  }
  .category-content {
    display: none;
    padding: 12px;
    gap: 10px;
    flex-direction: column;
    border-top: 2px solid var(--paper-line);
  }
  .level-category.open .category-content {
    display: flex;
  }

  #levelSelect .level-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    text-align:left;
    border: 2px solid var(--paper-line);
    background: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    cursor:pointer;
    font-family: inherit;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  #levelSelect .level-btn:hover{
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 140, 66, 0.15);
  }
  #levelSelect .level-btn:active{ transform: translateY(0); }
  #levelSelect .badge{
    flex: 0 0 auto;
    min-width: 48px;
    height: 44px;
    padding: 0 6px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.15rem; font-weight:800; color:#fff;
  }
  #levelSelect .lv1 .badge{ background: var(--blue); }
  #levelSelect .lv2 .badge{ background: var(--accent); }
  #levelSelect .lv3 .badge{ background: #10b981; }
  #levelSelect .lv4 .badge{ background: #8b5cf6; }
  #levelSelect .lv5 .badge{ background: #f97316; }
  #levelSelect .lv6 .badge{ background: #ec4899; }
  #levelSelect .txt strong{ display:block; font-size:.96rem; margin-bottom:2px; }
  #levelSelect .txt span{ color: var(--ink-soft); font-size:.82rem; }

  /* ---------- problem screen ---------- */
  #problemScreen{ display:none; flex:1 1 auto; min-height:0; }
  #problemScreen.show{ display:flex; flex-direction:column; min-height:0; }

  #problemScreen .card{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0, 1fr) 300px;
    gap:16px;
    align-items:stretch;
  }

  .problem-left{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
  }

  .input-panel{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    border-left:2px dashed var(--paper-line);
    padding-left:14px;
  }

  .input-panel #hintControls{ margin-top:auto; }

  #backToLevels{
    background:none; border:none; color: var(--ink-soft);
    font-family:inherit; font-size:.85rem; cursor:pointer;
    padding:2px 0; margin-bottom:5px; display:inline-flex; align-items:center; gap:4px;
    flex:0 0 auto;
  }
  #backToLevels:hover{ color: var(--ink); }

  #stageSvgWrap{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    overflow: hidden;
    border-radius: 14px;
    background: linear-gradient(180deg, #fff, #fffdf7);
    border: 2px dashed var(--paper-line);
    margin-bottom: 6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stageSvg{ display:block; width:100%; height:100%; }

  /* ---------- hissan digital notebook area ---------- */
  #hissanStageWrap {
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 4px 6px;
  }
  #hissanStageWrap::-webkit-scrollbar {
    width: 6px;
  }
  #hissanStageWrap::-webkit-scrollbar-thumb {
    background: var(--paper-line);
    border-radius: 999px;
  }

  /* ステップ循環カード */
  .step-panel {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.88);
    border: 2px solid rgba(148, 163, 184, 0.35);
    border-radius: 16px;
    padding: 10px 14px 12px;
    box-shadow: 0 6px 18px rgba(43, 42, 76, 0.05);
    box-sizing: border-box;
    transition: background-color 0.25s ease;
  }
  .step-status {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
  }
  .step-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(148,163,184,0.4);
    font-size: 13px;
    font-weight: 800;
    color: #334155;
  }
  .step-cycle {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 155px;
    margin: 0 auto;
  }
  .step-node {
    position: absolute;
    width: 96px;
    height: 38px;
    border-radius: 12px;
    border: 2px solid #94a3b8;
    background: rgba(255, 255, 255, 0.96);
    color: #0f172a;
    font-weight: 900;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(15, 23, 42, 0.06);
    transform: translate(var(--tx, 0), var(--ty, 0)) scale(1);
    transform-origin: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    user-select: none;
  }
  .step-node.active {
    animation: step-node-pulse 1.1s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes step-node-pulse {
    0% { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1); }
    50% { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1.10); }
    100% { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1); }
  }
  .step-node.tateru { top: 0; left: 50%; --tx: -50%; }
  .step-node.kakeru { top: 58px; right: 0; }
  .step-node.hiku { bottom: 0; left: 50%; --tx: -50%; }
  .step-node.orosu { top: 58px; left: 0; }

  .step-arrow {
    position: absolute;
    font-size: 22px;
    line-height: 1;
    color: #64748b;
    opacity: 0.9;
    pointer-events: none;
  }
  .step-arrow.a1 { top: 24px; right: 98px; transform: rotate(38deg); }
  .step-arrow.a2 { top: 96px; right: 98px; transform: rotate(142deg); }
  .step-arrow.a3 { bottom: 24px; left: 98px; transform: rotate(218deg); }
  .step-arrow.a4 { top: 24px; left: 98px; transform: rotate(-38deg); }

  .step-panel.phase-tateru { background: rgba(219, 234, 254, 0.85); }
  .step-panel.phase-kakeru { background: rgba(220, 252, 231, 0.85); }
  .step-panel.phase-hiku { background: rgba(254, 226, 226, 0.85); }
  .step-panel.phase-orosu { background: rgba(255, 237, 213, 0.85); }
  .step-panel.phase-neutral { background: rgba(255, 255, 255, 0.92); }

  .step-panel.phase-tateru .step-node.tateru,
  .step-panel.phase-kakeru .step-node.kakeru,
  .step-panel.phase-hiku .step-node.hiku,
  .step-panel.phase-orosu .step-node.orosu {
    border-color: var(--phase-accent, #3b82f6);
    background: var(--phase-soft, rgba(255,255,255,0.96));
    color: #0f172a;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.45), 0 6px 14px rgba(15, 23, 42, 0.12);
  }
  .step-panel.phase-tateru .step-node.tateru.active,
  .step-panel.phase-kakeru .step-node.kakeru.active,
  .step-panel.phase-hiku .step-node.hiku.active,
  .step-panel.phase-orosu .step-node.orosu.active {
    box-shadow: 0 0 0 3px rgba(255,255,255,0.5), 0 0 0 6px rgba(255,255,255,0.3), 0 10px 20px rgba(15,23,42,0.16);
  }

  /* 筆算ノート */
  .notebook-wrapper {
    background: #fff;
    border: 2px solid #b8c6d2;
    border-radius: 14px;
    padding: 18px 24px;
    position: relative;
    box-shadow: 0 6px 20px rgba(43,42,76,0.06);
    box-sizing: border-box;
    display: inline-block;
  }
  #hissan-hint-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }
  .division-grid {
    display: grid;
    position: relative;
  }
  .grid-cell {
    width: 42px;
    height: 42px;
    box-sizing: border-box;
    position: relative;
    z-index: 2;
    border-right: 1px dashed #e2e8f0;
    border-bottom: 1px dashed #e2e8f0;
    transition: all 0.2s ease;
  }
  .cell-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .main-num {
    font-size: 25px;
    font-weight: 800;
    color: #334155;
    line-height: 42px;
  }
  @keyframes digit-drop {
    0% {
      transform: translateY(var(--drop-start-y));
      color: #cbd5e1;
      opacity: 0.4;
    }
    40% {
      color: #cbd5e1;
      opacity: 0.7;
    }
    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }
  .digit-dropping {
    animation: digit-drop 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .top-num {
    position: absolute;
    top: -4px;
    font-size: 14px;
    font-weight: bold;
    z-index: 5;
  }
  .slash-line {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 130%;
    height: 3px;
    background: #ef4444;
    transform: translate(-50%, -50%) rotate(45deg);
    transform-origin: center;
    display: none;
    z-index: 4;
    pointer-events: none;
  }
  .red-border {
    box-shadow: inset 0 0 0 3px #ef4444 !important;
    border-radius: 4px;
  }
  .border-top-solid { border-top: 3px solid #1e293b !important; }
  .border-bottom-solid { border-bottom: 3px solid #1e293b !important; }
  .gray-guide { color: #cbd5e1; font-size: 20px; }
  .added-zero { color: #0284c7; }

  /* マスハイライト */
  .active-target {
    background-color: rgba(255, 152, 0, 0.2) !important;
    box-shadow: inset 0 0 0 3px #ff9800, 0 3px 10px rgba(255, 152, 0, 0.35) !important;
    border-radius: 6px;
    z-index: 10 !important;
    animation: rich-pulse-animation 1.2s infinite ease-in-out;
  }
  @keyframes rich-pulse-animation {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #ff9800, 0 3px 8px rgba(255, 152, 0, 0.25); background-color: rgba(255, 152, 0, 0.15) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #f97316, 0 6px 16px rgba(249, 115, 22, 0.45); background-color: rgba(255, 152, 0, 0.32) !important; }
  }

  .hl-ref-blue   .main-num { color: #1d4ed8; font-weight: 900; }
  .hl-ref-green  .main-num { color: #15803d; font-weight: 900; }
  .hl-ref-red    .main-num { color: #b91c1c; font-weight: 900; }
  .hl-ref-orange .main-num { color: #c2410c; font-weight: 900; }

  .hl-new-blue, .hl-new-green, .hl-new-red, .hl-new-orange {
    border-radius: 6px;
    z-index: 10 !important;
  }
  .hl-new-blue   .main-num { color: #1d4ed8; font-weight: 900; }
  .hl-new-green  .main-num { color: #15803d; font-weight: 900; }
  .hl-new-red    .main-num { color: #b91c1c; font-weight: 900; }
  .hl-new-orange .main-num { color: #c2410c; font-weight: 900; }

  .hl-new-blue {
    background-color: rgba(37, 99, 235, 0.12) !important;
    box-shadow: inset 0 0 0 3px #2563eb, 0 3px 10px rgba(37, 99, 235, 0.35) !important;
    animation: hl-pulse-blue 1.2s infinite ease-in-out;
  }
  .hl-new-green {
    background-color: rgba(22, 163, 74, 0.12) !important;
    box-shadow: inset 0 0 0 3px #16a34a, 0 3px 10px rgba(22, 163, 74, 0.35) !important;
    animation: hl-pulse-green 1.2s infinite ease-in-out;
  }
  .hl-new-red {
    background-color: rgba(220, 38, 38, 0.12) !important;
    box-shadow: inset 0 0 0 3px #dc2626, 0 3px 10px rgba(220, 38, 38, 0.35) !important;
    animation: hl-pulse-red 1.2s infinite ease-in-out;
  }
  .hl-new-orange {
    background-color: rgba(234, 88, 12, 0.12) !important;
    box-shadow: inset 0 0 0 3px #ea580c, 0 3px 10px rgba(234, 88, 12, 0.35) !important;
    animation: hl-pulse-orange 1.2s infinite ease-in-out;
  }

  @keyframes hl-pulse-blue {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #2563eb, 0 3px 8px rgba(37, 99, 235, 0.25); background-color: rgba(37, 99, 235, 0.10) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #1d4ed8, 0 6px 16px rgba(37, 99, 235, 0.45); background-color: rgba(37, 99, 235, 0.22) !important; }
  }
  @keyframes hl-pulse-green {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #16a34a, 0 3px 8px rgba(22, 163, 74, 0.25); background-color: rgba(22, 163, 74, 0.10) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #15803d, 0 6px 16px rgba(22, 163, 74, 0.45); background-color: rgba(22, 163, 74, 0.22) !important; }
  }
  @keyframes hl-pulse-red {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #dc2626, 0 3px 8px rgba(220, 38, 38, 0.25); background-color: rgba(220, 38, 38, 0.10) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #b91c1c, 0 6px 16px rgba(220, 38, 38, 0.45); background-color: rgba(220, 38, 38, 0.22) !important; }
  }
  @keyframes hl-pulse-orange {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #ea580c, 0 3px 8px rgba(234, 88, 12, 0.25); background-color: rgba(234, 88, 12, 0.10) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #c2410c, 0 6px 16px rgba(234, 88, 12, 0.45); background-color: rgba(234, 88, 12, 0.22) !important; }
  }

  .fusen-mask {
    position: absolute;
    background-color: rgba(253, 224, 71, 0.45);
    border-left: 3px dashed #eab308;
    z-index: 8;
    pointer-events: none;
    display: none;
    transition: all 0.3s ease;
  }

  .narration-card {
    width: 100%;
    max-width: 480px;
    background-color: #f0fdf4;
    border-left: 5px solid #22c55e;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: #166534;
    min-height: 48px;
    line-height: 1.6;
    box-sizing: border-box;
    box-shadow: 0 2px 8px rgba(34, 197, 94, 0.08);
  }

  .brain-card {
    width: 100%;
    max-width: 480px;
    background-color: #fff;
    border: 2px dashed #94a3b8;
    padding: 10px 14px;
    border-radius: 10px;
    box-sizing: border-box;
  }

  #hintCaption{
    min-height: 28px;
    text-align:center;
    color: var(--ink-soft);
    font-weight:700;
    font-size:.9rem;
    margin-bottom:0;
    flex:0 0 auto;
  }

  .slot-blue{ fill: var(--blue); }
  .slot-orange{ fill: var(--accent-deep); }
  .slot-wait{ fill: #b9b6d6; }

  /* ---------- keypad / answer ---------- */
  #answerArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    width:100%;
    margin-bottom:0;
  }

  .answer-display{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:1.1rem;
    font-weight:700;
    color: var(--ink-soft);
  }
  .answer-display .chip{
    min-width:52px;
    padding:6px 10px;
    text-align:center;
    background: var(--blue-soft);
    color: var(--blue);
    border-radius:10px;
    font-size:1.3rem;
    font-weight:800;
    cursor: pointer;
    user-select: none;
    transition: transform .1s, outline .1s, background .1s;
  }
  .answer-display .chip:hover{
    transform: scale(1.06);
  }
  .answer-display .chip.active{
    outline:3px solid var(--accent);
    background: #fff;
    box-shadow: 0 2px 8px rgba(255, 140, 66, 0.25);
  }
  .answer-display .chip.wrong{
    outline:3px solid var(--bad) !important;
    background: var(--bad-soft) !important;
    color: var(--bad) !important;
  }
  .answer-display .label-clickable{
    cursor: pointer;
    user-select: none;
    transition: color .15s;
  }
  .answer-display .label-clickable:hover{
    color: var(--accent-deep);
  }
  .answer-display .label-clickable.active{
    color: var(--accent-deep);
    font-weight: 800;
  }

  #keypad{
    display:grid;
    grid-template-columns: repeat(3, minmax(52px, 72px));
    gap:7px;
    justify-content:center;
    width:100%;
    max-width:250px;
  }
  #keypad button{
    width:100%; height:44px;
    border-radius:12px;
    border:2px solid var(--paper-line);
    background:#fff;
    font-family:inherit;
    font-size:1.15rem;
    font-weight:700;
    color: var(--ink);
    cursor:pointer;
  }
  #keypad button:active{ background: var(--accent-soft); border-color: var(--accent); }
  #keypad button.wide{ grid-column: span 3; width:auto; }
  #keypad button.clear{ color: var(--bad); }

  #submitBtn{
    display: none !important;
  }

  /* ---------- hint controls ---------- */
  #hintControls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom: 0;
    flex:0 0 auto;
  }
  #hintControls button{
    border-radius: 999px;
    border: 2px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent-deep);
    font-family: inherit;
    font-weight:800;
    font-size:.95rem;
    padding: 9px 18px;
    cursor:pointer;
  }
  #hintControls button:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  #hintBackBtn{ background:#fff; color: var(--ink-soft); border-color: var(--paper-line); }

  #hintDots{ display:flex; gap:4px; flex-wrap:wrap; justify-content:center; max-width:140px; }
  #hintDots span{
    width:7px; height:7px; border-radius:50%;
    background: var(--paper-line);
    display:inline-block;
  }
  #hintDots span.on{ background: var(--accent); }

  /* ---------- feedback ---------- */
  #feedback{
    text-align:center;
    min-height: 28px;
    font-weight:800;
    font-size:1.15rem;
    margin-bottom:10px;
  }
  #feedback.good{ color: var(--good); }
  #feedback.bad{ color: var(--bad); }

  #nextProblemBtn{
    display:none;
    width: 100%;
    max-width: 250px;
    margin: 8px auto 0;
    padding: 11px 20px;
    border-radius: 12px;
    border:none;
    background: var(--good);
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:1.1rem;
    cursor:pointer;
    box-shadow: 0 4px 0 #1f8e70;
    animation: popAnim .3s ease;
  }
  #nextProblemBtn.show{ display:block; }
  #nextProblemBtn:active{ transform: translateY(2px); box-shadow: 0 2px 0 #1f8e70; }

  .shake{ animation: shakeAnim .4s; }
  @keyframes shakeAnim{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(8px); }
    60%{ transform: translateX(-6px); }
    80%{ transform: translateX(6px); }
  }

  .fade-in{ animation: fadeInAnim .35s ease both; }
  @keyframes fadeInAnim{
    from{ opacity:0; transform: translateY(4px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .pop{ animation: popAnim .4s ease both; }
  @keyframes popAnim{
    0%{ transform: scale(1); }
    45%{ transform: scale(1.35); }
    100%{ transform: scale(1); }
  }

  .wrong-row .strike-line{
    stroke:#E8505B;
    stroke-width:5;
    stroke-linecap:round;
    stroke-dasharray:340;
    stroke-dashoffset:340;
    opacity:0;
  }
  .wrong-row.strike .strike-line{
    opacity:1;
    animation: strikeAnim .42s ease forwards;
  }
  .wrong-row.gray{
    opacity:.38;
    transition:opacity .25s ease;
  }
  .wrong-row.shatter{
    animation: shatterAnim .48s cubic-bezier(.55,.05,.68,.53) forwards;
    transform-box:fill-box;
    transform-origin:center;
  }
  .correct-row{
    transition: transform .45s ease;
    transform-box:fill-box;
    transform-origin:center;
  }
  @keyframes strikeAnim{
    from{ stroke-dashoffset:340; }
    to{ stroke-dashoffset:0; }
  }
  @keyframes shatterAnim{
    0%{ opacity:.38; transform:scale(1); filter:blur(0); }
    55%{ opacity:.24; transform:scale(1.08) rotate(1deg); filter:blur(.2px); }
    100%{ opacity:0; transform:scale(.72) rotate(-4deg) translateY(5px); filter:blur(2px); }
  }

  /* Level 4 Bundle Burst & Unbundle Animation */
  @keyframes tenRemPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px rgba(249, 115, 22, 0.4)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.85)); }
  }
  .ten-rem-pulse {
    animation: tenRemPulse 1.2s infinite ease-in-out;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes burstPop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 14px #fbbf24); }
    70% { transform: scale(1.6) rotate(6deg); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }
  .bundle-burst {
    animation: burstPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes sparkFly {
    0% { transform: translate(0, 0) scale(0.3); opacity: 0; }
    40% { opacity: 1; transform: scale(1.2); }
    100% { transform: var(--spark-trans, translate(15px, -15px) scale(0)); opacity: 0; }
  }
  .sparkle-particle {
    animation: sparkFly 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes blockDropIn {
    0% { transform: scale(0.2); opacity: 0; }
    65% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .block-drop-in {
    animation: blockDropIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes highlightBoxGlow {
    0%, 100% { stroke: #f97316; stroke-width: 2.5; }
    50% { stroke: #ea580c; stroke-width: 4; filter: drop-shadow(0 0 8px rgba(249,115,22,0.6)); }
  }
  .highlight-dish {
    animation: highlightBoxGlow 1.5s infinite ease-in-out;
  }

  @keyframes boxPopIn {
    0% { transform: scale(0.92); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .group-box-blue {
    fill: rgba(239, 246, 255, 0.82);
    stroke: #3b82f6;
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    animation: boxPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .group-box-purple {
    fill: rgba(250, 245, 255, 0.85);
    stroke: #a855f7;
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    animation: boxPopIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .group-box-orange {
    fill: rgba(255, 247, 237, 0.85);
    stroke: #ea580c;
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    animation: boxPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .ghost-box {
    fill: none;
    stroke: #cbd5e1;
    stroke-width: 1.5;
    stroke-dasharray: 4 4;
    opacity: 0.7;
  }
  .bundle-unit, .block-unit {
    transform-box: fill-box;
  }

  @media (max-width: 820px){
    #problemScreen .card{ grid-template-columns:minmax(0,1fr) 250px; gap:10px; padding:12px; }
    .input-panel{ padding-left:10px; }
  }

  @media (max-height: 720px){
    body{ padding:6px 10px; }
    header.top h1{ font-size:1.1rem; }
    .card{ padding:12px; }
    #problemScreen .card{ grid-template-columns:minmax(0,1fr) 280px; }
    #keypad button{ height:40px; }
    .answer-display .chip{ min-width:44px; padding:4px 8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .shake, .fade-in, .pop, .wrong-row.strike .strike-line, .wrong-row.shatter{ animation: none !important; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <h1>わり算れんしゅう</h1>

    <div class="raid-bar" id="raidBar">
      <div class="raid-code-box">
        <span style="font-size: .85rem;">🔑</span>
        <input type="text" id="studentRaidCode" placeholder="コード" maxlength="8">
        <button id="connectBtn" class="raid-btn" type="button">接続</button>
        <span id="connStatus" class="conn-status" title="接続状態">⚪</span>
      </div>

      <div id="bossMiniStatus" class="boss-mini-status">
        👾 <span id="miniBossName">ボス</span> <span id="miniBossHp"></span>
      </div>

      <div id="streakBadge" class="streak-badge">
        🔥 <span id="streakCount">0</span>れんぞく
      </div>

      <div class="user-profile-box">
        <button id="avatarBtn" class="avatar-select-btn" type="button">⚔️</button>
        <div class="name-input-box">
          <input type="text" id="studentName" value="たろう" placeholder="なまえ" maxlength="8">
        </div>
        <div class="avatar-picker-popover" id="avatarPicker">
          <span class="avatar-option" data-avatar="⚔️">⚔️</span>
          <span class="avatar-option" data-avatar="🧙‍♂️">🧙‍♂️</span>
          <span class="avatar-option" data-avatar="🏹">🏹</span>
          <span class="avatar-option" data-avatar="🥷">🥷</span>
          <span class="avatar-option" data-avatar="🐱">🐱</span>
          <span class="avatar-option" data-avatar="🐶">🐶</span>
          <span class="avatar-option" data-avatar="🤖">🤖</span>
        </div>
      </div>
      <div id="raidMsg" class="raid-msg"></div>
    </div>

    <div style="display:flex; align-items:center; gap:8px;">
      <div id="scoreBox"><span>せいかい</span><b id="scoreCorrect">0</b><span>/</span><span id="scoreTotal">0</span>もん</div>
      <button id="soundBtn" class="sound-btn" title="おと ON/OFF" type="button" aria-pressed="true">🔊</button>
    </div>
  </header>

  <section id="levelSelect" class="card">
    <!-- カテゴリー1: 九九の基本 -->
    <div class="level-category open">
      <button class="category-header" type="button">
        <span class="category-title">🌟 <strong>わり算の基本（九九のぎゃく算）</strong></span>
        <span class="category-arrow">▼</span>
      </button>
      <div class="category-content">
        <button class="level-btn lv1" data-level="1">
          <span class="badge">1</span>
          <span class="txt">
            <strong>レベル１　わりきれる もんだい</strong>
            <span>こたえ 1〜10。ヒントで九九のしきを見てみよう</span>
          </span>
        </button>
        <button class="level-btn lv2" data-level="2">
          <span class="badge">2</span>
          <span class="txt">
            <strong>レベル２　あまりの ある もんだい</strong>
            <span>こたえは 1〜9とあまり。九九のリストからヒントを出すよ</span>
          </span>
        </button>
      </div>
    </div>

    <!-- カテゴリー2: 何十・何百 -->
    <div class="level-category open">
      <button class="category-header" type="button">
        <span class="category-title">📦 <strong>何十・何百のわり算</strong></span>
        <span class="category-arrow">▼</span>
      </button>
      <div class="category-content">
        <button class="level-btn lv3" data-level="3-1">
          <span class="badge">3-1</span>
          <span class="txt">
            <strong>レベル３-１　何十 ÷ 1けた（わりきれる）</strong>
            <span>40÷2 や 60÷3 など。10のたばをもとにして考えよう</span>
          </span>
        </button>
        <button class="level-btn lv3" data-level="3-2">
          <span class="badge">3-2</span>
          <span class="txt">
            <strong>レベル３-２　何百 ÷ 1けた（わりきれる）</strong>
            <span>600÷3 や 800÷2 など。100のいたをもとにして考えよう</span>
          </span>
        </button>
      </div>
    </div>

    <!-- カテゴリー3: 2桁の暗算（分解と束の解体） -->
    <div class="level-category open">
      <button class="category-header" type="button">
        <span class="category-title">🧠 <strong>2けた ÷ 1けたの暗算（分解と解体）</strong></span>
        <span class="category-arrow">▼</span>
      </button>
      <div class="category-content">
        <button class="level-btn lv4" data-level="4-1">
          <span class="badge">4-1</span>
          <span class="txt">
            <strong>レベル４-１　分解なしでわりきれる</strong>
            <span>46÷2 や 84÷4 など。十の位と一の位をそれぞれわろう</span>
          </span>
        </button>
        <button class="level-btn lv4" data-level="4-2">
          <span class="badge">4-2</span>
          <span class="txt">
            <strong>レベル４-２　十の位を解体（あまりなし）</strong>
            <span>52÷2 や 42÷3 など。あまった10のたばをバラして合体！</span>
          </span>
        </button>
        <button class="level-btn lv4" data-level="4-3">
          <span class="badge">4-3</span>
          <span class="txt">
            <strong>レベル４-３　解体 ＋ あまりが出る型</strong>
            <span>53÷2 や 73÷3 など。たばを解体して、さいごにあまりも出るよ</span>
          </span>
        </button>
      </div>
    </div>

    <!-- カテゴリー4: わり算の筆算 -->
    <div class="level-category open">
      <button class="category-header" type="button">
        <span class="category-title">📝 <strong>わり算の筆算（2けた ÷ 1けた）</strong></span>
        <span class="category-arrow">▼</span>
      </button>
      <div class="category-content">
        <button class="level-btn lv5" data-level="5-1">
          <span class="badge">5-1</span>
          <span class="txt">
            <strong>レベル５-１　商が2けた（解体なし・あまりなし）</strong>
            <span>84÷4 や 63÷3。「たてる→かける→ひく→おろす」のきほん</span>
          </span>
        </button>
        <button class="level-btn lv5" data-level="5-2">
          <span class="badge">5-2</span>
          <span class="txt">
            <strong>レベル５-２　商が2けた（解体あり・あまりなし）</strong>
            <span>72÷3 や 52÷2。十の位のあまりをおろした数と合体！</span>
          </span>
        </button>
        <button class="level-btn lv5" data-level="5-3">
          <span class="badge">5-3</span>
          <span class="txt">
            <strong>レベル５-３　商が2けた（解体あり・あまりあり）</strong>
            <span>53÷2 や 87÷5。筆算をといてさいごにあまりを残そう</span>
          </span>
        </button>
        <button class="level-btn lv5" data-level="5-4">
          <span class="badge">5-4</span>
          <span class="txt">
            <strong>レベル５-４　商が1けた（十の位がわれない）</strong>
            <span>24÷3 や 35÷5。十の位に商がたたない時の位取りにちゅうい</span>
          </span>
        </button>
      </div>
    </div>

    <!-- カテゴリー5: 筆算特殊・3桁拡張 -->
    <div class="level-category open">
      <button class="category-header" type="button">
        <span class="category-title">⚡ <strong>筆算の特殊型と3けたへの拡張</strong></span>
        <span class="category-arrow">▼</span>
      </button>
      <div class="category-content">
        <button class="level-btn lv6" data-level="6-1">
          <span class="badge">6-1</span>
          <span class="txt">
            <strong>レベル６-１　商の途中に「0」がたつ型</strong>
            <span>604÷2 や 412÷4。十の位でわれない時に0をたててスキップ！</span>
          </span>
        </button>
        <button class="level-btn lv6" data-level="6-2">
          <span class="badge">6-2</span>
          <span class="txt">
            <strong>レベル６-２　商の末尾に「0」がたつ型</strong>
            <span>82÷4（20あまり2）など。一の位に正しく0をたてるよ</span>
          </span>
        </button>
        <button class="level-btn lv6" data-level="6-3">
          <span class="badge">6-3</span>
          <span class="txt">
            <strong>レベル６-３　3けた ÷ 1けたの筆算</strong>
            <span>756÷3 や 256÷4。百の位からたつか十の位からたつか見極めよう</span>
          </span>
        </button>
      </div>
    </div>
  </section>

  <section id="problemScreen">
    <button id="backToLevels">← レベルせんたくに もどる</button>

    <div class="card">
      <div class="problem-left">
        <div id="stageSvgWrap">
          <svg id="stageSvg" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <!-- 筆算専用コンテナ -->
        <div id="hissanStageWrap">
          <div class="step-panel phase-neutral" id="hissanStepPanel">
            <div class="step-status">
              <div class="step-status-badge" id="hissanStatusBadge">いまの工程：じゅんび</div>
            </div>
            <div class="step-cycle">
              <div class="step-node tateru" data-step="tateru" id="node-tateru">① たてる</div>

<script>
(function(){
  "use strict";

  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, txt){
    var e = document.createElementNS(SVGNS, tag);
    if(attrs){
      for(var k in attrs){
        if(attrs[k] === null || attrs[k] === undefined || attrs[k] === "") continue;
        e.setAttribute(k, attrs[k]);
      }
    }
    if(txt !== undefined){ e.textContent = txt; }
    return e;
  }
  function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  // ------------------------------------------------------------------

  // ------------------------------------------------------------------

  function initAudio(){
    if(!audioCtx){
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if(AudioContextClass) audioCtx = new AudioContextClass();
    }
  }

  function updateSoundButtonUI(){
    if(!soundBtn) return;
    soundBtn.classList.toggle("sound-off", !soundEnabled);
    soundBtn.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
    soundBtn.title = soundEnabled ? "おと ON（タップでOFF）" : "おと OFF（タップでON）";
    soundBtn.textContent = soundEnabled ? "🔊" : "🔇";

  function toggleSound(){
    soundEnabled = !soundEnabled;

      playSound('click');

  }

  function unlockAudio(){
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().catch(function(){});
    }
    document.removeEventListener("pointerdown", unlockAudio);
    document.removeEventListener("keydown", unlockAudio);
  }
  document.addEventListener("pointerdown", unlockAudio);
  document.addEventListener("keydown", unlockAudio);

  function playSound(type){
    if(!soundEnabled) return;
    try {
      initAudio();
      if(!audioCtx) return;
      if(audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
      var now = audioCtx.currentTime;

      if(type === 'click'){
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
        g.gain.setValueAtTime(0.08, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.06);
      } else if(type === 'switch'){
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
        g.gain.setValueAtTime(0.07, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.07);
      } else if(type === 'step'){
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.07);
        g.gain.setValueAtTime(0.06, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } else if(type === 'correct'){
        [880, 1320].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          var st = now + i * 0.12;
          g.gain.setValueAtTime(0.12, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.38);
        });
      } else if(type === 'wrong'){
        [220, 200].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = f;
          var st = now + i * 0.14;
          g.gain.setValueAtTime(0.08, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.18);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.2);
        });
      } else if(type === 'critical'){
        [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = f;
          var st = now + i * 0.08;
          g.gain.setValueAtTime(0.12, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.28);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.3);
        });
      } else if(type === 'chariin'){
        // チャリーン！と弾けるコイン・ベルの綺麗な音
        [1567.98, 2093.00, 2637.02, 3135.96].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + i * 0.05);
          var st = now + i * 0.05;
          g.gain.setValueAtTime(0.1, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.38);
        });
      }
    } catch(e){}
  }

  function normalizeCode(str){
    if(!str) return "";
    // convert full-width alphanumeric to half-width and uppercase
    return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s){
      return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    }).trim().toUpperCase();
  }

  function updateConnStatus(status, tooltip){

    connStatus.title = tooltip;

  async function connectToRaid(code, isAuto){
    var cleanCode = normalizeCode(code);
    if(studentRaidCodeInput) studentRaidCodeInput.value = cleanCode;

    if(!cleanCode){
      currentRaidCode = "";
      if(studentRoomRef && currentRoomListener){
        studentRoomRef.off("value", currentRoomListener);
      }
      studentRoomRef = null;
      updateConnStatus("none", "レイドコード未入力");
      updateStreakUI();
      if(!isAuto) showRaidMsg("⚠️ レイドコードを入力してください", "warn");
      return;
    }

    if(!db){
      updateConnStatus("error", "Firebaseが初期化されていません");
      showRaidMsg("⚠️ Firebaseの接続に失敗しました", "error");
      return;
    }

    updateConnStatus("connecting", "接続確認中: ルーム " + cleanCode);
    if(!isAuto) showRaidMsg("🔍 ルーム「" + cleanCode + "」を確認中...", "warn");

    if(authPromise){
      await authPromise;
    }

    currentRaidCode = cleanCode;
    try { localStorage.setItem("raid_boss_student_code", cleanCode); } catch(e){}

    if(studentRoomRef && currentRoomListener){
      studentRoomRef.off("value", currentRoomListener);
    }

    studentRoomRef = db.ref("rooms/" + cleanCode);
    var firstLoad = true;
    currentRoomListener = function(snapshot){
      var data = snapshot.val();
      var now = Date.now();

      if(!data || !data.boss || (data.expiresAt && data.expiresAt < now)){
        updateConnStatus("error", "レイドコードが見つからないか、期限切れです");
        showRaidMsg("⚠️ ルーム「" + cleanCode + "」が見つからないか期限切れです", "error");
        return;
      }

      updateConnStatus("connected", "接続中: ルーム " + cleanCode);
      var bossName = data.boss.name || "ボス";
      if(firstLoad){
        showRaidMsg("✅ ボス「" + bossName + "」に接続しました！", "good");
        firstLoad = false;
      }

      if(miniBossName) miniBossName.textContent = bossName;
      if(miniBossHp){
        var cur = Math.max(0, data.boss.currentHp !== undefined ? data.boss.currentHp : (data.boss.maxHp || 0));
        miniBossHp.textContent = "(" + cur + "/" + (data.boss.maxHp || "?") + ")";
      }
    };

    studentRoomRef.on("value", currentRoomListener, function(err){
      console.error("Firebase Room Listener Error:", err);
      updateConnStatus("error", "通信エラー: " + (err.message || "権限がありません"));
      showRaidMsg("⚠️ 通信エラーが発生しました", "error");
    });
  }

  function applyStudentRaidCode(){

  function sendAttack(damage, detail){
    if(!db || !studentRoomRef || !currentRaidCode){
      return false; // local only
    }

    var name = (studentNameInput && studentNameInput.value.trim()) ? studentNameInput.value.trim() : "ななし";
    try { localStorage.setItem("raid_boss_student_name", name); } catch(e){}

    studentRoomRef.child("boss/currentHp").transaction(function(currentHp){
      return (currentHp || 0) - damage;
    });

    studentRoomRef.child("logs").push({
      avatar: state.avatar,
      name: name,
      damage: damage,
      detail: detail,
      timestamp: Date.now()
    });

    return true;
  }

  function genLevel1(prevKey){
    var problem, key, tries = 0;
    do{
      var divisor = rand(1,9);
      var quotient = rand(1,10);
      problem = {
        level: "1", divisor: divisor, quotient: quotient, remainder: 0,
        hasRemainder: false, targetQuotientDigits: quotient === 10 ? 2 : 1,
        dividend: divisor * quotient,
        title: "レベル1　わりきれる もんだい"
      };
      key = divisor + "-" + quotient;
      tries++;
    } while(key === prevKey && tries < 20);
    return problem;
  }

  function genLevel2(prevKey){
    var problem, key, tries = 0;
    do{
      var divisor = rand(2,9);
      var quotient = rand(1,9);
      var remainder = rand(1, divisor-1);
      problem = {
        level: "2", divisor: divisor, quotient: quotient, remainder: remainder,
        hasRemainder: true, targetQuotientDigits: 1,
        dividend: divisor * quotient + remainder,
        title: "レベル2　あまりの ある もんだい"
      };
      key = divisor + "-" + quotient + "-" + remainder;
      tries++;
    } while(key === prevKey && tries < 20);
    return problem;
  }

  function genLevel3_1(prevKey){

      var quotient = q_ten * 10;
      var dividend = divisor * quotient;

        level: "3-1", divisor: divisor, quotient: quotient, remainder: 0,
        hasRemainder: false, targetQuotientDigits: 2,
        dividend: dividend, q_ten: q_ten,

      };
      key = divisor + "-" + quotient;
      tries++;
    } while(key === prevKey && tries < 20);
    return problem;
  }

  function genLevel3_2(prevKey){
    var problem, key, tries = 0;
    do{
      var divisor = rand(2, 4);
      var q_hun = rand(1, 4);
      var quotient = q_hun * 100;
      var dividend = divisor * quotient;
      problem = {
        level: "3-2", divisor: divisor, quotient: quotient, remainder: 0,
        hasRemainder: false, targetQuotientDigits: 3,
        dividend: dividend, q_hun: q_hun,
        title: "レベル3-2　何百 ÷ 1けた（わりきれる）"
      };
      key = divisor + "-" + quotient;
      tries++;
    } while(key === prevKey && tries < 20);
    return problem;
  }

  function genLevel4_1(prevKey){
    var problem, key, tries = 0;
    do{
      var divisor = rand(2, 4);
      var max_q_ten = Math.floor(9 / divisor);
      var max_q_one = Math.floor(9 / divisor);
      var q_ten = rand(1, max_q_ten);
      var q_one = rand(1, max_q_one);
      var quotient = q_ten * 10 + q_one;
      var dividend = divisor * quotient;
      var tenDigit = Math.floor(dividend / 10);
      var oneDigit = dividend % 10;
      if(dividend >= 20 && dividend < 100){
        problem = {
          level: "4-1", divisor: divisor, quotient: quotient, remainder: 0,
          hasRemainder: false, targetQuotientDigits: 2,
          dividend: dividend,
          tenDigit: tenDigit, oneDigit: oneDigit,
          q_ten: q_ten, q_one: q_one,
          tenRem: 0,
          unbundlePart: oneDigit,
          tenPart: divisor * q_ten * 10, onePart: divisor * q_one,
          title: "レベル4-1　分解なしでわりきれる暗算"
        };
        key = divisor + "-" + quotient;
      }
      tries++;
    } while((!problem || key === prevKey) && tries < 30);
    return problem || {
      level: "4-1", divisor: 2, quotient: 24, remainder: 0,
      hasRemainder: false, targetQuotientDigits: 2,
      dividend: 48,
      tenDigit: 4, oneDigit: 8,
      q_ten: 2, q_one: 4,
      tenRem: 0,
      unbundlePart: 8,
      tenPart: 40, onePart: 8,
      title: "レベル4-1　分解なしでわりきれる暗算"
    };
  }

  function genLevel4_2(prevKey){
    var problem, key, tries = 0;
    do{
      var divisor = rand(2, 4);
      var minQ = 11;
      var maxQ = Math.floor(99 / divisor);
      var quotient = rand(minQ, maxQ);
      var dividend = divisor * quotient;
      var tenDigit = Math.floor(dividend / 10);
      var oneDigit = dividend % 10;
      var tenRem = tenDigit % divisor;
      var tenPart = (tenDigit - tenRem) * 10;
      var unbundlePart = tenRem * 10 + oneDigit;
      var q_ten = Math.floor(tenDigit / divisor);
      var q_one = Math.floor(unbundlePart / divisor);
      if(dividend >= 20 && dividend < 100 && quotient >= 10 && tenRem > 0 && tenPart > 0){
        problem = {
          level: "4-2", divisor: divisor, quotient: quotient, remainder: 0,
          hasRemainder: false, targetQuotientDigits: 2,
          dividend: dividend,
          tenDigit: tenDigit, oneDigit: oneDigit,
          q_ten: q_ten, q_one: q_one,
          tenRem: tenRem,
          tenPart: tenPart,
          unbundlePart: unbundlePart,
