  var lastKey = null;
  function newProblem(){
    level4Scene = null;
    clearLevel4Timers();
    var lvl = String(state.level || "1");
    var p;
    var maxH = 3;

    if(lvl === "1") { p = genLevel1(lastKey); maxH = 3; }
    else if(lvl === "2") { p = genLevel2(lastKey); maxH = 5; }
    else if(lvl === "3-1") { p = genLevel3_1(lastKey); maxH = 3; }
    else if(lvl === "3-2") { p = genLevel3_2(lastKey); maxH = 3; }
    else if(lvl === "4-1") { p = genLevel4_1(lastKey); maxH = 5; }
    else if(lvl === "4-2") { p = genLevel4_2(lastKey); maxH = 5; }
    else if(lvl === "4-3") { p = genLevel4_3(lastKey); maxH = 5; }
    else if(lvl === "5-1") { p = genLevel5_1(lastKey); maxH = 5; }
    else if(lvl === "5-2") { p = genLevel5_2(lastKey); maxH = 5; }
    else if(lvl === "5-3") { p = genLevel5_3(lastKey); maxH = 5; }
    else if(lvl === "5-4") { p = genLevel5_4(lastKey); maxH = 4; }
    else if(lvl === "6-1") { p = genLevel6_1(lastKey); maxH = 5; }
    else if(lvl === "6-2") { p = genLevel6_2(lastKey); maxH = 5; }
    else if(lvl === "6-3") { p = genLevel6_3(lastKey); maxH = 5; }
    else { p = genLevel1(lastKey); maxH = 3; }

    lastKey = p.dividend + "-" + p.divisor + "-" + p.quotient;
    state.problem = p;
    state.hintStage = 0;
    state.inputDigits = "";
    state.inputRemainder = "";
    state.activeField = "q";
    state.answered = false;
    state.counted = false;
    state.isWrongState = false;
    feedback.textContent = "";
    feedback.className = "";
    nextProblemBtn.classList.remove("show");

    var stageSvgWrap = document.getElementById("stageSvgWrap");
    var hissanStageWrap = document.getElementById("hissanStageWrap");

    if(p.isLongDivision){
      if(stageSvgWrap) stageSvgWrap.style.display = "none";
      if(hissanStageWrap) hissanStageWrap.style.display = "flex";
      HissanSim.initSimulation(String(p.dividend), String(p.divisor));
      state.maxHint = HissanSim.appState.steps.length - 1;
    } else {
      if(stageSvgWrap) stageSvgWrap.style.display = "flex";
      if(hissanStageWrap) hissanStageWrap.style.display = "none";
      state.maxHint = maxH;
    }

    buildKeypad();
    renderAll(false);
  }

  // ------------------------------------------------------------------
  // keypad / answer input & auto check
  // ------------------------------------------------------------------
  function buildKeypad(){
    keypad.innerHTML = "";
    var nums = [1,2,3,4,5,6,7,8,9];
    nums.forEach(function(n){
      var b = document.createElement("button");
      b.textContent = n;
      b.addEventListener("click", function(){ pressDigit(n); });
      keypad.appendChild(b);
    });
    var zero = document.createElement("button");
    zero.textContent = "0";
    zero.addEventListener("click", function(){ pressDigit(0); });
    keypad.appendChild(zero);

    var clearBtn = document.createElement("button");
    clearBtn.textContent = "けす";
    clearBtn.className = "clear";
    clearBtn.addEventListener("click", clearDigit);
    keypad.appendChild(clearBtn);

    if(state.problem && state.problem.hasRemainder){
      var switchBtn = document.createElement("button");
      switchBtn.textContent = "きりかえ";
      switchBtn.className = "wide";
      switchBtn.addEventListener("click", function(){
        playSound('switch');
        state.activeField = state.activeField === "q" ? "r" : "q";
        renderAnswerDisplay();
      });
      keypad.appendChild(switchBtn);
    }
  }

  function checkCurrentAnswer(){
    if(state.answered) return;
    var p = state.problem;
    if(!p) return;

    var hasRem = !!p.hasRemainder;
    var correct = false;

    if(!hasRem){
      correct = state.inputDigits.length > 0 && parseInt(state.inputDigits, 10) === p.quotient;
    } else {
      correct = state.inputDigits.length > 0 && state.inputRemainder.length > 0 &&
                parseInt(state.inputDigits, 10) === p.quotient &&
                parseInt(state.inputRemainder, 10) === p.remainder;
    }

    if(!state.counted){
      state.counted = true;
      state.score.total++;
      if(correct) state.score.correct++;
      scoreBox.classList.add("show");
      document.getElementById("scoreCorrect").textContent = state.score.correct;
      document.getElementById("scoreTotal").textContent = state.score.total;
    }

    if(correct){
      state.answered = true;
      state.isWrongState = false;
      hintNextBtn.disabled = true;

      var raidActive = isRaidConnected();

      if(raidActive){
        state.streak++;
        updateStreakUI();

        var baseDamage = 10;
        var multiplier = 1;
        var isCritical = false;
        if(state.streak >= 5){
          multiplier = 3;
          isCritical = true;
        } else if(state.streak >= 3){
          multiplier = 2;
          isCritical = true;
        }
        var finalDamage = baseDamage * multiplier;

        var modeDesc = p.title || ("わり算Lv" + state.level);
        sendAttack(finalDamage, modeDesc + " (" + state.streak + "連勝 " + multiplier + "倍)");

        if(isCritical){
          playSound('critical');
        } else {
          playSound('correct');
        }

        var critMsg = isCritical ? " 🔥【" + state.streak + "れんぞく！ " + multiplier + "倍クリティカル！】" : "";
        feedback.textContent = "💥 せいかい！ ボスに " + finalDamage + " ダメージ！" + critMsg;
      } else {
        state.streak = 0;
        updateStreakUI();
        playSound('correct');
        feedback.textContent = "せいかい！ よくできました！";
      }

      feedback.className = "good";
      state.hintStage = state.maxHint;
      renderAll(false);
      nextProblemBtn.classList.add("show");
    } else {
      state.streak = 0;
      state.isWrongState = true;
      updateStreakUI();
      playSound('wrong');
      feedback.textContent = "おしい！ もういちど かんがえてみよう";
      feedback.className = "bad";
      var card = document.querySelector("#problemScreen .card");
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      renderAnswerDisplay();
    }
  }

  function pressDigit(n){
    if(state.answered) return;
    playSound('click');

    var p = state.problem;
    if(!p) return;

    var hasRem = !!p.hasRemainder;
    var targetDigits = p.targetQuotientDigits || 1;

    // 不正解直後の数字押下時はクリアして新規入力
    if(state.isWrongState){
      state.isWrongState = false;
      state.inputDigits = "";
      state.inputRemainder = "";
      state.activeField = "q";
      feedback.textContent = "";
      feedback.className = "";
    }

    if(state.activeField === "q"){
      if(state.inputDigits.length >= targetDigits) return;
      state.inputDigits += String(n);
      renderAnswerDisplay();

      // レベル1で商が10の場合のみ、1が入力された時は2桁目待ち
      if(String(state.level) === "1" && p.quotient === 10){
        if(state.inputDigits === "1"){
          return;
        } else {
          checkCurrentAnswer();
          return;
        }
      }

      // 商の入力が目標桁数に達したか判定
      if(state.inputDigits.length >= targetDigits){
        if(!hasRem){
          checkCurrentAnswer();
        } else {
          state.activeField = "r";
          renderAnswerDisplay();
          if(state.inputRemainder.length > 0){
            checkCurrentAnswer();
          }
        }
      }
    } else {
      // あまりの入力（余りは常に1桁）
      state.inputRemainder = String(n);
      renderAnswerDisplay();
      if(state.inputDigits.length >= targetDigits){
        checkCurrentAnswer();
      } else {
        state.activeField = "q";
        renderAnswerDisplay();
      }
    }
  }

  function clearDigit(){
    if(state.answered) return;
    playSound('click');
    state.isWrongState = false;
    if(state.activeField === "q"){
      state.inputDigits = state.inputDigits.slice(0,-1);
    } else {
      state.inputRemainder = state.inputRemainder.slice(0,-1);
    }
    feedback.textContent = "";
    feedback.className = "";
    renderAnswerDisplay();
  }

  function renderAnswerDisplay(){
    answerDisplay.innerHTML = "";
    var p = state.problem;
    if(!p) return;

    var hasRem = !!p.hasRemainder;
    var targetDigits = p.targetQuotientDigits || 1;

    if(!hasRem){
      var chip = document.createElement("span");
      chip.className = "chip active" + (state.isWrongState ? " wrong" : "");
      chip.textContent = state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits);
      var lbl = document.createElement("span");
      lbl.textContent = "こたえ　";
      answerDisplay.appendChild(lbl);
      answerDisplay.appendChild(chip);
    } else {
      var qLabel = document.createElement("span");
      qLabel.textContent = "しょう　";
      qLabel.className = "label-clickable" + (state.activeField === "q" ? " active" : "");
      qLabel.addEventListener("click", function(){
        playSound('switch');
        state.activeField = "q";
        renderAnswerDisplay();
      });

      var qChip = document.createElement("span");
      qChip.className = "chip" + (state.activeField === "q" ? " active" : "") + (state.isWrongState ? " wrong" : "");
      qChip.textContent = state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits);
      qChip.addEventListener("click", function(){
        playSound('switch');
        state.activeField = "q";
        renderAnswerDisplay();
      });

      var rLabel = document.createElement("span");
      rLabel.textContent = "　あまり　";
      rLabel.className = "label-clickable" + (state.activeField === "r" ? " active" : "");
      rLabel.addEventListener("click", function(){
        playSound('switch');
        state.activeField = "r";
        renderAnswerDisplay();
      });

      var rChip = document.createElement("span");
      rChip.className = "chip" + (state.activeField === "r" ? " active" : "") + (state.isWrongState ? " wrong" : "");
      rChip.textContent = state.inputRemainder.length ? state.inputRemainder : "?";
      rChip.addEventListener("click", function(){
        playSound('switch');
        state.activeField = "r";
        renderAnswerDisplay();
      });

      answerDisplay.appendChild(qLabel);
      answerDisplay.appendChild(qChip);
      answerDisplay.appendChild(rLabel);
      answerDisplay.appendChild(rChip);
    }
    updateEquationSlots();
  }

  // ------------------------------------------------------------------
  // SVG layout helpers
  // ------------------------------------------------------------------
  var LAYOUT = {
    eqY: 46,
    eqFont: 30,
    hintTop: 100,
    lineH: 34
  };

  // Fixed digit columns used by the hint-4/5 subtraction diagram (and the
  // dividend once that diagram is on screen). Every number involved -
  // わられる数 / 引く数 / 答え(あまり) - is drawn one digit at a time, each
  // digit centered ("text-anchor:middle") on its own column X. Because the
  // glyph is centered rather than the whole number being right-aligned as a
  // single string, columns line up exactly even though digits like "1" and
  // "8" have different rendered widths.
  var SUB_COLS = { onesX: 90, colW: 26, fontSize: 30 };

  // A single digit character, centered on x,y. No fill/class of its own -
  // color comes from the wrapping <g> (see renderNumberColumns) so the whole
  // number can be recolored / animated together.
  function digitText(x, y, txt, extra){
    var attrs = { x:x, y:y, "text-anchor":"middle", "font-size": extra && extra.size || 26,
                  "font-weight":"800", "font-family":"'M PLUS Rounded 1c', sans-serif" };
    if(extra){ for(var k in extra){ if(k!=="size") attrs[k]=extra[k]; } }
    return el("text", attrs, txt);
  }

  // Renders `number` as separate digit glyphs on the shared SUB_COLS columns,
  // ones place at SUB_COLS.onesX, tens place one column to the left, etc.
  // Returns the <g> wrapper (not yet attached to the document).
  function renderNumberColumns(number, y, cls, id){
    var str = String(number);
    var g = el("g", { id: id || null });
    if(cls) g.setAttribute("class", cls);
    else g.setAttribute("fill", "#2B2A4C");
    for(var i=0; i<str.length; i++){
      var place = str.length - 1 - i; // 0 = ones, 1 = tens, ...
      var x = SUB_COLS.onesX - place*SUB_COLS.colW;
      g.appendChild(digitText(x, y, str[i], {size:SUB_COLS.fontSize}));
    }
    return g;
  }

  function clearSvg(){ svg.innerHTML = ""; }

  function bigText(x, y, txt, cls, extra){
    var attrs = { x:x, y:y, "text-anchor":"middle", "font-size": extra && extra.size || 26,
                  "font-weight":"800", "font-family":"'M PLUS Rounded 1c', sans-serif" };
    if(extra){ for(var k in extra){ if(k!=="size") attrs[k]=extra[k]; } }
    var t = el("text", attrs, txt);
    if(cls) t.setAttribute("class", cls);
    else if(!attrs.fill) t.setAttribute("fill", "#2B2A4C");
    return t;
  }

  // SVG text helper whose visual vertical center is explicitly aligned to y.
  // This is used where a text line and a surrounding □ must share the same
  // vertical center rather than relying on the font baseline offset.
  function middleText(x, y, txt, cls, extra){
    var attrs = { x:x, y:y, "text-anchor":"middle", "dominant-baseline":"middle",
                  "font-size": extra && extra.size || 26,
                  "font-weight":"800", "font-family":"'M PLUS Rounded 1c', sans-serif" };
    if(extra){ for(var k in extra){ if(k!=="size") attrs[k]=extra[k]; } }
    var t = el("text", attrs, txt);
    if(cls) t.setAttribute("class", cls);
    else if(!attrs.fill) t.setAttribute("fill", "#2B2A4C");
    return t;
  }

  function calcSvgFontSize(text, maxPixelWidth, baseSize, minSize){
    if(!text) return baseSize;
    var str = String(text);
    var len = 0;
    for(var i = 0; i < str.length; i++){
      var code = str.charCodeAt(i);
      len += (code > 255) ? 1.0 : 0.58;
    }
    var estWidth = len * baseSize;
    if(estWidth <= maxPixelWidth) return baseSize;
    var scaled = Math.floor(maxPixelWidth / len);
    return Math.max(minSize || 12, scaled);
  }

  function box(x, y, w, h, extraClass){
    return el("rect", {
      x:x-w/2, y:y-h/2, width:w, height:h, rx:8,
      fill:"#fff", stroke:"#3E6D9C", "stroke-width":3,
      class: extraClass || ""
    });
  }

  function outlineBox(x, y, w, h, color){
    return el("rect", {
      x:x-w/2, y:y-h/2, width:w, height:h, rx:8,
      fill:"none", stroke: color || "#FF8C42", "stroke-width":3
    });
  }

  function arrowPath(d){
    var p = el("path", { d:d, fill:"none", stroke:"#FF8C42", "stroke-width":4, "stroke-linecap":"round" });
    return p;
  }
  function arrowHead(x, y, angleDeg){
    var g = el("g", { transform: "translate("+x+","+y+") rotate("+angleDeg+")" });
    g.appendChild(el("path", { d:"M0,0 L-10,-6 L-10,6 Z", fill:"#FF8C42" }));
    return g;
  }
  // Given the arrowhead's tip position/angle, returns a point pulled back
  // along the same axis so the line's rounded end lands well inside the
  // triangle's body (not right at its tip), so the round stroke-cap never
  // peeks out past the clean triangle edge.
  function arrowLineEnd(tipX, tipY, angleDeg, back){
    var rad = (angleDeg||0) * Math.PI/180;
    var b = (back===undefined) ? 8 : back;
    return { x: tipX - Math.cos(rad)*b, y: tipY - Math.sin(rad)*b };
  }

  function animateDraw(pathEl, duration, onDone){
    var len = pathEl.getTotalLength();
    pathEl.style.strokeDasharray = len;
    pathEl.style.strokeDashoffset = len;
    pathEl.getBoundingClientRect(); // force reflow
    pathEl.style.transition = "stroke-dashoffset " + duration + "ms ease";
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        pathEl.style.strokeDashoffset = 0;
      });
    });
    if(onDone) setTimeout(onDone, duration + 30);
  }

  // ------------------------------------------------------------------
  // main render dispatcher
  // ------------------------------------------------------------------
  function renderAll(forward){
    var p = state.problem;
    if(p && p.isLongDivision){
      HissanSim.gotoStep(state.hintStage);
    } else {
      var lvl = String(state.level || "1");
      if(lvl === "1") renderLevel1(forward);
      else if(lvl === "2") renderLevel2(forward);
      else if(lvl.startsWith("3")) renderLevel3(forward);
      else if(lvl.startsWith("4")) renderLevel4(forward);
    }
    renderHintControls();
    renderAnswerDisplay();
  }

  function renderHintControls(){
    hintBackBtn.disabled = state.hintStage <= 0;
    hintNextBtn.disabled = state.hintStage >= state.maxHint || state.answered;
    hintNextBtn.textContent = state.hintStage >= state.maxHint ? "ヒント おわり" : "ヒント ▶";
    hintDots.innerHTML = "";
    for(var i=1;i<=state.maxHint;i++){
      var d = document.createElement("span");
      if(i <= state.hintStage) d.className = "on";
      hintDots.appendChild(d);
    }
  }

  function updateEquationSlots(){
    var p = state.problem;
    if(!p) return;
    var targetDigits = p.targetQuotientDigits || 1;
    var qs = document.getElementById("qSlot");
    if(qs){
      if(state.hintStage < state.maxHint){
        qs.textContent = state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits);
        qs.setAttribute("class", state.inputDigits.length ? "slot-blue" : "slot-wait");
      }
    }
    var rs = document.getElementById("rSlot");
    if(rs && p.hasRemainder){
      if(state.hintStage < state.maxHint){
        rs.textContent = state.inputRemainder.length ? state.inputRemainder : "?";
        rs.setAttribute("class", state.inputRemainder.length ? "slot-blue" : "slot-wait");
      }
    }
  }

  // ==================================================================
  // LEVEL 1
  // ==================================================================
  function renderLevel1(forward){
    var p = state.problem;
    var stage = state.hintStage;
    svg.setAttribute("viewBox", "0 0 500 260");
    clearSvg();
    var hintCaptionElL1 = document.getElementById("hintCaption");
    if(hintCaptionElL1) hintCaptionElL1.textContent = "";

    // row 1: main equation  8 ÷ 2 = ?
    var g1 = el("g", {});
    g1.appendChild(bigText(150, LAYOUT.eqY, p.dividend, null, {size:32}));
    g1.appendChild(bigText(190, LAYOUT.eqY, "÷", null, {size:32}));
    g1.appendChild(bigText(230, LAYOUT.eqY, p.divisor, null, {size:32}));
    g1.appendChild(bigText(270, LAYOUT.eqY, "=", null, {size:32}));
    var slotTxt = (stage >= 3) ? p.quotient : (state.inputDigits.length ? state.inputDigits : "?");
    var slotCls = (stage >= 3) ? "slot-orange" : (state.inputDigits.length ? "slot-blue" : "slot-wait");
    var qSlot = bigText(320, LAYOUT.eqY, slotTxt, slotCls, {size:34, id:"qSlot"});
    g1.appendChild(qSlot);
    svg.appendChild(g1);

    if(stage >= 1){
      var boxCx = 320, boxCy = 126;
      var g2 = el("g", { class: (forward && stage===1) ? "fade-in" : "" });
      g2.appendChild(middleText(240, boxCy, p.divisor, null, {size:26}));
      g2.appendChild(middleText(268, boxCy, "×", null, {size:26}));
      g2.appendChild(box(boxCx, boxCy, 48, 40, "hintBox"));
      var boxTxt = "";
      if(stage >= 2) boxTxt = p.quotient;
      var boxText = middleText(boxCx, boxCy, boxTxt, "slot-orange", {size:26, id:"boxText"});
      if(forward && stage===2) boxText.setAttribute("class", boxText.getAttribute("class")+" fade-in");
      g2.appendChild(boxText);
      g2.appendChild(middleText(372, boxCy, "=", null, {size:26}));
      g2.appendChild(middleText(410, boxCy, p.dividend, null, {size:26}));
      svg.appendChild(g2);

      if(stage >= 3){
        var tipX1 = boxCx, tipY1 = 66, tipAngle1 = -90;
        var lineEnd1 = arrowLineEnd(tipX1, tipY1, tipAngle1);
        var pathD = "M " + boxCx + " " + (boxCy-22) + " L " + lineEnd1.x + " " + lineEnd1.y;
        var arrow = arrowPath(pathD);
        var head1 = arrowHead(tipX1, tipY1, tipAngle1);
        if(forward) head1.style.opacity = "0";
        var g3 = el("g", {});
        g3.appendChild(arrow);
        g3.appendChild(head1);
        svg.appendChild(g3);
        if(forward){
          animateDraw(arrow, 550, function(){
            head1.style.opacity = "1";
            qSlot.textContent = p.quotient;
            qSlot.setAttribute("class", "slot-orange pop");
          });
        }
      }
    }
    updateEquationSlots();
  }

  // ==================================================================
  // LEVEL 2
  // ==================================================================
  function renderLevel2(forward){
    var p = state.problem;
    var stage = state.hintStage;
    var listCount = p.quotient + 1;
    var listStartY = 110;
    var correctFinalY = 110;
    var visibleRows = stage <= 2 ? listCount : 1;
    var listEndY = listStartY + (visibleRows-1)*LAYOUT.lineH;
    var needSubArea = stage >= 4;
    var totalH = needSubArea ? 265 : Math.max(190, listEndY + 70);
    svg.setAttribute("viewBox", "0 0 500 " + totalH);
    clearSvg();

    // ---- row 1: main equation ----
    // From hint 3 onward the division equation moves slightly upward and then stays fixed.
    var eqY = stage >= 3 ? 36 : LAYOUT.eqY;
    var g1 = el("g", { id:"divisionEquation" });
    // From hint 4 onward the subtraction diagram appears directly beneath the
    // dividend, so from that point on the dividend is drawn digit-by-digit on
    // the same fixed columns the subtraction uses, keeping every place value
    // lined up. Before hint 4 there's nothing to align to, so it's drawn as
    // a single centered number as before.
    if(stage >= 4){
      g1.appendChild(renderNumberColumns(p.dividend, eqY, null, "dividendDigits"));
    } else {
      g1.appendChild(bigText(80, eqY, p.dividend, null, {size:30}));
    }
    g1.appendChild(bigText(125, eqY, "÷", null, {size:30}));
    g1.appendChild(bigText(165, eqY, p.divisor, null, {size:30}));
    g1.appendChild(bigText(200, eqY, "=", null, {size:30}));

    // On the way INTO stage 3, the "?" only turns into the number once the arrow
    // animation (built in buildList) finishes. On any other transition (already past
    // stage 3, or stepping backward into it) show the final number immediately.
    var quotientRevealedNow = stage > 3 || (stage === 3 && !forward);
    var qTxt = quotientRevealedNow ? p.quotient : (state.inputDigits.length ? state.inputDigits : "?");
    var qCls = quotientRevealedNow ? "slot-orange" : (state.inputDigits.length ? "slot-blue" : "slot-wait");
    var qSlot = bigText(235, eqY, qTxt, qCls, {size:30, id:"qSlot"});
    g1.appendChild(qSlot);

    if(stage >= 3){
      var amariLabel = bigText(300, eqY, "あまり", null, {size:22});
      amariLabel.setAttribute("fill", "#6b6a8c");
      if(forward && stage === 3) amariLabel.setAttribute("class", "fade-in");
      g1.appendChild(amariLabel);

      // Same rule as the quotient: only reveal immediately when arriving from a step
      // that already knows it (stepping backward), otherwise wait for the subtraction's
      // arrow animation (in buildSubtraction) to update this slot itself.
      var remainderRevealedNow = stage > 5 || (stage === 5 && !forward);
      var rTxt = remainderRevealedNow ? p.remainder : (state.inputRemainder.length ? state.inputRemainder : "?");
      var rCls = remainderRevealedNow ? "slot-orange" : (state.inputRemainder.length ? "slot-blue" : "slot-wait");
      var rSlot = bigText(365, eqY, rTxt, rCls, {size:30, id:"rSlot"});
      if(forward && stage === 3) rSlot.setAttribute("class", rSlot.getAttribute("class")+" fade-in");
      g1.appendChild(rSlot);
    }

    // Stage 3: animate the equation into its final position before the arrow appears.
    if(stage === 3 && forward){
      g1.style.transform = "translateY(10px)";
      g1.style.transition = "transform .45s ease";
      setTimeout(function(){ g1.style.transform = "translateY(0)"; }, 40);
    }
    svg.appendChild(g1);

    var hintCaptionEl = document.getElementById("hintCaption");
    if(stage < 1){ if(hintCaptionEl) hintCaptionEl.textContent = ""; updateEquationSlots(); return; }

    var captionMap = {
      1: "ちょうどに ならない！ わりきれないね！",
      2: "これが いちばん おおきくて、ちかいね",
      3: "３が わり算の こたえだよ",
      4: "つぎは あまりを もとめるよ！",
      5: "あまりが わかったね！"
    };
    if(hintCaptionEl){
      hintCaptionEl.textContent = captionMap[stage] || "";
      hintCaptionEl.className = forward ? "fade-in" : "";
    }

    // ---- multiplication list ----
    var correctIndex = p.quotient;
    var listG = el("g", { id:"listG" });
    svg.appendChild(listG);
    buildList(listG, p, listCount, correctIndex, stage, forward, listStartY, correctFinalY);

    // ---- subtraction diagram (stage 4-5) ----
    if(stage >= 4){
      // Keep it compact and directly beneath the division equation.
      buildSubtraction(svg, p, 72, stage, forward);
    }

    updateEquationSlots();
  }

  function buildList(container, p, listCount, correctIndex, stage, forward, startY, correctFinalY){
    // Keep the multiplier column aligned with the quotient slot above.
    var divisorX = 155;
    var timesX = 195;
    var multiplierX = 235;
    var equalsX = 265;
    var productX = 305;
    var labelX = 385;

    for(var i=1; i<=listCount; i++){
      var isCorrect = (i === correctIndex);
      var isOver = (i === listCount);

      // Stage 3 onward: wrong formulas have already completed the stage-2 shatter.
      if(stage >= 3 && !isCorrect) continue;

      var originalY = startY + (i-1)*LAYOUT.lineH;
      // From hint 3 onward the correct formula is rendered at its final fixed position.
      // During hint 3 it starts visually at its old position and animates into this spot.
      var y = stage >= 3 ? correctFinalY : originalY;
      var rowClass = isCorrect ? "correct-row" : "wrong-row";
      if(forward && stage===1) rowClass += " fade-in";
      var rowG = el("g", { class: rowClass });

      rowG.appendChild(bigText(divisorX, y+7, p.divisor, null, {size:20}));
      rowG.appendChild(bigText(timesX, y+7, "×", null, {size:20}));

      if(stage === 1){
        rowG.appendChild(box(multiplierX, y, 30, 30, ""));
        rowG.appendChild(bigText(multiplierX, y+7, i, null, {size:20}));
      } else {
        rowG.appendChild(bigText(multiplierX, y+7, i, isCorrect && stage>=3 ? "slot-orange" : null, {size:20, id: isCorrect ? "multiplierText" : null}));
      }

      rowG.appendChild(bigText(equalsX, y+7, "=", null, {size:20}));
      var prodTxt = bigText(productX, y+7, p.divisor*i, null, {size:20, id: isCorrect ? "productText" : null});
      rowG.appendChild(prodTxt);

      if(isOver){
        rowG.appendChild(bigText(labelX, y+7, "（おおきいね！）", null, {size:14, fill:"#E8505B"}));
      } else if(isCorrect && stage < 4){
        // From hint 4 onward this row is busy becoming part of the subtraction step,
        // so the "ちょうどいい！" label is retired.
        rowG.appendChild(bigText(labelX, y+7, "（ちょうどいい！）", null, {size:14, fill:"#2FAE8B"}));
      }

      if(!isCorrect && stage === 2){
        var strike = el("line", { x1:divisorX-22, y1:y+1, x2:labelX+32, y2:y+1, class:"strike-line" });
        rowG.appendChild(strike);
        if(!forward){
          rowG.classList.add("gray", "shatter");
        } else {
          (function(target, delay){
            setTimeout(function(){
              target.classList.add("strike");
              setTimeout(function(){
                target.classList.add("gray");
                setTimeout(function(){ target.classList.add("shatter"); }, 220);
              }, 430);
            }, delay);
          })(rowG, Math.max(20, (i-1)*40));
        }
      }

      if(isCorrect && stage === 2){
        // After the wrong rows disappear, keep the correct equation at the top of the list.
        rowG.appendChild(outlineBox(multiplierX, y, 30, 30, "#FF8C42"));
        var shift = correctFinalY-originalY;
        if(!forward){
          rowG.style.transform = "translate(0," + shift + ")";
        } else {
          (function(target, shift){
            setTimeout(function(){ target.style.transform = "translate(0," + shift + ")"; }, 920);
          })(rowG, shift);
        }
      }

      if(isCorrect && stage >= 3){
        rowG.appendChild(outlineBox(multiplierX, y, 30, 30, "#FF8C42"));

        if(stage === 3){
          // Move the correct multiplication equation into its final, readable position first.
          var shift3 = correctFinalY-originalY;
          if(forward){
            rowG.style.transform = "translateY(" + (originalY-correctFinalY) + "px)";
            rowG.style.transition = "transform .45s ease";
            setTimeout(function(target){ target.style.transform = "translateY(0)"; }, 60, rowG);
          } else {
            rowG.style.transform = "translateY(0)";
          }
        }
      }

      container.appendChild(rowG);

      if(isCorrect && stage === 3){
        // The arrow appears only after the equation has moved into place.
        var arrowStartY = correctFinalY - 16;
        var tipX2 = multiplierX, tipY2 = eqYForArrow(), tipAngle2 = -90;
        var lineEnd2 = arrowLineEnd(tipX2, tipY2, tipAngle2);
        var arrow = arrowPath("M " + multiplierX + " " + arrowStartY + " L " + lineEnd2.x + " " + lineEnd2.y);
        var arrowHeadEl = arrowHead(tipX2, tipY2, tipAngle2);
        if(forward){
          // Stay fully invisible while the equation is still sliding into place,
          // so nothing is drawn (line or head) until that move has finished.
          arrow.style.opacity = "0";
          arrowHeadEl.style.opacity = "0";
        }
        container.appendChild(arrow);
        container.appendChild(arrowHeadEl);
        if(forward){
          setTimeout(function(pathEl, headEl, pRef){
            pathEl.style.opacity = "1";
            // The triangle only appears once the line has fully drawn itself in.
            animateDraw(pathEl, 500, function(){
              headEl.style.opacity = "1";
              var qSlot = document.getElementById("qSlot");
              if(qSlot){ qSlot.textContent = pRef.quotient; qSlot.setAttribute("class","slot-orange pop"); }
            });
          }, 520, arrow, arrowHeadEl, p);
        }
      }
    }

    function eqYForArrow(){ return 36; }
  }

  function rightText(x, y, txt, cls, extra){
    var attrs = { x:x, y:y, "text-anchor":"end", "font-size": extra && extra.size || 26,
                  "font-weight":"800", "font-family":"'M PLUS Rounded 1c', sans-serif" };
    if(extra){ for(var k in extra){ if(k!=="size") attrs[k]=extra[k]; } }
    var t = el("text", attrs, txt);
    if(cls) t.setAttribute("class", cls);
    else if(!attrs.fill) t.setAttribute("fill", "#2B2A4C");
    return t;
  }

  function buildSubtraction(svgRoot, p, topY, stage, forward){
    var g = el("g", { class: (forward && stage===4) ? "fade-in" : "" });

    var productY = topY;

    // The number being subtracted (引く数) is drawn one digit per fixed
    // column - the same SUB_COLS columns as the dividend above it - so the
    // tens and ones places always line up, regardless of digit glyph widths.
    var prodTarget = renderNumberColumns(p.divisor*p.quotient, productY, "slot-orange", "subProduct");
    g.appendChild(prodTarget);
    svgRoot.appendChild(g);

    // Measure the subtrahend's real rendered box (so this works for 1- or 2-digit
    // products alike) and place the minus sign and underline the way a paper-and-pencil
    // subtraction is written: minus sign directly beside the number, on the same line,
    // with the underline spanning just that line.
    var prodBox = prodTarget.getBBox();
    var minusRightX = prodBox.x - 8;
    var minusEl = rightText(minusRightX, productY, "−", null, {size:26});
    g.appendChild(minusEl);
    var minusBox = minusEl.getBBox();

    var lineY = prodBox.y + prodBox.height + 8;
    var underlineLeft = minusBox.x - 4;
    var underlineRight = Math.max(prodBox.x + prodBox.width, SUB_COLS.onesX + SUB_COLS.colW/2) + 4;
    var answerY = lineY + 30;

    g.appendChild(el("line", {
      x1:underlineLeft, y1:lineY, x2:underlineRight, y2:lineY,
      stroke:"#2B2A4C", "stroke-width":3, "stroke-linecap":"round"
    }));

    if(stage === 4 && forward){
      // Start from just above the multiplication answer, travel upward,
      // then turn left at the target height. One bend only.
      var src = document.getElementById("productText");
      prodTarget.style.opacity = "0";
      if(src){
        var srcBox = src.getBoundingClientRect();
        var dstBox = prodTarget.getBoundingClientRect();
        var svgBox = svg.getBoundingClientRect();
        var vb = svg.viewBox.baseVal;
        var scaleX = vb.width / svgBox.width, scaleY = vb.height / svgBox.height;
        var sx = (srcBox.left + srcBox.width/2 - svgBox.left) * scaleX;
        var syTop = (srcBox.top - svgBox.top) * scaleY;
        var dx = (dstBox.right - svgBox.left) * scaleX - 2;
        var dy = (dstBox.top + dstBox.height/2 - svgBox.top) * scaleY;
        var tipAngle3 = 180;
        var lineEnd3 = arrowLineEnd(dx, dy, tipAngle3);
        var pathD = "M "+sx+" "+syTop+" L "+sx+" "+dy+" L "+lineEnd3.x+" "+lineEnd3.y;
        var arrow = arrowPath(pathD);
        var head3 = arrowHead(dx, dy, tipAngle3);
        head3.style.opacity = "0";
        svgRoot.appendChild(arrow);
        svgRoot.appendChild(head3);
        animateDraw(arrow, 600, function(){
          head3.style.opacity = "1";
          prodTarget.style.opacity = "1";
          prodTarget.setAttribute("class", "slot-orange pop");
        });
      } else {
        prodTarget.style.opacity = "1";
      }
    }

    if(stage >= 5){
      // Answer is immediately below the underline, on the same digit columns
      // as the dividend and the subtracted number above it.
      var remEl = renderNumberColumns(p.remainder, answerY, "slot-orange", "subRemainder");
      svgRoot.appendChild(remEl);

      if(forward && stage === 5){
        remEl.style.opacity = "0";
        // Step 1: the subtraction's own answer appears first, by itself.
        setTimeout(function(){
          remEl.style.opacity = "1";
          remEl.setAttribute("class", "slot-orange pop");

          // Step 2: only once that's visible does the arrow start growing up to
          // the "あまり ?" slot. Its endpoint is measured against the slot's real
          // position, so it always lands exactly on it regardless of layout.
          setTimeout(function(){
            var rSlot = document.getElementById("rSlot");
            if(!rSlot) return;
            var eqRow = document.getElementById("listG");
            var srcBox = remEl.getBoundingClientRect();
            var dstBox = rSlot.getBoundingClientRect();
            var eqBox = eqRow ? eqRow.getBoundingClientRect() : null;
            var svgBox = svg.getBoundingClientRect();
            var vb = svg.viewBox.baseVal;
            var scaleX = vb.width / svgBox.width, scaleY = vb.height / svgBox.height;

            // Start just below the subtraction's own answer.
            var sx = (srcBox.left + srcBox.width/2 - svgBox.left) * scaleX;
            var sy = (srcBox.bottom - svgBox.top) * scaleY + 4;
            // Target: just below the "あまり ?" slot.
            var dx = (dstBox.left + dstBox.width/2 - svgBox.left) * scaleX;
            var dy = (dstBox.bottom - svgBox.top) * scaleY + 6;
            // Drop below both the answer AND the multiplication equation before
            // heading sideways, so the arrow never crosses through that equation.
            var eqBottom = eqBox ? (eqBox.bottom - svgBox.top) * scaleY : sy;
            var dropY = Math.max(sy, eqBottom) + 14;

            var tipAngle4 = -90;
            var lineEnd4 = arrowLineEnd(dx, dy, tipAngle4);
            var pathD2 = "M "+sx+" "+sy+" L "+sx+" "+dropY+" L "+dx+" "+dropY+" L "+lineEnd4.x+" "+lineEnd4.y;
            var arrow2 = arrowPath(pathD2);
            var head4 = arrowHead(dx, dy, tipAngle4);
            head4.style.opacity = "0";
            svgRoot.appendChild(arrow2);
            svgRoot.appendChild(head4);

            // Step 3: only after the arrow finishes does "?" become the number,
            // and the triangle only appears once the line is fully drawn.
            animateDraw(arrow2, 650, function(){
              head4.style.opacity = "1";
              rSlot.textContent = p.remainder;
              rSlot.setAttribute("class", "slot-orange pop");
            });
          }, 420);
        }, 60);
      } else {
        remEl.style.opacity = "1";
      }
    }
  }

  // ==================================================================
  // LEVEL 3 (何十・何百のわり算)
  // ==================================================================
  function renderLevel3(forward){
    var p = state.problem;
    var stage = state.hintStage;
    svg.setAttribute("viewBox", "0 0 500 240");
    clearSvg();

    var hintCaptionEl = document.getElementById("hintCaption");
    if(hintCaptionEl) hintCaptionEl.textContent = "";

    // 式
    var g1 = el("g", {});
    g1.appendChild(bigText(140, 40, p.dividend, null, {size:32}));
    g1.appendChild(bigText(195, 40, "÷", null, {size:32}));
    g1.appendChild(bigText(235, 40, p.divisor, null, {size:32}));
    g1.appendChild(bigText(275, 40, "=", null, {size:32}));

    var targetDigits = p.targetQuotientDigits || 2;
    var slotTxt = (stage >= 3) ? p.quotient : (state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits));
    var slotCls = (stage >= 3) ? "slot-orange" : (state.inputDigits.length ? "slot-blue" : "slot-wait");
    var qSlot = bigText(335, 40, slotTxt, slotCls, {size:34, id:"qSlot"});
    g1.appendChild(qSlot);
    svg.appendChild(g1);

    var isHundred = String(p.level) === "3-2";
    var unitName = isHundred ? "100" : "10";
    var unitCount = isHundred ? Math.round(p.dividend / 100) : Math.round(p.dividend / 10);
    var unitAns = isHundred ? Math.round(p.quotient / 100) : Math.round(p.quotient / 10);

    // ブロックサイズ計算
    var boxW, boxH, gap, fontSize, rx;
    if(unitCount <= 8){
      boxW = 40; boxH = 32; gap = 6; fontSize = 13; rx = 6;
    } else if(unitCount <= 12){
      boxW = 32; boxH = 28; gap = 4; fontSize = 11; rx = 5;
    } else if(unitCount <= 16){
boxW = 24; boxH = 24; gap = 3; fontSize = 9.5; rx = 4;
    } else {
      boxW = 19; boxH = 22; gap = 2; fontSize = 8; rx = 3;
    }

    var totalW = unitCount * boxW + (unitCount - 1) * gap;
    var startX = Math.round((500 - totalW) / 2);
    var boxY = 82;

    // ステップ1: まとまりアイコンの描画
    if(stage >= 1){
      var g2 = el("g", { class: (forward && stage === 1) ? "fade-in" : "" });

      for(var i = 0; i < unitCount; i++){
        var bx = startX + i * (boxW + gap);
        var r = el("rect", {
          x: bx, y: boxY, width: boxW, height: boxH, rx: rx,
          fill: isHundred ? "#fef3c7" : "#dbeafe",
          stroke: isHundred ? "#f59e0b" : "#3b82f6",
          "stroke-width": (unitCount > 16) ? 1.5 : 2
        });
        var t = el("text", {
          x: bx + boxW / 2,
          y: boxY + boxH / 2 + (fontSize * 0.35),
          "text-anchor": "middle",
          fill: isHundred ? "#b45309" : "#1d4ed8",
          "font-size": fontSize,
          "font-weight": 800,
          "font-family": "'M PLUS Rounded 1c', sans-serif"
        });
        t.textContent = unitName;
        g2.appendChild(r);
        g2.appendChild(t);
      }
      var caption1 = middleText(250, boxY + boxH + 24, unitName + " の まとまりが " + unitCount + " こ あるよ！", null, {size: 16});
      g2.appendChild(caption1);
      svg.appendChild(g2);
    }

    // ステップ2: 割る数の人数分の人型アイコン＋赤い仕切り線＋式（等分除の視覚化）
    if(stage >= 2){
      var g3 = el("g", { class: (forward && stage === 2) ? "fade-in" : "" });

      // グループごとの人型アイコン描画（ブロックの上に配置）
      for(var g = 0; g < p.divisor; g++){
        var grpStartIdx = g * unitAns;
        var grpEndIdx = Math.min((g + 1) * unitAns - 1, unitCount - 1);
        var grpLeftX = startX + grpStartIdx * (boxW + gap);
        var grpRightX = startX + grpEndIdx * (boxW + gap) + boxW;
        var grpCenterX = Math.round((grpLeftX + grpRightX) / 2);

        // 赤色ラインの人型（丸＋三角）
        var head = el("circle", {
          cx: grpCenterX, cy: 59, r: 5,
          fill: "#fff", stroke: "#e11d48", "stroke-width": 2
        });
        var body = el("polygon", {
          points: grpCenterX + ",64 " + (grpCenterX - 6) + ",77 " + (grpCenterX + 6) + ",77",
          fill: "#fff", stroke: "#e11d48", "stroke-width": 2, "stroke-linejoin": "round"
        });
        g3.appendChild(head);
        g3.appendChild(body);
      }

      // 赤い縦線の区切りSVG（グループとグループの境界）
      for(var d = 1; d < p.divisor; d++){
        var prevRightX = startX + (d * unitAns - 1) * (boxW + gap) + boxW;
        var nextLeftX = startX + (d * unitAns) * (boxW + gap);
        var divX = Math.round((prevRightX + nextLeftX) / 2);
        var divider = el("line", {
          x1: divX, y1: boxY - 5, x2: divX, y2: boxY + boxH + 8,
          stroke: "#e11d48", "stroke-width": 3.5, "stroke-linecap": "round"
        });
        g3.appendChild(divider);
      }

      var subEqTxt = unitCount + " ÷ " + p.divisor + " ＝ " + unitAns + " （" + unitName + "が " + unitAns + "こ分）";
      var subEqSz = calcSvgFontSize(subEqTxt, 460, 19, 14);
      var subEq = middleText(250, boxY + boxH + 58, subEqTxt, "slot-orange", {size: subEqSz});
      g3.appendChild(subEq);
      svg.appendChild(g3);
    }

    // ステップ3: 答え確定
    if(stage >= 3){
      var g4 = el("g", { class: (forward && stage === 3) ? "fade-in" : "" });
      var finalTxt = middleText(250, boxY + boxH + 92, "だから　答えは " + p.quotient + " ！", "slot-orange", {size: 22});
      g4.appendChild(finalTxt);
      svg.appendChild(g4);
      if(forward){
        qSlot.textContent = p.quotient;
        qSlot.setAttribute("class", "slot-orange pop");
      }
    }
  }

  // ==================================================================
  // LEVEL 4 (2けた暗算・10の束の解体アニメーション全面刷新)
  // ==================================================================

  function moveEl(element, x, y, animate, duration, delay){
    if(!element) return;
    if(animate){
      var d = (duration !== undefined) ? duration : 750;
      var dl = delay || 0;
      element.style.transition = "transform " + d + "ms cubic-bezier(0.25, 0.46, 0.45, 0.94) " + dl + "ms, opacity 0.3s ease";
    } else {
      element.style.transition = "none";
    }
    element.style.transform = "translate(" + x + "px, " + y + "px)";
  }

  function initLevel4Scene(p){
    svg.setAttribute("viewBox", "0 0 460 275");
    clearSvg();

    var divisor = p.divisor;
    var dividend = p.dividend;
    var tenDigit = (p.tenDigit !== undefined) ? p.tenDigit : Math.floor(dividend / 10);
    var oneDigit = (p.oneDigit !== undefined) ? p.oneDigit : (dividend % 10);
    var tenRem = (p.tenRem !== undefined) ? p.tenRem : (tenDigit % divisor);
    var q_ten = (p.q_ten !== undefined) ? p.q_ten : Math.floor(tenDigit / divisor);
    var unbundlePart = (p.unbundlePart !== undefined) ? p.unbundlePart : (tenRem * 10 + oneDigit);
    var q_one = (p.q_one !== undefined) ? p.q_one : Math.floor(unbundlePart / divisor);
    var isUnbundle = (tenRem > 0);
    var hasRem = p.hasRemainder;

    // --------------------------------------------------
    // 1. 最上部: 計算式
    // --------------------------------------------------
    var gEq = el("g", {});
    gEq.appendChild(bigText(120, 26, dividend, null, {size: 28}));
    gEq.appendChild(bigText(165, 26, "÷", null, {size: 28}));
    gEq.appendChild(bigText(200, 26, divisor, null, {size: 28}));
    gEq.appendChild(bigText(235, 26, "=", null, {size: 28}));

    var targetDigits = p.targetQuotientDigits || 2;
    var qSlot = bigText(285, 26, "?".repeat(targetDigits), "slot-wait", {size: 30, id: "qSlot"});
    gEq.appendChild(qSlot);

    var rSlot = null;
    if(hasRem){
      gEq.appendChild(middleText(345, 26, "あまり", null, {size: 15}));
      rSlot = bigText(390, 26, "?", "slot-wait", {size: 26, id: "rSlot"});
      gEq.appendChild(rSlot);
    }
    svg.appendChild(gEq);

    // --------------------------------------------------
    // 2. ガイド解説バッジ & サブテキスト
    // --------------------------------------------------
    var gBadge = el("g", {});
    var badgeW = 440;
    var badgeH = 24;
    var badgeX = 230 - badgeW / 2;
    var badgeY = 38;
    var badgeBg = el("rect", {
      x: badgeX, y: badgeY, width: badgeW, height: badgeH, rx: 12,
      fill: "#f1f5f9", stroke: "#cbd5e1", "stroke-width": 1.5
    });
    gBadge.appendChild(badgeBg);
    var badgeTextEl = middleText(230, badgeY + 16, "", null, {size: 11.5, weight: 800});
    gBadge.appendChild(badgeTextEl);
    svg.appendChild(gBadge);

    var subTextEl = middleText(230, 75, "", null, {size: 13, weight: 800});
    svg.appendChild(subTextEl);

    // --------------------------------------------------
    // 3. レイヤーコンテナの準備（描画順）
    // --------------------------------------------------
    var gTrays = el("g", {});     // トレイ・受け皿
    var gGhosts = el("g", {});    // 移動元のゴースト点線枠
    var gBoxes = el("g", {});     // 青・オレンジの囲み枠とラベル
    var gUnion = el("g", {});     // 紫の合体枠
    var gBlocks = el("g", {});    // ブロック本体（束・バラ）
    var gEffects = el("g", {});   // スパークルなどの演出

    svg.appendChild(gTrays);
    svg.appendChild(gGhosts);
    svg.appendChild(gBoxes);
    svg.appendChild(gUnion);
    svg.appendChild(gBlocks);
    svg.appendChild(gEffects);

    // --------------------------------------------------
    // 4. トレイ（受け皿）の作成
    // --------------------------------------------------
    var trayW = Math.min(125, Math.floor((hasRem ? 340 : 400) / divisor));
    var trayGap = 10;
    var totalTraysW = divisor * trayW + (divisor - 1) * trayGap;
    var traysStartX = Math.round(((hasRem ? 370 : 460) - totalTraysW) / 2);

    var trayBoxes = [];
    var trayPositions = [];
    var trayTenCoords = [];
    var trayOneCoords = [];

    for(var j = 0; j < divisor; j++){
      var curTrayX = traysStartX + j * (trayW + trayGap);
      var curCenterX = curTrayX + Math.round(trayW / 2);
      trayPositions.push({ x: curTrayX, y: 193, w: trayW, h: 68 });

      // 人型アイコン
      var head = el("circle", { cx: curCenterX, cy: 174, r: 5.5, fill: "#2563eb" });
      var body = el("polygon", {
        points: (curCenterX - 2) + ",179 " + (curCenterX + 2) + ",179 " + (curCenterX + 6.5) + ",191 " + (curCenterX - 6.5) + ",191",
        fill: "#2563eb"
      });
      gTrays.appendChild(head);
      gTrays.appendChild(body);

      // トレイ枠
      var trayBox = el("rect", {
        x: curTrayX, y: 193, width: trayW, height: 68, rx: 8,
        fill: "#f8fafc", stroke: "#cbd5e1", "stroke-width": 1.5
      });
      gTrays.appendChild(trayBox);
      trayBoxes.push(trayBox);

      // トレイラベル
      var trayLabel = el("text", {
        x: curTrayX + 8, y: 205, fill: "#64748b",
        "font-size": 9.5, "font-weight": 800,
        "font-family": "'M PLUS Rounded 1c', sans-serif"
      });
      trayLabel.textContent = (j + 1) + "人目";
      gTrays.appendChild(trayLabel);

      // トレイ内 10の束スロット座標（左側配置）
      var tList = [];
      for(var k = 0; k < q_ten; k++){
        tList.push({
          x: curTrayX + 8,
          y: 211 + k * 21
        });
      }
      trayTenCoords.push(tList);

      // トレイ内 1のブロックスロット座標（右側配置）
      var oList = [];
      var oStartX = (q_ten > 0) ? (curTrayX + 46) : (curTrayX + 10);
      var maxCols3 = (q_ten > 0) ? 4 : 5;
      for(var m = 0; m < q_one; m++){
        oList.push({
          x: oStartX + (m % maxCols3) * 17 + 8,
          y: 214 + Math.floor(m / maxCols3) * 17
        });
      }
      trayOneCoords.push(oList);
    }

    // 余りトレイ（余りがある場合）
    var remTrayX = traysStartX + totalTraysW + 12;
    if(hasRem){
      var rHead = el("circle", { cx: remTrayX + 22, cy: 174, r: 5.5, fill: "#e11d48" });
      var rBody = el("polygon", {
        points: (remTrayX + 20) + ",179 " + (remTrayX + 24) + ",179 " + (remTrayX + 28.5) + ",191 " + (remTrayX + 15.5) + ",191",
        fill: "#e11d48"
      });
      gTrays.appendChild(rHead);
      gTrays.appendChild(rBody);

      var rTrayBox = el("rect", {
        x: remTrayX, y: 193, width: 44, height: 68, rx: 8,
        fill: "#fff1f2", stroke: "#fda4af", "stroke-width": 1.5
      });
      gTrays.appendChild(rTrayBox);

      var rTrayLabel = el("text", {
        x: remTrayX + 22, y: 205, "text-anchor": "middle",
        fill: "#e11d48", "font-size": 9.5, "font-weight": 800,
        "font-family": "'M PLUS Rounded 1c', sans-serif"
      });
      rTrayLabel.textContent = "あまり";
      gTrays.appendChild(rTrayLabel);
    }

    // 1人分の持ち分合計＆最終まとめ（Stage 4, 5で中央に表示）
    var stage4SummaryG = el("g", { style: "display: none;" });
    var s4Txt1 = middleText(230, 114, "", "slot-orange", {size: 13.5, weight: 800});
    var s4Txt2 = middleText(230, 138, "", null, {size: 12.5});
    stage4SummaryG.appendChild(s4Txt1);
    stage4SummaryG.appendChild(s4Txt2);
    svg.appendChild(stage4SummaryG);

    var stage5SummaryG = el("g", { style: "display: none;" });
    var s5Txt1 = middleText(230, 114, "", "slot-orange", {size: 15.5, weight: 800});
    var s5Txt2 = middleText(230, 138, "", null, {size: 13});
    stage5SummaryG.appendChild(s5Txt1);
    stage5SummaryG.appendChild(s5Txt2);
    svg.appendChild(stage5SummaryG);

    // --------------------------------------------------
    // 5. 座標計算（初期配置・解体配置）
    // --------------------------------------------------
    // 上部初期座標（Stage 0）
    var initStartX = 230 - Math.round((tenDigit * 38 + oneDigit * 18 + 16) / 2);
    var initTenCoords = [];
    for(var b = 0; b < tenDigit; b++){
      initTenCoords.push({ x: initStartX + b * 38, y: 104 });
    }
    var oneInitX = initStartX + tenDigit * 38 + 14;
    var initOneCoords = [];
    for(var o = 0; o < oneDigit; o++){
      initOneCoords.push({ x: oneInitX + o * 18 + 8, y: 113 });
    }

    // Stage 2 の解体・合体座標
    var unbundledCount = tenRem * 10;
    var tenCols = (tenRem >= 2) ? 10 : 5;
    var tenRows = Math.max(1, Math.ceil(unbundledCount / tenCols));
    var oneCols = Math.max(1, Math.min(5, oneDigit));
    var tenWidth = (unbundledCount > 0) ? (tenCols * 17) : 0;
    var plusWidth = (unbundledCount > 0 && oneDigit > 0) ? 26 : 0;
    var oneWidth = (oneDigit > 0) ? (oneCols * 17) : 10;
    var eqWidth = 84;
    var totalWorkW = (unbundledCount > 0 ? (tenWidth + plusWidth) : 0) + oneWidth + eqWidth;
    var workStartX = Math.max(16, 230 - Math.round(totalWorkW / 2));
    var tenBlkX = workStartX;
    var tenBlkY = 96;
    var commonLabelY = tenBlkY + tenRows * 17 + 9;

    var burstOneCoords = [];
    for(var tk = 0; tk < unbundledCount; tk++){
      var tcol = tk % tenCols;
      var trow = Math.floor(tk / tenCols);
      burstOneCoords.push({
        x: tenBlkX + tcol * 17 + 8,
        y: tenBlkY + trow * 17
      });
    }

    var plusX = tenBlkX + tenWidth + 14;
    var oneBlkX = (unbundledCount > 0) ? (plusX + 18) : workStartX;
    var mergedOneCoords = [];
    for(var om = 0; om < oneDigit; om++){
      mergedOneCoords.push({
        x: oneBlkX + (om % 5) * 17 + 8,
        y: tenBlkY + Math.floor(om / 5) * 17
      });
    }

    // --------------------------------------------------
    // 6. ブロック生成（10の束たち・1のブロックたち）
    // --------------------------------------------------
    function createBundleEl(label){
      var g = el("g", { class: "bundle-unit" });
      var inner = el("g", { class: "bundle-inner" });
      var r = el("rect", {
        x: 0, y: 0, width: 34, height: 19, rx: 4,
        fill: "#e0f2fe", stroke: "#0284c7", "stroke-width": 1.5
      });
      var t = el("text", {
        x: 17, y: 14, "text-anchor": "middle",
        fill: "#0369a1", "font-size": 11, "font-weight": 800,
        "font-family": "'M PLUS Rounded 1c', sans-serif"
      });
      t.textContent = label || "10";
      inner.appendChild(r);
      inner.appendChild(t);
      g.appendChild(inner);
      return { g: g, inner: inner, r: r, t: t };
    }

    function createOneEl(label){
      var g = el("g", { class: "block-unit" });
      var inner = el("g", { class: "block-inner" });
      var c = el("circle", {
        cx: 0, cy: 0, r: 7.5,
        fill: "#fff", stroke: "#f59e0b", "stroke-width": 1.5
      });
      var t = el("text", {
        x: 0, y: 3.5, "text-anchor": "middle",
        fill: "#b45309", "font-size": 9.5, "font-weight": 800,
        "font-family": "'M PLUS Rounded 1c', sans-serif"
      });
      t.textContent = label || "1";
      inner.appendChild(c);
      inner.appendChild(t);
      g.appendChild(inner);
      return { g: g, inner: inner, c: c, t: t };
    }

    var bundles = [];
    for(var bi = 0; bi < tenDigit; bi++){
      var bObj = createBundleEl("10");
      moveEl(bObj.g, initTenCoords[bi].x, initTenCoords[bi].y, false);
      gBlocks.appendChild(bObj.g);
      bundles.push({
        obj: bObj,
        initX: initTenCoords[bi].x,
        initY: initTenCoords[bi].y,
        isRem: bi >= (divisor * q_ten),
        assignedPerson: Math.floor(bi / q_ten),
        assignedIndex: bi % q_ten
      });
    }

    // もとの1のブロックたち
    var initialOnes = [];
    for(var oi = 0; oi < oneDigit; oi++){
      var oObj = createOneEl("1");
      moveEl(oObj.g, initOneCoords[oi].x, initOneCoords[oi].y, false);
      gBlocks.appendChild(oObj.g);
      initialOnes.push({
        obj: oObj,
        initX: initOneCoords[oi].x,
        initY: initOneCoords[oi].y,
        mergedX: mergedOneCoords[oi].x,
        mergedY: mergedOneCoords[oi].y
      });
    }

    // バラして生まれる1のブロックたち（初期は非表示）
    var burstOnes = [];
    for(var bti = 0; bti < unbundledCount; bti++){
      var burstObj = createOneEl("1");
      moveEl(burstObj.g, burstOneCoords[bti].x, burstOneCoords[bti].y, false);
      burstObj.g.style.opacity = "0";
      burstObj.g.style.display = "none";
      gBlocks.appendChild(burstObj.g);
      burstOnes.push({
        obj: burstObj,
        burstX: burstOneCoords[bti].x,
        burstY: burstOneCoords[bti].y
      });
    }

    // 全ての1のブロックリスト（Stage 3の配分用: burstOnes + initialOnes）
    var allWorkOnes = [];
    for(var ai1 = 0; ai1 < burstOnes.length; ai1++){
      allWorkOnes.push({
        obj: burstOnes[ai1].obj,
        currX: burstOnes[ai1].burstX,
        currY: burstOnes[ai1].burstY
      });
    }
    for(var ai2 = 0; ai2 < initialOnes.length; ai2++){
      allWorkOnes.push({
        obj: initialOnes[ai2].obj,
        currX: isUnbundle ? initialOnes[ai2].mergedX : initialOnes[ai2].initX,
        currY: isUnbundle ? initialOnes[ai2].mergedY : initialOnes[ai2].initY
      });
    }

    // --------------------------------------------------
    // 7. Stage 2 合体ラベル・紫枠
    // --------------------------------------------------
    var unbundleEqG = el("g", { style: "display: none; opacity: 0;" });
    if(isUnbundle){
      var unionBox = el("rect", {
        x: workStartX - 8, y: tenBlkY - 14,
        width: totalWorkW + 16, height: (commonLabelY - tenBlkY + 22),
        rx: 8, class: "group-box-purple"
      });
      unbundleEqG.appendChild(unionBox);

      var blockCenterY = tenBlkY + Math.floor((tenRows * 17) / 2);
      var tenLabel = middleText(tenBlkX + tenWidth / 2, commonLabelY, "バラした " + unbundledCount + "個", "slot-orange", {size: 10.5, weight: 800});
      unbundleEqG.appendChild(tenLabel);
      var plusTxt = middleText(plusX, blockCenterY, "＋", "slot-orange", {size: 18, weight: 800});
      unbundleEqG.appendChild(plusTxt);
      var oneLabel = middleText(oneBlkX + oneWidth / 2, commonLabelY, "もとの " + oneDigit + "個", null, {size: 10.5, weight: 800});
      unbundleEqG.appendChild(oneLabel);
      var eqTotalTxt = middleText(oneBlkX + oneWidth + 42, blockCenterY, "＝ " + unbundlePart + "個！", "slot-orange", {size: 17, weight: 800});
      unbundleEqG.appendChild(eqTotalTxt);
    }
    gUnion.appendChild(unbundleEqG);

    // 余った束のアラートバッジ（Stage 1用）
    var alertBadgeG = el("g", { style: "display: none; opacity: 0;" });
    var alertW = 200;
    var alertBg = el("rect", {
      x: 230 - alertW / 2, y: 134, width: alertW, height: 24, rx: 12,
      fill: "#fff7ed", stroke: "#f97316", "stroke-width": 1.5
    });
    alertBadgeG.appendChild(alertBg);
    alertBadgeG.appendChild(middleText(230, 150, "⚠️ " + tenRem + "束あまった！（分けられない）", "slot-orange", {size: 11, weight: 800}));
    svg.appendChild(alertBadgeG);

    level4Scene = {
      problemKey: p.dividend + "-" + p.divisor + "-" + (p.remainder || 0),
      p: p,
      divisor: divisor,
      dividend: dividend,
      tenDigit: tenDigit,
      oneDigit: oneDigit,
      tenRem: tenRem,
      q_ten: q_ten,
      unbundlePart: unbundlePart,
      q_one: q_one,
      isUnbundle: isUnbundle,
      hasRem: hasRem,
      // elements
      qSlot: qSlot,
      rSlot: rSlot,
      badgeBg: badgeBg,
      badgeTextEl: badgeTextEl,
      subTextEl: subTextEl,
      trayBoxes: trayBoxes,
      stage4SummaryG: stage4SummaryG,
      s4Txt1: s4Txt1,
      s4Txt2: s4Txt2,
      stage5SummaryG: stage5SummaryG,
      s5Txt1: s5Txt1,
      s5Txt2: s5Txt2,
      gGhosts: gGhosts,
      gBoxes: gBoxes,
      gEffects: gEffects,
      alertBadgeG: alertBadgeG,
      unbundleEqG: unbundleEqG,
      bundles: bundles,
      initialOnes: initialOnes,
      burstOnes: burstOnes,
      allWorkOnes: allWorkOnes,
      trayPositions: trayPositions,
      trayTenCoords: trayTenCoords,
      trayOneCoords: trayOneCoords,
      initTenCoords: initTenCoords,
      initOneCoords: initOneCoords,
      remTrayX: remTrayX,
      totalTraysW: totalTraysW,
      traysStartX: traysStartX,
      tenBlkX: tenBlkX,
      tenBlkY: tenBlkY,
      tenWidth: tenWidth,
      tenRows: tenRows
    };
  }

  function renderLevel4(forward){
    clearLevel4Timers();
    var p = state.problem;
    var stage = state.hintStage;
    var expectedKey = p.dividend + "-" + p.divisor + "-" + (p.remainder || 0);

    // シーンが存在しない、または別の問題になった場合は初期化
    if(!level4Scene || level4Scene.problemKey !== expectedKey){
      initLevel4Scene(p);
    }

    var sc = level4Scene;
    var divisor = sc.divisor;
    var dividend = sc.dividend;
    var tenDigit = sc.tenDigit;
    var oneDigit = sc.oneDigit;
    var tenRem = sc.tenRem;
    var q_ten = sc.q_ten;
    var unbundlePart = sc.unbundlePart;
    var q_one = sc.q_one;
    var isUnbundle = sc.isUnbundle;

    // ガイドテキストの設定
    var guideTxt = "";
    if(stage === 0){
      guideTxt = "十の位（10の束）から じゅんばんに 分けていこう！";
    } else if(stage === 1){
      guideTxt = isUnbundle 
        ? "① 10の束 " + tenDigit + "つを " + divisor + "人に分けると… 1人" + q_ten + "束で " + tenRem + "束あまる！"
        : "① 10の束 " + tenDigit + "つを " + divisor + "人に分けると… 1人" + q_ten + "束！";
    } else if(stage === 2){
      guideTxt = isUnbundle
        ? "② あまった " + tenRem + "束を チャリーンとバラして " + (tenRem * 10) + "個＋" + oneDigit + "個＝" + unbundlePart + "個！"
        : "② 10の束はきれいに分かれたね！つぎは 1のブロック " + oneDigit + "個 を分けるよ！";
    } else if(stage === 3){
      guideTxt = "③ 1のブロック " + unbundlePart + "個 を " + divisor + "人に分けると… 1人" + q_one + "個" + (p.remainder > 0 ? "（あまり " + p.remainder + "個）" : "！");
    } else if(stage === 4){
      guideTxt = "④ 1人分は 10の束" + q_ten + "つ（" + (q_ten * 10) + "）と 1が" + q_one + "個で… " + p.quotient + "！";
    } else {
      guideTxt = "⑤ だから 答えは " + p.quotient + (p.remainder > 0 ? " あまり " + p.remainder : "") + " ！";

    sc.badgeBg.setAttribute("fill", (stage === 2 && isUnbundle) ? "#fef3c7" : "#f1f5f9");
    sc.badgeBg.setAttribute("stroke", (stage === 2 && isUnbundle) ? "#f59e0b" : "#cbd5e1");

    var guideSz = calcSvgFontSize(guideTxt, 420, 13, 10.5);
    sc.badgeTextEl.setAttribute("font-size", guideSz);
    sc.badgeTextEl.setAttribute("class", (stage === 2 && isUnbundle) ? "slot-orange" : "");

    // スロット状態
    var targetDigits = p.targetQuotientDigits || 2;
    var slotTxt = (stage >= 5) ? p.quotient : (state.inputDigits.length ? state.inputDigits : "?".repeat(targetDigits));
    var slotCls = (stage >= 5) ? "slot-orange pop" : (state.inputDigits.length ? "slot-blue" : "slot-wait");
    sc.qSlot.textContent = slotTxt;
    sc.qSlot.setAttribute("class", slotCls);

    if(sc.rSlot && p.hasRemainder){
      var rTxt = (stage >= 5) ? p.remainder : (state.inputRemainder.length ? state.inputRemainder : "?");
      var rCls = (stage >= 5) ? "slot-orange pop" : (state.inputRemainder.length ? "slot-blue" : "slot-wait");
      sc.rSlot.textContent = rTxt;
      sc.rSlot.setAttribute("class", rCls);
    }

    // トレイとサマリーの初期化
    sc.trayBoxes.forEach(function(box, i){
      var isFocus = (stage >= 4 && i === 0);
      box.setAttribute("fill", isFocus ? "#fff7ed" : "#f8fafc");
      box.setAttribute("stroke", isFocus ? "#ea580c" : "#cbd5e1");
      box.setAttribute("stroke-width", isFocus ? "2.5" : "1.5");
      box.setAttribute("class", isFocus ? "highlight-dish" : "");
    });
    sc.stage4SummaryG.style.display = (stage === 4) ? "block" : "none";
    sc.stage5SummaryG.style.display = (stage >= 5) ? "block" : "none";

    // 囲み枠・エフェクトのクリア
    sc.gGhosts.innerHTML = "";
    sc.gBoxes.innerHTML = "";
    sc.gEffects.innerHTML = "";
    sc.alertBadgeG.style.display = "none";
    sc.alertBadgeG.style.opacity = "0";
    sc.unbundleEqG.style.display = "none";
    sc.unbundleEqG.style.opacity = "0";

    // ==================================================
    // STAGE 0: はじめの数
    // ==================================================
    if(stage === 0){
      sc.subTextEl.textContent = "はじめの数 " + dividend + "（10の束が" + tenDigit + "つ、1のブロックが" + oneDigit + "個）";
      sc.subTextEl.setAttribute("class", "");

      // 10の束を上部初期位置にセット
      sc.bundles.forEach(function(b){
        b.obj.g.style.display = "block";
        b.obj.g.style.opacity = "1";
        b.obj.r.setAttribute("fill", "#e0f2fe");
        b.obj.r.setAttribute("stroke", "#0284c7");
        b.obj.r.setAttribute("stroke-width", "1.5");
        b.obj.t.setAttribute("fill", "#0369a1");
        b.obj.inner.classList.remove("ten-rem-pulse");
        b.obj.inner.classList.remove("bundle-burst");
        moveEl(b.obj.g, b.initX, b.initY, false);
      });

      // もとの1のブロックを上部初期位置にセット
      sc.initialOnes.forEach(function(o){
        o.obj.g.style.display = "block";
        o.obj.g.style.opacity = "1";
        o.obj.c.setAttribute("stroke", "#f59e0b");
        o.obj.t.setAttribute("fill", "#b45309");
        o.obj.inner.classList.remove("block-drop-in");
        moveEl(o.obj.g, o.initX, o.initY, false);
      });

      // バラしブロックは非表示
      sc.burstOnes.forEach(function(bo){
        bo.obj.g.style.display = "none";
        bo.obj.g.style.opacity = "0";
        bo.obj.inner.classList.remove("block-drop-in");
      });
    }

    // ==================================================
    // STAGE 1: 10の束を分ける（囲む ➔ スーッと移動 ➔ あまり強調）
    // ==================================================
    else if(stage === 1){
      sc.subTextEl.textContent = isUnbundle
        ? "10の束のわり算： " + tenDigit + "束 ÷ " + divisor + " ＝ 1人 " + q_ten + "束 （あまり " + tenRem + "束）"

      sc.subTextEl.setAttribute("class", "slot-orange");

      // もとの1のブロックは初期位置のまま
      sc.initialOnes.forEach(function(o){
        o.obj.g.style.display = "block";
        o.obj.g.style.opacity = "1";
        o.obj.c.setAttribute("stroke", "#f59e0b");
        o.obj.t.setAttribute("fill", "#b45309");
        o.obj.inner.classList.remove("block-drop-in");
        moveEl(o.obj.g, o.initX, o.initY, false);
      });

      // バラしブロックは非表示
      sc.burstOnes.forEach(function(bo){
        bo.obj.g.style.display = "none";
        bo.obj.g.style.opacity = "0";
        bo.obj.inner.classList.remove("block-drop-in");
      });

      if(forward){
        // 【ステップ1-A: 初期位置に整列 ＆ 囲む】
        sc.bundles.forEach(function(b){
          b.obj.g.style.display = "block";
          b.obj.g.style.opacity = "1";
          b.obj.r.setAttribute("fill", "#e0f2fe");
          b.obj.r.setAttribute("stroke", "#0284c7");
          b.obj.r.setAttribute("stroke-width", "1.5");
          b.obj.t.setAttribute("fill", "#0369a1");

          b.obj.inner.classList.remove("bundle-burst");
          moveEl(b.obj.g, b.initX, b.initY, false);
        });

        // 囲み枠とゴースト枠の描画（warizan-imi-anime同様）
        for(var jBox = 0; jBox < divisor; jBox++){
          if(q_ten === 0) continue;
          var firstIdx = jBox * q_ten;
          var lastIdx = (jBox + 1) * q_ten - 1;
          var bx = sc.initTenCoords[firstIdx].x - 4;
          var by = sc.initTenCoords[firstIdx].y - 4;
          var bw = (lastIdx - firstIdx + 1) * 38 - 4 + 8;
          var bh = 19 + 8;

          // ゴースト枠（移動元にずっと残る）
          var gGhost = el("rect", {
            x: bx, y: by, width: bw, height: bh, rx: 6, class: "ghost-box"
          });
          sc.gGhosts.appendChild(gGhost);

          // 青い点線囲み枠
          var bRect = el("rect", {
            x: bx, y: by, width: bw, height: bh, rx: 6, class: "group-box-blue"
          });
          var bTag = el("text", {
            x: bx + 6, y: by - 3, fill: "#2563eb",
            "font-size": 9.5, "font-weight": 800,
            "font-family": "'M PLUS Rounded 1c', sans-serif"
          });
          bTag.textContent = (bw < 60) ? ((jBox + 1) + "人目") : ((jBox + 1) + "人目へ " + q_ten + "束");
          sc.gBoxes.appendChild(bRect);
          sc.gBoxes.appendChild(bTag);
        }

        // 【ステップ1-B: 450ms後にスーッと移動】
        level4Timers.push(setTimeout(function(){
          // 囲み枠をフェードアウト
          sc.gBoxes.style.transition = "opacity 0.3s ease";
          sc.gBoxes.style.opacity = "0";

          // 配る束をトレイへスーッと移動
          sc.bundles.forEach(function(b){
            if(!b.isRem){
              var target = sc.trayTenCoords[b.assignedPerson][b.assignedIndex];
              moveEl(b.obj.g, target.x, target.y, true, 750, 0);
            }
          });
        }, 450));

        // 【ステップ1-C: 1200ms後に余った束を強調】
        if(isUnbundle){
          level4Timers.push(setTimeout(function(){
            sc.bundles.forEach(function(b){
              if(b.isRem){
                b.obj.inner.classList.add("ten-rem-pulse");
                b.obj.r.setAttribute("fill", "#ffedd5");
                b.obj.r.setAttribute("stroke", "#ea580c");
                b.obj.r.setAttribute("stroke-width", "2.5");
                b.obj.t.setAttribute("fill", "#c2410c");

            sc.alertBadgeG.style.display = "block";
            sc.alertBadgeG.style.transition = "opacity 0.3s ease";
            sc.alertBadgeG.style.opacity = "1";
            sc.alertBadgeG.classList.add("pop");
          }, 1200));
        }
      } else {
        // 戻る操作（即時確定表示）
        sc.bundles.forEach(function(b){
          b.obj.g.style.display = "block";
          b.obj.g.style.opacity = "1";
          b.obj.inner.classList.remove("bundle-burst");
          if(!b.isRem){
            var targetB = sc.trayTenCoords[b.assignedPerson][b.assignedIndex];
            moveEl(b.obj.g, targetB.x, targetB.y, false);
            b.obj.r.setAttribute("fill", "#e0f2fe");
            b.obj.r.setAttribute("stroke", "#0284c7");
            b.obj.r.setAttribute("stroke-width", "1.5");
            b.obj.t.setAttribute("fill", "#0369a1");
            b.obj.inner.classList.remove("ten-rem-pulse");
          } else {
            moveEl(b.obj.g, b.initX, b.initY, false);
            b.obj.inner.classList.add("ten-rem-pulse");
            b.obj.r.setAttribute("fill", "#ffedd5");
            b.obj.r.setAttribute("stroke", "#ea580c");
            b.obj.r.setAttribute("stroke-width", "2.5");
            b.obj.t.setAttribute("fill", "#c2410c");
          }
        });
        if(isUnbundle){
          sc.alertBadgeG.style.display = "block";
          sc.alertBadgeG.style.opacity = "1";
        }
      }
    }

    // ==================================================
    // STAGE 2: 余った束をチャリーンと解体 ＆ もとのブロックがスーッと寄って合体！
    // ==================================================
    else if(stage === 2){
      // トレイの束はトレイ内確定位置
      sc.bundles.forEach(function(b){
        if(!b.isRem){
          b.obj.g.style.display = "block";
          b.obj.g.style.opacity = "1";

          moveEl(b.obj.g, targetB2.x, targetB2.y, false);

      });

      if(isUnbundle){
        sc.subTextEl.textContent = "あまった10の束を バラすと… " + (tenRem * 10) + "個のブロックに変身！";
        sc.subTextEl.setAttribute("class", "slot-orange");

        // 余った束が解体される位置（バラしブロック群の中央）
        var remTargetX = sc.tenBlkX + Math.round((sc.tenWidth - 34) / 2);
        var remTargetY = sc.tenBlkY + Math.round((sc.tenRows * 17 - 19) / 2);

        if(forward){
          // 【ステップ2-A: 余った束がスーッと解体位置へスライド】
          sc.bundles.forEach(function(b){
            if(b.isRem){
              b.obj.inner.classList.remove("ten-rem-pulse");
              moveEl(b.obj.g, remTargetX, remTargetY, true, 300, 0);
            }
          });

          // 【ステップ2-B: 300ms後にチャリーン！と弾けて10個のブロックが出現】
          level4Timers.push(setTimeout(function(){
            playSound('chariin');

            sc.bundles.forEach(function(b){
              if(b.isRem){
                b.obj.inner.classList.add("bundle-burst");
                setTimeout(function(){
                  b.obj.g.style.display = "none";
                  b.obj.g.style.opacity = "0";
                }, 400);
              }
            });

            // キラキラスパークル生成
            var spCx = remTargetX + 17;
            var spCy = remTargetY + 9.5;
            function addSparkle(cx, cy, color, delay, trans) {
              var spG = el("g", { class: "sparkle-particle" });
              spG.style.setProperty("--spark-trans", trans);
              spG.style.animationDelay = delay + "s";
              var path = el("path", {
                d: "M " + cx + " " + (cy - 8) + " Q " + cx + " " + cy + " " + (cx + 8) + " " + cy + " Q " + cx + " " + cy + " " + cx + " " + (cy + 8) + " Q " + cx + " " + cy + " " + (cx - 8) + " " + cy + " Z",
                fill: color
              });
              spG.appendChild(path);
              sc.gEffects.appendChild(spG);
            }
            addSparkle(spCx, spCy, "#f59e0b", 0, "translate(24px, -20px) scale(0)");
            addSparkle(spCx, spCy, "#fbbf24", 0.05, "translate(-26px, -18px) scale(0)");
            addSparkle(spCx, spCy, "#f97316", 0.08, "translate(28px, 16px) scale(0)");
            addSparkle(spCx, spCy, "#38bdf8", 0.1, "translate(-24px, 18px) scale(0)");
            addSparkle(spCx, spCy, "#a855f7", 0.12, "translate(0px, -26px) scale(0)");

            // バラしたブロックをポンポン出現
            sc.burstOnes.forEach(function(bo, idx){
              bo.obj.g.style.display = "block";
              bo.obj.g.style.opacity = "1";
              bo.obj.inner.classList.add("block-drop-in");
              bo.obj.inner.style.animationDelay = (0.05 + idx * 0.025) + "s";
              moveEl(bo.obj.g, bo.burstX, bo.burstY, false);
            });
          }, 300));

          // もとの1のブロックは初期位置からスタート
          sc.initialOnes.forEach(function(o){
            o.obj.g.style.display = "block";
            o.obj.g.style.opacity = "1";
            o.obj.inner.classList.remove("block-drop-in");
            moveEl(o.obj.g, o.initX, o.initY, false);
          });

          // 【ステップ2-C: 750ms後にもとのブロックがスーッと左へスライド合流】
          level4Timers.push(setTimeout(function(){
            // もとのブロックの初期位置にゴースト枠を置く
            sc.initialOnes.forEach(function(o){
              var gGhostO = el("circle", {
                cx: o.initX, cy: o.initY, r: 7.5, class: "ghost-box"
              });
              sc.gGhosts.appendChild(gGhostO);
              // スーッと移動
              moveEl(o.obj.g, o.mergedX, o.mergedY, true, 700, 0);
            });
          }, 750));

          // 【ステップ2-D: 1500ms後に紫の合体枠と式が出現】
          level4Timers.push(setTimeout(function(){
            sc.unbundleEqG.style.display = "block";
            sc.unbundleEqG.style.transition = "opacity 0.35s ease";
            sc.unbundleEqG.style.opacity = "1";
          }, 1500));
        } else {
          // 戻る操作（即時確定表示）
          sc.bundles.forEach(function(b){
            if(b.isRem){
              b.obj.g.style.display = "none";
              b.obj.g.style.opacity = "0";
              b.obj.inner.classList.remove("bundle-burst");
              b.obj.inner.classList.remove("ten-rem-pulse");
            }
          });
          sc.burstOnes.forEach(function(bo){
            bo.obj.g.style.display = "block";
            bo.obj.g.style.opacity = "1";
            bo.obj.inner.classList.remove("block-drop-in");
            moveEl(bo.obj.g, bo.burstX, bo.burstY, false);
          });
          sc.initialOnes.forEach(function(o){
            o.obj.g.style.display = "block";
            o.obj.g.style.opacity = "1";
            o.obj.inner.classList.remove("block-drop-in");
            moveEl(o.obj.g, o.mergedX, o.mergedY, false);
          });
          sc.unbundleEqG.style.display = "block";
          sc.unbundleEqG.style.opacity = "1";
        }
      } else {
        // 解体なし（4-1）
        sc.subTextEl.textContent = "一の位のブロック " + oneDigit + "個 を見てみよう！";
        sc.initialOnes.forEach(function(o){
          o.obj.g.style.display = "block";
          o.obj.g.style.opacity = "1";
          o.obj.inner.classList.remove("block-drop-in");
          moveEl(o.obj.g, o.initX, o.initY, false);
        });
      }
    }

    // ==================================================
    // STAGE 3: 1のブロックを分ける（囲む ➔ スーッと各トレイへ移動）
    // ==================================================
    else if(stage === 3){

      sc.bundles.forEach(function(b){
        if(!b.isRem){
          b.obj.g.style.display = "block";
          b.obj.g.style.opacity = "1";
          var targetB3 = sc.trayTenCoords[b.assignedPerson][b.assignedIndex];
          moveEl(b.obj.g, targetB3.x, targetB3.y, false);
        } else {
          b.obj.g.style.display = "none";
        }
      });

      var eqStr3 = unbundlePart + " ÷ " + divisor + " ＝ " + q_one + (p.remainder > 0 ? "（あまり " + p.remainder + "）" : "");
      sc.subTextEl.textContent = "1のブロックのわり算： " + eqStr3;
      sc.subTextEl.setAttribute("class", "slot-orange");

      if(forward){
        // まず全作業ブロックを合体位置（Stage 2の場所）に確実に配置して表示
        sc.allWorkOnes.forEach(function(wo){
          wo.obj.g.style.display = "block";
          wo.obj.g.style.opacity = "1";
          wo.obj.inner.classList.remove("block-drop-in");
          moveEl(wo.obj.g, wo.currX, wo.currY, false);
        });

        // 【ステップ3-A: 囲む（各人分を青い点線枠で囲む）】
        for(var jBox3 = 0; jBox3 < divisor; jBox3++){
          var startIdx3 = jBox3 * q_one;
          var endIdx3 = (jBox3 + 1) * q_one - 1;
          if(startIdx3 >= sc.allWorkOnes.length) continue;
          var xs3 = sc.allWorkOnes.slice(startIdx3, endIdx3 + 1).map(function(w){ return w.currX; });
          var ys3 = sc.allWorkOnes.slice(startIdx3, endIdx3 + 1).map(function(w){ return w.currY; });
          var minX3 = Math.min.apply(null, xs3) - 10;
          var minY3 = Math.min.apply(null, ys3) - 10;
          var maxX3 = Math.max.apply(null, xs3) + 10;
          var maxY3 = Math.max.apply(null, ys3) + 10;

          // ゴースト枠
          var gGhost3 = el("rect", {
            x: minX3, y: minY3, width: (maxX3 - minX3), height: (maxY3 - minY3), rx: 6, class: "ghost-box"
          });
          sc.gGhosts.appendChild(gGhost3);

          // 青枠
          var bRect3 = el("rect", {
            x: minX3, y: minY3, width: (maxX3 - minX3), height: (maxY3 - minY3), rx: 6, class: "group-box-blue"
          });
          var bTag3 = el("text", {
            x: minX3 + 6, y: minY3 - 3, fill: "#2563eb",
            "font-size": 9.5, "font-weight": 800,
            "font-family": "'M PLUS Rounded 1c', sans-serif"
          });
          var bw3 = maxX3 - minX3;
          bTag3.textContent = (bw3 < 60) ? ((jBox3 + 1) + "人目") : ((jBox3 + 1) + "人目へ " + q_one + "個");
          sc.gBoxes.appendChild(bRect3);
          sc.gBoxes.appendChild(bTag3);
        }

        // 余りブロックがある場合はオレンジ枠で囲む
        if(p.remainder > 0){
          var remStartIdx3 = divisor * q_one;
          var remXs = sc.allWorkOnes.slice(remStartIdx3).map(function(w){ return w.currX; });
          var remYs = sc.allWorkOnes.slice(remStartIdx3).map(function(w){ return w.currY; });
          var rMinX = Math.min.apply(null, remXs) - 10;
          var rMinY = Math.min.apply(null, remYs) - 10;
          var rMaxX = Math.max.apply(null, remXs) + 10;
          var rMaxY = Math.max.apply(null, remYs) + 10;

          var rGhost = el("rect", {
            x: rMinX, y: rMinY, width: (rMaxX - rMinX), height: (rMaxY - rMinY), rx: 6, class: "ghost-box"
          });
          sc.gGhosts.appendChild(rGhost);

          var rBox = el("rect", {
            x: rMinX, y: rMinY, width: (rMaxX - rMinX), height: (rMaxY - rMinY), rx: 6, class: "group-box-orange"
          });
          var rTag = el("text", {
            x: rMinX + 6, y: rMinY - 3, fill: "#ea580c",
            "font-size": 9.5, "font-weight": 800,
            "font-family": "'M PLUS Rounded 1c', sans-serif"
          });
          rTag.textContent = "あまり " + p.remainder + "個";
          sc.gBoxes.appendChild(rBox);
          sc.gBoxes.appendChild(rTag);
        }

        // 【ステップ3-B: 450ms後に各トレイへスーッと移動】
        level4Timers.push(setTimeout(function(){
          sc.gBoxes.style.transition = "opacity 0.3s ease";
          sc.gBoxes.style.opacity = "0";

          // 各人のトレイへ移動
          for(var tj3_m = 0; tj3_m < divisor; tj3_m++){
            for(var om3_m = 0; om3_m < q_one; om3_m++){
              var blkIdx3_m = tj3_m * q_one + om3_m;
              if(blkIdx3_m < sc.allWorkOnes.length){
                var item3 = sc.allWorkOnes[blkIdx3_m];
                var tCoord = sc.trayOneCoords[tj3_m][om3_m];
                moveEl(item3.obj.g, tCoord.x, tCoord.y, true, 750, 0);
              }
            }
          }

          // 余りブロックの移動
          if(p.remainder > 0){
            for(var ri_m = 0; ri_m < p.remainder; ri_m++){
              var rBlkIdx = divisor * q_one + ri_m;
              if(rBlkIdx < sc.allWorkOnes.length){
                var rItem = sc.allWorkOnes[rBlkIdx];
                rItem.obj.c.setAttribute("stroke", "#e11d48");
                rItem.obj.t.setAttribute("fill", "#e11d48");
                moveEl(rItem.obj.g, sc.remTrayX + 14, 210 + ri_m * 18, true, 750, 0);
              }
            }
          }
        }, 450));
      } else {
        // 戻る操作（即時確定表示）
        for(var tj3_b = 0; tj3_b < divisor; tj3_b++){
          for(var om3_b = 0; om3_b < q_one; om3_b++){
            var blkIdx3_b = tj3_b * q_one + om3_b;
            if(blkIdx3_b < sc.allWorkOnes.length){
              var item3_b = sc.allWorkOnes[blkIdx3_b];
              item3_b.obj.g.style.display = "block";
              item3_b.obj.g.style.opacity = "1";
              item3_b.obj.inner.classList.remove("block-drop-in");
