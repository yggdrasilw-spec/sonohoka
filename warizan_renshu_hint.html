<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>わり算れんしゅう ヒントつき もんだいしゅう</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');

  :root{
    --paper:#FBF3E1;
    --paper-line:#E4D6AE;
    --ink:#2B2A4C;
    --ink-soft:#6b6a8c;
    --accent:#FF8C42;
    --accent-soft:#FFE7CC;
    --accent-deep:#E06B1F;
    --good:#2FAE8B;
    --good-soft:#DBF3EA;
    --bad:#E8505B;
    --bad-soft:#FDE3E1;
    --card:#FFFFFF;
    --blue:#3E6D9C;
    --blue-soft:#E4EEF8;
  }

  *{ box-sizing: border-box; }

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  body{
    margin:0;
    min-height:100vh;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 40px;
    font-family:'M PLUS Rounded 1c', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    align-items:stretch;
    padding: 10px 12px;
  }

  #app{
    width:100%;
    max-width: 1240px;
    height:100%;
    min-height:0;
    display:flex;
    flex-direction:column;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
    flex:0 0 auto;
    gap:8px;
  }

  header.top h1{
    font-size: 1.3rem;
    font-weight:800;
    margin:0;
    letter-spacing: .02em;
  }

  #scoreBox{
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    padding: 6px 16px;
    font-weight:700;
    font-size:.95rem;
    color: var(--ink-soft);
    display:none;
    align-items:center;
    gap:6px;
  }
  #scoreBox.show{ display:flex; }
  #scoreBox b{ color: var(--good); font-size:1.05rem; }

  .sound-btn{
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    cursor: pointer;
    transition: transform .1s, border-color .15s;
    user-select: none;
    flex-shrink: 0;
  }
  .sound-btn:hover{
    transform: scale(1.08);
    border-color: var(--accent);
  }
  .sound-btn.sound-off{
    filter: grayscale(1) opacity(0.45);
  }

  /* ---------- raid boss controls ---------- */
  .raid-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    position:relative;
  }
  .raid-code-box{
    display:flex;
    align-items:center;
    gap:4px;
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    padding: 3px 8px;
  }
  .raid-code-box input{
    width: 64px;
    border: none;
    outline: none;
    background: transparent;
    font-family: monospace, inherit;
    font-weight: 800;
    font-size: .9rem;
    text-align: center;
    color: var(--blue);
  }
  .raid-btn{
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: .8rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .15s;
  }
  .raid-btn:hover{ opacity: .9; }
  .conn-status{
    font-size: .85rem;
    cursor: default;
  }
  .boss-mini-status{
    display: none;
    align-items: center;
    gap: 4px;
    background: #fff8e6;
    border: 2px solid #ffd166;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: .85rem;
    font-weight: 800;
    color: #b45309;
    box-shadow: 0 2px 6px rgba(180,83,9,.1);
    animation: fadeInAnim .3s ease;
  }
  .boss-mini-status.show{ display: flex; }
  .streak-badge{
    display: none;
    align-items: center;
    gap: 4px;
    background: #fff1f2;
    border: 2px solid #fda4af;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: .85rem;
    font-weight: 800;
    color: #e11d48;
  }
  .streak-badge.show{ display: flex; }
  .user-profile-box{
    display: flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    padding: 2px 6px;
    position: relative;
  }
  .avatar-select-btn{
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 1px 3px;
    border-radius: 8px;
    transition: transform .1s;
  }
  .avatar-select-btn:hover{ transform: scale(1.15); }
  .avatar-picker-popover{
    position: absolute;
    top: 38px;
    left: 0;
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 12px;
    padding: 6px 8px;
    display: none;
    gap: 6px;
    z-index: 1000;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .avatar-picker-popover.show{ display: flex; }
  .avatar-option{
    font-size: 1.4rem;
    cursor: pointer;
    padding: 3px;
    border-radius: 6px;
    transition: background .15s;
  }
  .avatar-option:hover{ background: var(--accent-soft); }
  .name-input-box input{
    width: 60px;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-weight: 700;
    font-size: .85rem;
    text-align: center;
    color: var(--ink);
  }
  .raid-msg{
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    font-size: .8rem;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    border: 2px solid var(--paper-line);
    white-space: nowrap;
    z-index: 1000;
    display: none;
    animation: fadeInAnim .2s ease;
  }
  .raid-msg.show{ display: block; }
  .raid-msg.error{ color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
  .raid-msg.good{ color: var(--good); border-color: var(--good); background: var(--good-soft); }
  .raid-msg.warn{ color: var(--accent-deep); border-color: var(--accent); background: var(--accent-soft); }

  .card{
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 6px 0 var(--paper-line), 0 8px 20px rgba(43,42,76,.08);
    padding: 16px;
  }

  /* ---------- level select accordion ---------- */
  #levelSelect {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-right: 10px;
  }
  #levelSelect::-webkit-scrollbar {
    width: 8px;
  }
  #levelSelect::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.04);
    border-radius: 999px;
  }
  #levelSelect::-webkit-scrollbar-thumb {
    background: var(--paper-line);
    border-radius: 999px;
  }
  #levelSelect::-webkit-scrollbar-thumb:hover {
    background: var(--ink-soft);
  }

  .level-category {
    margin-bottom: 12px;
    border: 2px solid var(--paper-line);
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
  }
  .category-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--card);
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: background .15s;
  }
  .category-header:hover {
    background: var(--paper-line);
  }
  .category-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--ink);
  }
  .category-arrow {
    font-size: 0.85rem;
    color: var(--ink-soft);
    transition: transform .2s ease;
  }
  .level-category.open .category-arrow {
    transform: rotate(180deg);
  }
  .category-content {
    display: none;
    padding: 12px;
    gap: 10px;
    flex-direction: column;
    border-top: 2px solid var(--paper-line);
  }
  .level-category.open .category-content {
    display: flex;
  }

  #levelSelect .level-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    text-align:left;
    border: 2px solid var(--paper-line);
    background: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    cursor:pointer;
    font-family: inherit;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  #levelSelect .level-btn:hover{
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 140, 66, 0.15);
  }
  #levelSelect .level-btn:active{ transform: translateY(0); }
  #levelSelect .badge{
    flex: 0 0 auto;
    min-width: 48px;
    height: 44px;
    padding: 0 6px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.15rem; font-weight:800; color:#fff;
  }
  #levelSelect .lv1 .badge{ background: var(--blue); }
  #levelSelect .lv2 .badge{ background: var(--accent); }
  #levelSelect .lv3 .badge{ background: #10b981; }
  #levelSelect .lv4 .badge{ background: #8b5cf6; }
  #levelSelect .lv5 .badge{ background: #f97316; }
  #levelSelect .lv6 .badge{ background: #ec4899; }
  #levelSelect .txt strong{ display:block; font-size:.96rem; margin-bottom:2px; }
  #levelSelect .txt span{ color: var(--ink-soft); font-size:.82rem; }

  /* ---------- problem screen ---------- */
  #problemScreen{ display:none; flex:1 1 auto; min-height:0; }
  #problemScreen.show{ display:flex; flex-direction:column; min-height:0; }

  #problemScreen .card{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0, 1fr) 300px;
    gap:16px;
    align-items:stretch;
  }

  .problem-left{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
  }

  .input-panel{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    border-left:2px dashed var(--paper-line);
    padding-left:14px;
  }

  .input-panel #hintControls{ margin-top:auto; }

  #backToLevels{
    background:none; border:none; color: var(--ink-soft);
    font-family:inherit; font-size:.85rem; cursor:pointer;
    padding:2px 0; margin-bottom:5px; display:inline-flex; align-items:center; gap:4px;
    flex:0 0 auto;
  }
  #backToLevels:hover{ color: var(--ink); }

  #stageSvgWrap{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    overflow: hidden;
    border-radius: 14px;
    background: linear-gradient(180deg, #fff, #fffdf7);
    border: 2px dashed var(--paper-line);
    margin-bottom: 6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stageSvg{ display:block; width:100%; height:100%; }

  #hintCaption{
    min-height: 28px;
    text-align:center;
    color: var(--ink-soft);
    font-weight:700;
    font-size:.9rem;
    margin-bottom:0;
    flex:0 0 auto;
  }

  .slot-blue{ fill: var(--blue); }
  .slot-orange{ fill: var(--accent-deep); }
  .slot-wait{ fill: #b9b6d6; }

  /* ---------- keypad / answer ---------- */
  #answerArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    width:100%;
    margin-bottom:0;
  }

  .answer-display{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:1.1rem;
    font-weight:700;
    color: var(--ink-soft);
  }
  .answer-display .chip{
    min-width:52px;
    padding:6px 10px;
    text-align:center;
    background: var(--blue-soft);
    color: var(--blue);
    border-radius:10px;
    font-size:1.3rem;
    font-weight:800;
    cursor: pointer;
    user-select: none;
    transition: transform .1s, outline .1s, background .1s;
  }
  .answer-display .chip:hover{
    transform: scale(1.06);
  }
  .answer-display .chip.active{
    outline:3px solid var(--accent);
    background: #fff;
    box-shadow: 0 2px 8px rgba(255, 140, 66, 0.25);
  }
  .answer-display .chip.wrong{
    outline:3px solid var(--bad) !important;
    background: var(--bad-soft) !important;
    color: var(--bad) !important;
  }
  .answer-display .label-clickable{
    cursor: pointer;
    user-select: none;
    transition: color .15s;
  }
  .answer-display .label-clickable:hover{
    color: var(--accent-deep);
  }
  .answer-display .label-clickable.active{
    color: var(--accent-deep);
    font-weight: 800;
  }

  #keypad{
    display:grid;
    grid-template-columns: repeat(3, minmax(52px, 72px));
    gap:7px;
    justify-content:center;
    width:100%;
    max-width:250px;
  }
  #keypad button{
    width:100%; height:44px;
    border-radius:12px;
    border:2px solid var(--paper-line);
    background:#fff;
    font-family:inherit;
    font-size:1.15rem;
    font-weight:700;
    color: var(--ink);
    cursor:pointer;
  }
  #keypad button:active{ background: var(--accent-soft); border-color: var(--accent); }
  #keypad button.wide{ grid-column: span 3; width:auto; }
  #keypad button.clear{ color: var(--bad); }

  #submitBtn{
    display: none !important;
  }

  /* ---------- hint controls ---------- */
  #hintControls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom: 0;
    flex:0 0 auto;
  }
  #hintControls button{
    border-radius: 999px;
    border: 2px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent-deep);
    font-family: inherit;
    font-weight:800;
    font-size:.95rem;
    padding: 9px 18px;
    cursor:pointer;
  }
  #hintControls button:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  #hintBackBtn{ background:#fff; color: var(--ink-soft); border-color: var(--paper-line); }

  #hintDots{ display:flex; gap:6px; }
  #hintDots span{
    width:9px; height:9px; border-radius:50%;
    background: var(--paper-line);
    display:inline-block;
  }
  #hintDots span.on{ background: var(--accent); }

  /* ---------- feedback ---------- */
  #feedback{
    text-align:center;
    min-height: 28px;
    font-weight:800;
    font-size:1.15rem;
    margin-bottom:10px;
  }
  #feedback.good{ color: var(--good); }
  #feedback.bad{ color: var(--bad); }

  #nextProblemBtn{
    display:none;
    width: 100%;
    max-width: 250px;
    margin: 8px auto 0;
    padding: 11px 20px;
    border-radius: 12px;
    border:none;
    background: var(--good);
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:1.1rem;
    cursor:pointer;
    box-shadow: 0 4px 0 #1f8e70;
    animation: popAnim .3s ease;
  }
  #nextProblemBtn.show{ display:block; }
  #nextProblemBtn:active{ transform: translateY(2px); box-shadow: 0 2px 0 #1f8e70; }

  .shake{ animation: shakeAnim .4s; }
  @keyframes shakeAnim{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(8px); }
    60%{ transform: translateX(-6px); }
    80%{ transform: translateX(6px); }
  }

  .fade-in{ animation: fadeInAnim .35s ease both; }
  @keyframes fadeInAnim{
    from{ opacity:0; transform: translateY(4px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .pop{ animation: popAnim .4s ease both; }
  @keyframes popAnim{
    0%{ transform: scale(1); }
    45%{ transform: scale(1.35); }
    100%{ transform: scale(1); }
  }

  .wrong-row .strike-line{
    stroke:#E8505B;
    stroke-width:5;
    stroke-linecap:round;
    stroke-dasharray:340;
    stroke-dashoffset:340;
    opacity:0;
  }
  .wrong-row.strike .strike-line{
    opacity:1;
    animation: strikeAnim .42s ease forwards;
  }
  .wrong-row.gray{
    opacity:.38;
    transition:opacity .25s ease;
  }
  .wrong-row.shatter{
    animation: shatterAnim .48s cubic-bezier(.55,.05,.68,.53) forwards;
    transform-box:fill-box;
    transform-origin:center;
  }
  .correct-row{
    transition: transform .45s ease;
    transform-box:fill-box;
    transform-origin:center;
  }
  @keyframes strikeAnim{
    from{ stroke-dashoffset:340; }
    to{ stroke-dashoffset:0; }
  }
  @keyframes shatterAnim{
    0%{ opacity:.38; transform:scale(1); filter:blur(0); }
    55%{ opacity:.24; transform:scale(1.08) rotate(1deg); filter:blur(.2px); }
    100%{ opacity:0; transform:scale(.72) rotate(-4deg) translateY(5px); filter:blur(2px); }
  }

  @media (max-width: 820px){
    #problemScreen .card{ grid-template-columns:minmax(0,1fr) 250px; gap:10px; padding:12px; }
    .input-panel{ padding-left:10px; }
  }

  @media (max-height: 720px){
    body{ padding:6px 10px; }
    header.top h1{ font-size:1.1rem; }
    .card{ padding:12px; }
    #problemScreen .card{ grid-template-columns:minmax(0,1fr) 280px; }
    #keypad button{ height:40px; }
    .answer-display .chip{ min-width:44px; padding:4px 8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .shake, .fade-in, .pop, .wrong-row.strike .strike-line, .wrong-row.shatter{ animation: none !important; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <h1>わり算れんしゅう</h1>

    <div class="raid-bar" id="raidBar">
      <div class="raid-code-box">
        <span style="font-size: .85rem;">🔑</span>
        <input type="text" id="studentRaidCode" placeholder="コード" maxlength="8">
        <button id="connectBtn" class="raid-btn" type="button">接続</button>
        <span id="connStatus" class="conn-status" title="接続状態">⚪</span>
      </div>

      <div id="bossMiniStatus" class="boss-mini-status">
        👾 <span id="miniBossName">ボス</span> <span id="miniBossHp"></span>
      </div>

      <div id="streakBadge" class="streak-badge">
        🔥 <span id="streakCount">0</span>れんぞく
      </div>

      <div class="user-profile-box">
        <button id="avatarBtn" class="avatar-select-btn" type="button">⚔️</button>
        <div class="name-input-box">
          <input type="text" id="studentName" value="たろう" placeholder="なまえ" maxlength="8">
        </div>
        <div class="avatar-picker-popover" id="avatarPicker">
          <span class="avatar-option" data-avatar="⚔️">⚔️</span>
          <span class="avatar-option" data-avatar="🧙‍♂️">🧙‍♂️</span>
          <span class="avatar-option" data-avatar="🏹">🏹</span>
          <span class="avatar-option" data-avatar="🥷">🥷</span>
          <span class="avatar-option" data-avatar="🐱">🐱</span>
          <span class="avatar-option" data-avatar="🐶">🐶</span>
          <span class="avatar-option" data-avatar="🤖">🤖</span>
        </div>
      </div>
      <div id="raidMsg" class="raid-msg"></div>
    </div>

    <div style="display:flex; align-items:center; gap:8px;">
      <div id="scoreBox"><span>せいかい</span><b id="scoreCorrect">0</b><span>/</span><span id="scoreTotal">0</span>もん</div>
      <button id="soundBtn" class="sound-btn" title="おと ON/OFF" type="button" aria-pressed="true">🔊</button>
    </div>
  </header>

  <section id="levelSelect" class="card">
    <!-- カテゴリー1: 九九の基本 -->
    <div class="level-category open">
      <button class="category-header" type="button">
        <span class="category-title">🌟 <strong>わり算の基本（九九のぎゃく算）</strong></span>
        <span class="category-arrow">▼</span>
      </button>
      <div class="category-content">
        <button class="level-btn lv1" data-level="1">
          <span class="badge">1</span>
          <span class="txt">
            <strong>レベル１　わりきれる もんだい</strong>
            <span>こたえ 1〜10。ヒントで九九のしきを見てみよう</span>
          </span>
        </button>
        <button class="level-btn lv2" data-level="2">
          <span class="badge">2</span>
          <span class="txt">
            <strong>レベル２　あまりの ある もんだい</strong>
            <span>こたえは 1〜9とあまり。九九のリストからヒントを出すよ</span>
          </span>
        </button>
      </div>
    </div>

    <!-- カテゴリー2: 何十・何百 -->
    <div class="level-category open">
      <button class="category-header" type="button">

<script>
(function(){
  "use strict";

  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, txt){
    var e = document.createElementNS(SVGNS, tag);
    if(attrs){
      for(var k in attrs){
        if(attrs[k] === null || attrs[k] === undefined || attrs[k] === "") continue;
        e.setAttribute(k, attrs[k]);
      }
    }
    if(txt !== undefined){ e.textContent = txt; }
    return e;
  }
  function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  // ------------------------------------------------------------------
  // state
  // ------------------------------------------------------------------
  var state = {
    level: null,
    problem: null,
    hintStage: 0,
    maxHint: 0,
    inputDigits: "",      // quotient digits typed by the child (level1) or "active field" digits
    inputRemainder: "",   // level2 remainder digits
    activeField: "q",     // 'q' or 'r' for level2
    answered: false,
    isWrongState: false,
    lastKey: null,
    score: { correct: 0, total: 0 },
    streak: 0,
    avatar: "⚔️"
  };

  // ------------------------------------------------------------------
  // sound effects (Web Audio API)
  // ------------------------------------------------------------------
  var soundEnabled = true;
  try {
    var savedSound = localStorage.getItem("warizan_sound_enabled");
    if (savedSound !== null) soundEnabled = (savedSound === "1");
  } catch(e){}

  var soundBtn = document.getElementById("soundBtn");
  var audioCtx = null;

  function initAudio(){
    if(!audioCtx){
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if(AudioContextClass) audioCtx = new AudioContextClass();
    }
  }

  function updateSoundButtonUI(){
    if(!soundBtn) return;
    soundBtn.classList.toggle("sound-off", !soundEnabled);
    soundBtn.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
    soundBtn.title = soundEnabled ? "おと ON（タップでOFF）" : "おと OFF（タップでON）";
    soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
  }

  function toggleSound(){
    soundEnabled = !soundEnabled;
    try { localStorage.setItem("warizan_sound_enabled", soundEnabled ? "1" : "0"); } catch(e){}
    updateSoundButtonUI();
    if(soundEnabled){
      initAudio();
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
      playSound('click');
    }
  }

  if(soundBtn){
    soundBtn.addEventListener("click", toggleSound);
    updateSoundButtonUI();
  }

  function unlockAudio(){
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().catch(function(){});
    }
    document.removeEventListener("pointerdown", unlockAudio);
    document.removeEventListener("keydown", unlockAudio);
  }
  document.addEventListener("pointerdown", unlockAudio);
  document.addEventListener("keydown", unlockAudio);

  function playSound(type){
    if(!soundEnabled) return;
    try {
      initAudio();
      if(!audioCtx) return;
      if(audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
      var now = audioCtx.currentTime;

      if(type === 'click'){
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
        g.gain.setValueAtTime(0.08, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.06);
      } else if(type === 'switch'){
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
        g.gain.setValueAtTime(0.07, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.07);
      } else if(type === 'step'){
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.07);
        g.gain.setValueAtTime(0.06, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } else if(type === 'correct'){
        [880, 1320].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          var st = now + i * 0.12;
          g.gain.setValueAtTime(0.12, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.38);
        });
      } else if(type === 'wrong'){
        [220, 200].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = f;
          var st = now + i * 0.14;
          g.gain.setValueAtTime(0.08, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.18);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.2);
        });
      } else if(type === 'critical'){
        [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = f;
          var st = now + i * 0.08;
          g.gain.setValueAtTime(0.12, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.28);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.3);
        });
      }
    } catch(e){}
  }

  var svg = document.getElementById("stageSvg");
  var hintDots = document.getElementById("hintDots");
  var hintNextBtn = document.getElementById("hintNextBtn");
  var hintBackBtn = document.getElementById("hintBackBtn");
  var answerDisplay = document.getElementById("answerDisplay");
  var keypad = document.getElementById("keypad");
  var submitBtn = document.getElementById("submitBtn");
  var feedback = document.getElementById("feedback");
  var nextProblemBtn = document.getElementById("nextProblemBtn");
  var scoreBox = document.getElementById("scoreBox");

  // Raid Boss UI elements
  var studentRaidCodeInput = document.getElementById("studentRaidCode");
  var connectBtn = document.getElementById("connectBtn");
  var connStatus = document.getElementById("connStatus");
  var bossMiniStatus = document.getElementById("bossMiniStatus");
  var miniBossName = document.getElementById("miniBossName");
  var miniBossHp = document.getElementById("miniBossHp");
  var streakBadge = document.getElementById("streakBadge");
  var streakCountEl = document.getElementById("streakCount");
  var avatarBtn = document.getElementById("avatarBtn");
  var avatarPicker = document.getElementById("avatarPicker");
  var studentNameInput = document.getElementById("studentName");

  // ------------------------------------------------------------------
  // Firebase & Raid Boss Logic
  // ------------------------------------------------------------------
  var db = null;
  var authPromise = null;
  try {
    var firebaseConfig = {
      apiKey: "AIzaSyDdqalOwQFkZnNvFCKzXqM4VeP4IBPhzXo",
      authDomain: "raid-boss-project.firebaseapp.com",
      databaseURL: "https://raid-boss-project-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "raid-boss-project",
      storageBucket: "raid-boss-project.firebasestorage.app",
      messagingSenderId: "195656323635",
      appId: "1:195656323635:web:ca2dd1251af61929080946",
      measurementId: "G-6VBWZVLKLK"
    };
    if (typeof firebase !== 'undefined' && firebase.initializeApp) {
      if (!firebase.apps || !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
      authPromise = firebase.auth().signInAnonymously().catch(function(err){
        console.error("匿名認証エラー:", err);
        return null;
      });
    }
  } catch (err) {
    console.error("Firebase初期化エラー:", err);
  }

  var currentRaidCode = "";
  var studentRoomRef = null;
  var currentRoomListener = null;

  function normalizeCode(str){
    if(!str) return "";
    // convert full-width alphanumeric to half-width and uppercase
    return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s){
      return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    }).trim().toUpperCase();
  }

  var raidMsgEl = document.getElementById("raidMsg");
  var raidMsgTimer = null;
  function showRaidMsg(txt, type){
    if(!raidMsgEl) return;
    clearTimeout(raidMsgTimer);
    raidMsgEl.textContent = txt;
    raidMsgEl.className = "raid-msg show " + (type || "");
    raidMsgTimer = setTimeout(function(){
      raidMsgEl.classList.remove("show");
    }, 3500);
  }

  function updateConnStatus(status, tooltip){
    if(!connStatus) return;
    connStatus.title = tooltip;
    if(status === "connected"){
      connStatus.textContent = "🟢";
      if(connectBtn) connectBtn.textContent = "接続中";
      if(bossMiniStatus) bossMiniStatus.classList.add("show");
    } else if(status === "connecting"){
      connStatus.textContent = "🟡";
      if(connectBtn) connectBtn.textContent = "確認中...";
      if(bossMiniStatus) bossMiniStatus.classList.remove("show");
    } else if(status === "error"){
      connStatus.textContent = "🔴";
      if(connectBtn) connectBtn.textContent = "接続";
      if(bossMiniStatus) bossMiniStatus.classList.remove("show");
    } else {
      connStatus.textContent = "⚪";
      if(connectBtn) connectBtn.textContent = "接続";
      if(bossMiniStatus) bossMiniStatus.classList.remove("show");
    }
  }

  async function connectToRaid(code, isAuto){
    var cleanCode = normalizeCode(code);
    if(studentRaidCodeInput) studentRaidCodeInput.value = cleanCode;

    if(!cleanCode){
      currentRaidCode = "";
      if(studentRoomRef && currentRoomListener){
        studentRoomRef.off("value", currentRoomListener);
      }
      studentRoomRef = null;
      updateConnStatus("none", "レイドコード未入力");
      updateStreakUI();
      if(!isAuto) showRaidMsg("⚠️ レイドコードを入力してください", "warn");
      return;
    }

    if(!db){
      updateConnStatus("error", "Firebaseが初期化されていません");
      showRaidMsg("⚠️ Firebaseの接続に失敗しました", "error");
      return;
    }

    updateConnStatus("connecting", "接続確認中: ルーム " + cleanCode);
    if(!isAuto) showRaidMsg("🔍 ルーム「" + cleanCode + "」を確認中...", "warn");

    if(authPromise){
      await authPromise;
    }

    currentRaidCode = cleanCode;
    try { localStorage.setItem("raid_boss_student_code", cleanCode); } catch(e){}

    if(studentRoomRef && currentRoomListener){
      studentRoomRef.off("value", currentRoomListener);
    }

    studentRoomRef = db.ref("rooms/" + cleanCode);
    var firstLoad = true;
    currentRoomListener = function(snapshot){
      var data = snapshot.val();
      var now = Date.now();

      if(!data || !data.boss || (data.expiresAt && data.expiresAt < now)){
        updateConnStatus("error", "レイドコードが見つからないか、期限切れです");
        showRaidMsg("⚠️ ルーム「" + cleanCode + "」が見つからないか期限切れです", "error");
        return;
      }

      updateConnStatus("connected", "接続中: ルーム " + cleanCode);
      var bossName = data.boss.name || "ボス";
      if(firstLoad){
        showRaidMsg("✅ ボス「" + bossName + "」に接続しました！", "good");
        firstLoad = false;
      }

      if(miniBossName) miniBossName.textContent = bossName;
      if(miniBossHp){
        var cur = Math.max(0, data.boss.currentHp !== undefined ? data.boss.currentHp : (data.boss.maxHp || 0));
        miniBossHp.textContent = "(" + cur + "/" + (data.boss.maxHp || "?") + ")";
      }
    };

    studentRoomRef.on("value", currentRoomListener, function(err){
      console.error("Firebase Room Listener Error:", err);
      updateConnStatus("error", "通信エラー: " + (err.message || "権限がありません"));
      showRaidMsg("⚠️ 通信エラーが発生しました", "error");
    });
  }

  function applyStudentRaidCode(){
    var code = studentRaidCodeInput ? studentRaidCodeInput.value : "";
    connectToRaid(code, false);
  }

  function isRaidConnected(){
    return !!(db && studentRoomRef && currentRaidCode && connStatus && connStatus.textContent === "🟢");
  }

  function updateStreakUI(){
    if(!streakBadge || !streakCountEl) return;
    streakCountEl.textContent = state.streak;
    if(isRaidConnected() && state.streak > 0){
      streakBadge.classList.add("show");
    } else {
      streakBadge.classList.remove("show");
    }
  }

  function sendAttack(damage, detail){
    if(!db || !studentRoomRef || !currentRaidCode){
      return false; // local only
    }

    var name = (studentNameInput && studentNameInput.value.trim()) ? studentNameInput.value.trim() : "ななし";
    try { localStorage.setItem("raid_boss_student_name", name); } catch(e){}

    studentRoomRef.child("boss/currentHp").transaction(function(currentHp){
      return (currentHp || 0) - damage;
    });

    studentRoomRef.child("logs").push({
      avatar: state.avatar,
      name: name,
      damage: damage,
      detail: detail,
      timestamp: Date.now()
    });

    return true;
  }

  function initRaidUI(){
    if(connectBtn){
      connectBtn.addEventListener("click", applyStudentRaidCode);
    }
    if(studentRaidCodeInput){
      studentRaidCodeInput.addEventListener("keydown", function(e){
        if(e.key === "Enter") applyStudentRaidCode();
      });
    }
    if(avatarBtn && avatarPicker){
      avatarBtn.addEventListener("click", function(e){
        e.stopPropagation();
        avatarPicker.classList.toggle("show");
      });
      avatarPicker.querySelectorAll(".avatar-option").forEach(function(opt){
        opt.addEventListener("click", function(e){
          e.stopPropagation();
          var av = opt.getAttribute("data-avatar");
          if(av){
            state.avatar = av;
            avatarBtn.textContent = av;
            try { localStorage.setItem("raid_boss_student_avatar", av); } catch(err){}
          }
          avatarPicker.classList.remove("show");
        });
      });
      document.addEventListener("click", function(e){
        if(!avatarPicker.contains(e.target) && e.target !== avatarBtn){
          avatarPicker.classList.remove("show");
        }
      });
    }

    // Restore saved settings
    try {
      var savedName = localStorage.getItem("raid_boss_student_name");
      if(savedName && studentNameInput) studentNameInput.value = savedName;

      var savedAvatar = localStorage.getItem("raid_boss_student_avatar");
      if(savedAvatar){
        state.avatar = savedAvatar;
        if(avatarBtn) avatarBtn.textContent = savedAvatar;
      }

      // レイドコードは初期状態では空欄で未接続（URLパラメータ ?code=XXXX が明示された場合のみ接続）
      var urlParams = new URLSearchParams(window.location.search);
      var codeParam = urlParams.get("code");
      var initialCode = (codeParam && codeParam.trim()) ? codeParam.trim() : "";
      if(studentRaidCodeInput) studentRaidCodeInput.value = initialCode;
      if(initialCode){
        connectToRaid(initialCode, true);
      } else {
        updateConnStatus("none", "コードを入力して接続してください");
      }
    } catch(e){}
  }

  // ------------------------------------------------------------------
  // problem generation
  // ------------------------------------------------------------------
  // ------------------------------------------------------------------
  // problem generation (Levels 1 to 6-3)
  // ------------------------------------------------------------------
  function genLevel1(prevKey){
    var problem, key, tries = 0;
    do{
      var divisor = rand(1,9);
      var quotient = rand(1,10);
      problem = {
        level: "1", divisor: divisor, quotient: quotient, remainder: 0,
        hasRemainder: false, targetQuotientDigits: quotient === 10 ? 2 : 1,
        dividend: divisor * quotient,
        title: "レベル1　わりきれる もんだい"
      };
      key = divisor + "-" + quotient;
      tries++;
    } while(key === prevKey && tries < 20);
    return problem;
  }

  function genLevel2(prevKey){
    var problem, key, tries = 0;
    do{
      var divisor = rand(2,9);
      var quotient = rand(1,9);
      var remainder = rand(1, divisor-1);
      problem = {
        level: "2", divisor: divisor, quotient: quotient, remainder: remainder,
        hasRemainder: true, targetQuotientDigits: 1,
