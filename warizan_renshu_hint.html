  function parseNumberMeta(numStr) {
    var dotIdx = numStr.indexOf('.');
    if (dotIdx === -1) {
      return { digits: numStr, dotAfter: numStr.length, hasDot: false, decimalPlaces: 0 };
    } else {
      return { digits: numStr.replace('.', ''), dotAfter: dotIdx, hasDot: true, decimalPlaces: numStr.length - 1 - dotIdx };
    }
  }

  function shouldSuppressDroppedZero(currentRemainder, nextDigit, hasNextDigit) {
    return hasNextDigit && currentRemainder === 0 && nextDigit === "0";
  }

  function buildMultiplyWriteCells(prodCells, row, targetCol, currentDvdPartCells, maxDropCol, totalCols) {
    var result = prodCells.map(function(cell){
      return Object.assign({}, cell, { borderBottom: true });
    });

    var startCol = targetCol;
    result.forEach(function(c){
      if (c.c < startCol) startCol = c.c;
    });
    if (currentDvdPartCells && currentDvdPartCells.length > 0) {
      currentDvdPartCells.forEach(function(c){
        if (c.c < startCol) startCol = c.c;
      });
    }

    var endCol = Math.max(targetCol, maxDropCol || targetCol);
    result.forEach(function(c){
      if (c.c > endCol) endCol = c.c;
    });
    if (currentDvdPartCells && currentDvdPartCells.length > 0) {
      currentDvdPartCells.forEach(function(c){
        if (c.c > endCol) endCol = c.c;
      });
    }

    for (var col = startCol; col <= endCol; col++) {
      var exists = result.some(function(c){ return c.c === col; });
      if (!exists) {
        result.push({
          r: row,
          c: col,
          char: "",
          borderBottom: true,
          isLineExtend: true
        });
      }
    }

    return result;
  }

  function makeHighlight(color, refCells, newCells) {
    var seen = new Map();
    (refCells || []).forEach(function(cell){
      if (!cell) return;
      seen.set(cell.r + "-" + cell.c, { r: cell.r, c: cell.c, color: color, isNew: false });
    });
    (newCells || []).forEach(function(cell){
      if (!cell) return;
      seen.set(cell.r + "-" + cell.c, { r: cell.r, c: cell.c, color: color, isNew: true });
    });
    return Array.from(seen.values());
  }

  var HL_FORMULA_COLOR = {
    blue: "#1d4ed8",
    green: "#15803d",
    red: "#b91c1c",
    orange: "#c2410c"
  };
  function formulaHtml(color, text) {
    var safeText = String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    var hex = HL_FORMULA_COLOR[color] || "#0f172a";
    return '<div style="margin-top:4px;font-weight:900;color:' + hex + ';font-size:15px;letter-spacing:0.02em;">' + safeText + '</div>';
  }

  function buildVerticalMultiplicationHtml(divisorInt, multiplierInt, productInt, titleText, options) {
    options = options || {};
    var topStr = String(divisorInt);
    var bottomStr = String(multiplierInt);
    var productStr = String(productInt);
    var width = Math.max(topStr.length, bottomStr.length + 1, productStr.length);

    var line1 = topStr.padStart(width, " ");
    var line2 = "×" + bottomStr.padStart(width - 1, " ");
    var line3 = "―".repeat(width);
    var line4 = productStr.padStart(width, " ");

    var wrongOverlay = options.wrong
      ? '<div style="position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center;">' +
        '<div style="position:absolute; width:92%; height:3px; background:#dc2626; transform:rotate(-18deg);"></div>' +
        '<div style="position:absolute; width:92%; height:3px; background:#dc2626; transform:rotate(18deg);"></div>' +
        '<div style="position:absolute; left:8px; top:4px; font-size:40px; font-weight:900; color:#dc2626; line-height:1;">✕</div>' +
        '</div>'
      : "";

    var borderStyle = options.wrong
      ? "border:2px solid #fca5a5;background:#fff1f2;"
      : "border:1px solid #fed7aa;background:#fff7ed;";

    return '<div style="position:relative;margin-top:6px;' + borderStyle + 'border-radius:8px;padding:6px 10px;">' +
      wrongOverlay +
      '<div style="font-size:12px;font-weight:800;color:#c2410c;margin-bottom:4px;">' + titleText + '</div>' +
      '<div style="font-family:\'Courier New\', monospace;font-size:18px;line-height:1.15;color:#0f172a;white-space:pre;text-align:right;padding-right:2px;">\n' +
      line1 + '\n' + line2 + '\n' + line3 + '\n' + line4 + '\n' +
      '</div></div>';
  }

  function generateBrainWorkHtml(currentTargetValue, divisorInt, trialQuotient) {
    if (currentTargetValue === 0 || currentTargetValue < divisorInt) return "";
    var trueQuotient = Math.floor(currentTargetValue / divisorInt);

    if (divisorInt < 10) {
      var p = divisorInt * trueQuotient;
      return '<div style="font-size:13px;color:#334155;">' +
        '<b>💡 ひらめき九九メモ</b>' +
        '<div style="margin-top:4px;background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:4px 8px;line-height:1.6;">' +
        '<b style="color:#15803d;">' + divisorInt + ' × ' + trueQuotient + ' ＝ ' + p + '</b>（' + currentTargetValue + ' をこえない一番近い数）' +
        '</div></div>';
    }

    var divisorStr = divisorInt.toString();
    var d1 = parseInt(divisorStr[0], 10);
    var topLen = divisorStr.length;
    var topVal = Math.floor(currentTargetValue / Math.pow(10, topLen - 1));
    var displayTrial = (trialQuotient !== undefined) ? trialQuotient : trueQuotient;
    var trialProduct = divisorInt * displayTrial;

    var html = '<div style="font-size:13px;color:#334155;">' +
      '<b>🔍 仮商を見つけよう！</b>' +
      '<div style="margin-top:6px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:6px 10px;line-height:1.6;">' +
      '<div style="color:#0369a1;">わる数 <b>' + divisorInt + '</b> の上1けた ➜ <b>' + d1 + '</b></div>' +
      '<div style="color:#0369a1;">わられる数 <b>' + currentTargetValue + '</b> の上' + topLen + 'けた ➜ <b>' + topVal + '</b></div>' +
      '<div style="margin-top:3px;color:#334155;"><b>' + topVal + ' ÷ ' + d1 + '</b> で見当をつける ➜ 仮の商 <b style="color:#f97316;">' + displayTrial + '</b></div>' +
      '</div>';
    html += buildVerticalMultiplicationHtml(divisorInt, displayTrial, trialProduct, "商の筆算");
    html += '</div>';
    return html;
  }

  var AdvancedDivisionEngine = {
    generateSteps: function(dividendStr, divisorStr, route) {
      var divParse = parseNumberMeta(divisorStr);
      var dvdParse = parseNumberMeta(dividendStr);
      var D = divParse.decimalPlaces;

      var baseDvdDigits = dvdParse.digits;
      var finalDvdDotAfter = dvdParse.dotAfter + D;
      if (finalDvdDotAfter > baseDvdDigits.length) {
        baseDvdDigits += "0".repeat(finalDvdDotAfter - baseDvdDigits.length);
      }

      var divisorInt = parseInt(divParse.digits, 10);
      var dvdDigits = baseDvdDigits;
      var M = divParse.digits.length;
      var N = dvdDigits.length;

      var divisorCells = [];
      for (var j = 0; j < M; j++) divisorCells.push({ r: 1, c: j });

      var steps = [];
      var initialCells = [];

      for(var j = 0; j < M; j++) initialCells.push({ r: 1, c: j, char: divParse.digits[j] });
      for(var j = 0; j < dvdParse.digits.length; j++) initialCells.push({ r: 1, c: M + j, char: dvdParse.digits[j] });

      var currentMaskFromCol = null;

      steps.push({
        phase: "init",
        description: "まずは筆算の形に数字を書きましょう。",
        writeCells: [], maskFromCol: currentMaskFromCol, pulseBoxes: []
      });

      var currentRemainder = 0;
      var currentDividendStr = "";
      var currentRow = 2;
      var hasFirstQuotientStarted = false;
      var quotientPositions = Array(N).fill("");
      var skippedCols = [];
      var prevRemainderCells = [];
      var nextDigitCellOverride = null;
      var justBuiltZero = false;

      for (var i = 0; i < N; i++) {
        var currentDigit = dvdDigits[i];
        currentDividendStr = (currentRemainder === 0) ? currentDigit : (currentRemainder.toString() + currentDigit);
        var currentTargetValue = parseInt(currentDividendStr, 10);
        var targetCol = M + i;

        var currentNewDigitCell = (i === 0) ? { r: 1, c: targetCol } : (nextDigitCellOverride || { r: 1, c: targetCol });
        var currentDvdPartCells = hasFirstQuotientStarted
          ? prevRemainderCells.concat([currentNewDigitCell])
          : Array.from({ length: targetCol - M + 1 }, function(_, j){ return { r: 1, c: M + j }; });

        var preTrialQ = undefined;
        if (divisorInt >= 10) {
          var _d1 = parseInt(divParse.digits[0], 10);
          var _topVal = Math.floor(currentTargetValue / Math.pow(10, divParse.digits.length - 1));
          var _trial = Math.min(9, Math.floor(_topVal / _d1));
          var _true  = Math.floor(currentTargetValue / divisorInt);
          preTrialQ = (_trial > _true) ? _trial : _true;
        }
        var brainHtml = generateBrainWorkHtml(currentTargetValue, divisorInt, preTrialQ);
        currentMaskFromCol = targetCol + 1;

        var canStand = (currentTargetValue >= divisorInt);

        if (divisorInt < 10) {
          steps.push({
            phase: "hide",
            description: "【ひらめき九九チェック】" + divisorInt + " のだんの九九で、" + currentTargetValue + " をこえない一番近い数をみつけよう！",
            maskFromCol: currentMaskFromCol, brainHtml: brainHtml, pulseBoxes: [],
            highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), []),
            formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ ？")
          });
        } else {
          steps.push({
            phase: "hide",
            description: canStand
              ? "【商が立つかな？】" + currentTargetValue + " の中に " + divisorInt + " はあるかな？ → あるね！ 商には何が立つかな？"
              : "【商が立つかな？】" + currentTargetValue + " の中に " + divisorInt + " はあるかな？ → ないね！ 商は立ちません。",
            maskFromCol: currentMaskFromCol, brainHtml: brainHtml, pulseBoxes: [],
            highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), []),
            formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ ？")
          });
        }

        if (currentTargetValue < divisorInt) {
          if (!hasFirstQuotientStarted) {
            skippedCols.push(targetCol);
            steps.push({
              phase: "skip",
              description: "商は立ちません。次の桁をいっしょに見ます。",
              writeCells: [{ r: 0, c: targetCol, char: "✕", isGuide: true }],
              maskFromCol: currentMaskFromCol, pulseBoxes: [],
              highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), [{ r: 0, c: targetCol }]),
              formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ 0（商は立たない）")
            });
            currentRemainder = currentTargetValue;
          } else {
            quotientPositions[i] = "0";
            steps.push({
              phase: "build-zero",
              description: "【たてる】商に「0」を書きます。",
              writeCells: [{ r: 0, c: targetCol, char: "0", isGuide: false }],
              pulseBoxes: [{ r: 0, c: targetCol }], maskFromCol: currentMaskFromCol,
              highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), [{ r: 0, c: targetCol }]),
              formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ 0")
            });
            currentRemainder = currentTargetValue;
            prevRemainderCells = currentDvdPartCells.slice();
            justBuiltZero = true;
          }
        } else {
          hasFirstQuotientStarted = true;
          var q = Math.floor(currentTargetValue / divisorInt);
          quotientPositions[i] = q.toString();

          steps.push({
            phase: "build",
            description: "【たてる】商に " + q + " を書きます。",
            writeCells: [{ r: 0, c: targetCol, char: q.toString(), isGuide: false }],
            pulseBoxes: [{ r: 0, c: targetCol }], maskFromCol: currentMaskFromCol,
            highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), [{ r: 0, c: targetCol }]),
            formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ " + q)
          });

          var product = q * divisorInt;
          var prodStr = product.toString();
          var prodCells = [];
          for (var k = 0; k < prodStr.length; k++) {
            prodCells.push({
              r: currentRow,
              c: targetCol - prodStr.length + 1 + k,
              char: prodStr[k]
            });
          }
          var rem = currentTargetValue - product;
          var nextDropCol = targetCol;
          if (i < N - 1) {
            var lookRem = rem;
            var lookIdx = i + 1;
            while (lookIdx < N - 1) {
              var lookVal = lookRem * 10 + parseInt(dvdDigits[lookIdx], 10);
              if (lookVal < divisorInt) {
                lookRem = lookVal;
                lookIdx++;
              } else {
                break;
              }
            }
            nextDropCol = M + lookIdx;
          }
          var extendedProdCells = buildMultiplyWriteCells(prodCells, currentRow, targetCol, currentDvdPartCells, nextDropCol, M + N);

          steps.push({
            phase: "multiply",
            description: "【かける】わる数 " + divisorInt + " × たてた商 " + q + " ＝ " + product + " を書きます。",
            writeCells: extendedProdCells,
            maskFromCol: currentMaskFromCol,
            highlightCells: makeHighlight("green", divisorCells.concat([{ r: 0, c: targetCol }]), prodCells),
            formulaHtml: formulaHtml("green", divisorInt + " × " + q + " ＝ " + product)
          });
          currentRow++;
          var remStr = rem.toString();
          var isLastDigit = (i === N - 1);
          var shouldWriteIntermediateZero = !(rem === 0 && !isLastDigit);
          var diffCells = [];
          if (shouldWriteIntermediateZero) {
            for (var k = 0; k < remStr.length; k++) {
              diffCells.push({
                r: currentRow,
                c: targetCol - remStr.length + 1 + k,
                char: remStr[k]
              });
            }
          }

          var subDesc = shouldWriteIntermediateZero
            ? ("【ひく】" + currentTargetValue + " － " + product + " ＝ " + rem + " を書きます。")
            : ("【ひく】" + currentTargetValue + " － " + product + " ＝ 0 ですが、次におろす数があるので「0」は書きません。");

          steps.push({
            phase: "subtract",
            description: subDesc,
            writeCells: diffCells,
            maskFromCol: currentMaskFromCol,
            highlightCells: makeHighlight("red", currentDvdPartCells.concat(prodCells), diffCells),
            formulaHtml: formulaHtml("red", currentTargetValue + " － " + product + " ＝ " + rem)
          });

          currentRemainder = rem;
          prevRemainderCells = shouldWriteIntermediateZero ? diffCells.slice() : [];
          nextDigitCellOverride = null;
          justBuiltZero = false;
        }

        // 次の桁をおろす（商がまだ立っていない場合はおろさず、ずらして次の桁を見る）
        if (hasFirstQuotientStarted && i < N - 1) {
          var nextDigit = dvdDigits[i + 1];
          var nextCol = targetCol + 1;
          var isSuppressDroppedZero = shouldSuppressDroppedZero(currentRemainder, nextDigit, (i + 1) < (N - 1));

          if (!isSuppressDroppedZero) {
            var dropRow = (justBuiltZero && prevRemainderCells && prevRemainderCells.length > 0)
              ? prevRemainderCells[prevRemainderCells.length - 1].r
              : currentRow;

            steps.push({
              phase: "drop",
              description: "【おろす】となりの「" + nextDigit + "」をまっすぐ下におろします。",
              writeCells: [{ r: dropRow, c: nextCol, char: nextDigit }],
              maskFromCol: nextCol + 1,
              highlightCells: makeHighlight("orange", [{ r: 1, c: nextCol }], [{ r: dropRow, c: nextCol }]),
              formulaHtml: formulaHtml("orange", "「" + nextDigit + "」をおろす")
            });
            nextDigitCellOverride = { r: dropRow, c: nextCol };
            if (!justBuiltZero) {
              currentRow++;
            }
          } else {
            nextDigitCellOverride = null;
          }
        }
      }

      // 未使用の ✕ をクリア
      skippedCols.forEach(function(col){
        steps[steps.length - 1].writeCells.push({ r: 0, c: col, char: "", isGuide: false });
      });

      var finalQuotientStr = quotientPositions.filter(function(c){ return c !== "" && c !== "✕"; }).join("") || "0";
      var finalRemainderStr = currentRemainder.toString();

      steps.push({
        phase: "complete",
        description: "【完成！】商は " + finalQuotientStr + (currentRemainder > 0 ? "、あまりは " + finalRemainderStr : "（わりきれました）") + " です！",
        writeCells: [],
        maskFromCol: null,
        pulseBoxes: []
      });

      return { initialCells: initialCells, steps: steps, totalRows: currentRow + 2, totalCols: M + N, M: M, N: N };
    }
  };

  // ==================================================================
  // 筆算UIコントローラー (HissanSim)
  // ==================================================================
  var HissanSim = {
    appState: null,
    currentStepIdx: 0,
    gridData: [],

    initSimulation: function(dividendStr, divisorStr) {
      this.appState = AdvancedDivisionEngine.generateSteps(dividendStr, divisorStr, "remainder");
      this.currentStepIdx = 0;
      this.initGridData();
      this.renderGridStructure();
      this.applyStepUI(true);
    },

    initGridData: function() {
      if(!this.appState) return;
      this.gridData = [];
      for (var r = 0; r < this.appState.totalRows; r++) {
        var rowArr = [];
        for (var c = 0; c < this.appState.totalCols; c++) {
          rowArr.push({
            char: "", isGuide: false, borderTop: false, borderBottom: false,
            isDropping: false, dropDistance: 0, hasSlash: false, topChar: "", isRedBorder: false
          });
        }
        this.gridData.push(rowArr);
      }

      var self = this;
      this.appState.initialCells.forEach(function(ic){
        if(self.gridData[ic.r] && self.gridData[ic.r][ic.c]){
          self.gridData[ic.r][ic.c].char = ic.char;
        }
      });

      // 割られる数の上の横棒
      for (var c = this.appState.M; c < this.appState.totalCols; c++) {
        if(this.gridData[1] && this.gridData[1][c]){
          this.gridData[1][c].borderTop = true;
        }
      }
    },

    renderGridStructure: function() {
      var gridEl = document.getElementById('hissan-division-grid');
      if(!gridEl || !this.appState) return;
      gridEl.innerHTML = "";
      gridEl.style.gridTemplateColumns = "repeat(" + this.appState.totalCols + ", 42px)";

      for (var r = 0; r < this.appState.totalRows; r++) {
        for (var c = 0; c < this.appState.totalCols; c++) {
          var cellMeta = this.gridData[r][c];
          if (!cellMeta) continue;
          var cellDiv = document.createElement('div');
          cellDiv.classList.add('grid-cell');
          cellDiv.id = "cell-" + r + "-" + c;
          if (cellMeta.borderTop) cellDiv.classList.add('border-top-solid');
          if (cellMeta.borderBottom) cellDiv.classList.add('border-bottom-solid');
          if (cellMeta.isRedBorder) cellDiv.classList.add('red-border');

          var container = document.createElement('div');
          container.classList.add('cell-container');

          var topNum = document.createElement('div');
          topNum.classList.add('top-num');
          topNum.innerText = cellMeta.topChar || "";

          var mainNum = document.createElement('div');
          mainNum.classList.add('main-num');

          if (cellMeta.isDropping) {
            mainNum.classList.add('digit-dropping');
            mainNum.style.setProperty('--drop-start-y', "-" + cellMeta.dropDistance + "px");
          }

          if (cellMeta.isGuide) {
            mainNum.innerHTML = '<span class="gray-guide">✕</span>';
          } else {
            mainNum.innerText = cellMeta.char;
          }

          var slash = document.createElement('div');
          slash.classList.add('slash-line');
          if (cellMeta.hasSlash) slash.style.display = "block";

          container.appendChild(topNum);
          container.appendChild(mainNum);
          container.appendChild(slash);
          cellDiv.appendChild(container);
          gridEl.appendChild(cellDiv);
        }
      }
    },

    clearSvg: function() {
      var svg = document.getElementById('hissan-hint-svg');
      if(!svg) return;
      svg.innerHTML = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2196f3"/></marker></defs>';
    },

    drawDropArrow: function(fromR, fromC, toR, toC) {
      var svg = document.getElementById('hissan-hint-svg');
      var container = document.getElementById('hissan-notebook-container');
      if(!svg || !container) return;
      var containerRect = container.getBoundingClientRect();

      var fromCell = document.getElementById("cell-" + fromR + "-" + fromC);
      var toCell = document.getElementById("cell-" + toR + "-" + toC);
      if (!fromCell || !toCell) return;

      var fromRect = fromCell.getBoundingClientRect();
      var toRect = toCell.getBoundingClientRect();

      var x = (fromRect.left + fromRect.right) / 2 - containerRect.left;
      var yStart = fromRect.bottom - containerRect.top - 4;
      var yEnd = toRect.top - containerRect.top + 2;

      var line = document.createElementNS(SVGNS, "line");
      line.setAttribute("x1", x);
      line.setAttribute("y1", yStart);
      line.setAttribute("x2", x);
      line.setAttribute("y2", yEnd);
      line.setAttribute("stroke", "#2196f3");
      line.setAttribute("stroke-width", "2.5");
      line.setAttribute("stroke-dasharray", "4,3");
      line.setAttribute("marker-end", "url(#arrow)");
      svg.appendChild(line);
    },

    clearAllHighlightClasses: function() {
      document.querySelectorAll('#hissan-division-grid .grid-cell').forEach(function(el){
        el.classList.remove(
          'active-target',
          'hl-ref-blue', 'hl-ref-green', 'hl-ref-red', 'hl-ref-orange',
          'hl-new-blue', 'hl-new-green', 'hl-new-red', 'hl-new-orange'
        );
      });
    },

    drawDivisionCurve: function() {
      var svg = document.getElementById('hissan-hint-svg');
      var container = document.getElementById('hissan-notebook-container');
      if(!svg || !container || !this.appState) return;

      var targetCell = document.getElementById("cell-1-" + this.appState.M);
      if (!targetCell) return;

      var containerRect = container.getBoundingClientRect();
      var cellRect = targetCell.getBoundingClientRect();
      var x = cellRect.left - containerRect.left;
      var yTop = cellRect.top - containerRect.top;
      var yBottom = cellRect.bottom - containerRect.top;

      // ★日本の正しい筆算円弧：割られる数の左側で右（内側）へ膨らむ曲線！
      var path = document.createElementNS(SVGNS, "path");
      path.setAttribute("d", "M " + x + " " + yTop + " Q " + (x + 12) + " " + ((yTop + yBottom)/2) + " " + x + " " + yBottom);
      path.setAttribute("stroke", "#1e293b");
      path.setAttribute("stroke-width", "3");
      path.setAttribute("fill", "none");
      svg.appendChild(path);
    },

    updateStepFlow: function(step) {
      var panel = document.getElementById('hissanStepPanel');
      var badge = document.getElementById('hissanStatusBadge');
      if(!panel || !badge) return;

      var phase = step.phase;
      var activeKey = "none";
      var bg = "rgba(255, 255, 255, 0.92)";
      var accent = "#64748b";
      var soft = "#ffffff";
      var label = "じゅんび";

      if (["build", "build-zero", "skip", "hide"].includes(phase)) {
        activeKey = "tateru";
        bg = "rgba(219, 234, 254, 0.85)";
        accent = "#2563eb";
        soft = "#eff6ff";
        label = "たてる";
      } else if (phase === "multiply") {
        activeKey = "kakeru";
        bg = "rgba(220, 252, 231, 0.85)";
        accent = "#16a34a";
        soft = "#f0fdf4";
        label = "かける";
      } else if (phase === "subtract") {
        activeKey = "hiku";
        bg = "rgba(254, 226, 226, 0.85)";
        accent = "#dc2626";
        soft = "#fff1f2";
        label = "ひく";
      } else if (phase === "drop") {
        activeKey = "orosu";
        bg = "rgba(255, 237, 213, 0.85)";
        accent = "#ea580c";
        soft = "#fff7ed";
        label = "おろす";
      } else if (phase === "complete") {
        activeKey = "none";
        bg = "rgba(255, 255, 255, 0.95)";
        accent = "#64748b";
        soft = "#ffffff";
        label = "完成！";
      }

      panel.classList.remove("phase-tateru", "phase-kakeru", "phase-hiku", "phase-orosu", "phase-neutral");
      panel.classList.add(activeKey === "none" ? "phase-neutral" : "phase-" + activeKey);
      panel.style.setProperty("--phase-accent", accent);
      panel.style.setProperty("--phase-soft", soft);
      badge.textContent = "いまの工程：" + label;

      panel.querySelectorAll(".step-node").forEach(function(node){
        node.classList.toggle("active", activeKey !== "none" && node.getAttribute("data-step") === activeKey);
      });
    },

    applyStepUI: function(renderDom) {
      if(!this.appState || this.appState.steps.length === 0) return;
      this.clearAllHighlightClasses();
      this.clearSvg();

      var fusen = document.getElementById('hissan-fusen');
      if(fusen) fusen.style.display = "none";

      for (var r = 0; r < this.appState.totalRows; r++) {
        for (var c = 0; c < this.appState.totalCols; c++) {
          if (this.gridData[r] && this.gridData[r][c]) {
            this.gridData[r][c].isDropping = false;
          }
        }
      }

      var step = this.appState.steps[this.currentStepIdx];
      if(!step) return;

      var narrationEl = document.getElementById('hissan-narration');
      if(narrationEl){
        var escapedDesc = String(step.description)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        narrationEl.innerHTML = escapedDesc + (step.formulaHtml || "");
      }

      this.updateStepFlow(step);

      var brainCard = document.getElementById('hissan-brain-work');
      if(brainCard){
        if (step.brainHtml) {
          brainCard.innerHTML = step.brainHtml;
          brainCard.style.display = "block";
        } else {
          brainCard.style.display = "none";
        }
      }

      var self = this;
      if (step.writeCells) {
        step.writeCells.forEach(function(wc){
          if (self.gridData[wc.r] && self.gridData[wc.r][wc.c]) {
            self.gridData[wc.r][wc.c].char = wc.char;
            self.gridData[wc.r][wc.c].isGuide = !!wc.isGuide;
            if (wc.borderBottom) self.gridData[wc.r][wc.c].borderBottom = true;
            if (step.phase === "drop" && wc.r > 1) {
              self.gridData[wc.r][wc.c].isDropping = true;
              self.gridData[wc.r][wc.c].dropDistance = (wc.r - 1) * 42;
            }
          }
        });
      }

      if(renderDom){
        this.renderGridStructure();

        requestAnimationFrame(function(){
          self.drawDivisionCurve();

          if (step.phase === "drop" && step.writeCells) {
            step.writeCells.forEach(function(wc){
              if (wc.r > 1) {
                self.drawDropArrow(1, wc.c, wc.r, wc.c);
              }
            });
          }

          if (step.maskFromCol !== null && step.maskFromCol < self.appState.totalCols && fusen) {
            var container = document.getElementById('hissan-notebook-container');
            var startCell = document.getElementById("cell-0-" + step.maskFromCol);
            var endCell = document.getElementById("cell-" + (self.appState.totalRows-1) + "-" + (self.appState.totalCols-1));
            if(container && startCell && endCell){
              var containerRect = container.getBoundingClientRect();
              var startRect = startCell.getBoundingClientRect();
              var endRect = endCell.getBoundingClientRect();
              fusen.style.left = (startRect.left - containerRect.left) + "px";
              fusen.style.top = (startRect.top - containerRect.top) + "px";
              fusen.style.width = (endRect.right - startRect.left) + "px";
              fusen.style.height = (endRect.bottom - startRect.top) + "px";
              fusen.style.display = "block";
            }
          }
        });

        if (step.highlightCells && step.highlightCells.length > 0) {
          step.highlightCells.forEach(function(hc){
            var target = document.getElementById("cell-" + hc.r + "-" + hc.c);
            if (!target) return;
            var cls = hc.isNew ? "hl-new-" + hc.color : "hl-ref-" + hc.color;
            target.classList.add(cls);
          });
        } else if (step.pulseBoxes && step.pulseBoxes.length > 0) {
          step.pulseBoxes.forEach(function(box){
            var target = document.getElementById("cell-" + box.r + "-" + box.c);
            if (target) target.classList.add('active-target');
          });
        }
      }
    },

    gotoStep: function(targetIdx) {
      if(!this.appState) return;
      var target = Math.max(0, Math.min(targetIdx, this.appState.steps.length - 1));
      this.initGridData();
      for(var s = 0; s <= target; s++){
        this.currentStepIdx = s;
        this.applyStepUI(s === target);
      }
    }
  };

  // ------------------------------------------------------------------
  // hint navigation
  // ------------------------------------------------------------------
  hintNextBtn.addEventListener("click", function(){
    if(state.hintStage >= state.maxHint || state.answered) return;
    playSound('step');
    state.hintStage++;
    renderAll(true);
  });
  hintBackBtn.addEventListener("click", function(){
    if(state.hintStage <= 0) return;
    playSound('step');
    state.hintStage--;
    renderAll(false);
  });

  // ------------------------------------------------------------------
  // answer checking (submitBtn fallback)
  // ------------------------------------------------------------------
  if(submitBtn){
    submitBtn.addEventListener("click", function(){
      checkCurrentAnswer();
    });
  }

  nextProblemBtn.addEventListener("click", function(){
    playSound('click');
    newProblem();
  });

  // ------------------------------------------------------------------
  // level select / navigation
  // ------------------------------------------------------------------
  document.querySelectorAll(".category-header").forEach(function(header){
    header.addEventListener("click", function(){
      playSound('click');
      var category = header.parentElement;
      category.classList.toggle("open");
    });
  });

  document.querySelectorAll("#levelSelect .level-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      playSound('click');
      state.level = btn.getAttribute("data-level");
      state.score = { correct:0, total:0 };
      scoreBox.classList.remove("show");
      document.getElementById("levelSelect").style.display = "none";
      document.getElementById("problemScreen").classList.add("show");
      lastKey = null;
      newProblem();
    });
  });

  document.getElementById("backToLevels").addEventListener("click", function(){
    playSound('click');
    document.getElementById("problemScreen").classList.remove("show");
    document.getElementById("levelSelect").style.display = "block";
    scoreBox.classList.remove("show");
  });

  window.addEventListener("resize", function(){
    if(state.problem && state.problem.isLongDivision && HissanSim.appState){
      HissanSim.applyStepUI(true);
    }
  });

  // Initialize Raid Boss UI
  initRaidUI();

  // Test hooks
  window.__warizan = {
    state: state,
    HissanSim: HissanSim,
    pressDigit: pressDigit,
    clearDigit: clearDigit,
    newProblem: newProblem,
    checkCurrentAnswer: checkCurrentAnswer
  };

})();
</script>
</body>
</html>
