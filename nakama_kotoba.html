<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>なかまに なる ことば</title>
<style>
:root{--bg:#fdf6e3;--ink:#33302a;--teal:#2c9a96;--tealbg:#e3f4f2;--org:#ef8a3a;--orgbg:#fff1d9;--ok:#2f9d57;--ng:#d6544f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic UI",Meiryo,sans-serif}
main{max-width:900px;margin:0 auto;padding:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:bold;font-size:1.2rem}
h1{margin:0;font-size:1.5rem;color:var(--teal)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #1a6fd1;outline-offset:2px}
.card{background:#fff;border:3px solid var(--teal);border-radius:22px;padding:18px;margin:12px 0;text-align:center}
.q{font-size:1.35rem;font-weight:bold;margin-bottom:12px}
.set{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.t{min-width:130px;padding:16px 12px;border-radius:16px;background:var(--tealbg);border:3px solid var(--teal);font-size:2.1rem;font-weight:bold}
.t.m{background:var(--orgbg);border:3px dashed var(--org);color:var(--org)}
.t.m.on{border-style:solid;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{padding:20px 8px;font-size:2.1rem;font-weight:bold;border-radius:18px;border:3px solid var(--teal);background:#fff;color:var(--ink)}
.c:hover:not(:disabled){background:var(--tealbg)}
.c.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.c.ng{background:#eee;border-color:#ccc;color:#999;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:3em;margin:12px 0;font-size:1.3rem;font-weight:bold;text-align:center}
.go{padding:12px 32px;font-size:1.4rem;font-weight:bold;border:0;border-radius:30px;background:var(--org);color:#fff}
.sm{padding:6px 16px;font-size:1rem;border:2px solid var(--teal);border-radius:20px;background:#fff;color:var(--teal);font-weight:bold}
.all{margin-top:10px;font-size:1.15rem;font-weight:normal;line-height:2.1;color:#555}
.rv{text-align:left;padding:5px 0;border-bottom:1px dashed #ddd;font-size:1.15rem;line-height:2}
.rv span{display:inline-block;width:1.6em;font-weight:bold;color:var(--org)}
.rv-h{margin-top:18px;font-weight:bold;text-align:left}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.g>div{border:2px solid var(--tealbg);border-radius:14px;padding:10px;line-height:2;font-size:1.05rem}
h3{margin:18px 0 6px;color:var(--teal)}
.nopic .pic{display:none}
.pic{display:block;margin:0 auto 4px}
.pic svg{display:block;width:100%;height:auto}
.pic.em{width:auto!important;font-size:2.4rem;line-height:1.2}
.t .pic{width:92px}
.c .pic{width:70px}
.c .pic.em{font-size:2rem}
.w{display:inline-block;width:92px;margin:6px 2px;text-align:center;vertical-align:top;font-weight:bold;font-size:1rem;line-height:1.5}
.w .pic{width:64px}
.w .pic.em{font-size:1.8rem}
.cover{text-align:center;padding:22px 10px 12px;border-radius:26px;border:3px solid var(--teal);background:linear-gradient(160deg,#fff 0%,#e3f4f2 55%,#fff1d9 100%)}
.grade{display:inline-block;background:var(--org);color:#fff;font-weight:bold;border-radius:20px;padding:4px 16px}
.ttl{font-size:clamp(2rem,8vw,3.2rem);margin:.3em 0;letter-spacing:.04em}
.sub{margin:0;font-size:1.2rem;font-weight:bold;color:#6b6252}
.bubs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}
.bub{width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 3px 8px #0002;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:fl 3s ease-in-out infinite}
.bub svg{width:92%;height:auto}
.bub span{font-size:2.4rem}
@keyframes fl{50%{transform:translateY(-7px)}}
.cover .go{min-width:min(86%,420px);margin:4px 0}
.go small{display:block;font-size:.95rem;font-weight:normal}
.go.k{background:var(--teal)}
.go.r{background:#7b5fc9}
.vo{border:3px solid var(--org);background:var(--orgbg);border-radius:34px;padding:10px 12px 14px;margin:12px 0;text-align:left}
.vo.on{box-shadow:0 0 0 4px #ffd08a}
.vt{display:inline-block;font-weight:bold;border-radius:14px;padding:2px 12px;margin-bottom:6px}
.vo>.vt{background:var(--org);color:#fff}
.vs>.vt{background:var(--teal);color:#fff}
.vi{display:flex;flex-wrap:wrap;gap:10px}
.vs{flex:1 1 200px;border:3px solid var(--teal);background:#fff;border-radius:28px;padding:8px 10px 10px}
.vs.on{background:#e3f4f2;box-shadow:0 0 0 4px #9fd6d2}
.wd{display:inline-block;text-align:center;margin:3px;padding:2px 6px;border-radius:12px;font-size:.95rem;font-weight:bold}
.wd.on{background:#ffe08a;outline:3px solid var(--org)}
.wd .pic{width:44px;margin-bottom:0}
.wd .pic.em{font-size:1.5rem}
.note{background:#fff7d6;border:2px dashed var(--org);border-radius:14px;padding:6px 12px;margin:8px 0;font-weight:bold;font-size:1rem;text-align:left}
.vv{display:block;font-size:.85rem;font-weight:normal;color:#6b6252;margin:0 0 4px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sm.on{background:var(--teal);color:#fff}
.lg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;font-weight:bold}
.lg span{border-radius:14px;padding:2px 12px;color:#fff}
.la{background:var(--teal)}
.lb{background:var(--org)}
.lab{background:#8a6bc9}
.lo{background:#8a8a8a}
.u{margin:6px 0}
.vsv{display:block;width:100%;height:auto;margin:6px 0}
.vch{cursor:pointer}
.vch rect{fill:#fff;stroke:#ddd;stroke-width:1.5}
.vch text{fill:#33302a}
.nopic .vic{display:none}
.vcard,.tray{margin:8px 0}
.wc{border:2px solid var(--tealbg);border-radius:16px;padding:8px 12px;background:#fff}
.wcp{display:inline-block;width:56px;vertical-align:middle;margin-right:8px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tw{border:3px solid var(--teal);background:#fff;border-radius:14px;padding:4px 10px;font-weight:bold;text-align:center}
.tw.on{background:#ffe08a;border-color:var(--org)}
.tw .pic{width:48px}
.tw .pic.em{font-size:1.8rem}
rt{font-size:.42em;font-weight:normal}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.sm{min-height:44px}
.bar{flex-wrap:wrap}
.g{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.quiz-progress{font-size:1rem}
.quiz-footer{position:sticky;bottom:0;z-index:1;display:flex;justify-content:center;background:var(--bg);padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.quiz-footer:empty{display:none}
.quiz-footer .go{width:min(100%,350px)}
.quiz-explain{margin:10px 0;text-align:left}
.quiz-explain summary{cursor:pointer;padding:8px;color:#335653}
.vscroll{overflow-x:auto}
.vsv{min-width:560px}
.vsv:focus-within .vch:focus rect{stroke:#1a6fd1;stroke-width:4}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:6px;margin:10px 0}
.zones .sm{border-color:#605c53;color:var(--ink)}
[data-region="AB"]{background:#f6e9fa}
.nopic .bubs,.nopic .wcp{display:none}
.cover .go,.quiz-footer .go{background:#ae4d0f}
.cover .go.k{background:#166c68}.cover .go.r{background:#624ba2}
@media(max-width:520px){
 main{padding:10px}
 .card{padding:12px}
 .t{min-width:0;font-size:1.35rem;padding:7px 9px}
 .t .pic{width:56px}
 .c{font-size:clamp(1rem,4.5vw,1.45rem);padding:8px 4px;min-width:0;overflow-wrap:anywhere}
 .c .pic{width:47px}
 .set,.ch{gap:6px}
 .ch{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bub{width:48px;height:48px}
 .fb{min-height:0;font-size:1rem}
 .q{font-size:1.15rem}
}
</style>
</head>
<body>
<main>
<div class="bar"><h1>なかまに なる ことば</h1><span><button class="sm" id="pc" aria-pressed="true">🖼 え ON</button> <button class="sm" id="snd" aria-pressed="true">🔊 こえ ON</button></span></div>
<div id="app"></div>
</main>
<script>
// [なかまの名前, グループ, ことば…]  ことばは「漢字|よみ」の形。よみ(ひらがな)をふりがなと読み上げに使う。
// 同じグループ(例: 時に関する言葉)どうしは、まちがいの選択肢に出さない。ことばは自由に足せる(各なかま4つ以上)。
const C=[
["きせつ","t","春|はる","夏|なつ","秋|あき","冬|ふゆ"],
["時|とき","t","朝|あさ","昼|ひる","夜|よる","おととい","きのう","今日|きょう","あした","あさって","夕方|ゆうがた"],
["ようび","t","月曜日|げつようび","火曜日|かようび","水曜日|すいようび","木曜日|もくようび","金曜日|きんようび","土曜日|どようび","日曜日|にちようび"],
["てんき","t","晴れ|はれ","くもり","雨|あめ","雪|ゆき","風|かぜ"],
["方角|ほうがく","d","東|ひがし","西|にし","南|みなみ","北|きた"],
["教科|きょうか","s","国語|こくご","算数|さんすう","生活|せいかつ","音楽|おんがく","図工|ずこう","体いく|たいいく"],
["がっき","s","ピアノ","たいこ","リコーダー","カスタネット","オルガン","すず"],
["ぶんぼうぐ","s","えんぴつ","けしゴム","ノート","じょうぎ","はさみ","のり"],
["家ぞく|かぞく","h","親|おや","子|こ","母|はは","父|ちち","兄|あに","姉|あね","弟|おとうと","妹|いもうと","母さん|かあさん","父さん|とうさん","兄さん|にいさん","姉さん|ねえさん","兄弟|きょうだい","おじいさん","おばあさん"],
["ほにゅうるい","a","犬|いぬ","ねこ","うさぎ","さる","くま","ぞう","馬|うま"],
["こんちゅう","a","ちょうちょ","とんぼ","せみ","バッタ","てんとうむし","かぶとむし"],
["さかな","a","まぐろ","さんま","たい","いわし","アジ","サケ"],
["貝|かい","a","あさり","しじみ","はまぐり","ほたて","さざえ","カキ"],
["くだもの","f","りんご","みかん","ぶどう","もも","バナナ"],
["やさい","f","にんじん","だいこん","きゅうり","なす","ピーマン","キャベツ"],
["りくの のりもの","o","電車|でんしゃ","バス","車|くるま","じてんしゃ","しんかんせん"],
["うみの のりもの","o","船|ふね","ヨット","ボート","フェリー"],
["そら・うちゅうの のりもの","o","ひこうき","ヘリコプター","ロケット","ききゅう"],
["からだ","b","頭|あたま","顔|かお","手|て","足|あし","目|め","口|くち","耳|みみ","おなか"],
["いろ","c","赤|あか","青|あお","黄色|きいろ","みどり","白|しろ","黒|くろ"],
["はな","p","さくら","チューリップ","ひまわり","あさがお","たんぽぽ","コスモス"],
["まちの ばしょ","m","公園|こうえん","えき","びょういん","ゆうびんきょく","スーパー","学校|がっこう"],
["うみに すむ いきもの","a","たこ","いか","えび","かに","くじら","いるか"],
["とり","a","すずめ","にわとり","ペンギン","ふくろう","あひる","はくちょう"],
["のみもの","f","ぎゅうにゅう","おちゃ","ジュース","みず","こうちゃ"],
["おかし","f","アメ","チョコレート","ケーキ","クッキー","ドーナツ","アイスクリーム"],
["ふく","w","シャツ","ズボン","ワンピース","コート"],
["はきもの","w","くつ","くつした","ながぐつ","サンダル"],
["こもの","w","ぼうし","てぶくろ","マフラー","めがね"],
["スポーツ","g","サッカー","やきゅう","バスケットボール","テニス","バレーボール","すいえい"],
["はたらく ひと","j","せんせい","いしゃ","おまわりさん","しょうぼうし","コックさん","パンやさん","ゆうびんやさん"],
["がっこうの ばしょ","m","きょうしつ","としょしつ","ほけんしつ","おんがくしつ","ずこうしつ","たいいくかん","こうてい","プール"],
["いえの ばしょ","m","だいどころ","おふろ","トイレ","げんかん","にわ","ねしつ"],
["かたち","z","まる","さんかく","しかく","ほし","ハート"],
["月の 名前|つきのなまえ","t","1月|いちがつ","2月|にがつ","3月|さんがつ","4月|しがつ","5月|ごがつ","6月|ろくがつ","7月|しちがつ","8月|はちがつ","9月|くがつ","10月|じゅうがつ","11月|じゅういちがつ","12月|じゅうにがつ"]
];
// ===== 挿絵。キーは「よみ」。SVG文字列でも絵文字でもよい(足すときは ICON["よみ"]=… と書く) =====
let pics=true;
const S=b=>`<svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
const A=(n,f)=>Array.from({length:n},(_,i)=>f(i*360/n)).join("");
const px=(a,r)=>50+r*Math.cos(a*Math.PI/180),py=(a,r)=>35+r*Math.sin(a*Math.PI/180);
// あさ・ひる・ゆうがた・よる: 空とお日さま(お月さま)の位置
const tod=(bg,x,y,c,n)=>S(`<rect width="100" height="70" fill="${bg}"/>${n?`<circle cx="70" cy="20" r="11" fill="#fff6c8"/><circle cx="76" cy="16" r="10" fill="${bg}"/><g fill="#fff"><circle cx="20" cy="14" r="1.6"/><circle cx="40" cy="28" r="1.6"/><circle cx="50" cy="10" r="1.6"/></g>`:`<circle cx="${x}" cy="${y}" r="11" fill="${c}"/>`}<g opacity="${n?0.5:1}"><ellipse cx="30" cy="72" rx="55" ry="18" fill="#6bbf59"/><ellipse cx="80" cy="74" rx="45" ry="16" fill="#58a84a"/></g>`);
// おととい〜あさって: 5日ぶんのカレンダーで、きょうを基準に位置を示す
const cal=k=>S([-2,-1,0,1,2].map((d,j)=>`<rect x="${4+j*19}" y="12" width="17" height="30" rx="3" fill="${d==k?"#ef8a3a":"#fff"}" stroke="${d?"#bbb":"#2c9a96"}" stroke-width="${d?1.2:2.5}"/>`).join("")+`<path d="M50.5 46l-4 6h8z" fill="#2c9a96"/><text x="50.5" y="64" font-size="9" text-anchor="middle" fill="#2c9a96">きょう</text>`);
// 東西南北: 方位磁針(上=北)
const comp=d=>S(`<circle cx="50" cy="35" r="22" fill="#fff" stroke="#2c9a96" stroke-width="2"/>`+[[0,-1,"北"],[1,0,"東"],[0,1,"南"],[-1,0,"西"]].map(([x,y,t],j)=>{const c=j==d||d<0?"#e8553f":"#bbb";return`<path d="M${50+x*20} ${35+y*20}L${50-y*6} ${35+x*6}L${50+y*6} ${35-x*6}z" fill="${c}"/><text x="${50+x*31}" y="${38+y*29}" font-size="10" text-anchor="middle" fill="${c}">${t}</text>`}).join(""));
const SE={
 はる:S(A(5,a=>`<circle cx="${px(a,14)}" cy="${py(a,14)}" r="10" fill="#ffb3c7"/>`)+`<circle cx="50" cy="35" r="5" fill="#ffe36e"/>`),
 なつ:S(A(8,a=>`<path d="M${px(a,19)} ${py(a,19)}L${px(a,28)} ${py(a,28)}" stroke="#ffa800" stroke-width="4" stroke-linecap="round"/>`)+`<circle cx="50" cy="35" r="14" fill="#ffc933"/>`),
 あき:S(`<path d="M50 6C74 20 84 40 50 64C16 40 26 20 50 6z" fill="#e2572b"/><path d="M50 14V68" stroke="#8a2d12" stroke-width="2"/>`),
 ふゆ:S(A(3,a=>`<path d="M${px(a,27)} ${py(a,27)}L${px(a+180,27)} ${py(a+180,27)}" stroke="#5aa9e6" stroke-width="3.5" stroke-linecap="round"/>`)+`<circle cx="50" cy="35" r="5" fill="#bfe0f8"/>`)
};
const SU={
 こくご:S(`<rect x="26" y="8" width="48" height="54" rx="4" fill="#e8553f"/><rect x="31" y="12" width="40" height="46" rx="2" fill="#fff"/><text x="51" y="46" font-size="28" text-anchor="middle" fill="#e8553f">あ</text>`),
 さんすう:S(`<rect x="10" y="8" width="80" height="48" rx="4" fill="#2f7d5b" stroke="#c89b5c" stroke-width="4"/><text x="50" y="40" font-size="20" text-anchor="middle" fill="#fff">1+2=3</text><rect x="22" y="58" width="56" height="5" fill="#c89b5c"/>`),
 せいかつ:S(`<path d="M50 54V30" stroke="#4a9a3c" stroke-width="3"/><path d="M50 38C36 38 30 28 32 18C44 18 50 28 50 38z" fill="#6bbf59"/><path d="M50 32C62 32 68 22 66 12C54 12 50 22 50 32z" fill="#8ad06a"/><path d="M33 54h34l-4 12H37z" fill="#c8794a"/>`),
 おんがく:S(`<text x="22" y="56" font-size="52" fill="#7b5fc9">♪</text><text x="60" y="40" font-size="30" fill="#2c9a96">♫</text>`),
 ずこう:S(`<path d="M50 8C22 8 10 28 14 44C18 60 38 64 46 56C50 52 46 46 54 44C70 42 90 46 90 32C90 18 72 8 50 8z" fill="#f3d9a4" stroke="#c89b5c" stroke-width="2"/><circle cx="32" cy="26" r="5" fill="#e8553f"/><circle cx="50" cy="19" r="5" fill="#ffc933"/><circle cx="68" cy="26" r="5" fill="#2c9a96"/><circle cx="29" cy="44" r="5" fill="#4a7de0"/><path d="M58 64L86 22" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>`),
 たいいく:S(`<circle cx="50" cy="35" r="26" fill="#ef8a3a"/><g stroke="#fff" stroke-width="2.5" fill="none"><path d="M24 35H76M50 9V61"/><path d="M32 17C42 28 42 42 32 53M68 17C58 28 58 42 68 53"/></g>`)
};
// 家ぞく: 上=おや(母・父)、下=こ(弟・妹・自分・姉・兄)。そのことばの人だけ光らせる
const FAM=[["m",36,22,1.25,"#f08ab0"],["f",64,22,1.25,"#4a7de0"],["y",14,52,0.8,"#4a9a3c"],["i",32,52,0.8,"#ff9ac1"],["j",50,52,0.95,"#ffb400"],["s",68,52,1.05,"#a679d6"],["b",86,52,1.1,"#2c9a96"]];
const fam=on=>S([...FAM].sort((a,b)=>on.includes(a[0])-on.includes(b[0])).map(([k,x,y,s,c])=>{const h=on.includes(k);return`<g opacity="${h?1:0.3}" transform="translate(${x} ${y}) scale(${s})">${h?`<circle cy="-1" r="12" fill="#ffe08a"/>`:""}<circle cy="-9" r="5" fill="#f6c9a0"/><path d="M-7 12V0Q-7-4 0-4Q7-4 7 0V12z" fill="${c}"/></g>`}).join(""));
const FM={はは:"m",かあさん:"m",ちち:"f",とうさん:"f",あに:"b",にいさん:"b",あね:"s",ねえさん:"s",おとうと:"y",いもうと:"i",じぶん:"j",おや:"mf",こ:"yijsb",きょうだい:"yisb"};
const ICON={あさ:tod("#ffe2a6",24,46,"#ff9f3a"),ひる:tod("#9fd8ff",50,14,"#ffd23f"),ゆうがた:tod("#ff9a6e",78,50,"#e8402f"),よる:tod("#27386b",0,0,"",1),
 おととい:cal(-2),きのう:cal(-1),きょう:cal(0),あした:cal(1),あさって:cal(2),きた:comp(0),ひがし:comp(1),みなみ:comp(2),にし:comp(3),...SE,...SU};

 {t:"すむところ",u:"ここに ある みずの いきものの、くらしかたの れい",a:"まみずで くらす",b:"うみで くらす",ra:"まみずだけで くらす れい",rab:"一生の うちに まみずと うみの りょうほうで くらす れい",rb:"うみだけで くらす れい",ro:"",
  A:["めだか","コイ","ザリガニ","たにし"],AB:["サケ","うなぎ","あゆ"],B:["まぐろ","たい","いか","くじら"],O:[]},
 {t:"とり × とべる",u:"いきもの",a:"とり",b:"そらを とべる",ra:"とりだけど とべない",rab:"とりで とべる",rb:"とべるけど とりじゃない",ro:"とりでも ないし とべない",
  A:["ペンギン","ダチョウ"],AB:["すずめ","ワシ","ふくろう"],B:["ちょうちょ","とんぼ","はち","こうもり"],O:["ライオン","サケ","うさぎ"]}
];
const NT={サケ:"かわで うまれて、うみで おおきくなり、かわに もどって たまごを うむよ",うなぎ:"かわで そだち、うみで たまごを うむよ",あゆ:"かわと うみを いききする あゆも、かわと みずうみで くらす あゆも いるよ",
 くま:"たとえば ツキノワグマは、くだものも むしも たべるよ",ぶた:"にくも やさいも たべるよ",さる:"たとえば ニホンザルは、くだものや むしを たべるよ",すずめ:"たねも むしも たべるよ",
 ペンギン:"とりの なかまだけど、そらは とべないよ。うみを およぐよ",ダチョウ:"とりの なかまだけど、そらは とべないよ。はしるのが はやいよ",
 こうもり:"ほにゅうるいの なかま。とりでは ないのに、そらを とべるよ",くじら:"うみに すむけれど、さかなではなくて ほにゅうるいだよ"};
const RK={A:"ra",AB:"rab",B:"rb",O:"ro"};
const reg=(v,w)=>["A","AB","B","O"].find(k=>v[k].includes(w));
const CHIP=(w,x,y,interactive)=>{const f=ICON[w],ic=!f?"":f[0]=="<"?f.replace("<svg ",'<svg x="-32" y="-38" width="64" height="45" '):`<text y="-4" font-size="34" text-anchor="middle">${f}</text>`;
 return`<g class="vch" data-w="${w}" ${interactive?`role="button" tabindex="0" aria-label="${w}"`:""} transform="translate(${x} ${y})"><rect x="-38" y="-41" width="76" height="82" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/><g class="vic">${ic}</g><text y="32" font-size="14" font-weight="bold" text-anchor="middle" fill="#33302a">${w}</text></g>`};
const grid=(a,cx,cols)=>{if(!a.length)return [];const c=Math.min(cols,a.length),r=Math.ceil(a.length/c);return a.map((w,k)=>[w,cx+(k%c-(c-1)/2)*80,220+(Math.floor(k/c)-(r-1)/2)*88])};
function vsvg(v,only){
  const f=a=>only?a.filter(w=>only.has(w)):a;
  return`<div class="vscroll"><svg aria-label="ふたつの わの ベンず" class="vsv" viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="8" width="844" height="424" rx="28" fill="#fffaf0" stroke="#ef8a3a" stroke-width="3"/><circle cx="360" cy="220" r="200" fill="#2c9a96" fill-opacity=".22" stroke="#2c9a96" stroke-width="3"/><circle cx="560" cy="220" r="200" fill="#ef8a3a" fill-opacity=".22" stroke="#ef8a3a" stroke-width="3"/>${[[v.A,260,2],[v.AB,460,2],[v.B,660,2],[v.O,85,1]].map(([a,x,c])=>grid(f(a),x,c).map(([w,X,Y])=>CHIP(w,X,Y,!only)).join("")).join("")}</svg></div>`;
}
const leg=v=>`<div class="lg"><span class="la">${v.a}</span><span class="lb">${v.b}</span><span class="lab">まんなか＝${v.rab}</span>${v.ro?`<span class="lo">そと＝${v.ro}</span>`:""}</div>`;
const tabs=(cur,p)=>`<div class="tabs">${VN.map((v,k)=>`<button class="sm${k==cur?" on":""}" data-${p}="${k}" aria-pressed="${k===cur}">${v.t}</button>`).join("")}</div>`;
function wcard(w){
  const rows=VN.map((v,k)=>{const g=reg(v,w);return g?`<div class="rv"><b>${v.t}</b>：${v[RK[g]]} <button class="sm" data-v="${k}" data-w2="${w}">みる</button></div>`:""}).join("");
  return`<div class="wc"><span class="wcp">${pic(w)}</span><b style="font-size:1.3rem">${w}</b>${NT[w]?`<p style="margin:4px 0">${NT[w]}</p>`:""}<div><small>この ことばは、ほかの みかたでは…</small>${rows}</div></div>`;
}
let vi=0,si=0,sw=[],sp=new Set(),ss=null,sm=0;
function vview(k,w){
  vi=k;scr="v";const v=VN[k];
  $("#app").innerHTML=`<div class="card" style="text-align:left"><button class="sm" id="menu">◀ もどる</button><div class="q" style="margin-top:12px">ベンず：ふたつの みかた</div>${NOTE}${tabs(k,"v")}<p class="u">まとめると：<b>${v.u}</b></p>${leg(v)}${vsvg(v)}<div id="vcard" class="vcard">${w?wcard(w):"ことばを タップして みよう"}</div></div>`;
}
function srender(msg,focus){
  const v=VN[si];
  $("#app").innerHTML=`<div class="card" style="text-align:left"><button class="sm" id="menu">◀ もどる</button><div class="q" style="margin-top:12px">ならべよう：${v.t}</div>${NOTE}${tabs(si,"s")}<p class="u">まとめると：<b>${v.u}</b></p>${leg(v)}${vsvg(v,sp)}<div class="zones" role="group" aria-label="ことばを いれる ばしょ">${[["A","ひだりの わだけ"],["AB","まんなか（りょうほう）"],["B","みぎの わだけ"],["O","わの そと"]].filter(([key])=>key!=="O"||v.O.length).map(([key,label])=>`<button type="button" class="sm" data-region="${key}" ${ss?"":"disabled"}>${label}</button>`).join("")}</div><div class="fb" id="sfb" role="status">${msg}</div><div class="tray">${sw.filter(w=>!sp.has(w)).map(w=>`<button class="tw${ss==w?" on":""}" data-t="${w}" aria-pressed="${ss===w}">${pic(w)}<span>${w}</span></button>`).join("")||"<b>ぜんぶ ならべられたよ！ ほかの みかたも やってみよう</b>"}</div></div>`;
  if(focus)($(focus)||$(".tabs .on")).focus();
}
function sview(k){
  si=k;scr="s";const v=VN[k];sw=sh([...v.A,...v.AB,...v.B,...v.O]);sp=new Set();ss=null;sm=0;
  srender("ことばを えらんで、ベンずの ばしょを タップしてね");
}

function place(g){
  if(!ss)return;
  const v=VN[si],t=reg(v,ss);
  if(g===t){
    const w=ss;sp.add(w);ss=null;sm=0;
    srender(`せいかい！ ${w}は「${v[RK[g]]}」${NT[w]?"　"+NT[w]:""}`,".tw");
    say("せいかい");
  }else{
    sm++;
    srender(sm>1?`ヒント：${ss}は「${v[RK[t]]}」だよ`:"ちがう ばしょだよ。ふたつの わの 名前を もういちど みてね",`[data-region="${g}"]`);
    say("もういちど");
  }
}

// ことば → ちいさな なかま → おおきな なかま (2もんで1セット)
function makeG(h){
  const ln=sh(h.slice(1))[0],c=CN(ln),w=sh(c.slice(2))[0],O=HI.filter(x=>x!=h);
  const sib=sh(h.slice(1).filter(n=>n!=ln)).slice(0,2),oth=sh(O.flatMap(x=>x.slice(1)));
  return[
   {m:"g",name:ln,all:c.slice(2),set:[w],ans:ln,ch:sh([ln,...[...sib,...oth].slice(0,3)]),
    t:`「${rb(w)}」は どの なかま？`,sp:yomi(w)+"は、どの なかま",
    ok:`${rb(w)} は 「${rb(ln)}」の なかま！`,say:yomi(w)+"は、"+yomi(ln)+"の なかま"},
   {m:"g",name:h[0],all:[],set:[ln],ans:h[0],ch:sh([h[0],...sh(O).slice(0,3).map(x=>x[0])]),
    t:`「${rb(ln)}」は どの おおきな なかま？`,sp:yomi(ln)+"は、どの おおきな なかま",
    ok:`「${rb(ln)}」は 「${rb(h[0])}」の なかま！`,say:yomi(ln)+"は、"+yomi(h[0])+"の なかま",dia:venn(h,{b:h[0],s:ln,w})}
  ];
}
function start(m){
  if(m=="z")return zukan();if(m=="v")return vview(0);if(m=="s")return sview(0);H=[];mode=m;const P=pool();
  Q=m=="g"?[...sh(HI),...sh(HI)].slice(0,5).flatMap(makeG):m=="c"?readingRound():(P.length<10?[...sh(P),...sh(P)]:sh(P)).slice(0,10).map(c=>make(c,m));
  i=0;score=0;show();
}
function cover(){stopVoice();scr="";
  const bub=["はる","りんご","いぬ","でんしゃ","ひがし","さくら","ぞう","あに"].map((k,j)=>`<div class="bub" style="animation-delay:${j*.35}s">${ICON[k][0]=="<"?ICON[k]:`<span>${ICON[k]}</span>`}</div>`).join("");
  $("#app").innerHTML=`<div class="cover"><div class="grade">2ねんせい</div>
<h2 class="ttl"><span style="color:var(--teal)">なかまに</span> <span style="color:var(--org)">なる</span> <span style="color:#7b5fc9">ことば</span></h2>
<p class="sub">ことばを なかまに わけて みよう！</p>
<div class="bubs">${bub}</div>
<p><button class="go k" data-e="k">きほん<small>きょうかしょの ことば</small></button></p>
<p><button class="go" data-e="h">はってん<small>ほかの なかまの ことば</small></button></p>
<p><button class="go r" data-e="r">ふりかえり<small>きろくを みる</small></button></p></div>`;
}
function home(c){
  stopVoice();course=c;scr="";
  $("#app").innerHTML=`<div class="card"><button class="sm" id="cov">◀ ひょうしへ</button><div class="q" style="margin-top:12px">${c=="h"?"はってん：ほかの なかまの ことば":"きほん：きょうかしょの ことば"}</div>${c=="h"?NOTE:""}${[...(c=="h"?"abegsvz":"abc")].map(k=>`<p><button class="go" data-m="${k}">${M[k]}</button></p>`).join("")}</div>`;
}
function read(){const q=Q[i];say(("ceg".includes(q.m)?"":q.set.map(yomi).join("、")+"。")+(q.sp||q.t)+"。"+q.ch.map(yomi).join("、"))}
function show(){
  scr="q";const q=Q[i];miss=0;done=false;
  $("#app").innerHTML=`<div class="bar quiz-progress"><button class="sm" id="menu">◀ もどる</button><span>${i+1} / ${Q.length} もんめ</span><span>⭐ ${score}</span></div>
<div class="card"><div class="q">${q.t}</div>
<div class="set">${q.set.map(w=>`<div class="t">${q.m==="c"?"":pic(w)}${rb(w)}</div>`).join("")}${q.m=="a"?`<div class="t m">？</div>`:""}</div>
<button class="sm" id="re" style="margin-top:14px">🔊 もういちど きく</button></div>
<div class="ch">${q.ch.map((w,k)=>`<button class="c" data-k="${k}">${"ae".includes(q.m)?pic(w):""}${rb(w)}</button>`).join("")}</div>
<div class="quiz-footer" id="nx"></div><div class="fb" id="fb" role="status"></div>`;
  window.scrollTo(0,0);$("#app .q").tabIndex=-1;$("#app .q").focus({preventScroll:true});read();
}
function pick(b){
  const q=Q[i],w=q.ch[+b.dataset.k];
  if(w==q.ans){
    done=true;b.classList.add("ok");if(!miss)score++;rec(q,!miss);document.querySelectorAll(".ch button").forEach(choice=>choice.disabled=true);
    const m=$(".t.m");if(m){m.innerHTML=pic(w)+rb(w);m.classList.add("on")}
    $("#fb").innerHTML=`<span style="color:var(--ok)">せいかい！</span><br>${q.ok}`+(q.all.length||q.dia?`<details class="quiz-explain"><summary>${q.dia?"ベンずで たしかめる":"ほかの なかまを みる"}</summary>${q.dia||`<div class="all">${q.all.map(x=>`<span class="w">${pic(x)}${rb(x)}</span>`).join("")}</div>`}</details>`:"");
    $("#nx").innerHTML=`<button class="go" id="nxt">${i+1<Q.length?"つぎへ ▶":"けっかを みる"}</button>`;
    $("#nxt").focus({preventScroll:true});say("せいかい。"+q.say);
  }else{
    miss++;b.classList.add("ng");b.disabled=true;
    $("#fb").innerHTML=`<span style="color:var(--ng)">ちがうよ。もういちど えらんでね</span>${miss>1&&q.m=="a"?`<br>ヒント：「${rb(q.name)}」の なかまだよ`:""}`;
    $(".ch button:not(:disabled)")?.focus({preventScroll:true});say("ちがうよ。もういちど");
  }
}
function end(){
  scr="";
  D.r.unshift({d:new Date().toLocaleDateString("ja-JP"),m:mode,c:course,s:score,n:Q.length});D.r=D.r.slice(0,10);save();
  const m=score>=9?"すごい！ ことばはかせ だね！":score>=6?"よく できました！":"もういちど ちょうせん してみよう！";
  $("#app").innerHTML=`<div class="card"><div class="q">けっか</div><div style="font-size:2.4rem;font-weight:bold;color:var(--org)">${score} / ${Q.length} もん はじめの こたえで せいかい</div><div style="font-size:2rem;margin:8px">${"⭐".repeat(score)}</div><p class="q">${m}</p><button class="go" id="st">もういちど</button> <button class="sm" id="menu">あそびかたを えらぶ</button> <button class="sm" id="cov">ひょうしへ</button><div class="rv-h">ふりかえり　◯=いっぱつで せいかい　△=まちがえた</div>${H.map(h=>`<div class="rv"><span>${h.ok?"◯":"△"}</span>${row(h.q)}</div>`).join("")}</div>`;
  window.scrollTo(0,0);focusFirst();say(N[score]+"もん、はじめの こたえで せいかい。"+m);
}

$("#app").onclick=e=>{
  const sv=e.target.closest("svg.vsv"),tw=e.target.closest("[data-t]"),wd=e.target.closest("[data-w]");
  if(scr==="s"&&sv&&ss){
    const point=new DOMPoint(e.clientX,e.clientY).matrixTransform(sv.getScreenCTM().inverse());
    if(point.x<8||point.x>852||point.y<8||point.y>432)return;
    const a=Math.hypot(point.x-360,point.y-220)<200,b=Math.hypot(point.x-560,point.y-220)<200;
    place(a&&b?"AB":a?"A":b?"B":"O");return;
  }
  if(scr==="s"&&tw){
    if(ss!==tw.dataset.t)sm=0;
    ss=tw.dataset.t;srender(`「${ss}」を ベンずの どこに いれる？`,"[data-region]");return;
  }
  if(scr==="v"&&wd){$("#vcard").innerHTML=wcard(wd.dataset.w);return}
  const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.region){place(b.dataset.region);return}
  if(b.id==="re"){read();return}
  if(b.id==="nxt"){if(!done)return;++i<Q.length?show():end();return}
  if(b.dataset.k!=null){if(!done)pick(b);return}
  if(b.dataset.v!=null){vview(+b.dataset.v,b.dataset.w2);$(".tabs .on").focus();return}
  if(b.dataset.s!=null){if(+b.dataset.s!==si)sview(+b.dataset.s);$(".tabs .on").focus();return}
  if(b.dataset.e)b.dataset.e==="r"?review():home(b.dataset.e);
  else if(b.dataset.m)start(b.dataset.m);
  else if(b.id==="st")start(mode);
  else if(b.id==="menu")home(course);
  else if(b.id==="cov")cover();
  else if(b.id==="clr"){
    if(!confirm("きろくを ぜんぶ けしますか？"))return;
    D=emptyRecord();save();review();
  }else return;
  window.scrollTo(0,0);
  if(scr!=="q")focusFirst();
};
$("#app").addEventListener("keydown",e=>{
  const word=e.target.closest(".vch[role=button]");
  if(word&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();$("#vcard").innerHTML=wcard(word.dataset.w);
    $("#vcard").scrollIntoView({block:"nearest"});
  }
});
$("#snd").onclick=()=>{
  voice=!voice;stopVoice();
  $("#snd").textContent="🔊 こえ "+(voice?"ON":"OFF");
  $("#snd").setAttribute("aria-pressed",voice);
};
$("#pc").onclick=()=>{
  pics=!pics;document.body.classList.toggle("nopic",!pics);
  $("#pc").textContent="🖼 え "+(pics?"ON":"OFF");
  $("#pc").setAttribute("aria-pressed",pics);
};

cover();
</script>
</body>
</html>
