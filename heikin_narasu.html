<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ならして ぴったり！</title>
<meta name="description" content="玉・土・水を動かして「ならす」を体験し、合計÷個数で平均を求める学習アプリ。">
<link rel="stylesheet" href="heikin-narasu.css">
<script src="heikin-narasu-motion.js" defer></script>
<script src="heikin-narasu-render.js" defer></script>
<script src="heikin-narasu.js" defer></script>
</head>
<body>
<main>
 <header><a class="home" href="app_links_portfolio.html" aria-label="教材一覧へ">⌂</a><h1>ならして <span>ぴったり！</span></h1><button id="settingsOpen">先生の設定</button></header>
 <nav id="scenes" aria-label="学習の場面"></nav>
 <section class="lesson" aria-labelledby="lessonTitle">
  <div class="instruction"><div><p id="eyebrow"></p><h2 id="lessonTitle"></h2></div><button id="speak" aria-label="今の説明を読み上げる">♪ 聞く</button></div>
  <p id="message" role="status" aria-live="polite"></p>
  <div id="subnav"></div>
  <div id="cards" class="cards"></div>
  <div id="drawing"><svg id="board" viewBox="0 0 960 380" role="group" aria-label="動かして確かめる教材"></svg></div>
  <div id="math"></div>
  <form id="answerForm" hidden><label id="answerLabel" for="answer"></label><div class="answerRow"><input id="answer" type="number" min="0" step="any" inputmode="decimal" autocomplete="off"><button class="primary" type="submit">たしかめる</button></div></form>
  <div id="actions" class="actions"></div>
  <details id="totalPanel"><summary>全部の量を たしかめる</summary><p id="totalText"></p></details>
 </section>
 <footer><div class="tools"><button id="undo">↶ ひとつ もどす</button><button id="reset">はじめの形</button><button id="hint">ヒント</button><button id="demo">おてほんを ひとつ</button><button id="pause" hidden>一時停止</button></div><button id="next" class="primary">つぎへ →</button></footer>
 <details id="soilReferences" hidden>
  <summary>参考動画：実際のグラウンド整備を見る</summary>
  <p class="help">YouTubeを別のタブで開きます。</p>
  <ul class="referenceLinks">
   <li><a href="https://youtu.be/fY-4ZaPRe3E" target="_blank" rel="noopener noreferrer">トンボのかけ方（阪神園芸） ↗</a></li>
   <li><a href="https://youtu.be/P5qvrHpeMwE" target="_blank" rel="noopener noreferrer">グラウンド整備（浦和学院） ↗</a></li>
  </ul>
 </details>
 <p class="guide">タップ：うつす元 → うつす先　／　ドラッグでも選べます　／　キーボード：Tabで選んで Enter</p>
</main>
<dialog id="settings"><form method="dialog"><h2>先生の設定</h2><p>場面は上のタブから、いつでも選べます。</p><label>動きの速さ<select id="speed"><option value="normal">ふつう</option><option value="slow">ゆっくり</option><option value="reduced">動きを少なく</option></select></label><label><input id="speech" type="checkbox" checked>「聞く」ボタンの読み上げ</label><label><input id="numbers" type="checkbox" checked>玉の数量を表示（水量は常に表示）</label><label><input id="line" type="checkbox">同じ高さのヒント線</label><label>今の問題の元の量（半角の , で区切る）<input id="custom" type="text" placeholder="例：5,4,1,2"></label><p class="help">玉・土：3～6列、各0～6、ならした高さが整数。水：2～5個、各0～300mL、5mL単位でならせる量。</p><button id="apply" type="button">この量で はじめる</button><p id="settingError" role="status"></p><button class="primary">とじる</button></form></dialog>
<dialog id="resume"><h2>つづきが あります</h2><p>前に終えた操作のつづきから、はじめられます。</p><button id="resumeYes" class="primary">つづきから</button><button id="resumeNo">さいしょから</button></dialog>
</body></html>
