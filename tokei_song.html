<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>じこくと じかん MV</title>
<link rel="stylesheet" href="css/tokei-song.css">
</head>
<body>
<div id="stage" aria-label="じこくと じかん ミュージックビデオ">
  <div id="layerA" class="layer active"><img id="imgA" src="media/tokei-song/img/01.webp" alt=""></div>
  <div id="layerB" class="layer"><img id="imgB" src="media/tokei-song/img/01.webp" alt=""></div>
  <div id="shade"></div>
  <div id="startOverlay"><button class="startBtn" id="startBtn">▶ スタート</button></div>
  <div id="hint">Space: 再生/停止　F: 全画面　←→: 5秒移動</div>
  <div id="sceneBadge">01 / 40</div>
  <div id="ui">
    <button class="control" id="playBtn" aria-label="再生・一時停止">▶</button>
    <input id="timeline" type="range" min="0" max="171.92" step="0.01" value="0" aria-label="再生位置">
    <div id="time">0:00 / 2:52</div>
  </div>
</div>
<audio id="audio" preload="metadata" src="media/tokei-song/song.m4a"></audio>
<script src="js/tokei-song.js"></script>
</body>
</html>
