<style>
:root{
  --ink:#20364b;--muted:#62788d;--bg:#f2f6fa;--paper:#fff;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif}
body{padding:10px}
button{font:inherit}
.app{width:min(1360px,100%);min-height:calc(100vh - 20px);margin:auto;display:flex;flex-direction:column;gap:9px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#294b6a;color:#fff;font-size:23px;font-weight:1000;flex:none}
h1{font-size:clamp(18px,2vw,25px);line-height:1.15;margin:0;font-weight:950;letter-spacing:.025em}
.brand-sub{font-size:11px;color:var(--muted);margin-top:3px}
.sound{border:1.5px solid #cbd9e5;background:#fff;color:#36536d;border-radius:12px;padding:8px 13px;font-size:14px;font-weight:900;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:8px;justify-content:center}
.tab{flex:1;max-width:240px;border:2px solid var(--line);background:#fff;color:#526c83;border-radius:12px;padding:9px 12px;font-size:15px;font-weight:950;cursor:pointer;transition:.15s}

.stage-card{background:var(--paper);border:1px solid #e2eaf0;border-radius:20px;box-shadow:var(--shadow);flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.stage-head{min-height:106px;padding:13px 16px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px}
.stage-title{font-size:clamp(27px,3.4vw,43px);font-weight:1000;line-height:1.16;letter-spacing:.015em;margin:0}
.stage-title .blue{color:var(--blue-dark)}.stage-title .pink{color:var(--pink-dark)}.stage-title .yellow{color:var(--yellow-dark)}
.stage-sub{font-size:clamp(14px,1.55vw,19px);font-weight:850;color:#60778c;min-height:1.35em;margin:0}
.learning-layout{display:grid;grid-template-columns:minmax(330px,.88fr) minmax(0,1.32fr);gap:12px;padding:10px 14px 12px;flex:1;min-height:0;align-items:stretch}
.problem-panel{background:#fbfdff;border:2px solid #dce8f1;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:auto}
.problem-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:950;color:#54718b;margin-bottom:10px}
.problem-label:before{content:"";width:7px;height:20px;border-radius:9px;background:#294b6a}
.role-legend{display:flex;gap:6px;flex-wrap:wrap;margin:-3px 0 10px;font-size:11px;font-weight:950}.role-legend span{padding:4px 8px;border-radius:8px;border:1.5px solid}.legend-one{color:#286e9f;background:#edf7fd;border-color:#75b4d9!important}.legend-count{color:#ad3f70;background:#fff2f7;border-color:#e56b9a!important}.legend-total{color:#806000;background:#fff8df;border-color:#e0b52f!important}
.problem-text{font-size:clamp(17px,1.55vw,22px);font-weight:750;line-height:1.72;letter-spacing:.005em;color:#243a4e}
.problem-text p{margin:0 0 8px}
.problem-text p:last-child{margin-bottom:0}
.problem-text [data-phase]{border-radius:7px;padding:1px 3px;transition:background .3s,box-shadow .3s,color .3s}
.problem-text .phase-focus{font-weight:1000;position:relative;box-shadow:0 0 0 3px var(--focus-edge);background:var(--focus-bg);color:var(--focus-ink);animation:textFocus .9s ease-out both}
.problem-text .phase-seen{background:var(--seen-bg);color:var(--seen-ink)}
.problem-text [data-phase="0"]{--focus-bg:#e7f4fc;--focus-edge:#4b9bd3;--focus-ink:#245f88;--seen-bg:#f0f8fd;--seen-ink:#386b8d}
.problem-text [data-phase="1"],.problem-text [data-phase="2"]{--focus-bg:#fff0f6;--focus-edge:#e56b9a;--focus-ink:#a52f63;--seen-bg:#fff7fa;--seen-ink:#9b5574}
.problem-text [data-phase="3"],.problem-text [data-phase="4"]{--focus-bg:#fff7d9;--focus-edge:#e0b52f;--focus-ink:#806000;--seen-bg:#fffbed;--seen-ink:#897329}
.problem-text .role-one{color:#286e9f;background:#edf7fd}
.problem-text .role-count{color:#ad3f70;background:#fff2f7}
.problem-text .role-total{color:#876400;background:#fff8df}
.qnum{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border:2px solid #b8c9d6;border-radius:50%;font-size:.86em;font-weight:1000;margin-right:3px;color:#36566f;background:#fff}
.problem-text ruby{ruby-position:over}.problem-text rt{font-size:.5em;font-weight:700;color:#58748a}
.source-hint{margin-top:auto;padding-top:12px;font-size:14px;font-weight:900;color:#567188}
.source-hint span{display:inline-block;border-radius:99px;padding:5px 10px;background:#eef4f8}
.visual-area{min-width:0;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 2px;overflow:hidden}
.visual{display:block;width:100%;height:auto;max-height:calc(100vh - 405px);flex:1 1 auto;min-height:0;overflow:visible}
.math-panel{width:min(100%,760px);min-height:98px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 12px 8px;border:2px solid #dce8f1;border-radius:16px;background:#fbfdff;box-shadow:0 3px 9px rgba(37,65,91,.05);text-align:center}
.math-panel.empty{visibility:hidden;min-height:0;height:0;padding:0;border:0}
.math-caption{font-size:13px;font-weight:900;color:#60788d;line-height:1.1}
.math-role-row{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:4px;width:min(420px,100%);font-size:12px;font-weight:900;color:#59738a}
.math-role-row span:first-child{color:var(--blue-dark)}.math-role-row span:last-child{color:var(--pink-dark)}
.math-expression{display:flex;align-items:center;justify-content:center;gap:clamp(7px,1.7vw,17px);font-size:clamp(27px,3vw,39px);font-weight:1000;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.math-token{display:inline-flex;min-width:34px;justify-content:center;align-items:center}
.math-token.one-number{color:var(--blue-dark)}.math-token.count-number{color:var(--pink-dark)}
.math-op{color:#526b80;font-weight:900}
.math-equals{color:#526b80;opacity:0;animation:mathReveal .35s ease-out .55s forwards}
.math-answer{display:inline-flex;min-width:48px;justify-content:center;color:var(--yellow-dark);background:var(--yellow-pale);border:2px solid #e2bd48;border-radius:11px;padding:2px 9px;opacity:0;transform:scale(.78);animation:mathReveal .48s cubic-bezier(.2,.8,.2,1) .85s forwards}
.math-reading{font-size:clamp(16px,1.7vw,21px);font-weight:1000;color:var(--yellow-dark);opacity:0;animation:mathReveal .4s ease-out 1.42s forwards;letter-spacing:.08em}
.math-unit-answer{font-size:clamp(19px,2vw,25px);font-weight:1000;color:var(--yellow-dark);background:var(--yellow-pale);border:2px solid #e2bd48;border-radius:12px;padding:2px 16px;opacity:0;animation:mathReveal .4s ease-out 1.95s forwards}
.math-panel.expression-only .math-expression .math-token:first-child{animation:tokenReveal .32s ease-out .05s both}
.math-panel.expression-only .math-expression .math-op{animation:tokenReveal .32s ease-out .3s both}
.math-panel.expression-only .math-expression .math-token:last-child{animation:tokenReveal .32s ease-out .55s both}
@keyframes mathReveal{to{opacity:1;transform:scale(1)}}
@keyframes tokenReveal{from{opacity:0;transform:translateY(8px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
.stage-foot{border-top:1px solid #edf1f4;min-height:72px;padding:10px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.navleft{display:flex;align-items:center;gap:13px}
.progress{display:flex;align-items:center;gap:5px;min-width:130px;max-width:190px;flex-wrap:nowrap}
.pip{width:7px;height:7px;flex:0 0 7px;border-radius:99px;background:#dce5ec;transition:.2s}
.pip.done{background:#9bbbd2}.pip.active{width:17px;flex-basis:17px;background:#294b6a}
.navbtn{border:0;border-radius:14px;min-width:140px;padding:12px 22px;background:#294b6a;color:white;font-size:16px;font-weight:950;cursor:pointer;box-shadow:0 3px 0 #1a3954;transition:transform .12s}
.navbtn.back{min-width:100px;background:#edf3f7;color:#526d83;box-shadow:0 3px 0 #d7e2ea}
.navbtn:active,.tab:active,.sound:active{transform:scale(.98)}
.navbtn:focus-visible,.tab:focus-visible,.sound:focus-visible{outline:4px solid #f1c35b;outline-offset:3px}
.problem-text .phase-focus:focus{outline:3px solid #294b6a}
.footer-note{font-size:12px;color:#8595a3;text-align:center;flex:1}
/* SVG scene styles */
.old-frame{fill:var(--pink-pale);fill-opacity:.5;stroke:var(--pink);stroke-width:5;stroke-dasharray:12 8}
.new-frame{fill:var(--pink-pale);fill-opacity:.38;stroke:var(--pink);stroke-width:7}
.all-frame{fill:var(--yellow-pale);fill-opacity:.42;stroke:var(--yellow);stroke-width:7}
.item-in{opacity:0;animation:softAppear .56s cubic-bezier(.2,.8,.2,1) var(--delay,0s) forwards;transform-box:fill-box;transform-origin:center}
.slide-in{opacity:0;animation:slideInto .72s cubic-bezier(.18,.82,.22,1) .05s forwards;transform-box:fill-box;transform-origin:center}
.old-dim{animation:dimOld .42s ease-out forwards}
.focus-pulse{animation:gentlePulse 1.05s ease-in-out .2s 2;transform-box:fill-box;transform-origin:center}
.item-in.focus-pulse{animation:softAppear .56s cubic-bezier(.2,.8,.2,1) var(--delay,0s) forwards,gentlePulse 1.05s ease-in-out .8s 2;transform-box:fill-box;transform-origin:center}
.frame-in.focus-pulse{animation:frameIn .55s ease-out both,gentlePulse 1.05s ease-in-out .6s 2;transform-box:fill-box;transform-origin:center}
.wheel-pop.focus-pulse{animation:wheelPop .38s cubic-bezier(.2,.8,.2,1) var(--delay,0s) forwards,gentlePulse 1.05s ease-in-out .6s 2;transform-box:fill-box;transform-origin:center}
.frame-in{animation:frameIn .55s ease-out both}
.label-in{opacity:0;animation:labelIn .5s .2s ease-out forwards}
.number-in{opacity:0;animation:numberIn .56s .55s cubic-bezier(.2,.8,.2,1) forwards;transform-box:fill-box;transform-origin:center}
.wheel-pop{opacity:0;animation:wheelPop .38s cubic-bezier(.2,.8,.2,1) var(--delay,0s) forwards;transform-box:fill-box;transform-origin:center}
@keyframes softAppear{0%{opacity:0;transform:translateY(25px) scale(.78)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideInto{0%{opacity:0;transform:translate(125px,-28px) scale(.76)}72%{opacity:1;transform:translate(-7px,2px) scale(1.03)}100%{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes dimOld{to{opacity:.25;filter:saturate(.55)}}
@keyframes gentlePulse{0%,100%{filter:drop-shadow(0 0 0 rgba(239,177,47,0))}50%{filter:drop-shadow(0 0 12px rgba(239,177,47,.9))}}
@keyframes frameIn{from{opacity:0;stroke-dasharray:5 20}to{opacity:1}}

@keyframes numberIn{from{opacity:0;transform:scale(.62)}to{opacity:1;transform:scale(1)}}

/* 追加の自動車：車体を先に置き、４つのタイヤが四方から集まる */

.tire-spark{opacity:0;transform-box:fill-box;transform-origin:center;animation:sparkPop .32s cubic-bezier(.2,.8,.2,1) var(--delay,0s) both}
.reduced-wheel-fallback{display:none}
@keyframes chassisLand{0%{opacity:0;transform:translateY(23px) scale(.82)}72%{opacity:1;transform:translateY(-4px) scale(1.035)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes mountGuide{to{opacity:.85}}
@keyframes trailAppear{0%{opacity:0;stroke-dashoffset:45}25%{opacity:.45}100%{opacity:0;stroke-dashoffset:0}}

 tickGain.gain.linearRampToValueAtTime(.014,when+.014);
 tickGain.gain.exponentialRampToValueAtTime(.0001,when+.065);
 tick.connect(tickGain);tickGain.connect(ctx.destination);tick.start(when+.006);tick.stop(when+.075);
}
function playTireAssemblySound(carCount=1){
 if(!fxEnabled)return;
 const AudioCtx=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtx)return;
 try{
  if(!fxAudioContext)fxAudioContext=new AudioCtx();
  if(fxAudioContext.state==='suspended')fxAudioContext.resume().catch(()=>{});
  const now=fxAudioContext.currentTime+.035;
  for(let car=0;car<carCount;car++){
   for(let i=0;i<4;i++){
    const delay=car*.34+.12+i*.105;
    softNoiseWhoosh(fxAudioContext,now+delay,.18);
    softRubberPop(fxAudioContext,now+delay+.68,i);
   }
  }
 }catch(e){/* 音声機能が使えない端末でも学習は続けられる */}
}
function applyFxMode(){
 const button=$('#fxToggle');
 button.textContent=`効果音：${fxEnabled?'ON':'OFF'}`;
 button.setAttribute('aria-pressed',fxEnabled?'true':'false');
 button.title=fxEnabled?'動きに合わせて効果音を鳴らします。押すとOFF':'効果音はOFFです。押すとON';
 try{if(window.localStorage)window.localStorage.setItem('fueru-fx',fxEnabled?'on':'off');}catch(e){}
}
function goNext(){
 const wasCars=problems[problemIndex].key==='cars';
 const wasAtUnit=stage===0;
 const wasAtOldEquation=stage===4;
 stage=stage<steps.length-1?stage+1:0;
 if(wasCars&&wasAtUnit&&stage===1)playTireAssemblySound(5);
 else if(wasCars&&wasAtOldEquation&&stage===5)playTireAssemblySound(1);
 render();
}
function goBack(){if(stage>0){stage--;render();}}
$('#nextBtn').addEventListener('click',goNext);
$('#backBtn').addEventListener('click',goBack);
// 左右の矢印キーでも、画面の「つぎへ」「もどる」と同じ操作ができる。
// 入力欄などを操作している場合は、キー入力を横取りしない。
document.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||event.repeat) return;
 const target=event.target;
 const tag=target&&target.tagName?target.tagName.toLowerCase():'';
 if(['input','textarea','select'].includes(tag)||(target&&target.isContentEditable)) return;
 if(event.key==='ArrowRight'){
  event.preventDefault();goNext();
 }else if(event.key==='ArrowLeft'){
  event.preventDefault();goBack();
 }
});
// 表示領域の高さから文字・余白の倍率を決め、横長画面に収める。
function updateFitScale(){
 const h=window.innerHeight||document.documentElement.clientHeight||768;
 const scale=Math.max(.68,Math.min(1,(h-430)/338));
 document.documentElement.style.setProperty('--fit-scale',scale.toFixed(3));
}
window.addEventListener('resize',updateFitScale,{passive:true});
updateFitScale();
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{problemIndex=Number(b.dataset.problem);stage=0;render();if('speechSynthesis'in window)window.speechSynthesis.cancel();}));
function applyColorMode(){
 document.body.classList.toggle('color-off',!colorAssist);
 const button=$('#colorToggle');
 button.textContent=`色わけ：${colorAssist?'ON':'OFF'}`;
 button.setAttribute('aria-pressed',colorAssist?'true':'false');
 button.title=colorAssist?'教科書の色分けを表示中。押すとOFF':'色分けを消しています。押すとON';
 try{if(window.localStorage)window.localStorage.setItem('fueru-color-assist',colorAssist?'on':'off');}catch(e){}
}
$('#colorToggle').addEventListener('click',()=>{colorAssist=!colorAssist;applyColorMode();});
$('#fxToggle').addEventListener('click',()=>{fxEnabled=!fxEnabled;applyFxMode();});
$('#soundBtn').addEventListener('click',speak);
applyColorMode();
applyFxMode();
render();
</script>
