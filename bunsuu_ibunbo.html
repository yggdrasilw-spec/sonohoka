<style>
*{box-sizing:border-box}

.b.g{background:#64748b}.b:focus-visible,input:focus-visible{outline:3px solid #f59e0b}

button{min-height:44px}button:focus-visible,select:focus-visible{outline:4px solid #a16207;outline-offset:3px}
#dots{display:block;margin:12px 0}#course{font:inherit;width:100%;padding:10px;border:2px solid #64748b;border-radius:8px;background:white}

</style></head><body>
<div id="app">
<div class="top"><h1>分数の たし算・ひき算 <small>（分母が ちがうとき）</small></h1><button class="b g" onclick="nl()" style="padding:6px 12px;font-size:15px">📏 数直線ずかん</button></div>
<div id="dots"></div><p id="progress"></p><h2 id="t" tabindex="-1"></h2><div class="help"><button class="b g" onclick="jump(0)">分数の はじめに もどる</button> <button class="b g" onclick="replay()">この 画面を もういちど</button></div><div id="c"></div>
<div class="nav"><button class="b g" id="pv" onclick="prev()">◀ もどる</button><button class="b" id="nt" onclick="nxt()">つぎへ ▶</button></div>
</div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="数直線ずかん" onclick="if(event.target==this)nl(0)"><div>
<div class="top"><b>📏 数直線ずかん（分母 2〜10）</b><button class="b g" onclick="nl(0)" style="padding:6px 12px;font-size:15px">とじる ✕</button></div>
<p style="font-size:15px;margin:2px 0">目もりを タップしてね。2つ えらぶと 大きさを くらべられるよ。</p>
<p><label>分母 <select id="nd" onchange="numberOptions()"></select></label> <label>分子 <select id="nk"></select></label> <button class="b" onclick="pick(+$('#nk').value,+$('#nd').value)">この 分数を えらぶ</button></p>
<div style="overflow-x:auto"><svg id="nls" style="min-width:660px" viewBox="0 0 720 400" role="img" aria-label="0から1の数直線。分母2から10の分数を比較します。分数は上の選択欄からも選べます。"></svg></div><div id="nlr" aria-live="polite"></div>
<button class="b g" onclick="sel=[];draw()" style="padding:6px 12px;font-size:15px">えらびなおし</button>
</div></div>
<script>
const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n),
gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b,
fr=(a,b)=>`<span class=fr><b>${a}</b><u>${b}</u></span>`,
C={B:'#38bdf8',O:'#fb923c',P:'#4ade80',G:'repeating-linear-gradient(45deg,#94a3b8 0 4px,#fff 4px 8px)'},
bar=(d,s,l='')=>{let h='',i=0;for(const[n,c]of s)for(let j=0;j<n;j++)h+=`<i style="--i:${i++};background:${C[c]}"></i>`;for(;i<d;i++)h+='<i></i>';return`<div class=row role=img aria-label="全体を${d}等分。色のついた部分は${s.reduce((v,x)=>v+x[0],0)}こ分"><span class=lb aria-hidden=true>${l}</span><div class=bar aria-hidden=true>${h}</div></div>`},
B=(d,a,l)=>bar(d,[[a,'B']],l),O=(d,a,l)=>bar(d,[[a,'O']],l),
mk=p=>`<em class=mk style="left:calc(64px + (100% - 64px)*${p})"></em>`,
eq=h=>`<div class=eq>${h}</div>`,
ch=(n,hi)=>`<b>${n}の倍数</b><div class=chips>${[...Array(8)].map((_,i)=>`<span class="${hi.includes(n*(i+1))?'hi':''}">${n*(i+1)}</span>`).join('')}</div>`,
qz=(t,o,a)=>`<p>${t}</p>${o.map(x=>`<button class="b g" data-v=${x} onclick="qa(this,${x==a})">${x}</button>`).join(' ')}`;
function qa(b,t){b.textContent=b.dataset.v+(t?' ◯ せいかい！':' ✕ もういちど');b.style.background=t?'#16a34a':'#dc2626'}
const nb=(l,a)=>`<p><button class="b g" onclick="sel=${a};nl()">📏 ${l}</button></p>`;
const MS={},MT={},mi=r=>r.querySelectorAll('.mo').forEach(mr),
cl=(F,k,f,nf)=>[...Array(F)].map((_,i)=>{const n=nf(i);return`<s class="${f(i)}${(i+1)%k==0?' e':''}" style="--i:${n};--j:${i}"${n?` data-n="${n}"`:''}></s>`}).join(''),
ctl=id=>`<div class="eq"></div><p class="mc"></p><div class="ct"><button class="b g" onclick="mstep('${id}',-1)" aria-label="ひとつ前の変化">◀</button> <button class="b" onclick="mstep('${id}',1)">▶ つぎの へんか</button> <button class="b g" onclick="mall('${id}')">▶▶ ぜんぶ 見る</button> <button class="b g" onclick="mstep('${id}',-9)" aria-label="図をはじめから">↺ はじめから</button></div>`,
mu=(v,k)=>k>1?`${v}×${k}`:v;
function mo(id,a,b,k,d){const F=d>0?b*k:b,SF=d>0?a*k:a,C=F/k,P=SF/F*100;
return`<div class="mo" id="${id}" data-t="m" data-mx="3" data-a="${a}" data-b="${b}" data-k="${k}" data-d="${d}"><div class="mb">${cl(F,k,i=>i<SF?'x':'',d>0?(i=>i<SF?i+1:0):(i=>i<SF&&(i+1)%k==0?(i+1)/k:0))}<em class="hg" style="width:${100/C}%"></em><em class="mkr" style="left:${P}%"></em><em class="br" style="width:${P}%"><b></b></em></div>${ctl(id)}</div>`}
function ad(id,a,b,c,e,op,s0){const L=lcm(b,e),k1=L/b,k2=L/e,x=a*k1,y=c*k2,n=op=='a'?x+y:x-y,g=gcd(n,L),K=g>1?g:1e9;
if(s0!=null&&MS[id]==null)MS[id]=s0;
const rw=(q,f,nf,k)=>`<div class="rw ${q}"><span class="rl"></span><div class="mb">${cl(L,k,f,nf)}</div></div>`;
return`<div class="mo ad" id="${id}" data-t="a" data-mx="${g>1?5:4}" data-a="${a}" data-b="${b}" data-c="${c}" data-e="${e}" data-op="${op}" style="--dx:${(x-y)*100}%">${rw('r1',i=>i<x?'x':'',i=>i<x?i+1:0,k1)}${rw('r2',i=>i<y?'y':'',i=>i<y?i+1:0,k2)}${rw('r3',i=>i<(op=='a'?x:n)?'x':i<n?'y':'',i=>i<n?i+1:0,K)}${ctl(id)}</div>`}
function mstep(id,v){clearTimeout(MT[id]);const el=$('#'+id);if(!el)return;MS[id]=v==-9?0:Math.max(0,Math.min(+el.dataset.mx,(MS[id]||0)+v));el.querySelectorAll('.mb').forEach(m=>m.classList.add('pl'));mr(el)}
function mall(id){clearTimeout(MT[id]);mstep(id,-9);const t=()=>{const el=$('#'+id);if(el&&(MS[id]||0)<+el.dataset.mx)MT[id]=setTimeout(()=>{mstep(id,1);t()},2600)};t()}
function mr(el){const s=MS[el.id]||0,bt=el.querySelectorAll('.ct button');el.dataset.s=s;el.dataset.t=='a'?m2(el):m1(el);bt[0].disabled=!s;bt[1].disabled=s>=+el.dataset.mx}
function m1(el){const[a,b,k,d]=['a','b','k','d'].map(x=>+el.dataset[x]),F=d>0?b*k:b,SF=d>0?a*k:a,C=F/k,SC=SF/k,s=+el.dataset.s,mb=el.querySelector('.mb'),
H=(t,c)=>`<span class="hl ${c}">${t}</span>`,o=d>0?'×':'÷',nu=`${a}${o}${k}`,de=`${b}${o}${k}`;
mb.classList.toggle('fi',d>0?s>0:s<3);mb.classList.toggle('gr',d>0||s>0);mb.classList.toggle('nn',s>1);
el.querySelector('.br b').textContent=`${a}${o}${k}＝${d>0?SF:SC}こ`;
el.querySelector('.eq').innerHTML=[fr(a,b),`全体は ${b}${o}${k}＝${F/k*(d>0?k:1)} こ分`, `色は ${a}${o}${k}＝${d>0?SF:SC} こ分`,`${fr(a,b)}＝${fr(nu,de)}＝${d>0?fr(SF,F):fr(SC,C)}`][s];
el.querySelector('.mc').innerHTML=(d>0?[
`まず ${fr(a,b)}。バーを ${b}等分して、${a}こ分に 色を ぬったよ。`,
`分母に <b>×${k}</b>。1つぶんを ${k}こに 切り分けると、ぜんぶで ${b}×${k}＝<b>${F}こ</b> に ふえたよ。色の 長さ（赤い線）は かわらない。`,
`色の ぶぶんも 1つぶんが ${k}こずつに なったよ。ぜんぶで ${a}×${k}＝<b>${SF}こ</b>。<b>分子にも ×${k}</b> を したのと 同じだね！`,
`赤い線の 位置は ずっと 同じ。だから 大きさは かわらず ${fr(a,b)}＝${fr(SF,F)}。`
]:[
`まず ${fr(a,b)}。バーを ${b}等分して、${a}こ分に 色を ぬったよ。`,
`分母を <b>÷${k}</b>。${k}こずつ ひとまとまりに すると、${b}÷${k}＝<b>${C}こ</b> の まとまりに なるよ。`,
`色の ぶぶんも ${k}こずつ まとまって、${a}÷${k}＝<b>${SC}こ</b>。<b>分子も ÷${k}</b> を したのと 同じだね！`,
`赤い線の 位置は ずっと 同じ。だから 大きさは かわらず ${fr(a,b)}＝${fr(SC,C)}。分母が 小さく なったね。`
])[s]}
function m2(el){const[a,b,c,e]=['a','b','c','e'].map(x=>+el.dataset[x]),A=el.dataset.op=='a',L=lcm(b,e),k1=L/b,k2=L/e,x=a*k1,y=c*k2,n=A?x+y:x-y,g=gcd(n,L),s=+el.dataset.s,sy=A?'＋':'−',
R=['.r1','.r2','.r3'].map(q=>el.querySelector(q)),T=(r,k,v)=>r.querySelector('.mb').classList.toggle(k,!!v),v3=s>=(A?3:4),lb=(r,h)=>r.querySelector('.rl').innerHTML=h;
[R[0],R[1]].forEach(r=>{T(r,'gr',1);T(r,'fi',s>0);T(r,'nn',s>1)});
R[2].classList.toggle('hd',!v3);T(R[2],'fi',v3&&s<5);T(R[2],'gr',s>4);T(R[2],'mg',s>4);T(R[2],'nn',v3&&s<5);
el.classList.toggle('tk',!A&&s>2);
lb(R[0],s?fr(x,L):fr(a,b));lb(R[1],s?fr(y,L):fr(c,e));lb(R[2],s>4?fr(n/g,L/g):fr(n,L));
el.querySelector('.eq').innerHTML=[
`${fr(a,b)}${sy}${fr(c,e)}`,
`${fr(a,b)}＝${fr(mu(a,k1),mu(b,k1))}　${fr(c,e)}＝${fr(mu(c,k2),mu(e,k2))}`,
`${fr(x,L)}${sy}${fr(y,L)}`,
`${fr(x,L)}${sy}${fr(y,L)}＝${fr(`${x}${A?'+':'−'}${y}`,L)}`,
`${fr(x,L)}${sy}${fr(y,L)}＝${fr(n,L)}`,
`${fr(n,L)}＝${fr(`${n}÷${g}`,`${L}÷${g}`)}＝${fr(n/g,L/g)}`][s];
el.querySelector('.mc').innerHTML=[
`${fr(a,b)} と ${fr(c,e)}。1つぶんの 大きさが ちがうから、そのままでは ${A?'たせない':'ひけない'}ね。`,
`分母 ${b} と ${e} の 最小公倍数は <b>${L}</b>。${k1>1?`${b}→${L} は ×${k1}`:`${b}は そのまま`}、${k2>1?`${e}→${L} は ×${k2}`:`${e}は そのまま`}。1つぶんを 切り分けて ${L}こに そろえるよ（<b>通分</b>）。`,
`${fr(1,L)} を 1つぶんと すると、${fr(a,b)} は <b>${x}こ</b>、${fr(c,e)} は <b>${y}こ</b>。`,
A?`${x}こ と ${y}こを あわせると、${x}＋${y}＝<b>${n}こ</b>。`:`${x}こ から ${y}こ（オレンジ色の ぶぶん）を とるよ。`,
A?`答えは ${fr(1,L)} が ${n}こ分。だから ${fr(n,L)}。`:`のこりは ${x}－${y}＝<b>${n}こ</b>。答えは ${fr(n,L)}。`,
`${fr(n,L)} は 約分できるよ。${g}こずつ ひとまとまりに すると ${fr(n/g,L/g)}。分母を 小さく しよう。`][s]}

const S=[
{t:'① 分母が 同じなら たせるけど…',p:[
`<p>まず ふくしゅう。<span class=k>分母が 同じ</span> 分数は たし算 できたよね。</p>${B(5,1,fr(1,5))}${O(5,2,fr(2,5))}<p>どちらも ${fr(1,5)} が いくつ分か で 表せるよ。</p>`,
`<p>2つの バーを つなげると…</p>${bar(5,[[1,'B'],[2,'O']],fr(3,5))}${eq(`${fr(1,5)} が　1こ ＋ 2こ ＝ 3こ`)}${eq(`${fr(1,5)}＋${fr(2,5)}＝${fr('1+2',5)}＝${fr(3,5)}`)}<p class=ok>1つぶんの 大きさが 同じ だから、分子だけ たせば いいんだね。</p>`,
`<p>では、<span class=k>分母が ちがう</span> ときは どうかな？<br>牛にゅうが ${fr(1,2)}L と ${fr(1,3)}L あります。あわせると なんL？</p>${B(2,1,fr(1,2))}${O(3,1,fr(1,3))}`,
`<p>2つの バーを くらべてみて。さっきと ちがって <span class=k>1つぶんの 大きさ</span>が ちがうよね。<br>分母（ぶんぼ）が ちがうと、そのままでは たせないんだ。</p>`,
