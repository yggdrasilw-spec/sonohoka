<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「ばい」のお勉強シミュレーター - 快適操作版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Yusei+Magic&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kosugi Maru', sans-serif;
            background-color: #f0fdf4;
            user-select: none;
            overflow-x: hidden;
        }
        
        .header-title {
            font-family: 'Yusei Magic', sans-serif;
        }

        /* アニメーション定義 */
        @keyframes convey {
            0% { transform: translateX(-30%) scale(0.6); opacity: 0; }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }
        .animate-convey { animation: convey 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* 「もとの部屋」が光るアニメーション（スキャン中の演出） */
        @keyframes glowFrame {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); border-color: #f9a8d4; }
            50% { box-shadow: 0 0 22px 6px rgba(244, 63, 94, 0.55); border-color: #f43f5e; }
        }
        .animate-glow { animation: glowFrame 0.32s ease-in-out 2; }

        /* 「ばいの部屋」の枠・中身が光るアニメーション（コピー完了の演出） */
        @keyframes glowFramePurple {
            0%, 100% { box-shadow: 0 0 0 0 rgba(147, 51, 234, 0); border-color: #d8b4fe; }
            50% { box-shadow: 0 0 22px 6px rgba(147, 51, 234, 0.6); border-color: #9333ea; }
        }
        .animate-glow-purple { animation: glowFramePurple 0.32s ease-in-out 2; }

        /* コピー機に吸い込まれる「複製」のクローン要素用 */
        .fly-clone {
            position: absolute;
            z-index: 50;
            margin: 0;
            pointer-events: none;
            transform-origin: center center;
            transition: transform 0.5s cubic-bezier(0.55, 0, 0.85, 0.35), opacity 0.45s ease-in 0.05s;
        }

        /* =========================================
           リボン ⇔ テープ ⇔ 線分図 のモーフィングCSS
        ========================================= */
        #ribbon-container {
            display: flex;
            align-items: flex-end; /* 線分図の基準を下に合わせるため */
            height: 120px;
            width: 100%;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .segment {
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left center;
            opacity: 1; /* 静的表示を基本にするためデフォルトは1 */
        }

        /* 内部の表現レイヤー */
        .layer-ribbon, .layer-tape, .layer-line {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- モード：リボン (具体) --- */
        #ribbon-container[data-mode="ribbon"] .segment { height: 48px; margin-bottom: 30px;}
        #ribbon-container[data-mode="ribbon"] .layer-ribbon { 
            opacity: 1; 
            background: linear-gradient(135deg, #fca5a5 0%, #f43f5e 100%);
            border-top: 3px solid #e11d48;
            border-bottom: 3px solid #e11d48;
            border-right: 2px dashed #fda4af;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        /* リボンの端の丸み */
        #ribbon-container[data-mode="ribbon"] .segment:first-child .layer-ribbon { border-top-left-radius: 8px; border-bottom-left-radius: 8px; border-left: 3px solid #e11d48;}
        #ribbon-container[data-mode="ribbon"] .segment:last-child .layer-ribbon { border-top-right-radius: 8px; border-bottom-right-radius: 8px; border-right: 3px solid #e11d48;}

        /* --- モード：テープ図 (半具体) --- */
        #ribbon-container[data-mode="tape"] .segment { height: 36px; margin-bottom: 30px;}
        #ribbon-container[data-mode="tape"] .layer-tape { 
            opacity: 1; 
            background: #bae6fd; /* light blue */
            border: 2px solid #0284c7; 
            margin-right: -2px; /* 境界線を重ねる */
        }

        /* --- モード：線分図 (抽象) --- */
        #ribbon-container[data-mode="line"] .segment { height: 4px; margin-bottom: 30px;}
        #ribbon-container[data-mode="line"] .layer-line { 
            opacity: 1; 
            background: #1e293b; /* slate-800 */
        }
        
        /* 線分図の目盛り (右端に立てる) */
        .tick-mark {
            position: absolute;
            right: 0;
            top: -12px;
            width: 2px;
            height: 28px;
            background-color: #1e293b;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        /* 0の目盛り (最初のセグメントの左端) */
        .tick-mark-zero {
            position: absolute;
            left: 0;
            top: -12px;
            width: 2px;
            height: 28px;
            background-color: #1e293b;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #ribbon-container[data-mode="line"] .tick-mark,
        #ribbon-container[data-mode="line"] .tick-mark-zero { opacity: 1; }

        /* ラベル類 */
        .label-top, .label-bottom {
            position: absolute;
            right: 0;
            transform: translateX(50%);
            white-space: nowrap;
            transition: all 0.4s ease;
            opacity: 0;
            font-weight: bold;
        }
        
        .label-top-zero, .label-bottom-zero {
            position: absolute;
            left: 0;
            transform: translateX(-50%);
            white-space: nowrap;
            transition: all 0.4s ease;
            opacity: 0;
            font-weight: bold;
        }

        .label-top { top: -35px; color: #db2777; font-size: 14px;}
        .label-bottom { bottom: -30px; color: #7e22ce; font-size: 14px;}
        .label-top-zero { top: -35px; color: #64748b; font-size: 14px;}
        .label-bottom-zero { bottom: -30px; color: #64748b; font-size: 14px;}

        /* テープと線分図のときにラベルを表示 */
        #ribbon-container[data-mode="tape"] .label-bottom,
        #ribbon-container[data-mode="line"] .label-top,
        #ribbon-container[data-mode="line"] .label-bottom,
        #ribbon-container[data-mode="line"] .label-top-zero,
        #ribbon-container[data-mode="line"] .label-bottom-zero {
            opacity: 1;
        }

        /* 1つ分の長さを表す注釈 */
        .base-annotation {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #db2777;
            opacity: 0;
            transition: opacity 0.4s ease;
            white-space: nowrap;
        }
        #ribbon-container[data-mode="tape"] .segment:first-child .base-annotation { opacity: 1; top: -20px; }
        #ribbon-container[data-mode="ribbon"] .segment:first-child .base-annotation { opacity: 1; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-2 md:p-6">

    <div class="max-w-5xl w-full bg-white rounded-3xl shadow-xl border-4 border-emerald-300 p-4 md:p-6 flex flex-col justify-between" style="min-height: 720px;">
        
        <!-- ヘッダーとタブ -->
        <div>
            <div class="flex flex-col lg:flex-row justify-between items-center border-b-4 border-dashed border-gray-200 pb-4 mb-4">
                <div class="text-center lg:text-left mb-3 lg:mb-0">
                    <h1 class="header-title text-3xl md:text-4xl text-orange-500 flex items-center justify-center lg:justify-start gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-yellow-400"></i>
                        「ばい」のお勉強シミュレーター
                    </h1>
                    <p class="text-xs md:text-sm text-gray-500 mt-1">「いくつ分（個数）」と「長さ（図）」を自由にえらんで、九九のいみをかんぺきにしよう！</p>
                </div>
                
                <!-- タブ切り替え -->
                <div class="flex bg-gray-100 rounded-2xl p-1 gap-1 flex-wrap justify-center shadow-inner">
                    <button onclick="switchTab('copier')" id="tab-copier" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm md:text-base transition-all duration-300 bg-white text-orange-600 shadow-md border border-orange-100">
                        <i class="fa-solid fa-apple-whole mr-1"></i> ふしぎなコピーき (こ数)
                    </button>
                    <button onclick="switchTab('ribbon')" id="tab-ribbon" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm md:text-base transition-all duration-300 text-gray-500 hover:bg-white/50 border border-transparent">
                        <i class="fa-solid fa-ruler-horizontal mr-1"></i> リボンとテープ図 (長さ)
                    </button>
                </div>
            </div>

            <!-- コントロールパネル（設定エリア） -->
            <div class="bg-blue-50/50 rounded-2xl p-3 md:p-4 border-2 border-blue-100 mb-4 flex flex-col xl:flex-row gap-4 items-center justify-around">
                
                <!-- 1. キャラクター/アイテムの選択 -->
                <div class="flex flex-col items-center">
                    <span class="text-[10px] md:text-xs font-bold text-blue-700 bg-blue-100 px-2 py-0.5 rounded-full mb-1">あいてむ</span>
                    <div class="flex gap-1">
                        <button onclick="changeItem('apple_small')" id="item-apple_small" class="item-btn w-9 h-9 rounded-full border-2 border-orange-400 bg-white flex items-center justify-center transition-all shadow-md scale-110" title="小さいリンゴがもと">
                            <span class="leading-none" style="font-size: 11px;">🍎</span>
                        </button>
                        <button onclick="changeItem('apple_big')" id="item-apple_big" class="item-btn w-9 h-9 rounded-full border-2 border-transparent bg-white flex items-center justify-center transition-all shadow-md" title="大きいリンゴがもと">
                            <span class="leading-none" style="font-size: 22px;">🍎</span>
                        </button>
                        <button onclick="changeItem('star')" id="item-star" class="item-btn w-9 h-9 rounded-full border-2 border-transparent bg-white text-lg flex items-center justify-center transition-all shadow-md">⭐</button>
                        <button onclick="changeItem('fish')" id="item-fish" class="item-btn w-9 h-9 rounded-full border-2 border-transparent bg-white text-lg flex items-center justify-center transition-all shadow-md">🐟</button>
                        <button onclick="changeItem('car')" id="item-car" class="item-btn w-9 h-9 rounded-full border-2 border-transparent bg-white text-lg flex items-center justify-center transition-all shadow-md">🚗</button>
                    </div>
                </div>

                <!-- 2. もとの大きさ（基準量 1〜9） -->
                <div class="flex flex-col items-center w-full sm:w-auto">
                    <span class="text-[10px] md:text-xs font-bold text-pink-700 bg-pink-100 px-2 py-0.5 rounded-full mb-1">もとの 大きさ（１つ分）</span>
                    <div class="grid grid-cols-5 sm:grid-cols-9 gap-1 w-full justify-center">
                        <button onclick="changeBase(1)" id="base-1" class="base-btn px-2.5 py-1.5 text-xs md:text-sm bg-white border border-pink-200 text-pink-700 font-bold rounded-md transition-all shadow-sm">1<span class="text-[10px] ml-0.5 font-normal" id="base-unit-btn-1">こ</span></button>
                        <button onclick="changeBase(2)" id="base-2" class="base-btn px-2.5 py-1.5 text-xs md:text-sm bg-pink-500 text-white font-bold rounded-md transition-all shadow-md scale-105">2<span class="text-[10px] ml-0.5 font-normal" id="base-unit-btn-2">こ</span></button>
                        <button onclick="changeBase(3)" id="base-3" class="base-btn px-2.5 py-1.5 text-xs md:text-sm bg-white border border-pink-200 text-pink-700 font-bold rounded-md transition-all shadow-sm">3<span class="text-[10px] ml-0.5 font-normal" id="base-unit-btn-3">こ</span></button>
                        <button onclick="changeBase(4)" id="base-4" class="base-btn px-2.5 py-1.5 text-xs md:text-sm bg-white border border-pink-200 text-pink-700 font-bold rounded-md transition-all shadow-sm">4<span class="text-[10px] ml-0.5 font-normal" id="base-unit-btn-4">こ</span></button>
                        <button onclick="changeBase(5)" id="base-5" class="base-btn px-2.5 py-1.5 text-xs md:text-sm bg-white border border-pink-200 text-pink-700 font-bold rounded-md transition-all shadow-sm">5<span class="text-[10px] ml-0.5 font-normal" id="base-unit-btn-5">こ</span></button>
                        <button onclick="changeBase(6)" id="base-6" class="base-btn px-2.5 py-1.5 text-xs md:text-sm bg-white border border-pink-200 text-pink-700 font-bold rounded-md transition-all shadow-sm">6<span class="text-[10px] ml-0.5 font-normal" id="base-unit-btn-6">こ</span></button>
                        <button onclick="changeBase(7)" id="base-7" class="base-btn px-2.5 py-1.5 text-xs md:text-sm bg-white border border-pink-200 text-pink-700 font-bold rounded-md transition-all shadow-sm">7<span class="text-[10px] ml-0.5 font-normal" id="base-unit-btn-7">こ</span></button>
                        <button onclick="changeBase(8)" id="base-8" class="base-btn px-2.5 py-1.5 text-xs md:text-sm bg-white border border-pink-200 text-pink-700 font-bold rounded-md transition-all shadow-sm">8<span class="text-[10px] ml-0.5 font-normal" id="base-unit-btn-8">こ</span></button>
                        <button onclick="changeBase(9)" id="base-9" class="base-btn px-2.5 py-1.5 text-xs md:text-sm bg-white border border-pink-200 text-pink-700 font-bold rounded-md transition-all shadow-sm">9<span class="text-[10px] ml-0.5 font-normal" id="base-unit-btn-9">こ</span></button>
                    </div>
                </div>

                <!-- 3. 何倍にするか（いくつ分 1〜9） -->
                <div class="flex flex-col items-center w-full sm:w-auto">
                    <span class="text-[10px] md:text-xs font-bold text-purple-700 bg-purple-100 px-2 py-0.5 rounded-full mb-1">なんばい に する？（いくつ分）</span>
                    <div class="grid grid-cols-5 sm:grid-cols-9 gap-1 w-full justify-center">
                        <button onclick="changeMultiplier(1)" id="mult-1" class="mult-btn px-2 py-1.5 text-xs md:text-sm bg-white border border-purple-200 text-purple-700 font-bold rounded-md transition-all shadow-sm">1倍</button>
                        <button onclick="changeMultiplier(2)" id="mult-2" class="mult-btn px-2 py-1.5 text-xs md:text-sm bg-white border border-purple-200 text-purple-700 font-bold rounded-md transition-all shadow-sm">2倍</button>
                        <button onclick="changeMultiplier(3)" id="mult-3" class="mult-btn px-2 py-1.5 text-xs md:text-sm bg-purple-500 text-white font-bold rounded-md transition-all shadow-md scale-105">3倍</button>
                        <button onclick="changeMultiplier(4)" id="mult-4" class="mult-btn px-2 py-1.5 text-xs md:text-sm bg-white border border-purple-200 text-purple-700 font-bold rounded-md transition-all shadow-sm">4倍</button>
                        <button onclick="changeMultiplier(5)" id="mult-5" class="mult-btn px-2 py-1.5 text-xs md:text-sm bg-white border border-purple-200 text-purple-700 font-bold rounded-md transition-all shadow-sm">5倍</button>
                        <button onclick="changeMultiplier(6)" id="mult-6" class="mult-btn px-2 py-1.5 text-xs md:text-sm bg-white border border-purple-200 text-purple-700 font-bold rounded-md transition-all shadow-sm">6倍</button>
                        <button onclick="changeMultiplier(7)" id="mult-7" class="mult-btn px-2 py-1.5 text-xs md:text-sm bg-white border border-purple-200 text-purple-700 font-bold rounded-md transition-all shadow-sm">7倍</button>
                        <button onclick="changeMultiplier(8)" id="mult-8" class="mult-btn px-2 py-1.5 text-xs md:text-sm bg-white border border-purple-200 text-purple-700 font-bold rounded-md transition-all shadow-sm">8倍</button>
                        <button onclick="changeMultiplier(9)" id="mult-9" class="mult-btn px-2 py-1.5 text-xs md:text-sm bg-white border border-purple-200 text-purple-700 font-bold rounded-md transition-all shadow-sm">9倍</button>
                    </div>
                </div>

                <!-- 4. 再生アクション -->
                <div>
                    <button onclick="runSimulationWithAnimation()" id="run-btn" class="px-5 py-3 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black rounded-xl shadow-lg flex items-center gap-2 text-base transition-all whitespace-nowrap border-b-4 border-emerald-700">
                        <i class="fa-solid fa-play"></i> はじめる！
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= シミュレーション描画領域 ================= -->
        <div id="sim-area" class="flex-grow border-4 border-dashed border-gray-200 rounded-3xl p-3 md:p-6 bg-slate-50 relative overflow-hidden flex flex-col justify-center items-center min-h-[250px]">
            
            <!-- ====== 案1: ふしぎなコピーき (離散量・個数) ====== -->
            <div id="view-copier" class="w-full flex flex-col justify-between items-center gap-4">
                <div class="w-full grid grid-cols-12 gap-2 items-center">
                    <!-- 左：もとの部屋 -->
                    <div id="copier-base-frame" class="col-span-3 bg-pink-50 border-4 border-pink-200 rounded-2xl p-2 md:p-4 flex flex-col items-center justify-center min-h-[180px] shadow-inner relative">
                        <span class="absolute top-1.5 left-1.5 text-[10px] bg-pink-400 text-white font-bold px-1.5 py-0.5 rounded">もと</span>
                        <div id="copier-base-items" class="grid w-full justify-items-center items-center mt-3 gap-1">
                            <!-- JSで生成 -->
                        </div>
                    </div>
                    
                    <!-- 中：ふしぎなコピーゲート -->
                    <div class="col-span-2 flex flex-col items-center justify-center">
                        <div id="copier-machine" class="w-full h-24 md:h-28 bg-gradient-to-b from-yellow-300 to-amber-500 rounded-xl border-4 border-amber-600 shadow-md flex flex-col items-center justify-center text-white font-extrabold relative overflow-hidden">
                            <span class="z-10 text-xs md:text-sm leading-tight text-center">ふしぎな<br>コピーき</span>
                            <div class="absolute inset-0 bg-white opacity-10"></div>
                            <div class="absolute bottom-0 w-full h-2 bg-red-500"></div>
                        </div>
                        <div class="text-xl md:text-2xl text-amber-500 mt-2">
                            <i class="fa-solid fa-right-long" id="copier-arrow"></i>
                        </div>
                    </div>
                    
                    <!-- 右：ばいの部屋 -->
                    <div id="copier-result-frame" class="col-span-7 bg-purple-50 border-4 border-purple-200 rounded-2xl p-2 md:p-4 flex flex-col items-center justify-center min-h-[180px] shadow-inner relative">
                        <span class="absolute top-1.5 left-1.5 text-[10px] bg-purple-400 text-white font-bold px-1.5 py-0.5 rounded">ばいの へや</span>
                        <div id="copier-result-container" class="grid w-full h-full p-1 items-stretch justify-items-center gap-1.5">
                            <!-- コピーされたグループがここに並ぶ -->
                        </div>
                    </div>
                </div>

                <!-- コピー完了後に表示する「もとの◯◯の◯倍の数は、◯こ」テキスト -->
                <div id="copier-multiple-text" class="min-h-[44px] flex items-center justify-center">
                    <span id="copier-multiple-text-inner" class="opacity-0 text-base md:text-xl font-black text-purple-700 bg-purple-50 border-2 border-purple-300 px-4 py-2 rounded-full shadow-sm"></span>
                </div>
            </div>

            <!-- ====== 案2: リボン・テープ・線分図 (連続量・長さ) ====== -->
            <div id="view-ribbon" class="w-full hidden flex-col justify-center items-center gap-2">
                
                <!-- 表示モード切り替えトグル (いつでも変更可能) -->
                <div id="ribbon-mode-controls" class="mb-4 flex bg-white rounded-full p-1 shadow-sm border border-gray-200 transition-opacity duration-300">
                    <button onclick="switchRibbonMode('ribbon')" id="rmode-ribbon" class="px-3 py-1.5 rounded-full text-xs md:text-sm font-bold bg-pink-100 text-pink-700 shadow-sm transition-all">🎀 リボン</button>
                    <button onclick="switchRibbonMode('tape')" id="rmode-tape" class="px-3 py-1.5 rounded-full text-xs md:text-sm font-bold text-gray-500 hover:bg-gray-100 transition-all">🟩 テープ図</button>
                    <button onclick="switchRibbonMode('line')" id="rmode-line" class="px-3 py-1.5 rounded-full text-xs md:text-sm font-bold text-gray-500 hover:bg-gray-100 transition-all">📏 線分図</button>
                </div>

                <div class="w-full bg-white rounded-2xl border border-gray-200 p-6 md:p-10 flex flex-col justify-center items-center relative overflow-visible mt-4">
                    
                    <!-- モーフィングコンテナ -->
                    <div id="ribbon-container" data-mode="ribbon" class="w-[90%] mx-auto">
                        <!-- JSでセグメント(segment)を動的生成 -->
                    </div>

                    <!-- テープ図・線分図用の円弧（教科書スタイル） -->
                    <div id="total-brace" class="absolute top-0 left-[5%] w-[90%] h-[120px] transition-opacity duration-500 opacity-0 pointer-events-none">
                        <svg id="brace-svg" viewBox="0 0 100 120" preserveAspectRatio="none" class="absolute inset-0 w-full h-full" style="overflow: visible;">
                            <path id="brace-path" d="" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
                        </svg>
                        <span id="total-brace-text" class="absolute text-emerald-600 font-black text-sm md:text-base bg-white px-2 whitespace-nowrap" style="left:50%; top:24px; transform: translate(-50%, 0);">ぜんぶで ? cm</span>
                    </div>

                </div>
                <p class="text-xs text-gray-400 mt-2"><i class="fa-solid fa-circle-info"></i> 「はじめる！」ボタンを押すと、パタパタ伸びるアニメーションがはじまるよ！</p>
            </div>

        </div>

        <!-- ================= かけ算の式（ダイナミック連動） ================= -->
        <div class="mt-4 p-4 bg-amber-100/50 rounded-2xl border-2 border-yellow-300 text-center relative">
            <span class="absolute -top-3 left-6 text-xs bg-yellow-400 text-amber-900 font-bold px-3 py-1 rounded-full shadow">さんすう の しき</span>
            
            <div class="flex items-center justify-center gap-2 md:gap-4 text-2xl md:text-4xl font-black text-gray-800 mt-2">
                <!-- もとの数 -->
                <div class="flex flex-col items-center">
                    <div class="px-3 py-1.5 bg-pink-100 border-2 border-pink-400 rounded-xl text-pink-600 min-w-[55px] md:min-w-[70px] shadow-sm flex items-end justify-center">
                        <span id="formula-base">2</span>
                        <span class="text-sm font-bold ml-1 mb-1 text-pink-500" id="formula-unit-base">こ</span>
                    </div>
                    <span class="text-[10px] md:text-xs text-pink-500 font-bold mt-1">1つ分</span>
                </div>
                
                <div class="text-gray-400 font-normal">×</div>
                
                <!-- 倍の数 -->
                <div class="flex flex-col items-center">
                    <div class="px-3 py-1.5 bg-purple-100 border-2 border-purple-400 rounded-xl text-purple-600 min-w-[55px] md:min-w-[70px] shadow-sm">
                        <span id="formula-mult">3</span>
                    </div>
                    <span class="text-[10px] md:text-xs text-purple-500 font-bold mt-1">いくつ分(ばい)</span>
                </div>
                
                <div class="text-gray-400 font-normal">＝</div>
                
                <!-- ぜんぶの数 -->
                <div class="flex flex-col items-center">
                    <div class="px-3 py-1.5 bg-emerald-50 border-2 border-emerald-300 text-emerald-400 rounded-xl min-w-[80px] md:min-w-[100px] shadow-sm flex items-end justify-center transition-all duration-300" id="formula-total-box">
                        <span id="formula-total">?</span>
                        <span class="text-sm font-bold ml-1 mb-1" id="formula-unit-total">こ</span>
                    </div>
                    <span class="text-[10px] md:text-xs text-emerald-600 font-bold mt-1">ぜんぶの数</span>
                </div>
            </div>
            
            <!-- 説明文 -->
            <p id="explain-text" class="text-gray-700 font-bold text-sm md:text-base mt-4 bg-white inline-block px-5 py-2 rounded-full shadow-sm border border-gray-100 transition-all duration-300">
                すうじをえらんでね！「はじめる！」でおもしろいうごきがみられるよ！
            </p>
        </div>

    </div>

    <script>
        // --- アプリのグローバル状態 ---
        let currentTab = 'copier'; // 'copier', 'ribbon'
        let currentRibbonMode = 'ribbon'; // 'ribbon', 'tape', 'line'
        let selectedItem = 'apple_small';
        let baseValue = 2; // 1~9
        let multiplierValue = 3; // 1~9
        
        // アニメーション制御用タイマー追跡配列
        let activeTimeouts = [];

        const itemEmojis = { apple_small: '🍎', apple_big: '🍎', star: '⭐', fish: '🐟', car: '🚗' };
        // テキスト表示（「もとの◯◯の◯倍の数は、◯こ」）用の呼び名
        const itemNames = { apple_small: 'リンゴ', apple_big: 'リンゴ', star: 'ほし', fish: 'さかな', car: 'くるま' };

        // 「もと」の大きさ（1こぶんの絵の大きさ）は、アイテムの種類ごとに固定する。
        // 個数（1つ分の数）が変わっても絵そのものの大きさは変えない。
        // これにより「もとの部屋」と「ばいの部屋」で、同じ絵が同じ大きさのまま
        // 「何個も」「何グループも」増えていく様子だけが変化し、
        // 「倍」＝同じものが繰り返し増えることの意味がぶれずに伝わる。
        const FIXED_ITEM_SIZES = {
            apple_small: '15px',
            apple_big: '34px',
            star: '26px',
            fish: '26px',
            car: '26px'
        };

        // --- 効果音システム ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type, delay = 0, pitch = 1.0) {
            try {
                initAudio();
                const t = audioCtx.currentTime + delay;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'pop') { // ポン！
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180 * pitch, t);
                    osc.frequency.exponentialRampToValueAtTime(500 * pitch, t + 0.1);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                } 
                else if (type === 'whoosh') { // シュッ（変身音）
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, t);
                    osc.frequency.exponentialRampToValueAtTime(100, t + 0.3);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
                    osc.start(t); osc.stop(t + 0.3);
                }
                else if (type === 'success') { // チャララーン！
                    const notes = [261.6, 329.6, 392.0, 523.2];
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.type = 'sine';
                        o.frequency.setValueAtTime(freq, t + i * 0.08);
                        g.gain.setValueAtTime(0.1, t + i * 0.08);
                        g.gain.linearRampToValueAtTime(0.01, t + i * 0.08 + 0.2);
                        o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.2);
                    });
                }
            } catch (e) {}
        }

        // --- 実行中アニメーションの全クリア ---
        function clearAllActiveAnimations() {
            activeTimeouts.forEach(t => clearTimeout(t));
            activeTimeouts = [];
            
            // コピー機の揺れなどを止める
            const machine = document.getElementById('copier-machine');
            if (machine) machine.classList.remove('animate-bounce');
            const arrow = document.getElementById('copier-arrow');
            if (arrow) arrow.classList.remove('animate-pulse');

            // もとの部屋の光る演出・透明度をリセット
            const baseFrame = document.getElementById('copier-base-frame');
            if (baseFrame) baseFrame.classList.remove('animate-glow');
            const baseContainer = document.getElementById('copier-base-items');
            if (baseContainer) baseContainer.style.opacity = '1';

            // 吸い込みアニメーション中のクローンが残っていれば削除
            document.querySelectorAll('.fly-clone').forEach(el => el.remove());

            // 「ばいの部屋」の光る演出をリセット
            const resultFrame = document.getElementById('copier-result-frame');
            if (resultFrame) resultFrame.classList.remove('animate-glow-purple');
            document.querySelectorAll('#copier-result-container > div').forEach(box => box.classList.remove('animate-glow-purple'));

            // 「もとの◯◯の◯倍の数は、◯こ」テキストをリセット
            const multiText = document.getElementById('copier-multiple-text-inner');
            if (multiText) {
                multiText.classList.remove('animate-pop');
                multiText.classList.add('opacity-0');
                multiText.textContent = '';
            }
        }

        // --- タブ切り替え ---
        function switchTab(tabId) {
            clearAllActiveAnimations();
            currentTab = tabId;
            
            // タブの見た目更新
            document.getElementById('tab-copier').className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm md:text-base transition-all duration-300 text-gray-500 hover:bg-white/50 border border-transparent";
            document.getElementById('tab-ribbon').className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm md:text-base transition-all duration-300 text-gray-500 hover:bg-white/50 border border-transparent";
            
            const activeBtn = document.getElementById(`tab-${tabId}`);
            activeBtn.className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm md:text-base transition-all duration-300 bg-white text-orange-600 shadow-md border border-orange-100";

            // ビューの切り替え
            document.getElementById('view-copier').classList.add('hidden');
            document.getElementById('view-ribbon').classList.add('hidden');
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            // 単位の切り替え
            const unit = tabId === 'copier' ? 'こ' : 'cm';
            
            // ボタンの単位テキストの更新
            for(let i = 1; i <= 9; i++) {
                const btnUnit = document.getElementById(`base-unit-btn-${i}`);
                if (btnUnit) btnUnit.textContent = unit;
            }
            
            document.getElementById('formula-unit-base').textContent = unit;
            document.getElementById('formula-unit-total').textContent = unit;

            // リボンタブに切り替えた時はモードを「リボン」に戻す
            if(tabId === 'ribbon') {
                switchRibbonMode('ribbon', false); // 効果音なしで切り替え
            }

            initAudio();
            renderStatic(); // 即時反映
        }

        // container(#ribbon-container)は高さ120px固定・下寄せ(flex-end)・margin-bottom:30pxで統一されている。
        // そのため、モードごとのセグメント高さから「テープ/線分図の上端(y)」を逆算し、
        // 円弧の始点・終点がぴったり目盛り／テープの縦線に重なるようにする。
        const SEG_HEIGHT = { ribbon: 48, tape: 36, line: 4 };
        function updateBrace(mode) {
            const brace = document.getElementById('total-brace');
            const path = document.getElementById('brace-path');
            const label = document.getElementById('total-brace-text');

            if (mode !== 'tape' && mode !== 'line') {
                brace.style.opacity = '0';
                return;
            }

            // 横幅：ribbon-containerは親(stage)の90%幅。そのcontainer内でセグメント1つ分=1/9。
            // total-braceは親(stage)基準の%指定なので、90(containerの占有率) × mult/9 で
            // ぴったりセグメントmult個分の右端(=最後の目盛り/縦線)に一致させる。
            brace.style.width = `${(90 / 9) * multiplierValue}%`;
            brace.style.opacity = '1';

            // 縦位置：120(高さ) - 30(margin-bottom) - セグメント高さ = セグメント上端
            const segTop = 120 - 30 - SEG_HEIGHT[mode];
            // 線分図は目盛り線の上端(セグメント上端から12px上)に、テープ図はテープの上辺にぴったり合わせる
            const yBase = (mode === 'line') ? segTop - 12 : segTop;
            const yPeak = yBase - 34; // 円弧の高さ

            path.setAttribute('d', `M 0,${yBase} C 0,${yPeak} 100,${yPeak} 100,${yBase}`);
            label.style.top = `${yPeak - 16}px`;
        }

        // --- 連続量の表示モード切り替え ---
        function switchRibbonMode(mode, triggerSound = true) {
            currentRibbonMode = mode;
            document.getElementById('ribbon-container').setAttribute('data-mode', mode);
            
            // ボタンの見た目更新
            ['ribbon', 'tape', 'line'].forEach(m => {
                const btn = document.getElementById(`rmode-${m}`);
                btn.className = "px-3 py-1.5 rounded-full text-xs md:text-sm font-bold text-gray-500 hover:bg-gray-100 transition-all";
            });
            
            const activeClass = mode === 'ribbon' ? 'bg-pink-100 text-pink-700 shadow-sm' :
                                mode === 'tape' ? 'bg-blue-100 text-blue-700 shadow-sm' :
                                'bg-slate-800 text-white shadow-sm';
            
            const activeBtn = document.getElementById(`rmode-${mode}`);
            activeBtn.className = `px-3 py-1.5 rounded-full text-xs md:text-sm font-bold transition-all ${activeClass}`;

            // 全体の円弧（テープ図・線分図のときに表示）
            updateBrace(mode);

            if (triggerSound) playSound('whoosh');
        }

        // --- アイテム変更 ---
        function changeItem(itemKey) {
            clearAllActiveAnimations();
            selectedItem = itemKey;
            document.querySelectorAll('.item-btn').forEach(btn => {
                btn.classList.remove('border-orange-400', 'scale-110');
                btn.classList.add('border-transparent');
            });
            document.getElementById(`item-${itemKey}`).classList.add('border-orange-400', 'scale-110');
            document.getElementById(`item-${itemKey}`).classList.remove('border-transparent');
            
            renderStatic(); // 静的に即時反映
        }

        // --- もとの大きさ変更（直接選択） ---
        function changeBase(num) {
            clearAllActiveAnimations();
            baseValue = num;
            
            document.querySelectorAll('.base-btn').forEach(btn => {
                btn.className = "base-btn px-2.5 py-1.5 text-xs md:text-sm bg-white border border-pink-200 text-pink-700 font-bold rounded-md transition-all shadow-sm";
            });
            
            const unit = currentTab === 'copier' ? 'こ' : 'cm';
            const btn = document.getElementById(`base-${num}`);
            btn.className = "base-btn px-2.5 py-1.5 text-xs md:text-sm bg-pink-500 text-white font-bold rounded-md transition-all shadow-md scale-105";
            
            renderStatic(); // 即時反映
        }

        // --- 何倍にするか変更 ---
        function changeMultiplier(num) {
            clearAllActiveAnimations();
            multiplierValue = num;
            
            document.querySelectorAll('.mult-btn').forEach(btn => {
                btn.className = "mult-btn px-2 py-1.5 text-xs md:text-sm bg-white border border-purple-200 text-purple-700 font-bold rounded-md transition-all shadow-sm";
            });
            document.getElementById(`mult-${num}`).className = "mult-btn px-2 py-1.5 text-xs md:text-sm bg-purple-500 text-white font-bold rounded-md transition-all shadow-md scale-105";
            
            renderStatic(); // 即時反映
        }

        // --- 即座に静的表示（数値を変更した時の即時フィードバック） ---
        // 「はじめる！」を押すまでは、答え（倍の部屋・式の答え）は一切表示しない。
        function renderStatic() {
            clearAllActiveAnimations();
            initAudio();
            
            const unit = currentTab === 'copier' ? 'こ' : 'cm';
            
            // 数式：もとの数といくつ分だけ更新し、答えはまだ「？」のまま
            document.getElementById('formula-base').textContent = baseValue;
            document.getElementById('formula-mult').textContent = multiplierValue;
            
            const tBox = document.getElementById('formula-total-box');
            tBox.className = "px-3 py-1.5 bg-emerald-50 border-2 border-emerald-300 text-emerald-400 rounded-xl min-w-[80px] md:min-w-[100px] shadow-sm flex items-end justify-center transition-all duration-300";
            document.getElementById('formula-total').innerHTML = `?`;
            document.getElementById('formula-total').className = "font-black text-2xl md:text-3xl";
            document.getElementById('formula-unit-total').className = "text-sm font-bold ml-1 mb-1 text-emerald-300";

            // 説明文
            const explain = document.getElementById('explain-text');
            explain.className = "text-gray-700 font-bold text-sm md:text-base mt-4 bg-white inline-block px-5 py-2 rounded-full shadow border border-gray-200";
            explain.innerHTML = `「<span class="text-pink-600 font-extrabold text-lg">${baseValue}${unit}</span>」の「<span class="text-purple-600 font-extrabold text-lg">${multiplierValue}倍</span>」は、いくつかな？「はじめる！」を おしてみよう！`;

            if (currentTab === 'copier') {
                // コピー機：もとの部屋だけ静的に描画し、倍の部屋は空にする
                drawCopierBaseOnly(baseValue);
                clearCopierResult();
            } else {
                // リボン：まだ何も伸ばさない（空の状態）
                drawRibbonEmpty();
            }
        }

        // --- 【静的】コピー機：もとの部屋だけ描画 ---
        function drawCopierBaseOnly(base) {
            const baseContainer = document.getElementById('copier-base-items');
            baseContainer.innerHTML = '';
            baseContainer.style.opacity = '1';

            // 絵の大きさは個数で縮めず、そのままの大きさで折り返して並べる
            baseContainer.className = "flex flex-wrap gap-1 w-full items-center justify-center";

            const fixedSize = FIXED_ITEM_SIZES[selectedItem];
            for (let i = 0; i < base; i++) {
                const item = document.createElement('div');
                item.className = "p-0.5 bg-white rounded border border-pink-200 shadow-sm leading-none";
                item.style.fontSize = fixedSize;
                item.textContent = itemEmojis[selectedItem];
                baseContainer.appendChild(item);
            }
        }

        // --- 【静的】コピー機：ばいの部屋を空（プレースホルダー）にする ---
        function clearCopierResult() {
            const resultContainer = document.getElementById('copier-result-container');
            resultContainer.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center text-gray-300 gap-1.5 select-none">
                    <i class="fa-solid fa-question text-3xl md:text-4xl"></i>
                    <span class="text-[11px] md:text-xs font-bold">「はじめる！」を おしてね</span>
                </div>`;
            resultContainer.className = "grid grid-cols-1 w-full h-full p-1 items-center justify-items-center";
        }

        // --- 【静的】リボン・テープ・線分図：まだ何も伸ばさず空にする ---
        function drawRibbonEmpty() {
            const container = document.getElementById('ribbon-container');
            container.innerHTML = '';

            const brace = document.getElementById('total-brace');
            brace.style.opacity = '0';
        }

        // --- 「はじめる！」ボタンを押した時のアニメーション処理 ---
        function runSimulationWithAnimation() {
            clearAllActiveAnimations();
            initAudio();
            
            const total = baseValue * multiplierValue;
            const unit = currentTab === 'copier' ? 'こ' : 'cm';
            
            // 数式表示を一旦リセット（読み込み状態へ）
            document.getElementById('formula-base').textContent = baseValue;
            document.getElementById('formula-mult').textContent = multiplierValue;
            
            const tBox = document.getElementById('formula-total-box');
            tBox.className = "px-3 py-1.5 bg-gray-100 border-2 border-gray-300 text-gray-400 rounded-xl min-w-[80px] md:min-w-[100px] shadow-inner flex items-end justify-center transition-all duration-300";
            document.getElementById('formula-total').innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            
            document.getElementById('explain-text').innerHTML = currentTab === 'copier' 
                ? `もとの データを よみとっているよ...` 
                : `ばいのへやに、コピーをつくっているよ...`;

            if (currentTab === 'copier') {
                animateCopier(baseValue, multiplierValue, total);
            } else {
                animateRibbon(baseValue, multiplierValue, total);
            }
        }

        // --- クローンをもとの位置からコピー機へ吸い込ませるアニメーション ---
        function flyToMachine(sourceEl, callback) {
            const simArea = document.getElementById('sim-area');
            const machine = document.getElementById('copier-machine');
            const simRect = simArea.getBoundingClientRect();
            const srcRect = sourceEl.getBoundingClientRect();
            const machRect = machine.getBoundingClientRect();

            // ソースと同じ見た目のクローンを浮かせて配置
            const clone = sourceEl.cloneNode(true);
            clone.removeAttribute('id');
            clone.style.transition = ''; // ソース要素から継承したinline transitionをクリア（2回目以降のバグ防止）
            clone.className += ' fly-clone';
            clone.style.left = `${srcRect.left - simRect.left}px`;
            clone.style.top = `${srcRect.top - simRect.top}px`;
            clone.style.width = `${srcRect.width}px`;
            clone.style.height = `${srcRect.height}px`;
            clone.style.opacity = '1';
            simArea.appendChild(clone);

            // もとのアイテムはうっすら残す（読み取り中の演出）
            sourceEl.style.transition = 'opacity 0.3s ease';
            sourceEl.style.opacity = '0.25';

            const dx = (machRect.left + machRect.width / 2) - (srcRect.left + srcRect.width / 2);
            const dy = (machRect.top + machRect.height / 2) - (srcRect.top + srcRect.height / 2);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    clone.style.transform = `translate(${dx}px, ${dy}px) scale(0.1)`;
                    clone.style.opacity = '0';
                });
            });

            playSound('whoosh');

            const t = setTimeout(() => {
                clone.remove();
                sourceEl.style.opacity = '1';
                sourceEl.style.transition = ''; // inline transitionを残さない（次回クローン時の汚染防止）
                callback();
            }, 520);
            activeTimeouts.push(t);
        }

        // --- コピー機のアニメーション描画 ---
        function animateCopier(base, mult, total) {
            const baseFrame = document.getElementById('copier-base-frame');

            // 左側の元部屋を再描画
            const baseContainer = document.getElementById('copier-base-items');
            baseContainer.innerHTML = '';
            baseContainer.style.opacity = '1';

            const fixedSize = FIXED_ITEM_SIZES[selectedItem];
            baseContainer.className = "flex flex-wrap gap-1 w-full items-center justify-center";

            for (let i = 0; i < base; i++) {
                const item = document.createElement('div');
                item.className = "p-0.5 bg-white rounded border border-pink-200 shadow-sm animate-pop leading-none";
                item.style.fontSize = fixedSize;
                item.style.animationDelay = `${i * 30}ms`;
                item.textContent = itemEmojis[selectedItem];
                baseContainer.appendChild(item);
            }

            // 右側の部屋を空にする
            const resultContainer = document.getElementById('copier-result-container');
            resultContainer.innerHTML = '';
            resultContainer.className = mult <= 3 ? "grid grid-cols-1 gap-2 w-full h-full p-1 items-center justify-items-center" : 
                                        mult <= 6 ? "grid grid-cols-2 gap-2 w-full h-full p-1 items-center justify-items-center" : 
                                        "grid grid-cols-3 gap-1.5 w-full h-full p-1 items-center justify-items-center";

            // フェーズ1：「もとの部屋」が光る（データを読み取っている演出）
            const glowTimer = setTimeout(() => {
                baseFrame.classList.add('animate-glow');
            }, 250); // アイテムのポップイン(animate-pop)が終わる少し後に光らせる
            activeTimeouts.push(glowTimer);

            const glowEndTimer = setTimeout(() => {
                baseFrame.classList.remove('animate-glow');

                // フェーズ2：もとのデータがコピー機に吸い込まれる
                flyToMachine(baseContainer, () => {
                    document.getElementById('explain-text').innerHTML = `ばいのへやに、コピーをつくっているよ...`;
                    startPopping();
                });
            }, 900);
            activeTimeouts.push(glowEndTimer);

            // フェーズ3：コピー機からばいの部屋へ、1つ分ずつコピーが出てくる
            function startPopping() {
                const machine = document.getElementById('copier-machine');
                machine.classList.add('animate-bounce');
                const arrow = document.getElementById('copier-arrow');
                arrow.classList.add('animate-pulse');

                let groupCount = 0;
                // 数が多い時はスピードアップ
                const intervalTime = mult > 6 ? 180 : mult > 4 ? 250 : 350;

                function popNext() {
                    if (groupCount < mult) {
                        const wrap = document.createElement('div');
                        wrap.className = "bg-white border-2 border-purple-300 rounded-xl p-1 relative flex flex-col items-center justify-center animate-convey w-full h-full min-h-[40px]";
                        
                        const label = document.createElement('span');
                        label.className = "absolute -top-2.5 text-[9px] bg-purple-400 text-white font-bold px-1.5 rounded-full whitespace-nowrap scale-90";
                        label.textContent = `${groupCount + 1}つ分`;
                        wrap.appendChild(label);

                        const itemsDiv = document.createElement('div');
                        itemsDiv.className = "flex gap-0.5 justify-center items-center flex-wrap";
                        const fixedSize = FIXED_ITEM_SIZES[selectedItem];
                        
                        for (let j = 0; j < base; j++) {
                            const itm = document.createElement('span');
                            itm.className = "leading-none";
                            itm.style.fontSize = fixedSize;
                            itm.textContent = itemEmojis[selectedItem];
                            itemsDiv.appendChild(itm);
                        }
                        wrap.appendChild(itemsDiv);
                        resultContainer.appendChild(wrap);

                        playSound('pop', 0, 1.0 + (groupCount * 0.08));
                        groupCount++;
                        
                        const timer = setTimeout(popNext, intervalTime);
                        activeTimeouts.push(timer);
                    } else {
                        machine.classList.remove('animate-bounce');
                        arrow.classList.remove('animate-pulse');

                        // ① 「ばいの部屋」の枠・中身が光る
                        const resultFrame = document.getElementById('copier-result-frame');
                        const groupBoxes = resultContainer.querySelectorAll(':scope > div');
                        resultFrame.classList.add('animate-glow-purple');
                        groupBoxes.forEach(box => box.classList.add('animate-glow-purple'));
                        playSound('whoosh', 0, 1.4);

                        const glowEndTimer = setTimeout(() => {
                            resultFrame.classList.remove('animate-glow-purple');
                            groupBoxes.forEach(box => box.classList.remove('animate-glow-purple'));

                            // ②「もとの◯◯の◯倍の数は、◯こ」とテキスト表示
                            showMultipleText(base, mult, total);

                            const textTimer = setTimeout(() => {
                                finishAnimation(base, mult, total, 'こ');
                            }, 1100);
                            activeTimeouts.push(textTimer);
                        }, 700);
                        activeTimeouts.push(glowEndTimer);
                    }
                }

                const initialTimer = setTimeout(popNext, 250);
                activeTimeouts.push(initialTimer);
            }
        }

        // --- リボン・テープのアニメーション描画 ---
        function animateRibbon(base, mult, total) {
            const container = document.getElementById('ribbon-container');
            container.innerHTML = '';
            
            // アニメーション再生時は、強制的に「リボン」モードにして、中かっこは隠す
            switchRibbonMode('ribbon', false);
            document.getElementById('total-brace').style.opacity = '0';

            const segWidthPct = 100 / 9;
            let count = 0;
            const intervalTime = mult > 6 ? 150 : mult > 4 ? 200 : 300;

            function drawSegment() {
                if(count < mult) {
                    const isFirst = (count === 0);
                    
                    const seg = document.createElement('div');
                    seg.className = "segment flex items-center justify-center opacity-0"; // 初期状態は見えなくする
                    seg.style.width = `${segWidthPct}%`;
                    
                    // 1. リボンレイヤー
                    const lRibbon = document.createElement('div');
                    lRibbon.className = "layer-ribbon overflow-hidden";
                    const ribbonEmojiSize = base > 6 ? "text-[7px]" : base > 4 ? "text-[8px]" : "text-[10px]";
                    lRibbon.innerHTML = `<div class="${ribbonEmojiSize} w-full h-full px-0.5 flex flex-wrap items-center justify-center content-center leading-none gap-x-0.5">${Array(base).fill(`<span>${itemEmojis[selectedItem]}</span>`).join('')}</div>`;
                    
                    // 2. テープ図レイヤー
                    const lTape = document.createElement('div');
                    lTape.className = "layer-tape";
                    
                    // 3. 線分図レイヤー
                    const lLine = document.createElement('div');
                    lLine.className = "layer-line";

                    // 共通装飾
                    if(isFirst) {
                        const tick0 = document.createElement('div'); tick0.className = "tick-mark-zero";
                        const top0 = document.createElement('div'); top0.className = "label-top-zero"; top0.textContent = "0";
                        const bot0 = document.createElement('div'); bot0.className = "label-bottom-zero"; bot0.textContent = "0";
                        seg.appendChild(tick0); seg.appendChild(top0); seg.appendChild(bot0);
                        
                        const ann = document.createElement('div');
                        ann.className = "base-annotation";
                        ann.innerHTML = `${base}cm`;
                        seg.appendChild(ann);
                    }

                    const tick = document.createElement('div'); tick.className = "tick-mark";
                    const topL = document.createElement('div'); topL.className = "label-top"; topL.textContent = `${base * (count+1)}`;
                    const botL = document.createElement('div'); botL.className = "label-bottom"; botL.textContent = `${count+1}倍`;
                    
                    seg.appendChild(lRibbon);
                    seg.appendChild(lTape);
                    seg.appendChild(lLine);
                    seg.appendChild(tick);
                    seg.appendChild(topL);
                    seg.appendChild(botL);

                    container.appendChild(seg);

                    // 次のフレームでクラスをつけて浮き出す（滑らかなパタパタ効果）
                    requestAnimationFrame(() => {
                        seg.className = "segment flex items-center justify-center animate-pop";
                        playSound('pop', 0, 1.0 + (count * 0.08));
                    });

                    count++;
                    const timer = setTimeout(drawSegment, intervalTime);
                    activeTimeouts.push(timer);
                } else {
                    // 全体合計を計算し、中かっこの準備
                    document.getElementById('total-brace-text').textContent = `ぜんぶで ${total} cm`;
                    finishAnimation(base, mult, total, 'cm');
                }
            }

            const initialTimer = setTimeout(drawSegment, 300);
            activeTimeouts.push(initialTimer);
        }

        // --- 「もとの◯◯の◯倍の数は、◯こ」テキストをポップ表示 ---
        function showMultipleText(base, mult, total) {
            const el = document.getElementById('copier-multiple-text-inner');
            el.classList.remove('animate-pop');
            el.classList.add('opacity-0');
            el.textContent = `もとの${itemNames[selectedItem]}の${mult}倍の数は、${total}こ`;

            // 再アニメーションのため一度リフローさせてからクラス付与
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    el.classList.remove('opacity-0');
                    el.classList.add('animate-pop');
                });
            });

            playSound('pop', 0, 1.2);
        }

        // --- アニメーション再生完了処理 ---
        function finishAnimation(base, mult, total, unit) {
            playSound('success');

            const tBox = document.getElementById('formula-total-box');
            tBox.className = "px-3 py-1.5 bg-emerald-500 border-2 border-emerald-600 text-white rounded-xl min-w-[80px] md:min-w-[100px] shadow-lg flex items-end justify-center transition-all duration-300 animate-pop relative";
            
            document.getElementById('formula-total').innerHTML = `${total} <i class="fa-solid fa-star text-yellow-300 text-xs animate-ping absolute -top-1 -right-1"></i>`;
            document.getElementById('formula-total').className = "font-black text-3xl md:text-4xl";
            document.getElementById('formula-unit-total').className = "text-sm font-bold ml-1 mb-1 text-emerald-100";

            const explain = document.getElementById('explain-text');
            explain.className = "text-gray-700 font-bold text-sm md:text-base mt-4 bg-white inline-block px-5 py-2 rounded-full shadow border-2 border-emerald-300 animate-fade-in";
            explain.innerHTML = `「<span class="text-pink-600 font-extrabold text-lg">${base} ${unit}</span>」の「<span class="text-purple-600 font-extrabold text-lg">${mult}倍</span>」は、「<span class="text-emerald-600 font-extrabold text-xl">${total} ${unit}</span>」になるよ！`;
        }

        // アプリ起動時の初期描画
        window.onload = () => {
            renderStatic();
        };
    </script>
</body>
</html>
