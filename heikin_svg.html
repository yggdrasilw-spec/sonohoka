    // =========================================================================
    // 初期化
    // =========================================================================
    function initApp() {
      buildSidebarMenu();
      mobileMenuBtn.addEventListener('click', () => {
        problemNav.classList.toggle('hidden');
      });
      selectProblem(0);
      startAnimationLoop();
    }

    // サイドバーの問題一覧生成
    function buildSidebarMenu() {
      problemNav.innerHTML = '';
      PROBLEMS.forEach((p, idx) => {
        const btn = document.createElement('button');
        btn.id = `nav-btn-${idx}`;
        btn.className = 'w-full text-left px-3 py-2.5 rounded-xl border transition flex items-start gap-2.5 hover:bg-orange-50/70';
        btn.innerHTML = `
          <span class="text-lg shrink-0 mt-0.5">${p.icon}</span>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-bold text-orange-700 truncate">${p.category}</span>
            </div>
            <div class="text-xs sm:text-sm font-black text-slate-800 truncate mt-0.5">${p.title}</div>
          </div>
        `;
        btn.addEventListener('click', () => {
          selectProblem(idx);
          if (window.innerWidth < 1024) {
            problemNav.classList.add('hidden');
          }
        });
        problemNav.appendChild(btn);
      });
    }

    // =========================================================================
    // 問題の切り替えとセットアップ
    // ==========================================
    function selectProblem(idx) {
      stopAuto();
      currentProbIndex = idx;
      currentStep = 0;
      waveAmp = 0;
      document.getElementById('prob-help').open = false;
      document.querySelector('.diagram-viewport').scrollLeft = 0;
      includeOutlierOrZeroAlt = false;
      const p = PROBLEMS[idx];

      // サイドバーのアクティブ表示更新
      PROBLEMS.forEach((_, i) => {
        const b = document.getElementById(`nav-btn-${i}`);
        if (i === idx) {
          b.className = 'w-full text-left px-3 py-2.5 rounded-xl border-2 border-orange-500 bg-orange-50 shadow-xs transition flex items-start gap-2.5';
        } else {
          b.className = 'w-full text-left px-3 py-2.5 rounded-xl border border-slate-200 bg-white transition flex items-start gap-2.5 hover:bg-slate-50';
        }
      });

      // テキスト情報更新
      probCategoryBadge.textContent = p.category;
      probTitle.textContent = p.title;
      probQuestion.textContent = p.question;
      probPoint.textContent = p.point;
      sceneIcon.textContent = p.icon;
      sceneSubtitle.textContent = p.subtitle;

      // 液体グラデーション色設定
      document.getElementById('grad-stop-1').setAttribute('stop-color', p.colors[0]);
      document.getElementById('grad-stop-2').setAttribute('stop-color', p.colors[1]);
      document.getElementById('grad-stop-3').setAttribute('stop-color', p.colors[2]);

      // 特殊トグルボタンの設定（0点問題・外れ値問題）
      buildSpecialToggles(p);

      // コントロールボタンの構築
      buildControlButtons(p);

      // 目盛りとステージの初期化
      setupStageForProblem(p);
      applyStep(0);
    }

    // 特殊比較トグル（0点問題や外れ値問題用）
    function buildSpecialToggles(p) {
      specialToggleArea.innerHTML = '';
      if (p.mode === 'zero_data') {
        const btn = document.createElement('button');
        btn.className = 'text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-rose-300 bg-rose-50 text-rose-800 hover:bg-rose-100 transition';
        btn.textContent = '🤔 もし0のコップをぬかして計算すると？';
        btn.addEventListener('click', () => {
          includeOutlierOrZeroAlt = !includeOutlierOrZeroAlt;
          btn.textContent = includeOutlierOrZeroAlt
            ? '✅ 正しい考え（0のコップも含める）に戻す'
            : '🤔 もし0のコップをぬかして計算すると？';
          btn.className = includeOutlierOrZeroAlt
            ? 'text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-800'
            : 'text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-rose-300 bg-rose-50 text-rose-800';
          applyStep(currentStep);
        });
        specialToggleArea.appendChild(btn);
      } else if (p.mode === 'outlier') {
        const btn = document.createElement('button');
        btn.className = 'text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-amber-300 bg-amber-50 text-amber-900 hover:bg-amber-100 transition';
        btn.textContent = '🤔 もし失敗データも入れて計算すると？';
        btn.addEventListener('click', () => {
          includeOutlierOrZeroAlt = !includeOutlierOrZeroAlt;
          btn.textContent = includeOutlierOrZeroAlt
            ? '✅ 失敗データを外して計算する（正しい）'
            : '🤔 もし失敗データも入れて計算すると？';
          btn.className = includeOutlierOrZeroAlt
            ? 'text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-800'
            : 'text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-amber-300 bg-amber-50 text-amber-900';
          applyStep(currentStep);
        });
        specialToggleArea.appendChild(btn);
      }
    }

          <span>▶ 自動再生</span>
        </button>
        <button id="btn-reset" class="col-span-2 sm:col-span-1 action-btn bg-slate-200 hover:bg-slate-300 text-slate-800 font-black py-2.5 px-2 rounded-xl text-xs sm:text-sm flex flex-col items-center justify-center">
          <span class="text-[10px] text-slate-500 mb-0.5">はじめにもどす</span>
          <span>↺ リセット</span>
        </button>
      `;

      document.getElementById('btn-s1').addEventListener('click', () => { stopAuto(); applyStep(1); });
      document.getElementById('btn-s2').addEventListener('click', () => { stopAuto(); applyStep(2); });
      document.getElementById('btn-s3').addEventListener('click', () => { stopAuto(); applyStep(3); });
      document.getElementById('btn-auto').addEventListener('click', () => {
        if (isAutoPlaying) stopAuto();
        else startAuto();
      });
      document.getElementById('btn-reset').addEventListener('click', () => { stopAuto(); applyStep(0); });
    }

    // =========================================================================
    // SVGステージの構築（問題モードごとのレイアウト）
    // =========================================================================
    function valToPx(val, p) {
      if (p.mode === 'predict_total' || p.mode === 'reverse_count') {
        return 140; // 固定高さで横の広がりを見せる
      }
      const min = p.scaleMin ?? 0;
      const max = p.scaleMax ?? 100;
      const ratio = Math.max(0, Math.min(1.15, (val - min) / (max - min)));
      return ratio * STAGE_MAX_H;
    }

    function setupStageForProblem(p, step = 0) {
      const walking = p.mode === 'two_stage_divide' && step >= 2;
      const year = p.mode === 'two_stage_multiply' && step >= 2;
      scaleLayer.innerHTML = '';
      basePedestalLayer.innerHTML = '';
      cupsLayer.innerHTML = '';
      animCups = [];

      // 1. 目盛り線の描画（標準・0データ・外れ値・2段階用）
      if (!walking && p.mode !== 'predict_total' && p.mode !== 'reverse_count') {
        const min = p.scaleMin;
        const max = p.scaleMax;
        const step = p.scaleStep;

        // 土台の目盛りが途中から始まる場合
        if (p.baseOffsetLabel) {
          basePedestalLayer.style.opacity = '1';
          basePedestalLayer.innerHTML = `
            <rect x="85" y="${STAGE_BOTTOM_Y - 18}" width="750" height="18" rx="4" fill="#e2e8f0" />
            <text x="460" y="${STAGE_BOTTOM_Y - 5}" text-anchor="middle" font-size="11" font-weight="900" fill="#475569">
              ▲ ${p.baseOffsetLabel} ▲
            </text>
          `;
        } else {
          basePedestalLayer.style.opacity = '0';
        }

        for (let v = min; v <= max + 0.0001; v += step) {
          const roundedV = Math.round(v * 100) / 100;
          const y = STAGE_BOTTOM_Y - valToPx(roundedV, p);

          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', '85');
          line.setAttribute('y1', y);
          line.setAttribute('x2', '835');
          line.setAttribute('y2', y);
          line.setAttribute('stroke', '#e2e8f0');
          line.setAttribute('stroke-width', '1.5');
          scaleLayer.appendChild(line);

          const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          txt.setAttribute('x', '78');
          txt.setAttribute('y', y + (roundedV === min ? -4 : 4));
          txt.setAttribute('text-anchor', 'end');
          txt.setAttribute('font-size', '12');
          txt.setAttribute('font-weight', '700');
          txt.setAttribute('fill', '#64748b');
          txt.textContent = `${roundedV}${p.unit}`;
          scaleLayer.appendChild(txt);
        }
      } else {
        basePedestalLayer.style.opacity = '0';
      }

      // 2. コップ要素の生成
      if (p.mode === 'predict_total') {
        // 全体の量を予想する。長い期間は一部を省略する。
        const abbreviated = p.count > 24;
        const visualCount = abbreviated ? 12 : p.count;
        const cupW = Math.floor(696 / visualCount);
        const startX = (920 - visualCount * cupW) / 2;

        for (let i = 0; i < visualCount; i++) {
          const sepX = 110 + i * ((700 - cupW) / (visualCount - 1));
          const merX = startX + i * cupW;
          let lbl = `${i + 1}`;
          if (abbreviated) {
            if (i === 0) lbl = '1日';
            else if (i === 1) lbl = '2日';
            else if (i === visualCount - 1) lbl = `${p.count}日`;
            else lbl = '・';
          }

          animCups.push({
            index: i,
            sepX,
            merX,
            x: sepX,
            targetX: sepX,
            w: cupW,
            targetW: cupW,
            h: 130,
            targetH: 130,
            valText: abbreviated ? `${p.unitValue}${p.unit}` : String(p.unitValue),
            topLabel: lbl,
            wallUp: false,
            opacity: 1
          });
        }
      }
      else if (p.mode === 'reverse_count') {
        // 1個分ずつ入る部屋に仕切る。
        const count = p.targetCount;
        const cupW = Math.floor(690 / count);
        const startX = (920 - count * cupW) / 2;

        for (let i = 0; i < count; i++) {
          const x = startX + i * cupW;
          animCups.push({
            index: i,
            sepX: x,
            merX: x,
            x,
            targetX: x,
            w: cupW,
            targetW: cupW,
            h: 150,
            targetH: 150,
            valText: String(p.unitValue),
            topLabel: `${i + 1}`,
            wallUp: true, // 最初は仕切りなし（大きな1つの容器）
            opacity: 1
          });
        }
      }
      else {
        // 標準・0データ・外れ値・2段階問題
        const values = walking ? [twoStageAverage(p)]
          : year ? Array(12).fill(twoStageAverage(p))
          : p.values;
        const labels = walking ? [`10歩の平均 ${twoStageAverage(p)}${p.unit}`]
          : year ? values.map((_, i) => (i + 1) + '月')
          : p.labels;
        const n = values.length;
        const totalMergedW = Math.min(660, n * 125);
        const cupW = p.mode === 'two_stage_multiply' ? 60 : walking ? 540 : Math.floor(totalMergedW / n);
        const mergedStartX = (920 - cupW * n) / 2;
        const gap = Math.max(0, Math.min(28, Math.floor((820 - cupW * n) / (n + 1))));
        const sepStartX = (920 - (cupW * n + gap * (n - 1))) / 2;

        for (let i = 0; i < n; i++) {
          const sepX = sepStartX + i * (cupW + gap);
          const merX = mergedStartX + i * cupW;
          const hPx = walking ? STAGE_MAX_H * 0.55 : valToPx(values[i], p);

          animCups.push({
            index: i,
            sepX,
            merX,
            x: sepX,
            targetX: sepX,
            w: cupW,
            targetW: cupW,
            h: hPx,
            targetH: hPx,
            valText: `${values[i]}${p.unit}`,
            topLabel: labels[i],
            isOutlier: p.mode === 'outlier' && i === p.outlierIndex,
            isZero: p.mode === 'zero_data' && i === p.zeroIndex,
            wallUp: false,
            opacity: 1
          });
        }
      }

      renderCupDOMElements(p);
    }

    // SVG内の各コップDOM要素を構築
    function renderCupDOMElements(p) {
      cupsLayer.innerHTML = '';

      animCups.forEach((c, i) => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('id', `cup-node-${i}`);
        g.setAttribute('class', 'cup-group');
        g.style.transform = `translateX(${c.x}px)`;

        // 上部ラベル
        const labelTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        labelTxt.setAttribute('id', `cup-toplabel-${i}`);
        labelTxt.setAttribute('x', c.w / 2);
        labelTxt.setAttribute('y', STAGE_TOP_Y - 12);
        labelTxt.setAttribute('text-anchor', 'middle');
        labelTxt.setAttribute('font-size', c.w < 45 ? '11' : '14');
        labelTxt.setAttribute('font-weight', '900');
        labelTxt.setAttribute('fill', c.isOutlier ? '#dc2626' : (c.isZero ? '#2563eb' : '#475569'));
        labelTxt.textContent = c.topLabel;
        g.appendChild(labelTxt);

        // ガラス背景
        const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bgRect.setAttribute('id', `cup-bg-${i}`);
        bgRect.setAttribute('x', '0');
        bgRect.setAttribute('y', STAGE_TOP_Y);
        bgRect.setAttribute('width', c.w);
        bgRect.setAttribute('height', STAGE_MAX_H);
        bgRect.setAttribute('fill', c.isOutlier ? '#fef2f2' : (c.isZero ? '#eff6ff' : '#f8fafc'));
        bgRect.setAttribute('fill-opacity', '0.75');
        g.appendChild(bgRect);

        // 液体パス
        const liqPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        liqPath.setAttribute('id', `cup-liq-${i}`);
        liqPath.setAttribute('fill', 'url(#liquidGrad)');
        g.appendChild(liqPath);

        // 液面ハイライト線
        const surfPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        surfPath.setAttribute('id', `cup-surf-${i}`);
        surfPath.setAttribute('fill', 'none');
        surfPath.setAttribute('stroke', '#fef08a');
        surfPath.setAttribute('stroke-width', '2.5');
        g.appendChild(surfPath);

        // ガラス反射
        const shineRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        shineRect.setAttribute('x', '0');
        shineRect.setAttribute('y', STAGE_TOP_Y);
        shineRect.setAttribute('width', c.w);
        shineRect.setAttribute('height', STAGE_MAX_H);
        shineRect.setAttribute('fill', 'url(#glassShine)');
        g.appendChild(shineRect);

        // 底辺
        const botLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        botLine.setAttribute('x1', '0');
        botLine.setAttribute('y1', STAGE_BOTTOM_Y);
        botLine.setAttribute('x2', c.w);
        botLine.setAttribute('y2', STAGE_BOTTOM_Y);
        botLine.setAttribute('stroke', '#334155');
        botLine.setAttribute('stroke-width', '3.5');
        g.appendChild(botLine);

        // 左の壁
        const leftWall = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        leftWall.setAttribute('id', `cup-lwall-${i}`);
        leftWall.setAttribute('x1', '0');
        leftWall.setAttribute('y1', STAGE_TOP_Y);
        leftWall.setAttribute('x2', '0');
        leftWall.setAttribute('y2', STAGE_BOTTOM_Y);
        leftWall.setAttribute('stroke', i === 0 ? '#334155' : '#0284c7');
        leftWall.setAttribute('stroke-width', i === 0 ? '3.5' : '3');
        if (i > 0) leftWall.setAttribute('class', 'divider-wall');
        g.appendChild(leftWall);

        // 右の壁
        const rightWall = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        rightWall.setAttribute('id', `cup-rwall-${i}`);
        rightWall.setAttribute('x1', c.w);
        rightWall.setAttribute('y1', STAGE_TOP_Y);
        rightWall.setAttribute('x2', c.w);
        rightWall.setAttribute('y2', STAGE_BOTTOM_Y);
        rightWall.setAttribute('stroke', i === animCups.length - 1 ? '#334155' : '#0284c7');
        rightWall.setAttribute('stroke-width', i === animCups.length - 1 ? '3.5' : '3');
        if (i < animCups.length - 1) rightWall.setAttribute('class', 'divider-wall');
        g.appendChild(rightWall);

        // 数値バッジ
        const valG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        valG.setAttribute('id', `cup-valg-${i}`);
        valG.style.transition = 'opacity 0.35s ease';

        if (c.w >= 45) {
          const vBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          vBg.setAttribute('x', '6');
          vBg.setAttribute('y', STAGE_BOTTOM_Y - 32);
          vBg.setAttribute('width', c.w - 12);
          vBg.setAttribute('height', '24');
          vBg.setAttribute('rx', '6');
          vBg.setAttribute('fill', c.isOutlier ? '#fee2e2' : (c.isZero ? '#dbeafe' : '#ffffff'));
          vBg.setAttribute('fill-opacity', '0.92');
          vBg.setAttribute('stroke', c.isOutlier ? '#ef4444' : (c.isZero ? '#3b82f6' : '#cbd5e1'));
          vBg.setAttribute('stroke-width', '1.5');
          valG.appendChild(vBg);
        }

        const vTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        vTxt.setAttribute('id', `cup-valtxt-${i}`);
        vTxt.setAttribute('x', c.w / 2);
        vTxt.setAttribute('y', STAGE_BOTTOM_Y - 15);
        vTxt.setAttribute('text-anchor', 'middle');
        vTxt.setAttribute('font-size', c.w < 45 ? '11' : (c.w < 75 ? '12' : '14'));
        vTxt.setAttribute('font-weight', '900');
        vTxt.setAttribute('fill', c.isOutlier ? '#b91c1c' : (c.isZero ? '#1d4ed8' : '#1e293b'));
        vTxt.textContent = c.valText;
        valG.appendChild(vTxt);

        g.appendChild(valG);
        cupsLayer.appendChild(g);
      });

      // 第2段階用の細かい10等分仕切りレイヤー（歩幅の問題）
      const subDivGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      subDivGroup.setAttribute('id', 'sub-dividers-layer');
      subDivGroup.style.opacity = '0';
      subDivGroup.style.transition = 'opacity 0.5s ease';
      cupsLayer.appendChild(subDivGroup);
    }

    // =========================================================================
    // ステップ適用ロジック（全モード対応）
    // =========================================================================
    function applyStep(step) {
      const prevStep = currentStep;
      currentStep = step;
      const p = PROBLEMS[currentProbIndex];
      if (p.mode.startsWith('two_stage_') && (prevStep < 2) !== (step < 2)) {
        setupStageForProblem(p, step);
      }
      if (step === 0) document.getElementById('prob-help').open = false;
      if (p.mode === 'outlier') {
        document.querySelector('#btn-s1 span:last-child').textContent =
          includeOutlierOrZeroAlt ? '全記録をくっつける' : '失敗を外してくっつける';
      }

      // ハイライトリング更新
      ['btn-s1', 'btn-s2', 'btn-s3'].forEach((id, idx) => {
        const b = document.getElementById(id);
        if (b) {
          b.classList.toggle('btn-highlight', step === idx + 1);
        }
      });

      // 共通要素のリセット
      bottomBracket.style.opacity = '0';
      avgLineLayer.style.opacity = '0';
      unitHighlightLayer.style.opacity = '0';
      const subDivLayer = document.getElementById('sub-dividers-layer');
      if (subDivLayer) subDivLayer.style.opacity = '0';

      // モードごとのアニメーション制御
      if (p.mode === 'standard' || p.mode === 'zero_data') {
        handleStandardOrZeroStep(p, step);
      } else if (p.mode === 'outlier') {
        handleOutlierStep(p, step);
      } else if (p.mode === 'predict_total') {
        handlePredictTotalStep(p, step);
      } else if (p.mode === 'reverse_count') {
        handleReverseCountStep(p, step);
      } else if (p.mode === 'two_stage_divide') {
        handleTwoStageDivideStep(p, step);
      } else if (p.mode === 'two_stage_multiply') {
        handleTwoStageMultiplyStep(p, step);
      }

      // テキストと数式の更新
      updateTextAndFormula(p, step);
    }

    // --- 1. 標準＆0データモード ---
    function handleStandardOrZeroStep(p, step) {
      const skipZero = (p.mode === 'zero_data' && includeOutlierOrZeroAlt);
      const validValues = skipZero
        ? p.values.filter((_, idx) => idx !== p.zeroIndex)
        : p.values;
      const sum = Math.round(validValues.reduce((a, b) => a + b, 0) * 100) / 100;
      const avg = Math.round((sum / validValues.length) * 100) / 100;
      const avgPx = valToPx(avg, p);

      const n = animCups.length;
      const activeCount = skipZero ? n - 1 : n;
      const cupW = animCups[0].w;
      const mergedStartX = (920 - cupW * activeCount) / 2;

      let activeIdx = 0;
      animCups.forEach((c, i) => {
        const node = document.getElementById(`cup-node-${i}`);
        const lWall = document.getElementById(`cup-lwall-${i}`);
        const rWall = document.getElementById(`cup-rwall-${i}`);
        const valG = document.getElementById(`cup-valg-${i}`);
        const valTxt = document.getElementById(`cup-valtxt-${i}`);

        if (skipZero && i === p.zeroIndex) {
          // 誤答比較モード：0のコップを右端へ退避
          node.style.transform = `translateX(810px) scale(0.75)`;
          node.style.opacity = '0.35';
          return;
        }

        node.style.opacity = '1';
        const targetX = (step === 0) ? c.sepX : (mergedStartX + activeIdx * cupW);
        node.style.transform = `translateX(${targetX}px)`;

        // 壁の開閉
        const removeWalls = (step === 2);
        if (lWall && i > 0 && !(skipZero && activeIdx === 0)) {
          lWall.style.transform = removeWalls ? 'translateY(-100px)' : 'translateY(0px)';
          lWall.style.opacity = removeWalls ? '0' : '1';
        }
        if (rWall && i < n - 1 && !(skipZero && activeIdx === activeCount - 1)) {
          rWall.style.transform = removeWalls ? 'translateY(-100px)' : 'translateY(0px)';
          rWall.style.opacity = removeWalls ? '0' : '1';
        }

        // 液面高さ
        if (step === 0 || step === 1) {
          c.targetH = valToPx(p.values[i], p);
          valG.style.opacity = '1';
          valTxt.textContent = `${p.values[i]}${p.unit}`;
        } else if (step === 2) {
          c.targetH = avgPx;
          valG.style.opacity = '0';
        } else if (step === 3) {
          c.targetH = avgPx;
          valG.style.opacity = '1';
          valTxt.textContent = `${avg}${p.unit}`;
        }

        activeIdx++;
      });

      if (step === 2 || step === 3) {
        waveAmp = (step === 2) ? 8.5 : 2.0;
        const leftEdge = mergedStartX;
        const rightEdge = mergedStartX + cupW * activeCount;
        showBracket(leftEdge, rightEdge, `合計：${sum} ${p.unit}（${activeCount}つ分）`);
        showAvgLine(avgPx, `平均 ${avg}${p.unit}`);
      }
      if (step === 3) {
        showUnitHighlight(mergedStartX, cupW, `1つ分 ${avg}${p.unit}`);
      }
    }

    // --- 2. 外れ値（失敗データ）モード ---
    function handleOutlierStep(p, step) {
      const includeFailed = includeOutlierOrZeroAlt;
      const validValues = includeFailed
        ? p.values
        : p.values.filter((_, idx) => idx !== p.outlierIndex);
      const sum = Math.round(validValues.reduce((a, b) => a + b, 0) * 100) / 100;
      const avg = sum / validValues.length;
      const roundedAvg = Number(avg.toFixed(2));
      const approx = Math.abs(avg - roundedAvg) > 1e-9 ? '約' : '';
      const avgLabel = approx + roundedAvg + p.unit;
      const avgPx = valToPx(avg, p);

      const activeCount = validValues.length;
      const cupW = animCups[0].w;
      const mergedStartX = (920 - cupW * activeCount) / 2;

      let activeIdx = 0;
      animCups.forEach((c, i) => {
        const node = document.getElementById(`cup-node-${i}`);
        const lWall = document.getElementById(`cup-lwall-${i}`);
        const rWall = document.getElementById(`cup-rwall-${i}`);
        const valG = document.getElementById(`cup-valg-${i}`);
        const valTxt = document.getElementById(`cup-valtxt-${i}`);

        if (!includeFailed && i === p.outlierIndex) {
          // ステップ1以降で失敗コップを右端へ退避！
          if (step === 0) {
            node.style.transform = `translateX(${c.sepX}px)`;
            node.style.opacity = '1';
          } else {
            node.style.transform = `translateX(815px) translateY(15px) scale(0.75)`;
            node.style.opacity = '0.4';
          }
          return;
        }

        node.style.opacity = '1';
        const targetX = (step === 0) ? c.sepX : (mergedStartX + activeIdx * cupW);
        node.style.transform = `translateX(${targetX}px)`;

        const removeWalls = (step === 2);
        if (lWall && i > 0) {
          lWall.style.transform = removeWalls ? 'translateY(-100px)' : 'translateY(0px)';
          lWall.style.opacity = removeWalls ? '0' : '1';
        }
        if (rWall && i < animCups.length - 1) {
          rWall.style.transform = removeWalls ? 'translateY(-100px)' : 'translateY(0px)';
          rWall.style.opacity = removeWalls ? '0' : '1';
        }

        if (step <= 1) {
          c.targetH = valToPx(p.values[i], p);
          valG.style.opacity = '1';
          valTxt.textContent = `${p.values[i]}${p.unit}`;
        } else {
          c.targetH = avgPx;
          valG.style.opacity = (step === 3) ? '1' : '0';
          valTxt.textContent = avgLabel;
        }
        activeIdx++;
      });

      if (step >= 2) {
        waveAmp = (step === 2) ? 8.0 : 2.0;
        showBracket(mergedStartX, mergedStartX + cupW * activeCount, `合計：${sum} ${p.unit}（${activeCount}回分）`);
        showAvgLine(avgPx, `平均 ${avgLabel}`);
      }
      if (step === 3) {
        showUnitHighlight(mergedStartX, cupW, `1回分 ${avgLabel}`);
      }
    }

    // --- 3. 平均から全体の量を予想する ---
    function handlePredictTotalStep(p, step) {
      const n = animCups.length;
      const cupW = animCups[0].w;
      const startX = (920 - n * cupW) / 2;

      animCups.forEach((c, i) => {
        const node = document.getElementById(`cup-node-${i}`);
        const lWall = document.getElementById(`cup-lwall-${i}`);
        const rWall = document.getElementById(`cup-rwall-${i}`);
        const valG = document.getElementById(`cup-valg-${i}`);

        if (step === 0) {
          // 最初の1個だけ強調し、他は薄く待機
          node.style.transform = `translateX(${c.sepX}px)`;
          node.style.opacity = (i === 0) ? '1' : '0.35';
          if (lWall && i > 0) { lWall.style.transform = 'translateY(0px)'; lWall.style.opacity = '1'; }
          if (rWall && i < n - 1) { rWall.style.transform = 'translateY(0px)'; rWall.style.opacity = '1'; }
          valG.style.opacity = '1';
        } else if (step === 1) {
          // 全部くっつく
          node.style.transform = `translateX(${c.merX}px)`;
          node.style.opacity = '1';
          if (lWall && i > 0) { lWall.style.transform = 'translateY(0px)'; lWall.style.opacity = '1'; }
          if (rWall && i < n - 1) { rWall.style.transform = 'translateY(0px)'; rWall.style.opacity = '1'; }
          valG.style.opacity = '1';
        } else {
          // 壁を外して巨大な1つのタンクに！
          node.style.transform = `translateX(${c.merX}px)`;
          node.style.opacity = '1';
          if (lWall && i > 0) { lWall.style.transform = 'translateY(-100px)'; lWall.style.opacity = '0'; }
          if (rWall && i < n - 1) { rWall.style.transform = 'translateY(-100px)'; rWall.style.opacity = '0'; }
          valG.style.opacity = '0';
        }
      });

      if (step === 0) {
        showUnitHighlight(animCups[0].sepX, cupW, `1つ分 ${p.unitValue}${p.unit}`);
      } else if (step >= 2) {
        waveAmp = (step === 2) ? 9.0 : 0;
        showBracket(startX, startX + n * cupW, `全体の予想量：${p.unitValue}${p.unit} × ${p.count} ＝ ${p.totalValue} ${p.unit}`);
      }
    }

    // --- 4. 逆算：全体の量から個数を求める ---
    function handleReverseCountStep(p, step) {
      const n = animCups.length;
      const cupW = animCups[0].w;
      const startX = (920 - n * cupW) / 2;

      animCups.forEach((c, i) => {
        const lWall = document.getElementById(`cup-lwall-${i}`);
        const rWall = document.getElementById(`cup-rwall-${i}`);
        const valG = document.getElementById(`cup-valg-${i}`);
        const topLbl = document.getElementById(`cup-toplabel-${i}`);

        let showWall = false;
        if (step === 1 && i < 5) showWall = true; // 途中で5個分まで仕切る
        if (step >= 2) showWall = true;           // 全部仕切る

        if (lWall && i > 0) {
          lWall.style.transform = showWall ? 'translateY(0px)' : 'translateY(-100px)';
          lWall.style.opacity = showWall ? '1' : '0';
        }
        if (rWall && i < n - 1) {
          rWall.style.transform = showWall ? 'translateY(0px)' : 'translateY(-100px)';
          rWall.style.opacity = showWall ? '1' : '0';
        }

        valG.style.opacity = showWall ? '1' : '0';
        topLbl.style.opacity = showWall ? '1' : '0';
      });

      showBracket(startX, startX + n * cupW, `全体の入れ物：${p.totalValue}${p.unit}（1個分 ${p.unitValue}${p.unit}）`);
      if (step === 3) {
        showUnitHighlight(startX, cupW, `1個分 ${p.unitValue}${p.unit}`);
      }
    }

    // --- 5. 第2段階割り算（歩幅：3回の10歩平均 → 10等分で1歩） ---
    function handleTwoStageDivideStep(p, step) {
      if (step < 2) {
        renderAverageStage(p, step);
        return;
      }
      const cup = animCups[0];
      const start = cup.sepX;
      // 10歩分の1本を横に10等分し、各区画の幅で1歩分を表す。
      const width = cup.w / 10;
      const dividers = document.getElementById('sub-dividers-layer');
      dividers.replaceChildren();
      for (let k = 1; k < 10; k++) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        const x = start + k * width;
        line.setAttribute('x1', x);
        line.setAttribute('x2', x);
        line.setAttribute('y1', STAGE_BOTTOM_Y - cup.targetH);
        line.setAttribute('y2', STAGE_BOTTOM_Y);
        line.setAttribute('stroke', '#881337');
        line.setAttribute('stroke-width', '1.8');
        dividers.appendChild(line);
      }
      dividers.style.opacity = '1';
      document.getElementById('cup-valg-0').style.opacity = '0';
      showBracket(start, start + cup.w, `10歩 ${twoStageAverage(p)}m ÷ 10 ≈ 1歩 ${(twoStageAverage(p) / 10).toPrecision(2)}m`);
      if (step === 3) showUnitHighlight(start, width, `1歩 約${(twoStageAverage(p) / 10).toPrecision(2)}m`);
    }

    function handleTwoStageMultiplyStep(p, step) {
      if (step < 2) {
        renderAverageStage(p, step);
        return;
      }
      const first = animCups[0];
      animCups.forEach((cup, i) => {
        document.getElementById('cup-node-' + i).style.transform = 'translateX(' + cup.merX + 'px)';
      });
      showAvgLine(first.targetH, `1か月分 ${twoStageAverage(p)}kg`);
      showBracket(first.merX, first.merX + first.w * animCups.length, `12か月分：${twoStageAverage(p)}kg × 12 ＝ ${twoStageAverage(p) * 12}kg`);
    }

    function twoStageAverage(p) {
      return Number((p.values.reduce((sum, value) => sum + value, 0) / p.values.length).toFixed(2));
    }

    function renderAverageStage(p, step) {
      handleStandardOrZeroStep(p, step === 0 ? 0 : 2);
      if (step === 0) return;
      const first = animCups[0];
      const average = twoStageAverage(p);
      const walking = p.mode === 'two_stage_divide';
      const oneGroup = walking ? '1回（10歩）平均 ' : '1か月平均 ';
      showAvgLine(valToPx(average, p), oneGroup + average + p.unit);
      if (walking) showUnitHighlight(first.merX, first.w, `10歩 ${average}m`);
    }

    // =========================================================================
    // 補助グラフィック表示ヘルパー
    // =========================================================================
    function showAvgLine(heightPx, labelStr) {
      const y = STAGE_BOTTOM_Y - heightPx;
      avgLine.setAttribute('y1', y);
      avgLine.setAttribute('y2', y);
      avgBadgeBg.setAttribute('y', y - 14);
      avgBadgeText.setAttribute('y', y + 5);
      avgBadgeText.textContent = labelStr;
      avgLineLayer.style.opacity = '1';
    }

    function showBracket(leftX, rightX, textStr) {
      const midX = (leftX + rightX) / 2;
      bracketPath.setAttribute('d', `M ${leftX} 352 L ${leftX} 364 L ${rightX} 364 L ${rightX} 352`);
      bracketStem.setAttribute('x1', midX);
      bracketStem.setAttribute('x2', midX);
      const boxW = Math.max(320, textStr.length * 14);
      bracketBox.setAttribute('x', midX - boxW / 2);
      bracketBox.setAttribute('width', boxW);
      bracketText.setAttribute('x', midX);
      bracketText.textContent = textStr;
      bottomBracket.style.opacity = '1';
    }

    function showUnitHighlight(x, w, labelStr) {
      unitRect.setAttribute('x', x);
      unitRect.setAttribute('width', w);
      const midX = x + w / 2;
      const boxW = Math.max(120, labelStr.length * 13);
      unitLabelBg.setAttribute('x', midX - boxW / 2);
      unitLabelBg.setAttribute('width', boxW);
      unitLabelText.setAttribute('x', midX);
      unitLabelText.textContent = labelStr;
      unitHighlightLayer.style.opacity = '1';
    }

    // テキスト・数式表示更新
    function comparisonFormula(values, unit) {
      const sum = Number(values.reduce((total, value) => total + value, 0).toFixed(2));
      const average = sum / values.length;
      const shown = Number(average.toFixed(2));
      const sign = Math.abs(average - shown) < 1e-9 ? '＝' : '≈';
      return `${sum} ÷ ${values.length} ${sign} ${shown} (${unit})`;
    }

    function updateTextAndFormula(p, step) {
      const badges = ['はじめの状態', 'ステップ 1', 'ステップ 2', 'ステップ 3（完了）'];
      const badgeColors = ['bg-slate-600', 'bg-sky-600', 'bg-orange-600', 'bg-rose-600'];

      stepStatusBadge.className = `${badgeColors[step]} text-white text-xs font-bold px-2.5 py-0.5 rounded-full`;
      stepStatusBadge.textContent = badges[step];

      // 誤答比較モード時の特別メッセージ
      if (p.mode === 'zero_data' && includeOutlierOrZeroAlt && step >= 2) {
        const valid = p.values.filter((_, index) => index !== p.zeroIndex);
        formulaMain.textContent = '【注意】0をぬかすと ' + comparisonFormula(valid, p.unit);
        formulaSub.textContent = '0の試合（日）もカウントして、全部の数で割るのが正しい平均です！';
        stepNarration.textContent = '0のコップをぬかすと、実際よりも平均が大きくなってしまいます。';
        return;
      }

      if (p.mode === 'outlier' && includeOutlierOrZeroAlt && step === 1) {
        formulaMain.textContent = '失敗した回も含め、' + p.values.length + '回分をくっつける';
        formulaSub.textContent = '全記録の合計を、全ての回数で割る準備をします。';
        stepNarration.textContent = formulaSub.textContent;
        return;
      }
      if (p.mode === 'outlier' && includeOutlierOrZeroAlt && step >= 2) {
        formulaMain.textContent = '【比較】失敗を入れると ' + comparisonFormula(p.values, p.unit);
        formulaSub.textContent = '失敗を含めた全記録の平均です。成功した回だけの平均と比べましょう。';
        stepNarration.textContent = '失敗データをふくめた場合と、のぞいた場合を比べてみましょう。';
        return;
      }

      const [mainStr, subStr] = p.formulaSteps[step];
      formulaMain.textContent = mainStr;
      formulaSub.textContent = subStr;
      stepNarration.textContent = subStr;
    }

    // =========================================================================
    // 60fps 液体波形レンダリングループ
    // =========================================================================
    function startAnimationLoop() {
      function tick() {
        wavePhase += 0.14;
        if (waveAmp > 0.05) {
          waveAmp *= 0.96;
        } else {
          waveAmp = 0;
        }

        for (let i = 0; i < animCups.length; i++) {
          const c = animCups[i];
          c.h += (c.targetH - c.h) * 0.14;

          const surfY = STAGE_BOTTOM_Y - c.h;
          const liqPath = document.getElementById(`cup-liq-${i}`);
          const surfPath = document.getElementById(`cup-surf-${i}`);
          if (!liqPath || !surfPath) continue;

          if (c.h <= 0.5) {
            liqPath.setAttribute('d', '');
            surfPath.setAttribute('d', '');
            continue;
          }

          if (waveAmp > 0.15) {
            const pOff = i * 1.3;
            const y0 = surfY + Math.sin(wavePhase + pOff) * waveAmp;
            const yMid = surfY + Math.sin(wavePhase + pOff + 0.65) * waveAmp;
            const y1 = surfY + Math.sin(wavePhase + pOff + 1.3) * waveAmp;

            liqPath.setAttribute('d', `M 0 ${y0} Q ${c.w / 2} ${yMid} ${c.w} ${y1} L ${c.w} ${STAGE_BOTTOM_Y} L 0 ${STAGE_BOTTOM_Y} Z`);
            surfPath.setAttribute('d', `M 0 ${y0} Q ${c.w / 2} ${yMid} ${c.w} ${y1}`);
          } else {
            liqPath.setAttribute('d', `M 0 ${surfY} L ${c.w} ${surfY} L ${c.w} ${STAGE_BOTTOM_Y} L 0 ${STAGE_BOTTOM_Y} Z`);
            surfPath.setAttribute('d', `M 0 ${surfY} L ${c.w} ${surfY}`);
          }
        }

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // =========================================================================
    // 自動再生制御
    // =========================================================================
    function stopAuto() {
      isAutoPlaying = false;
      autoTimers.forEach(t => clearTimeout(t));
      autoTimers = [];
      const b = document.getElementById('btn-auto');
      if (b) {
        b.innerHTML = `<span class="text-[10px] bg-black/20 px-2 py-0.2 rounded-full mb-0.5">連続再生</span><span>▶ 自動再生</span>`;
      }
    }

    function startAuto() {
      stopAuto();
      isAutoPlaying = true;
      const b = document.getElementById('btn-auto');
      if (b) {
        b.innerHTML = `<span class="text-[10px] bg-black/20 px-2 py-0.2 rounded-full mb-0.5">再生中</span><span>■ ストップ</span>`;
      }

      applyStep(0);
      autoTimers.push(setTimeout(() => applyStep(1), 1100));
      autoTimers.push(setTimeout(() => applyStep(2), 2600));
      autoTimers.push(setTimeout(() => applyStep(3), 4600));
      autoTimers.push(setTimeout(() => stopAuto(), 5800));
    }

    // 起動
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
