<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数の大きさ比べアプリ</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --panel:#ffffff;
      --text:#243041;
      --muted:#6b7280;
      --border:#d9e2ec;
      --shadow:0 10px 30px rgba(19, 34, 58, .08);
      --pink:#ffd7e8;
      --pink-line:#e28ab3;
      --yellow:#fff0bf;
      --yellow-line:#e1bc47;
      --blue:#d8ebff;
      --blue-line:#6ca8e6;
      --white:#f7f9fc;
      --white-line:#c7d1df;
      --dec:#e5f5ea;
      --dec-line:#7fb98f;
      --accent:#22a06b;
      --accent-2:#2563eb;
      --danger:#d64545;
      --ok:#1f9d55;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 55%, #edf3f9 100%);
      color:var(--text);
    }

    .app{
      max-width: 1420px;
      margin: 0 auto;
      padding: 18px;
      min-height: 100vh;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:18px;
      padding:10px 14px;
      box-shadow:var(--shadow);
    }

    .titlebox{
      flex:0 1 auto;
      min-width:0;
    }

    .titlebox h1{
      margin:0;
      font-size:clamp(15px, 1.8vw, 22px);
      line-height:1.2;
      white-space:nowrap;
    }
    .titlebox p{
      display:none;
    }

    .toolbar{
      display:flex;
      gap:8px;
      flex-wrap:nowrap;
      align-items:center;
      margin-left:auto;
    }

    button{
      border:none;
      cursor:pointer;
      border-radius:16px;
      padding:14px 18px;
      font-size:16px;
      font-weight:700;
      box-shadow:var(--shadow);
      transition:transform .08s ease, box-shadow .15s ease, filter .15s ease;
      touch-action:manipulation;
    }
    button:active{transform:translateY(1px) scale(.99)}
    button:hover{filter:brightness(1.02)}

    .btn-primary{background:linear-gradient(180deg, #2eb06f, #21995d); color:#fff;}
    .btn-secondary{background:linear-gradient(180deg, #4f8fe8, #2c6cd8); color:#fff;}
    .btn-ghost{background:#fff; color:var(--text); border:1px solid var(--border)}
    .btn-warn{background:linear-gradient(180deg, #ffb84d, #ef9f1f); color:#fff;}

    .sound-btn{
      width:42px;
      height:42px;
      padding:0;
      border-radius:12px;
      font-size:22px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid transparent;
      box-shadow:var(--shadow);
      flex-shrink:0;
    }
    .sound-btn.sound-on{
      background:linear-gradient(180deg, #2eb06f, #21995d);
      color:#fff;
    }
    .sound-btn.sound-off{
      background:#eef2f7;
      color:#a0a8b3;
      border-color:#d7deea;
      box-shadow:none;
      filter:grayscale(1);
    }

    .star-box{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      font-weight:900;
      color:#334155;
    }
    .star-box strong{
      font-size:18px;
    }
    .star-reset{
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      background:#fff;
      border:1px solid #d8e2ee;
      box-shadow:none;
      color:#334155;
    }

    .main-grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:14px;
      align-items:start;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:16px;
    }

    .problem-area{
      display:grid;
      gap:14px;
      justify-items:center;
    }

    .numbers-row{
      display:grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap:14px;
      align-items:center;
      width:100%;
      max-width: 1320px;
      margin:0 auto;
    }

    @media (max-width: 860px){
      /* ＞＜＝は左右の関係を表すので、狭い画面でも左右配置を崩さない */
      .numbers-row{
        grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr);
        gap:6px;
      }
      .num-card{
        min-height:132px;
        padding:12px 4px 8px;
        gap:6px;
        border-radius:16px;
      }
      .place-labels{margin:0 2px;}
      .digit{padding:8px 0 10px; border-radius:12px;}
      .sign-box{
        min-width:72px;
        min-height:86px;
      }
      .sign-btn{
        width:68px;
        height:78px;
        border-radius:20px;
        font-size:44px;
        padding:4px;
      }
    }

    .num-card{
      position:relative;
      background:#fff;
      border:2px solid #dce5ef;
      border-radius:20px;
      padding:16px 10px 10px;
      min-height: clamp(168px, 24vw, 240px);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      gap:10px;
      width:100%;
      --places: 3;
      --digit-size: 60px;
      --label-size: 14px;
    }

    .place-labels{
      display:grid;
      grid-template-columns: repeat(var(--places), minmax(0, 1fr));
      gap:0;
      margin: 0 8px;
      text-align:center;
      font-size:var(--label-size);
      font-weight:900;
      color:#526170;
      letter-spacing:.02em;
      width:100%;
    }
    .place-labels span{
      padding:4px 0;
      border-radius:10px;
      line-height:1.15;
    }
    .place-labels .decimal-sep{
      background:transparent;
      border:none;
      padding:0;
      visibility:hidden;
    }
    .digit-row .decimal-sep{
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      border:none;
      padding:0;
      color:#334155;
      visibility:visible;
    }
    .decimal-point-svg{
      width:24px;
      height:24px;
      display:block;
      flex:0 0 auto;
    }
    .place-labels .pink{background:var(--pink)}
    .place-labels .yellow{background:var(--yellow)}
    .place-labels .blue{background:var(--blue)}
    .place-labels .white{background:var(--white)}
    .place-labels .dec{background:var(--dec)}

    .digit-row{
      display:grid;
      grid-template-columns: repeat(var(--places), minmax(0, 1fr));
      gap:0;
      align-items:center;
      justify-items:center;
      margin-top: 2px;
      width:100%;
    }

    .digit{
      width:100%;
      text-align:center;
      font-size: var(--digit-size);
      font-weight:900;
      line-height:1;
      padding:10px 0 14px;
      border-radius:16px;
      transition:background-color .15s ease, transform .15s ease, opacity .15s ease, box-shadow .15s ease;
    }
    .digit.pink{background:var(--pink); border:1px solid var(--pink-line)}
    .digit.yellow{background:var(--yellow); border:1px solid var(--yellow-line)}
    .digit.blue{background:var(--blue); border:1px solid var(--blue-line)}
    .digit.white{background:var(--white); border:1px solid var(--white-line)}
    .digit.dec{background:var(--dec); border:1px solid var(--dec-line)}
    .digit.active{
      box-shadow: 0 0 0 4px rgba(63, 118, 255, .18), 0 0 0 8px rgba(63, 118, 255, .06);
      transform: translateY(-1px) scale(1.02);
      animation: blink 0.7s steps(2, end) infinite;
    }
    @keyframes blink{
      50%{opacity:.28}
    }

    .sign-box{
      display:flex;
      justify-content:center;
      align-items:center;
      min-width: 130px;
      min-height: 130px;
    }
    .sign-btn{
      width: 124px;
      height: 124px;
      border-radius: 30px;
      font-size: 66px;
      font-weight: 900;
      background: linear-gradient(180deg, #fff, #f5f8fc);
      border: 3px solid #dbe4ef;
      box-shadow: 0 8px 20px rgba(15, 23, 42, .08), inset 0 1px 0 rgba(255,255,255,.9);
      color:#334155;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      user-select:none;
    }

    .sign-choice-area{
      width:min(680px, 100%);
      display:grid;
      gap:8px;
      justify-items:center;
      padding:2px 8px 0;
    }
    .choice-prompt{
      font-size:15px;
      font-weight:900;
      color:#42536a;
    }
    .sign-choices{
      display:grid;
      grid-template-columns:repeat(3, minmax(84px, 120px));
      gap:12px;
      justify-content:center;
      width:100%;
    }
    .sign-choice-btn{
      min-height:64px;
      padding:4px 10px 7px;
      border-radius:18px;
      border:2px solid #cfd9e6;
      background:#fff;
      color:#27364a;
      font-size:42px;
      font-weight:900;
      line-height:1;
      box-shadow:0 4px 12px rgba(15,23,42,.06);
    }
    .sign-choice-btn:hover{filter:none; background:#f8fbff;}
    .sign-choice-btn.selected{
      border-color:#2563eb;
      background:#eaf2ff;
      box-shadow:0 0 0 4px rgba(37,99,235,.12);
      transform:translateY(-1px);
    }
    .sign-choice-btn.wrong{
      border-color:#d64545;
      background:#fff0f0;
      box-shadow:0 0 0 4px rgba(214,69,69,.10);
      animation:wrongShake .22s ease-in-out 1;
    }
    @keyframes wrongShake{
      0%,100%{transform:translateX(0);}
      30%{transform:translateX(-4px);}
      70%{transform:translateX(4px);}
    }
    .speech.feedback-try{
      border-color:#f0c56d;
      background:#fffaf0;
    }
    .speech.feedback-focus{
      border-color:#79a7e8;
      background:#f3f8ff;
    }
    .sign-meaning{
      min-height:34px;
      width:100%;
      text-align:center;
      padding:7px 10px;
      border-radius:12px;
      background:#f8fbff;
      border:1px solid #dce7f4;
      color:#3f4f63;
      font-size:14px;
      font-weight:800;
      line-height:1.35;
    }
    .sign-meaning strong{
      font-size:18px;
      color:#1f4f91;
      margin-right:8px;
      white-space:nowrap;
    }

    /* 通常ルールより後に置き、狭い画面用サイズが確実に勝つようにする */
    @media (max-width: 860px){
      .num-card{
        min-height:132px;
        padding:12px 4px 8px;
        gap:6px;
        border-radius:16px;
      }
      .place-labels{margin:0 2px;}
      .digit{padding:8px 0 10px; border-radius:12px;}
      .sign-box{min-width:72px; min-height:86px;}
      .sign-btn{
        width:68px;
        height:78px;
        border-radius:20px;
        font-size:44px;
        padding:4px;
      }
    }

    @media (max-width: 520px){
      .sign-choices{grid-template-columns:repeat(3, minmax(68px, 1fr)); gap:8px;}
      .sign-choice-btn{min-height:56px; font-size:36px; border-radius:15px;}
      .sign-meaning{font-size:12px;}
      .sign-meaning strong{font-size:15px; display:block; margin:0 0 2px;}
    }

    /* ===== 学習操作を記号選択の直下に集約 ===== */
    .answer-workbench{
      width:min(760px, 100%);
      display:grid;
      gap:10px;
      justify-items:center;
      padding:14px;
      border:2px solid #d9e6f7;
      border-radius:20px;
      background:linear-gradient(180deg,#fbfdff,#f4f8fd);
      box-shadow:0 8px 22px rgba(15,23,42,.05);
    }
    .answer-workbench .sign-choice-area{
      width:100%;
      padding:0;
    }
    .learning-actions{
      width:100%;
      display:grid;
      grid-template-columns:minmax(0, .9fr) minmax(0, 1.35fr) minmax(0, .9fr);
      gap:10px;
      align-items:stretch;
    }
    .learning-actions button{
      width:100%;
      min-height:54px;
      padding:10px 12px;
      border-radius:15px;
      font-size:15px;
      box-shadow:0 4px 12px rgba(15,23,42,.07);
    }
    .learning-actions #checkBtn{
      font-size:17px;
      font-weight:900;
      box-shadow:0 6px 16px rgba(31,157,85,.18);
    }
    .learning-actions #checkBtn:disabled{
      cursor:default;
      background:#d9e3dd;
      color:#7b8a81;
      box-shadow:none;
      filter:none;
      opacity:.82;
    }
    .learning-actions #hintBtn{
      background:#eef5ff;
      color:#2557a7;
      border:2px solid #c8dcfa;
    }
    .learning-actions #nextBtn{
      background:#fff;
      color:#42536a;
      border:2px solid #d8e2ee;
    }
    .learning-actions .action-icon{
      display:inline-block;
      margin-right:5px;
      font-weight:900;
    }
    .top-learning-tools{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .top-learning-tools #toggleSettingsBtn{
      padding:9px 12px !important;
      font-size:13px !important;
      border-radius:12px;
      box-shadow:none;
    }
    .expr-local-actions{
      display:flex;
      justify-content:center;
      gap:10px;
      width:100%;
      margin-top:2px;
    }
    .expr-local-actions button{min-width:150px;}

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
    }

    .status{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      padding:12px 14px;
      background:#f8fbff;
      border:1px solid #dce7f4;
      border-radius:16px;
      font-size:15px;
      width:100%;
    }
    .status strong{font-size:18px}

    .speech{
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
      gap:8px 12px;
      width:100%;
      padding:11px 14px;
      border-radius:16px;
      background:#eef6ff;
      border:2px solid #cfe1f7;
      color:#334155;
      line-height:1.45;
    }
    .speech .lead{
      font-weight:900;
      color:#245a9b;
      white-space:nowrap;
    }
    .speech #speechText{
      font-size:16px;
      font-weight:800;
    }
    .speech .mini-note{display:none;}
    .num-card.card-active{
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.13);
    }

    .setting-box{
      margin-top:12px;
      border-top:1px dashed #dae4ef;
      padding-top:12px;
      display:none;
      width:100%;
    }
    .setting-box.open{display:block}
    .setting-grid{
      display:grid;
      grid-template-columns:1fr auto auto auto;
      gap:8px;
      align-items:center;
      margin-top:10px;
    }
    .setting-name{font-weight:800}
    .value-pill{
      min-width:56px;
      text-align:center;
      padding:10px 12px;
      border-radius:14px;
      background:#f3f7fb;
      border:1px solid #d8e2ee;
      font-weight:900;
    }
    .smallbtn{
      width:44px;
      height:44px;
      border-radius:14px;
      padding:0;
      font-size:22px;
      box-shadow:none;
      background:#fff;
      border:1px solid #d8e2ee;
    }

    .popup-backdrop{
      position:fixed;
      inset:0;
      background:rgba(15, 23, 42, .28);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
      padding:18px;
    }
    .popup-backdrop.show{display:flex}
    .popup{
      width:min(620px, 100%);
      background:#fff;
      border-radius:24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.22);
      border:1px solid #dde6f1;
      overflow:hidden;
      animation: pop .18s ease-out;
    }
    @keyframes pop{
      from{transform:scale(.96); opacity:.5}
      to{transform:scale(1); opacity:1}
    }
    .popup-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:14px 16px;
      background:linear-gradient(180deg, #f9fbff, #eef5ff);
      border-bottom:1px solid #dde6f1;
      font-weight:900;
    }
    .popup-body{
      padding:16px;
      display:grid;
      gap:14px;
    }
    .popup-close{
      width:42px;
      height:42px;
      padding:0;
      border-radius:14px;
      background:#fff;
      border:1px solid #d8e2ee;
      box-shadow:none;
      font-size:24px;
      line-height:1;
    }

    .result-text{
      text-align:center;
      font-size:18px;
      font-weight:900;
      line-height:1.5;
    }
    .result-text.ok{color:var(--ok)}
    .result-text.ng{color:var(--danger)}

    .footer-tip{
      color:var(--muted);
      font-size:12px;
      margin-top:-4px;
    }

    .custom-box{
      margin-top:14px;
      padding:14px;
      border:1px solid #d8e2ee;
      border-radius:18px;
      background:#fbfdff;
      display:grid;
      gap:12px;
    }
    .custom-title{
      font-weight:900;
      font-size:16px;
    }
    .custom-inputs{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:10px;
    }
    .custom-field{
      display:grid;
      gap:6px;
      font-weight:800;
      color:#334155;
    }
    .custom-field span{
      font-size:13px;
    }
    .custom-field input{
      width:100%;
      border:1px solid #cfd9e6;
      border-radius:14px;
      padding:12px 12px;
      font-size:16px;
      background:#fff;
      color:var(--text);
      outline:none;
    }
    .custom-field input:focus{
      border-color:#6ca8e6;
      box-shadow:0 0 0 4px rgba(108,168,230,.14);
    }
    .custom-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .custom-actions button{
      flex:1 1 180px;
    }
    .mode-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:76px;
      padding:8px 12px;
      border-radius:999px;
      background:#eef5ff;
      border:1px solid #d9e6f7;
      color:#2557a7;
      font-weight:900;
      font-size:13px;
    }

    .hidden{display:none !important;}
    .nowrap{white-space:nowrap}

    svg{max-width:100%; height:auto; display:block}

    /* ===== タブ ===== */
    .tab-bar{
      display:flex;
      gap:4px;
      background:#eef3fa;
      border-radius:14px;
      padding:4px;
      border:1px solid #d4dff0;
      flex-shrink:0;
    }
    .tab-btn{
      flex:1;
      padding:8px 14px;
      border-radius:10px;
      font-size:13px;
      font-weight:800;
      background:transparent;
      color:#5a6a82;
      border:none;
      white-space:nowrap;
      box-shadow:none;
      transition:background .15s, color .15s;
    }
    .tab-btn.active{
      background:#fff;
      color:#1a3a6e;
      box-shadow:0 2px 8px rgba(20,40,90,.10);
    }
    .tab-panel{display:none}
    .tab-panel.active{display:block}

    /* ===== 式比較モード ===== */
    .expr-area{
      display:grid;
      gap:16px;
    }

    .expr-problem-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .expr-box{
      background:#fff;
      border:2px solid #d0ddf0;
      border-radius:20px;
      padding:18px 22px;
      font-size:clamp(28px,5vw,52px);
      font-weight:900;
      color:#1a3a6e;
      min-width:clamp(140px,28vw,240px);
      text-align:center;
      line-height:1.2;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    /* 式のspan群は横並びに */
    .expr-box > span,
    .expr-box > .expr-formula {
      display:inline;
      white-space:nowrap;
    }
    /* 式を横並びにまとめるラッパー */
    .expr-formula {
      display:block;
      white-space:nowrap;
    }
    .expr-box .op{color:#c85a00}
    .expr-box .num{color:#1a3a6e}

    .expr-sign-box{
      display:flex;
      justify-content:center;
      align-items:center;
      min-width:100px;
    }

    .expr-sign-btn{
      width:100px;
      height:100px;
      border-radius:24px;
      font-size:54px;
      font-weight:900;
      background:linear-gradient(180deg,#fff,#f5f8fc);
      border:3px solid #dbe4ef;
      box-shadow:0 8px 20px rgba(15,23,42,.08), inset 0 1px 0 rgba(255,255,255,.9);
      color:#334155;
    }
    .expr-sign-btn small{
      display:block;
      font-size:13px;
      margin-top:-4px;
      font-weight:700;
      color:#64748b;
    }

    .expr-status{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      padding:10px 14px;
      background:#f8fbff;
      border:1px solid #dce7f4;
      border-radius:14px;
      font-size:15px;
    }
    .expr-status strong{font-size:17px}

<body>
