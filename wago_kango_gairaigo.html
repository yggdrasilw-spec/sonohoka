 ['会社が 新しく 出す 店の 数を 発表します。','「来年、全国で 100＿＿を 新たに 開きます」','k',W4,'店を 数える ときは「100店舗」が よく 使われるよ。',''],
 ['ざっか屋さんが、かんばんに 短い 店名を 書きます。','「ざっか＿＿」','g',W4,'「ざっかショップ」は 店名に 使えるね。「ざっかの みせ」なら「の」を 入れると 自然だよ。',''],
 ['むかし話の 山おくで、旅人が 一晩 とまります。','「たびびとは 山おくの ＿＿に とまりました」','w',W5,'むかし話の 旅の 場面では「やど」が 自然。ホテルは 宿の 一種だよ。',''],
 ['市の 調査で、旅館とホテルの 両方を まとめて 数えます。','「市内の ＿＿の 数を 調べました」','k',W5,'「宿泊施設」は、旅館も ホテルも ふくむ 名前。「やど」も 広い 意味で 使えるよ。','w'],
 ['海が 見える 宿泊施設を、旅行の パンフレットで 紹介します。','「うみが 見える リゾート＿＿」','g',W5,'旅行の 案内では「リゾートホテル」という 名前を よく 見るよ。',''],
 ['家で 子どもに 声を かけます。','「そろそろ ＿＿の じかんだよ」','w',W6,'「ひるごはん」は 家庭の 会話で 身近。「ランチ」や「昼食」も 意味は 通じるよ。','kg'],
 ['遠足の 日程表。「集合」「見学」と ならべる、短い 見出しです。','「12時\u3000＿＿」','k',W6,'「昼食」は「集合」「見学」と 同じ 二字の 漢語。日程表で 見出しの 形を そろえられるよ。','wg'],
 ['カフェが、昼の セット料理に 名前を つけます。','「本日の おすすめ パスタ＿＿ 900円」','g',W6,'「パスタランチ」は、昼の メニューの 名前として 自然だよ。',''],
 ['おばあちゃんが、まごに 手紙を 書きます。','「たんじょうびの ＿＿を おくります」','w',W7,'「おくりもの」も「プレゼント」も 自然だね。「記念品」は 行事などの 記念に わたす ものだよ。','g'],
 ['学校が 卒業を 記念して、卒業生 全員に 同じ 品を わたします。','「そつぎょう生に ＿＿を おくります」','k',W7,'どれでも 通じるよ。「記念品」なら、卒業の 記念の 品だと 短く 伝えられるね。','wg'],
 ['友だちが、クリスマスに もらった ものを 聞きます。','「クリスマス＿＿は なにを もらった？」','g',W7,'「クリスマスプレゼント」は よく 使われる 言い方。「クリスマスの おくりもの」とも 言えるね。',''],
 ['クラスで、みんなの 意見を 聞く ことを 提案します。','「きゅうしょくの あとで ＿＿を しよう」','w',W8,'「はなしあい」は、意見を 出し合う 活動を 表すよ。「会議」や「ミーティング」も 集まり方によって 使えるね。','kg'],
 ['会社の 正式な 予定表に 書きます。','「午後に ＿＿が あります」','k',W8,'どれでも 通じるよ。正式な 会の 名前に「会議」が 使われることが 多いね。','wg'],
 ['画面の「ミーティングに 参加」を 押して 集まります。','「オンライン＿＿を はじめましょう」','g',W8,'画面の 名前と そろえるなら「オンラインミーティング」。「オンライン会議」も よく 使うよ。','k'],
 ['友だちが にもつを たくさん 持っています。','「おもそうだね。＿＿しようか」','w',W9,'「手だすけしようか」と 言えば、身近な 手伝いの 申し出に なるよ。「サポートする」も 意味は 近いね。','g'],
 ['ニュースが、寄付や 相談員の 派遣などを 一つの ことばで まとめます。','「被災した 人たちへの ＿＿が ひろがっています」','k',W9,'「支援」は お金・物・人などの 助けを 広く 表すよ。「サポート」も 意味は 近いね。','g'],
 ['スポーツ用品店の 案内。カタカナで 書いた サービス名を 入れます。','「ランナー＿＿：くつの えらびかたを 助けます」','g',W9,'サービス名に 使える 外来語は「サポート」。「支援」も 助けることを 表すよ。','']
];
let m='t',i=0,Q2=[],qi=0,sc=0,done=0,snd=true,ac,kd='a',answers=[];
let feedbackTimer;
function stop(){clearTimeout(feedbackTimer);try{window.speechSynthesis?.cancel()}catch(e){}}
const slide=$('#slide');
slide.innerHTML=S.map((s,n)=>`<option value="${n}">${n+1}. ${s.h}</option>`).join('');
slide.onchange=()=>{i=Number(slide.value);show(false)};
function say(t){if(!snd)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function beep(a){if(!snd)return;try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume().catch(()=>{});a.forEach((f,j)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+j*.15;o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.3)})}catch(e){}}
function goTitle(){m='t';i=0;show()}
function show(focus=true){
 stop();
 const h=$('#hd'),b=$('#bd'),bk=$('#bk'),nx=$('#nx'),sp=$('#sp'),pg=$('#pg');
 sp.hidden=false;nx.hidden=false;bk.hidden=false;slide.hidden=m!=='s';pg.hidden=m==='s';
 bk.disabled=false;nx.disabled=false;h.className='';
 let ti;
 if(m=='t'){
  ti='ことばの 学習';
  pg.textContent='すきな メニューを えらんでね';
  bk.hidden=true;
  nx.hidden=true;
  b.innerHTML=`<div class="col">
   <div class="cv-box">
    <p class="sm">小学校 5年 国語</p>
    <div class="cv-tt">和語・漢語・外来語</div>
    <div>${T.map(t=>`<span class="cv-bdg ${t}" style="background:var(--c)">${N[t]}</span>`).join('')}</div>
   </div>
   ${rw([
    '<button class="mb" data-m="s">① スライド<small>なりたちと 使い方</small></button>',
    '<button class="mb" style="--c:#285fba" data-k="a">② ことばの なかま<br>クイズ<small>3たくで わけよう</small></button>',
    '<button class="mb" style="--c:#8a4fc7" data-k="b">③ ふさわしい ことば<br>クイズ<small>場面に 入れて くらべる</small></button>'
   ])}
  </div>`;
  sp.onclick=()=>say('わご、かんご、がいらいご。いち、スライド。に、ことばの なかま クイズ。さん、ふさわしい ことば クイズ。すきな メニューを えらんでね。');
 }else if(m=='s'){
  const s=S[i];slide.value=String(i);h.className=s.t||'';ti=s.h;b.innerHTML=s.b;pg.textContent=`${i+1} / ${S.length}`;
  bk.textContent=i==0?'◀ ひょうしへ':'◀ もどる';
  nx.textContent=i==S.length-1?'② クイズへ ▶':'つぎへ ▶';
  sp.onclick=()=>say(s.s);
 }else if(m=='q'){
  const x=Q2[qi],B=kd=='b';ti=B?'③ ふさわしい ことば':'② ことばの なかま';pg.textContent=`もんだい ${qi+1} / ${Q2.length}`;
  b.innerHTML=`<div class="col${B?' b':''}">${B?`<div class="sc">${x[0]}</div><div class="qs">${x[1]}</div>`:`<div class="qw">${x[0]}</div>`}${B?'<p class="compare">空らんに 入れるなら？ 合う 言い方が いくつか あるよ。</p>':'<p class="compare">どの なかまの ことば？</p>'}${rw((B?sh(T):T).map(t=>`<button class="ab" data-t="${t}">${B?x[3][t]:rb(N[t],NY[t])}</button>`))}<div id="fb" role="status"></div></div>`;
  bk.textContent='◀ ひょうしへ';nx.textContent=qi==Q2.length-1?'けっか ▶':'つぎへ ▶';nx.disabled=!done;
  sp.onclick=()=>say(B?(x[0]+x[1]).replace(/＿＿/g,'なにか'):x[1]);
 }else{
  ti='けっか';pg.textContent='';sp.hidden=true;
  const B=kd==='b';
  b.innerHTML=`<div class="col"><div class="qw">${sc} / ${Q2.length}</div><p>${B?'場面に 合う 言い方を えらべた 数':'せいかいした 数'}</p>
  <details class="result-review"><summary>こたえを ふりかえる</summary><ol>${answers.map(({x,t,ok})=>`<li>${ok?'○':'△'} ${B?x[1].replace('＿＿',x[3][t]):x[0]}<br>${B?x[4]:E[x[2]]}</li>`).join('')}</ol></details></div>`;
  bk.textContent='◀ ひょうしへ';nx.textContent='もういちど ▶';
 }
 h.innerHTML=`<h1>${ti}</h1><div id="bn">${m==='s'?'<button id="hm">🏠 ひょうし</button>':''}<button id="sn" aria-pressed="${snd}">おと ${snd?'ON':'OFF'}</button></div>`;
 if($('#hm'))$('#hm').onclick=goTitle;
 $('#sn').onclick=e=>{
  snd=!snd;stop();
  if(!snd&&ac?.state==='running')ac.suspend().catch(()=>{});
  e.currentTarget.textContent='おと '+(snd?'ON':'OFF');
  e.currentTarget.setAttribute('aria-pressed',snd);sp.disabled=!snd;
 };
 sp.disabled=!snd;b.scrollTop=0;if(focus)b.focus({preventScroll:true});
}
$('#bd').onclick=e=>{
 const bt=e.target.closest('button');if(!bt)return;
 if(m=='t'){if(bt.dataset.m=='s'){m='s';i=0;show()}else if(bt.dataset.k)start(bt.dataset.k);return}
 const t=bt.dataset.t;if(m!='q'||done||!t)return;
 const x=Q2[qi],B=kd==='b',accepted=B?x[5]:'',ok=t===x[2]||accepted.includes(t);
 done=1;sc+=Number(ok);answers.push({x,t,ok});
 document.querySelectorAll('.ab').forEach(choice=>{
  const key=choice.dataset.t,fits=key===x[2]||accepted.includes(key);
  choice.disabled=true;choice.classList.add(fits?'ok':key===t?'ng':'dim');
 });
 const title=B?(ok?'○ 場面に 合うね！':'△ 入れた 文を くらべよう'):(ok?'○ せいかい！':`△ この ことばは「${N[x[2]]}」`);
 const detail=B?`<div>${x[1].replace('＿＿',x[3][t])}</div>${t!==x[2]?`<div>言いかえると ${x[1].replace('＿＿',x[3][x[2]])}</div>`:''}${x[4]}`:E[x[2]];
 $('#fb').innerHTML=`<b class="${ok?'o':'x'}">${title}</b><div>${detail}</div>`;
 $('#nx').disabled=false;$('#nx').focus({preventScroll:true});$('#fb').scrollIntoView({block:'nearest'});
 stop();beep(ok?[660,880]:[320]);
 if(snd)feedbackTimer=setTimeout(()=>say((ok?'いいですね。':'くらべてみましょう。')+yomi(B?x[4]:E[x[2]])),320);
};
$('#bk').onclick=()=>{if(m=='s'){if(i>0){i--;show()}else goTitle()}else goTitle()};
const sh=a=>{a=[...a];for(let n=a.length;n>1;){const j=Math.random()*n--|0;[a[n],a[j]]=[a[j],a[n]]}return a};
const PER=5,PER2=2,yomi=s=>s.replace(/和語/g,'わご').replace(/漢語/g,'かんご').replace(/外来語/g,'がいらいご');
function start(k){kd=k||kd;m='q';const P=kd=='b'?PER2:PER,L=kd=='b'?C:Q;Q2=sh(T.flatMap(t=>sh(L.filter(x=>x[2]==t)).slice(0,P)));qi=sc=done=0;answers=[];show()}
$('#nx').onclick=()=>{if(m=='s'){if(i<S.length-1){i++;show()}else start('a')}else if(m=='q'&&done){done=0;if(qi<Q2.length-1){qi++;show()}else{m='r';show()}}else if(m=='r')start()};
addEventListener('keydown',e=>{
 if(e.repeat||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('button,select,a,summary')||m!=='s')return;
 if(e.key==='ArrowRight'){e.preventDefault();$('#nx').click()}
 if(e.key==='ArrowLeft'){e.preventDefault();$('#bk').click()}
});
addEventListener('pagehide',stop);
show(false);
</script></body></html>
