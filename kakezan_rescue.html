<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九九のたすけ舟 — わすれても、つくれる。</title>
<link rel="stylesheet" href="kakezan-rescue/style.css">
<body>
<main>
  <header><a class="brand" href="kakezan_rescue.html"><span class="brand-mark">✳</span> 九九のたすけ舟</a><span class="tagline">わすれても、つくれる。</span><button id="sound" aria-pressed="false">おと OFF</button></header>
  <section class="intro"><div><p class="eyebrow">ひらめきの じっけんしつ</p><h1>あれ、答え なんだっけ？</h1><p>だいじょうぶ。知っている 九九から、つくってみよう。</p></div><div class="problem"><label>１つ分の数<select id="a" aria-label="かけられる数"></select></label><b>×</b><label>いくつ分<select id="b" aria-label="かける数"></select></label><span>＝ <strong id="topAnswer">？</strong></span><button id="random" aria-label="べつの問題">↻</button></div></section>
  <div class="workspace">
    <nav aria-label="答えのつくり方"><p class="eyebrow">どの 作戦で いく？</p><div id="strategies"></div><p class="nav-note">知っている 九九は<br>人それぞれ。<br>使いやすい 作戦を えらぼう。</p></nav>
    <section class="lab" aria-label="おはじきで考える">
      <div class="lab-top"><span id="badge">作戦 01</span><span class="legend"><i></i><span id="unitLabel">３こで １つ分</span></span></div>
      <div class="instruction"><h2 id="title"></h2><p id="description"></p></div>
      <div id="splitTools" hidden><div class="segmented"><button id="splitB" aria-pressed="true">いくつ分を わける</button><button id="splitA" aria-pressed="false">１つ分の数を わける</button></div><label class="cut-label">わける ところ <input id="cut" type="range" min="1" max="7" value="4"><output id="cutValue"></output></label></div>
      <div class="board"><svg id="board" viewBox="0 0 760 390" role="img" aria-labelledby="diagramTitle diagramDesc"><title id="diagramTitle">おはじきの図</title><desc id="diagramDesc"></desc><defs><radialGradient id="teal" cx="30%" cy="22%"><stop stop-color="#95e6cb"/><stop offset=".45" stop-color="#39b799"/><stop offset="1" stop-color="#168b77"/></radialGradient><radialGradient id="orange" cx="30%" cy="22%"><stop stop-color="#ffe7aa"/><stop offset=".5" stop-color="#f8b44b"/><stop offset="1" stop-color="#e58c32"/></radialGradient><filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="1.3" flood-color="#145d50" flood-opacity=".15"/></filter></defs><g id="plates"></g><g id="dots"></g><g id="annotations"></g></svg><div class="board-foot"><span><i class="key teal"></i><span id="key1">知っている 九九</span></span><span><i class="key orange"></i><span id="key2">あと １つ分</span></span></div></div>
      <div class="transport"><button id="play" class="primary">▶ うごかす</button><div class="scrub"><label for="progress">ゆびで うごかしても いいよ</label><input id="progress" type="range" min="0" max="1000" value="0" aria-label="図の動き"></div><button id="reset" class="reset" aria-label="はじめにもどす">↶</button></div>
      <div class="math" aria-live="polite"><p id="equation"></p><p id="explanation"></p></div>
      <div class="bottom"><span id="status">すきな速さで、ためしてみよう。</span><button id="nextStrategy">ほかの 作戦も ためす →</button></div>
    </section>
  </div>
  <footer>「１つ分の数 × いくつ分」で 考えよう。<a href="kakezan_wakeyou.html">もっと「かけ算を わけよう」↗</a></footer>
</main>
<script src="kakezan-rescue/app.js"></script>
</body>
</html>
