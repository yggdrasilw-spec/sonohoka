<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九九のたすけ舟</title>
<link rel="stylesheet" href="kakezan-rescue/style.css">
<body><main>
<header><h1>九九の たすけ舟</h1><button id="sound" aria-pressed="true">こえ ON</button></header>
<div class="problem" aria-label="かんがえる かけ算"><select id="a" aria-label="かけられる数"></select><span>×</span><select id="b" aria-label="かける数"></select><span>＝</span><strong id="topAnswer">？</strong><button id="random" aria-label="べつの もんだい">↻</button></div>
<section class="playground" aria-label="おはじきで かんがえよう">
<div class="guide"><svg class="friend" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 9V59H17Z" fill="#fff" stroke="#345b80" stroke-width="3" stroke-linejoin="round"/><path d="M56 16L83 50H56Z" fill="#ffc967"/><path d="M9 61Q50 53 91 61L78 85Q50 98 22 85Z" fill="#fa9671" stroke="#c76240" stroke-width="3" stroke-linejoin="round"/><circle cx="39" cy="73" r="3" fill="#633e38"/><circle cx="61" cy="73" r="3" fill="#633e38"/><path d="M44 82Q50 87 56 82" fill="none" stroke="#633e38" stroke-width="3" stroke-linecap="round"/></svg><div class="bubble"><p id="description"></p><button id="listen" aria-label="せつめいを もういちど きく">▶ きく</button></div></div>
<div id="splitTools" hidden><div class="segmented"><button id="splitB" aria-pressed="true">たてに わける</button><button id="splitA" aria-pressed="false">よこに わける</button></div><label class="sr-only" for="cut">わける ところ</label><input id="cut" type="range" min="1" max="7" value="4" aria-label="わける ところ"></div>
<svg id="board" viewBox="0 0 760 390" role="group" aria-labelledby="diagramTitle diagramDesc"><title id="diagramTitle">おはじきを うごかそう</title><desc id="diagramDesc"></desc><defs><radialGradient id="teal" cx="32%" cy="24%"><stop stop-color="#9edbff"/><stop offset=".55" stop-color="#54adf0"/><stop offset="1" stop-color="#3484cc"/></radialGradient><radialGradient id="orange" cx="32%" cy="24%"><stop stop-color="#ffe4a0"/><stop offset=".55" stop-color="#ffb750"/><stop offset="1" stop-color="#ef8a36"/></radialGradient></defs><g id="destination"></g><g id="plates"></g><g id="dots"></g><g id="annotations"></g><g id="handles"></g></svg>
<div class="math" aria-live="polite" aria-atomic="true"><p id="equation"></p></div>
<div class="transport"><button id="reset" aria-label="はじめに もどす">↶</button><button id="play" class="primary">3こを いれる</button><button id="next" hidden>つぎの もんだい →</button></div>
<details class="slow"><summary>ゆっくり うごかす</summary><label for="progress" class="sr-only">図の うごき</label><input id="progress" type="range" min="0" max="1000" value="0" aria-label="図の うごき"></details>
</section>
<nav aria-label="ほかの やりかた"><div id="strategies"></div></nav><p id="speechStatus" role="status"></p>
</main><script src="kakezan-rescue/speech.js"></script><script src="kakezan-rescue/app.js"></script></body></html>
