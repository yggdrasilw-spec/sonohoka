<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おなじ大きさの分数</title>
<style>
:root{--b:#2b6fd6;--o:#c76a00;--g:#1f9a63;--ink:#233;--bg:#eef3f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
main{max-width:1280px;margin:0 auto;padding:10px}
h1{font-size:20px;margin:2px 0 8px}
.bar,#fm,#ex,svg{background:#fff;border-radius:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:8px 12px}
button{font:inherit;border:2px solid #9ab;background:#fff;border-radius:8px;padding:3px 12px;cursor:pointer;color:var(--ink)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.3;cursor:default}
.st{display:flex;align-items:center;gap:6px}.st b{min-width:2ch;text-align:center;font-size:24px}
#ks button{margin-left:4px;padding:3px 10px}
.f{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 4px}
.f i{display:block;width:100%;height:2px;background:currentColor}
.B{color:var(--b);font-weight:700}.O{color:var(--o);font-weight:700}.G{color:var(--g);font-weight:700}
#fm{display:flex;justify-content:center;align-items:center;gap:8px;font-size:30px;min-height:100px;margin:8px 0}
svg{width:100%;display:block}
#ex{padding:8px 16px;min-height:112px;border-left:6px solid var(--g)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px}
.nav button{padding:6px 18px}.nav .c button{padding:2px 8px;margin:0 2px;font-size:15px}
.pop{transform-box:fill-box;transform-origin:center bottom;animation:pop .4s both}
@keyframes pop{from{opacity:0;transform:scaleY(.2)}}
.wipe{transform-box:fill-box;transform-origin:left;animation:wipe .45s both}
@keyframes wipe{from{transform:scaleX(0)}}
.wrap>div{min-width:0}.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px;align-items:start}
#nl{position:sticky;top:8px}#nl svg{max-height:calc(100vh - 16px);margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}#nl{position:static}}
@media(prefers-reduced-motion:reduce){.pop,.wipe{animation:none}}

button,select{min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a45b00;outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
.diagram{overflow-x:auto;border-radius:12px}.diagram:focus-visible{outline:3px solid #a45b00}
.diagram-hint{font-size:14px;color:#475569;margin:4px 0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:700px){#sv{min-width:600px}#fm{font-size:23px;flex-wrap:wrap}.nav{flex-wrap:wrap}.nav .c{order:3;width:100%}#nl{max-width:400px;margin:auto;width:100%}}
</style></head><body><main>
<h1>おなじ大きさの分数 ― 分子と分母に おなじ数を かける・わる</h1>
<div class="bar">
 <span><button id="mx">×かける</button> <button id="md">÷わる</button></span>
 <span class="st">分子<button data-p="n-">−</button><b id="vn"></b><button data-p="n+">＋</button></span>
 <span class="st">分母<button data-p="d-">−</button><b id="vd"></b><button data-p="d+">＋</button></span>
 <span class="st"><span id="kl"></span><span id="ks"></span></span>
 <button id="sn" title="こうかおん">🔊</button>
</div>
<div class="wrap"><div>
<div id="fm"></div>
<p class="diagram-hint">図が小さいときは、図を横にスクロールできます。</p><div class="diagram" tabindex="0" aria-label="テープ図。左右にスクロールできます"><svg id="sv" viewBox="0 0 680 290" role="img" aria-label="同じ1を分けたテープの比較"></svg></div>
<div id="ex" role="status"></div>
<div class="nav"><button id="pv">◀ もどる</button><span class="c" id="ch"></span><button id="nx"></button></div>
</div>
<aside id="nl"><svg id="nv" viewBox="0 0 360 650" role="img" aria-label="分母1から30までの数直線。同じ分数は同じ位置"></svg></aside></div>
</main>
<script>
function keepUI(){const active=document.activeElement, controls=[...document.querySelectorAll('button,input,select')],id=active?.id,index=controls.indexOf(active);
 const inputs=[...document.querySelectorAll('input')].map(e=>[e.id,e.value]);
 return ()=>{for(const [key,value] of inputs){const el=document.getElementById(key);if(el)el.value=value}
 const el=id?document.getElementById(id):[...document.querySelectorAll('button,input,select')][index];if(el&&!el.disabled)el.focus({preventScroll:true})};}

const $=s=>document.querySelector(s),gcd=(a,b)=>b?gcd(b,a%b):a;
const CB='#2b6fd6',CO='#f5a742',CO2='#fbc977',CG='#1f9a63',X=70,W=530,H=50,MAXT=30;
let S={m:'x',n:3,d:4,k:2,s:0,snd:true},AC;
const F=(n,d)=>`<span class="f"><span class="O">${n}</span><i></i><span class="B">${d}</span></span>`;
const B=t=>`<span class="B">${t}</span>`,O=t=>`<span class="O">${t}</span>`,G=t=>`<span class="G">${t}</span>`;
const isX=()=>S.m=='x';
const okk=i=>isX()?i<=Math.floor(MAXT/S.d):gcd(S.n,S.d)%i==0;
function fix(){if(isX()){S.d=Math.min(S.d,12)}S.d=Math.max(2,Math.min(S.d,isX()?12:MAXT));S.n=Math.max(1,Math.min(S.n,S.d-1));
 if(!(S.k>1&&okk(S.k))){S.k=0;for(let i=2;i<=MAXT;i++)if(okk(i)){S.k=i;break}}}
function cv(){const{n,d,k}=S;return isX()?{a:n,b:d,c:n*k,e:d*k}:{a:n,b:d,c:k?n/k:n,e:k?d/k:d}}
function beep(f){if(!S.snd)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.12)}catch(e){}}

function tape(y,n,d,o){const w=W/d;let h=`<rect x="${X}" y="${y}" width="${W}" height="${H}" fill="#fff"/>`;
 for(let i=0;i<n;i++){const f=o.alt&&Math.floor(i/o.alt)%2?CO2:CO;
  h+=`<rect class="${o.wipe?'wipe':''}" style="animation-delay:${i*60}ms" x="${X+i*w}" y="${y}" width="${w}" height="${H}" fill="${f}"/>`}
 for(let i=1;i<d;i++)h+=`<line class="${o.lc}" style="animation-delay:${i*35}ms" x1="${X+i*w}" x2="${X+i*w}" y1="${y}" y2="${y+H}" stroke="${CB}" stroke-width="1.5"/>`;
 h+=`<rect x="${X}" y="${y}" width="${W}" height="${H}" fill="none" stroke="#234" stroke-width="2"/>`;
 if(w>=11)for(let i=0;i<n;i++)h+=`<text class="${o.wipe?'pop':''}" style="animation-delay:${i*60+200}ms" x="${X+i*w+w/2}" y="${y+H/2+5}" text-anchor="middle" font-size="${Math.min(16,w*.65)}" font-weight="700" fill="#4a2800">${i+1}</text>`;
 h+=`<path d="M${X} ${y-6}Q${X} ${y-22} ${X+W/2-12} ${y-22}M${X+W/2+12} ${y-22}Q${X+W} ${y-22} ${X+W} ${y-6}" fill="none" stroke="#234" stroke-width="1.5"/><text x="${X+W/2}" y="${y-17}" text-anchor="middle" font-size="14">1</text>`;
 for(let g=0;g<(o.g||0);g++){const a=X+g*o.k*w+2,b=X+(g+1)*o.k*w-2,yy=y+H+5;
  h+=`<g class="${o.bc}" style="animation-delay:${g*80}ms"><path d="M${a} ${yy}v7H${b}v-7" fill="none" stroke="${CG}" stroke-width="2"/>${o.k*w>=34?`<text x="${(a+b)/2}" y="${yy+24}" text-anchor="middle" font-size="12" font-weight="700" fill="${CG}">${o.k}こ</text>`:''}</g>`}
 return h}
const sf=(y,n,d)=>`<g text-anchor="middle" font-size="16" font-weight="700"><text x="34" y="${y+H/2-5}" fill="#c76a00">${n}</text><line x1="20" x2="48" y1="${y+H/2}" y2="${y+H/2}" stroke="#234" stroke-width="2"/><text x="34" y="${y+H/2+19}" fill="${CB}">${d}</text></g>`;

function draw(){const{a,b,c,e}=cv(),s=S.s,x=isX(),k=S.k,gr=x?b:e,p=s==1?'pop':'';
 let h=tape(70,a,b,{lc:'',alt:!x&&s>=2?k:0,g:k&&!x&&s>=1?gr:0,k,bc:p})+sf(70,a,b);
 if(k&&s>=1)h+=tape(190,s>=2?c:0,e,{lc:p,wipe:s==2,alt:x&&s>=2?k:0,g:x?gr:0,k,bc:p})+sf(190,s>=2?c:'？',e);
 if(k&&s>=3){const gx=X+W*a/b;h+=`<line x1="${gx}" x2="${gx}" y1="70" y2="240" stroke="#c76a00" stroke-width="2" stroke-dasharray="5 4"/><text x="${gx+8}" y="152" font-size="16" font-weight="700" fill="#c76a00">おなじ長さ！</text>`}
 $('#sv').innerHTML=h;
 const op=x?'×':'÷',gk=G(op+k);
 $('#fm').innerHTML=F(a,b)+'＝'+(k?`<span class="f"><span class="O">${s>=2?a+gk:'？'}</span><i></i><span class="B">${s>=1?b+gk:'？'}</span></span>`+(s>=3?'＝'+F(c,e):''):'？')}

function nline(){const{a,b,c,e}=cv(),s=S.s,k=S.k,x0=40,L=290,R=20,Y=34,gx=x0+L*a/b,d0=b/gcd(a,b),yc=d=>Y+(d-.5)*R;
 let h=`<text x="${x0}" y="16" text-anchor="middle" font-size="13">0</text><text x="${x0+L}" y="16" text-anchor="middle" font-size="13">1</text><text x="4" y="${Y-5}" font-size="10" fill="#567">分母</text>`;
 for(let d=1;d<=30;d++){const y=yc(d),on=d==b||(k&&s>=1&&d==e);
  if(on)h+=`<rect x="2" y="${y-R/2}" width="356" height="${R}" fill="#e6effc"/>`;
  h+=`<text x="26" y="${y+4}" text-anchor="end" font-size="11" font-weight="${on?700:400}" fill="${CB}">${d}</text><line x1="${x0}" x2="${x0+L}" y1="${y}" y2="${y}" stroke="#789"/>`;
  for(let i=0;i<=d;i++){const t=i%d?4:7,xx=x0+L*i/d;h+=`<line x1="${xx}" x2="${xx}" y1="${y-t}" y2="${y+t}" stroke="#789"/>`}}
 const rows=[];
 if(k&&s>=3){for(let d=1;d<=30;d++)if(d%d0==0)rows.push(d);
  h+=`<line x1="${gx}" x2="${gx}" y1="${Y}" y2="${Y+30*R}" stroke="#c76a00" stroke-width="2" stroke-dasharray="5 4"/><text x="${Math.max(90,Math.min(280,gx))}" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#c76a00">おなじ位置！</text>`}
 else{rows.push(b);if(k&&s>=2)rows.push(e)}
 for(const d of rows){const n=a*d/b,y=yc(d),cl=d==b?'':d==e?(s==2?'pop':''):'pop';
  h+=`<g class="${cl}" style="animation-delay:${d*15}ms"><circle cx="${x0+L*n/d}" cy="${y}" r="4.5" fill="#e9820f" stroke="#fff"/><g text-anchor="middle" font-size="9" font-weight="700"><text x="349" y="${y-1}" fill="#c76a00">${n}</text><line x1="341" x2="357" y1="${y}" y2="${y}" stroke="#234"/><text x="349" y="${y+8}" fill="${CB}">${d}</text></g></g>`}
 $('#nv').innerHTML=h}
function ex(){const{a,b,c,e}=cv(),s=S.s,k=S.k,x=isX(),vb=x?'かける':'わる',vt=x?'かけても':'わっても';
 if(!k)return `${F(a,b)} は、${B(b)}と${O(a)}の どちらも わりきれる 1より大きい数が ないよ。これいじょう かんたんに できない分数（約分できない分数）なんだ。ほかの数も ためしてみよう。`;
 return [
 `${F(a,b)} を テープで 見よう。1を ${B(b)}こに 分けた ${O(a)}こぶん だね。これから ${B('分母')}と${O('分子')}を おなじ数 ${G(k)} で ${vb}と どうなるか 見ていこう。`,
 x?`${B('分母')}に ${G(k)} を かける。1こぶんを ${G(k)}こずつに 分けると、ぜんぶで ${b}×${k}＝${B(e)}こ。分け方が こまかくなっただけで、テープの 長さは そのままだよ。`
  :`${B('分母')}を ${G(k)} で わる。めもりを ${G(k)}こずつ ひとまとまりに すると、${b}÷${k}＝${B(e)}こに まとまる。まとめ方が かわっただけで、テープの 長さは そのままだよ。`,
 x?`色の ぶぶんを 見よう。もとの ${O(a)}こぶんは、1こぶんが ${G(k)}こずつに 分かれたから ${a}×${k}＝${O(c)}こぶん。${O('分子')}にも ${G(k)} を かけたことに なるね。`
  :`色の ぶぶんも ${G(k)}こずつ まとめると ${a}÷${k}＝${O(c)}こぶん。${O('分子')}も ${G(k)} で わったことに なるね。`,
 (()=>{const g=gcd(a,b),n0=a/g,d0=b/g,l=[];for(let i=1;i<=6&&d0*i<=36;i++)l.push(F(n0*i,d0*i));
  return `${F(a,b)} と ${F(c,e)} は 分け方が ちがうだけ。色の ぶぶんの 長さは ぴったり おなじ！ だから ${F(a,b)}＝${F(c,e)}。<br>分子と分母に おなじ数（0以外）を ${vt}、大きさは かわらないよ。<br><small>おなじ大きさの分数： ${l.join('＝')} …</small>`})()][s]}

function render(){const restore=keepUI();fix();const x=isX(),{n,d,k,s}=S;
 $('#mx').className=x?'on':'';$('#md').className=x?'':'on';
 $('#vn').textContent=n;$('#vd').textContent=d;document.querySelectorAll('[data-p]').forEach(el=>el.setAttribute('aria-label',(el.dataset.p[0]==='n'?'分子':'分母')+'を1'+(el.dataset.p[1]==='+'?'ふやす':'へらす')));
 document.querySelector('[data-p="n-"]').disabled=n<=1;document.querySelector('[data-p="n+"]').disabled=n>=d-1;
 document.querySelector('[data-p="d-"]').disabled=d<=2;document.querySelector('[data-p="d+"]').disabled=d>=(x?12:MAXT);
 $('#kl').textContent=x?'かける数 ':'わる数 ';
 $('#ks').innerHTML=Array.from({length:29},(_,j)=>j+2).filter(i=>i<=9||okk(i)).map(i=>`<button data-k="${i}" class="${i==k?'on':''}" ${okk(i)?'':'disabled'}>${i}</button>`).join('');
 $('#sn').textContent=S.snd?'🔊 音ON':'🔇 音OFF';$('#sn').setAttribute('aria-pressed',S.snd);$('#mx').setAttribute('aria-pressed',x);$('#md').setAttribute('aria-pressed',!x);
 $('#ch').innerHTML=k?['①はじめ','②分母','③分子','④くらべる'].map((t,i)=>`<button data-s="${i}" class="${i==s?'on':''}">${t}</button>`).join(''):'';
 $('#pv').disabled=!k||s==0;$('#nx').disabled=!k;$('#nx').textContent=s==3?'↻ さいしょから':'つぎへ ▶';
 document.querySelectorAll('[data-s],[data-k]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.s!==undefined?+el.dataset.s===s:+el.dataset.k===k));draw();nline();$('#ex').innerHTML=ex();$('#sv').setAttribute('aria-label',`${S.n}/${S.d} と同じ大きさの分数。${isX()?'かける':'わる'}数は${S.k||'なし'}。${S.s+1}段階目`);restore()}
function go(v){if(!S.k)return;S.s=v>0&&S.s==3?0:Math.max(0,Math.min(3,S.s+v));beep(440+S.s*110);render()}
document.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;const D=t.dataset;
 if(D.p){S[D.p[0]]+=D.p[1]=='+'?1:-1;S.s=0}
 else if(D.k){S.k=+D.k;S.s=0}
 else if(D.s)S.s=+D.s;
 else if(t.id=='mx'||t.id=='md'){S.m=t.id=='mx'?'x':'d';Object.assign(S,S.m=='x'?{n:3,d:4,k:2}:{n:6,d:8,k:2});S.s=0}
 else if(t.id=='sn')S.snd=!S.snd;
 else if(t.id=='pv')return go(-1);else if(t.id=='nx')return go(1);
 render()});
document.addEventListener('keydown',e=>{if(e.target.closest('button,input,select,.diagram'))return;if(e.key=='ArrowRight'){e.preventDefault();go(1)}else if(e.key=='ArrowLeft')go(-1)});
render();
</script></body></html>
