<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>熟語の組み立てマスター</title>
<style>
:root{--ink:#1d2a44;--sub:#566178;--bg:#eef3f8;--line:#c9d4e3;--ok:#1f8a4c;--okb:#e2f5ea;--ng:#a9501f;--ngb:#fdeee6}
*{box-sizing:border-box}html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;font-family:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--ink);color:#fff}
header .ttl{flex:1;font-weight:700}
header button{font:inherit;font-size:.85rem;color:#fff;background:transparent;border:2px solid #fff8;border-radius:999px;padding:6px 12px;cursor:pointer}
header button[aria-pressed=true]{background:#ffd75e;color:var(--ink);border-color:#ffd75e}
#app{max-width:1120px;margin:0 auto;padding:16px 18px 70px}
h1{font-size:clamp(2rem,4.6vw,3.3rem);margin:.3em 0 .1em}h2{font-size:clamp(1.25rem,2.6vw,1.8rem);margin:.5em 0}h3{margin:1em 0 .3em}
.lead{font-size:1.2rem;max-width:36em}.big{font-size:1.5rem;font-weight:700}.tag{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 14px;font-weight:700;margin:6px 0}
button{font-family:inherit}button:focus-visible{outline:4px solid #f5a300;outline-offset:2px}
.b{font:inherit;font-size:1.2rem;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 20px;min-height:60px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.b:disabled{opacity:.45;cursor:default}
.b.go{background:#ffd75e;margin-top:14px}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.menu,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:16px 0}
.b.big{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px;font-size:1.5rem}.b.big span{font-size:2rem}.b small{font-weight:400;font-size:.9rem;color:var(--sub)}
.lk{font:inherit;background:none;border:0;color:var(--sub);text-decoration:underline;cursor:pointer;margin-top:20px}
.k1{--c:#1f6fb2;--cb:#e1effb}.k2{--c:#c2452d;--cb:#fbe7e1}.k3{--c:#1e8a5a;--cb:#ddf3e8}.k4{--c:#a56d00;--cb:#fbf0cf}.k5{--c:#7d4cb8;--cb:#ece3f8}.k6{--c:#4b5d70;--cb:#e5eaf0}
.bd{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--c,#556);color:#fff;font-weight:700;margin-right:.35em;font-size:.95em;vertical-align:middle}
.card{font:inherit;text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--cb,#fff);border:4px solid var(--c,#9aa9c2);border-radius:18px;padding:14px 16px;color:var(--ink);cursor:pointer}
.card b{font-size:1.35rem}.card span{font-size:.9rem;color:var(--sub)}.card em{font-style:normal;font-size:.95rem;font-weight:700;color:var(--c)}
.dots{display:flex;gap:8px;margin:4px 0}.dots i{width:14px;height:14px;border-radius:50%;background:#cfd8e6}.dots i.dn{background:var(--ok)}.dots i.cur{background:#ffb800;outline:3px solid var(--ink)}
.lh{font-size:1.2rem;margin:4px 0}.panel{background:var(--cb,#fff);border-left:10px solid var(--c,var(--ink));border-radius:14px;padding:12px 20px;margin:12px 0}
.stage{text-align:center;margin:10px 0}.rd{font-size:1.4rem;color:var(--sub);letter-spacing:.2em}
.tl{display:flex;justify-content:center;align-items:flex-start;gap:6px}.split .tl,.splitted .tl{gap:60px}.tl.hr{gap:14px!important}
.split .tl{animation:sp .7s ease}@keyframes sp{from{gap:6px}}
.tile{width:min(30vw,190px);background:#fff;border:4px solid var(--c);border-radius:18px;padding:6px 6px 12px}@keyframes fi{from{opacity:.2}}
.tk{font-size:clamp(3.4rem,9vw,6rem);line-height:1.15}.tr{font-size:1.1rem;color:var(--sub)}.tm{font-size:1.1rem;font-weight:700}
.rel{align-self:center;min-width:150px;font-weight:700;font-size:1.15rem;color:var(--c);animation:fi .5s}
.nat{display:inline-block;font-size:1.4rem;font-weight:700;background:var(--cb);border-radius:14px;padding:8px 16px;margin:10px 0}.exs{font-size:1.15rem}
.prompt{font-size:clamp(1.3rem,2.8vw,2rem);font-weight:700;margin:8px 0}.prompt ruby{font-size:1.6em}.prompt rt{font-size:.38em}
.sp{font-size:1.1rem;border:2px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
.chs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}.chs.c2{grid-template-columns:repeat(2,1fr)}
.ch{font:inherit;font-size:1.2rem;min-height:72px;color:var(--ink);background:var(--cb,#fff);border:3px solid var(--c,#7a8aa5);border-radius:16px;padding:8px;cursor:pointer}
.ch ruby{font-size:1.5em}.ch rt{font-size:.4em}.ch.x{opacity:.45;border-style:dashed;text-decoration:line-through}.ch.o{outline:6px solid var(--ok);background:var(--okb)}.ch:disabled{cursor:default}
.hintb{font:inherit;font-size:1.05rem;background:#fff6d6;border:3px solid #e0a800;border-radius:12px;padding:8px 16px;cursor:pointer}
.hint,.soft,.guide{font-size:1.1rem;background:#fff6d6;border-radius:12px;padding:8px 14px;display:block}.soft{background:#e8f0fb}
.fb{border-radius:16px;padding:12px 18px;margin:12px 0}.fb.ok{background:var(--okb);border:3px solid var(--ok)}.fb.ng{background:var(--ngb);border:3px solid var(--ng)}.fbt{font-size:1.3rem;font-weight:700;margin:0}
.ex{background:#fff;border-left:8px solid var(--c);border-radius:10px;padding:6px 14px;margin:8px 0}.exh{font-size:1.2rem}.exh ruby{font-size:1.5em}.ex p{margin:2px 0}.pt{color:var(--sub)}.nat2{font-weight:700}.eg{color:var(--sub)}
.chip{font:inherit;font-size:1.15rem;background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 12px;margin:4px;cursor:pointer}.chip ruby{font-size:1.5em}.chip.sel{border-color:#f5a300;background:#fff6d6}.chip.o{border-color:var(--ok);background:var(--okb)}.chip.x{border-color:var(--ng);background:var(--ngb)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.cc{background:var(--cb);border:3px solid var(--c);border-radius:16px;padding:8px 14px}.cc.me{outline:6px solid #ffb800}.cc .q{font-weight:700;margin:2px 0}.cc ruby{font-size:1.4em}.cc p{margin:4px 0;line-height:2.1}
.neg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;text-align:center}.nc{background:#fff;border-radius:12px;padding:6px}.tip{background:#fff6d6;border-radius:12px;padding:8px 14px}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.mi{background:#fff;border-radius:10px;padding:6px 12px}.mi ruby{font-size:1.5em;margin-right:8px}
.bars{display:grid;gap:8px}.br{display:grid;grid-template-columns:2.2em 9em 1fr 11em;align-items:center;gap:8px}.bar{height:16px;background:#dfe6ef;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}.bt{font-size:.9rem}
.qv .tk{font-size:clamp(2.4rem,6vw,3.8rem)}.qv .tile{width:min(26vw,170px)}.qv .rd{display:none}.qv .stage{margin:4px 0}.mi{line-height:2}
.r-s{--c:#c2452d}.r-p{--c:#1f6fb2}.r-m{--c:#1e8a5a}.r-o{--c:#b27a00}.r-n{--c:#4b5d70}.r-e{--c:#7d4cb8}.r-x{--c:#7a8aa5}
.rl{display:block;background:var(--c);color:#fff;border-radius:8px;font-weight:700;font-size:.95rem;margin-top:6px;padding:0 4px}
.tile.spot{outline:6px solid #ffb800;outline-offset:3px;animation:pulse 1s 3}@keyframes pulse{50%{transform:scale(1.06)}}.here{font-weight:700;color:#b26a00;font-size:1rem;line-height:1.2}
.cue{display:inline-block;margin-left:.5em;font-size:1.05rem;font-weight:700;color:var(--c);background:#fff;border-radius:8px;padding:0 8px;vertical-align:middle}.qv .tr,.qv .tm{font-size:1rem}.kw{background:#ffe08a;border-radius:8px;padding:0 10px;font-size:1.15em;color:var(--ink)}.hint b{background:#ffe08a;border-radius:6px;padding:0 4px}
.ib{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;min-height:300px;margin:10px 0}.col{display:flex;flex-direction:column;gap:12px}
.iw{font-size:clamp(3.2rem,8vw,6.2rem);font-weight:700;text-align:center;background:#fff;border:5px solid var(--ink);border-radius:24px;padding:6px 26px;line-height:1.3}.iw small{display:block;font-size:1rem;font-weight:400;color:var(--sub)}.iw.sm{font-size:2.6rem;border-width:3px;padding:0 14px;display:inline-block}
.bb{position:relative;display:flex;gap:8px;align-items:flex-start;background:var(--bc);border-radius:20px;padding:8px 14px}.bb p{margin:0;font-size:1.1rem;line-height:1.5}.bb small{color:var(--sub);font-weight:700}.fc{font-size:2rem;line-height:1}
.bb:after{content:"";position:absolute;top:22px;border:10px solid transparent}.bb.lt:after{right:-18px;border-left-color:var(--bc)}.bb.rt:after{left:-18px;border-right-color:var(--bc)}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.5);opacity:0}}
.kd0{--bc:#ffe3ec}.kd1{--bc:#dff0ff}.kd2{--bc:#e6f7d9}.kd3{--bc:#fff1c9}
.mp{min-height:45vh;display:grid;place-items:center;text-align:center;font-size:clamp(1.5rem,3.4vw,2.4rem);font-weight:700;line-height:1.9;animation:ap 1.2s}@keyframes ap{from{opacity:0}}
.world{position:relative;overflow:hidden;border-radius:22px;min-height:52vh;display:grid;place-items:center;text-align:center;padding:20px;background:linear-gradient(#cfe9ff,#eaf7dc 70%,#b9dfa3)}
.world:before,.world:after{content:"";position:absolute;top:0;bottom:0;width:50%;background:#fffaf0;box-shadow:inset 0 0 40px #e5d9bd;z-index:2;animation:pg 2.6s ease-in-out .6s forwards}
.world:before{left:0;transform-origin:left;--d:-100deg}.world:after{right:0;transform-origin:right;--d:100deg}
@keyframes pg{to{transform:perspective(900px) rotateY(var(--d));opacity:0}}
.world h2{font-size:clamp(1.8rem,4.6vw,3.2rem)}.world h2,.world p{position:relative;z-index:1;animation:ap 2s 2s both}.world p{font-size:1.2rem}
button.tile{font:inherit;color:var(--ink);cursor:pointer}
.vsw{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.vb{font:inherit;font-weight:700;font-size:1.1rem;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px;min-height:78px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.vb span{font-size:1.6rem;line-height:1.2}.vb small{font-weight:400;font-size:.85rem;color:var(--sub)}
.vb[aria-pressed=true]{background:#fff6d6;border-color:#f5a300;box-shadow:0 0 0 3px #f5a30055}
.chips{margin:8px 0 14px}.lead.sm{font-size:1.05rem}
@media(max-width:700px){.ib.seq{display:flex;flex-direction:column;min-height:0}.ib.seq .col{display:contents}.ib.seq .iw{order:-1}.ib.seq .bb{order:var(--o)}}
@media(max-width:700px){.ib{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.world:before,.world:after{display:none}}
.prog{color:var(--sub);font-weight:700}details{background:#fff;border-radius:12px;padding:6px 14px;margin:10px 0}summary{cursor:pointer;font-weight:700}details p{margin:4px 0}
@media(max-width:700px){html{font-size:16px}.chs{grid-template-columns:1fr 1fr}.br{grid-template-columns:2.2em 1fr;}.br .bar,.br .bt{grid-column:1/-1}.tile{width:40vw}.split .tl,.splitted .tl{gap:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== 見た目アップグレード「ことばの星図」: 夜空の青と星の金を軸に、上のルールを上書きする ===== */
:root{--night:#0a1230;--night2:#1b2a6b;--gold:#f5c04a;--gold2:#ffe5a0;--ink:#172042;--sub:#58628a;--line:#d5daee;--bg:#f0f2fa;--serif:"BIZ UDPMincho","Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif CJK JP",serif;--sans:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;--lift:0 12px 24px -16px rgba(10,18,48,.55)}
html{background:var(--bg)}
body{min-height:100vh;background:radial-gradient(760px 380px at 96% -60px,#dfe4ff 0,transparent 70%),radial-gradient(640px 360px at -8% 0,#fff2cf 0,transparent 66%),var(--bg);background-repeat:no-repeat}
h1,h2{font-family:var(--serif)}h2{letter-spacing:.03em}.lead{color:#2b3558}
/* ヘッダー: 夜空の帯と金の縁、星の印 */
header{position:relative;overflow:hidden;gap:10px;padding:9px 18px;background:linear-gradient(110deg,var(--night),var(--night2));border-bottom:3px solid var(--gold)}
header:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.75;background-image:radial-gradient(1.4px 1.4px at 22px 16px,#fff 50%,transparent 53%),radial-gradient(1px 1px at 84px 36px,#ffffffcc 50%,transparent 53%),radial-gradient(1.3px 1.3px at 150px 14px,var(--gold2) 50%,transparent 53%);background-size:190px 56px}
header>*{position:relative}
header .ttl{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;letter-spacing:.08em;white-space:nowrap}
@media(max-width:700px){header .ttl{font-size:1rem;letter-spacing:.03em}}
header .ttl:before{content:"熟";display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d2,var(--gold));color:var(--night);font-size:1.05rem;font-weight:700;letter-spacing:0;box-shadow:0 0 0 3px #f5c04a44,0 0 16px #f5c04a99}
header button{background:#ffffff14;border:1.5px solid #ffffff55}header button:hover{background:#ffffff26}
header button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--night)}
/* ボタン・ラベル */
.b{background:linear-gradient(#fff,#eef0fa)}.b.go{background:linear-gradient(#ffe9a6,var(--gold))}.b:disabled{box-shadow:0 4px 0 var(--ink)}
.tag{background:#fff;border:2px solid var(--gold);color:var(--ink);box-shadow:0 0 0 3px #f5c04a33}
.prog{display:inline-block;padding:0 14px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:.95rem}
/* 学ぶ: 進みぐあいの点・見出し・パネル・カード */
.dots{gap:9px;margin:8px 0 4px}.dots i{width:15px;height:15px;background:#fff;border:2px solid #b9c0de}
.dots i.dn{background:var(--c,var(--ok));border-color:var(--c,var(--ok))}
.dots i.cur{background:var(--gold);border-color:var(--night);outline:0;transform:scale(1.3);box-shadow:0 0 0 4px #f5c04a55}
.lh{display:flex;align-items:center;font-size:1.3rem;margin:6px 0 10px}.lh b{font-family:var(--serif);letter-spacing:.04em}
.panel{position:relative;border:0;border-radius:18px;padding:16px 22px 14px 32px;background:linear-gradient(160deg,var(--cb,#fff),#fff 82%);box-shadow:var(--lift)}
.panel:before{content:"";position:absolute;left:13px;top:16px;bottom:16px;width:6px;border-radius:3px;background:var(--c,var(--ink))}
.card{background:linear-gradient(#fff,#f6f7fd);border:2px solid var(--line);border-top:8px solid var(--c,#9aa9c2);border-radius:18px;padding:14px 18px;box-shadow:var(--lift)}
@media(hover:hover){.card:hover{border-color:var(--c,#9aa9c2)}}
.card .bd{color:#fff;font-size:1rem}.card b{font-family:var(--serif);font-size:1.35rem}.card em{align-self:flex-start;background:var(--cb,#eef0fa);border-radius:999px;padding:1px 12px}
.tile{background:linear-gradient(#fff,#f6f3ea);border-radius:20px;box-shadow:var(--lift)}
.tl.hr .rel{position:relative;padding-top:.3em}.tl.hr .rel:before{content:"";position:absolute;left:4px;right:4px;top:-4px;border-top:3px dotted var(--c);opacity:.55}
.ex{border-radius:12px;box-shadow:var(--lift)}
.chip{background:linear-gradient(#fff,#f3f5fc);border:2.5px solid var(--line);box-shadow:0 3px 0 #17204214}.chip.sel{border-color:var(--gold);background:#fff6d6}
details{border:2px solid var(--line)}
/* 問題: 問いかけ・選択肢・フィードバック */
.prompt{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 18px;box-shadow:var(--lift)}
.ch{background:linear-gradient(#fff,var(--cb,#f1f3fb));border-radius:18px;box-shadow:0 4px 0 #17204222}
.ch:not(:disabled):active{transform:translateY(2px);box-shadow:none}
.ch.o{outline:0;border-color:var(--ok);background:linear-gradient(#f2fff7,var(--okb));box-shadow:0 0 0 5px #1f8a4c33,0 0 24px #1f8a4c66}
.fb{border-radius:18px;box-shadow:var(--lift)}
.bar{height:18px;background:#e3e7f5;box-shadow:inset 0 2px 3px #17204222}.bar i{box-shadow:inset 0 -5px 0 #0002}
/* 導入の対話: 謎の言葉は夜空の札に金のふち */
.bb{box-shadow:var(--lift);border:1.5px solid #ffffffaa}
.iw{color:#fff;background:radial-gradient(130% 110% at 15% 0,#35509f,transparent 62%),linear-gradient(160deg,var(--night2),var(--night));border:3px solid var(--gold);border-radius:26px;box-shadow:0 0 0 6px #f5c04a33,0 0 44px -8px #6a86ff99,var(--lift);text-shadow:0 0 22px #ffe5a088}
.iw small{color:#d6ddff;text-shadow:none}
/* ホーム: 星空のヒーロー。二つの字が星のように近づき、線でつながって意味が生まれる */
.hero{position:relative;overflow:hidden;margin:6px 0 24px;padding:clamp(22px,4vw,42px);border-radius:30px;color:#fff;background:radial-gradient(520px 320px at 88% 0,#3c56bd99,transparent 70%),radial-gradient(460px 260px at 0 105%,#f5c04a2e,transparent 70%),linear-gradient(160deg,var(--night),var(--night2) 72%,#2a43a3);box-shadow:0 28px 54px -28px rgba(10,18,48,.85),inset 0 0 0 1px #ffffff26}
.hero .sky{position:absolute;inset:0;pointer-events:none;opacity:.85;background-image:radial-gradient(1.6px 1.6px at 30px 40px,#fff 50%,transparent 53%),radial-gradient(1.2px 1.2px at 120px 110px,#ffffffcc 50%,transparent 53%),radial-gradient(1.8px 1.8px at 200px 30px,var(--gold2) 50%,transparent 53%),radial-gradient(1px 1px at 260px 150px,#ffffffaa 50%,transparent 53%);background-size:300px 190px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1}}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:30px;align-items:center}
@media(max-width:880px){.hero-in{grid-template-columns:1fr}}
.hero h1{margin:0 0 .3em;font-size:clamp(1.9rem,4.2vw,3.1rem);line-height:1.25;letter-spacing:.06em;text-shadow:0 2px 28px #7f96ff99}.hero h1 span{white-space:nowrap}
.catch{margin:0 0 14px;font-family:var(--serif);font-size:clamp(1.15rem,2.4vw,1.55rem);color:var(--gold2)}
.hero .lead{color:#e2e8ff;margin:0 0 20px}
.cta{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:76px;padding:10px 28px;margin-top:0}
.cta b{font-family:var(--serif);font-size:1.6rem;letter-spacing:.1em}.cta small{font-weight:700;font-size:.98rem;color:#4a3500}
.demo{position:relative;min-height:316px;display:grid;place-items:center;padding:20px 14px;border-radius:24px;text-align:center;background:linear-gradient(160deg,#ffffff22,#ffffff0b);border:1px solid #ffffff44;box-shadow:inset 0 1px 0 #ffffff4d,0 18px 40px -24px #000b}
.dm{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.dmt{display:flex;align-items:center;justify-content:center;width:100%}
.dt{flex:none;width:clamp(76px,10vw,104px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(3rem,6vw,4.2rem);line-height:1;color:var(--ink);background:linear-gradient(#fff,#f4f1e6);border:3px solid var(--c);border-radius:20px;box-shadow:0 0 0 5px #ffffff1c,0 0 30px -2px var(--c)}
.dt:first-child{animation:inL .9s cubic-bezier(.2,.9,.25,1) both}.dt:last-child{animation:inR .9s cubic-bezier(.2,.9,.25,1) both}
.dop{position:relative;flex:none;width:2.3em;height:2.3em;margin:0 clamp(26px,5vw,44px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff6d2,var(--gold));color:var(--night);font-weight:700;font-size:1.2rem;box-shadow:0 0 20px #f5c04acc;animation:star .55s .65s cubic-bezier(.3,1.7,.5,1) both}
.dop:before,.dop:after{content:"";position:absolute;top:50%;margin-top:-1.5px;height:3px;width:clamp(26px,5vw,44px);animation:ln .5s .5s both}
.dop:before{right:100%;transform-origin:100% 50%;background:linear-gradient(90deg,#f5c04a22,var(--gold))}
.dop:after{left:100%;transform-origin:0 50%;background:linear-gradient(90deg,var(--gold),#f5c04a22)}
@keyframes star{from{opacity:0;transform:scale(.2) rotate(-90deg)}}@keyframes ln{from{transform:scaleX(0)}}
@keyframes inL{from{opacity:0;transform:translateX(-80px) rotate(-10deg)}}@keyframes inR{from{opacity:0;transform:translateX(80px) rotate(10deg)}}
.dw{margin-top:6px;font-size:clamp(2.3rem,4.8vw,3.3rem);line-height:1.55;color:#fff;text-shadow:0 0 28px #ffd77a99;animation:ap 1s 1.1s both}
.dw rt{font-size:.3em;letter-spacing:.2em;color:#cfd8ff;text-shadow:none}
.dx{display:inline-flex;align-items:center;gap:6px;padding:2px 14px 2px 4px;border-radius:999px;background:#ffffff1f;border:1px solid #ffffff55;font-weight:700;animation:ap .6s 1.5s both}.dx .bd{margin:0}
.dp{margin:2px 0 0;max-width:30em;color:#e0e6ff;font-size:1.02rem;line-height:1.6;animation:ap .6s 1.7s both}
.clue{position:relative;margin-top:26px;padding-top:16px;border-top:1px solid #ffffff33}
.mhd{margin:0 0 14px;color:#d8defa}.mhd b{color:var(--gold2)}
.medals{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.medals:before{content:"";position:absolute;left:8%;right:8%;top:1.1em;border-top:2px dotted #ffffff55}

.md{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.85rem;line-height:1.3;color:#aeb8e6}

.md.on{color:#fff}.md.on .bd{background:var(--c);border:2px solid #fff;color:#fff;box-shadow:0 0 20px var(--c)}
/* ホームの3つの入口: 色の面と大きな一字で見分ける */
.menu3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:0 0 14px}
.mt{position:relative;overflow:hidden;font:inherit;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;min-height:124px;padding:20px 22px;border:0;border-radius:22px;color:#fff;cursor:pointer;background:linear-gradient(155deg,var(--c),var(--c2));box-shadow:0 8px 0 var(--c3),var(--lift)}
.mt:active{transform:translateY(5px);box-shadow:0 3px 0 var(--c3)}
.mt .wm{position:absolute;right:-4px;top:-14px;font-family:var(--serif);font-size:7.5rem;line-height:1;opacity:.22;pointer-events:none}
.mt b{position:relative;font-family:var(--serif);font-size:1.5rem;letter-spacing:.04em}.mt small{position:relative;font-size:.98rem}
.mt.a{--c:#17806a;--c2:#136a8e;--c3:#0c4c66}.mt.b2{--c:#c8442a;--c2:#a8304c;--c3:#6e1d33}.mt.c{--c:#7d4cb8;--c2:#5a3a9e;--c3:#3b2670}
.mt.pst{--c:#f5c04a;--c2:#e8a020;--c3:#a96b00;color:var(--night);grid-column:1/-1;min-height:104px}
/* ことばの場面: 夜空のカードと、本が開く世界 */
.mp{position:relative;overflow:hidden;border-radius:28px;padding:clamp(26px,6vw,64px);color:#fff;font-family:var(--serif);text-shadow:0 0 30px #8aa0ff88;background:radial-gradient(1.5px 1.5px at 40px 50px,#fff 50%,transparent 53%),radial-gradient(1.2px 1.2px at 180px 120px,var(--gold2) 50%,transparent 53%),radial-gradient(520px 300px at 85% 0,#3c56bd88,transparent 70%),linear-gradient(160deg,var(--night),var(--night2));background-size:260px 170px,260px 170px,auto,auto;box-shadow:0 28px 54px -28px rgba(10,18,48,.85)}
.world{color:#fff;border-radius:28px;background:radial-gradient(75% 55% at 50% 118%,#ffd27a 0,#ff9a6c 26%,transparent 62%),linear-gradient(#0a1230,#233a86 56%,#5a74c9);box-shadow:0 28px 54px -28px rgba(10,18,48,.85)}
.world h2{text-shadow:0 0 34px #ffd27a}.world p{color:#eaf0ff}
.world:before{background:linear-gradient(90deg,#efe2bf,#fffaf0 34%)}.world:after{background:linear-gradient(270deg,#efe2bf,#fffaf0 34%)}

@keyframes fl{0%{transform:translateY(0) rotate(-6deg);opacity:0}15%{opacity:.6}85%{opacity:.45}100%{transform:translateY(-440px) rotate(8deg);opacity:0}}
@media(max-width:700px){.dt{width:72px;font-size:2.8rem}.dop{margin:0 24px}.dop:before,.dop:after{width:24px}.mt .wm{font-size:6rem}}

/* ===== 伝わる力アップ: 「関係」を一目で・正解を全身で・進みぐあいを見える形に（方向性は「ことばの星図」のまま） ===== */
/* 1) 二つの字をつなぐ「関係」を、色つきの札と線で。意味が生まれる瞬間を見せる */
.tl.hr .rel{position:relative;z-index:1;display:grid;place-items:center;min-width:0;padding:.55em 1.1em;border-radius:999px;background:var(--c);color:#fff;font-size:1.2rem;line-height:1.3;text-align:center;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--c),0 14px 24px -10px var(--c);animation:relin .6s cubic-bezier(.3,1.6,.5,1) both}
.tl.hr .rel:before{content:"";position:absolute;z-index:-1;left:-14px;right:-14px;top:50%;height:5px;margin-top:-2.5px;border:0;border-radius:3px;background:var(--c);opacity:.55}
@keyframes relin{from{opacity:0;transform:scale(.4)}}
.tile{border-top-width:10px}
.tile .tm{display:inline-block;margin-top:4px;padding:0 .7em;border-radius:999px;background:var(--cb,#eef0fa)}
.rl{padding:2px 12px;border-radius:999px;font-size:1.02rem}
.nat{display:block;width:fit-content;max-width:100%;margin:14px auto;padding:10px 22px;border:3px solid var(--c);border-radius:18px;font-family:var(--serif);font-size:clamp(1.25rem,2.6vw,1.65rem);line-height:1.6;box-shadow:var(--lift);animation:ap .5s .3s both}
.kw{background:linear-gradient(#fff0b8,#ffe08a);box-shadow:0 2px 0 #c9a02a66;font-family:var(--serif);font-weight:700}
.hint,.soft{border-left:8px solid #f0b400}.soft{border-left-color:#6d8be0}
@media(max-width:700px){.tl.hr{gap:8px!important}.tl.hr .tile{width:31vw}.tl.hr .rel{max-width:30vw;font-size:.92rem;padding:.45em .6em}}
/* 2) もんだい: 問いの熟語を主役に。進みぐあいは棒と星で */
.prompt{position:relative;padding:14px 20px 14px 28px;border:0;border-radius:20px;background:linear-gradient(160deg,#fff,#f4f6ff);font-family:var(--serif);box-shadow:var(--lift),inset 0 0 0 2px var(--line)}
.prompt:before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:7px;border-radius:4px;background:linear-gradient(var(--gold),#e8a020)}
.prompt ruby{font-size:1.55em;color:var(--night2)}
.pbar{height:12px;margin:8px 0 14px;border-radius:999px;background:#dfe3f5;box-shadow:inset 0 2px 3px #17204222}
.pbar i{display:block;position:relative;height:100%;width:var(--p);border-radius:999px;background:linear-gradient(90deg,#ffd978,var(--gold));box-shadow:0 0 12px #f5c04a99}
.pbar i:after{content:"★";position:absolute;right:-13px;top:50%;transform:translateY(-50%);font-size:1.6rem;line-height:1;color:var(--gold);text-shadow:0 0 0 #fff,0 0 10px #f5c04a}
/* 3) こたえた瞬間: 正解は光って弾み、まちがいは小さく揺れて「考えなおそう」へ */
.ch{position:relative;min-height:80px;font-size:1.3rem;font-weight:700;transition:transform .12s,box-shadow .12s}
@media(hover:hover){.ch:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 8px 0 #17204222,var(--lift)}}
.ch .bd{width:1.9em;height:1.9em}
.ch.x.lwx{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ch.o{animation:okpop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes okpop{from{transform:scale(.92)}60%{transform:scale(1.06)}}
.ch.o:after{content:"";position:absolute;inset:-6px;border-radius:24px;border:3px solid var(--ok);opacity:0;animation:ring .8s .05s ease-out}
@keyframes ring{from{opacity:.9;transform:scale(.94)}to{opacity:0;transform:scale(1.14)}}
.fb{position:relative;animation:fbin .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes fbin{from{opacity:0;transform:translateY(16px) scale(.97)}}
.fbt{font-family:var(--serif);font-size:1.5rem}
.fb.ok{background:linear-gradient(160deg,#f3fff8,var(--okb));box-shadow:0 0 0 4px #1f8a4c22,var(--lift)}

.fb.ok .fbt:before{content:"★";display:inline-block;margin-right:.35em;color:var(--gold);text-shadow:0 0 14px #f5c04acc;animation:star .6s cubic-bezier(.3,1.7,.5,1) both}
.fb.ng .fbt:before{content:"💡";margin-right:.35em}
.spk{position:fixed;z-index:99;pointer-events:none;font-style:normal;font-size:1.3rem;line-height:1;text-shadow:0 0 8px currentColor;animation:spk .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes spk{from{transform:translate(-50%,-50%) scale(.3);opacity:1}70%{opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(180deg);opacity:0}}
/* 4) けっか: がんばりが一目で分かる星のスコア */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:8px 0 18px;padding:20px 24px;border-radius:26px;color:#fff;background:radial-gradient(420px 240px at 90% 0,#3c56bd99,transparent 70%),linear-gradient(160deg,var(--night),var(--night2));box-shadow:0 24px 48px -26px rgba(10,18,48,.85)}
.score h2{margin:0;color:#fff}.score .lead{color:#dfe5ff;margin:.2em 0 0;font-size:1.05rem}
.ring{position:relative;flex:none;width:128px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#ffffff22 0);animation:star .8s cubic-bezier(.3,1.5,.5,1) both}
.ring:before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--night)}
.ring b,.ring small{position:relative;line-height:1}.ring b{font-family:var(--serif);font-size:2.9rem;color:var(--gold2)}.ring small{margin-top:4px;font-size:1rem;color:#cfd8ff}
.stars{margin:.1em 0;font-size:2rem;letter-spacing:.1em;color:var(--gold);text-shadow:0 0 16px #f5c04aaa}.stars s{text-decoration:none;color:#ffffff33;text-shadow:none}

.dx{background:var(--c);border-color:#ffffffaa;font-size:1.12rem;padding:4px 16px 4px 5px;box-shadow:0 0 24px -4px var(--c)}.dx .bd{background:#fff;color:var(--c)}

.wy .wc{display:inline-flex;flex-direction:column;align-items:center;cursor:default;font-size:1.8rem;line-height:1.2}.wy .wc small{font-size:.8rem;color:var(--sub)}

 else if(n===2)b=`<p class="lead">漢文は、昔の 中国の 文章を 日本語で 読む 勉強。「レ」は「下の 字から 先に 読んで、もどってね」の 合図だよ。</p>${KB.map((id,i)=>{const t=IM[id],f=V.wf&&V.wf[i];return `<p><button class="kb" data-a="wf" data-i="${i}">${t.parts[0].character}<i>レ</i>${t.parts[1].character}</button> ${f?`→ <b>${first1(t.relationText)}</b>`:'← タップ！'}</p>`}).join('')}<p class="tip">いまは おぼえなくて だいじょうぶ。中学校で「あ、④で やったやつだ！」と 思えたら 大成功。</p>`;

 return `<div class="wy"><div class="prog">学ぶと どうなる？ ${n+1} / ${np}</div><h2>${w[0]}</h2><p class="sub">${w[1]}</p>${b}<div class="row"><button class="b go" data-a="wn">${n<np-1?'つぎへ ▶':V.v==='msg'?'おしまい ▶':'ホームへ'}</button></div></div>`}
