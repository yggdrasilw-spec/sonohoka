    const b=document.createElement("button");b.className="unit-card";b.style.animationDelay=(.05+i*.07)+"s";b.style.setProperty("--h",d*38);
    b.innerHTML=`<span class="num">${d}</span><span class="copy"><span class="emoji">${OBJ[DAN[d][0]].ico}</span><strong>${d}のだん</strong><small>${d}つずつ<br>まなぶ</small></span>`;
    b.onclick=()=>{A();tone(660,0,.12,"sine",.15);tone(880,.09,.16,"sine",.15);go("lesson");setDan(d)};
    g.appendChild(b);
  });
}
$("startBtn").onclick=()=>{A();[523,659,784,1047].forEach((f,j)=>tone(f,j*.09,.25,"triangle",.14));go("toc")};
$("toTitle").onclick=()=>go("title");$("bToc").onclick=()=>{A();go("toc")};
buildCover();buildToc();setDan(5);document.title="かけざんの ぼうけん";
</script>
