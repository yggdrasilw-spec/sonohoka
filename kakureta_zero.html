<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>かくれた 0 を みつけよう</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:#f3f8fc;color:#223;font-family:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
header,footer{display:flex;align-items:center;gap:12px;padding:6px 16px;background:#fff}
header{border-bottom:2px solid #cfe0ec}
footer{border-top:2px solid #cfe0ec;justify-content:space-between}
h1{font-size:20px;margin:0;flex:1}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#d8e2ea}
.dots i.dn{background:#3aa655}
.dots i.on{outline:3px solid #f5a623}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:8px 18px;background:#2f7fd1;color:#fff}
button:disabled{background:#b8c4cf;cursor:default}
button.s{background:#fff;color:#445;border:2px solid #cfd8de;padding:4px 12px}
button.s:disabled{opacity:.4;background:#fff}
.hint{color:#789;font-size:14px}
main{flex:1;display:flex;gap:16px;padding:12px 16px;min-height:0}
#L{flex:1.15;display:flex;flex-direction:column;gap:8px;min-width:0}
#R{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden;background:#fff;border:2px solid #cfe0ec;border-radius:16px;padding:14px 18px}
#T{flex:1;min-height:0;display:flex;border:3px solid #556;border-radius:10px;overflow:hidden;background:#fff}
.col{flex:1;min-width:0;display:flex;flex-direction:column;border-right:2px dashed #889}
.col:last-child{border:0}
.col.reveal{animation:show-column .45s ease-out}
.hd{text-align:center;font-weight:700;font-size:15px;line-height:1.3;padding:5px 2px;border-bottom:2px solid #889}
.cd{flex:1;position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:8px;border-bottom:2px solid #889}
.cd b{width:72px;height:24px;line-height:20px;text-align:center;font-size:15px;background:#fff;border:2px solid #333;border-radius:3px}
.cd b.place{animation:place-card .28s ease-out}
.cd em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-style:normal;font-weight:700;color:#3a8a52;font-size:16px}
.dg{position:relative;height:80px;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800}
.dg.on::before{content:".";position:absolute;left:-9px;bottom:16px;font-size:46px;line-height:1}
.q .cd{outline:3px dashed #2e9d4a;outline-offset:-6px;animation:bl 1.2s infinite}
.qm{color:#2e9d4a;animation:bl2 1.2s infinite}
.z{color:#1f8a3b;background:#fff;border:4px solid #2e9d4a;border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;animation:pop .6s}
.fl{animation:sh .4s}
#E{height:64px;font-size:44px;font-weight:800;text-align:center}
#E .g{background:#cdebc9;border-radius:8px;padding:0 6px}
#P{font-size:22px;line-height:1.75;font-weight:700}
#M{font-size:19px;line-height:1.8}
.g{color:#1f8a3b}
.no{color:#f5a623}
.r{color:#d33}
#C{display:flex;flex-wrap:wrap;gap:12px}
.ch{font-size:28px;padding:10px 28px;background:#fff;color:#235;border:3px solid #2f7fd1}
#X{display:flex;gap:28px;justify-content:center}
.fig{text-align:center;font-size:14px;line-height:1.5;max-width:210px}
.gr{display:grid;grid-template-columns:36px 46px 22px 46px;grid-auto-rows:46px;width:150px;margin:0 auto 6px}
.gr>div{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;border:1px solid #d3dde4}
.gr .c1{background:#ffe3ea}
.gr .c3{background:#dff3dc}
.gr .ln{border-bottom:3px solid #333}
.gr .z{width:34px;height:34px;font-size:24px;border-width:3px}
.a{opacity:0}
.a3{animation:pop .5s .7s forwards}
.a1{animation:pop .5s 1.7s forwards}
@keyframes bl{50%{background:#e4f6e1}}
@keyframes bl2{50%{opacity:.3}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes show-column{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@keyframes place-card{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:translateY(0)}}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pw{margin:auto}
.pg{display:grid;grid-template-columns:50px 70px 70px 30px 70px;grid-auto-rows:70px}
.pg>div{display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;border:1px solid #d3dde4;min-width:0}
.pg .u{background:#fff6c4}
.pg .o{background:#ffe3ea}
.pg .t,.pg .zz{background:#dff3dc}
.pg .zz{grid-column:span 2}
.pg .ln{border-bottom:3px solid #333}
.pg input{width:100%;height:100%;border:0;background:transparent;font:inherit;text-align:center;outline:0;padding:0}
.pg>div:focus-within{box-shadow:inset 0 0 0 4px #f5a623}
.pg .ok{background:#c9f0c9}
.pg .ng{background:#ffd0d0}
.pp{animation:pop .6s}
.pg.sm{grid-template-columns:40px 56px 56px 26px 56px;grid-auto-rows:56px}
.pg.sm>div{font-size:34px}
.cf{text-align:center;font-size:30px;font-weight:700;line-height:1.7}

 body{height:auto;min-height:100dvh;overflow:visible}
 header,footer{flex-wrap:wrap}
 main{width:100%;min-height:0}
 #R{overflow:visible}
 #T{min-height:320px;overflow:visible}
 #E{height:auto;min-height:64px}
 #X{flex-wrap:wrap}
 .cd b{width:min(72px, 100%)}
 .compare{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
 .pg{grid-template-columns:42px 64px 64px 30px 64px}
 .pg.sm{grid-template-columns:32px 48px 48px 24px 48px}
 :focus-visible{outline:3px solid #174da0;outline-offset:3px}
 @media(max-width:950px){
   main{flex-direction:column;gap:12px}
   #L,#R{flex:none}
   #T{min-height:270px}
 }
 @media(max-width:540px){
   header{gap:8px;padding:8px 12px}
   h1{font-size:18px;flex-basis:100%}
   .dots{gap:3px}
   .dots i{width:8px;height:8px}
   main{padding:8px 10px}
   #R{padding:12px}
   #P{font-size:19px}
   #M{font-size:17px}
   #E{font-size:32px;min-height:0}
   .hd{font-size:12px}
   .cd{padding:3px}
   .cd em{font-size:13px}
   .dg{height:64px;font-size:36px}
   .dg.on::before{font-size:36px;bottom:14px}
   .z{width:48px;height:48px}
   .pg{grid-auto-rows:54px}
   .pg>div{font-size:32px}
   .compare{gap:8px}
   .pg.sm{grid-template-columns:24px 34px 34px 14px 34px;grid-auto-rows:42px}
   .pg.sm>div{font-size:25px}
   .ch{font-size:22px;padding:8px 16px}
   footer .hint{display:none}
 }
 @media(prefers-reduced-motion:reduce){
   *,*::before,*::after{animation:none!important}
   .a{opacity:1}
 }

  </style>
</head>
<body>
<header><h1>かくれた 0 を みつけよう</h1><div class="dots" id="D" role="img" aria-label="学習の進み具合"></div><button class="s" id="read">🔊 よみあげ</button><button class="s" id="sn" aria-pressed="true">🔊 おと ON</button></header>
<main>
<div id="L"><div id="T"></div><div id="E"></div></div>
<div id="R"><div id="P"></div><div id="C"></div><div id="X"></div><div id="M" role="status"></div></div>
</main>
<footer><button class="s" id="bk">← もどる</button><span class="hint">キーボードの ← → でも すすめます</span><button id="nx">つぎへ →</button></footer>
<script src="media/kakureta-zero/narration.js"></script>
<script>
const $=id=>document.getElementById(id);
const Q='<ruby>位<rt>くらい</rt></ruby>',SS='<ruby>小数<rt>しょうすう</rt></ruby>第一<ruby>位<rt>い</rt></ruby>';
const N=[2,50,53,100,5],OP=[[0,1,2],[0,5,1],[0,3,5],[0,1,10],[0,5,1]];
const COL=[['百の'+Q,'#c4e1f7',100],['十の'+Q,'#fff0a6',10],['一の'+Q,'#ffd3de',1],[SS,'#cdebc9']];
const ADD=[
 'カードは ふえて いないから、2 と 2.0 は おなじ 大きさ だね。',
 `一の${Q}の 0 は はじめから 見えて いたね。${SS}の 0 は、かくれて いた 0 だよ。`,
 '53 と 53.0 も、カードの 数は おなじ。大きさは かわらないよ。',
 `どんな <ruby>整数<rt>せいすう</rt></ruby>にも ${SS}が あって、0.1 が 0こ だから 0 が かくれて いる。<br>「.0 を つける」と おぼえるより「かくれた 0 が 見える」と 考えよう。`
];
const introPrompts=[
 `「２」を ${Q}取り表に 入れて みよう。`,
 `一の${Q}に、1 の カードを 1まいずつ 入れるよ。`,
 `このとき、${SS}は どうなって いるかな？`
];
const firstQuestion=introPrompts.length, example=firstQuestion+N.length, practice=example+1;
let st=0,ph=0,done=[],snd=true,ac,EX=[];
const placementTimers=[];
// 練習問題 [a,b,演算,種類,正解]。種類: なし=答えを入れる / 1=どっちが正しい？(正解 0=あ 1=い) / 2=○×(正解 1=○ 0=×) / 3=ひっ算を書く。教科書の数値は少し変えてある
const PB=[
 [52,3.4,'-',1,1],[7,1.8,'+',2,0],[2.5,6,'+',1,0],[48,2.7,'-',2,1],
 [4,2.7,'+'],[2.4,7,'+'],[6,2.3,'-'],[7.8,3,'-'],[34,1.6,'-'],
 [3,4.5,'+',3],[25,1.6,'-',3]
],NS=practice+PB.length;
const sceneNumbers='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

const narration=new Audio();
let narrationQueue=[];
function stopNarration(){
 narrationQueue=[];
 narration.pause();
}

function narrationText(id){
 const part=$(id).cloneNode(true);
 part.querySelectorAll('.no,rt').forEach(node=>node.remove());
 part.querySelectorAll('br').forEach(node=>node.replaceWith('\n'));
 return part.textContent.normalize('NFKC').split('\n')
  .map(line=>line.trim().replace(/\s+/g,' ')).filter(Boolean).join('\n');
}

function playNextNarration(){
 const clip=narrationQueue.shift();
 if(!clip)return;
 const source=`media/kakureta-zero/${clip}`;
 if(narration.getAttribute('src')!==source)narration.src=source;
 narration.currentTime=0;
 narration.play().catch(()=>{});
}

narration.onended=()=>{if(narration.ended)playNextNarration()};

function speak(...ids){
 if(!snd)return;
 stopNarration();
 narrationQueue=ids.map(id=>window.KAKURETA_ZERO_AUDIO?.[narrationText(id)]).filter(Boolean);
 playNextNarration();
}

function startAudio(){
 if(!snd)return;
 try{
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume().catch(()=>{});
 }catch(e){}
}

function tone(f,t=.15,d=0){
 if(!snd)return;
 startAudio();
 try{
  const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+d;
  o.frequency.value=f;g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+t);
  o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+t);
 }catch(e){}
}
const ok=()=>{tone(660);tone(880,.2,.13)},ng=()=>tone(220,.25);

function tbl(n,rev,{tenths='question',ones=n%10}={}){
 const d=[~~(n/100)%10,~~(n/10)%10,n%10],sh=[n>99,n>9,1];
 return COL.map((c,i)=>{
  if(i===3&&tenths==='hidden')return '';
  let cd='',dg='';
  if(i<3){
   const count=i===2?ones:d[i];
   for(let j=0;j<count;j++)cd+=`<b>${c[2]}</b>`;
   dg=sh[i]&&(i!==2||ones===d[i])?d[i]:'';
  }else if(tenths==='question'){
   cd=`<em>${rev?'0.1の カードは 0こ':'0.1の カードは？'}</em>`;
   dg=rev?'<span class="z">0</span>':'<span class="qm">？</span>';
  }
  const state=i<3?'':tenths==='reveal'?' t reveal':rev?' t':' t q';
  return `<div class="col${state}" style="background:${c[1]}"><div class="hd">${c[0]}</div><div class="cd">${cd}</div><div class="dg${i>2&&rev?' on':''}">${dg}</div></div>`;
 }).join('');
}

const gr=(R,ans)=>'<div class="gr">'+R.map((r,i)=>r.map((c,j)=>`<div class="c${j}${i==1?' ln':''}${ans&&i==2&&(j==1||j==3)?' a a'+j:''}">${c}</div>`).join('')).join('')+'</div>';

function renderIntro(){
 const placing=st===1,revealing=st===2;
 $('T').innerHTML=tbl(2,false,{tenths:revealing?'reveal':'hidden',ones:revealing?2:0});
 $('E').textContent='2';
 $('P').innerHTML=introPrompts[st];
 ['C','X','M'].forEach(id=>$(id).replaceChildren());
 done[st]=!placing;
 if(placing){
  const column=$('T').lastElementChild;
  [420,1120].forEach((delay,index)=>{
   placementTimers.push(setTimeout(()=>{
    const card=document.createElement('b');
    card.className='place';
    card.textContent='1';
    column.querySelector('.cd').append(card);
    tone(index===0?520:660,.11);
    if(index===1){
     column.querySelector('.dg').textContent='2';
     placementTimers.push(setTimeout(()=>{
      done[st]=true;
      nav();
     },280));
    }
   },delay));
  });
 }
}

function render(narrate=true){
 placementTimers.splice(0).forEach(clearTimeout);
 if(st<firstQuestion)renderIntro();
 else if(st>=example)rend2();
 else renderQuestion();
 $('P').insertAdjacentHTML('afterbegin',`<span class="no" aria-hidden="true">${sceneNumbers[st]}</span> `);
 updateReadButton();
 nav();
 if(narrate)speak('P','M');
}

function renderQuestion(){
 const index=st-firstQuestion,n=N[index],rev=ph==1,L=st===example-1;
 $('T').innerHTML=tbl(n,rev);
 $('E').innerHTML=L?(rev?'5 ＝ 5<span class="g">.0</span>':'5 ＋ 3.5'):(rev?`${n} ＝ ${n}<span class="g">.0</span>`:n);
 let p;
 if(rev)p='かくれて いた 0 が <span class="g">見えた！</span>';
 else{
  const question=`<span class="g">${SS}</span>には 0.1 の カードが なんこ あるかな？`;
  p=index===0?question:(L?'<b>5 ＋ 3.5</b> の ひっ算を するよ。<br>まず <b>5</b> を ':`<b>${n}</b> を `)+`${Q}取り表に 入れたよ。<br>`+question;
 }
 $('P').innerHTML=p;
 $('C').innerHTML=rev?'':OP[index].slice().sort(()=>Math.random()-.5).map(v=>`<button class="ch" onclick="pick(${v})">${v}こ</button>`).join('');
 $('X').innerHTML=L&&rev
  ?'<div class="fig">'+gr([['','3','.','5'],['＋','5','.','<span class="z">0</span>'],['','8','.','5']],1)+`<b class="g">○ 5 を 5.0 と 見て ${Q}を そろえる（小数点も たてに そろう）</b></div><div class="fig">`+gr([['','3','.','5'],['＋','','','<span class="r">5</span>']])+'<b class="r">× 右はしに そろえると、5 が 小数第一位に なって しまう</b></div>'
  :'';
 $('M').innerHTML=!rev?'':L
  ?`5 ＝ 5.0 と 見ると、${SS}は 5＋0＝5、一の${Q}は 3＋5＝8。答えは <b>8.5</b>。<br>かくれた 0 が 見えると、${Q}が そろうんだね。`
  :`そう、<b>0こ</b>！ カードが 0こ の ときは <b class="g">0</b> と 書くよ。<br>${SS}に かくれて いた 0 が 見えたね。<br>${ADD[index]}`;
}
function nav(){
 $('D').innerHTML=Array.from({length:NS},(_,i)=>`<i class="${done[i]?'dn':''} ${i==st?'on':''}"></i>`).join('');
 $('bk').disabled=st==0;
 $('nx').disabled=!done[st];
   $('D').setAttribute('aria-label', NS + '場面のうち' + (st + 1) + '場面目');
  $('nx').textContent=st==NS-1?'はじめから ↺':'つぎへ →';
}

// ひっ算の方眼。m: 0=答え入力 1=答え表示 2=答え表示+アニメ 3=コツ(0未表示) 4=コツ(.0表示) 5=全部書く 6=位そろえ(正) 7=右はしそろえ(誤) 8=整数の小数部分が空欄の答え表示
function pg(a,b,op,m){
 const A=Math.round(a*10),B=Math.round(b*10),V=op=='+'?A+B:A-B,w=m==5,sm=m==6||m==7;
 EX=[];
  const I=(r,k,x,n)=>{
   const part=r==='z'?'整数':k<4?'1だん目':k<8?'2だん目':'答え';
   const labels=['十の位','一の位','小数点','小数第一位'];
   const column=r==='z'?'の小数点と0':r==='p'?labels[k===9?2:k%4]:{u:'十の位',o:'一の位',t:'小数第一位'}[r];
   EX.push({r,o:k,x:String(x)});
   return `<input aria-label="${part} ${column}" inputmode="${n===2||x==='.'?'text':'numeric'}" maxlength="${n||1}" data-i="${EX.length-1}" autocomplete="off">`;
  };
 const D=W=>[W>99?~~(W/100)%10:'',~~(W/10)%10,W%10];
 const R=(W,s,int,l,k)=>{
  const d=D(W),S=`<div class="s${l}">${s}</div>`,c=(n,t,x)=>`<div class="${n}${l}">${w?I('p',k+x,t):t}</div>`;
  if(m==7&&int)return S+`<div class="u${l}"></div><div class="o${l}">${d[0]}</div><div class="d${l}"></div><div class="t${l}">${d[1]}</div>`;
   if(int&&m==8)return S+c('u',d[0],0)+c('o',d[1],1)+c('d','',2)+c('t','',3);
   if(int&&!w)return S+`<div class="u${l}">${d[0]}</div><div class="o${l}">${d[1]}</div><div class="zz${l}">${m==0?I('z',0,'.0',2):m==3?'<span class="qm">？</span>':'<span class="g pp">.0</span>'}</div>`;
  return S+c('u',d[0],0)+c('o',d[1],1)+c('d','.',2)+c('t',d[2],3);
 };
 let h=`<div class="pg${sm?' sm':''}">`+R(A,'',a%1==0,'',0)+R(B,op=='+'?'＋':'−',b%1==0,' ln',4);
 if(!sm){
   const d=D(V),sh=m==1||m==2||m==8,T=(r,x,k)=>m==0||w?I(r,k,x):sh?x:'';
  h+=`<div class="s"></div><div class="u">${V>99||w?T('u',d[0],11):''}</div><div class="o${m==2?' a a1':''}">${T('o',d[1],10)}</div><div class="d">${w?T('p','.',9):'.'}</div><div class="t${m==2?' a a3':''}">${T('t',d[2],8)}</div>`;
 }
 return h+'</div>';
}

// まちがえた位のヒント(くり上がり・くり下がりも説明)
function hint(r,a,b,op){
 const A=Math.round(a*10),B=Math.round(b*10),x=[A%10,~~(A/10)%10,~~(A/100)%10],y=[B%10,~~(B/10)%10,~~(B/100)%10],iv=a%1==0?a:b;
 if(r=='p')return `${Q}を たてに そろえて 書くよ。小数点を たてに そろえて、整数には「.0」を つけて ${iv}.0 と しよう。`;
 if(r=='z')return `整数にも ${SS}が あるよ。0.1 が 0こ だから、${iv} に「.0」を つけて ${iv}.0 と 書こう。`;
 const i={t:0,o:1,u:2}[r];let c=0,t='';
 for(let k=0;k<=i;k++){
  if(op=='+'){const s=x[k]+y[k]+c;t=`${x[k]}＋${y[k]}${c?'＋'+c:''}＝${s}`+(s>9?`。10いじょうに なったから ${s%10} を 書いて、1 を くり上げる`:'');c=s>9?1:0}
  else{const u=x[k]-c,w=u<y[k];t=(c?`1 かりて いるから ${x[k]}−1＝${u}。`:'')+(w?`${u} から ${y[k]} は ひけない。となりの くらいから 1 かりて ${u+10}−${y[k]}＝${u+10-y[k]}`:`${u}−${y[k]}＝${u-y[k]}`);c=w?1:0}
 }
 return `${[SS,'一の'+Q,'十の'+Q][i]}の 計算：${t}`;
}

function rend2(){
 const demo=st===example,it=demo?[4,2.7,'+']:PB[st-practice],[a,b,op]=it,ty=it[3]||0;
 if(ty==1||ty==2)return rendC(it);
 const dn=done[st],V=Math.round((op=='+'?a+b:a-b)*10)/10,iv=a%1==0?a:b,e=`${a} ${op=='+'?'＋':'−'} ${b}`;
 $('T').innerHTML='<div class="pw">'+pg(a,b,op,demo?[3,4,2][ph]:dn===2?8:dn?1:ty==3?5:0)+'</div>';
 $('E').innerHTML=e+(dn?` ＝ <span class="g">${V}</span>`:'');
 $('P').innerHTML=demo?'ひっ算の コツ。整数には「<span class="g">.0</span>」を つけよう！':ty==3?`<b>${e}</b> を、方眼に ひっ算で 書こう。<br>${Q}を たてに そろえよう。${st===NS-1?'整数は <b>.0</b> と 書いても、同じ位を そろえて <b>空いている位を0</b> と 考えても いいよ。':'この れんしゅうでは、整数を <b>.0</b> まで 書こう。'}`:`ひっ算で 計算しよう。<br>この れんしゅうでは、整数の かくれた 0 を「<span class="g">.0</span>」と 書こう。${SS}から じゅんに 答えを 書こう。`;
 $('C').innerHTML=demo?(ph<2?`<button class="ch" onclick="advanceExample()">${ph?'計算する':'「.0」を つける'}</button>`:''):dn?'':'<button class="ch" onclick="chk()">こたえあわせ</button>';
 $('X').innerHTML='';
 $('M').innerHTML=demo?[`${a} の ${SS}は かくれた 0。<br>「.0」を つけると どうなるかな？`,`「.0」を つけたら 小数点が たてに そろった！<br>${Q}が そろったから、あとは ふつうに 計算できるね。`,`${SS}は 0＋7＝7、一の${Q}は 4＋2＝6。答えは <b>6.7</b>。<br>「.0」を つければ、${Q}が すぐ わかるね。`][ph]:dn?`できた！ ${iv} の 小数第一位を 0 と 考えて ${Q}を そろえたね。`+(st==NS-1?'<br>大切なのは、同じ位を たてに そろえること。<br>25 の 小数第一位は 0。となりの位から 1 かりると、10 − 6 から はじめられるよ。':''):'';
 if(!demo&&!dn && matchMedia('(pointer: fine)').matches){
   document.querySelector('.pg input')?.focus({preventScroll:true});
  }
}

// どっちが正しい？(ty=1) / ○×(ty=2)
function rendC(it){
 const [a,b,op,ty,x]=it,dn=done[st],iv=a%1==0?a:b,lb=['あ','い'],e=`${a} ${op=='+'?'＋':'−'} ${b}`;
 const f=(m,c)=>`<div class="cf">${pg(a,b,op,m)}${c}</div>`,mk=g=>dn?(g?' <span class="g">○</span>':' <span class="r">×</span>'):'';
 $('T').innerHTML='<div class="pw compare">'+(ty==1?[0,1].map(i=>f(i==x?6:7,lb[i]+mk(i==x))).join(''):f(x?6:7,mk(x))+(dn&&!x?f(6,'<span class="g">正しい書きかた</span>'):''))+'</div>';
 $('E').innerHTML=e;
 $('P').innerHTML=ty==1?`<b>${e}</b> の ひっ算で、正しいのは あ・い どちらかな？`:'この ひっ算の 書きかたは 合って いるかな？<br>○か ×で こたえよう。';
 $('C').innerHTML=dn?'':ty==1?[0,1].map(i=>`<button class="ch" onclick="ans(${i})">${lb[i]}</button>`).join(''):'<button class="ch" onclick="ans(1)">○</button><button class="ch" onclick="ans(0)">×</button>';
 $('X').innerHTML='';
 $('M').innerHTML=!dn?'':ty==1?`正解！ 整数は ${iv}.0 と 見て、小数点を たてに そろえて 書くよ。<br>まちがいの ほうは、${iv} の 右はしを そろえて しまい、一の${Q}の 数が ${SS}に 入って いる。`:x?`そう、○！ ${iv} を ${iv}.0 と 見ると、小数点も ${Q}も たてに そろって いるね。`:`そう、×！ 右はしに そろえると、${iv} の 一の${Q}の 数が ${SS}に 入って しまう。<br>整数には「.0」を つけて、小数点を たてに そろえよう。`;
}

function ans(v){
 if(v==PB[st-practice][4]){ok();done[st]=1;render(); $('nx').focus({preventScroll:true})}
 else{ng();$('M').innerHTML='ちがうよ。整数に「.0」を つけて 考えよう。小数点が たてに そろって いるのは どれかな？';speak('M')}
}

function advanceExample(){ph++;if(ph==2)done[st]=1;ok();render();if(done[st])$('nx').focus({preventScroll:true})}

function chk(){
 const [a,b,op]=PB[st-practice];let bad=null;
  const read=q=>q.value.normalize('NFKC').replace(/[。・]/g,'.').trim();
  const fields=Array.from(document.querySelectorAll('.pg input'));
  // 仕上げでは、整数の小数点と0を両方空けても、位がそろっていればよい。
  const start=Number(a%1!==0)*4;
  const hiddenZero=st===NS-1&&[start+2,start+3].every(i=>read(fields[i])==='');
  fields.forEach(q=>{
   const e=EX[q.dataset.i];
   const g=read(q)===e.x||hiddenZero&&(e.o===start+2||e.o===start+3);
  q.parentNode.classList.toggle('ok',g&&q.value!=='');q.parentNode.classList.toggle('ng',!g);
  if(!g&&(!bad||e.o<bad.o))bad=e;
 });
 if(bad){ng();$('M').innerHTML=hint(bad.r,a,b,op);speak('M')}
 else{ok();done[st]=hiddenZero?2:1;render();$('nx').focus({preventScroll:true})}
}

// 入力が埋まったら次のマスへ(右の位→左の位の順)。Enterで答え合わせ
document.addEventListener('input',e=>{
 const t=e.target;if(e.isComposing||t.dataset.i===undefined)return;
 if(t.value.length>=t.maxLength){
  const n=[...document.querySelectorAll('.pg input')].filter(q=>EX[q.dataset.i].o>EX[t.dataset.i].o).sort((p,q)=>EX[p.dataset.i].o-EX[q.dataset.i].o)[0];
  if(n)n.focus();
 }
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.isComposing&&e.target.tagName=='INPUT'&&st>=practice&&!done[st])chk()});
['focusin','click'].forEach(v=>document.addEventListener(v,e=>{const q=e.target;if(q.dataset&&q.dataset.i!==undefined&&q.select)q.select()}));

function pick(v){
 if(v===0){ok();done[st]=1;ph=1;render();$('nx').focus({preventScroll:true})}
 else{
  ng();
  $('M').innerHTML=`${SS}の 0.1 の カードを 数えて みよう。カードが 見あたらない ときは…？`;
  speak('M');
  const t=document.querySelector('.col.t');
  t.classList.remove('fl');void t.offsetWidth;t.classList.add('fl');
 }
}

function go(d){
 if(st+d===1)startAudio();
 if(d>0&&st==NS-1){st=0;done=[]}else st+=d;
 ph=done[st]?(st===example?2:1):0;
 render();
}
// ひっ算を書く問題: ←→でマスを移動(空けるマスを飛ばせる)
document.addEventListener('keydown',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.i!==undefined&&(e.key=='ArrowRight'||e.key=='ArrowLeft')){
  const q=[...document.querySelectorAll('.pg input')],n=q[q.indexOf(t)+(e.key=='ArrowRight'?1:-1)];
  if(n){e.preventDefault();n.focus()}
 }
});
$('bk').onclick=()=>go(-1);
$('nx').onclick=()=>go(1);
$('read').onclick=()=>speak('P','M');
function updateReadButton(){
 $('read').disabled=!snd;
}
$('sn').onclick=()=>{
 snd=!snd;
 $('sn').textContent=snd?'🔊 おと ON':'🔇 おと OFF';
 $('sn').setAttribute('aria-pressed',snd);
 updateReadButton();
 if(snd){startAudio();speak('P','M')}
 else stopNarration();
};
document.onkeydown=e=>{
 if(e.target.tagName=='INPUT')return;
 if(e.key=='ArrowRight'&&!$('nx').disabled)go(1);
 if(e.key=='ArrowLeft'&&!$('bk').disabled)go(-1);
};
render(false);
</script>
</body>
</html>
