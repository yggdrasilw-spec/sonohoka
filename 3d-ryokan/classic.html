<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>くらべるラボ | 3D量感</title>
<style>
:root{font-family:'Yu Gothic UI','Meiryo',sans-serif;color:#243f42;background:#f5f4ee;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #cddbd5;border-radius:12px;background:white;color:inherit;padding:12px 16px;font-weight:700}button:hover{background:#e9f4ec}button:focus-visible,input:focus-visible{outline:3px solid #edaa44;outline-offset:3px}button.active,button.primary{background:#246c5b;color:white;border-color:#246c5b}header{padding:22px 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedfd5;background:#fffdf8}.brand{font-size:23px;font-weight:900}.brand span{color:#31816a}small,.muted{color:#667b78}main{max-width:1400px;margin:auto;padding:28px 4vw}nav{display:flex;gap:12px;margin:22px 0}nav button{min-width:140px}h1{font-size:30px;margin:6px 0}p{line-height:1.8}.eyebrow{font-size:12px;letter-spacing:2px;color:#44816e;font-weight:bold}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px}.scene{position:relative;background:#e9efea;border:1px solid #d9e1d9;border-radius:24px;overflow:hidden;min-height:490px}canvas{display:block;width:100%;height:490px;touch-action:none}.scene-tag{position:absolute;left:20px;top:18px;background:#ffffffdc;border-radius:20px;padding:8px 13px;font-size:12px;pointer-events:none}.view-controls{position:absolute;bottom:16px;left:16px;display:flex;gap:8px}.view-controls button{font-size:12px;padding:8px 12px}.panel{border:1px solid #e0e2d8;border-radius:24px;padding:24px;background:#fffdf8}h2{font-size:18px;margin:0 0 18px}label{display:block;font-size:13px;font-weight:bold;margin:16px 0 8px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{font-size:13px;padding:10px 12px}.readout{background:#edf3ec;border-radius:15px;padding:18px;margin:20px 0}.readout strong{font-size:28px;display:block}.readout p{margin:6px 0 0;font-size:13px}.panel input{width:100%;padding:11px;border:1px solid #b7cbc0;border-radius:10px}.panel .primary{width:100%;margin-top:12px}.feedback{min-height:52px;font-size:14px;color:#246c5b;line-height:1.7}.notes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.note{padding:20px 24px;background:#eeeee3;border-radius:18px;font-size:13px;line-height:1.8}.note b{display:block;margin-bottom:5px}footer{margin-top:22px;font-size:12px;color:#74847d}.hidden{display:none!important}@media(max-width:850px){.workspace{grid-template-columns:1fr}.scene,canvas{min-height:360px;height:360px}.notes{grid-template-columns:1fr}header{padding:18px 5vw}header small{display:none}nav button{min-width:0;flex:1}h1{font-size:25px}main{padding:20px 4vw}}
button:disabled{opacity:.45;cursor:default}</style>
</head>
<body>
<header><div class="brand"><span>◒</span> くらべるラボ</div><small>3Dでためす、量のふしぎ。　PROTOTYPE 01</small></header>
<main><div class="eyebrow">みて・よそうして・たしかめる</div><h1 id="title">どのくらいの長さかな？</h1><p class="muted" id="intro">130cmの子とならべて、身近なものの大きさを見てみよう。</p>
<nav aria-label="学習テーマ"><button data-mode="length" class="active">↔ 長さ</button><button data-mode="weight">⚖ 重さ</button><button data-mode="volume">◡ かさ</button></nav>
<div class="workspace"><section class="scene" aria-label="量を比較する図"><div class="scene-tag" id="sceneTag">立体ビュー · ドラッグで回転</div><canvas id="canvas" aria-label="130cmの子と物体の比較図"></canvas><div class="view-controls"><button id="front">正面から見る</button><button id="rotate">ななめから見る</button><button id="reset">最初にもどす</button></div></section>
<aside class="panel"><div id="controls"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div></aside></div>
<div class="notes"><div class="note"><b id="hintTitle">ためしてみよう</b><span id="hint">自分の身長とくらべると、どうかな？ 同じものを教室でも探してみよう。</span></div><div class="note"><b>先生・おうちの方へ</b><span id="teacher"></span></div></div>
<footer>教材用の模式モデルです。物の寸法・重さはモデル値で、実製品の測定値ではありません。ログイン不要・入力は保存されません。</footer></main>
<script src="classic.js"></script>
</body></html>
