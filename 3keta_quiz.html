<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3けたの かず 学習アプリ v10 wide</title>
    <style>
        :root {
            --color-hundreds: #00b0f0; /* 百：水色 */
            --color-tens: #f39c12;    /* 十：オレンジ */
            --color-ones: #e74c3c;    /* 一：赤 */
            --bg-light: #f8f9fa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #eef2f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            user-select: text;
        }

        /* ★ スター表示ヘッダー */
        .score-header {
            max-width: 1000px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #ffeaa7, #ffb8b8);
            padding: 12px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .star-count {
            font-size: 22px;
            font-weight: bold;
            color: #d35400;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-reset {
            background: rgba(255,255,255,0.7);
            border: 1px solid #cca;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            color: #666;
            font-weight: bold;
        }
        .btn-reset:hover { background: #fff; color: #c0392b; }

        /* 音のON/OFF絵文字ボタン */
        .btn-sound-toggle {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
            padding: 5px;
        }
        .btn-sound-toggle:active {
            transform: scale(0.9);
        }
        .sound-off {
            opacity: 0.3;
            filter: grayscale(100%);
        }

        /* メインコンテナ */
        .app-container {
            max-width: 1000px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 15px;
            margin-top: 0;
        }

        /* モード切り替えスイッチ */
        .mode-toggle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            background: #f1f2f6;
            padding: 8px 20px;
            border-radius: 30px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .mode-label {
            font-size: 16px;
            font-weight: bold;
            color: #57606f;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-label.active {
            color: #2f3542;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3498db;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input:checked + .slider {
            background-color: #2ed573;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* タブ切り替え */
        .tab-menu {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .tab-menu button {
            flex: 1;
            padding: 15px;
            border: none;
            background: #dfe6e9;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
        }
        .tab-menu button.active {
            background: #2c3e50;
            color: white;
        }

        /* 問題表示エリア */
        .problem-box {
            background: var(--bg-light);
            border-radius: 15px;
            padding: 20px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            box-sizing: border-box;
            border: 2px solid #e0e0e0;
        }
        .instruction {
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 15px;
            align-self: flex-start;
            color: #333;
        }
        
        /* SVG表示エリア */
        #visual-area {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        #visual-area svg {
            width: 100%;
            height: auto;
            max-height: 280px;
        }

        /* ヒント用スタイル */
        .hint-text {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 8px;
            display: flex;
            gap: 20px;
            line-height: 1.6;
        }
        .hint-box { border-width: 5px; border-style: solid; padding: 4px 15px; border-radius: 10px; }
        .hint-h { border-color: var(--color-hundreds); }
        .hint-t { border-color: var(--color-tens); }
        .hint-o { border-color: var(--color-ones); }
        
        ruby rt {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: normal;
            padding-bottom: 4px;
            color: #555;
        }

        /* 位取り表入力UI */
        .place-value-ui {
            display: flex;
            justify-content: center;
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px auto;
            max-width: 600px;
        }
        .pv-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
        }
        .pv-label {
            width: 100%;
            text-align: center;
            padding: 10px 0;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 2px solid #333;
        }
        .col-h { background-color: #e1f5fe; border-right: 2px dashed #333; }
        .col-t { background-color: #fffde7; border-right: 2px dashed #333; }
        .col-o { background-color: #ffebee; }

        .btn-arrow {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 12px;
            color: #555;
        }
        .btn-arrow:active { color: #000; }
        
        .digit-display {
            font-size: 54px;
            font-weight: bold;
            margin: 5px 0;
            height: 64px;
            line-height: 64px;
        }
        .hidden-digit { visibility: hidden; }

        /* ボタンエリア */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        .btn-main {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .btn-check { background-color: #27ae60; }
        .btn-hint { background-color: #f1c40f; color: #333; }
        .btn-next { background-color: #3498db; }
        .btn-main:hover { opacity: 0.9; transform: scale(1.03); }

        /* 解説エリア */
        .explanation {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            display: none;
            line-height: 1.9;
            font-size: 18px;
        }
        .correct { background: #d4edda; border: 2px solid #c3e6cb; color: #155724; }
        .incorrect { background: #f8d7da; border: 2px solid #f5c2c7; color: #721c24; }
        .normal-exp { background: #e2e3e5; border: 2px solid #d6d8db; color: #383d41; }
        
        .exp-part { margin-bottom: 12px; display: block; }
        .val-h { color: #008cc2; font-weight: bold; }
        .val-t { color: #d35400; font-weight: bold; }
        .val-o { color: #c0392b; font-weight: bold; }


        /* 改修: 操作状態・アクセシビリティ・レスポンシブ */
        .header-actions { display:flex; align-items:center; gap:8px; }
        .btn-sound-toggle {
            min-width: 46px;
            min-height: 46px;
            border-radius: 10px;
        }
        .btn-sound-toggle:hover { background: rgba(255,255,255,0.45); }
        button:focus-visible, .mode-label:focus-visible, .pv-col:focus-visible {
            outline: 4px solid #111;
            outline-offset: 3px;
        }
        .mode-label {
            border: none;
            background: transparent;
            padding: 5px 4px;
            font-family: inherit;
        }
        .pv-col {
            position: relative;
            transition: box-shadow .15s, transform .15s;
        }
        .pv-col.selected-place {
            box-shadow: inset 0 0 0 5px #2d3436;
            z-index: 2;
        }
        .pv-col.place-error {
            box-shadow: inset 0 0 0 5px #e74c3c;
        }
        .pv-col.place-missing {
            box-shadow: inset 0 0 0 5px #f39c12;
        }
        .pv-col.place-correct {
            box-shadow: inset 0 0 0 4px #27ae60;
        }
        .pv-col.selected-place.place-error {
            box-shadow: inset 0 0 0 5px #e74c3c, inset 0 0 0 9px #fff;
        }
        .pv-col.selected-place.place-missing {
            box-shadow: inset 0 0 0 5px #f39c12, inset 0 0 0 9px #fff;
        }
        .number-pad {
            display:grid;
            grid-template-columns: repeat(5, minmax(52px, 66px));
            justify-content:center;
            gap:8px;
            margin:10px auto 0;
        }
        .num-key {
            min-height:44px;
            border:2px solid #bdc3c7;
            border-radius:12px;
            background:#fff;
            font-size:21px;
            font-weight:bold;
            cursor:pointer;
        }
        .num-key:hover { background:#f1f2f6; }
        .num-key:active { transform:scale(.97); }
        .num-key-clear { font-size:15px; color:#555; }
        .current-number {
            margin: 8px auto 0;
            width: fit-content;
            min-width: 180px;
            padding: 7px 18px;
            border-radius: 999px;
            background: #f1f2f6;
            color: #2d3436;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .keyboard-help {
            margin-top: 8px;
            text-align: center;
            font-size: 13px;
            color: #636e72;
        }
        .retry-note {
            padding: 10px 12px;
            background: rgba(255,255,255,.62);
            border-radius: 10px;
            margin: 8px 0;
        }
        .wrong-place-list {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin:10px 0;
        }
        .wrong-place-chip {
            display:inline-block;
            padding:6px 10px;
            border-radius:999px;
            background:#fff;
            border:2px solid currentColor;
            font-weight:bold;
        }
        .hint-stage-label {
            display:block;
            font-size:14px;
            letter-spacing:0;
            color:#555;
            margin-bottom:2px;
        }
        .hint-empty {
            color:#666;
            font-size:22px;
            letter-spacing:0;
        }
        .btn-replay {
            margin-top: 14px;
            padding: 9px 18px;
            border: 2px solid #2c3e50;
            border-radius: 999px;
            background: white;
            color: #2c3e50;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-replay:disabled { opacity:.45; cursor:not-allowed; }
        .reading-selfcheck {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin-top:14px;
            align-items:center;
        }
        .btn-selfcheck {
            padding:8px 14px;
            border:2px solid #95a5a6;
            border-radius:999px;
            background:#fff;
            font-weight:bold;
            cursor:pointer;
        }
        .selfcheck-status { font-weight:bold; color:#2c3e50; }
        .btn-main:disabled, .btn-arrow:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }
        #explanation-area[aria-live] { scroll-margin-bottom: 110px; scroll-margin-top: 20px; }
        .switch input:focus-visible + .slider {
            outline: 4px solid #111;
            outline-offset: 4px;
        }
        .support-detail {
            margin-top:8px;
            padding:10px 12px;
            border-radius:10px;
            background:rgba(255,255,255,.72);
        }
        .support-answer {
            font-size:20px;
            font-weight:bold;
        }
        .score-header, .mode-toggle-container, .tab-menu, .place-value-ui, .number-pad, .controls, button {
            user-select: none;
        }
        .learning-status {
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:8px;
            margin:-10px 0 18px;
        }
        .skill-status-chip {
            display:inline-flex;
            align-items:center;
            gap:6px;
            padding:6px 10px;
            border-radius:999px;
            background:#f4f6f8;
            border:1px solid #dfe4e8;
            color:#34495e;
            font-size:13px;
            font-weight:bold;
        }
        .skill-status-chip.active {
            border-color:#2c3e50;
            box-shadow:0 0 0 2px rgba(44,62,80,.10);
        }
        .review-waiting { color:#8e5b00; }
        .auto-practice-row {
            display:flex;
            justify-content:center;
            align-items:center;
            flex-wrap:wrap;
            gap:8px;
            margin:-12px 0 18px;
        }
        .btn-auto-practice {
            border:2px solid #7f8c8d;
            border-radius:999px;
            background:#fff;
            color:#2c3e50;
            padding:8px 15px;
            font-weight:bold;
            cursor:pointer;
        }
        .btn-auto-practice.active {
            background:#2c3e50;
            border-color:#2c3e50;
            color:#fff;
        }
        .auto-step-label { font-size:13px; color:#57606f; font-weight:bold; }
        .category-progress {
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:6px;
            margin:-8px 0 16px;
        }
        .category-chip {
            padding:5px 9px;
            border-radius:999px;
            background:#f6f7f8;
            border:1px solid #dfe4e8;
            font-size:12px;
            font-weight:bold;
            color:#4b5563;
        }
        .category-chip.stable { background:#eaf7ed; border-color:#83c995; color:#236b36; }
        .category-chip.working { background:#fff7dc; border-color:#e8c95b; color:#735b00; }
        .category-chip.weak { background:#fff0ef; border-color:#e4aaa5; color:#8e2d24; }
        .category-chip.target { box-shadow:0 0 0 2px #2c3e50; }
        .learning-details {
            margin:-8px 0 16px;
            text-align:center;
        }
        .learning-details summary {
            cursor:pointer;
            display:inline-block;
            color:#57606f;
            font-size:12px;
            font-weight:bold;
            padding:5px 10px;
            border-radius:999px;
            background:#f5f6f7;
        }
        .learning-details[open] summary { margin-bottom:10px; }
        .auto-course-notice {
            min-height:1em;
            font-size:12px;
            color:#9a6100;
            font-weight:bold;
        }
        .mode-label:disabled, .switch input:disabled + .slider {
            opacity:.45;
            cursor:not-allowed;
        }

        .recognition-status {
            margin-top:10px;
            padding:12px 14px;
            border-radius:12px;
            background:#eef6ff;
            border:2px solid #b8d8f5;
            color:#234;
        }
        .recognition-listening {
            background:#fff7d6;
            border-color:#f1c40f;
        }
        .recognition-success {
            background:#e7f7ec;
            border-color:#27ae60;
        }
        .heard-text {
            display:inline-block;
            margin-top:6px;
            padding:4px 10px;
            border-radius:999px;
            background:#fff;
            border:1px solid #bfc9d4;
            font-weight:bold;
        }
        .mic-note {
            margin-top:8px;
            font-size:14px;
            color:#566573;
        }
        .btn-mic-cancel {
            margin-top: 10px;
            padding: 7px 14px;
            border: 2px solid #7f8c8d;
            border-radius: 999px;
            background: white;
            color: #444;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-mic-cancel:hover { background:#f7f7f7; }

        @media (max-width: 700px) {
            body { padding: 8px; }
            .score-header { padding: 8px 10px; gap:8px; }
            .header-left { gap: 6px; }
            .star-count { font-size: 16px; }
            .btn-reset { padding: 5px 8px; font-size: 11px; }
            .app-container { padding: 14px 10px; border-radius: 14px; }
            h1 { font-size: 21px; }
            .mode-toggle-container { width: 100%; box-sizing: border-box; padding: 7px 8px; gap:7px; }
            .mode-label { font-size: 13px; flex:1; }
            .switch { flex: 0 0 60px; }
            .tab-menu { gap: 5px; margin-bottom: 14px; }
            .tab-menu button { padding: 10px 5px; font-size: 14px; }
            .problem-box { padding: 12px 8px; min-height: 245px; }
            .instruction { font-size: 17px; }
            #visual-area svg { max-height: 240px; }
            .place-value-ui { margin: 12px auto; }
            .pv-label { font-size: 14px; padding: 8px 0; }
            .digit-display { font-size: 44px; height: 54px; line-height:54px; }
            .btn-arrow { padding: 8px 12px; }
            .controls {
                position: sticky;
                bottom: 6px;
                z-index: 30;
                gap:8px;
                padding:8px;
                background: rgba(255,255,255,.94);
                border-radius: 14px;
                box-shadow: 0 3px 14px rgba(0,0,0,.12);
            }
            .btn-main { padding: 12px 17px; font-size: 16px; }
            .explanation { font-size: 16px; padding: 14px; }
            .hint-text { font-size: 30px; gap:8px; letter-spacing:2px; }
            .hint-box { padding:4px 8px; }
            ruby rt { font-size: 12px; }
            .keyboard-help { display:none; }
            .number-pad { grid-template-columns:repeat(5, minmax(44px, 1fr)); gap:6px; width:100%; }
            .num-key { min-height:42px; font-size:19px; }
            .learning-status { margin:-4px 0 12px; gap:5px; }
            .skill-status-chip { font-size:11px; padding:5px 7px; }
            .auto-practice-row { margin:-4px 0 12px; gap:5px; }
            .btn-auto-practice { font-size:12px; padding:7px 11px; }
            .auto-step-label { font-size:11px; }
            .category-progress { margin:-4px 0 12px; gap:4px; }
            .category-chip { font-size:10px; padding:4px 6px; }
        }

        @media (max-height: 800px) {
            .controls {
                position: sticky;
                bottom: 6px;
                z-index: 30;
                padding: 8px;
                background: rgba(255,255,255,.95);
                border-radius: 14px;
                box-shadow: 0 3px 14px rgba(0,0,0,.12);
            }
            .problem-box { min-height: 235px; }
        }

    
        /* v10 wide: 16:9向け3カラム。中央は問題・位取り・解説だけ */
        body {
            height:100vh;
            box-sizing:border-box;
            padding:8px;
            overflow:hidden;
            align-items:stretch;
        }
        .workspace-shell {
            width:min(1540px, 100%);
            height:calc(100vh - 16px);
            margin:0 auto;
            display:grid;
            grid-template-columns:minmax(230px, 270px) minmax(560px, 1fr) minmax(270px, 310px);
            gap:10px;
            align-items:stretch;
        }
        .side-panel {
            min-width:0;
            height:100%;
            overflow-y:auto;
            overflow-x:hidden;
            padding:8px;
            box-sizing:border-box;
            border-radius:18px;
            background:rgba(255,255,255,.76);
            box-shadow:0 5px 18px rgba(0,0,0,.08);
            scrollbar-width:thin;
        }
        .side-panel h1 {
            font-size:21px;
            margin:3px 0 8px;
            text-align:center;
        }
        .side-card {
            width:100%;
            box-sizing:border-box;
            margin:0 0 9px;
            padding:10px;
            border-radius:14px;
            background:#fff;
            border:1px solid #dde3e8;
        }
        .side-section-title {
            margin:0 0 7px;
            font-size:13px;
            font-weight:800;
            color:#57606f;
            text-align:center;
        }
        .score-header {
            max-width:none;
            display:grid;
            grid-template-columns:1fr auto;
            gap:7px;
            padding:9px 10px;
            margin-bottom:9px;
        }
        .score-header .header-left {
            min-width:0;
            display:flex;
            flex-direction:column;
            align-items:flex-start;
            gap:4px;
        }
        .star-count { font-size:16px; gap:4px; }
        .btn-reset { font-size:10px; padding:4px 7px; }
        .header-actions { gap:3px; }
        .btn-sound-toggle { min-width:36px; min-height:36px; font-size:20px; padding:2px; }

        .mode-toggle-container {
            width:100%;
            margin:0;
            padding:7px;
            box-sizing:border-box;
            flex-direction:column;
            gap:5px;
            border-radius:14px;
        }
        .mode-label { width:100%; font-size:13px; padding:5px 2px; }
        .switch { width:52px; height:28px; }
        .slider:before { width:20px; height:20px; }
        input:checked + .slider:before { transform:translateX(24px); }
        .auto-practice-row {
            margin:8px 0 0;
            flex-direction:column;
            gap:4px;
        }
        .btn-auto-practice { width:100%; padding:7px 8px; font-size:12px; }
        .auto-step-label { font-size:11px; text-align:center; }

<body>

<div class="workspace-shell">
    <aside class="side-panel side-left" aria-label="学習メニュー">
        <h1>🔢 3けたの かず</h1>

        <div class="score-header side-card">
            <div class="header-left">
                <div class="star-count" id="star-display" aria-live="polite">🌟 あつめた★: 0こ</div>
                <button class="btn-reset" onclick="resetStars()">★をリセット</button>
            </div>
            <div class="header-actions">
                <button id="sound-toggle-btn" class="btn-sound-toggle" onclick="toggleSound()" aria-label="こうかおんを オン・オフ" title="こうかおん">🔊</button>
                <button id="speech-toggle-btn" class="btn-sound-toggle" onclick="toggleSpeech()" aria-label="よみあげを オン・オフ" title="よみあげ">🗣️</button>
            </div>
        </div>

        <div class="side-card side-section">
            <div class="side-section-title">れんしゅうのしかた</div>
            <div class="mode-toggle-container">
                <button type="button" id="label-zero" class="mode-label active" onclick="setMode(false)" aria-pressed="true">🎯 空位のれんしゅう</button>
                <label class="switch">
                    <input type="checkbox" id="mode-checkbox" onchange="toggleMode()" aria-label="出題モードを切りかえる">
                    <span class="slider"></span>
                </label>
                <button type="button" id="label-random" class="mode-label" onclick="setMode(true)" aria-pressed="false">🎲 かんぜんランダム</button>
            </div>
            <div class="auto-practice-row">
                <button type="button" id="auto-practice-btn" class="btn-auto-practice" onclick="toggleAutoPractice()" aria-pressed="false">🧭 おまかせ練習：OFF</button>
                <span id="auto-step-label" class="auto-step-label">自由練習</span>
                <span id="auto-course-notice" class="auto-course-notice" aria-live="polite"></span>
            </div>
        </div>

        <div class="side-card side-section">
            <div class="side-section-title">もんだい</div>
            <div class="tab-menu">
                <button id="tab1" class="active" onclick="changeTab(1)" aria-pressed="true">📷 えを みて<br>こたえる</button>
                <button id="tab2" onclick="changeTab(2)" aria-pressed="false">🔢 すうじを<br>よむ</button>
                <button id="tab3" onclick="changeTab(3)" aria-pressed="false">✏️ かんじから<br>すうじへ</button>
            </div>
        </div>

        <details class="learning-details side-card">
            <summary>学習のようすを見る</summary>
            <div id="learning-status" class="learning-status" aria-live="polite" aria-label="さいきんの学習記録"></div>
            <div id="category-progress" class="category-progress" aria-live="polite" aria-label="問題タイプごとの学習状況"></div>
        </details>
    </aside>

    <main class="app-container center-stage" aria-label="問題と解説">
        <div class="problem-box">
            <div id="instruction" class="instruction"></div>
            <div id="visual-area"></div>
            <div id="reading-action-slot" class="reading-action-slot" aria-label="よみの操作"></div>
        </div>

        <div id="input-section" class="place-frame">
            <div class="place-value-ui" aria-label="位ごとの数字入力">
                <div class="pv-col col-h selected-place" data-place="h" tabindex="0" onclick="selectPlace('h')" aria-label="百のくらい">
                    <div class="pv-label">百のくらい</div>
                    <button class="btn-arrow" onclick="event.stopPropagation(); selectPlace('h'); adjustDigit('h', 1)" aria-label="百のくらいを1ふやす">▲</button>
                    <div id="disp-h" class="digit-display">―</div>
                    <button class="btn-arrow" onclick="event.stopPropagation(); selectPlace('h'); adjustDigit('h', -1)" aria-label="百のくらいを1へらす">▼</button>
                </div>
                <div class="pv-col col-t" data-place="t" tabindex="0" onclick="selectPlace('t')" aria-label="十のくらい">
                    <div class="pv-label">十のくらい</div>
                    <button class="btn-arrow" onclick="event.stopPropagation(); selectPlace('t'); adjustDigit('t', 1)" aria-label="十のくらいを1ふやす">▲</button>
                    <div id="disp-t" class="digit-display">―</div>
                    <button class="btn-arrow" onclick="event.stopPropagation(); selectPlace('t'); adjustDigit('t', -1)" aria-label="十のくらいを1へらす">▼</button>
                </div>
                <div class="pv-col col-o" data-place="o" tabindex="0" onclick="selectPlace('o')" aria-label="一のくらい">
                    <div class="pv-label">一のくらい</div>
                    <button class="btn-arrow" onclick="event.stopPropagation(); selectPlace('o'); adjustDigit('o', 1)" aria-label="一のくらいを1ふやす">▲</button>
                    <div id="disp-o" class="digit-display">―</div>
                    <button class="btn-arrow" onclick="event.stopPropagation(); selectPlace('o'); adjustDigit('o', -1)" aria-label="一のくらいを1へらす">▼</button>
                </div>
            </div>

        <div id="explanation-area" class="explanation" aria-live="polite"></div>
    </main>

    <aside class="side-panel side-right" aria-label="入力と操作">
        <div id="side-input-tools" class="side-card input-tools">
            <div class="side-section-title">数字を入れる</div>
            <div id="current-number" class="current-number" aria-live="polite">いまの数：まだ入力していません</div>
            <div class="number-pad" aria-label="数字をえらぶ">
                <button type="button" class="num-key" onclick="inputDigit(1)">1</button>
                <button type="button" class="num-key" onclick="inputDigit(2)">2</button>
                <button type="button" class="num-key" onclick="inputDigit(3)">3</button>
                <button type="button" class="num-key" onclick="inputDigit(4)">4</button>
                <button type="button" class="num-key" onclick="inputDigit(5)">5</button>
                <button type="button" class="num-key" onclick="inputDigit(6)">6</button>
                <button type="button" class="num-key" onclick="inputDigit(7)">7</button>
                <button type="button" class="num-key" onclick="inputDigit(8)">8</button>
                <button type="button" class="num-key" onclick="inputDigit(9)">9</button>
                <button type="button" class="num-key" onclick="inputDigit(0)">0</button>
                <button type="button" class="num-key num-key-clear" onclick="clearSelectedDigit()">えらんだ位を けす</button>
            </div>
            <div class="keyboard-help">キーボード：0〜9 ／ ← →で位 ／ ↑ ↓で増減 ／ Backspaceで消す ／ Enterで決定</div>
        </div>

        <div class="side-card action-card">
            <div class="side-section-title">そうさ</div>
            <div class="controls">
                <button id="hint-btn" class="btn-main btn-hint" onclick="toggleHint()" style="display:none;">ヒント</button>
                <div id="action-btn-home" class="action-btn-home"><button id="action-btn" class="btn-main btn-check" onclick="processAction()">こたえあわせ</button></div>
                <button id="next-btn" class="btn-main btn-next" onclick="initProblem()">つぎへ</button>
            </div>
        </div>
    </aside>
</div>

<script>
    const STORAGE_KEYS = {
        stars: '3keta_quiz_stars_v2',
        sfx: '3keta_quiz_sfx_v2',
        speech: '3keta_quiz_speech_v2',
        mode: '3keta_quiz_mode_v2',
        reviewSession: '3keta_quiz_review_session_v9',
        legacyReviewSession: '3keta_quiz_review_session_v8',
        legacyReviewSession2: '3keta_quiz_review_session_v7',
        autoPractice: '3keta_quiz_auto_practice_v9',
        legacyAutoPractice: '3keta_quiz_auto_practice_v8',
        legacyAutoPractice2: '3keta_quiz_auto_practice_v7'
    };

    let currentTab = 1;
    let prob = { h: 0, t: 0, o: 0, val: 0 };
    let user = { h: null, t: null, o: null };
    let hintLevel = 0;
    let hintUsed = false;
    let attemptCount = 0;
    let stars = 0;
    let isRandomMode = false;
    let isSoundOn = true;
    let isSpeechOn = true;
    let selectedPlace = 'h';
    let lastProbVal = null;
    let currentVisualMode = 'ぼう';
    let audioCtx = null;
    let feedbackActive = false;
    let lastEvaluatedWrongPlaces = [];
    let reviewQueue = [];
    let completedByTab = {1:0, 2:0, 3:0};
    let recentOutcomes = {1:[], 2:[], 3:[]};
    let categoryHistory = createEmptyCategoryHistory();
    let categoryCoverage = createEmptyCategoryCoverage();
    let categoryMastery = createEmptyCategoryMastery();
    let readingHundredCoverage = createEmptyReadingHundredCoverage();
    let mixedCategoryBags = {1:[], 2:[], 3:[]};
    let mixedPracticeHistory = {1:[], 2:[], 3:[]};
    let courseCompletion = {1:null, 2:null, 3:null};
    let activeCourseProblem = null;
    let autoPractice = false;
    let currentProblemCategory = 'full';
    let currentProblemCompleted = false;
    let currentOutcomeRecorded = false;
    let activeReviewItem = null;
    let readingAttempts = 0;
    let numericRecognitionCount = 0;
    let noSpeechCount = 0;
    let isListening = false;
    let recognitionFallback = false;
    let activeRecognition = null;
    let recognitionTimer = null;
    let readingHadDifficulty = false;
    let currentProblemCourseLocked = false;
    let currentProblemPhase = 'free';
    let isResumingCourseProblem = false;

    const CATEGORY_ORDER = ['full','onesZero','tensZero','bothZero'];
    const CATEGORY_LABELS = {
        full:'0なし',
        onesZero:'一が0',
        tensZero:'十が0',
        bothZero:'100の倍数'
    };
    const CATEGORY_STEP_LABELS = {
        full:'STEP 1：0のない3けた',
        onesZero:'STEP 2：一のくらいが0',
        tensZero:'STEP 3：十のくらいが0',
        bothZero:'STEP 4：100の倍数'
    };

    function createEmptyCategoryHistory() {
        const result = {};
        [1,2,3].forEach(tab => {
            result[tab] = {};
            ['full','onesZero','tensZero','bothZero'].forEach(cat => result[tab][cat] = []);
        });
        return result;
    }

    function createEmptyCategoryCoverage() {
        const result = {};
        [1,2,3].forEach(tab => {
            result[tab] = {};
            ['full','onesZero','tensZero','bothZero'].forEach(cat => {
                result[tab][cat] = {
                    visualStick:false,
                    visualOrigami:false,
                    read300:false,
                    read600:false,
                    read800:false,
                    readRegular:false,
                    implicitHundredOne:false,
                    implicitTenOne:false,
                    explicitOne:false
                };
            });
        });
        return result;
    }

    function createEmptyReadingHundredCoverage() {
        return { read300:false, read600:false, read800:false, readRegular:false };
    }

    function createEmptyCategoryMastery() {
        const result = {};
        [1,2,3].forEach(tab => {
            result[tab] = {};
            ['full','onesZero','tensZero','bothZero'].forEach(cat => result[tab][cat] = false);
        });
        return result;
    }

    const readH = {1:"ひゃく", 2:"にひゃく", 3:"さんびゃく", 4:"よんひゃく", 5:"ごひゃく", 6:"ろっぴゃく", 7:"ななひゃく", 8:"はっぴゃく", 9:"きゅうひゃく"};
    const readT = {1:"じゅう", 2:"にじゅう", 3:"さんじゅう", 4:"よんじゅう", 5:"ごじゅう", 6:"ろくじゅう", 7:"ななじゅう", 8:"はちじゅう", 9:"きゅうじゅう"};
    const readO = {1:"いち", 2:"に", 3:"さん", 4:"よん", 5:"ご", 6:"ろく", 7:"なな", 8:"はち", 9:"きゅう"};
    const kanjiH = {1:"百", 2:"二百", 3:"三百", 4:"四百", 5:"五百", 6:"六百", 7:"七百", 8:"八百", 9:"九百"};
    const kanjiT = {1:"十", 2:"二十", 3:"三十", 4:"四十", 5:"五十", 6:"六十", 7:"七十", 8:"八十", 9:"九十"};
    const kanjiO = {1:"一", 2:"二", 3:"三", 4:"四", 5:"五", 6:"六", 7:"七", 8:"八", 9:"九"};
    const placeNames = {h:'百のくらい', t:'十のくらい', o:'一のくらい'};
    const placeClasses = {h:'val-h', t:'val-t', o:'val-o'};

    function isValidReviewItem(item) {
        return item && [1,2,3].includes(Number(item.tab))
            && Number.isInteger(item.h) && item.h >= 1 && item.h <= 9
            && Number.isInteger(item.t) && item.t >= 0 && item.t <= 9
            && Number.isInteger(item.o) && item.o >= 0 && item.o <= 9
            && Number(item.val) === item.h * 100 + item.t * 10 + item.o
            && Number.isFinite(Number(item.dueAt));
    }

    function isValidCourseProblem(item) {
        return item && [1,2,3].includes(Number(item.tab))
            && Number.isInteger(item.h) && item.h >= 1 && item.h <= 9
            && Number.isInteger(item.t) && item.t >= 0 && item.t <= 9
            && Number.isInteger(item.o) && item.o >= 0 && item.o <= 9
            && Number(item.val) === item.h * 100 + item.t * 10 + item.o
            && CATEGORY_ORDER.includes(item.category)
            && ['step','mixed'].includes(item.phase);
    }

    function saveReviewState() {
        try {
            sessionStorage.setItem(STORAGE_KEYS.reviewSession, JSON.stringify({
                queue: reviewQueue,
                completedByTab,
                recentOutcomes,
                categoryHistory,
                categoryCoverage,
                categoryMastery,
                readingHundredCoverage,
                mixedCategoryBags,
                mixedPracticeHistory,
                courseCompletion,
                active: activeReviewItem,
                activeCourseProblem,
                currentTab
            }));
        } catch (e) {
            console.log('Review state save error:', e);
        }
    }

    function loadReviewState() {
        try {
            const raw = sessionStorage.getItem(STORAGE_KEYS.reviewSession)
                || sessionStorage.getItem(STORAGE_KEYS.legacyReviewSession)
                || sessionStorage.getItem(STORAGE_KEYS.legacyReviewSession2);
            if (!raw) return;
            const data = JSON.parse(raw);
            reviewQueue = Array.isArray(data.queue)
                ? data.queue.filter(isValidReviewItem).map(item => ({
                    ...item,
                    kind:item.kind === 'transfer' ? 'transfer' : 'review',
                    noTransfer:item.noTransfer === true
                }))
                : [];

            const c = data.completedByTab || {};
            completedByTab = {
                1: Math.max(0, Number(c[1]) || 0),
                2: Math.max(0, Number(c[2]) || 0),
                3: Math.max(0, Number(c[3]) || 0)
            };

            const ro = data.recentOutcomes || {};
            const allowedOutcomes = new Set(['independent','verified','selfchecked','assisted','practice']);
            recentOutcomes = {
                1: Array.isArray(ro[1]) ? ro[1].filter(x => allowedOutcomes.has(x)).slice(-5) : [],
                2: Array.isArray(ro[2]) ? ro[2].filter(x => allowedOutcomes.has(x)).slice(-5) : [],
                3: Array.isArray(ro[3]) ? ro[3].filter(x => allowedOutcomes.has(x)).slice(-5) : []
            };

            const loadedHistory = data.categoryHistory || {};
            categoryHistory = createEmptyCategoryHistory();
            [1,2,3].forEach(tab => {
                CATEGORY_ORDER.forEach(cat => {
                    const arr = loadedHistory?.[tab]?.[cat];
                    if (!Array.isArray(arr)) return;
                    categoryHistory[tab][cat] = arr.filter(entry =>
                        entry && allowedOutcomes.has(entry.outcome)
                    ).map(entry => {
                        const kind = entry.kind === 'transfer' ? 'transfer' : (entry.review ? 'review' : 'new');
                        return {...entry, kind, review:kind !== 'new'};
                    }).slice(-12);
                });
            });

            categoryCoverage = createEmptyCategoryCoverage();
            const loadedCoverage = data.categoryCoverage || {};
            [1,2,3].forEach(tab => CATEGORY_ORDER.forEach(cat => {
                const src = loadedCoverage?.[tab]?.[cat] || {};
                const dst = categoryCoverage[tab][cat];
                Object.keys(dst).forEach(key => dst[key] = src[key] === true);
            }));

            readingHundredCoverage = createEmptyReadingHundredCoverage();
            if (data.readingHundredCoverage && typeof data.readingHundredCoverage === 'object') {
                Object.keys(readingHundredCoverage).forEach(key => readingHundredCoverage[key] = data.readingHundredCoverage[key] === true);
            } else {
                // v8からの移行：各カテゴリーに分散していた百の読み実績を共有技能へ統合。
                CATEGORY_ORDER.forEach(cat => {
                    const src = loadedCoverage?.[2]?.[cat] || {};
                    if (src.read300) readingHundredCoverage.read300 = true;
                    if (src.read600) readingHundredCoverage.read600 = true;
                    if (src.read800) readingHundredCoverage.read800 = true;
                    if (src.readRegular) readingHundredCoverage.readRegular = true;
                });
                CATEGORY_ORDER.forEach(cat => {
                    categoryHistory[2][cat].forEach(entry => {
                        if (!isCoverageSuccessOutcome(2, entry.outcome) || entry.kind === 'review') return;
                        updateReadingHundredCoverage(entry);
                    });
                });
            }

            categoryMastery = createEmptyCategoryMastery();
            const loadedMastery = data.categoryMastery || {};
            [1,2,3].forEach(tab => CATEGORY_ORDER.forEach(cat => {
                categoryMastery[tab][cat] = loadedMastery?.[tab]?.[cat] === true;
            }));

            const loadedBags = data.mixedCategoryBags || {};
            mixedCategoryBags = {1:[], 2:[], 3:[]};
            [1,2,3].forEach(tab => {
                if (Array.isArray(loadedBags[tab])) {
                    mixedCategoryBags[tab] = loadedBags[tab].filter(cat => CATEGORY_ORDER.includes(cat)).slice(0, 8);
                }
            });

            const loadedMixed = data.mixedPracticeHistory || {};
            mixedPracticeHistory = {1:[], 2:[], 3:[]};
            [1,2,3].forEach(tab => {
                if (!Array.isArray(loadedMixed[tab])) return;
                mixedPracticeHistory[tab] = loadedMixed[tab].filter(entry =>
                    entry && CATEGORY_ORDER.includes(entry.category) && allowedOutcomes.has(entry.outcome)
                ).slice(-12);
            });

            const loadedCompletion = data.courseCompletion || {};
            courseCompletion = {1:null, 2:null, 3:null};
            [1,2,3].forEach(tab => {
                const mode = loadedCompletion[tab];
                if (['mastered','verified','selfchecked'].includes(mode)) courseCompletion[tab] = mode;
            });

            // 旧版の判定をv9の技能軸で再計算する。
            [1,2,3].forEach(tab => CATEGORY_ORDER.forEach(cat => recalculateCategoryMastery(tab, cat)));

            // 表示中に再読み込みされた復習問題はキューへ戻して、そのタブを復元。
            if (isValidReviewItem(data.active)) {
                const item = {...data.active, kind:data.active.kind === 'transfer' ? 'transfer' : 'review'};
                const exists = reviewQueue.some(q => q.tab === item.tab && q.val === item.val && q.kind === item.kind);
                if (!exists) reviewQueue.unshift(item);
                currentTab = Number(item.tab);
            } else if (isValidCourseProblem(data.activeCourseProblem)) {
                activeCourseProblem = {...data.activeCourseProblem};
                currentTab = Number(activeCourseProblem.tab);
            } else if ([1,2,3].includes(Number(data.currentTab))) {
                currentTab = Number(data.currentTab);
            }
            activeReviewItem = null;
            saveReviewState();
        } catch (e) {
            reviewQueue = [];
            completedByTab = {1:0, 2:0, 3:0};
            recentOutcomes = {1:[], 2:[], 3:[]};
            categoryHistory = createEmptyCategoryHistory();
            categoryCoverage = createEmptyCategoryCoverage();
            categoryMastery = createEmptyCategoryMastery();
            readingHundredCoverage = createEmptyReadingHundredCoverage();
            mixedCategoryBags = {1:[], 2:[], 3:[]};
            mixedPracticeHistory = {1:[], 2:[], 3:[]};
            courseCompletion = {1:null, 2:null, 3:null};
            activeCourseProblem = null;
            activeReviewItem = null;
            console.log('Review state load error:', e);
        }
    }

    function playSound(type) {
        if (!isSoundOn) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);
                gain.gain.setValueAtTime(0.13, now);
                gain.gain.linearRampToValueAtTime(0.13, now + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'incorrect') {
                // 強い「罰」の音にせず、短い再確認音にする
                osc.type = 'sine';
                osc.frequency.setValueAtTime(330, now);
                osc.frequency.setValueAtTime(294, now + 0.12);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);
                osc.start(now); osc.stop(now + 0.24);
            }
        } catch (e) {
            console.log('Audio error:', e);
        }
    }

    function fitExplanationToFrame() {
        const area = document.getElementById('explanation-area');
        const center = document.querySelector('.center-stage');
        if (!area || !center || window.innerWidth <= 820) return;
        let size = 15;
        area.style.fontSize = size + 'px';
        area.style.lineHeight = '1.38';
        // 内容が多い時だけ少しずつ縮め、枠内に収める。
        while (area.scrollHeight > area.clientHeight + 1 && size > 11) {
            size -= 0.5;
            area.style.fontSize = size + 'px';
        }
        if (area.scrollHeight > area.clientHeight + 1) area.style.lineHeight = '1.26';
    }

    function fitVisualToFrame() {
        const area = document.getElementById('visual-area');
        if (!area || window.innerWidth <= 820) return;
        const child = area.firstElementChild;
        if (!child || child.tagName?.toLowerCase() === 'svg') return;
        child.style.transform = '';
        child.style.transformOrigin = 'center center';
        const aw = Math.max(1, area.clientWidth - 4);
        const ah = Math.max(1, area.clientHeight - 4);
        const cw = Math.max(1, child.scrollWidth);
        const ch = Math.max(1, child.scrollHeight);
        const scale = Math.min(1, aw / cw, ah / ch);
        if (scale < 0.995) child.style.transform = `scale(${Math.max(0.68, scale)})`;
    }

    function fitCenterFrames() {
        requestAnimationFrame(() => {
            fitExplanationToFrame();
            fitVisualToFrame();
        });
    }

    function buildExplanationSpeechText() {
        const parts = ['正解です。'];
        if (currentTab === 3) {
            parts.push(`${getFullKanji()}は、百のくらいが${prob.h}、`);
            if (prob.t === 0) parts.push('十をあらわす言葉がないので、十のくらいは0、');
            else parts.push(`十のくらいが${prob.t}、`);
            if (prob.o === 0) parts.push('一をあらわす言葉がないので、一のくらいは0です。');
            else parts.push(`一のくらいが${prob.o}です。`);
        } else {
            const hUnit = currentVisualMode === '折り紙' ? '100のまとまり' : '100のたば';
            const tUnit = currentVisualMode === '折り紙' ? '10のまとまり' : '10のたば';
            const oUnit = currentVisualMode === '折り紙' ? '1まい' : '1のばら';
            parts.push(`${hUnit}が${prob.h}つあるので、百のくらいは${prob.h}。`);
            parts.push(prob.t > 0 ? `${tUnit}が${prob.t}つあるので、十のくらいは${prob.t}。` : `${tUnit}がないので、十のくらいは0。`);
            parts.push(prob.o > 0 ? `${oUnit}が${prob.o}つあるので、一のくらいは${prob.o}。` : `${oUnit}がないので、一のくらいは0。`);
        }
        parts.push(`だから、答えは${prob.val}です。`);
        return parts.join('');
    }
