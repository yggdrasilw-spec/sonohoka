    function getProblemCategory(problem = prob) {
        if (problem.t === 0 && problem.o === 0) return 'bothZero';
        if (problem.t === 0) return 'tensZero';
        if (problem.o === 0) return 'onesZero';
        return 'full';
    }

    function getEntryKind(entry) {
        if (entry?.kind === 'transfer') return 'transfer';
        if (entry?.kind === 'review' || entry?.review === true) return 'review';
        return 'new';
    }

    function getCategoryEntries(tab, category, includeReviews = false) {
        const list = categoryHistory?.[tab]?.[category] || [];
        return includeReviews ? list : list.filter(entry => getEntryKind(entry) === 'new');
    }

    function getMasteryEntries(tab, category) {
        const list = categoryHistory?.[tab]?.[category] || [];
        return list.filter(entry => {
            const kind = getEntryKind(entry);
            return kind === 'new' || kind === 'transfer';
        });
    }

    function isCoverageSuccessOutcome(tab, outcome) {
        if (tab === 2) return ['independent','verified','selfchecked'].includes(outcome);
        return outcome === 'independent';
    }

    function isDifficultyOutcome(outcome) {
        return !['independent','verified','selfchecked'].includes(outcome);
    }

    function updateReadingHundredCoverage(entry) {
        if (!entry || !isCoverageSuccessOutcome(2, entry.outcome)) return;
        if (entry.h === 3) readingHundredCoverage.read300 = true;
        else if (entry.h === 6) readingHundredCoverage.read600 = true;
        else if (entry.h === 8) readingHundredCoverage.read800 = true;
        else readingHundredCoverage.readRegular = true;
    }

    function readingHundredCoverageMet() {
        const c = readingHundredCoverage;
        return c.read300 && c.read600 && c.read800 && c.readRegular;
    }

    function getCoverageSummary(tab, category) {
        if (tab === 2) return {...readingHundredCoverage};
        return {...(categoryCoverage?.[tab]?.[category] || {})};
    }

    function categoryCoverageMet(tab, category) {
        const c = getCoverageSummary(tab, category);
        if (tab === 1) return c.visualStick && c.visualOrigami;
        // 読みの300/600/800は「0の位置」と独立した共有技能として扱う。
        if (tab === 2) return true;
        if (tab === 3) {
            const needsTenImplicit = category === 'full' || category === 'onesZero';
            return c.implicitHundredOne && c.explicitOne && (!needsTenImplicit || c.implicitTenOne);
        }
        return true;
    }

    function getCategoryState(tab, category) {
        const list = getMasteryEntries(tab, category).slice(-5);
        const independent = list.filter(e => e.outcome === 'independent').length;
        const verified = list.filter(e => e.outcome === 'verified').length;
        const selfchecked = list.filter(e => e.outcome === 'selfchecked').length;
        const difficulties = list.filter(e => isDifficultyOutcome(e.outcome)).length;
        const stable = categoryMastery?.[tab]?.[category] === true;
        const weak = !stable && list.length >= 3 && difficulties >= 2;
        return {
            list, independent, verified, selfchecked, stable, weak,
            coverageMet: categoryCoverageMet(tab, category),
            verificationLimited: tab === 2 && stable && independent < 4 && (verified + selfchecked) > 0
        };
    }

    function updateCategoryCoverage(tab, category, entry) {
        if (!isCoverageSuccessOutcome(tab, entry.outcome)) return;
        if (tab === 2) {
            updateReadingHundredCoverage(entry);
            return;
        }
        const c = categoryCoverage[tab][category];
        if (tab === 1) {
            if (entry.visualMode === 'ぼう') c.visualStick = true;
            if (entry.visualMode === '折り紙') c.visualOrigami = true;
        } else if (tab === 3) {
            if (entry.h === 1) c.implicitHundredOne = true;
            if (entry.t === 1) c.implicitTenOne = true;
            const tenExplicitEnough = (category === 'full' || category === 'onesZero') ? entry.t !== 1 : true;
            if (entry.h !== 1 && tenExplicitEnough) c.explicitOne = true;
        }
    }

    function recalculateCategoryMastery(tab, category) {
        const list = getMasteryEntries(tab, category).slice(-5);
        const independent = list.filter(e => e.outcome === 'independent').length;
        const verified = list.filter(e => e.outcome === 'verified').length;
        const selfchecked = list.filter(e => e.outcome === 'selfchecked').length;
        const latest = list[list.length - 1] || null;
        const currentlyStable = categoryMastery[tab][category] === true;

        // 類題への転移に失敗したら、その技能は一度再練習へ戻す。
        if (latest && getEntryKind(latest) === 'transfer' && isDifficultyOutcome(latest.outcome)) {
            categoryMastery[tab][category] = false;
            mixedCategoryBags[tab] = [];
            return;
        }

        if (!currentlyStable) {
            const strongPass = list.length >= 4 && independent >= 4;
            const speechFallbackPass = tab === 2 && list.length >= 5 && (independent + verified + selfchecked) >= 5;
            if ((strongPass || speechFallbackPass) && categoryCoverageMet(tab, category)) {
                categoryMastery[tab][category] = true;
                mixedCategoryBags[tab] = [];
            }
            return;
        }

        // 一度のつまずきでは戻さない。直近4件で2回以上支援が必要なら再練習へ。
        const lastFour = list.slice(-4);
        const difficulties = lastFour.filter(e => isDifficultyOutcome(e.outcome)).length;
        if (lastFour.length >= 4 && difficulties >= 2) {
            categoryMastery[tab][category] = false;
            mixedCategoryBags[tab] = [];
        }
    }

    function categoriesStableOnly(tab = currentTab) {
        return CATEGORY_ORDER.every(cat => categoryMastery?.[tab]?.[cat] === true);
    }

    function allCategoriesStable(tab = currentTab) {
        if (!categoriesStableOnly(tab)) return false;
        if (tab === 2 && !readingHundredCoverageMet()) return false;
        return true;
    }

    function getAutoTargetCategory(tab = currentTab) {
        for (const category of CATEGORY_ORDER) {
            if (!categoryMastery?.[tab]?.[category]) return category;
        }
        // 0の位置の4カテゴリーが終わっても、百の変則読みが未確認なら読みタブ内で補う。
        if (tab === 2 && !readingHundredCoverageMet()) return 'full';
        return null;
    }

    function getWeakestCategory(tab = currentTab) {
        let weakest = null;
        let weakestRate = 1;
        for (const cat of CATEGORY_ORDER) {
            const state = getCategoryState(tab, cat);
            if (!state.list.length) continue;
            const rate = (state.independent + (state.verified || 0) * 0.8 + (state.selfchecked || 0) * 0.6) / state.list.length;
            if (rate < weakestRate) {
                weakestRate = rate;
                weakest = cat;
            }
        }
        return weakestRate < 1 ? weakest : null;
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function refillMixedCategoryBag(tab = currentTab) {
        const weakest = getWeakestCategory(tab);
        const bag = [...CATEGORY_ORDER];
        if (weakest) bag.push(weakest); // 弱い種類だけ1回多く。それでも全種類を必ず経験する。
        shuffleArray(bag);
        if (bag.length > 1 && bag[bag.length - 1] === currentProblemCategory) {
            [bag[bag.length - 1], bag[bag.length - 2]] = [bag[bag.length - 2], bag[bag.length - 1]];
        }
        mixedCategoryBags[tab] = bag;
    }

    function getNextMixedCategory(tab = currentTab) {
        if (!Array.isArray(mixedCategoryBags[tab]) || mixedCategoryBags[tab].length === 0) {
            refillMixedCategoryBag(tab);
        }
        const cat = mixedCategoryBags[tab].pop();
        saveReviewState();
        return cat || CATEGORY_ORDER[Math.floor(Math.random() * CATEGORY_ORDER.length)];
    }

    function getGenerationHint(tab, category) {
        if (!autoPractice) return {};
        // 百の読みは0の位置と独立した共有技能。カテゴリーが安定済みでも未確認なら優先する。
        if (tab === 2) {
            const c = readingHundredCoverage;
            if (!c.read300) return { hValue:3 };
            if (!c.read600) return { hValue:6 };
            if (!c.read800) return { hValue:8 };
            if (!c.readRegular) return { hundredType:'regular' };
        }
        if (categoryMastery?.[tab]?.[category]) return {};
        const c = getCoverageSummary(tab, category);
        if (tab === 3) {
            const needsTenImplicit = category === 'full' || category === 'onesZero';
            if (!c.implicitHundredOne) return { hValue:1, tNotOne:needsTenImplicit };
            if (needsTenImplicit && !c.implicitTenOne) return { tValue:1, hNotOne:true };
            if (!c.explicitOne) return { explicitOne:true };
        }
        return {};
    }

    function pickFrom(values) {
        return values[Math.floor(Math.random() * values.length)];
    }

    function getPacingSuccessCount(tab, category) {
        return getCategoryEntries(tab, category, false)
            .filter(entry => isCoverageSuccessOutcome(tab, entry.outcome))
            .length;
    }

    function buildCategoryCandidate(category, hint = {}, tab = currentTab, usePacing = true) {
        const successCount = getPacingSuccessCount(tab, category);
        const early = autoPractice && usePacing && successCount < 2;
        const maxDigit = early ? 4 : 9;
        let hPool = Array.from({length:maxDigit}, (_,i) => i + 1);

        if (Number.isInteger(hint.hValue)) hPool = [hint.hValue];
        else if (hint.hundredType === 'irregular') {
            hPool = [3,6,8].filter(n => !early || n <= 4);
            if (!hPool.length) hPool = [3];
        } else if (hint.hundredType === 'regular') {
            hPool = [1,2,4,5,7,9].filter(n => !early || n <= 4);
        }
        if (hint.hNotOne) hPool = hPool.filter(n => n !== 1);
        if (hint.explicitOne) hPool = hPool.filter(n => n !== 1);
        if (!hPool.length) hPool = [2,3,4];
        const h = pickFrom(hPool);

        let nonzero = Array.from({length:maxDigit}, (_,i) => i + 1);
        let tPool = [...nonzero];
        if (Number.isInteger(hint.tValue)) tPool = [hint.tValue];
        if (hint.tNotOne || hint.explicitOne) tPool = tPool.filter(n => n !== 1);
        if (!tPool.length) tPool = [2];

        let t, o;
        if (category === 'full') {
            t = pickFrom(tPool);
            o = pickFrom(nonzero);
        } else if (category === 'onesZero') {
            t = pickFrom(tPool);
            o = 0;
        } else if (category === 'tensZero') {
            t = 0;
            o = pickFrom(nonzero);
        } else {
            t = 0;
            o = 0;
        }
        return { h, t, o, val:h * 100 + t * 10 + o };
    }

    function generateValuesForCategory(category, hint = {}) {
        Object.assign(prob, buildCategoryCandidate(category, hint, currentTab, true));
    }

    function chooseVisualModeForCategory(category) {
        if (!autoPractice) return Math.random() > 0.5 ? 'ぼう' : '折り紙';
        const c = getCoverageSummary(1, category);
        if (!categoryMastery[1][category]) {
            if (!c.visualStick) return 'ぼう';
            if (!c.visualOrigami) return '折り紙';
        }
        // 定着段階では表現も交互にして、片方だけに偏らないようにする。
        return currentVisualMode === 'ぼう' ? '折り紙' : 'ぼう';
    }

    function persistActiveCourseProblem() {
        if (!currentProblemCourseLocked || currentProblemCompleted || activeReviewItem) return;
        if (!['step','mixed'].includes(currentProblemPhase)) return;
        activeCourseProblem = {
            h:prob.h, t:prob.t, o:prob.o, val:prob.val,
            tab:currentTab,
            category:currentProblemCategory,
            phase:currentProblemPhase,
            visualMode:currentTab === 1 ? currentVisualMode : null
        };
        saveReviewState();
    }

    function generateProblem() {
        activeReviewItem = null;
        isResumingCourseProblem = false;

        // おまかせ中に再読み込みされた未完了問題は、そのまま復元する。
        if (isValidCourseProblem(activeCourseProblem) && Number(activeCourseProblem.tab) === currentTab) {
            prob.h = activeCourseProblem.h;
            prob.t = activeCourseProblem.t;
            prob.o = activeCourseProblem.o;
            prob.val = activeCourseProblem.val;
            currentProblemCategory = activeCourseProblem.category;
            currentProblemPhase = activeCourseProblem.phase;
            currentProblemCourseLocked = true;
            isResumingCourseProblem = true;
            lastProbVal = prob.val;
            return;
        }

        const completed = completedByTab[currentTab] || 0;

        // 復習・転移確認は期限到達後に確定出題。ただし直前と同じ数なら1問はさむ。
        let dueIndex = reviewQueue.findIndex(item =>
            item.tab === currentTab && item.dueAt <= completed && item.val !== lastProbVal
        );
        if (dueIndex < 0 && lastProbVal === null) {
            dueIndex = reviewQueue.findIndex(item => item.tab === currentTab && item.dueAt <= completed);
        }
        if (dueIndex >= 0) {
            const item = reviewQueue.splice(dueIndex, 1)[0];
            prob.h = item.h;
            prob.t = item.t;
            prob.o = item.o;
            prob.val = item.val;
            currentProblemCategory = item.category || getProblemCategory(prob);
            activeReviewItem = {...item, kind:item.kind === 'transfer' ? 'transfer' : 'review'};
            currentProblemPhase = activeReviewItem.kind === 'transfer' ? 'transfer' : 'review';
            currentProblemCourseLocked = autoPractice;
            lastProbVal = prob.val;
            saveReviewState();
            return;
        }

        const pendingValues = new Set(
            reviewQueue.filter(item => item.tab === currentTab).map(item => item.val)
        );
        let targetCategory = null;
        if (autoPractice) {
            const stepTarget = getAutoTargetCategory(currentTab);
            if (stepTarget) {
                currentProblemPhase = 'step';
                targetCategory = stepTarget;
            } else {
                currentProblemPhase = 'mixed';
                targetCategory = getNextMixedCategory(currentTab);
            }
        } else {
            currentProblemPhase = 'free';
        }

        let tries = 0;
        do {
            if (targetCategory) {
                generateValuesForCategory(targetCategory, getGenerationHint(currentTab, targetCategory));
            } else {
                prob.h = Math.floor(Math.random() * 9) + 1;
                // 「空位のれんしゅう」は元仕様を維持：空位問題を増やすモード
                if (!isRandomMode && Math.random() < 0.5) {
                    const zeroPattern = Math.random();
                    if (zeroPattern < 0.4) {
                        prob.t = 0;
                        prob.o = Math.floor(Math.random() * 9) + 1;
                    } else if (zeroPattern < 0.8) {
                        prob.t = Math.floor(Math.random() * 9) + 1;
                        prob.o = 0;
                    } else {
                        prob.t = 0;
                        prob.o = 0;
                    }
                } else {
                    prob.t = Math.floor(Math.random() * 10);
                    prob.o = Math.floor(Math.random() * 10);
                }
                prob.val = prob.h * 100 + prob.t * 10 + prob.o;
            }
            tries++;
        } while ((prob.val === lastProbVal || pendingValues.has(prob.val)) && tries < 60);

        currentProblemCategory = getProblemCategory(prob);
        currentProblemCourseLocked = autoPractice;
        lastProbVal = prob.val;
    }

    function queueReviewProblem(reason = 'error', details = {}) {
        const dueAt = (completedByTab[currentTab] || 0) + (details.dueOffset || 3);
        const inheritedNoTransfer = details.noTransfer === true
            || activeReviewItem?.kind === 'transfer'
            || activeReviewItem?.noTransfer === true;
        const existing = reviewQueue.find(item => item.tab === currentTab && item.val === prob.val && item.kind !== 'transfer');
        if (existing) {
            existing.dueAt = Math.min(existing.dueAt, dueAt);
            existing.reason = reason || existing.reason;
            existing.category = existing.category || currentProblemCategory;
            existing.kind = 'review';
            existing.noTransfer = existing.noTransfer === true || inheritedNoTransfer;
            if (Array.isArray(details.wrongPlaces) && details.wrongPlaces.length) existing.wrongPlaces = [...new Set(details.wrongPlaces)];
            saveReviewState();
            updateLearningStatus();
            return;
        }
        reviewQueue.push({
            h: prob.h,
            t: prob.t,
            o: prob.o,
            val: prob.val,
            tab: currentTab,
            category: currentProblemCategory,
            wrongPlaces: Array.isArray(details.wrongPlaces) ? [...new Set(details.wrongPlaces)] : [],
            visualMode: currentTab === 1 ? currentVisualMode : null,
            reason,
            kind:'review',
            noTransfer:inheritedNoTransfer,
            dueAt
        });
        if (reviewQueue.length > 30) {
            let removeIndex = 0;
            for (let i = 1; i < reviewQueue.length; i++) {
                if (Number(reviewQueue[i].dueAt) > Number(reviewQueue[removeIndex].dueAt)) removeIndex = i;
            }
            reviewQueue.splice(removeIndex, 1);
        }
        saveReviewState();
        updateLearningStatus();
    }

    function makeTransferHint(item) {
        const hint = {};
        if (item.tab === 2) {
            // 600でつまずいたら、まず別の600台で確認する。
            if ([3,6,8].includes(item.h)) hint.hValue = item.h;
            else hint.hundredType = 'regular';
        } else if (item.tab === 3) {
            const category = item.category || getProblemCategory(item);
            if (item.h === 1) hint.hValue = 1;
            else hint.hNotOne = true;
            if (category === 'full' || category === 'onesZero') {
                if (item.t === 1) hint.tValue = 1;
                else hint.tNotOne = true;
            }
        }
        return hint;
    }

    function queueTransferFromReview(item) {
        if (!item || item.kind === 'transfer' || item.noTransfer === true) return;
        const category = item.category || getProblemCategory(item);
        const hint = makeTransferHint(item);
        let candidate = null;
        for (let i = 0; i < 40; i++) {
            const next = buildCategoryCandidate(category, hint, item.tab, false);
            if (next.val !== item.val && !reviewQueue.some(q => q.tab === item.tab && q.val === next.val)) {
                candidate = next;
                break;
            }
        }
        if (!candidate) {
            for (let i = 0; i < 40; i++) {
                const next = buildCategoryCandidate(category, {}, item.tab, false);
                if (next.val !== item.val && !reviewQueue.some(q => q.tab === item.tab && q.val === next.val)) { candidate = next; break; }
            }
        }
        if (!candidate) return;
        const exists = reviewQueue.some(q => q.tab === item.tab && q.kind === 'transfer' && q.sourceVal === item.val);
        if (exists) return;
        reviewQueue.push({
            ...candidate,
            tab:item.tab,
            category,
            wrongPlaces:Array.isArray(item.wrongPlaces) ? [...item.wrongPlaces] : [],
            visualMode:item.tab === 1 ? item.visualMode : null,
            reason:'transfer-check',
            kind:'transfer',
            noTransfer:true,
            sourceVal:item.val,
            dueAt:(completedByTab[item.tab] || 0) + 2
        });
        if (reviewQueue.length > 30) {
            let removeIndex = 0;
            for (let i = 1; i < reviewQueue.length; i++) {
                if (Number(reviewQueue[i].dueAt) > Number(reviewQueue[removeIndex].dueAt)) removeIndex = i;
            }
            reviewQueue.splice(removeIndex, 1);
        }
        saveReviewState();
    }

    function recordCategoryOutcome(outcome, problemKind = 'new') {
        const cat = currentProblemCategory || getProblemCategory(prob);
        const kind = ['new','review','transfer'].includes(problemKind) ? problemKind : 'new';
        const list = categoryHistory[currentTab][cat];
        const entry = {
            outcome,
            kind,
            review:kind !== 'new',
            h:prob.h,
            t:prob.t,
            o:prob.o,
            val:prob.val,
            visualMode: currentTab === 1 ? currentVisualMode : null
        };
        list.push(entry);
        if (list.length > 12) list.splice(0, list.length - 12);

        // 新規問題と転移確認は「理解の証拠」。同じ数の復習は習得判定を水増ししない。
        if (kind === 'new' || kind === 'transfer') {
            updateCategoryCoverage(currentTab, cat, entry);
            recalculateCategoryMastery(currentTab, cat);
        }
    }

    function recordMixedPracticeOutcome(outcome) {
        const list = mixedPracticeHistory[currentTab] || (mixedPracticeHistory[currentTab] = []);
        list.push({category:currentProblemCategory, outcome, val:prob.val});
        if (list.length > 12) list.splice(0, list.length - 12);
    }

    function recordOutcome(outcome) {
        if (currentOutcomeRecorded) return;
        if (!['independent','verified','selfchecked','assisted','practice'].includes(outcome)) return;
        currentOutcomeRecorded = true;

        const reviewItem = activeReviewItem ? {...activeReviewItem} : null;
        const problemKind = reviewItem
            ? (reviewItem.kind === 'transfer' ? 'transfer' : 'review')
            : 'new';

        recordCategoryOutcome(outcome, problemKind);

        // 復習は「自力相当」で解けた時だけ次へ。支援が必要なら同じ復習をもう一度残す。
        if (problemKind === 'review' && reviewItem) {
            if (isCoverageSuccessOutcome(currentTab, outcome)) {
                if (reviewItem.noTransfer !== true) queueTransferFromReview(reviewItem);
            } else {
                queueReviewProblem(reviewItem.reason || 'review-retry', {
                    dueOffset:2,
                    noTransfer:reviewItem.noTransfer === true,
                    wrongPlaces:Array.isArray(reviewItem.wrongPlaces) ? reviewItem.wrongPlaces : []
                });
            }
        }

        // 最近5問とSTEP5の混合履歴は、新しい問題だけで構成する。
        if (problemKind === 'new') {
            const list = recentOutcomes[currentTab] || (recentOutcomes[currentTab] = []);
            list.push(outcome);
            if (list.length > 5) list.splice(0, list.length - 5);
            if (currentProblemPhase === 'mixed') recordMixedPracticeOutcome(outcome);
        }
        saveReviewState();
        updateLearningStatus();
    }

    function hasPendingLearningItems(tab) {
        if (reviewQueue.some(item => item.tab === tab)) return true;
        return Boolean(activeReviewItem && activeReviewItem.tab === tab && !currentProblemCompleted);
    }

    function getCourseCompletionCandidate(tab) {
        if (!allCategoriesStable(tab)) return null;
        const list = (mixedPracticeHistory[tab] || []).slice(-8);
        if (list.length < 8) return null;
        const categories = new Set(list.map(entry => entry.category));
        if (!CATEGORY_ORDER.every(cat => categories.has(cat))) return null;
        const successCount = list.filter(entry => isCoverageSuccessOutcome(tab, entry.outcome)).length;
        if (successCount < 7 || hasPendingLearningItems(tab)) return null;

        if (tab === 2) {
            const recentEvidence = CATEGORY_ORDER.flatMap(cat => getMasteryEntries(tab, cat).slice(-5));
            if (list.some(e => e.outcome === 'selfchecked') || recentEvidence.some(e => e.outcome === 'selfchecked')) return 'selfchecked';
            if (list.some(e => e.outcome === 'verified') || recentEvidence.some(e => e.outcome === 'verified')) return 'verified';
        }
        return 'mastered';
    }

    function refreshCourseCompletion(tab = currentTab) {
        if (courseCompletion[tab]) return false;
        const mode = getCourseCompletionCandidate(tab);
        if (!mode) return false;
        courseCompletion[tab] = mode;
        return true;
    }

    function getCourseCompletionLabel(mode) {
        if (mode === 'selfchecked') return '🎉 コース完了（読みは自己確認）';
        if (mode === 'verified') return '🎉 コース完了（読みは音声確認）';
        return '🎉 3けたマスター！';
    }

    function getReadingHundredStatusHtml(target = false) {
        const c = readingHundredCoverage;
        const mark = ok => ok ? '✓' : '・';
        const stable = readingHundredCoverageMet();
        return `<span class="category-chip ${stable ? 'stable' : 'working'} ${target ? 'target' : ''}">百の読み 300${mark(c.read300)} 600${mark(c.read600)} 800${mark(c.read800)} ほか${mark(c.readRegular)}</span>`;
    }

    function updateLearningStatus() {
        const root = document.getElementById('learning-status');
        if (!root) return;
        const labels = {1:'📷 絵', 2:'🎤 よみ', 3:'✏️ 漢字'};
        root.innerHTML = [1,2,3].map(tab => {
            const list = recentOutcomes[tab] || [];
            const independent = list.filter(x => x === 'independent').length;
            const verified = list.filter(x => x === 'verified').length;
            const selfchecked = list.filter(x => x === 'selfchecked').length;
            const result = list.length
                ? `新しい問題 自力 ${independent}/${list.length}${tab === 2 && verified ? `・音声確認${verified}` : ''}${tab === 2 && selfchecked ? `・自己確認${selfchecked}` : ''}`
                : 'まだ記録なし';

            const pendingItems = reviewQueue.filter(item => item.tab === tab);
            let reviewCount = pendingItems.filter(item => item.kind !== 'transfer').length;
            let transferCount = pendingItems.filter(item => item.kind === 'transfer').length;
            if (activeReviewItem && activeReviewItem.tab === tab && !currentProblemCompleted) {
                if (activeReviewItem.kind === 'transfer') transferCount++;
                else reviewCount++;
            }
            const pendingText = `${reviewCount ? `<span class="review-waiting">・復習${reviewCount}</span>` : ''}${transferCount ? `<span class="review-waiting">・にた問題${transferCount}</span>` : ''}`;
            return `<span class="skill-status-chip ${currentTab === tab ? 'active' : ''}">${labels[tab]}：${result}${pendingText}</span>`;
        }).join('');

        const allStable = allCategoriesStable(currentTab);
        const onlyCategoriesStable = categoriesStableOnly(currentTab);
        const readingSkillPending = currentTab === 2 && onlyCategoriesStable && !readingHundredCoverageMet();
        const stepTarget = autoPractice ? getAutoTargetCategory(currentTab) : null;
        const weakMixed = allStable ? getWeakestCategory(currentTab) : null;
        const categoryRoot = document.getElementById('category-progress');
        if (categoryRoot) {
            let html = CATEGORY_ORDER.map(cat => {
                const state = getCategoryState(currentTab, cat);
                const klass = state.stable ? 'stable' : state.weak ? 'weak' : state.list.length ? 'working' : '';
                const mark = state.stable
                    ? (state.verificationLimited ? (state.selfchecked ? '自己確認○' : '確認○') : '✓')
                    : state.list.length
                        ? `${state.independent}/${state.list.length}${state.verified ? `+確認${state.verified}` : ''}${state.selfchecked ? `+自己${state.selfchecked}` : ''}`
                        : '・';
                const target = autoPractice && !readingSkillPending && ((stepTarget && stepTarget === cat) || (!stepTarget && weakMixed === cat));
                return `<span class="category-chip ${klass} ${target ? 'target' : ''}">${CATEGORY_LABELS[cat]} ${mark}</span>`;
            }).join('');
            if (currentTab === 2) html += getReadingHundredStatusHtml(autoPractice && readingSkillPending);
            categoryRoot.innerHTML = html;
        }

        const stepLabel = document.getElementById('auto-step-label');
        if (stepLabel) {
            if (courseCompletion[currentTab]) {
                stepLabel.innerText = getCourseCompletionLabel(courseCompletion[currentTab]);
            } else if (!autoPractice) {
                stepLabel.innerText = '自由練習';
            } else if (readingSkillPending) {
                stepLabel.innerText = 'よみのポイント：300・600・800の読みをたしかめよう';
            } else if (allStable) {
                const done = Math.min(8, (mixedPracticeHistory[currentTab] || []).slice(-8).length);
                stepLabel.innerText = weakMixed
                    ? `STEP 5：4しゅるいをまぜて定着 ${done}/8（${CATEGORY_LABELS[weakMixed]}を少し多め）`
                    : `STEP 5：4しゅるいをまぜて定着 ${done}/8`;
            } else {
                stepLabel.innerText = CATEGORY_STEP_LABELS[stepTarget];
            }
        }
    }

    function getReviewPrefix(item) {
        if (!item) return '';
        if (item.reason === 'answer-error') {
            const places = Array.isArray(item.wrongPlaces) ? item.wrongPlaces : [];
            if (places.length === 1) return `🔁 前は${placeNames[places[0]]}で迷った問題　`;
            if (item.category === 'tensZero') return '🔁 十のくらいの0をもう一度　';
            if (item.category === 'onesZero') return '🔁 一のくらいの0をもう一度　';
            if (item.category === 'bothZero') return '🔁 100の倍数をもう一度　';
            return '🔁 まえにまちがえた問題　';
        }
        if (item.reason === 'reading-numeric') return '🔁 よみ方をたしかめよう　';
        if (item.reason === 'reading-recognition' || item.reason === 'reading-fallback' || item.reason === 'reading-selfcheck') return '🔁 よみをもう一度　';
        if (item.reason === 'transfer-check') return '🔄 にた問題でたしかめよう　';
        return '🔁 ふくしゅう　';
    }

    function markProblemComplete() {
        if (currentProblemCompleted) return;
        currentProblemCompleted = true;
        completedByTab[currentTab] = (completedByTab[currentTab] || 0) + 1;
        activeReviewItem = null;
        activeCourseProblem = null;
        currentProblemCourseLocked = false;
        refreshCourseCompletion(currentTab);
        saveReviewState();
        updateAutoPracticeUI();
        updateLearningStatus();
    }

    function supportsSpeechRecognition() {
        return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
    }

    function placePrimaryActionButton() {
        const action = document.getElementById('action-btn');
        const slot = document.getElementById('reading-action-slot');
        const home = document.getElementById('action-btn-home');
        if (!action || !slot || !home) return;
        if (currentTab === 2) {
            if (action.parentElement !== slot) slot.appendChild(action);
            slot.style.display = 'flex';
            action.classList.add('reading-mic-action');
        } else {
            if (action.parentElement !== home) home.appendChild(action);
            slot.style.display = 'none';
            action.classList.remove('reading-mic-action');
        }
    }

    function initProblem() {
        restoreActiveReviewIfAbandoned();
        stopActiveRecognition();
        cancelSpeech();
        user = { h: null, t: null, o: null };
        hintLevel = 0;
        hintUsed = false;
        attemptCount = 0;
        feedbackActive = false;
        lastEvaluatedWrongPlaces = [];
        currentProblemCompleted = false;
        currentOutcomeRecorded = false;
        readingAttempts = 0;
        numericRecognitionCount = 0;
        noSpeechCount = 0;
        readingHadDifficulty = false;
        recognitionFallback = false;
        currentProblemCourseLocked = false;
        clearPlaceFeedback();

        const area = document.getElementById('explanation-area');
        area.style.display = 'block';
        area.innerHTML = '';
        area.style.fontSize = '15px';
        area.style.lineHeight = '1.38';
        const centerStage = document.querySelector('.center-stage');
        if (centerStage) centerStage.classList.toggle('reading-mode', currentTab === 2);
        placePrimaryActionButton();
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('action-btn').style.display = 'inline-block';
        document.getElementById('action-btn').disabled = false;
        document.getElementById('hint-btn').style.display = (currentTab === 3) ? 'inline-block' : 'none';
        document.getElementById('hint-btn').innerText = 'ヒント';

        generateProblem();
        currentProblemCourseLocked = currentProblemCourseLocked || autoPractice;
        updateAutoPracticeUI();

        const ins = document.getElementById('instruction');
        const visual = document.getElementById('visual-area');
        const inputSec = document.getElementById('input-section');
        const sideInputTools = document.getElementById('side-input-tools');
        const reviewPrefix = getReviewPrefix(activeReviewItem);
        updateLearningStatus();

        if (currentTab === 1) {
            currentVisualMode = activeReviewItem?.visualMode
                || (isResumingCourseProblem ? activeCourseProblem?.visualMode : null)
                || chooseVisualModeForCategory(currentProblemCategory);
            ins.innerText = `${reviewPrefix}えが あらわしている 数を 数字で 書きましょう。`;
            visual.innerHTML = renderPerfectResponsiveSVG(currentVisualMode);
            inputSec.style.display = 'block';
            if (sideInputTools) sideInputTools.style.display = 'block';
            document.getElementById('action-btn').innerText = 'こたえあわせ';
        } else if (currentTab === 2) {
            ins.innerText = supportsSpeechRecognition()
                ? `${reviewPrefix}下の 数を 声に出して 読みましょう。マイクのボタンを押してから読んでね。`
                : `${reviewPrefix}下の 数を 読みましょう。音声認識が使えないので、あとで答えを確かめます。`;
            visual.innerHTML = `<div style="font-size:65px; font-weight:bold; letter-spacing:2px;">${prob.val}</div>`;
            inputSec.style.display = 'none';
            if (sideInputTools) sideInputTools.style.display = 'none';
            document.getElementById('action-btn').innerText = supportsSpeechRecognition() ? '🎤 よんでみる' : 'こたえをみる';
        } else {
            ins.innerText = `${reviewPrefix}数字で 書きましょう。`;
            visual.innerHTML = renderKanji(0);
            inputSec.style.display = 'block';
            if (sideInputTools) sideInputTools.style.display = 'block';
            document.getElementById('action-btn').innerText = 'こたえあわせ';
        }
        persistActiveCourseProblem();
        selectPlace('h', false);
        updateInputDisplay();
        fitCenterFrames();
    }

    function renderKanji(level = 0) {
        const hKanji = kanjiH[prob.h];
        const hRead = readH[prob.h];
        const tKanji = prob.t === 0 ? '' : (prob.t === 1 ? '十' : kanjiT[prob.t]);
        const tRead = prob.t === 0 ? '' : readT[prob.t];
        const oKanji = prob.o === 0 ? '' : kanjiO[prob.o];
        const oRead = prob.o === 0 ? '' : readO[prob.o];

        if (level === 0) {
            return `<div style="font-size:48px; font-weight:bold; letter-spacing:2px; line-height:1.7; text-align:center;">${hKanji}${tKanji}${oKanji}</div>`;
        }
        if (level === 1) {
            return `<div style="font-size:45px; font-weight:bold; letter-spacing:2px; line-height:1.8; text-align:center;">
                <ruby>${hKanji}<rt>${hRead}</rt></ruby>${tKanji ? `<ruby>${tKanji}<rt>${tRead}</rt></ruby>` : ''}${oKanji ? `<ruby>${oKanji}<rt>${oRead}</rt></ruby>` : ''}
            </div>`;
        }
        return `<div class="hint-text">
            <span class="hint-box hint-h"><span class="hint-stage-label">百のくらい</span><ruby>${hKanji}<rt>${hRead}</rt></ruby></span>
            <span class="hint-box hint-t"><span class="hint-stage-label">十のくらい</span>${tKanji ? `<ruby>${tKanji}<rt>${tRead}</rt></ruby>` : '<span class="hint-empty">なし → 0</span>'}</span>
            <span class="hint-box hint-o"><span class="hint-stage-label">一のくらい</span>${oKanji ? `<ruby>${oKanji}<rt>${oRead}</rt></ruby>` : '<span class="hint-empty">なし → 0</span>'}</span>
        </div>`;
    }

    function selectPlace(place, focus = true) {
        selectedPlace = place;
        document.querySelectorAll('.pv-col').forEach(col => {
            col.classList.toggle('selected-place', col.dataset.place === place);
        });
        if (focus) {
            const col = document.querySelector(`.pv-col[data-place="${place}"]`);
            if (col) col.focus({preventScroll:true});
        }
    }

    function nextPlace(place) {
        const places = ['h','t','o'];
        const idx = places.indexOf(place);
        return places[Math.min(2, idx + 1)];
    }

    function prevPlace(place) {
        const places = ['h','t','o'];
        const idx = places.indexOf(place);
        return places[Math.max(0, idx - 1)];
    }

    function showHundredsZeroPrompt() {
        const area = document.getElementById('explanation-area');
        area.style.display = 'block';
        area.className = 'explanation normal-exp';
        area.innerHTML = '<strong>百のくらいは 1〜9 だよ。</strong><div class="retry-note">3けたの数なので、百のくらいに0は入りません。</div>';
        selectPlace('h', false);
    }

    function adjustDigit(place, delta) {
        playSound('click');
        const min = place === 'h' ? 1 : 0;
        const current = user[place];
        if (current === null) {
            user[place] = delta > 0 ? 1 : min;
        } else {
            user[place] = Math.max(min, Math.min(9, current + delta));
        }
        updateInputDisplay();
        syncFeedbackAfterEdit(place);
    }

    function setDigit(place, digit, autoAdvance = false) {
        if (place === 'h' && Number(digit) === 0) {
            showHundredsZeroPrompt();
            return false;
        }
        user[place] = Math.max(place === 'h' ? 1 : 0, Math.min(9, digit));
        updateInputDisplay();
        syncFeedbackAfterEdit(place);
        if (autoAdvance && place !== 'o') {
            selectPlace(nextPlace(place));
        } else if (autoAdvance && ['h','t','o'].every(p => user[p] !== null)) {
            document.getElementById('action-btn').focus({preventScroll:true});
        }
        return true;
    }

    function inputDigit(digit) {
        playSound('click');
        setDigit(selectedPlace, digit, true);
    }

    function clearSelectedDigit() {
        playSound('click');
        const place = selectedPlace;
        user[place] = null;
        updateInputDisplay();
        syncFeedbackAfterEdit(place);
    }

    function updateInputDisplay() {
        ['h','t','o'].forEach(place => {
            document.getElementById(`disp-${place}`).innerText = user[place] === null ? '―' : user[place];
        });
        const complete = ['h','t','o'].every(place => user[place] !== null);
        const preview = ['h','t','o'].map(place => user[place] === null ? '―' : user[place]).join('');
        document.getElementById('current-number').innerText = `いまの入力：${preview}`;
        if (currentTab !== 2) {
            document.getElementById('action-btn').disabled = !complete;
        }
    }

    function clearPlaceFeedback() {
        document.querySelectorAll('.pv-col').forEach(col => {
            col.classList.remove('place-error', 'place-missing', 'place-correct');
        });
    }

    function getMissingPlaces() {
        return ['h','t','o'].filter(place => user[place] === null);
    }

    function getWrongPlaces() {
        return ['h','t','o'].filter(place => user[place] !== null && user[place] !== prob[place]);
    }

    function applyEvaluationFeedback(wrongPlaces) {
        clearPlaceFeedback();
        ['h','t','o'].forEach(place => {
            const col = document.querySelector(`.pv-col[data-place="${place}"]`);
            if (!col) return;
            col.classList.add(wrongPlaces.includes(place) ? 'place-error' : 'place-correct');
        });
    }

    function syncFeedbackAfterEdit(place) {
        if (!feedbackActive) return;
        const col = document.querySelector(`.pv-col[data-place="${place}"]`);
        if (col) {
            col.classList.remove('place-correct', 'place-missing', 'place-error');
            if (lastEvaluatedWrongPlaces.includes(place)) col.classList.add('place-error');
        }
        const area = document.getElementById('explanation-area');
        const chips = lastEvaluatedWrongPlaces.map(p => `<span class="wrong-place-chip ${placeClasses[p]}">${placeNames[p]}</span>`).join('');
        area.className = 'explanation incorrect';
        area.innerHTML = `<strong style="font-size:20px;">なおしているところ</strong><div class="retry-note">数字を直したら、「もういちど こたえあわせ」を押して確かめよう。赤いわくは、前回まちがっていた位です。</div>${chips ? `<div class="wrong-place-list">${chips}</div>` : ''}`;
    }

    function showIncompletePrompt() {
        const missingPlaces = getMissingPlaces();
        clearPlaceFeedback();
        missingPlaces.forEach(place => {
            const col = document.querySelector(`.pv-col[data-place="${place}"]`);
            if (col) col.classList.add('place-missing');
        });
        const area = document.getElementById('explanation-area');
        area.style.display = 'block';
        area.className = 'explanation normal-exp';
        area.innerHTML = '<strong>まだ入力していない位があります。</strong><div class="retry-note">百・十・一の3つを全部入れてから、こたえあわせをしよう。0の位も0を入れます。</div>';
        selectPlace(missingPlaces[0] || 'h', false);
        scrollFeedbackIntoView();
    }

    function scrollFeedbackIntoView() {
        const area = document.getElementById('explanation-area');
        fitCenterFrames();
        if (window.innerWidth <= 820) {
            requestAnimationFrame(() => area.scrollIntoView({behavior:'smooth', block:'nearest'}));
        }
    }

    function toggleHint() {
        playSound('click');
        hintUsed = true;
        if (hintLevel < 2) {
            hintLevel++;
        } else {
            hintLevel = 0;
        }
        document.getElementById('visual-area').innerHTML = renderKanji(hintLevel);
        fitCenterFrames();
        const btn = document.getElementById('hint-btn');
        btn.innerText = hintLevel === 0 ? 'ヒント' : (hintLevel === 1 ? 'もう1つヒント' : 'ヒントをかくす');
    }

    function processAction() {
        if (currentTab === 2) {
            const area = document.getElementById('explanation-area');
            if (recognitionFallback || !supportsSpeechRecognition()) showReadingExp(area, {mode:'fallback', autoSpeak:true});
            else startReadingRecognition();
            return;
        }
        if (getMissingPlaces().length) {
            showIncompletePrompt();
            return;
        }
        checkAnswer(document.getElementById('explanation-area'));
    }

    function renderRetryFeedback(area, wrongPlaces, includeHeading = true) {
        const chips = wrongPlaces.map(place => `<span class="wrong-place-chip ${placeClasses[place]}">${placeNames[place]}</span>`).join('');
        let guidance = '';

        if (attemptCount <= 1) {
            guidance = '<div class="retry-note">赤いわくのくらいを、もういちど見てみよう。答えはまだ出さないよ。</div>';
        } else if (attemptCount === 2) {
            const details = wrongPlaces.map(place => {
                const unit = place === 'h' ? '100のまとまり' : place === 't' ? '10のまとまり' : (currentVisualMode === '折り紙' ? '1まい' : '1のばら');
                return `<div>・${placeNames[place]}：前の答えでは <strong>${user[place]}</strong>。${unit}をもういちど確かめよう。</div>`;
            }).join('');
            guidance = `<div class="retry-note">まちがっている位だけ、もう一度確かめよう。</div><div class="support-detail">${details}</div>`;
        } else if (attemptCount === 3) {
            const details = wrongPlaces.map(place => {
                if (currentTab === 3) {
                    const part = place === 'h' ? kanjiH[prob.h] : place === 't' ? (prob.t === 0 ? '十をあらわす言葉はない' : (prob.t === 1 ? '十' : kanjiT[prob.t])) : (prob.o === 0 ? '一をあらわす言葉はない' : kanjiO[prob.o]);
                    return `<div>・${placeNames[place]}に関係するところは「<strong>${part}</strong>」。ここに注目しよう。</div>`;
                }
                const unit = place === 'h' ? '100' : place === 't' ? '10' : '1';
                return `<div>・${placeNames[place]}：絵の「${unit}」のまとまりだけに注目して数えよう。</div>`;
            }).join('');
            guidance = `<div class="retry-note">見る場所をしぼります。</div><div class="support-detail">${details}</div>`;
        } else {
            const details = wrongPlaces.map(place => `<div>・${placeNames[place]}は <span class="support-answer ${placeClasses[place]}">${prob[place]}</span></div>`).join('');
            guidance = `<div class="retry-note">ここまで考えたので、正しい数字を見て自分で入れ直そう。</div><div class="support-detail">${details}</div>`;
        }

        area.className = 'explanation incorrect';
        area.innerHTML = `${includeHeading ? '<strong style="font-size:20px;">もういちど かんがえよう</strong>' : '<strong style="font-size:20px;">なおしているところ</strong>'}${guidance}${chips ? `<div class="wrong-place-list">${chips}</div>` : ''}`;
    }

    function checkAnswer(area) {
        if (getMissingPlaces().length) {
            showIncompletePrompt();
            return;
        }

        attemptCount++;
        const wrongPlaces = getWrongPlaces();
        const isCorrect = wrongPlaces.length === 0;
        area.style.display = 'block';
        feedbackActive = !isCorrect;
        lastEvaluatedWrongPlaces = [...wrongPlaces];
        applyEvaluationFeedback(wrongPlaces);

        if (!isCorrect) {
            playSound('incorrect');
            if (attemptCount === 1) queueReviewProblem('answer-error', {wrongPlaces});
            renderRetryFeedback(area, wrongPlaces);
            document.getElementById('action-btn').style.display = 'inline-block';
            document.getElementById('action-btn').innerText = 'もういちど こたえあわせ';
            document.getElementById('next-btn').style.display = 'none';
            if (currentTab === 3) document.getElementById('hint-btn').style.display = 'inline-block';
            selectPlace(wrongPlaces[0], false);
            scrollFeedbackIntoView();
            return;
        }

        playSound('correct');
        feedbackActive = false;
        lastEvaluatedWrongPlaces = [];
        clearPlaceFeedback();
        const independentAnswer = attemptCount === 1 && !hintUsed;
        const earnedStar = independentAnswer && !activeReviewItem;
        recordOutcome(independentAnswer ? 'independent' : 'assisted');
        markProblemComplete();
        if (earnedStar) {
            stars++;
            localStorage.setItem(STORAGE_KEYS.stars, String(stars));
            updateStarDisplay();
        }
        area.className = 'explanation correct';
        area.innerHTML = buildFullExplanation(earnedStar)
            + `<button class="btn-replay btn-explanation-replay" onclick="speakExplanation()" ${isSpeechOn ? '' : 'disabled'}>${isSpeechOn ? '🔊 解説をきく' : '🔇 よみあげOFF'}</button>`;
        fitCenterFrames();
        if (isSpeechOn) setTimeout(() => speakExplanation(), 520);
        document.getElementById('action-btn').style.display = 'none';
        document.getElementById('hint-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('next-btn').focus({preventScroll:true});
        scrollFeedbackIntoView();
    }

    function buildFullExplanation(earnedStar) {
        let title;
        if (earnedStar) title = '⭕ せいかい！ ★を 1つ ゲットしたよ！';
        else if (attemptCount > 1) title = '⭕ なおせたね！ せいかい！';
        else title = '⭕ せいかい！';

        let html = `<strong style="font-size:20px;">${title}</strong><br><hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">`;
        if (!earnedStar && (attemptCount > 1 || hintUsed)) {
            html += `<span class="exp-part">今回は ${attemptCount > 1 ? 'なおして正解' : 'ヒントを使って正解'}。★は、最初の1回でヒントなし正解のときにもらえるよ。</span>`;
        }

        if (currentTab === 3) {
            html += `<span class="exp-part">・<span class="val-h">${kanjiH[prob.h]}（${readH[prob.h]}）</span>は100が <span class="val-h">${prob.h}つ</span>。百のくらいは <span class="val-h">${prob.h}</span>。</span>`;
            if (prob.t > 0) {
                const tName = prob.t === 1 ? '十' : kanjiT[prob.t];
                html += `<span class="exp-part">・<span class="val-t">${tName}（${readT[prob.t]}）</span>は10が <span class="val-t">${prob.t}つ</span>。十のくらいは <span class="val-t">${prob.t}</span>。</span>`;
            } else {
                html += `<span class="exp-part">・十をあらわす言葉がないので、十のくらいには <span class="val-t">0</span> を書くよ。0が入ることで、百と一の位置がずれないね。</span>`;
            }
            if (prob.o > 0) {
                html += `<span class="exp-part">・<span class="val-o">${kanjiO[prob.o]}（${readO[prob.o]}）</span>は1が <span class="val-o">${prob.o}つ</span>。一のくらいは <span class="val-o">${prob.o}</span>。</span>`;
            } else {
                html += `<span class="exp-part">・一をあらわす言葉がないので、一のくらいには <span class="val-o">0</span> を書くよ。</span>`;
            }
        } else {
            const hUnit = currentVisualMode === '折り紙' ? '100のまとまり' : '100のたば（束）';
            const tUnit = currentVisualMode === '折り紙' ? '10のまとまり' : '10のたば（束）';
            const oUnit = currentVisualMode === '折り紙' ? '1まい' : '1のばら';
            html += `<span class="exp-part">・${hUnit}が <span class="val-h">${prob.h}つ</span> あるから、百のくらいは <span class="val-h">${prob.h}</span>。</span>`;
            html += prob.t > 0
                ? `<span class="exp-part">・${tUnit}が <span class="val-t">${prob.t}つ</span> あるから、十のくらいは <span class="val-t">${prob.t}</span>。</span>`
                : `<span class="exp-part">・${tUnit}がないので、十のくらいは <span class="val-t">0</span>。</span>`;
            html += prob.o > 0
                ? `<span class="exp-part">・${oUnit}が <span class="val-o">${prob.o}つ</span> あるから、一のくらいは <span class="val-o">${prob.o}</span>。</span>`
                : `<span class="exp-part">・${oUnit}がないので、一のくらいは <span class="val-o">0</span>。</span>`;
        }
        html += `<br><strong style="font-size:20px;">だから、こたえは 「<span style="color:#d35400;">${prob.val}</span>」 だね！</strong>`;
        return html;
    }

    function getFullKanji() {
        return kanjiH[prob.h] + (prob.t === 0 ? '' : (prob.t === 1 ? '十' : kanjiT[prob.t])) + (prob.o === 0 ? '' : kanjiO[prob.o]);
    }

    function getFullReading() {
        return (readH[prob.h] || '') + (readT[prob.t] || '') + (readO[prob.o] || '');
    }

    function normalizeRecognitionText(text) {
        return String(text || '')
            .normalize('NFKC')
            .toLowerCase()
            .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
            .replace(/[\s、。,.，．!！?？・「」『』（）()\-ー]/g, '')
            .replace(/です$/g, '');
    }

    function japaneseDigitValue(ch) {
        const map = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
        if (/^[1-9]$/.test(ch)) return Number(ch);
        return Object.prototype.hasOwnProperty.call(map, ch) ? map[ch] : null;
    }

    function parseJapaneseMixedNumber(text) {
        const s = normalizeRecognitionText(text);
        if (!s) return null;

        // 純粋な数字表記は100〜999の3桁だけ許可する。
        if (/^[1-9][0-9]{2}$/.test(s)) return Number(s);

        // 単位を含む表記は日本語の3桁数として成立する形だけ許可する。
        const digit = '[1-9一二三四五六七八九]';
        const hundreds = s.match(new RegExp(`^(${digit}?)百(.*)$`));
        if (!hundreds) return null;
        const h = hundreds[1] === '' ? 1 : japaneseDigitValue(hundreds[1]);
        if (h === null) return null;
        const rest = hundreds[2];
        if (rest === '') return h * 100;

        const tensAndOnes = rest.match(new RegExp(`^(${digit}?)十(${digit}?)$`));
        if (tensAndOnes) {
            const t = tensAndOnes[1] === '' ? 1 : japaneseDigitValue(tensAndOnes[1]);
            const o = tensAndOnes[2] === '' ? 0 : japaneseDigitValue(tensAndOnes[2]);
            if (t === null || o === null) return null;
            return h * 100 + t * 10 + o;
        }

        const onesOnly = rest.match(new RegExp(`^(${digit})$`));
        if (onesOnly) {
            const o = japaneseDigitValue(onesOnly[1]);
            return o === null ? null : h * 100 + o;
        }
        return null;
    }

    function classifyRecognitionCandidate(text) {
        const norm = normalizeRecognitionText(text);
        if (!norm) return 'none';
        const canonicalReading = normalizeRecognitionText(getFullReading());
        const canonicalKanji = normalizeRecognitionText(getFullKanji());
        if (norm === canonicalReading || norm === canonicalKanji) return 'strong';

        const parsed = parseJapaneseMixedNumber(norm);
        if (parsed !== prob.val) return 'none';
        if (/^[1-9][0-9]{2}$/.test(norm)) return 'numeric';
        if (/[百十]/.test(norm)) return 'strong';
        return 'none';
    }

    function recognizedMatchesProblem(text) {
        return classifyRecognitionCandidate(text) !== 'none';
    }

    function escapeHtml(text) {
        return String(text || '').replace(/[&<>"']/g, ch => ({
            '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
        }[ch]));
    }

    function setRecognitionMessage(html, className = '') {
        const area = document.getElementById('explanation-area');
        area.style.display = 'block';
        area.className = `explanation normal-exp ${className}`.trim();
        area.innerHTML = html;
        scrollFeedbackIntoView();
    }

    function handleNoSpeechAttempt(message) {
        noSpeechCount++;
        readingHadDifficulty = true;
        const action = document.getElementById('action-btn');
        action.disabled = false;
        if (noSpeechCount >= 3) {
            recognitionFallback = true;
            action.innerText = 'こたえをみる';
            setRecognitionMessage(`<strong>${message}</strong><div class="mic-note">3回うまく声を拾えなかったので、マイク判定はいったんやめます。児童の誤答にはしません。答えを確かめよう。</div>`);
        } else {
            action.innerText = '🎤 もういちど';
            setRecognitionMessage(`<strong>${message}</strong><div class="mic-note">マイクに少し近づいて、もう一度読んでみよう。（${noSpeechCount}/3）</div>`);
        }
    }

    function enterReadingRecognitionFallback(heard, message, queueReview = true) {
        readingHadDifficulty = true;
        if (queueReview) queueReviewProblem('reading-recognition');
        recognitionFallback = true;
        const action = document.getElementById('action-btn');
        action.disabled = false;
        action.innerText = 'こたえをみる';
        setRecognitionMessage(`<strong>${message}</strong>${heard ? `<div>「<span class="heard-text">${escapeHtml(heard)}</span>」と聞こえました。</div>` : ''}<div class="mic-note">機械の聞き違いもあるので、ここでは不正解とは決めません。答えを確かめて、あとで同じ数をもう一度出します。</div>`);
    }

    function startReadingRecognition() {
        if (isListening || currentProblemCompleted) return;
        if (!supportsSpeechRecognition()) {
            recognitionFallback = true;
            document.getElementById('action-btn').innerText = 'こたえをみる';
            setRecognitionMessage('<strong>このブラウザでは音声認識が使えません。</strong><div class="mic-note">声に出して読んでから、答えを確かめよう。</div>');
            return;
        }

        stopActiveRecognition();
        cancelSpeech();
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SR();
        activeRecognition = recognition;
        recognition.lang = 'ja-JP';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 5;

        const recognitionTab = currentTab;
        const recognitionVal = prob.val;
        let handled = false;
        isListening = true;
        const action = document.getElementById('action-btn');
        action.disabled = true;
        action.innerText = '🎤 きいています…';
        setRecognitionMessage('<strong>🎤 きいています…</strong><div class="mic-note">「さんびゃくご」のように、数の読み方で1回読んでね。数字を1つずつ読まないようにしよう。</div><button type="button" class="btn-mic-cancel" onclick="cancelReadingRecognition()">マイクをやめる</button>', 'recognition-listening');

        const stale = () => currentTab !== recognitionTab || prob.val !== recognitionVal || currentProblemCompleted;

        recognition.onresult = (event) => {
            clearRecognitionTimer();
            if (stale()) return;
            handled = true;
            const candidates = [];
            for (let r = event.resultIndex; r < event.results.length; r++) {
                const result = event.results[r];
                for (let i = 0; i < result.length; i++) {
                    candidates.push({ transcript: result[i].transcript, confidence: result[i].confidence });
                }
            }
            handleReadingRecognitionResult(candidates);
        };

        recognition.onerror = (event) => {
            clearRecognitionTimer();
            if (stale()) return;
            handled = true;
            handleReadingRecognitionError(event.error);
        };

        recognition.onend = () => {
            clearRecognitionTimer();
            isListening = false;
            if (activeRecognition === recognition) activeRecognition = null;
            if (recognition.__cancelledByUser) return;
            if (stale()) return;
            if (!handled) handleNoSpeechAttempt('声をうまく聞き取れませんでした。');
        };

        try {
            recognition.start();
            recognitionTimer = setTimeout(() => {
                if (stale() || handled || !isListening) return;
                handled = true;
                try { recognition.abort(); } catch (e) {}
                isListening = false;
                if (activeRecognition === recognition) activeRecognition = null;
                handleNoSpeechAttempt('時間内に声を聞き取れませんでした。');
            }, 10000);
        } catch (e) {
            clearRecognitionTimer();
            isListening = false;
            activeRecognition = null;
            recognitionFallback = true;
            action.disabled = false;
            action.innerText = 'こたえをみる';
            setRecognitionMessage('<strong>マイクを開始できませんでした。</strong><div class="mic-note">声に出して読んでから、答えを確かめよう。</div>');
        }
    }

    function handleReadingRecognitionResult(candidates) {
        if (currentProblemCompleted) return;
        const action = document.getElementById('action-btn');
        action.disabled = false;
        const ranked = candidates
            .map(c => ({ transcript: String(c.transcript || '').trim(), confidence: Number(c.confidence) || 0 }))
            .filter(c => c.transcript);
        const heard = ranked[0]?.transcript || '';
        const topType = heard ? classifyRecognitionCandidate(heard) : 'none';
        const lowerMatch = ranked.slice(1).find(c => classifyRecognitionCandidate(c.transcript) !== 'none');

        if (topType === 'strong') {
            const independentReading = !readingHadDifficulty && readingAttempts === 0 && noSpeechCount === 0 && numericRecognitionCount === 0;
            numericRecognitionCount = 0;
            playSound('correct');
            showReadingExp(document.getElementById('explanation-area'), {mode:'recognized', heard, autoSpeak:false, independent:independentReading});
            return;
        }

        if (topType === 'numeric') {
            readingHadDifficulty = true;
            readingAttempts++;
            numericRecognitionCount++;
            if (numericRecognitionCount >= 2) {
                queueReviewProblem('reading-numeric');
                showReadingExp(document.getElementById('explanation-area'), {mode:'numeric', heard, autoSpeak:true});
                return;
            }
            action.innerText = '🎤 もういちど';
            setRecognitionMessage(`<strong>数としては「${escapeHtml(heard)}」と聞き取れました。</strong><div class="mic-note">音声認識では「3・0・5」のような桁読みとの区別ができないことがあります。もう1回だけ、「さんびゃくご」のような数の読み方で読んでみよう。</div>`);
            return;
        }

        numericRecognitionCount = 0;
        readingHadDifficulty = true;
        readingAttempts++;
        if (readingAttempts >= 3) {
            enterReadingRecognitionFallback(heard, '3回ためしました。', true);
            return;
        }

        action.innerText = '🎤 もういちど';
        if (lowerMatch) {
            setRecognitionMessage(`<strong>聞き取りが少しあいまいでした。</strong><div>いちばん強い候補では「<span class="heard-text">${escapeHtml(heard)}</span>」と聞こえました。</div><div class="mic-note">別の候補には正しい数もありました。機械側が迷っているので、もう一度だけはっきり読んでみよう。（${readingAttempts}/3）</div>`);
        } else {
            setRecognitionMessage(`<strong>もう一度 読んでみよう。</strong><div>「<span class="heard-text">${escapeHtml(heard || '聞き取れませんでした')}</span>」と聞こえたよ。</div><div class="mic-note">機械が聞き違えることもあります。数の読み方で、はっきり読んでみよう。（${readingAttempts}/3）</div>`);
        }
    }

    function handleReadingRecognitionError(error) {
        const action = document.getElementById('action-btn');
        isListening = false;
        action.disabled = false;

        if (error === 'aborted') return;
        if (error === 'no-speech') {
            handleNoSpeechAttempt('声を聞き取れませんでした。');
            return;
        }

        recognitionFallback = true;
        action.innerText = 'こたえをみる';
        const messages = {
            'not-allowed':'マイクの使用が許可されていません。',
            'service-not-allowed':'この環境では音声認識サービスを利用できません。',
            'audio-capture':'マイクを利用できません。',
            'network':'音声認識サービスにつながりませんでした。',
            'language-not-supported':'日本語の音声認識を利用できません。'
        };
        const msg = messages[error] || '音声認識を利用できませんでした。';
        setRecognitionMessage(`<strong>${msg}</strong><div class="mic-note">児童の誤答とは扱いません。声に出して読んでから、答えを確かめよう。</div>`);
    }

    function showReadingExp(area, options = {}) {
        stopActiveRecognition();
        const readingIndependent = options.mode === 'recognized' && options.independent === true;
        const wasReview = Boolean(activeReviewItem);
        const earnedReadingStar = readingIndependent && !wasReview;

        // 音声認識が使えない場合は、答えを見せたあとに自己確認してから記録する。
        if (options.mode === 'fallback') {
            area.style.display = 'block';
            area.className = 'explanation normal-exp';
            const fullRead = getFullReading();
            const hText = `<span class="val-h">百のくらいが ${prob.h} なので、「${readH[prob.h]}」</span>`;
            const tText = prob.t === 0 ? `<span class="val-t">十のくらいが 0 なので、読みません。</span>` : `<span class="val-t">十のくらいが ${prob.t} なので、「${readT[prob.t]}」</span>`;
            const oText = prob.o === 0 ? `<span class="val-o">一のくらいが 0 なので、読みません。</span>` : `<span class="val-o">一のくらいが ${prob.o} なので、「${readO[prob.o]}」</span>`;
            area.innerHTML = `
                <strong style="font-size:20px;">読み方のこたえ</strong><br><hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">
                ・${hText}<br>・${tText}<br>・${oText}<br><br>
                <strong>『 <span style="color:#2c3e50; font-size:22px;">${fullRead}</span> 』と読みます。</strong><br>
                <button class="btn-replay" onclick="speakCurrentReading()" ${isSpeechOn ? '' : 'disabled'}>${isSpeechOn ? '🔊 もういちど きく' : '🔇 よみあげOFF'}</button>
                <div id="reading-selfcheck" class="reading-selfcheck">
                    <span class="selfcheck-status">答えを見る前に、この読み方で言えていた？</span>
                    <button type="button" class="btn-selfcheck" onclick="completeReadingSelfCheck(true)">○ この読み方で言えた</button>
                    <button type="button" class="btn-selfcheck" onclick="completeReadingSelfCheck(false)">△ あとでもう一度</button>
                </div>`;
            document.getElementById('action-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            scrollFeedbackIntoView();
            if (options.autoSpeak && isSpeechOn) setTimeout(() => speakText(fullRead), 180);
            return;
        }

        if (options.mode === 'recognized') recordOutcome(readingIndependent ? 'independent' : 'assisted');
        else if (options.mode === 'numeric') recordOutcome('verified');
        else recordOutcome('practice');
        markProblemComplete();
        if (earnedReadingStar) {
            stars++;
            localStorage.setItem(STORAGE_KEYS.stars, String(stars));
            updateStarDisplay();
        }
        area.style.display = 'block';
        const strongSuccess = options.mode === 'recognized';
        area.className = strongSuccess ? 'explanation correct recognition-success' : 'explanation normal-exp';
        const hText = `<span class="val-h">百のくらいが ${prob.h} なので、「${readH[prob.h]}」</span>`;
        const tText = prob.t === 0 ? `<span class="val-t">十のくらいが 0 なので、読みません。</span>` : `<span class="val-t">十のくらいが ${prob.t} なので、「${readT[prob.t]}」</span>`;
        const oText = prob.o === 0 ? `<span class="val-o">一のくらいが 0 なので、読みません。</span>` : `<span class="val-o">一のくらいが ${prob.o} なので、「${readO[prob.o]}」</span>`;
        const fullRead = getFullReading();

        let heardHtml = '';
        if (options.mode === 'recognized' && options.heard) {
            const rewardText = earnedReadingStar ? ' ★を1つゲット！' : readingIndependent && wasReview ? ' 復習でも自力で読めたね。' : ' もう一度挑戦して読めたね。';
            heardHtml = `<div class="recognition-status recognition-success">○ 読み方として「<span class="heard-text">${escapeHtml(options.heard)}</span>」と聞き取れたよ。${rewardText}</div>`;
        } else if (options.mode === 'numeric' && options.heard) {
            heardHtml = `<div class="recognition-status">○ 数として「<span class="heard-text">${escapeHtml(options.heard)}</span>」と聞き取れました。<div class="mic-note">音声認識だけでは桁読みとの区別ができないため、下の正しい読み方を確認しよう。</div></div>`;
        }

        area.innerHTML = `
            ${heardHtml}
            <strong style="font-size:20px;">読み方のこたえ</strong><br><hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">
            ・${hText}<br>・${tText}<br>・${oText}<br><br>
            <strong>だから、『 <span style="color:#2c3e50; font-size:22px;">${fullRead}</span> 』と読みます。</strong><br>
            <button class="btn-replay" onclick="speakCurrentReading()" ${isSpeechOn ? '' : 'disabled'}>${isSpeechOn ? '🔊 もういちど きく' : '🔇 よみあげOFF'}</button>`;
        document.getElementById('action-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('next-btn').focus({preventScroll:true});
        scrollFeedbackIntoView();
        if (options.autoSpeak && isSpeechOn) setTimeout(() => speakText(fullRead), 180);
    }

    function completeReadingSelfCheck(success) {
        if (currentProblemCompleted) return;
        const box = document.getElementById('reading-selfcheck');
        if (success) {
            recordOutcome('selfchecked');
            if (box) box.innerHTML = '<span class="selfcheck-status">○ 自分で確認できたね。これは★ではなく、自己確認として記録します。</span>';
        } else {
            queueReviewProblem('reading-selfcheck', {dueOffset:2});
            recordOutcome('practice');
            if (box) box.innerHTML = '<span class="selfcheck-status">△ あとでもう一度出します。</span>';
        }
        markProblemComplete();
        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('next-btn').focus({preventScroll:true});
        updateLearningStatus();
    }

    function speakCurrentReading() {
        speakText(getFullReading());
    }

    document.getElementById('next-btn').addEventListener('click', () => playSound('click'));

    const centerFitObserver = new MutationObserver(() => fitCenterFrames());
    const observedExplanation = document.getElementById('explanation-area');
    const observedVisual = document.getElementById('visual-area');
    if (observedExplanation) centerFitObserver.observe(observedExplanation, {childList:true, subtree:true, characterData:true});
    if (observedVisual) centerFitObserver.observe(observedVisual, {childList:true, subtree:true, characterData:true});
    window.addEventListener('resize', fitCenterFrames);

    function isNativeInteractiveTarget(target) {
        if (!target) return false;
        return target.matches('button, input, select, textarea, a, [contenteditable="true"]');
    }

    document.addEventListener('keydown', (e) => {
        // ボタン等にフォーカス中はブラウザ標準操作を優先し、Enterの二重発火を防ぐ
        if (isNativeInteractiveTarget(e.target)) return;

        if (currentTab === 2) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const nextVisible = document.getElementById('next-btn').style.display !== 'none';
                nextVisible ? initProblem() : processAction();
            }
            return;
        }

        const places = ['h','t','o'];
        const idx = places.indexOf(selectedPlace);
        if (/^[0-9]$/.test(e.key)) {
            e.preventDefault();
            setDigit(selectedPlace, Number(e.key), true);
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
            e.preventDefault();
            if (user[selectedPlace] === null && selectedPlace !== 'h') {
                selectPlace(prevPlace(selectedPlace));
            }
            user[selectedPlace] = null;
            updateInputDisplay();
            syncFeedbackAfterEdit();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            selectPlace(places[Math.max(0, idx - 1)]);
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            selectPlace(places[Math.min(2, idx + 1)]);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            adjustDigit(selectedPlace, 1);
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            adjustDigit(selectedPlace, -1);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            const nextVisible = document.getElementById('next-btn').style.display !== 'none';
            nextVisible ? initProblem() : processAction();
        }
    });

    loadSettings();
    initProblem();
</script>

</body>
</html>
